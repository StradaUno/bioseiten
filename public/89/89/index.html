.tip-num{width:22px;height:22px;border-radius:50%;background:var(--text);color:var(--auf-text);display:grid;place-items:center;font-size:var(--t-2xs);font-weight:700;flex-shrink:0;margin-top:1px}
.tip-text{font-size:var(--t-md);color:var(--text);line-height:1.5;flex:1}
.top-posts-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.top-post-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.top-post-row:last-child{border-bottom:none}
.top-post-rank{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:var(--t-2xs);font-weight:700;color:var(--muted);flex-shrink:0}
.top-post-rank.first{background:var(--text);color:var(--auf-text)}
.top-post-body{flex:1;min-width:0}
.top-post-why{font-size:var(--t-sm);color:var(--text);line-height:1.4;margin-bottom:3px}
.top-post-stat{display:flex;align-items:center;gap:5px;font-size:var(--t-sm);color:var(--muted)}
.top-post-arrow{color:var(--subtle);flex-shrink:0}
.empty-state{text-align:center;padding:48px 24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.empty-icon{display:flex;justify-content:center;color:var(--subtle);margin-bottom:var(--s-3)}
.empty-title{font-size:var(--t-lg);font-weight:600;margin-bottom:4px}
.empty-sub{font-size:var(--t-md);color:var(--muted);line-height:1.5;margin-bottom:16px}
.btn-empty{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--text);color:var(--auf-text);border:none;border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-sm);font-weight:600;cursor:pointer}
.btn-share{width:100%;padding:13px;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-md);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.modal-field{margin-bottom:12px}
.modal-label{display:block;font-size:var(--t-xs);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.modal-input-wrap{display:flex;align-items:center;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--bg)}
.modal-prefix{padding:12px 10px 12px 14px;font-size:var(--t-md);color:var(--subtle);background:var(--surface2);border-right:1px solid var(--border-strong);flex-shrink:0}
.modal-input{flex:1;padding:12px 14px;border:none;font-family:inherit;font-size:var(--t-input);color:var(--text);background:var(--bg);outline:none}
.modal-hint{font-size:var(--t-xs);margin-top:4px;min-height:16px;padding-left:2px}
.modal-hint.err{color:var(--red)}
.modal-divider{height:1px;background:var(--border);margin:16px 0}
.modal-btn-confirm:disabled{opacity:.45;cursor:not-allowed}

/* ═══ VIEW: CREATOR NEWS ═══
   Aufbau wie ein Briefing: die Meldung fuehrt, die Handlung steht darunter,
   die Quelle ganz unten. Die Dringlichkeit ist Form, nicht nur Wort — ein
   Streifen links, eine Farbe je Stufe, abgeleitet aus relevance_score.
   Kein Plattform-Filter: bei fuenf Karten pro Woche steht hinter jeder
   Pille eine Karte und hinter manchen keine. */
.view-digest .empty-sub{margin-bottom:0}
.cards-list{padding:var(--s-4) var(--page-x) 0}

.news-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);margin-bottom:10px;cursor:pointer;overflow:hidden;
  transition:border-color .15s;
}
.news-card:hover{border-color:var(--border-strong)}
/* Die Dringlichkeit traegt allein die farbige Zeile ueber der Schlagzeile.
   Ein Streifen an der linken Kante stand hier mal - er hat die Karte
   zerschnitten, ohne mehr zu sagen. */
.news-card.st-jetzt{--stufe:#b03a22}
.news-card.st-bald{--stufe:#8a6114}
.news-card.st-info{--stufe:#3c5fa8}

.news-bild{width:100%;height:132px;object-fit:cover;display:block;background:var(--surface2)}
.news-card.gross .news-bild{height:168px}
.news-inner{padding:14px 16px 13px}
.news-card.gross .news-inner{padding:17px 18px 15px}

.news-stufe{
  display:inline-flex;align-items:center;gap:5px;
  font-size:var(--t-2xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--stufe);margin-bottom:7px;
}
.news-stufe::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.news-headline{font-size:var(--t-lg);font-weight:600;color:var(--text);letter-spacing:-.02em;line-height:1.3;margin:0 0 6px}
.news-card.gross .news-headline{font-size:var(--t-2xl);line-height:1.2}
.news-summary{font-size:var(--t-sm);color:var(--muted);line-height:1.55;margin:0}
.news-card.gross .news-summary{font-size:var(--t-base)}

.news-body{display:none;margin-top:14px}
.news-card.offen .news-body{display:block}
/* Die Handlung steht vor dem Volltext: sie ist der Grund, warum jemand die
   Karte aufklappt — der Artikel ist die Begruendung, nicht die Antwort.
   Faellt weg, wenn die Quelle keinen konkreten Schritt hergibt. */
.card-impact{background:var(--surface2);border-radius:var(--r-sm);padding:11px 13px}
.card-impact-label{display:flex;align-items:center;gap:5px;font-size:var(--t-2xs);font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.card-impact-text{font-size:var(--t-sm);color:var(--text);line-height:1.5;font-weight:500}
.news-full{font-size:var(--t-sm);color:var(--muted);line-height:1.7;white-space:pre-line;margin-top:14px}
.news-full strong{color:var(--text);font-weight:600}
.news-disclaimer{font-size:var(--t-xs);color:var(--subtle);line-height:1.5;margin:12px 0 0;font-style:italic}

.news-actions{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.news-btn{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-sm);font-weight:600;padding:7px 14px;border-radius:var(--r-full);background:var(--surface);font-family:inherit;cursor:pointer;color:var(--muted);border:1px solid var(--border);transition:color .15s,border-color .15s}
.news-btn:hover{color:var(--text);border-color:var(--border-strong)}

/* Fusszeile: Plattform, Quelle, Alter. Zugeklappt reiner Text, aufgeklappt
   der Link zur Meldung — so wird erst beim Lesen angeboten, wegzugehen. */
.news-foot{display:flex;align-items:center;gap:var(--s-2);margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.news-quelle{flex:1;min-width:0;font-size:var(--t-xs);color:var(--subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.news-quelle{display:flex;align-items:center;gap:4px;text-decoration:none;transition:color .15s}
a.news-quelle:hover{color:var(--text)}
/* display:flex wuerde das hidden-Attribut sonst ueberstimmen. */
.news-quelle[hidden]{display:none}
.news-chevron{flex-shrink:0;color:var(--subtle);transition:transform .2s}
.news-card.offen .news-chevron{transform:rotate(180deg)}

/* Einzeiler zum Newsletter - direkt zwischen den Karten anklickbar. */
.nl-line{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);margin-bottom:10px;border:1px dashed var(--border-strong);border-radius:var(--r-md);cursor:pointer;transition:border-color .15s}
.nl-line:hover{border-color:var(--muted)}
.nl-line-check{width:18px;height:18px;flex-shrink:0;accent-color:var(--text);cursor:pointer}
.nl-line-text{font-size:var(--t-sm);color:var(--muted)}
.nl-line:has(.nl-line-check:checked) .nl-line-text{color:var(--text)}

/* Produkt-Hinweis: leiser als eine Meldung, damit klar bleibt, was hier
   die Hauptsache ist. */
.news-hinweis{display:flex;align-items:center;gap:var(--s-3);padding:12px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-md);text-decoration:none;color:inherit;transition:border-color .15s}
.news-hinweis:hover{border-color:var(--border-strong)}
.news-hinweis-icon{width:30px;height:30px;border-radius:var(--r-sm);background:var(--surface2);display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
.news-hinweis-text{flex:1;min-width:0}
.news-hinweis-t{display:block;font-size:var(--t-sm);font-weight:var(--fw-sb);color:var(--text)}
.news-hinweis-u{display:block;font-size:var(--t-xs);color:var(--muted);margin-top:1px}
.news-hinweis-pfeil{flex-shrink:0;color:var(--subtle)}

/* Frueher erschienene Ausgaben. */
.news-frueher{margin-top:var(--s-6)}
.news-frueher-titel{font-size:var(--t-2xs);font-weight:var(--fw-sb);color:var(--subtle);text-transform:uppercase;letter-spacing:.07em;margin-bottom:var(--s-3)}
.news-ausgabe{display:flex;align-items:center;gap:var(--s-3);width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 16px;margin-bottom:10px;font-family:inherit;cursor:pointer;transition:border-color .15s}
.news-ausgabe:hover{border-color:var(--border-strong)}
.news-ausgabe-text{flex:1;min-width:0}
.news-ausgabe-titel{display:block;font-size:var(--t-sm);font-weight:var(--fw-sb);color:var(--text)}
.news-ausgabe-sub{display:block;font-size:var(--t-xs);color:var(--subtle);margin-top:2px}
.news-ausgabe-pfeil{flex-shrink:0;color:var(--subtle);transition:transform .2s}
.news-ausgabe.offen .news-ausgabe-pfeil{transform:rotate(90deg)}

/* ═══ VIEW: ONBOARDING (aus /onboarding/) ═══
   .field und .handle-prefix weichen von der Shell bzw. /profile/ ab
   und sind deshalb auf .view-onboarding begrenzt. */
.view-onboarding .field{margin-bottom:14px}
.view-onboarding .field input,.view-onboarding .field textarea,.view-onboarding .field select{padding:13px 16px;font-size:var(--t-lg);background:var(--surface)}
.view-onboarding .handle-prefix{padding:13px 12px 13px 16px;border:1px solid var(--border-strong);border-right:none;border-radius:var(--r-sm) 0 0 var(--r-sm);font-size:var(--t-lg);color:var(--subtle);background:var(--surface2)}
.handle-prefix-wrap{display:flex}
.handle-prefix-wrap input{border-radius:0 var(--r-sm) var(--r-sm) 0!important}
.ob-wrap{min-height:100dvh;display:flex;flex-direction:column;padding:0 0 calc(40px + var(--safe-bottom))}
.ob-topbar{padding:var(--s-5) var(--page-x) 0;display:flex;align-items:center;justify-content:space-between}
.ob-logo{display:flex;align-items:center;gap:8px}
.ob-logo-mark{width:28px;height:28px;border-radius:var(--r-xs);background:var(--text);color:var(--auf-text);display:grid;place-items:center;font-size:var(--t-sm);font-weight:700}
.ob-logo-text{font-size:16px;font-weight:700;letter-spacing:-.03em}
.ob-step-label{font-size:var(--t-sm);font-weight:500;color:var(--muted)}
.progress-bar{margin:var(--s-5) var(--page-x) 0;height:4px;border-radius:2px;background:var(--surface2)}
.progress-fill{height:100%;border-radius:2px;background:var(--text);transition:width .4s cubic-bezier(.32,.72,0,1)}
.ob-content{flex:1;padding:var(--s-6) var(--page-x) 0}
.step-num{font-size:var(--t-xs);font-weight:700;color:var(--subtle);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.step-title{font-size:26px;font-weight:700;letter-spacing:-.04em;color:var(--text);margin-bottom:6px}
.step-sub{font-size:var(--t-md);color:var(--muted);line-height:1.55;margin-bottom:24px}
.ob-footer{padding:var(--s-5) var(--page-x) 0;display:flex;gap:10px}
.btn-back{flex:0 0 48px;padding:14px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);font-size:20px;cursor:pointer;display:grid;place-items:center}
.btn-next{flex:1;padding:14px;border-radius:var(--r-sm);background:var(--text);color:var(--auf-text);border:none;font-family:inherit;font-size:var(--t-lg);font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-next:disabled{opacity:.4;cursor:not-allowed}
.success-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:40px 24px;text-align:center}
.confetti-area{font-size:48px;margin-bottom:20px}
.success-title{font-size:var(--t-num);font-weight:700;letter-spacing:-.04em;color:var(--text);margin-bottom:10px}
.success-sub{font-size:var(--t-lg);color:var(--muted);line-height:1.6;margin-bottom:32px}
.btn-go-dashboard{padding:14px 28px;border-radius:var(--r-sm);background:var(--text);color:var(--auf-text);border:none;font-family:inherit;font-size:var(--t-lg);font-weight:600;cursor:pointer}
/* Der Wizard ist breiter als die Login-Karte */
#shell.auth-mode.wide #content-area{max-width:560px}
#shell.auth-mode.wide .page{padding:0}

/* ─── TOAST ─── */
.toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; pointer-events: none; }
.toast { background: var(--text); color:var(--auf-text); font-size:var(--t-sm); font-weight: 500; padding: 10px 18px; border-radius:var(--r-full); animation: toastIn .25s ease-out; white-space: nowrap; }
@keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* ─── UTILS ─── */
.skeleton { background: linear-gradient(90deg, var(--surface2) 25%, #e8e6e2 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius:var(--r-xs); }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to{transform:rotate(360deg)} }
.hidden { display: none !important; }
/* ── Media Kit: Chips, optionale Felder, Miniatur ── */
.sheet-optional{font-size:var(--t-2xs);font-weight:var(--fw-md);color:var(--subtle);
  text-transform:none;letter-spacing:0;margin-left:5px}
/* Vorschlaege zum Antippen. Wer "Nutzungsrechte" zum ersten Mal liest, hat
   keine Antwort parat -- drei uebliche Antworten schon. */
.mk-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mk-chip{padding:7px 12px;border-radius:var(--r-full);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--muted);font-family:inherit;font-size:var(--t-xs);
  font-weight:var(--fw-sb);cursor:pointer;min-height:32px}
.mk-chip:hover{border-color:var(--text);color:var(--text)}
/* Gezeichnete Miniatur des Kits. Kein Foto: das alte Vorschaubild lag nicht
   mehr im Speicher und versteckte sich stillschweigend. */
.mk-mini{margin:0 auto;width:196px;background:#FAFAF9;border:1px solid var(--border-strong);
  border-radius:12px;padding:12px 11px;box-shadow:0 4px 16px rgba(0,0,0,.07);overflow:hidden}
.mk-mini-kopf{text-align:center;padding-bottom:10px;border-bottom:1px solid var(--border)}
.mk-mini-avatar{width:34px;height:34px;border-radius:50%;background:var(--text);color:var(--auf-text);
  display:grid;place-items:center;margin:0 auto 6px;font-size:14px;font-weight:var(--fw-b)}
.mk-mini-name{font-size:11px;font-weight:var(--fw-b);letter-spacing:-.02em;color:var(--text)}
.mk-mini-tag{width:44px;height:7px;border-radius:99px;background:var(--surface2);margin:6px auto 0}
.mk-mini-abschnitt{padding-top:9px}
.mk-mini-lbl{width:52px;height:5px;border-radius:99px;background:var(--border-strong);margin-bottom:6px}
.mk-mini-lbl.kurz{width:38px}
.mk-mini-karte{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px}
.mk-mini-drei{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mk-mini-drei span{height:18px;border-radius:4px;background:var(--surface2)}
.mk-mini-posts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mk-mini-posts span{aspect-ratio:4/5;border-radius:5px;background:linear-gradient(135deg,#ddd9d4,#c9c4bd)}
.mk-mini-zeile{height:6px;border-radius:99px;background:var(--surface2)}
.mk-mini-zeile+.mk-mini-zeile{margin-top:5px;width:70%}
.mk-mini-knopf{height:15px;border-radius:5px;background:var(--text);margin-top:11px}

/* ── Media Kit: Alters- und Preisfelder ── */
.mk-alter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk-alter-lbl{padding:11px 0 11px 14px;font-size:var(--t-sm);color:var(--muted);white-space:nowrap}
.mk-preis-zeile{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.mk-preis-zeile:last-child{border-bottom:0}
.mk-preis-name{flex:1;min-width:0;font-size:var(--t-sm);font-weight:var(--fw-sb)}
.mk-preis-felder{display:flex;gap:6px;flex-shrink:0}
.mk-preis-felder .sheet-input-wrap{width:92px}

/* ═══ VIEW: BRAND READY ═══════════════════════════════════════════
   Handlungsliste zuerst, Gewinn statt Verlust. Der Punktestand ist ein
   kleiner Ring, nicht die halbe Seite -- was zaehlt, ist die Liste
   darunter: was bringt wie viele Punkte. Erfuelltes und Unbewertbares
   ruhen eingeklappt am Ende.
   Begruendungen stecken hinter dem ⓘ. Vorher stand unter jeder Zeile ein
   Absatz, und sechzehn Absaetze sind keine Anleitung, sondern eine Wand. */
.br-head{display:flex;align-items:flex-start;gap:12px;padding:var(--s-5) var(--page-x) 0}
.br-head-txt{flex:1;min-width:0}
.br-teilen-btn{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;min-height:36px;padding:0 13px;border-radius:var(--r-sm);background:var(--surface);color:var(--text);border:1px solid var(--border-strong);font-family:inherit;font-size:var(--t-sm);font-weight:var(--fw-sb);cursor:pointer;margin-top:2px}
.br-teilen-btn:hover{border-color:var(--text)}
.br-kopf{display:flex;align-items:center;gap:16px;margin:var(--s-4) var(--page-x) 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);padding:18px}
.br-ring{width:76px;height:76px;flex-shrink:0;position:relative;display:grid;place-items:center}
.br-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.br-ring b{font-size:var(--t-num-sm);font-weight:var(--fw-b);font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.br-kopf-txt{flex:1;min-width:0}
.br-kopf-titel{font-size:var(--t-md);font-weight:var(--fw-sb);letter-spacing:-.015em}
.br-kopf-sub{font-size:var(--t-xs);color:var(--muted);line-height:1.5;margin-top:3px}
.br-saetze{margin:var(--s-3) var(--page-x) 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.br-satz{padding:13px 16px;font-size:var(--t-sm);line-height:var(--lh-body);color:var(--muted)}
.br-satz+.br-satz{border-top:1px solid var(--border)}
/* Der erste Satz ordnet den Stand ein und traegt die Zahl -- er steht
   deshalb in Textfarbe, die zwei Belege darunter ruhiger. */
.br-satz.haupt{color:var(--text);font-weight:var(--fw-md)}
.br-satz b{font-weight:var(--fw-sb);color:var(--text)}
.br-tabs{display:flex;gap:6px;margin:var(--s-3) var(--page-x) 0}
.br-tab{flex:1;min-height:38px;padding:9px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:var(--t-sm);font-weight:var(--fw-sb);cursor:pointer}
.br-tab.aktiv{background:var(--text);color:var(--auf-text);border-color:var(--text)}
/* ⓘ — ein Klick, ein Absatz, sonst Ruhe */
.br-i{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--border-strong);background:none;color:var(--muted);font-size:11px;font-weight:var(--fw-b);font-family:Georgia,'Times New Roman',serif;cursor:pointer;display:inline-grid;place-items:center;flex-shrink:0;line-height:1;padding:0}
.br-i:hover{border-color:var(--text);color:var(--text)}
.br-i.an{background:var(--text);border-color:var(--text);color:var(--auf-text)}
.br-i-txt{display:none;font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin-top:9px;padding:10px 12px;background:var(--surface2);border-radius:var(--r-sm)}
.br-i-txt.auf{display:block}
/* Ja/Nein — gefuellt, sobald geantwortet wurde. Getoente Flaechen waren
   auf dem hellen Grund nicht als Antwort erkennbar. */
.br-wahl{display:flex;gap:5px;flex-shrink:0}
.br-wahl button{min-width:52px;min-height:36px;padding:0 12px;border-radius:var(--r-sm);border:1.5px solid var(--border-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:var(--t-sm);font-weight:var(--fw-sb);cursor:pointer;transition:all .12s}
.br-wahl button:hover{border-color:var(--text);color:var(--text)}
.br-wahl button.ja-an{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 1px 3px rgba(26,127,75,.3)}
.br-wahl button.nein-an{background:var(--text);border-color:var(--text);color:var(--auf-text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.br-zahl{width:70px;min-height:36px;padding:0 10px;border-radius:var(--r-sm);border:1.5px solid var(--border-strong);background:var(--surface);font-family:inherit;font-size:var(--t-input);text-align:center;flex-shrink:0;color:var(--text)}
/* Handlungsliste */
.br-tat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);overflow:hidden}
.br-tat-zeile{display:flex;align-items:flex-start;gap:11px;padding:13px 16px;border-bottom:1px solid var(--border)}
.br-tat-zeile:last-child{border-bottom:0}
.br-gewinn{font-size:var(--t-xs);font-weight:var(--fw-b);color:var(--akzent-text);background:var(--akzent-bg);border:1px solid var(--akzent-border);border-radius:var(--r-xs);padding:4px 8px;white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0;margin-top:1px}
.br-tat-k{flex:1;min-width:0}
.br-tat-name{font-size:var(--t-sm);font-weight:var(--fw-sb);display:flex;align-items:center;gap:8px}
.br-tat-name span{flex:1;min-width:0}
.br-tat-satz{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin-top:3px}
.br-tat-tun{margin-top:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.br-tat-hint{font-size:var(--t-xs);color:var(--subtle)}
.br-knopf{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 13px;border-radius:var(--r-sm);background:var(--text);color:var(--auf-text);border:1px solid var(--text);font-family:inherit;font-size:var(--t-sm);font-weight:var(--fw-sb);text-decoration:none;cursor:pointer}
.br-knopf.leise{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
/* Eingeklapptes */
.br-falt{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.br-falt+.br-falt{margin-top:var(--s-2)}
.br-falt-kopf{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;background:none;border:0;width:100%;font-family:inherit;text-align:left;min-height:48px}
.br-falt-kopf>span{flex:1;font-size:var(--t-sm);font-weight:var(--fw-sb);color:var(--text)}
.br-falt-kopf>em{font-style:normal;font-size:var(--t-xs);color:var(--muted)}
.br-falt-liste{display:none;border-top:1px solid var(--border)}
.br-falt-liste.auf{display:block}
.br-sym{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;margin-top:1px;font-size:11px;font-weight:var(--fw-b);line-height:1}
.br-sym.erfuellt{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-border)}
.br-sym.teilweise{background:var(--orange-bg);color:var(--orange);border:1.5px solid rgba(184,92,0,.25)}
.br-sym.offen{background:var(--red-bg);color:var(--red);border:1.5px solid rgba(192,57,43,.2)}
.br-sym.nicht_bewertbar,.br-sym.hinweis{background:var(--surface2);color:var(--subtle);border:1.5px solid var(--border-strong)}
.br-zeile{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--border)}
.br-zeile:last-child{border-bottom:0}
.br-zeile-k{flex:1;min-width:0}
.br-zeile-kopf{display:flex;align-items:center;gap:8px}
.br-zeile-name{font-size:var(--t-sm);font-weight:var(--fw-sb);flex:1;min-width:0}
.br-zeile-p{font-size:var(--t-sm);font-weight:var(--fw-sb);font-variant-numeric:tabular-nums;white-space:nowrap}
.br-zeile-p.grau{color:var(--subtle);font-weight:var(--fw-md)}
.br-zeile-satz{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin-top:3px}
.br-badge{display:inline-block;margin-top:6px;padding:2px 7px;border-radius:var(--r-full);font-size:var(--t-2xs);font-weight:var(--fw-sb);letter-spacing:.03em}
.br-badge.viuno{background:var(--blue-bg);color:var(--blue)}
.br-badge.eigene_angabe,.br-badge.gemessen{background:var(--surface2);color:var(--muted)}
/* Teilen */
.br-teilen{margin:var(--s-5) var(--page-x) 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:15px 16px}
.br-teilen h2{font-size:var(--t-lg);font-weight:var(--fw-sb);letter-spacing:-.02em;margin:0}
.br-teilen p{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin:6px 0 0}
.br-link-feld{display:flex;gap:8px;margin-top:12px}
.br-link-feld input{flex:1;min-width:0;min-height:36px;padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface2);font-family:inherit;font-size:var(--t-sm);color:var(--text)}
.br-link-meta{font-size:var(--t-xs);color:var(--muted);margin-top:8px;line-height:var(--lh-body)}
.br-link-meta a{color:var(--text);font-weight:var(--fw-sb)}
.br-fuss{padding:var(--s-5) var(--page-x) 0;font-size:var(--t-xs);color:var(--subtle);line-height:var(--lh-body)}
.br-sperr{margin:var(--s-4) var(--page-x) 0;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.br-sperr-titel{font-size:var(--t-lg);font-weight:var(--fw-sb);letter-spacing:-.02em}
.br-sperr-sub{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin-top:6px}

/* ── Vorschau ohne Konto (Launch-Check 15.09.2026) ─────────────────── */
.vs{display:flex;flex-direction:column;gap:var(--s-4)}
.vs-pill{align-self:flex-start;font-size:var(--t-2xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--akzent-text);background:var(--akzent-bg);border:1px solid var(--akzent-border);border-radius:99px;padding:4px 10px}
.vs-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md,18px);box-shadow:var(--sh-card,none);padding:var(--s-5);display:flex;flex-direction:column;gap:var(--s-3)}
.vs-h{font-size:var(--t-2xl,22px);font-weight:700;letter-spacing:-.02em}
.vs-h2{font-size:var(--t-xl,17px);font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.vs-h3{font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin-top:var(--s-1)}
.vs-s{font-size:var(--t-sm);color:var(--muted);line-height:1.55}
.vs-s a{color:var(--text);font-weight:600}
.vs-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2)}
.vs-grid2{display:grid;grid-template-columns:1fr;gap:var(--s-4)}
@media(min-width:600px){.vs-grid2{grid-template-columns:1fr 1fr}}
.vs-tile{background:var(--surface2);border-radius:12px;padding:var(--s-3);min-width:0}
.vs-tile-l{font-size:var(--t-2xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle);margin-bottom:4px}
.vs-tile-d{font-size:var(--t-xs);color:var(--subtle);margin-top:2px}
.vs-gut{color:var(--green)}
.vs-num{font-family:var(--mono,inherit);font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;letter-spacing:-.02em;display:block}
.vs-pill-inline{font-size:var(--t-xs);font-weight:600;background:var(--akzent-bg);color:var(--akzent-text);border-radius:99px;padding:2px 9px}
.vs-pill-inline .vs-num{display:inline;font-size:inherit}
.vs-tag{align-self:flex-start;font-size:var(--t-2xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle);background:var(--surface2);border-radius:99px;padding:3px 8px}
.vs-kern{font-size:var(--t-lg,15px);font-weight:700;line-height:1.35;letter-spacing:-.01em}
.vs-row{display:flex;align-items:center;gap:var(--s-3);width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--border);padding:12px 0;font:inherit;font-size:var(--t-md);color:var(--text);cursor:pointer}
.vs-row:first-of-type{border-top:0}
.vs-row-r{margin-left:auto;font-size:var(--t-xs);color:var(--subtle);white-space:nowrap}
.vs-check{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface2);color:var(--subtle)}
.vs-check-ok{background:var(--green-bg);color:var(--green)}
.vs-check-no{background:var(--red-bg);color:var(--red)}
.vs-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit;font-size:var(--t-md);font-weight:600;text-decoration:none;cursor:pointer}
.vs-btn-p{background:var(--text);color:var(--auf-text);border-color:var(--text)}
.vs-btn-block{width:100%}
.vs-plat{gap:var(--s-2)}
.vs-chips{display:flex;flex-wrap:wrap;gap:6px}
.vs-chips span{font-size:var(--t-xs);font-weight:600;border:1px solid var(--border-strong);border-radius:99px;padding:5px 10px}
.vs-bars{display:flex;align-items:flex-end;gap:6px;height:72px;padding:0 2px}
.vs-bars span{flex:1;border-radius:4px 4px 0 0;background:var(--verlauf)}
.vs-phone{background:var(--verlauf);border-radius:var(--r-md,18px);padding:28px 20px 18px;color:#fff;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.vs-phone-av{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;font-size:28px;font-weight:600}
.vs-phone-n{font-size:18px;font-weight:700;letter-spacing:-.01em}
.vs-phone-b{font-size:var(--t-sm);opacity:.85;max-width:260px;margin-bottom:6px}
.vs-phone-btn{width:100%;max-width:280px;min-height:44px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:var(--t-md);font-weight:500}
.vs-phone-btn-p{background:#fff;color:#1a1025;font-weight:600}
.vs-phone-f{font-size:var(--t-2xs);opacity:.7;margin-top:6px}
.vs-news{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--border);text-decoration:none;color:inherit}
.vs-news:first-child{border-top:0;padding-top:0}
.vs-news-h{font-size:var(--t-lg,15px);font-weight:700;line-height:1.3}
.vs-wand{background:var(--surface);border:1px solid var(--akzent-border);border-radius:var(--r-md,18px);padding:var(--s-5);display:flex;flex-direction:column;gap:var(--s-2);text-align:center;position:relative;overflow:hidden}
.vs-wand::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--verlauf)}
.vs-wand-t{font-size:var(--t-xl,17px);font-weight:700;letter-spacing:-.01em;margin-top:4px}
.vs-wand-s{font-size:var(--t-sm);color:var(--muted);line-height:1.5}
.vs-wand-btns{display:flex;gap:var(--s-2);justify-content:center;flex-wrap:wrap;margin-top:6px}
.vs-wand-n{font-size:var(--t-xs);color:var(--subtle)}
.vs-modal{position:fixed;inset:0;background:rgba(23,21,31,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:2000}
.vs-modal.offen{display:flex}
.vs-modal-card{position:relative;background:var(--surface);border-radius:var(--r-md,18px);padding:26px 22px 22px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:var(--s-2);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.vs-modal-t{font-size:var(--t-xl,17px);font-weight:700;letter-spacing:-.01em}
.vs-modal-s{font-size:var(--t-sm);color:var(--muted);line-height:1.5}
.vs-modal-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:none;font-size:22px;color:var(--subtle);cursor:pointer}

/* ═══════════════════════════════════════════════════════════════
   AUSBAU 1–9 (16.09.2026)
   Heute · Verlauf · Profilcheck · Kooperationen · Preise · Fahrplan

   Keine neuen Farben, keine neuen Groessen: alles kommt aus dem
   Token-Block oben. Neue Zahlenklassen sind unten in die Zahlenregel
   eingetragen — sonst fallen sie stumm auf Inter ohne Tabellenziffern
   zurueck.
   ═══════════════════════════════════════════════════════════════ */

/* ── Wochenbericht ────────────────────────────────────────────── */
.wb{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--sh-card);padding:var(--s-5);margin-bottom:var(--s-4)}
.wb-datum{font-size:var(--t-2xs);font-weight:var(--fw-sb);color:var(--subtle);
  text-transform:uppercase;letter-spacing:.1em}
.wb-gruss{font-size:19px;font-weight:700;letter-spacing:-.03em;margin:var(--s-2) 0 var(--s-3)}
.wb-text{font-size:var(--t-md);color:var(--muted);line-height:var(--lh-body)}
.wb-text b{color:var(--text);font-weight:var(--fw-sb)}
.wb-quelle{font-size:var(--t-2xs);color:var(--subtle);margin-top:var(--s-3);
  padding-top:var(--s-2);border-top:1px solid var(--border);line-height:1.45}

/* ── Aufgaben ─────────────────────────────────────────────────── */
/* Die grosse Aufgabe traegt .fokus, die kleineren .schritt — beide weiter
   unten. Hier bleiben nur die zwei Bausteine, die beide brauchen. */
.auf-offen-vor{font-size:var(--t-sm);color:var(--muted);background:var(--orange-bg);
  border:1px solid rgba(168,99,11,.22);border-radius:var(--r-md);padding:11px 14px;
  margin-bottom:var(--s-3);line-height:var(--lh-body)}
.auf-ziel{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);
  font-weight:var(--fw-sb);color:var(--akzent-text);background:var(--akzent-bg);
  border:1px solid var(--akzent-border);padding:4px 10px;border-radius:var(--r-full);
  text-decoration:none}
/* "Fertig fuer diese Woche" — der Abschluss, den ein Coach auch mal
   aussprechen muss. */
.fertig{text-align:center;padding:var(--s-6) var(--s-4);border:1px dashed var(--border-strong);
  border-radius:var(--r-md);margin-bottom:var(--s-3)}
.fertig .hk{font-size:26px}
.fertig p{margin:var(--s-2) 0 0;font-weight:var(--fw-sb);font-size:var(--t-md)}
.fertig p.meta{font-weight:var(--fw-md);font-size:var(--t-xs);color:var(--subtle);margin-top:4px;
  line-height:var(--lh-body)}

/* ── Score ────────────────────────────────────────────────────── */
.sc-kopf{display:flex;align-items:center;gap:var(--s-4)}
.sc-ring{flex:0 0 84px;height:84px;position:relative}
.sc-zahl{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:700;
  letter-spacing:-.04em}
.sc-txt h3{font-size:var(--t-lg);font-weight:var(--fw-sb);margin:0}
.sc-txt p{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin:3px 0 0}
.sc-saeule{margin-top:var(--s-3)}
.sc-saeule-kopf{display:flex;justify-content:space-between;align-items:baseline;
  font-size:var(--t-sm);font-weight:var(--fw-sb)}
.sc-saeule-wert{font-size:var(--t-sm);color:var(--muted)}
.sc-spur{height:6px;background:var(--surface2);border-radius:var(--r-full);overflow:hidden;margin:5px 0 0}
.sc-spur>div{height:100%;background:var(--verlauf-app);border-radius:var(--r-full)}
.sc-spur.grau>div{background:var(--border-strong)}
.sc-quelle{font-size:var(--t-2xs);color:var(--subtle);margin-top:4px;line-height:1.45}

/* ── Profilcheck-Zeilen ───────────────────────────────────────── */
.pc-zeile{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border)}
.pc-zeile:last-child{border-bottom:none;padding-bottom:0}
.pc-sym{flex:0 0 22px;height:22px;border-radius:7px;display:grid;place-items:center;
  font-size:12px;font-weight:700;margin-top:1px}
.pc-sym.erfuellt{background:var(--green-bg);color:var(--green)}
.pc-sym.teilweise{background:var(--orange-bg);color:var(--orange)}
.pc-sym.offen{background:var(--red-bg);color:var(--red)}
.pc-sym.nicht_bewertbar{background:var(--surface2);color:var(--subtle)}
.pc-txt{flex:1;min-width:0}
.pc-txt b{display:block;font-size:var(--t-md);font-weight:var(--fw-sb)}
.pc-txt span{display:block;font-size:var(--t-xs);color:var(--muted);margin-top:2px;line-height:1.5}
.pc-punkte{flex:none;font-size:var(--t-sm);font-weight:var(--fw-sb);align-self:center;color:var(--subtle)}

/* ── Verlauf ──────────────────────────────────────────────────── */
.vl-svg{width:100%;height:132px;display:block;margin-top:var(--s-2)}
.vl-achse{display:flex;justify-content:space-between;font-size:var(--t-2xs);color:var(--subtle);margin-top:5px}
.vl-zeile{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.vl-zeile:last-child{border-bottom:none}
.vl-punkt{flex:0 0 8px;height:8px;border-radius:var(--r-full);background:var(--surface2);
  border:1px solid var(--border-strong)}
.vl-punkt.analyse{background:var(--v1);border-color:var(--v1)}
.vl-mitte{flex:1;min-width:0;font-size:var(--t-md);font-weight:var(--fw-md)}
.vl-mitte small{display:block;font-size:var(--t-2xs);color:var(--subtle);font-weight:var(--fw-md)}
.vl-rechts{flex:none;text-align:right;font-size:var(--t-md);font-weight:var(--fw-sb)}
.vl-rechts small{display:block;font-size:var(--t-2xs);font-weight:var(--fw-sb)}
.vl-plus{color:var(--green)} .vl-minus{color:var(--red)}

/* ── Kooperationen ────────────────────────────────────────────── */
.ko-zeile{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);
  width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;
  text-align:left;cursor:pointer}
.ko-zeile:last-child{border-bottom:none}
.ko-sym{flex:0 0 32px;height:32px;border-radius:var(--r-xs);display:grid;place-items:center;
  font-size:13px;font-weight:700}
.ko-mitte{flex:1;min-width:0}
.ko-mitte b{display:block;font-size:var(--t-md);font-weight:var(--fw-sb);display:flex;
  align-items:center;gap:6px;flex-wrap:wrap}
.ko-mitte span{display:block;font-size:var(--t-2xs);color:var(--subtle);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ko-wert{flex:none;text-align:right;font-size:var(--t-md);font-weight:var(--fw-sb)}
.ko-wert small{display:block;font-size:9px;color:var(--subtle);font-weight:var(--fw-sb);
  text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.ko-art{font-size:var(--t-2xs);font-weight:var(--fw-sb);padding:2px 7px;border-radius:var(--r-full);
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.ko-art.bezahlt{background:var(--green-bg);color:var(--green)}
.ko-art.link,.ko-art.affiliate{background:var(--akzent-bg);color:var(--akzent-text)}
.ko-art.code{background:var(--orange-bg);color:var(--orange)}
.ko-art.barter,.ko-art.gratis{background:var(--surface2);color:var(--subtle)}
.ko-art.ugc{background:var(--blue-bg);color:var(--blue)}

/* ── Preisrechner ─────────────────────────────────────────────── */
.pr-erg{background:var(--surface);border:1px solid var(--akzent-border);border-radius:var(--r-md);
  box-shadow:var(--sh-card);padding:var(--s-5);text-align:center;margin-bottom:var(--s-3);
  position:relative;overflow:hidden}
.pr-erg::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--verlauf-app)}
.pr-spanne{font-size:28px;font-weight:700;letter-spacing:-.04em;margin:6px 0 4px;
  background:var(--verlauf-app);-webkit-background-clip:text;background-clip:text;color:transparent}
.pr-sub{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body)}
.pr-sub b{color:var(--text);font-weight:var(--fw-sb)}
.pr-rech{background:var(--surface2);border-radius:var(--r-sm);padding:12px 13px}
.pr-rech-zeile{display:flex;justify-content:space-between;gap:12px;font-size:var(--t-sm);
  color:var(--muted);padding:4px 0}
.pr-rech-zeile b{color:var(--text);font-weight:var(--fw-sb)}
.pr-rech-summe{display:flex;justify-content:space-between;gap:12px;font-size:var(--t-md);
  font-weight:700;padding-top:9px;margin-top:5px;border-top:1px solid var(--border-strong)}

/* ── Fahrplan ─────────────────────────────────────────────────── */
.fp{position:relative;padding-left:26px}
.fp::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--surface2)}
.fp-schritt{position:relative;padding:0 0 var(--s-4)}
.fp-schritt:last-child{padding-bottom:0}
.fp-schritt::before{content:'';position:absolute;left:-22px;top:4px;width:12px;height:12px;
  border-radius:var(--r-full);background:var(--surface2);border:2px solid var(--bg)}
.fp-schritt.ok::before{background:var(--green)}
.fp-schritt.jetzt::before{background:var(--v1);box-shadow:0 0 0 4px var(--akzent-bg)}
.fp-t{font-weight:var(--fw-sb);font-size:var(--t-md)}
.fp-schritt.ok .fp-t{color:var(--subtle)}
.fp-s{font-size:var(--t-xs);color:var(--muted);margin-top:2px;line-height:var(--lh-body)}

/* ── Hinweiszeile, ueberall gleich ────────────────────────────── */
.hin{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border:1px solid var(--border);
  border-radius:var(--r-md);font-size:var(--t-sm);line-height:var(--lh-body);margin-bottom:var(--s-2);
  background:var(--surface);color:var(--muted)}
.hin b{color:var(--text);font-weight:var(--fw-sb)}
.hin .hin-i{flex:0 0 20px;height:20px;border-radius:var(--r-full);display:grid;place-items:center;
  color:#fff;font-size:12px;font-weight:700;margin-top:1px;background:var(--subtle)}
.hin.gut{background:var(--green-bg);border-color:var(--green-border)} .hin.gut .hin-i{background:var(--green)}
.hin.warn{background:var(--orange-bg);border-color:rgba(168,99,11,.22)} .hin.warn .hin-i{background:var(--orange)}
.hin.akz{background:var(--akzent-bg);border-color:var(--akzent-border)} .hin.akz .hin-i{background:var(--v1)}

/* ── Herkunft eines Media-Kit-Werts ───────────────────────────── */
.herk{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  padding:1px 6px;border-radius:var(--r-full);display:inline-block;margin-left:6px;vertical-align:1px}
.herk.auto{background:var(--akzent-bg);color:var(--akzent-text)}
.herk.hand{background:var(--surface2);color:var(--subtle)}

/* ── News: „Was bedeutet das für mich?" ───────────────────────── */
.nf-leiste{display:flex;gap:6px;padding:0 var(--page-x) var(--s-3);overflow-x:auto;scrollbar-width:none}
.nf-leiste::-webkit-scrollbar{display:none}
.nf-btn{flex:0 0 auto;padding:6px 12px;border-radius:var(--r-full);border:1px solid var(--border);
  background:var(--surface);font:inherit;font-size:var(--t-sm);color:var(--muted);cursor:pointer;
  white-space:nowrap}
.nf-btn.aktiv{background:var(--akzent-bg);border-color:var(--akzent-border);color:var(--akzent-text);
  font-weight:var(--fw-sb)}
.fd-btn{width:100%;margin-top:10px;padding:10px;border-radius:var(--r-sm);
  border:1px solid var(--akzent-border);background:var(--akzent-bg);color:var(--akzent-text);
  font:inherit;font-size:var(--t-sm);font-weight:var(--fw-sb);cursor:pointer}
.fd-box{margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--akzent-bg);
  border:1px solid var(--akzent-border)}
.fd-kopf{font-size:var(--t-2xs);font-weight:700;color:var(--akzent-text);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:5px}
.fd-box p{margin:0;font-size:var(--t-sm);color:var(--text);line-height:var(--lh-body)}
.fd-box p+p{margin-top:8px}
.fd-weil{font-size:var(--t-2xs);color:var(--muted);margin-top:9px;padding-top:8px;
  border-top:1px solid var(--akzent-border)}

/* ── Teilbare Karte ───────────────────────────────────────────── */
.tk-vorschau{width:100%;border-radius:var(--r-md);display:block;border:1px solid var(--border)}

/* ═══════════════════════════════════════════════════════════════
   HEUTE — die Sprache aus entwurf/D-fokus-1bis9.html

   Eine grosse Karte traegt den Bildschirm, nicht drei gleich laute.
   Der Farbverlauf oben ist die Signatur des Creators und zugleich das
   Einzige, was diese eine Karte von allen anderen unterscheidet.
   ═══════════════════════════════════════════════════════════════ */
.fokus{
  background:var(--surface);border:1px solid var(--akzent-border);
  border-radius:var(--r-lg);box-shadow:var(--sh-card);
  padding:var(--s-5);margin-bottom:var(--s-4);position:relative;overflow:hidden;
}
.fokus::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--verlauf-app)}
.fokus-label{font-size:var(--t-2xs);font-weight:var(--fw-sb);color:var(--akzent-text);
  text-transform:uppercase;letter-spacing:.12em}
.fokus-titel{font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.025em;margin:var(--s-2) 0 10px}
/* Die Begruendung steht IMMER offen. Der Unterschied zwischen viuno und
   einem allgemeinen Tipp ist diese Zahl — versteckt man sie, ist er weg.
   Aufklappbar ist nur die Herleitung. */
.fokus-grund{font-size:var(--t-md);color:var(--muted);line-height:var(--lh-body)}
.warum-knopf{background:none;border:none;font:inherit;font-size:var(--t-sm);
  font-weight:var(--fw-sb);color:var(--akzent-text);cursor:pointer;padding:10px 0 0;display:block}
.fokus-warum{background:var(--surface2);border-radius:var(--r-sm);padding:var(--s-3);
  font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin-top:10px;display:none}
.fokus-warum.auf{display:block}
.fokus-warum b{color:var(--text);font-weight:var(--fw-sb)}
.fokus-fuss{display:flex;gap:10px;align-items:center;margin-top:var(--s-4)}
.fokus-btn{flex:1;min-height:var(--field-h);border:none;border-radius:var(--r-sm);
  background:var(--verlauf-app);color:#fff;font:inherit;font-size:var(--t-md);font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.fokus-btn:active{opacity:.86}
.fokus-ok{flex:0 0 auto;min-height:var(--field-h);padding:0 14px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);
  font:inherit;font-size:var(--t-sm);font-weight:var(--fw-sb);cursor:pointer}

.gute-nachricht{background:var(--green-bg);border:1px solid var(--green-border);
  border-radius:var(--r-md);padding:var(--s-3) var(--s-4);margin-bottom:var(--s-4);
  display:flex;gap:10px;align-items:flex-start}
.gute-nachricht .em{font-size:18px;line-height:1.2}
.gute-nachricht p{margin:0;font-size:var(--t-sm);color:var(--text);line-height:1.5}
.gute-nachricht b{font-weight:700}

/* Drei Kacheln nebeneinander, mittig — dieselben Bausteine wie in der
   Analyse, nur schmaler und zentriert. */
.kpi-grid.drei{grid-template-columns:repeat(3,1fr)}
.kpi-grid.drei .kpi-card{padding:var(--s-3) 10px;text-align:center}
.kpi-grid.drei .kpi-label{font-size:var(--t-2xs);letter-spacing:.06em;margin-bottom:2px}
.kpi-grid.drei .kpi-value{font-size:var(--t-num-sm);line-height:1.15}
.kpi-delta{font-size:var(--t-xs);font-weight:var(--fw-sb);margin-top:2px;color:var(--subtle)}
.kpi-delta.up{color:var(--green)} .kpi-delta.down{color:var(--red)}

/* Alles, was nach der einen Aufgabe kommt, ist eine Zeile, keine Karte. */
.schritt{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-3) 0;
  border-bottom:1px solid var(--border)}
.schritt:last-child{border-bottom:none;padding-bottom:0}
.schritt-icon{flex:0 0 28px;height:28px;border-radius:var(--r-xs);background:var(--surface2);
  display:grid;place-items:center;font-size:14px}
.schritt-text{flex:1;min-width:0}
.schritt-titel{font-size:var(--t-md);font-weight:var(--fw-sb);line-height:var(--lh-tight)}
.schritt-grund{font-size:var(--t-xs);color:var(--muted);margin-top:3px;line-height:1.5}
.schritt-fuss{display:flex;gap:12px;align-items:center;margin-top:7px}
.schritt-link{font-size:var(--t-xs);font-weight:var(--fw-sb);color:var(--akzent-text);text-decoration:none}
.schritt-ok{background:none;border:none;font:inherit;font-size:var(--t-xs);color:var(--subtle);
  cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.schritt.fertig .schritt-titel{text-decoration:line-through;color:var(--subtle)}
.schritt.fertig .schritt-icon{background:var(--green-bg)}

.wb-text{font-size:var(--t-md);color:var(--muted);line-height:var(--lh-body);
  margin:0 0 var(--s-4);max-width:58ch}
.wb-text b{color:var(--text);font-weight:var(--fw-sb)}
.wb-quelle{display:block;font-size:var(--t-2xs);color:var(--subtle);margin-top:10px}

#testband{
  background:var(--text);color:var(--auf-text);font-size:var(--t-2xs);
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  text-align:center;padding:6px 12px;line-height:1.4;
}
#testband a{color:var(--auf-text);text-decoration:underline;text-underline-offset:2px}
</style>
</head>

function icon(name, size = 18, cls = '') {
  return `<svg class="icon${cls?' '+cls:''}" width="${size}" height="${size}" viewBox="0 0 24 24"`

    + ` stroke-linejoin="round" aria-hidden="true">${ICONS[name]||''}</svg>`
}

/* identisch in allen alten Seiten */
function escHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

/* aus /dashboard/ und /analytic/ (dort identisch) */
function fmt(n, digits = 1) {
  if (n == null || n === '' || isNaN(Number(n))) return '–'
  n = Number(n)
  if (n >= 1_000_000) return (n/1_000_000).toFixed(digits).replace(/\.0$/,'') + 'M'
  if (n >= 1_000)     return (n/1_000).toFixed(digits).replace(/\.0$/,'') + 'k'
  return n.toFixed(0)
}

/* aus /profile/: eigene fmt-Variante — Fallback '0' statt '–' und
   unter 1000 lokalisiert statt gerundet. Bewusst getrennt gehalten,
   damit die Profil-Zahlen exakt wie vorher aussehen. */
function fmtCount(n) {
  if (n == null || isNaN(Number(n))) return '0'
  n = Number(n)
  if (n >= 1_000_000) return (n/1_000_000).toFixed(1).replace(/\.0$/,'') + 'M'
  if (n >= 1_000)     return (n/1_000).toFixed(1).replace(/\.0$/,'') + 'k'
  return n.toLocaleString('de-DE')
}

/* aus /biolink/: Fallback '–', unter 1000 unveraendert als String */
function fmtNum(n){if(n==null||isNaN(+n))return'–';n=+n;if(n>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace(/\.0$/,'')+'k';return n.toString()}

/* aus /dashboard/ */
function fmtEuro(n) {
  if (n == null || isNaN(+n)) return '–'
  return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(+n)
}
/* aus /dashboard/: fmtDate — nur Tag und Monat */
function fmtDateShort(d) {
  if (!d) return ''
  return new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
}

const DEFAULT_ROUTE = 'heute'

/* ─────────────────────────────────────────────
   View-Lifecycle
   Jede View bekommt ein ctx: ctx.stale sagt, ob inzwischen
   weitergeklickt wurde (späte Query-Antworten dürfen dann nicht
   mehr ins DOM schreiben), ctx.onCleanup registriert Listener,
   Intervalle und Subscriptions, die beim Verlassen abgeräumt werden.
   ───────────────────────────────────────────── */
let viewToken = 0
let viewCleanups = []

function runCleanups() {
  const fns = viewCleanups
  viewCleanups = []
  for (const fn of fns) { try { fn() } catch (e) { console.warn('cleanup failed', e) } }
}

function makeCtx() {
  const token = ++viewToken
  return {
    get stale() { return token !== viewToken },
    onCleanup(fn) { if (token === viewToken) viewCleanups.push(fn) },
    /* Listener, der sich beim Verlassen der View selbst abmeldet */
    on(target, type, handler, opts) {
      target.addEventListener(type, handler, opts)
      this.onCleanup(() => target.removeEventListener(type, handler, opts))
    },
    /* Intervall, das beim Verlassen der View gestoppt wird */
    interval(fn, ms) {
      const id = setInterval(fn, ms)
      this.onCleanup(() => clearInterval(id))
      return id
    }
  }
}

function currentRoute() {
  const raw = (location.hash || '').replace(/^#\/?/, '').split('?')[0].split('/')[0].trim().toLowerCase()
  return ROUTES[raw] ? raw : null
}

/* ─────────────────────────────────────────────
   ROUTER + Session-Guard
   Regeln (aus /dashboard/ übernommen):
     - keine Session            → #/login
     - Session + onboarding_completed === false → #/onboarding
     - Session + Default        → #/dashboard
   ───────────────────────────────────────────── */
async function router() {
  let name = currentRoute()

  // Ohne Session: öffentliche Routen normal, die Produkt-Routen als Vorschau
  // mit Beispieldaten (Launch-Check 15.09.2026). Profil und Onboarding haben
  // ohne Konto nichts zu zeigen und fuehren weiter zum Login.
  let vorschau = false
  if (!state.session) {
    if (!name || !ROUTES[name].public) {
      if (name && VORSCHAU_ROUTEN.includes(name)) vorschau = true
      else { navigate('#/login'); return }
    }
  } else {
    // Mit Session: Login/Register überspringen
    if (!name || ROUTES[name].public) { navigate('#/' + DEFAULT_ROUTE); return }
    // Profil unvollständig → Onboarding erzwingen
    if (needsOnboarding() && name !== 'onboarding') { navigate('#/onboarding'); return }
  }

  state.route = name
  const route = ROUTES[name]
  const chromeless = route.public || (route.chromeless && !vorschau)

  document.getElementById('shell').classList.toggle('auth-mode', !!chromeless)
  document.getElementById('shell').classList.toggle('wide', !!route.chromeless)
  document.getElementById('topbar-title').textContent = route.title
  document.title = 'viuno · ' + route.title
  setActiveMenuItem(name)
  closeSidebar()
  closeModal()
  document.getElementById('vs-modal')?.classList.remove('offen')

  runCleanups()
  const ctx = makeCtx()

  const area = document.getElementById('content-area')
  area.innerHTML = ''
  window.scrollTo(0, 0)
  if (vorschau) await renderVorschau(area, ctx, name)
  else await route.render(area, ctx)
}

/* ─────────────────────────────────────────────
   Sieben Routen, fuenf Ziele
   BioLink und Media Kit sind dieselbe Sache — die oeffentliche Seite —
   und teilen sich Profil, Kontakt-E-Mail, Nische und den Generator.
   Analyse und Brand Ready haengen beide an analyse_stats; Brand Ready
   zeigt ohne Analyse ohnehin nur die Sperrtafel. Deshalb je ein Tab
   mit Unternavigation statt zwei Eintraege oder ein "Mehr"-Menue.
   ───────────────────────────────────────────── */
/* Vierzehn Routen auf fuenf Ziele. Das Profil haengt bewusst an keinem Tab
   mehr, sondern am Avatar in der Kopfleiste — sonst waeren es sechs, und
   der sechste haette auf einem Telefon keine Beschriftung mehr vertragen.
   Wichtig dabei: der Logout liegt IN der Profil-Ansicht. Als die Seitenleiste
   verschwand, waere er schon einmal beinahe ganz weggefallen. */
const TABS = {
  heute:      'heute',    dashboard:  'heute',
  analytics:  'insights', verlauf:    'insights', brandready: 'insights',
  biolink:    'studio',   mediakit:   'studio',
  koop:       'business', preise:     'business', fahrplan:   'business',
  digest:     'news'
}
const SUBNAVS = {
  insights: [{ route: 'analytics', label: 'Analyse' }, { route: 'verlauf', label: 'Verlauf' }, { route: 'brandready', label: 'Profilcheck' }],
  studio:   [{ route: 'biolink',   label: 'BioLink' }, { route: 'mediakit', label: 'Media Kit' }],
  business: [{ route: 'koop', label: 'Kooperationen' }, { route: 'preise', label: 'Preise' }, { route: 'fahrplan', label: 'Fahrplan' }]
}

function setActiveMenuItem(name) {
  const tab = TABS[name] || null
  document.querySelectorAll('.tab-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab)
  })

  /* Die Unternavigation baut der Router, nicht die View: sonst muesste
     jede der vier Views dieselbe Leiste selbst erzeugen und beim naechsten
     Umbau wuerden drei davon vergessen. */
  const sub = document.getElementById('subnav')
  if (!sub) return
  const eintraege = SUBNAVS[tab]
  sub.innerHTML = !eintraege ? '' : eintraege.map(e =>
    `<a class="subnav-btn${e.route === name ? ' aktiv' : ''}" href="#/${e.route}">${escHtml(e.label)}</a>`
  ).join('')
}

/* Wie in /dashboard/: nur ein explizites false erzwingt Onboarding. */
function needsOnboarding() {
  return state.profile ? state.profile.onboarding_completed === false : false
}

/* ─────────────────────────────────────────────
   Session laden
   ───────────────────────────────────────────── */
async function loadSession() {
  const { data: { session } } = await sb.auth.getSession()
  state.session = session || null
  state.profile = null
  /* Parallel, nicht nacheinander: die Signatur ist eine einzelne Zeile und
     soll den ersten Aufbau nicht um eine zweite Rundreise verzoegern. */
  if (session) await Promise.all([loadProfile(session.user.id), ladeSignatur(session.user.id)])
  paintUser()
  if (session) merkeAktiv(session.user.id)
}

/* users.last_active_at gibt es seit April und war bei jedem Konto leer --
   nichts hat die Spalte je geschrieben. "Wer benutzt die App ueberhaupt
   noch" liess sich damit nicht beantworten, und das ist die Frage, die bei
   Wachstum als erste kommt.

   Hoechstens einmal pro Stunde, sonst schreibt jeder Seitenwechsel. Der
   Zeitstempel im localStorage ist nur die Drossel: geht er verloren, wird
   einmal zu viel geschrieben, mehr nicht. Fehler werden verschluckt -- ein
   fehlgeschlagener Zeitstempel darf den Start der App nicht aufhalten. */
function merkeAktiv(uid) {
  try {
    const schluessel = 'viuno-aktiv-' + uid
    const zuletzt = +(localStorage.getItem(schluessel) || 0)
    if (Date.now() - zuletzt < 3600000) return
    localStorage.setItem(schluessel, String(Date.now()))
  } catch (_) { /* privater Modus: dann eben jedes Mal */ }
  sb.from('users').update({ last_active_at: new Date().toISOString() }).eq('id', uid).then(() => {}, () => {})
}

async function loadProfile(uid) {
  const { data } = await sb.from('users')
    .select('display_name, full_name, profile_image_url, onboarding_completed, subscription_type')
    .eq('id', uid).single()
  state.profile = data || null
}

/* Initiale als Grund, Bild darueber. decoding="async" haelt das Zeichnen
   der Seite nicht auf, wenn die Datei gross ist. */
function avatarInhalt(url, name){
  const initial = escHtml(String(name||'?').trim().charAt(0).toUpperCase() || '?')
  return initial + (url ? `<img src="${escHtml(url)}" alt="" decoding="async">` : '')
}

function paintUser() {
  const av  = document.getElementById('user-avatar')
  const tab = document.getElementById('tab-avatar')
  if (!state.session) { if (av) av.textContent = '?'; if (tab) tab.innerHTML = ''; return }
  const p = state.profile
  const name = p?.display_name || p?.full_name || state.session.user.email || '?'
  const bild = p?.profile_image_url
  if (av) { av.innerHTML = avatarInhalt(bild, name); av.title = name }
  /* Derselbe Avatar noch einmal unten in der Leiste: er ist dort das
     Symbol fuer "Profil" und zugleich der Beleg, welches Foto oeffentlich
     steht — die Frage, die auf dieser Seite am haeufigsten gestellt wird. */
  if (tab) tab.innerHTML = avatarInhalt(bild, name)
}

/* ─────────────────────────────────────────────
   Signaturfarbe
   Die App traegt das Design, das der Creator fuer seine BioLink-Seite
   gewaehlt hat. Faellt die Abfrage aus, bleibt "color" stehen — die App
   ist dann nicht falsch gefaerbt, sondern im Standard.
   ───────────────────────────────────────────── */
async function ladeSignatur(uid) {
  try {
    const { data } = await sb.from('biolink_viuno').select('theme').eq('user_id', uid).maybeSingle()
    const t = data?.theme
    if (t === 'dark' || t === 'clean') document.documentElement.setAttribute('data-thema', t)
    else document.documentElement.removeAttribute('data-thema')
  } catch (e) { /* Standard bleibt stehen */ }
}

    </div>`
    m.addEventListener('click', e => { if (e.target === m) vorschauSperreZu() })
    document.body.appendChild(m)
  }
  document.getElementById('vs-modal-s').textContent = text || 'Kein Abo, keine Grundgebühr — nur die Analyse kostet.'
  m.classList.add('offen')
}

async function renderVorschau(area, ctx, name){
  const demo = name === 'digest' ? '<div class="vs-card" id="vs-news"><div class="vs-s">Lade die aktuelle Ausgabe…</div></div>' : (VS_DEMO[name] ? VS_DEMO[name]() : '')
  area.innerHTML = `<div class="vs">
    <div class="vs-pill">${name === 'digest' ? 'Öffentliche Ausgabe — ohne Konto lesbar' : 'Vorschau mit Beispieldaten'}</div>
    ${demo}
    ${vsWand(name)}
  </div>`
  if (name !== 'digest') return
  /* Die News sind oeffentlich (digest_cards_today ist fuer anon lesbar) --
     hier stehen also echte Karten, keine Beispiele. */
  const { data } = await sb.from('digest_cards_today')
    .select('slug, headline, summary, platform_label, relevance_score').order('relevance_score', { ascending: false }).limit(5)
  if (ctx.stale) return
  const box = document.getElementById('vs-news'); if (!box) return
  if (!data || !data.length) { box.innerHTML = '<div class="vs-s">Diese Woche gibt es noch keine Ausgabe. <a href="/news">Zum Archiv</a></div>'; return }
  box.innerHTML = data.map(k => `<a class="vs-news" href="/news/${encodeURIComponent(k.slug)}">
      <span class="vs-tag">${escHtml(k.platform_label || 'Allgemein')}</span>
      <span class="vs-news-h">${escHtml(k.headline)}</span>
      <span class="vs-s">${escHtml(k.summary || '')}</span>
    </a>`).join('') + '<a class="vs-btn vs-btn-block" href="/news">Alle News lesen</a>'
}

   Angepasst: location.replace('/dashboard') → Hash-Route, damit der
   Router die Onboarding-Weiche ziehen kann.
   ═══════════════════════════════════════════════════════════════ */
function renderLogin(area, ctx) {
  area.innerHTML = `
    <div class="view-auth">
      <div class="logo">
        <div class="logo-mark">v</div>
        <div class="logo-text">viuno</div>
      </div>
      <div class="card">
        <div class="card-title">Willkommen zurück.</div>
        <div class="card-sub">Melde dich mit deinem viuno-Account an.</div>
        <div class="field">
          <label>E-Mail</label>
          <input type="email" id="inp-email" placeholder="du@beispiel.de" autocomplete="email"/>
        </div>
        <div class="field">
          <label>Passwort</label>
          <input type="password" id="inp-pw" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button class="btn-primary" id="btn-login">Einloggen</button>
        <div class="error-msg" id="error-msg"></div>
        <div style="text-align:center;margin-top:14px">
          <a href="/reset-password" style="font-size:13px;color:var(--muted);text-decoration:none">Passwort vergessen?</a>
        </div>
      </div>
      <div class="link-row">
        Noch kein Account? <a href="#/register">Jetzt registrieren</a>
        <br><a href="#/dashboard" style="display:inline-block;margin-top:10px;color:var(--subtle)">Erst mal umsehen →</a>
      </div>
    </div>`

  const emailEl = document.getElementById('inp-email')
  const pwEl    = document.getElementById('inp-pw')
  const btn     = document.getElementById('btn-login')
  const errEl   = document.getElementById('error-msg')

  function showError(msg){ errEl.textContent = msg; errEl.classList.add('show') }
  function hideError(){ errEl.classList.remove('show') }

  async function doLogin(){
    hideError()
    const email = emailEl.value.trim()
    const pw    = pwEl.value
    if(!email||!pw){ showError('Bitte E-Mail und Passwort eingeben.'); return }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw })
    if (ctx.stale) return
    btn.disabled = false; btn.textContent = 'Einloggen'
    if(error){
      if(error.message.includes('Invalid login')||error.message.includes('invalid_credentials')){
        showError('E-Mail oder Passwort falsch.')
      } else if(error.message.includes('Email not confirmed')){
        showError('Bitte bestätige zuerst deine E-Mail-Adresse.')
      } else {
        showError(error.message)
      }
      return
    }
    state.session = data.session
    await loadProfile(data.session.user.id)
    paintUser()
    navigate('#/' + DEFAULT_ROUTE)   // Router schickt ggf. weiter ins Onboarding
  }

  ctx.on(btn, 'click', doLogin)
  ctx.on(pwEl, 'keydown', e => { if(e.key==='Enter') doLogin() })
  ctx.on(emailEl, 'keydown', e => { if(e.key==='Enter') pwEl.focus() })
}

  let selectedNiche = null

  /* Debounce-Timer stoppen, wenn die View verlassen wird */
  ctx.onCleanup(() => clearTimeout(_unameTimer))

  const $ = id => document.getElementById(id)

  function selectNiche(n){
    selectedNiche = n
    document.querySelectorAll('.niche-btn').forEach(b => b.classList.toggle('active', b.dataset.niche === n))
    $('niche-hint').style.display = 'none'
  }

  })

  function onUsernameInput(){
    const val   = $('inp-username').value.trim()
    const hint  = $('username-hint')
    const input = $('inp-username')
    usernameValid = false
    clearTimeout(_unameTimer)

    if(!val){
      hint.textContent = 'Dein öffentlicher Name auf viuno.de'
      hint.className = 'field-hint'
      input.classList.remove('invalid')
      return
    }
    if(!/^[a-zA-Z0-9_]{3,30}$/.test(val)){
      hint.textContent = '3–30 Zeichen, nur Buchstaben, Zahlen und _'
      hint.className = 'field-hint error'
      input.classList.add('invalid')
      return
    }
    // Format ok — check availability after 500ms
    hint.textContent = 'Wird geprüft…'
    hint.className = 'field-hint'
    hint.style.color = 'var(--muted)'
    input.classList.remove('invalid')

    _unameTimer = setTimeout(async () => {
      const { data, error } = await sb.rpc('is_username_available', { p_username: val })
      if (ctx.stale) return
      if(error||!data){
        hint.textContent = 'Fehler beim Prüfen — bitte nochmal versuchen.'
        hint.className = 'field-hint error'
        return
      }
      if(data.available){
        hint.textContent = '✓ Verfügbar!'
        hint.className = 'field-hint'
        hint.style.color = 'var(--green)'
        input.classList.remove('invalid')
        usernameValid = true
      } else {
        const msgs = {
          taken:'Dieser Username ist leider vergeben.',
          reserved:'Dieser Username ist reserviert.',
          invalid_format:'Ungültiges Format.'
        }
        hint.textContent = msgs[data.reason]||'Nicht verfügbar.'

        input.classList.add('invalid')

  ctx.on($('inp-username'), 'input', onUsernameInput)

  function checkPwStrength(){
    const pw = $('inp-pw').value

    if(pw.length<8){ hint.textContent='Zu kurz — mindestens 8 Zeichen.'; hint.className='field-hint error'; return }
    hint.textContent = '✓ Passwort sieht gut aus'
    hint.className = 'field-hint'; hint.style.color = 'var(--green)'

    const pw2      = $('inp-pw2').value

    if(!usernameValid){ showError('Bitte wähle einen verfügbaren Username.'); return }
    if(!email){ showError('Bitte gib deine E-Mail-Adresse ein.'); return }
    if(pw.length<8){ showError('Das Passwort muss mindestens 8 Zeichen lang sein.'); return }
    if(pw!==pw2){ showError('Die Passwörter stimmen nicht überein.'); return }

      $('niche-hint').style.display = 'block'
      $('niche-hint').textContent = 'Bitte wähle eine Nische.'
      $('niche-hint').className = 'field-hint error'
      showError('Bitte wähle deine Nische aus.'); return
    }
    if(!legal){ showError('Bitte akzeptiere AGB und Datenschutzerklärung.'); return }

    const btn = $('btn-register')
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Account wird erstellt…'

    // Final availability check before submit (race condition safety)
    const { data: check } = await sb.rpc('is_username_available', { p_username: username })
    if (ctx.stale) return
    if(!check?.available){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      showError('Dieser Username ist nicht mehr verfügbar. Bitte wähle einen anderen.'); return
    }

    // Sign up
    const { data, error } = await sb.auth.signUp({
      email,
      password: pw,
      options:{
        data:{ display_name: username, niche_category: selectedNiche },
        emailRedirectTo:'https://viuno.de/onboarding'
      }
    })
    if (ctx.stale) return

    if(error){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      if(error.message.includes('already registered')||error.message.includes('already been registered')){
        showError('Diese E-Mail-Adresse ist bereits registriert. Bitte logge dich ein.')
      } else {
        showError(error.message)
      }
      return
    }

    // Update users table (trigger creates the row, we set display_name + niche)
    if(data.user){
      await sb.from('users').update({
        display_name: username,
        niche_category: selectedNiche,
        updated_at: new Date().toISOString()
      }).eq('id', data.user.id)
    }
    if (ctx.stale) return

    // Show success
    btn.disabled = false; btn.textContent = 'Account erstellen'
    $('form-card').style.display = 'none'
    $('login-link').style.display = 'none'
    $('success-email').textContent = email
    $('success-card').classList.add('show')
  }

  ctx.on($('btn-register'), 'click', doRegister)
  ctx.on($('inp-pw2'), 'keydown', e => { if(e.key==='Enter') doRegister() })
}
