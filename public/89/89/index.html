/* 'gesamt' oder eine Plattform. brv.kanal bleibt daneben stehen: das Teilen
   erzeugt weiterhin einen Link JE KANAL, und die Freigabe-Function rechnet
   serverseitig. */
window.brAnsicht = function (wert) {
  if (!brv || brv.ansicht === wert) return
  brv.ansicht = wert
  if (wert !== 'gesamt') brv.kanal = wert
  brZeichnen()
}

window.brAntwort = async function (kriterium, wert) {
  if (!brv) return
  const vorher = brv.angaben[kriterium] || {}
  // Nochmal auf dieselbe Antwort tippen nimmt sie zurueck
  const neu = vorher.wert === wert ? null : wert
  brv.angaben[kriterium] = Object.assign({}, vorher, { wert: neu })
  brZeichnen()
  const { error } = await sb.from('brand_ready_angaben')
    .upsert({ user_id: brv.uid, kriterium, wert: neu, zahl: vorher.zahl ?? null, updated_at: new Date().toISOString() },
            { onConflict: 'user_id,kriterium' })
  if (error) { brv.angaben[kriterium] = vorher; brZeichnen(); showToast('Konnte nicht gespeichert werden') }
}

window.brZahlSpeichern = async function (kriterium, input) {
  if (!brv) return
  const roh = input.value.trim()
  const zahl = roh === '' ? null : Math.max(0, Math.min(32767, parseInt(roh, 10) || 0))
  const vorher = brv.angaben[kriterium] || {}
  brv.angaben[kriterium] = Object.assign({}, vorher, { zahl })
  brZeichnen()
  const { error } = await sb.from('brand_ready_angaben')
    .upsert({ user_id: brv.uid, kriterium, wert: vorher.wert ?? null, zahl, updated_at: new Date().toISOString() },
            { onConflict: 'user_id,kriterium' })
  if (error) { brv.angaben[kriterium] = vorher; brZeichnen(); showToast('Konnte nicht gespeichert werden') }
}

window.brLinkKopieren = function (url) {
  navigator.clipboard?.writeText(url).then(() => showToast('Link kopiert ✓'), () => showToast('Kopieren nicht möglich'))
}

/* Die Freigabe rechnet SERVERSEITIG nach -- der Browser schickt nur den
   Kanal, nie die Punktzahl. Sonst koennte jeder seinen eigenen Stand
   setzen, und auf der geteilten Seite steht "powered by viuno". */
window.brTeilen = async function () {
  if (!brv || !brv.kanal) return
  const knopf = document.getElementById('br-teilen-knopf')
  const ziel  = document.getElementById('br-teilen-ergebnis')
  if (!ziel) return
  const vorhanden = brv.freigaben ? brv.freigaben[brv.kanal] : null
  if (vorhanden) { ziel.innerHTML = brLinkHtml(vorhanden); ziel.scrollIntoView({ behavior: 'smooth', block: 'center' }); return }

  const vorher = knopf ? knopf.innerHTML : ''
  if (knopf) { knopf.disabled = true; knopf.innerHTML = '<span class="spinner"></span> Einen Moment…' }
  try {
    const { data: { session } } = await sb.auth.getSession()
    const res = await fetch(SUPABASE_URL + '/functions/v1/brand-ready-freigeben', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify({ platform: brv.kanal, aktion: 'erzeugen' })
    })
    const d = await res.json()
    if (!d.success) throw new Error(d.error || 'Fehlgeschlagen')
    brv.freigaben = brv.freigaben || {}
    brv.freigaben[brv.kanal] = { token: d.token, expires_at: d.expires_at, aufrufe: d.aufrufe || 0, platform: brv.kanal }
    ziel.innerHTML = brLinkHtml(brv.freigaben[brv.kanal])
    if (knopf) { knopf.innerHTML = SVG_TEILEN_BR + ' Link anzeigen'; knopf.disabled = false }
    const url = location.origin + '/brandready/?b=' + d.token
    if (navigator.share) navigator.share({ title: 'Mein Brand-Ready-Stand', url }).catch(() => {})
  } catch (e) {
    if (knopf) { knopf.innerHTML = vorher; knopf.disabled = false }
    showToast('Link konnte nicht erzeugt werden')
  }
}

window.brLinkZuruecknehmen = async function () {
  if (!brv || !brv.kanal) return
  try {
    const { data: { session } } = await sb.auth.getSession()
    await fetch(SUPABASE_URL + '/functions/v1/brand-ready-freigeben', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify({ platform: brv.kanal, aktion: 'zuruecknehmen' })
    })
    if (brv.freigaben) delete brv.freigaben[brv.kanal]
    brZeichnen()
    showToast('Link zurückgezogen')
  } catch (e) { showToast('Hat nicht geklappt') }
}

/* Datum kurz, ohne Jahr — für Belege und Zeitreihen. */
function grDatum(d) {
  if (!d) return '–'
  return new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
}
function grDatumLang(d) {
  if (!d) return '–'
  return new Date(d).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })
}
/* Montag der laufenden Woche, in Berliner Zeit. Muss mit viuno_woche()
   in der Datenbank übereinstimmen, sonst liest die App eine Woche, die
   die Engine nie geschrieben hat. */
function grWoche(d = new Date()) {
  const berlin = new Date(d.toLocaleString('en-US', { timeZone: 'Europe/Berlin' }))
  const w = (berlin.getDay() + 6) % 7
  berlin.setDate(berlin.getDate() - w)
  return berlin.getFullYear() + '-' +
    String(berlin.getMonth() + 1).padStart(2, '0') + '-' +
    String(berlin.getDate()).padStart(2, '0')
}

/* ═══════════════════════════════════════════════════════════════
   VIEW: HEUTE  — der Montagsbericht

   Drei Dinge, die hier absichtlich so sind:

   1. Die Begründung steht IMMER offen, nie hinter einem Klick. Der
      Unterschied zwischen viuno und einem allgemeinen KI-Tipp ist die
      Zahl darunter.
   2. Höchstens drei Aufgaben, und sind sie erledigt, kommt bis Montag
      nichts nach. Ein Coach, der auch mal sagt, dass es reicht.
   3. Fällt das Sprachmodell aus, steht hier trotzdem ein Text: dann die
      deterministischen Belegsätze. Trockener, aber richtig.
   ═══════════════════════════════════════════════════════════════ */
let hev = null

async function renderHeute(area, ctx) {
  const uid = state.session.user.id

  area.innerHTML = `
  <div class="view-heute">
    <div class="page-header">
      <div class="page-title" id="he-titel">Heute</div>
      <div class="page-sub" id="he-datum">${escHtml(grDatumLang(new Date()))}</div>
    </div>
    <div id="he-skeleton" style="padding:16px 20px 0;display:flex;flex-direction:column;gap:10px">
      <div class="skeleton" style="height:120px;border-radius:18px"></div>
      <div class="skeleton" style="height:88px;border-radius:18px"></div>
      <div class="skeleton" style="height:88px;border-radius:18px"></div>
    </div>
    <div id="he-inhalt" class="section" style="padding-bottom:var(--s-8)"></div>
  </div>`

  hev = { uid, ctx, woche: grWoche(), aufgaben: [], signale: [], bericht: null, score: null, news: null }
  ctx.onCleanup(() => { hev = null })

  await heLaden()
}

async function heLaden() {
  const { uid, ctx, woche } = hev
  const vorwoche = grWoche(new Date(Date.now() - 7 * 86400000))

  const [profilQ, aufQ, sigQ, berQ, scoreQ, verlaufQ, newsQ, vorQ] = await Promise.all([
    sb.from('users').select('display_name,full_name').eq('id', uid).single(),
    sb.from('growth_aufgaben').select('*').eq('user_id', uid).eq('woche', woche).order('prioritaet'),
    sb.from('growth_signale').select('beleg,staerke').eq('user_id', uid).eq('woche', woche)
      .order('staerke', { ascending: false }).limit(4),
    sb.from('growth_wochenbericht').select('text').eq('user_id', uid).eq('woche', woche).maybeSingle(),
    sb.rpc('viuno_score'),
    sb.from('kanal_verlauf').select('*').eq('user_id', uid).order('gemessen_am', { ascending: false }).limit(6),
    sb.from('digest_cards_today').select('headline,summary,slug').limit(1),
    sb.from('growth_aufgaben').select('titel').eq('user_id', uid).eq('woche', vorwoche).eq('status', 'abgelaufen'),
  ])
  if (ctx.stale) return

  hev.profil   = profilQ.data || {}
  hev.aufgaben = aufQ.data || []
  hev.signale  = sigQ.data || []
  hev.bericht  = berQ.data?.text || null
  hev.score    = scoreQ.data || null
  hev.verlauf  = verlaufQ.data || []
  hev.news     = (newsQ.data || [])[0] || null
  hev.vorwoche = vorQ.data || []

  /* Wer sich an einem Dienstag anmeldet, hätte bis zum nächsten Montag
     eine leere Startseite. growth_jetzt() stößt die Engine für genau
     dieses Konto an — höchstens einmal pro Woche, und ohne dass die App
     den Vault-Schlüssel je zu sehen bekommt. */
  if (!hev.aufgaben.length && !hev.signale.length) {
    const { data } = await sb.rpc('growth_jetzt')
    if (data?.gestartet) {
      heZeichnen(true)
      setTimeout(() => { if (!ctx.stale) heLaden() }, 6000)
      return
    }
  }
  heZeichnen(false)
}

/* Woher eine Regel ihre Zahl nimmt und ab wann sie ueberhaupt feuern darf.
   Das ist der Inhalt hinter "Wie wir darauf kommen" — nicht ein Abwurf der
   Rohdaten, sondern die Schwelle, gegen die gerechnet wurde. Wer sie liest,
   weiss, warum der Satz dasteht und warum er bei jemand anderem fehlt. */
const GR_REGEL_INFO = {
  gewinner_serie:       'Wir vergleichen jeden Beitrag der letzten 10 Tage mit deinem eigenen Median. Gemeldet wird er ab dem 1,3-Fachen — darunter ist es Schwankung, kein Muster.',
  format_traegt:        'Verglichen werden nur Formate mit mindestens 3 Beiträgen, und erst ab dem 1,25-Fachen. Zwei Bildstrecken gegen 36 Videos ergeben sonst einen Faktor, der beeindruckt und nichts aussagt.',
  ton_traegt:           'Gruppiert nach Ton, mindestens 3 Beiträge je Ton, Median gegen deinen Gesamtmedian ab dem 1,3-Fachen.',
  posting_luecke:       'Der Maßstab ist dein eigener Takt, nicht ein allgemeiner: gemeldet wird erst ab dem Doppelten deines üblichen Abstands und frühestens nach 4 Tagen.',
  wachstum_faellt:      'Dafür braucht es drei Messpunkte. Mit zweien ließe sich nicht sagen, ob es ein Einbruch ist oder der Normalzustand.',
  ausreisser_erklaeren: 'Ein Beitrag mit deiner größten Reichweite und weniger als der halben üblichen Resonanz. Das ist kein starker Beitrag, sondern eine offene Frage.',
  biolink_ungenutzt:    'Erst ab 30 Aufrufen, und nur wenn seit dem ersten gezählten Klick 14 Tage vergangen sind. Sonst stünde dort 3 % statt 44 %, weil die Klicks erst seit Kurzem gezählt werden.',
  koop_deadline:        'Aus dem Abgabedatum, das du bei der Kooperation eingetragen hast. Gemeldet ab fünf Tagen vorher.',
  erste_koop:           'Erst ab 70 % im Profilcheck. Jemanden mit halb fertigem Profil auf Markenansprache zu schicken, wäre ein schlechter Rat.',
  profil_kontakt:       'Ohne Kontakt-E-Mail rendert deine BioLink-Seite den Kontaktknopf gar nicht erst.',
  profil_mediakit:      'Gemessen an users.mediakit_active und daran, wann die Zahlen zuletzt nachgeführt wurden.',
  profil_preise:        'Gezählt werden Angebote mit hinterlegtem Preis in deinem Media Kit.',
  profil_biolink:       'Gemessen an users.bio_active.',
  profil_impressum:     'Bei geschäftlicher Nutzung ist ein Impressum Pflicht (§ 5 DDG).',
  profil_referenzen:    'Gezählt werden die Marken, die in deinem Media Kit als Referenz stehen.',
  profil_bio:           'Gemessen wird die Bio deines KANALS, nicht die deiner viuno-Seite — das ist der Text, den eine Marke liest.',
}

function heZeichnen(rechnetGerade) {
  document.getElementById('he-skeleton')?.classList.add('hidden')
  const el = document.getElementById('he-inhalt')
  if (!el || !hev) return

  const name   = hev.profil?.display_name || hev.profil?.full_name || ''
  const stunde = new Date().getHours()
  const gruss  = stunde < 11 ? 'Guten Morgen' : stunde < 18 ? 'Hallo' : 'Guten Abend'
  const kopf   = document.getElementById('he-titel')
  const datum  = document.getElementById('he-datum')
  const stichtag = hev.verlauf[0]?.gemessen_am
  if (kopf)  kopf.textContent = gruss + (name ? ', ' + name : '')
  if (datum) datum.textContent = grDatumLang(new Date())
    + (stichtag ? ' · gemessen ' + grDatum(stichtag) : '')

  const offen  = hev.aufgaben.filter(a => a.status === 'offen')
  const fertig = hev.aufgaben.filter(a => a.status === 'erledigt')
  let html = ''

  /* ── Der Wochentext: das Herz, aber keine Karte. Er ist die Stimme,
        nicht ein Kasten neben anderen Kästen. ── */
  html += `<p class="wb-text">${heBerichtHtml(rechnetGerade)}
    ${stichtag ? `<span class="wb-quelle">Alle Zahlen aus der Messung vom ${escHtml(grDatum(stichtag))}.</span>` : ''}</p>`

  /* ── Die gute Nachricht zuerst, wenn es eine gibt ── */
  html += heGuteNachrichtHtml()

  /* ── Drei Zahlen ── */
  html += heZahlenHtml()

  /* ── Rückfrage zur Vorwoche ── */
  if (hev.vorwoche.length) {
    html += `<div class="auf-offen-vor">Von letzter Woche offen geblieben:
      ${escHtml(hev.vorwoche.map(a => a.titel).join(' · '))}</div>`
  }

  /* ── DIE EINE AUFGABE ── */
  if (offen.length) {
    html += heFokusHtml(offen[0], hev.aufgaben.length, fertig.length)
  } else if (hev.aufgaben.length) {
    html += `<div class="fertig"><div class="hk">✓</div>
      <p>Fertig für diese Woche</p>
      <p class="meta">Am Montag schauen wir wieder auf deine Zahlen.
         Bis dahin kommt nichts nach.</p></div>`
  } else if (!rechnetGerade) {
    html += `<div class="hin akz"><span class="hin-i">i</span><div>
      <b>Noch keine Aufgaben.</b> Wir brauchen mindestens eine Messung deines Kanals,
      um etwas zu sagen, das auf deinen Zahlen beruht — und nichts Erfundenes.
      <a href="#/analytics" style="color:var(--akzent-text);font-weight:600">Analyse öffnen</a></div></div>`
  }

  /* ── Was danach kommt, ist eine Zeile, keine zweite grosse Karte ── */
  const rest = hev.aufgaben.filter(a => a.status !== 'verworfen' && a !== offen[0])
  if (rest.length) {
    html += `<div class="bl-karte" style="margin-bottom:var(--s-3)"><div class="bl-teil">
      <div class="section-label">Danach, wenn du magst</div>
      ${rest.map(heSchrittHtml).join('')}
    </div></div>`
  }

  /* ── Score ── */
  if (hev.score?.gesamt != null) {
    const sc = hev.score
    html += `<a class="bl-karte" href="#/brandready" style="display:block;text-decoration:none;margin-bottom:var(--s-3)">
      <div class="bl-teil">
        <div class="bl-kopf" style="margin-bottom:6px">
          <div class="bl-titel">Creator Score</div>
          <div class="bl-meta">${sc.gesamt} / 100</div>
        </div>
        <div class="sc-spur" style="height:8px"><div style="width:${Math.max(2, sc.gesamt)}%"></div></div>
        <div class="sc-quelle" style="margin-top:8px">${escHtml(heScoreSatz(sc))}</div>
      </div></a>`
  }

  /* ── News ── */
  if (hev.news) {
    html += `<a class="bl-karte" href="#/digest" style="display:block;text-decoration:none;margin-bottom:var(--s-3)">
      <div class="bl-teil">
        <div class="section-label">Creator News</div>
        <div class="bl-titel" style="font-size:var(--t-md);line-height:1.35">${escHtml(hev.news.headline || '')}</div>
        <div class="bl-leer" style="padding-top:4px">${escHtml(hev.news.summary || '')}</div>
      </div></a>`
  }

  if (heTeilDaten()) {
    html += `<button class="btn-share" onclick="tkTeilen('woche')">
      ${SVG_TEILEN} Deine Woche teilen</button>`
  }

  el.innerHTML = html
}

/* Die gute Nachricht steht oben und nur dann, wenn es wirklich eine gibt.
   Ein Bildschirm, der jeden Montag jubelt, jubelt nach vier Wochen ins
   Leere. */
function heGuteNachrichtHtml() {
  const v = hev.verlauf
  if (!v.length) return ''
  const neu = v[0]
  const alt = v.find(x => x.plattform === neu.plattform && x.gemessen_am < neu.gemessen_am)
  if (!alt || neu.followers == null || alt.followers == null || neu.handle_gewechselt) return ''
  const d = neu.followers - alt.followers
  if (d <= 0) return ''
  return `<div class="gute-nachricht"><div class="em">🎉</div>
    <p><b>+${escHtml(fmt(d))} Follower auf ${escHtml(dashPlatformLabel(neu.plattform))}.</b>
       Jetzt ${escHtml(fmt(neu.followers))} — gemessen, nicht geschätzt.</p></div>`
}

function heFokusHtml(a, gesamt, fertig) {
  const info = GR_REGEL_INFO[a.regel_id]
  return `<div class="fokus" id="auf-${a.id}">
    <div class="fokus-label">Diese Woche · ${fertig + 1} von ${gesamt}</div>
    <div class="fokus-titel">${escHtml(a.titel)}</div>
    <div class="fokus-grund">${escHtml(a.begruendung)}</div>
    ${info ? `<button class="warum-knopf" onclick="grWarum(this,'w-${a.id}')">Wie wir darauf kommen ↓</button>
      <div class="fokus-warum" id="w-${a.id}">${escHtml(info)}</div>` : ''}
    <div class="fokus-fuss">
      ${a.ziel_route ? `<a class="fokus-btn" href="${escHtml(a.ziel_route)}">Öffnen</a>` : ''}
      <button class="fokus-ok" onclick="grAufgabe(${a.id},'erledigt')">Erledigt ✓</button>
    </div>
  </div>`
}

const GR_SYMBOL = { content: '🎬', profil: '👤', geschaeft: '€' }

function heSchrittHtml(a) {
  const fertig = a.status === 'erledigt'
  return `<div class="schritt${fertig ? ' fertig' : ''}" id="auf-${a.id}">
    <div class="schritt-icon">${fertig ? '✓' : (GR_SYMBOL[a.kategorie] || '·')}</div>
    <div class="schritt-text">
      <div class="schritt-titel">${escHtml(a.titel)}</div>
      <div class="schritt-grund">${escHtml(a.begruendung)}</div>
      <div class="schritt-fuss">
        ${a.ziel_route ? `<a class="schritt-link" href="${escHtml(a.ziel_route)}">Öffnen →</a>` : ''}
        ${fertig
          ? `<button class="schritt-ok" onclick="grAufgabe(${a.id},'offen')">Wieder öffnen</button>`
          : `<button class="schritt-ok" onclick="grAufgabe(${a.id},'erledigt')">Erledigt</button>
             <button class="schritt-ok" onclick="grAufgabe(${a.id},'verworfen')">Passt nicht</button>`}
      </div>
    </div>
  </div>`
}

window.grWarum = function (btn, id) {
  const box = document.getElementById(id)
  if (!box) return
  const auf = box.classList.toggle('auf')
  btn.textContent = auf ? 'Wie wir darauf kommen ↑' : 'Wie wir darauf kommen ↓'
}

/* Der Wochentext. Erste Wahl: das Modell. Fällt es aus, die
   deterministischen Belegsätze — sprachlich trockener, aber richtig.
   Ein Bericht, der am Montag schweigt, wäre schlimmer. */
function heBerichtHtml(rechnetGerade) {
  if (rechnetGerade) return 'Wir rechnen gerade deine Woche durch — einen Moment.'
  if (hev.bericht) return escHtml(hev.bericht).replace(/\n/g, '<br>')
  if (hev.signale.length) return hev.signale.map(s => escHtml(s.beleg)).join(' ')
  return 'Sobald wir deinen Kanal gemessen haben, steht hier, was sich seit der letzten Woche verändert hat.'
}

function heScoreSatz(s) {
  const gezaehlt = (s.saeulen || []).filter(x => x.zustand === 'ok')
  const offen    = (s.saeulen || []).filter(x => x.zustand !== 'ok')
  let t = `${gezaehlt.length} von 4 Säulen sind messbar.`
  if (offen.length) t += ` ${offen.map(x => x.titel).join(' und ')} ${offen.length === 1 ? 'zählt' : 'zählen'} noch nicht mit.`
  return t
}

function heZahlenHtml() {
  const v = hev.verlauf
  if (!v.length) return ''
  const neu = v[0]
  const alt = v.find(x => x.plattform === neu.plattform && x.gemessen_am < neu.gemessen_am)

  const kacheln = []
  if (neu.followers != null) {
    const d = alt?.followers != null && !neu.handle_gewechselt ? neu.followers - alt.followers : null
    kacheln.push({ l: 'Follower', w: fmt(neu.followers),
      s: d == null ? 'gemessen' : (d >= 0 ? '+' : '') + fmt(d),
      k: d == null ? '' : (d >= 0 ? 'up' : 'down') })
  }
  if (neu.avg_views != null) kacheln.push({ l: 'Ø Aufrufe', w: fmt(neu.avg_views), s: 'je Beitrag' })
  if (neu.posts_pro_woche != null) kacheln.push({ l: 'Pro Woche', w: fmt(neu.posts_pro_woche, 1), s: 'Beiträge' })
  if (!kacheln.length) return ''

  return `<div class="kpi-grid drei" style="margin-bottom:var(--s-4)">
    ${kacheln.map(k => `<div class="kpi-card">
      <div class="kpi-label">${escHtml(k.l)}</div>
      <div class="kpi-value">${escHtml(k.w)}</div>
      <div class="kpi-delta ${k.k || ''}">${escHtml(k.s)}</div>
    </div>`).join('')}
  </div>`
}

window.grAufgabe = async function (id, status) {
  if (!hev) return
  const { error } = await sb.rpc('aufgabe_setzen', { p_id: id, p_status: status })
  if (error) { showToast('Hat nicht geklappt'); return }
  const a = hev.aufgaben.find(x => x.id === id)
  if (a) a.status = status
  heZeichnen(false)
  showToast(status === 'erledigt' ? 'Erledigt ✓' : status === 'verworfen' ? 'Kommt so schnell nicht wieder' : 'Wieder offen')
}

/* ═══════════════════════════════════════════════════════════════
   VIEW: VERLAUF

   Die Kurve setzt sich aus zwei Quellen zusammen: dem wöchentlichen Puls
   und den gekauften Analysen. Beide über viuno_verlauf(), damit App und
   Bericht dieselbe Zahl sehen. Der Analysepunkt ist markiert — sonst
   sähe es aus, als hätte viuno schon immer gemessen.
   ═══════════════════════════════════════════════════════════════ */
let vlv = null

async function renderVerlauf(area, ctx) {
  const uid = state.session.user.id
  area.innerHTML = `
  <div class="view-verlauf">
    <div class="page-header">
      <div class="page-title">Verlauf</div>
      <div class="page-sub">Jeden Sonntag gemessen. Ohne Kauf, ohne dein Zutun.</div>
    </div>
    <div id="vl-skeleton" style="padding:16px 20px 0"><div class="skeleton" style="height:200px;border-radius:18px"></div></div>
    <div id="vl-inhalt" class="section" style="padding-bottom:var(--s-8)"></div>
  </div>`

  vlv = { uid, ctx, plattform: null, reihen: [], analysen: [] }
  ctx.onCleanup(() => { vlv = null })

  const [reihenQ, analysenQ] = await Promise.all([
    sb.rpc('viuno_verlauf', { p_tage: 180 }),
    sb.from('analyse_stats').select('id,platform,username,followers,engagement_rate,created_at,analysis_run_id')
      .eq('user_id', uid).order('created_at', { ascending: false }),
  ])
  if (ctx.stale) return

  vlv.reihen   = reihenQ.data || []
  vlv.analysen = analysenQ.data || []
  const plattformen = [...new Set(vlv.reihen.map(r => r.plattform))]
  vlv.plattform = plattformen.includes('instagram') ? 'instagram' : plattformen[0] || null
  vlZeichnen()
}

function vlZeichnen() {
  document.getElementById('vl-skeleton')?.classList.add('hidden')
  const el = document.getElementById('vl-inhalt')
  if (!el || !vlv) return

  const plattformen = [...new Set(vlv.reihen.map(r => r.plattform))]
  const reihe = vlv.reihen.filter(r => r.plattform === vlv.plattform && r.followers != null)
    .sort((a, b) => a.tag.localeCompare(b.tag))

  let html = ''

  if (plattformen.length > 1) {
    html += `<div style="display:flex;gap:6px;margin-bottom:var(--s-3)">${plattformen.map(p =>
      `<button class="nf-btn${p === vlv.plattform ? ' aktiv' : ''}" onclick="vlPlattform('${p}')">${escHtml(dashPlatformLabel(p))}</button>`
    ).join('')}</div>`
  }

  if (reihe.length < 2) {
    html += `<div class="hin akz"><span class="hin-i">i</span><div>
      <b>Noch zu wenig Messpunkte für eine Kurve.</b> viuno misst jeden Sonntag.
      Ab der zweiten Messung steht hier eine Linie — und im Score die Säule „Wachstum".</div></div>`
  } else {
    html += `<div class="bl-karte"><div class="bl-teil">
      <div class="bl-kopf"><div class="bl-titel">Follower · ${escHtml(dashPlatformLabel(vlv.plattform))}</div>
        <div class="bl-meta">${reihe.length} Messungen</div></div>
      ${vlKurveHtml(reihe)}
      <div class="bl-leer" style="padding-top:10px">Von <b>${escHtml(fmt(reihe[0].followers))}</b>
        auf <b>${escHtml(fmt(reihe[reihe.length - 1].followers))}</b> seit dem ${escHtml(grDatum(reihe[0].tag))}.
        Der ausgefüllte Punkt ist eine vollständige Analyse, die kleinen sind der wöchentliche Puls.</div>
    </div></div>`
  }

  /* ── Messungen als Liste ────────────────────────────────────── */
  const liste = vlv.reihen.filter(r => r.plattform === vlv.plattform)
    .sort((a, b) => b.tag.localeCompare(a.tag)).slice(0, 14)
  if (liste.length) {
    html += `<div class="section-header" style="margin-top:var(--s-6)"><div class="section-title">Messungen</div></div>
      <div class="bl-karte"><div class="bl-teil">`
    liste.forEach((r, i) => {
      const vor = liste[i + 1]
      const d = vor && vor.followers != null && r.followers != null ? r.followers - vor.followers : null
      html += `<div class="vl-zeile">
        <span class="vl-punkt${r.quelle === 'analyse' ? ' analyse' : ''}"></span>
        <span class="vl-mitte">${escHtml(grDatum(r.tag))}<small>${r.quelle === 'analyse' ? 'Vollständige Analyse' : 'Puls'}</small></span>
        <span class="vl-rechts">${escHtml(fmt(r.followers))}
          ${d == null ? '' : `<small class="${d >= 0 ? 'vl-plus' : 'vl-minus'}">${d >= 0 ? '+' : ''}${escHtml(fmt(d))}</small>`}</span>
      </div>`
    })
    html += `</div></div>`
  }

  /* ── Archiv: frühere Auswertungen ───────────────────────────── */
  if (vlv.analysen.length) {
    html += `<div class="section-header" style="margin-top:var(--s-6)"><div class="section-title">Frühere Auswertungen</div></div>
      <div class="bl-karte"><div class="bl-teil">
      ${vlv.analysen.map((a, i) => `<div class="vl-zeile">
        <span class="vl-punkt analyse"></span>
        <span class="vl-mitte">${escHtml(grDatum(a.created_at))} · ${escHtml(dashPlatformLabel(a.platform))}
          <small>${escHtml(fmt(a.followers))} Follower${a.engagement_rate != null ? ' · ER ' + escHtml(fmt(a.engagement_rate, 1)) + ' %' : ''}</small></span>
        ${i === 0 ? '<span class="ko-art bezahlt">aktuell</span>' : `<a class="section-link" href="#/analytics">lesen ${icon('chevronRight', 13)}</a>`}
      </div>`).join('')}
      </div></div>
      <div class="hin"><span class="hin-i">i</span><div>Alte Auswertungen bleiben lesbar.
        Bisher lagen sie in der Datenbank, waren für dich aber nicht erreichbar.</div></div>`
  }

  el.innerHTML = html
}

window.vlPlattform = function (p) { if (vlv) { vlv.plattform = p; vlZeichnen() } }

/* Eine schlichte Linie in SVG. Bewusst ohne Bibliothek: die App lädt
   kein fremdes CDN (Launch-Check 15.09.2026), und eine Linie mit
   Verlaufsfüllung sind zwanzig Zeilen. */
function vlKurveHtml(reihe) {
  const B = 320, H = 120, pad = 6
  const werte = reihe.map(r => r.followers)
  const min = Math.min(...werte), max = Math.max(...werte)
  const spanne = max - min || 1
  const x = i => reihe.length === 1 ? B / 2 : (i / (reihe.length - 1)) * (B - 2) + 1
  const y = v => H - pad - ((v - min) / spanne) * (H - pad * 2 - 8)

  const punkte = reihe.map((r, i) => `${x(i).toFixed(1)},${y(r.followers).toFixed(1)}`).join(' L')
  const flaeche = `M${punkte} L${x(reihe.length - 1).toFixed(1)},${H} L${x(0).toFixed(1)},${H} Z`

  return `<svg class="vl-svg" viewBox="0 0 ${B} ${H}" preserveAspectRatio="none" aria-label="Followerverlauf">
    <defs>
      <linearGradient id="vl-flaeche" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--v1)" stop-opacity=".20"/>
        <stop offset="100%" stop-color="var(--v1)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${flaeche}" fill="url(#vl-flaeche)"/>
    <path d="M${punkte}" fill="none" stroke="var(--v1)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${reihe.map((r, i) => r.quelle === 'analyse'
      ? `<circle cx="${x(i).toFixed(1)}" cy="${y(r.followers).toFixed(1)}" r="3.5" fill="var(--v1)"/>` : '').join('')}
  </svg>
  <div class="vl-achse"><span>${escHtml(grDatum(reihe[0].tag))}</span><span>${escHtml(grDatum(reihe[reihe.length - 1].tag))}</span></div>`
}

function koZeileHtml(d) {
  const sym = { bezahlt: '€', link: '↗', affiliate: '↗', code: '%', barter: '◆', ugc: '▶', gratis: '◇' }[d.art] || '·'
  const wert = d.art === 'barter' ? d.warenwert : d.deal_value
  const unter = [
    d.content_type, d.platform,
    d.code ? 'Code ' + d.code : null,
    d.provision_prozent ? d.provision_prozent + ' %' : null,
    d.nutzungsrechte && d.nutzungsrechte !== 'keine' ? 'Rechte ' + d.nutzungsrechte : null,
    d.deadline ? 'Abgabe ' + grDatum(d.deadline) : null,
  ].filter(Boolean).join(' · ')

  return `<button class="ko-zeile" onclick="koOeffnen('${d.id}')">
    <span class="ko-sym ko-art ${escHtml(d.art || 'gratis')}">${sym}</span>
    <span class="ko-mitte">
      <b>${escHtml(d.brand_name || d.title || 'Ohne Namen')}
        <span class="ko-art ${escHtml(d.art || 'gratis')}">${escHtml(KO_ARTEN[d.art]?.label || d.art || '—')}</span></b>
      <span>${escHtml(unter || '—')}</span>
    </span>
    <span class="ko-wert">${wert ? escHtml(fmtEuro(wert)) : '—'}
      <small>${d.im_mediakit ? 'im Kit' : 'privat'}</small></span>
  </button>`
}

window.koArt = function (art) {
  const f = KO_ARTEN[art]?.felder || []
  const werte = kov?.bearbeite || {}
  document.getElementById('ko-felder').innerHTML = f.map(k => {
    const d = KO_FELDER[k]
    const v = werte[k] ?? ''
    const eingabe = d.t === 'select'
      ? `<select class="sheet-input" id="ko-f-${k}">${d.o.map(o => `<option${o === v ? ' selected' : ''}>${escHtml(o)}</option>`).join('')}</select>`
      : `<input class="sheet-input" id="ko-f-${k}" type="${d.t}" placeholder="${escHtml(d.ph || '')}" value="${escHtml(String(v))}">`
    return `<div class="sheet-field"><label class="sheet-label">${escHtml(d.l)}</label>${eingabe}
      ${d.h ? `<div class="sheet-hint">${escHtml(d.h)}</div>` : ''}</div>`
  }).join('')
}

window.koNeu = function () {
  if (!kov) return
  kov.bearbeite = null
  document.getElementById('ko-sheet-titel').textContent = 'Kooperation eintragen'
  document.getElementById('ko-art').value = 'bezahlt'
  document.getElementById('ko-marke').value = ''
  document.getElementById('ko-kit').checked = true
  koArt('bezahlt')
  openSheet('ko-sheet')
}

window.koOeffnen = function (id) {
  if (!kov) return
  const d = kov.liste.find(x => String(x.id) === String(id))
  if (!d) return
  kov.bearbeite = d
  document.getElementById('ko-sheet-titel').textContent = 'Kooperation bearbeiten'
  document.getElementById('ko-art').value = d.art || 'bezahlt'
  document.getElementById('ko-marke').value = d.brand_name || d.title || ''
  document.getElementById('ko-kit').checked = !!d.im_mediakit
  koArt(d.art || 'bezahlt')
  openSheet('ko-sheet')
}

window.koSpeichern = async function () {
  if (!kov) return
  const art   = document.getElementById('ko-art').value
  const marke = document.getElementById('ko-marke').value.trim()
  if (!marke) { showToast('Bitte gib die Marke an'); return }

  const patch = { user_id: kov.uid, art, brand_name: marke, title: marke,
    im_mediakit: document.getElementById('ko-kit').checked }
  for (const k of KO_ARTEN[art].felder) {
    const el = document.getElementById('ko-f-' + k)
    if (!el) continue
    const roh = String(el.value || '').trim()
    patch[k] = roh === '' ? null : (KO_FELDER[k].t === 'number' ? parseFloat(roh) : roh)
  }

  const btn = event?.target
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>' }

  let fehler
  if (kov.bearbeite) {
    ({ error: fehler } = await sb.from('deals').update(patch).eq('id', kov.bearbeite.id))
  } else {
    ({ error: fehler } = await sb.from('deals').insert(patch))
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Speichern' }
  if (fehler) { showToast('Hat nicht geklappt'); return }

  /* Der Haken wirkt sofort auf die öffentliche Seite: mediakit_brands ist
     die Tabelle, aus der das Media Kit seine Referenzen liest. */
  await koMediakitSpiegeln(marke, patch.im_mediakit)

  closeSheet('ko-sheet')
  showToast('Gespeichert ✓')
  const { data } = await sb.from('deals').select('*').eq('user_id', kov.uid).is('deleted_at', null)
    .order('created_at', { ascending: false })
  if (kov) { kov.liste = data || []; koZeichnen() }
}

async function koMediakitSpiegeln(marke, zeigen) {
  try {
    const { data } = await sb.from('mediakit_brands').select('id,brand_name').eq('user_id', kov.uid)
    const da = (data || []).find(b => (b.brand_name || '').toLowerCase() === marke.toLowerCase())
    if (zeigen && !da)      await sb.from('mediakit_brands').insert({ user_id: kov.uid, brand_name: marke })
    if (!zeigen && da)      await sb.from('mediakit_brands').delete().eq('id', da.id)
  } catch (e) { /* Die Kooperation ist gespeichert; die Referenz ist Beiwerk */ }
}

/* ═══════════════════════════════════════════════════════════════
   VIEW: PREISE

   Bezugsgröße sind die durchschnittlichen AUFRUFE, nicht die Follower.
   Fast alle Rechner am Markt rechnen auf Follower; viuno misst avg_views
   ohnehin, und bei einem kleinen Konto mit hoher Reichweite sagt die
   Followerzahl das Falsche. Die Follower-Rechnung steht trotzdem daneben —
   als Gegenprobe und als Argument im Gespräch.

   Kein Modell rechnet hier mit. Die Bänder stehen in preis_referenz mit
   Quelle und Stand, und beides steht in der Oberfläche.
   ═══════════════════════════════════════════════════════════════ */
let pzv = null

const PZ_FORMATE = [

    </div>

    <div class="section-header"><div class="section-title">Wie das gerechnet ist</div></div>
    <div class="pr-rech">
      ${(data.rechnung || []).map(r => `<div class="pr-rech-zeile">
        <span>${escHtml(r.label)}</span><b>${escHtml(r.wert)}</b></div>`).join('')}
      <div class="pr-rech-summe"><span>Ergebnis</span>

    <div class="hin" style="margin-top:var(--s-3)"><span class="hin-i">i</span><div>

    <button class="btn-save" onclick="pzUebernehmen()">Ins Media Kit übernehmen</button>
    <div class="sheet-hint" style="text-align:center;margin-top:6px">
      Erscheint auf deiner öffentlichen Seite und zählt im Profilcheck als erledigt.</div>

    <button class="btn-share" style="margin-top:var(--s-4)" onclick="tkTeilen('preis')">

/* ═══════════════════════════════════════════════════════════════
   TEILBARE KARTE

   Ein Bild im Story-Format, das man auf Instagram teilen kann. Es trägt
   die eigene Zahl, den Vergleichswert daneben und viuno.de — damit ist es
   zugleich Beleg und Werbung.

   Gezeichnet auf einem Canvas, ohne Bibliothek und ohne fremdes CDN.
   Geteilt über navigator.share mit Datei; wo das fehlt (Desktop), wird
   das Bild heruntergeladen.
   ═══════════════════════════════════════════════════════════════ */
function tkFarbe(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim()
  return v || fallback
}

function tkZeichnen({ oben, zahl, unten, fuss }) {
  const B = 1080, H = 1350
  const c = document.createElement('canvas')
  c.width = B; c.height = H
  const g = c.getContext('2d')

  /* viunos eigener Verlauf, nicht die Signatur des Creators. Die Karte
     wandert in fremde Storys und ist dort Werbung für viuno — mit dem
     Thema "clean" wäre sie ein grauer Kasten. */
  const lauf = g.createLinearGradient(0, 0, B, H)
  lauf.addColorStop(0, tkFarbe('--vi1', '#6b3fe8'))
  lauf.addColorStop(0.55, tkFarbe('--vi2', '#b02a7d'))
  lauf.addColorStop(1, tkFarbe('--vi3', '#c87a08'))
  g.fillStyle = lauf; g.fillRect(0, 0, B, H)

  g.fillStyle = 'rgba(0,0,0,.14)'; g.fillRect(0, 0, B, H)

  const schrift = (px, gew) => `${gew} ${px}px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif`
  g.textAlign = 'center'; g.fillStyle = '#fff'

  g.globalAlpha = .82; g.font = schrift(38, 600)
  tkZeilen(g, oben, B / 2, 300, B - 160, 50)
  g.globalAlpha = 1

  g.font = schrift(180, 800)
  g.fillText(zahl, B / 2, 620)

  g.globalAlpha = .95; g.font = schrift(44, 500)
  tkZeilen(g, unten, B / 2, 740, B - 180, 62)

  g.globalAlpha = .72; g.font = schrift(30, 500)
  tkZeilen(g, fuss || '', B / 2, 1120, B - 200, 44)

  g.globalAlpha = 1; g.font = schrift(34, 700)
  g.fillText('viuno.de', B / 2, 1250)

  return c
}

/* Zeilenumbruch von Hand: canvas kann das nicht. */
function tkZeilen(g, text, x, y, maxBreite, hoehe) {
  const worte = String(text || '').split(' ')
  let zeile = '', zeilen = []
  for (const w of worte) {
    const test = zeile ? zeile + ' ' + w : w
    if (g.measureText(test).width > maxBreite && zeile) { zeilen.push(zeile); zeile = w }
    else zeile = test
  }
  if (zeile) zeilen.push(zeile)
  zeilen.forEach((z, i) => g.fillText(z, x, y + i * hoehe))
}

function heTeilDaten() {
  if (!hev?.verlauf?.length) return null
  const neu = hev.verlauf[0]
  const alt = hev.verlauf.find(x => x.plattform === neu.plattform && x.gemessen_am < neu.gemessen_am)
  if (neu.followers == null) return null
  const d = alt?.followers != null && !neu.handle_gewechselt ? neu.followers - alt.followers : null
  return {
    oben: 'Meine Woche auf ' + dashPlatformLabel(neu.plattform),
    zahl: (d != null ? (d >= 0 ? '+' : '') + fmt(d) : fmt(neu.followers)),
    unten: d != null ? `neue Follower — jetzt ${fmt(neu.followers)}` : `${fmt(neu.followers)} Follower`,
    fuss: 'Gemessen am ' + grDatum(neu.gemessen_am) + ', nicht geschätzt.',
  }
}

window.tkTeilen = async function (art, vorgabe) {
  /* vorgabe erlaubt es, die Karte mit fertigen Werten aufzurufen — gebraucht
     fuer eine Vorschau und zum Nachpruefen, ohne dass eine Ansicht geladen
     sein muss. */
  let daten = vorgabe || null
  if (!daten && art === 'woche') daten = heTeilDaten()
  if (!daten && art === 'score' && brv?.score?.gesamt != null) {
    daten = { oben: 'Mein Creator Score', zahl: String(brv.score.gesamt),
      unten: 'von 100 — aus vier gemessenen Säulen',
      fuss: 'Wachstum, Interaktion, Beständigkeit, Kooperations-Reife.' }
  }
  if (!daten && art === 'preis' && pzv?.letztes?.ok) {
    const d = pzv.letztes
    daten = { oben: 'Mein Richtwert für ' + d.label, zahl: fmtEuro(d.empfehlung),
      unten: `Spanne ${fmtEuro(d.von)} – ${fmtEuro(d.bis)}`,
      fuss: `Gerechnet auf ${fmt(d.avg_views)} Ø-Aufrufe. Orientierung, kein Marktpreis.` }
  }
  if (!daten) { showToast('Dafür fehlen noch Zahlen'); return }

  try {
    const canvas = tkZeichnen(daten)
    /* JPEG statt PNG: die Karte ist ein Farbverlauf, und PNG speichert den
       verlustfrei — gemessen 1.350 kB gegen rund 150 kB. Instagram rechnet
       das Bild ohnehin neu, der Unterschied ist nur die Wartezeit beim
       Teilen. */
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92))
    if (!blob) throw new Error('kein Bild')
    const datei = new File([blob], 'viuno.jpg', { type: 'image/jpeg' })

    if (navigator.canShare?.({ files: [datei] })) {
      await navigator.share({ files: [datei], title: 'viuno' })
      return
    }
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url; a.download = 'viuno.jpg'; a.click()
    setTimeout(() => URL.revokeObjectURL(url), 4000)
    showToast('Bild gespeichert ✓')
  } catch (e) {
    if (e?.name !== 'AbortError') showToast('Teilen hat nicht geklappt')
  }
}

/* ═══════════════════════════════════════════════════════════════
   DARSTELLUNG — hell, dunkel oder wie das Gerät

   Der Dunkelmodus ist ein zweiter Token-Block, kein Umbau: die App
   arbeitet an über 1.600 Stellen mit var(--…), und die sechs harten
   Weisstöne stehen alle auf einem Verlauf, auf Rot oder auf Grün — dort
   ist Weiss in beiden Modi richtig.

   Die Wahl liegt im localStorage und nicht in der Datenbank: sie gehört
   zum Gerät, nicht zum Konto. Wer am Telefon dunkel und am Schreibtisch
   hell will, soll das haben, ohne dass eine Zeile synchronisiert wird.
   ═══════════════════════════════════════════════════════════════ */
const FARBMODUS_LABEL = { auto: 'Wie dein Gerät', hell: 'Immer hell', dunkel: 'Immer dunkel' }
const FARBMODUS_FOLGE = ['auto', 'hell', 'dunkel']

function viunoFarbmodus() {
  try { return localStorage.getItem('viuno-farbmodus') || 'auto' } catch (e) { return 'auto' }
}
function viunoFarbmodusSetzen(wert) {
  try { localStorage.setItem('viuno-farbmodus', wert) } catch (e) { /* privates Fenster */ }
  if (wert === 'auto') document.documentElement.removeAttribute('data-farbmodus')
  else document.documentElement.setAttribute('data-farbmodus', wert)
}
window.pfFarbmodus = function () {
  const jetzt = viunoFarbmodus()
  const naechst = FARBMODUS_FOLGE[(FARBMODUS_FOLGE.indexOf(jetzt) + 1) % FARBMODUS_FOLGE.length]
  viunoFarbmodusSetzen(naechst)
  const el = document.getElementById('pf-farbmodus-sub')
  if (el) el.textContent = FARBMODUS_LABEL[naechst]
  showToast(FARBMODUS_LABEL[naechst])
}

   BOOT

window.router = router   /* onclick="router()" im Fehler-Fallback der Profil-Ansicht */

;(async function init() {

/* Session-Wechsel in einem anderen Tab spiegeln */
