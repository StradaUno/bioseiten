<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>viuno · Testversion</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Die viuno-App: BioLink, Media Kit, Creator News und Analyse für Creator im deutschsprachigen Raum. Kein Abo, keine Grundgebühr — nur die Analyse kostet 9,99 € je Kanal.">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f6f5fa;
  --surface: #ffffff;
  --surface2: #f2f0f8;
  --border: rgba(27,24,38,.09);
  --border-strong: rgba(27,24,38,.16);
  --text: #17151f;
  --muted: #4e4a5e;
  --subtle: #817c92;
  --green: #15784b;
  --green-bg: #eaf4ef;
  --green-border: rgba(21,120,75,.2);
  --red: #c23a31;
  --red-bg: #fbeeed;
  --orange: #a8630b;
  --orange-bg: #fdf3e6;
  --blue: #4338ca;
  --blue-bg: #eef0fd;

  /* ── Signatur ────────────────────────────────────────────────
     Die App traegt den Farbverlauf, den der Creator fuer seine
     BioLink-Seite gewaehlt hat. Gesetzt wird er als data-thema am
     <html> beim Laden der Session; ohne Angabe gilt "color".
     Die Werte sind gegenueber der oeffentlichen Seite abgedunkelt —
     das Orange der Seite ist auf Weiss nicht mehr lesbar.
     ──────────────────────────────────────────────────────────── */
  --v1: #6b3fe8;
  --v2: #b02a7d;
  --v3: #c87a08;
  --akzent-text: #5b32c9;
  --akzent-bg: rgba(107,63,232,.10);
  --akzent-border: rgba(107,63,232,.24);
  --verlauf: linear-gradient(120deg, var(--v1), var(--v2) 55%, var(--v3));

  /* ── viunos eigener Verlauf, den KEIN Thema ueberschreibt ──────────
     Die Signatur bleibt die des Creators: Avatar, Vorschauen, Kacheln
     tragen weiter --verlauf. Aber drei Stellen nicht — die eine Aufgabe
     dieser Woche, ihr Knopf und der Score-Ring.

     Der Grund ist gemessen und nicht Geschmack: wer als BioLink-Thema
     "clean" gewaehlt hat, bekommt --v1..--v3 in Grautoenen. Dann ist das
     wichtigste Bedienelement des Bildschirms ein grauer Knopf auf grauem
     Grund, und die Startseite sieht aus wie ein Formular. Die Signatur
     faerbt, was dem Creator gehoert; die Handlung faerbt viuno. */
  --vi1: #6b3fe8; --vi2: #b02a7d; --vi3: #c87a08;
  --verlauf-app: linear-gradient(120deg, var(--vi1), var(--vi2) 55%, var(--vi3));

  /* ── Spacing: 4er-Raster. Alle Abstaende kommen aus dieser Skala. ── */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;
  --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px;
  --page-x: 20px;            /* horizontaler Seitenrand, ueberall gleich */

  /* ── Typografie: sechs Stufen statt gewachsener Einzelwerte ── */
  --t-2xs: 10px;             /* Micro-Labels, versal        */
  --t-xs:  11px;             /* Meta, Hints                 */
  --t-sm:  13px;             /* Fliesstext, sekundaerer Text */
  --t-md:  14px;             /* Bedienelemente, Listenzeilen */
  --t-lg:  15px;             /* Karten-Ueberschriften        */
  --t-xl:  17px;             /* Sheet- und Modal-Titel       */
  --t-2xl: 22px;             /* Seitentitel                  */
  --t-input: 16px;           /* Eingaben — darunter zoomt iOS beim Fokus */
  --t-num-sm: 21px;          /* kleine Kennzahlen            */
  --t-num: 32px;             /* grosse Kennzahlen            */
  /* Zahlen und Mikro-Label laufen in Inter mit Tabellenziffern.
     Der Grund fuer eine eigene Schrift war nie das Schreibmaschinen-
     Aussehen, sondern die gleiche Ziffernbreite: 18.400 und 19.200 sind
     dann exakt gleich breit, der Unterschied faellt an der Ziffer auf und
     nicht an der Laenge. Genau das leistet font-variant-numeric, ohne dass
     die Zahlen nach Quelltext aussehen. */
  --ziffern: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --lh-tight: 1.35;
  --lh-body: 1.55;
  --fw-md: 500; --fw-sb: 600; --fw-b: 700;

  /* ── Radien: drei Stufen plus Pille ── */
  --r-xs: 9px;               /* kleine Bedienelemente, Thumbnails */
  --r-sm: 11px;              /* Buttons, Inputs, kleine Flaechen */
  --r-md: 18px;              /* Karten                           */
  --r-lg: 22px;              /* Sheets, Modals                   */
  --r-full: 99px;

  /* ── Schatten: bewusst nur zwei ── */
  /* Was AUF einer Flaeche in --text steht. In Hell ist das Weiss, in Dunkel
     wird --text selbst hell — dann waere weisse Schrift unsichtbar. Ohne
     dieses Token haetten 26 Regeln im Dunkelmodus weiss auf hell gezeigt. */
  /* Durchscheinende Flaechen: Kopfleiste, untere Leiste, Overlays.
     Die standen als feste rgba-Werte im Stylesheet — im Dunkelmodus
     blieb die Kopfleiste hell, waehrend die Schrift hell wurde. */
  --glas: rgba(255,255,255,.94);
  --glas-kopf: rgba(246,245,250,.92);
  --glas-voll: rgba(245,244,242,.96);
  --auf-text: #ffffff;
  --auf-text-50: rgba(255,255,255,.5);
  --auf-text-70: rgba(255,255,255,.7);

  --sh-card: 0 2px 10px rgba(27,24,38,.05);
  --sh-over: 0 -6px 28px rgba(27,24,38,.12);

  --field-h: 44px;           /* Touch-Mindesthoehe fuer Eingaben und Buttons */
  --nav-h: 56px;
  --tab-h: 74px;             /* Hoehe der unteren Leiste, ohne Safe Area */
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* Die drei BioLink-Designs als App-Signatur. "color" ist der Standard und
   steht auch in :root, damit die App vor der ersten Antwort nicht farblos ist. */
html[data-thema="dark"] {
  --v1: #3f3a6e; --v2: #6b5ca5; --v3: #9a86c9;
  --akzent-text: #443e78;
  --akzent-bg: rgba(63,58,110,.10);
  --akzent-border: rgba(63,58,110,.24);
}
html[data-thema="clean"] {
  --v1: #2b2a33; --v2: #57545f; --v3: #8a8694;
  --akzent-text: #2b2a33;
  --akzent-bg: rgba(43,42,51,.07);
  --akzent-border: rgba(43,42,51,.18);
}

/* ═══════════════════════════════════════════════════════════════════
   DUNKELMODUS — ein zweiter Token-Block, kein Umbau.

   Das ist der Grund, warum die App seit dem Redesign fast ausschliesslich
   mit var(--…) arbeitet: 1.614 Verwendungen, sechs harte Weisstoene, und
   die stehen alle auf einem Verlauf, auf Rot oder auf Gruen — dort ist
   Weiss in beiden Modi richtig.

   Die Signatur des Creators bleibt erhalten: die drei Themen werden
   aufgehellt, nicht ersetzt. #3f3a6e auf #131119 waere sonst kaum zu
   erkennen, und die Farbe ist seine Wahl, nicht unsere.

   Umgeschaltet wird ueber die Systemeinstellung. Wer es fest will,
   setzt data-farbmodus="hell" oder "dunkel" auf <html> — die beiden
   Regeln darunter greifen dann unabhaengig vom System.
   ═══════════════════════════════════════════════════════════════════ */
@media (prefers-color-scheme: dark) {
  :root:not([data-farbmodus="hell"]) {
    --bg: #131119; --surface: #1c1a24; --surface2: #24222e;
    --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.17);
    --text: #f2f0f7; --muted: #b0abc0; --subtle: #8a85a0;
    --green: #4ec38b; --green-bg: rgba(78,195,139,.12); --green-border: rgba(78,195,139,.28);
    --red: #f08078;   --red-bg: rgba(240,128,120,.12);
    --orange: #e0a54a; --orange-bg: rgba(224,165,74,.12);
    --blue: #9b93f5;  --blue-bg: rgba(155,147,245,.12);
    --v1: #9a74ff; --v2: #e05fa8; --v3: #eeb04a;
    --vi1: #9a74ff; --vi2: #e05fa8; --vi3: #eeb04a;
    --akzent-text: #b096ff; --akzent-bg: rgba(154,116,255,.14); --akzent-border: rgba(154,116,255,.3);
    --glas: rgba(28,26,36,.94); --glas-kopf: rgba(19,17,25,.92); --glas-voll: rgba(19,17,25,.96);
    --auf-text: #17151f; --auf-text-50: rgba(23,21,31,.55); --auf-text-70: rgba(23,21,31,.72);
    --sh-card: 0 2px 10px rgba(0,0,0,.35); --sh-over: 0 -6px 28px rgba(0,0,0,.5);
  }
  html[data-thema="dark"]:not([data-farbmodus="hell"]) {
    --v1: #7b74c9; --v2: #9a8fd6; --v3: #c3b6e8;
    --akzent-text: #a79fe0; --akzent-bg: rgba(123,116,201,.16); --akzent-border: rgba(123,116,201,.34);
  }
  html[data-thema="clean"]:not([data-farbmodus="hell"]) {
    --v1: #6e6b79; --v2: #94909e; --v3: #bdb9c6;
    --akzent-text: #c9c6d1; --akzent-bg: rgba(148,144,158,.16); --akzent-border: rgba(148,144,158,.34);
  }
}

/* Feste Wahl, unabhaengig vom System. */
html[data-farbmodus="dunkel"] {
  --bg: #131119; --surface: #1c1a24; --surface2: #24222e;
  --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.17);
  --text: #f2f0f7; --muted: #b0abc0; --subtle: #8a85a0;
  --green: #4ec38b; --green-bg: rgba(78,195,139,.12); --green-border: rgba(78,195,139,.28);
  --red: #f08078;   --red-bg: rgba(240,128,120,.12);
  --orange: #e0a54a; --orange-bg: rgba(224,165,74,.12);
  --blue: #9b93f5;  --blue-bg: rgba(155,147,245,.12);
  --v1: #9a74ff; --v2: #e05fa8; --v3: #eeb04a;
    --vi1: #9a74ff; --vi2: #e05fa8; --vi3: #eeb04a;
  --akzent-text: #b096ff; --akzent-bg: rgba(154,116,255,.14); --akzent-border: rgba(154,116,255,.3);
  --glas: rgba(28,26,36,.94); --glas-kopf: rgba(19,17,25,.92); --glas-voll: rgba(19,17,25,.96);
  --auf-text: #17151f; --auf-text-50: rgba(23,21,31,.55); --auf-text-70: rgba(23,21,31,.72);
  --sh-card: 0 2px 10px rgba(0,0,0,.35); --sh-over: 0 -6px 28px rgba(0,0,0,.5);
}
html[data-farbmodus="dunkel"][data-thema="dark"] {
  --v1: #7b74c9; --v2: #9a8fd6; --v3: #c3b6e8;
  --akzent-text: #a79fe0; --akzent-bg: rgba(123,116,201,.16); --akzent-border: rgba(123,116,201,.34);
}
html[data-farbmodus="dunkel"][data-thema="clean"] {
  --v1: #6e6b79; --v2: #94909e; --v3: #bdb9c6;
  --akzent-text: #c9c6d1; --akzent-bg: rgba(148,144,158,.16); --akzent-border: rgba(148,144,158,.34);
}

html {
  color-scheme: light dark;
}
html[data-farbmodus="dunkel"] { color-scheme: dark; }
html[data-farbmodus="hell"]   { color-scheme: light; }

html, body {
  background: var(--bg);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  color: var(--text);
  font-size:var(--t-md);
}

/* ── Zahlen ──────────────────────────────────────────────────────
   Jede Kennzahl bekommt Tabellenziffern: gleiche Ziffernbreite heisst,
   dass 18.400 und 19.200 exakt gleich breit sind und der Unterschied an
   der Ziffer auffaellt, nicht an der Laenge. Eine neue Zahlenklasse
   gehoert in diese Liste, sonst laeuft sie mit Proportionalziffern und
   springt beim Aktualisieren.
   ──────────────────────────────────────────────────────────────── */
.dash-card-value, .kpi-value, .stat-box-value, .c-num, .c-big, .bl-wert, .br-gewinn,
.timing-value, .top-post-stat, .chart-val, .cmp-val, .c-cmp-val, .br-zeile-p,
.mk-mini-posts, .bl-uhr-lbl, .c-rang-nr, .tip-num, .step-num, .br-ring b,
/* Ausbau 1-9 (16.09.2026) — ohne diese Zeile fallen die neuen Zahlen
   stumm auf Proportionalziffern zurueck und springen beim Aktualisieren. */
.sc-zahl, .sc-saeule-wert, .vl-rechts, .ko-wert, .pr-spanne, .pc-punkte,
.pr-rech-zeile, .pr-rech-summe, .auf-zaehler, .vl-achse {
  font-family: var(--ziffern);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.03em;
}

/* ─── BOOT ─── */
#boot { min-height: 100dvh; display: grid; place-items: center; }
.boot-spinner { width: 22px; height: 22px; border: 2px solid var(--border-strong); border-top-color: var(--text); border-radius: 50%; animation: spin .6s linear infinite; }

/* ─── SHELL ─── */
#shell { display: none; min-height: 100dvh; }
#shell.visible { display: block; }

/* ─── TOPBAR ───────────────────────────────────────────────────
   Traegt nur noch Titel und Avatar. Das Menue sitzt unten; ein
   Hamburger waere eine zweite Tuer zum selben Raum.
   ─────────────────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--glas-kopf); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 var(--page-x); height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-title { font-size: var(--t-xl); font-weight: 700; letter-spacing: -.03em; }
/* ── Avatare ──────────────────────────────────────────────────────
   Die Initiale liegt IMMER im Container, das Bild darueber. Laedt das
   Bild nicht, bleibt die Initiale stehen -- vorher stand dort entweder
   ein farbiger Verlauf oder (im Profil) loeschte ein onerror das Element
   dauerhaft weg. Grund ist neutral, nicht bunt: ein fehlendes Bild soll
   wie ein fehlendes Bild aussehen und nicht wie Absicht. */
.topbar-avatar { position: relative; width: 32px; height: 32px; border-radius: var(--r-xs); background: var(--surface2); box-shadow: inset 0 0 0 1px var(--border); color: var(--muted); display: grid; place-items: center; font-size:var(--t-sm); font-weight: 700; cursor: pointer; overflow: hidden; flex-shrink: 0; }
.topbar-avatar img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }

/* ─── UNTERNAVIGATION ──────────────────────────────────────────
   Sieben Routen auf fuenf Ziele: BioLink und Media Kit teilen sich
   einen Tab, Analyse und Brand Ready ebenso. Hier wird innerhalb
   des Tabs umgeschaltet. Gefuellt wird die Leiste vom Router, damit
   keine View sie selbst bauen muss.
   ─────────────────────────────────────────────────────────────── */
#subnav:empty { display: none; }
#subnav { display: flex; gap: 6px; padding: var(--s-3) var(--page-x) 0; }
.subnav-btn {
  flex: 1; min-height: 38px; padding: 0 14px; border-radius: var(--r-full);
  border: 1px solid var(--border); background: var(--surface);
  font-family: inherit; font-size: var(--t-sm); font-weight: var(--fw-sb);
  color: var(--muted); cursor: pointer; text-decoration: none;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: var(--sh-card);
}
.subnav-btn.aktiv { background: var(--text); border-color: var(--text); color:var(--auf-text); box-shadow: none; }

/* ─── MAIN ─── */
.main { display: flex; flex-direction: column; min-height: 100dvh; }
.page { flex: 1; padding-bottom: 24px; }
#content-area { min-height: 40dvh; }

/* ─── UNTERE LEISTE ────────────────────────────────────────────
   Fuenf Ziele, keins davon unter "Mehr" versteckt. Der Punkt an
   "News" ist derselbe Wiederkehr-Ausloeser wie vorher in der Sidebar.
   ─────────────────────────────────────────────────────────────── */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  height: calc(var(--tab-h) + var(--safe-bottom));
  padding: 8px 4px var(--safe-bottom);
  background: var(--glas); backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  display: flex;
}
.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  gap: 5px; padding-top: 2px; text-decoration: none;
  color: var(--subtle); font-size: var(--t-2xs); font-weight: var(--fw-sb);
  position: relative; min-width: 0;
}
.tab-item svg { flex-shrink: 0; }
.tab-item.active { color: var(--text); }
.tab-item.active svg { stroke: var(--v1); }
.tab-punkt { position: absolute; top: 0; margin-left: 20px; width: 7px; height: 7px; border-radius: 50%; background: var(--v2); }
.tab-avatar { position: relative; width: 22px; height: 22px; border-radius: 7px; overflow: hidden; background: var(--surface2); box-shadow: inset 0 0 0 1px var(--border); display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--muted); }
.tab-avatar img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
.tab-item.active .tab-avatar { box-shadow: 0 0 0 1.5px var(--v2); }

/* Platz fuer die Leiste — jede Seite endet ueber ihr, nicht darunter. */
#shell:not(.auth-mode) .main { padding-bottom: calc(var(--tab-h) + var(--safe-bottom)); }

/* ─── AUTH MODE (login / register / onboarding: keine Navigation) ─── */
#shell.auth-mode .topbar,
#shell.auth-mode .tabbar,
#shell.auth-mode #subnav { display: none !important; }
/* margin:auto statt align-items:center — zentriert, schneidet aber
   lange Formulare (Register) oben nicht ab */
#shell.auth-mode .page { display: flex; padding: 24px; }
#shell.auth-mode #content-area { margin: auto; width: 100%; max-width: 380px; min-height: 0; }

/* ─── BREITE SCHIRME ───────────────────────────────────────────
   Die App bleibt eine Spalte und waechst nicht in die Breite: sie
   wird auf dem Telefon benutzt, und eine 1200 px breite Kachelwand
   waere ein zweites Layout, das niemand pflegt.
   ─────────────────────────────────────────────────────────────── */
@media (min-width: 720px) {
  .main { max-width: 560px; margin: 0 auto; width: 100%; }
  .tabbar { max-width: 560px; left: 50%; transform: translateX(-50%); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
}
.view-auth .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
.view-auth .logo-mark { width: 36px; height: 36px; border-radius:var(--r-sm); background: var(--verlauf); color: white; display: grid; place-items: center; font-size: 16px; font-weight: 700; }
.view-auth .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -.04em; }
.view-auth .card { background: var(--surface); border: 1px solid var(--border); border-radius:var(--r-lg); padding: 28px 24px; }
.view-auth .card-title { font-size: var(--t-2xl); font-weight: 700; letter-spacing: -.03em; margin-bottom: 4px; }
.view-auth .card-sub { font-size:var(--t-sm); color: var(--muted); margin-bottom: 24px; }
.view-auth .field { margin-bottom: 14px; }
.view-auth .field input { padding: 12px 14px; }
.view-auth .field input.invalid { border-color: var(--red); }
.view-auth .field-hint { font-size:var(--t-xs); color: var(--subtle); margin-top: 5px; }
.view-auth .field-hint.error { color: var(--red); }
.view-auth .btn-primary { width: 100%; padding: 13px; background: var(--text); color:var(--auf-text); border: none; border-radius: var(--r-sm); font-family: inherit; font-size:var(--t-md); font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .15s; }
.view-auth .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.view-auth .error-msg { font-size:var(--t-sm); color: var(--red); background: var(--red-bg); border: 1px solid rgba(192,57,43,.15); border-radius: var(--r-sm); padding: 10px 12px; margin-top: 12px; display: none; }
.view-auth .error-msg.show { display: block; }
.view-auth .link-row { text-align: center; font-size:var(--t-sm); color: var(--muted); margin-top: 20px; }
.view-auth .link-row a { color: var(--text); font-weight: 600; text-decoration: none; }
.view-auth .link-row a:hover { text-decoration: underline; }
.view-auth .section-divider { height: 1px; background: var(--border); margin: 20px 0; }
.view-auth .niche-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.view-auth .niche-btn { padding: 10px 6px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--surface2); font-family: inherit; font-size:var(--t-sm); font-weight: 500; color: var(--muted); cursor: pointer; text-align: center; transition: all .15s; }
.view-auth .niche-btn.active { background: var(--text); color:var(--auf-text); border-color: var(--text); }
.view-auth .legal-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 14px; margin-bottom: 14px; }
.view-auth .legal-check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
.view-auth .legal-check input[type="checkbox"] { width: 18px; height: 18px; margin-top: 1px; flex-shrink: 0; accent-color: var(--text); cursor: pointer; }
.view-auth .legal-check span { font-size:var(--t-sm); color: var(--muted); line-height: 1.55; }
.view-auth .legal-check a { color: var(--text); font-weight: 600; text-decoration: none; }
.view-auth .legal-check a:hover { text-decoration: underline; }
.view-auth .success-state { display: none; flex-direction: column; align-items: center; text-align: center; padding: 40px 24px; }
.view-auth .success-state.show { display: flex; }
.view-auth .success-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--green-bg); color: var(--green); display: grid; place-items: center; font-size:var(--t-num); margin-bottom: 20px; }
.view-auth .success-title { font-size: var(--t-2xl); font-weight: 700; letter-spacing: -.03em; margin-bottom: 8px; }
.view-auth .success-sub { font-size:var(--t-sm); color: var(--muted); line-height: 1.6; max-width: 280px; }
.view-auth .success-email { font-weight: 600; color: var(--text); }
/* iOS-Zoom-Fix wie in /login/ und /register/ — bewusst nur hier */
.view-auth input, .view-auth textarea, .view-auth select { font-size: var(--t-input) !important; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size:var(--t-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
/* Der Name im Loesch-Dialog darf NICHT durch .field label hochgestellt werden:
   die Eingabe wird auf Gross- und Kleinschreibung geprueft, eine hochgestellte
   Vorlage waere damit eine Falle. Eigene Zeile, eigener Stil, Ziffernschrift. */
.pf-loesch-hinweis{text-transform:none;letter-spacing:0;font-size:var(--t-sm);color:var(--muted);margin:-2px 0 8px;line-height:1.5}
.pf-loesch-hinweis b{font-family:var(--ziffern);font-weight:var(--fw-b);color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-xs);padding:1px 6px;white-space:nowrap}
.pf-loesch-warn{min-height:17px;font-size:var(--t-xs);color:var(--red);margin-top:6px}
.field input, .field textarea, .field select { width: 100%; padding: 11px 14px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); font-family: inherit; font-size:var(--t-md); color: var(--text); background: var(--bg); outline: none; transition: border-color .15s; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--text); }
.field textarea { resize: none; line-height: 1.5; }

/* ─── PAGE HEADER / PLACEHOLDER ─── */
.page-header { padding: var(--s-5) var(--page-x) 0; }
.page-title { font-size:var(--t-2xl); font-weight: 700; letter-spacing: -.04em; }
.page-sub { font-size:var(--t-sm); color: var(--muted); margin-top: 3px; }
.section { padding: var(--s-4) var(--page-x) 0; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-title { font-size:var(--t-lg); font-weight: 600; color: var(--text); letter-spacing: -.02em; }
/* Wurde im Dashboard benutzt, war aber nie definiert — rutschte auf den blauen Browser-Standard */
.section-link { font-size: var(--t-sm); font-weight: var(--fw-sb); color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.section-link:hover { color: var(--text); }

/* ─── MODAL (aus /profile/, /biolink/, /mediakit/, /analytics/) ─── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;padding:0}
.modal-backdrop.centered{align-items:center;padding:24px}
.modal-card{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:24px 20px calc(24px + var(--safe-bottom));width:100%;max-height:90dvh;overflow-y:auto}
.modal-backdrop.centered .modal-card{border-radius:var(--r-lg);max-width:400px;margin:0 auto;padding:24px}
.modal-title{font-size:var(--t-xl);font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.modal-sub{font-size:var(--t-sm);color:var(--muted);margin-bottom:20px;line-height:1.5}
.modal-warn{display:flex;align-items:flex-start;gap:7px;background:var(--orange-bg);border:1px solid rgba(184,92,0,.2);border-radius:var(--r-sm);padding:12px 14px;font-size:var(--t-sm);color:var(--orange);line-height:var(--lh-body);margin-bottom:var(--s-4)}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.modal-btn{flex:1;padding:12px;border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-md);font-weight:600;cursor:pointer;border:1px solid var(--border-strong)}
.modal-btn-cancel{background:var(--surface2);color:var(--text)}
.modal-btn-confirm{background:var(--text);color:var(--auf-text);border-color:var(--text)}

/* ═══ VIEW: DASHBOARD (aus /dashboard/) ═══
   Aufbau: Kopf mit Avatar, darunter EINE Hauptzahl mit ihrem Verlauf, dann
   die kleineren Kennzahlen, dann was zu tun ist, dann die News. Pro Bildschirm
   genau eine Hauptsache — vorher standen vier gleich grosse Kacheln neben-
   einander und keine war wichtiger als die andere. */
.dash-kopf{display:flex;align-items:center;gap:12px;padding:var(--s-4) var(--page-x) var(--s-4)}
/* Der Avatar sass hier ein zweites Mal, nur wenige Zentimeter unter dem in
   der Topbar. Einer reicht. */
.dash-kopf-av{position:relative;width:42px;height:42px;border-radius:var(--r-sm);flex-shrink:0;overflow:hidden;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--border);display:grid;place-items:center;color:var(--muted);font-weight:var(--fw-b)}
.dash-kopf-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dash-kopf-txt{flex:1;min-width:0}
.dash-kopf-name{font-size:var(--t-xl);font-weight:var(--fw-b);letter-spacing:-.03em;line-height:1.2}
.dash-kopf-sub{font-size:var(--t-xs);color:var(--subtle);margin-top:3px;font-family:var(--ziffern)}
.dash-live{flex-shrink:0;display:flex;align-items:center;gap:6px;font-family:var(--ziffern);font-size:var(--t-2xs);font-weight:var(--fw-sb);color:var(--green);padding:5px 9px;border-radius:var(--r-full);background:var(--green-bg);border:1px solid var(--green-border)}
.dash-live i{width:5px;height:5px;border-radius:50%;background:var(--green)}
/* Tagessatz aus get_daily_text — bleibt, aber als Zeile, nicht als Karte. */
.dash-satz{padding:0 var(--page-x) var(--s-4);font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body)}

/* Hauptkarte: Zahl, Veraenderung, Verlauf */
.dash-haupt{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);padding:18px;text-decoration:none}
.dash-haupt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dash-chip{font-family:var(--ziffern);font-size:var(--t-sm);font-weight:var(--fw-b);padding:4px 9px;border-radius:var(--r-xs);white-space:nowrap}
.dash-chip.hoch{background:var(--green-bg);color:var(--green)}
.dash-chip.runter{background:var(--red-bg);color:var(--red)}
.dash-chip.neutral{background:var(--surface2);color:var(--muted)}
.dash-spark{margin-top:14px;width:100%;height:68px;display:block}

.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dash-grid-single{grid-template-columns:1fr}

/* Zeilenliste: Brand Ready, Warteschlange. Eine Karte, Zeilen durch Linien
   getrennt — statt einzeln schwebender Kaertchen mit Luecken dazwischen. */
.dash-liste{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);overflow:hidden}
.dash-zeile{display:flex;align-items:center;gap:13px;padding:14px 16px;min-height:60px;text-decoration:none;color:var(--text)}
.dash-zeile+.dash-zeile{border-top:1px solid var(--border)}
.dash-zeile:active{background:var(--bg)}
.dash-zeile-ic{width:36px;height:36px;flex-shrink:0;border-radius:var(--r-sm);background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
/* Die Zeilen sind Links, ihr Inhalt also Spans — ohne display:block laufen
   Titel und Unterzeile in einer Zeile ineinander. */
.dash-zeile-b{flex:1;min-width:0;display:block}
.dash-zeile-t{display:block;font-size:var(--t-md);font-weight:var(--fw-sb);letter-spacing:-.01em;line-height:var(--lh-tight)}
.dash-zeile-s{display:block;font-size:var(--t-xs);color:var(--muted);margin-top:3px;line-height:var(--lh-body)}
.dash-zeile-pfeil{flex-shrink:0;color:var(--subtle);display:grid;place-items:center}
.dash-marke{flex-shrink:0;font-family:var(--ziffern);font-size:var(--t-2xs);font-weight:var(--fw-b);padding:4px 8px;border-radius:var(--r-xs);background:var(--akzent-bg);color:var(--akzent-text);border:1px solid var(--akzent-border)}
.dash-marke.preis{background:var(--surface2);color:var(--muted);border-color:var(--border)}

/* News-Teaser: zwei Schlagzeilen, nicht aufklappbar, fuehrt auf die News-Seite */
.news-teaser{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);text-decoration:none;overflow:hidden}
.news-teaser-datum{font-size:var(--t-xs);color:var(--subtle);margin-bottom:var(--s-2);font-family:var(--ziffern)}
.news-teaser-row{display:block;padding:14px 16px}
.news-teaser-row+.news-teaser-row{border-top:1px solid var(--border)}
.news-teaser-meta{display:flex;align-items:center;gap:var(--s-2);margin-bottom:6px}
.news-teaser-source{font-size:var(--t-xs);color:var(--subtle);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news-teaser-headline{display:block;font-size:var(--t-md);font-weight:var(--fw-sb);color:var(--text);line-height:var(--lh-tight)}

.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);padding:16px 15px;text-decoration:none;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.dash-card:active{background:var(--bg)}
.dash-card-label{font-family:var(--ziffern);font-size:var(--t-2xs);font-weight:var(--fw-sb);color:var(--subtle);text-transform:uppercase;letter-spacing:.1em}
.dash-card-value{font-size:var(--t-num-sm);font-weight:var(--fw-b);color:var(--text);line-height:1.1;margin-top:6px}
.dash-card-sub{font-size:var(--t-xs);color:var(--muted);margin-top:2px}
.dash-platform-badge{font-family:var(--ziffern);font-size:var(--t-2xs);font-weight:var(--fw-b);padding:2px 8px;border-radius:var(--r-full);text-transform:uppercase;letter-spacing:.03em}
.pb-tiktok{background:#eef7fb;color:#0b6f87}.pb-instagram{background:#fbeff5;color:#8e1a4c}.pb-youtube{background:#fdf2ea;color:#a3450b}.pb-meta{background:#eef1fd;color:#2b3fae}.pb-allgemein{background:var(--surface2);color:var(--muted)}

/* ═══ VIEW: PROFIL ═══
   Oben die Aussenansicht — was auf BioLink und Media Kit wirklich steht.
   Darunter die Gruppen als kompakte Zeilen; jede oeffnet ein Sheet, gleiche
   Mechanik wie das Media-Kit-Edit-Menue. Bis 14.09.2026 war das ein einziges
   langes Formular mit einem Sammel-Speichern, in dem oeffentliche und private
   Angaben ununterscheidbar nebeneinander standen. */
.pf-aussen{padding:20px var(--page-x) 0}
.pf-aussen-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pf-aussen-edit{margin-left:auto;font-size:var(--t-xs);font-weight:var(--fw-sb);color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:var(--r-xs)}
.pf-aussen-edit:hover{background:var(--surface2);color:var(--text)}
.pf-karte{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);overflow:hidden}
/* Kopf waagerecht: Foto links, Name daneben. Mittig zentriert stand der
   Name im Leeren, sobald die Bio kurz ist -- und sie ist meistens kurz. */
.pf-karte-top{padding:20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border)}
.pf-av{width:68px;height:68px;border-radius:var(--r-md);flex-shrink:0;position:relative;cursor:pointer;overflow:hidden;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--border);display:grid;place-items:center;color:var(--muted);font-size:25px;font-weight:700}
.pf-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pf-av-btn{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:var(--surface);color:var(--muted);display:grid;place-items:center;border:1px solid var(--border-strong);pointer-events:none}
.pf-ident{flex:1;min-width:0}
.pf-name{font-size:var(--t-2xl);font-weight:var(--fw-b);letter-spacing:-.03em;line-height:1.15}
.pf-handle{font-size:var(--t-xs);color:var(--subtle);margin-top:3px;font-family:var(--ziffern)}
.pf-tag{display:inline-block;margin-top:9px;font-size:var(--t-2xs);font-weight:var(--fw-sb);letter-spacing:.06em;text-transform:uppercase;color:var(--akzent-text);background:var(--akzent-bg);border:1px solid var(--akzent-border);border-radius:var(--r-xs);padding:4px 9px}
.pf-bio{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);padding:14px 20px 0}
.pf-bio.leer{color:var(--subtle);font-style:italic}
.pf-kanaele{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px 18px}

/* Drei Zahlen unter der Karte. Alles daraus liegt schon in der Abfrage --
   total_followers, die Zahl fertiger Analysen und wie viele der beiden
   Seiten live sind. Keine zusaetzliche Rundreise fuer eine Kopfzeile. */
.pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);overflow:hidden;margin-top:10px}
.pf-stat{background:var(--surface);padding:14px 10px;text-align:center}
.pf-stat-v{font-size:var(--t-num-sm);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.pf-stat-k{margin-top:4px;font-size:var(--t-2xs);font-weight:var(--fw-sb);letter-spacing:.09em;text-transform:uppercase;color:var(--subtle)}
.pf-kanal{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:var(--fw-md);color:var(--text);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r-full);padding:5px 12px}
.pf-kanal .icon{color:var(--muted);flex-shrink:0}
.pf-kanal.leer{color:var(--subtle);border-style:dashed;background:transparent}
.pf-mail{font-size:var(--t-xs);color:var(--muted);margin-top:14px}
.pf-mail.leer{color:var(--subtle)}
.pf-hinweis{font-size:var(--t-xs);color:var(--subtle);text-align:center;margin-top:9px;line-height:var(--lh-body)}
.pf-liste{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);overflow:hidden}
/* Die Zeile ist mal ein <button>, mal ein <a> (Legal-Links, die beiden
   Seiten). Ohne color und text-decoration liefen die <a>-Faelle blau und
   unterstrichen aus der Liste heraus. */
.pf-zeile{width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;background:none;border:0;border-bottom:1px solid var(--border);text-align:left;cursor:pointer;min-height:var(--field-h);font-family:inherit;color:var(--text);text-decoration:none}
.pf-zeile:last-child{border-bottom:none}
.pf-zeile:hover{background:var(--bg)}
.pf-zeile-t{flex:1;min-width:0;display:block}
.pf-zeile-label{display:block;font-size:var(--t-md);color:var(--text)}
.pf-zeile-sub{display:block;font-size:var(--t-xs);color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:var(--lh-body)}
.pf-badge{font-size:var(--t-2xs);font-weight:var(--fw-sb);padding:3px 8px;border-radius:var(--r-full);flex-shrink:0}
.pf-badge.ok{background:var(--green-bg);color:var(--green)}
.pf-badge.offen{background:var(--orange-bg);color:var(--orange)}
.pf-pfeil{color:var(--subtle);flex-shrink:0}
.pf-zeile.gefahr .pf-zeile-label{color:var(--red)}
.pf-fuss{font-size:var(--t-xs);color:var(--subtle);margin-top:8px;line-height:var(--lh-body)}
.pf-regen{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 13px;border-radius:var(--r-sm);background:var(--blue-bg);color:var(--blue);font-size:var(--t-xs);line-height:var(--lh-body)}
.pf-regen.fehler{background:var(--orange-bg);color:var(--orange)}
.pf-regen button{background:none;border:0;color:inherit;font-family:inherit;font-size:var(--t-xs);font-weight:var(--fw-sb);text-decoration:underline;cursor:pointer;padding:0;margin-left:auto;flex-shrink:0}
.pf-note{padding:12px 14px;margin:0 20px 12px;border-radius:var(--r-sm);background:var(--blue-bg);color:var(--blue);font-size:var(--t-xs);line-height:var(--lh-body)}
.pf-schalter{position:relative;width:44px;height:26px;border-radius:var(--r-full);background:var(--border-strong);border:none;cursor:pointer;flex-shrink:0;transition:background .15s}
.pf-schalter::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.pf-schalter.an{background:var(--green)}
.pf-schalter.an::after{transform:translateX(18px)}
.pf-schalter:disabled{opacity:.5}
.section-label{font-size:var(--t-2xs);font-weight:600;color:var(--subtle);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.edit-card .field{margin-bottom:10px}
.edit-card .field:last-child{margin-bottom:0}
.edit-card .field label{font-size:var(--t-xs)}
.handle-input-wrap{display:flex;align-items:center}
.handle-prefix{padding:11px 10px 11px 14px;border:1px solid var(--border-strong);border-right:none;border-radius:var(--r-sm) 0 0 var(--r-sm);font-size:var(--t-md);color:var(--muted);background:var(--surface2)}
.handle-input-wrap input{border-radius:0 var(--r-sm) var(--r-sm) 0!important}
.niche-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.niche-btn{padding:8px 4px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:var(--t-xs);font-weight:500;font-family:inherit;cursor:pointer;text-align:center;transition:all .15s}
.niche-btn.active{background:var(--text);color:var(--auf-text);border-color:var(--text)}
.btn-save{width:100%;padding:13px;margin-top:14px;background:var(--text);color:var(--auf-text);border:none;border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-md);font-weight:600;cursor:pointer}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{padding:8px 16px;border-radius:var(--r-sm);background:var(--red-bg);color:var(--red);border:1px solid rgba(192,57,43,.2);font-family:inherit;font-size:var(--t-sm);font-weight:600;cursor:pointer;white-space:nowrap}

/* ═══ VIEW: BIOLINK (aus /biolink/) ═══ */
.status-banner{margin:var(--s-3) var(--page-x) 0;padding:12px 16px;border-radius:var(--r-md);display:flex;align-items:center;gap:10px;border:1px solid}
.status-banner.active{background:var(--green-bg);border-color:var(--green-border)}
.status-banner.inactive{background:var(--surface2);border-color:var(--border-strong)}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.active{background:var(--green)}
.status-dot.inactive{background:var(--subtle)}
.status-text{font-size:var(--t-sm);font-weight:600;color:var(--text);flex:1}
.status-text span{display:block;font-size:var(--t-xs);font-weight:400;color:var(--muted);margin-top:1px}
.link-bar{margin:var(--s-2) var(--page-x) 0;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);display:flex;align-items:center;gap:10px}
.link-url{font-size:var(--t-sm);font-weight:500;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.link-action-btn{padding:7px 14px;background:var(--surface2);border:1px solid var(--border-strong);border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-sm);font-weight:600;color:var(--text);cursor:pointer;white-space:nowrap;flex-shrink:0}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.stat-box-value{font-size:var(--t-num-sm);font-weight:700;letter-spacing:-.04em;color:var(--text)}
.stat-box-label{font-size:var(--t-xs);color:var(--muted);margin-top:2px}
.chart-wrap{margin-top:14px;padding:14px 8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.chart-row{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:96px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.chart-bar-wrap{width:100%;height:64px;display:flex;align-items:flex-end;justify-content:center}
.chart-bar{width:70%;max-width:24px;background:var(--border-strong);border-radius:4px 4px 0 0;transition:height .3s cubic-bezier(.32,.72,0,1)}
.chart-bar.has{background:var(--text)}
.chart-day{font-size:var(--t-2xs);color:var(--muted);margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.chart-val{font-size:var(--t-xs);color:var(--text);font-weight:600;margin-top:2px}
.chart-empty{margin-top:12px;padding:18px;text-align:center;font-size:var(--t-sm);color:var(--muted);background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r-md)}
/* Herkunft und Klicks: Liste mit Balken im Hintergrund der Zeile. Der
   Balken traegt die Groessenordnung, die Zahl den genauen Wert. */
/* ── BioLink-Auswertung: ein Block, vier Streifen ────────────────────
   Vorher hatte jede Kennzahl ihre eigene Karte in einer eigenen Section.
   Bei vier Themen sind das vier Rahmen untereinander, und auf 375 px ist
   das mehr Kante als Inhalt. Jetzt eine Karte, innen durch Haarlinien
   geteilt — gleiche Information, ein Drittel weniger Scrollen. */
.bl-karte{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.bl-teil{padding:15px 16px;border-bottom:1px solid var(--border)}
.bl-teil:last-child{border-bottom:0}
.bl-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
/* Sprechende Ueberschrift, deshalb bewusst NICHT versal wie .section-label:
   ein Satz in Grossbuchstaben liest sich als Geschrei. */
.bl-titel{font-size:var(--t-sm);font-weight:600;color:var(--text);letter-spacing:-.01em}
.bl-meta{font-size:var(--t-xs);color:var(--muted);white-space:nowrap}
.bl-drei{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.bl-drei b{display:block;font-size:var(--t-num-sm);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bl-drei span{display:block;font-size:var(--t-2xs);color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.bl-zeile{display:flex;align-items:center;gap:9px;padding:6px 0}
.bl-name{flex:0 0 94px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--t-sm);color:var(--muted)}
.bl-spur{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bl-spur>div{height:100%;background:var(--text);border-radius:99px}
.bl-wert{flex:0 0 38px;text-align:right;font-size:var(--t-sm);font-weight:600;font-variant-numeric:tabular-nums}
.bl-uhr{display:flex;align-items:flex-end;gap:2px;height:46px}
.bl-uhr-col{flex:1;display:flex;align-items:flex-end;height:100%}
.bl-uhr-bar{width:100%;background:var(--surface2);border-radius:2px 2px 0 0;min-height:2px}
.bl-uhr-bar.has{background:var(--text)}
.bl-uhr-lbl{display:flex;justify-content:space-between;font-size:var(--t-2xs);color:var(--subtle);margin-top:5px}
/* Leerzustand innerhalb der Karte: kein zweiter Rahmen, nur Text. */
.bl-leer{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);padding:2px 0 4px}
/* 24 schmale Balken. Beschriftet werden nur 0, 6, 12 und 18 Uhr —
   24 Uhrzeiten nebeneinander liest ohnehin niemand. */
/* Loeschen bleibt erreichbar, wirbt aber nicht um den Klick: keine Flaeche,
   keine Signalfarbe im Ruhezustand, nur ein ruhiger Text. Die Rueckfrage
   dahinter bleibt unveraendert. */
.loesch-zeile{display:flex;justify-content:center;padding:22px var(--page-x) calc(8px + var(--safe-bottom))}
.loesch-link{background:none;border:0;font-family:inherit;font-size:var(--t-sm);color:var(--subtle);cursor:pointer;padding:10px 12px;border-radius:var(--r-sm);min-height:44px;display:inline-flex;align-items:center;transition:color .15s}
.loesch-link:hover{color:var(--red)}
.action-stack{padding:var(--s-3) var(--page-x) 0;display:flex;flex-direction:column;gap:8px}
.action-btn{width:100%;padding:13px 16px;border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-md);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;transition:opacity .15s}
.action-btn-primary{background:var(--text);color:var(--auf-text);border-color:var(--text)}
.action-btn-primary:disabled{opacity:.4;cursor:not-allowed}
.action-btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.action-btn-danger{background:var(--red-bg);color:var(--red);border-color:rgba(192,57,43,.2)}
.check-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.check-card-title{font-size:var(--t-sm);font-weight:600;color:var(--text);padding:14px 16px 10px}
.check-card-sub{font-size:var(--t-sm);color:var(--muted);padding:0 16px 12px;line-height:1.5}
.check-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--border)}
.check-dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.check-dot.ok{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-border)}
.check-dot.miss{background:var(--surface2);border:1.5px solid var(--border-strong);color:var(--subtle)}
.check-label{font-size:var(--t-sm);flex:1}
.check-label.ok{color:var(--muted);text-decoration:line-through}
.check-label.miss{color:var(--text);font-weight:500}
.links-list{display:flex;flex-direction:column;gap:8px}
.link-row-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;display:flex;align-items:center;gap:10px}
.link-row-body{flex:1;min-width:0}
.link-row-title{font-size:var(--t-sm);font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-row-url{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-paid-badge{font-size:var(--t-2xs);font-weight:600;background:var(--surface2);color:var(--muted);padding:1px 6px;border-radius:4px;flex-shrink:0}
.link-del-btn{width:26px;height:26px;border-radius:var(--r-sm);border:1px solid var(--border);background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex-shrink:0;font-size:var(--t-md)}
.link-del-btn:hover{color:var(--red);border-color:rgba(192,57,43,.3);background:var(--red-bg)}
.btn-add-link{width:100%;padding:11px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-sm);font-weight:500;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-add-link:hover{background:var(--surface2);color:var(--text)}
.empty-links{text-align:center;padding:24px;color:var(--muted);font-size:var(--t-sm)}
.theme-cards-wrap{padding:var(--s-3) var(--page-x) 0}
.theme-cards-title{font-size:var(--t-sm);font-weight:600;color:var(--text);text-align:center;margin-bottom:4px}
.theme-cards-sub{font-size:var(--t-xs);color:var(--muted);text-align:center;margin-bottom:14px;line-height:1.4}
.theme-cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--r-sm);padding:6px;cursor:pointer;transition:border-color .15s,transform .12s;display:flex;flex-direction:column;align-items:center;gap:6px}
.theme-card:hover{border-color:var(--border-strong)}
.theme-card.selected{border-color:var(--text)}
.theme-card:active{transform:scale(.97)}
.theme-card-img{width:100%;aspect-ratio:9/16;border-radius:var(--r-xs);background:var(--surface2);object-fit:cover;display:block}
.theme-card-name{font-size:var(--t-xs);font-weight:600;color:var(--text)}
.loading-overlay{position:fixed;inset:0;background:var(--glas-voll);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:300;display:flex;align-items:center;justify-content:center;padding:var(--s-6);animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.loading-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-5) var(--s-5) var(--s-4);box-shadow:var(--sh-card)}
.loading-title{font-size:var(--t-xl);font-weight:var(--fw-b);color:var(--text);letter-spacing:-.02em}
.loading-sub{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin-top:var(--s-1)}
.loading-card .flow-steps{padding:var(--s-4) 0 0}
.loading-card .step-body{flex:1;min-width:0}
/* Wartebalken fuer die Bauzeit nach der Antwort der Edge Function */
.loading-bar{height:3px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:7px}
.loading-bar span{display:block;height:100%;width:0;background:var(--text);border-radius:2px;animation:loadingFill linear forwards}
@keyframes loadingFill{from{width:0}to{width:100%}}
/* Der aktive Schritt bekommt einen ruhigen Puls, damit klar ist: es laeuft noch */
.loading-card .step-label.active{animation:stepPulse 1.8s ease-in-out infinite}
@keyframes stepPulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ─── SHEETS (aus /biolink/ und /mediakit/) ─── */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:0 0 calc(20px + var(--safe-bottom));width:100%;max-width:540px;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-handle{width:36px;height:4px;background:var(--border-strong);border-radius:2px;margin:12px auto 0}
.sheet-title{font-size:var(--t-xl);font-weight:700;letter-spacing:-.02em;padding:16px 20px 4px}
.sheet-sub{font-size:var(--t-sm);color:var(--muted);padding:0 20px 16px;line-height:1.5}
.sheet-field{padding:0 20px 12px}
.sheet-label{display:block;font-size:var(--t-xs);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.sheet-input{width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-input);color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
.sheet-input:focus{border-color:var(--text)}
.sheet-input-wrap{display:flex;align-items:center;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--bg)}
.sheet-prefix{padding:12px 10px 12px 14px;font-size:var(--t-md);color:var(--subtle);background:var(--surface2);border-right:1px solid var(--border-strong);flex-shrink:0}
.sheet-prefix-input{flex:1;padding:12px 14px;border:none;font-family:inherit;font-size:var(--t-input);color:var(--text);background:var(--bg);outline:none}
.sheet-textarea{width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-input);color:var(--text);background:var(--bg);outline:none;resize:none;min-height:90px;line-height:1.5}
.sheet-textarea:focus{border-color:var(--text)}
.sheet-checkbox-row{display:flex;align-items:center;gap:10px;padding:10px 20px 14px;cursor:pointer}
.sheet-checkbox-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--text);flex-shrink:0;cursor:pointer}
.sheet-checkbox-label{font-size:var(--t-sm);color:var(--muted)}
.sheet-hint{font-size:var(--t-xs);margin-top:5px;min-height:16px}
.sheet-hint.err{color:var(--red)}
.sheet-hint.ok{color:var(--green)}
.sheet-divider{height:1px;background:var(--border);margin:8px 0 12px}
.sheet-actions{padding:8px 20px 0;display:flex;flex-direction:column;gap:8px}
.sheet-btn-primary{width:100%;padding:13px;background:var(--text);color:var(--auf-text);border:none;border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-md);font-weight:600;cursor:pointer}
.sheet-btn-primary:disabled{opacity:.4;cursor:not-allowed}
.sheet-btn-cancel{width:100%;padding:13px;background:var(--surface2);color:var(--muted);border:1px solid var(--border-strong);border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-md);font-weight:500;cursor:pointer}
.theme-options{display:flex;flex-direction:column;gap:8px;padding:0 20px 8px}
.theme-opt{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;background:var(--surface);transition:border-color .15s}
.theme-opt.selected{border-color:var(--text);border-width:2px}
.theme-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0}
.theme-name{font-size:var(--t-sm);font-weight:500;color:var(--text);flex:1}
.theme-check{font-size:var(--t-md);font-weight:700;color:var(--text)}
.lang-options{display:flex;gap:8px;padding:0 20px 8px}
.lang-opt{flex:1;padding:10px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-md);font-weight:500;cursor:pointer;background:var(--surface);color:var(--muted);text-align:center;transition:all .15s}
.lang-opt.selected{background:var(--text);color:var(--auf-text);border-color:var(--text)}
.edit-action-list{display:flex;flex-direction:column}
.edit-action-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;text-align:left;width:100%;transition:background .15s}
.edit-action-row:last-child{border-bottom:none}
.edit-action-row:hover{background:var(--surface2)}
.edit-action-icon{width:20px;display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
.icon{flex-shrink:0;vertical-align:-.15em}
.edit-action-body{flex:1;min-width:0}
.edit-action-label{font-size:var(--t-md);font-weight:500;color:var(--text);flex:1}
.edit-action-sub{font-size:var(--t-xs);color:var(--muted);margin-top:1px}
.edit-action-arrow{display:grid;place-items:center;color:var(--subtle)}
.modal-btn-danger{background:var(--red);color:white;border-color:var(--red)}

/* ═══ VIEW: MEDIA KIT (aus /mediakit/) ═══ */
.preview-wrap{padding:var(--s-3) var(--page-x) 0}
.preview-title{font-size:var(--t-sm);font-weight:600;color:var(--text);text-align:center;margin-bottom:4px}
.preview-sub{font-size:var(--t-xs);color:var(--muted);text-align:center;margin-bottom:14px;line-height:1.4}
.preview-img-wrap{margin:0 auto;max-width:240px;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.preview-img-wrap img{display:block;width:100%;height:auto}
.sheet-header{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 14px 0 20px;gap:8px}
.sheet-header-text{flex:1;min-width:0}
/* Im Header bringt schon .sheet-header den Seitenrand mit — Titel und Sub duerfen ihn nicht doppelt setzen */
.sheet-header-text .sheet-title{padding:16px 0 4px}
.sheet-header-text .sheet-sub{padding:0 0 16px}
.sheet-close{width:32px;height:32px;border-radius:var(--r-full);background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:grid;place-items:center;font-size:16px;color:var(--muted);flex-shrink:0;font-family:inherit;line-height:1;padding:0}
.sheet-close:hover{background:var(--border);color:var(--text)}
.sheet-suffix{padding:12px 14px 12px 10px;font-size:var(--t-md);color:var(--muted);background:var(--surface2);border-left:1px solid var(--border-strong);flex-shrink:0}
.sheet-country-row{display:flex;gap:8px}
.sheet-country-row .sheet-input{flex:1;min-width:0}
.sheet-country-pct-wrap{flex-shrink:0;width:96px}
.sheet-tabs{display:flex;background:var(--surface2);border-radius:var(--r-sm);padding:3px;margin:0 20px 16px}
.sheet-tab{flex:1;padding:8px;border:none;border-radius:var(--r-xs);font-family:inherit;font-size:var(--t-sm);font-weight:500;color:var(--muted);cursor:pointer;background:none;transition:all .15s}
.sheet-tab.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sheet-panel{display:none}
.sheet-panel.active{display:block}

.edit-action-status{font-size:var(--t-xs);font-weight:600;padding:2px 8px;border-radius:var(--r-full);flex-shrink:0}
.edit-action-status.ok{background:var(--green-bg);color:var(--green)}
.edit-action-status.miss{background:var(--surface2);color:var(--muted)}
.offer-list{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.offer-row{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;text-align:left;width:100%;transition:background .15s}
.offer-row:hover{background:var(--surface2)}
.offer-label{font-size:var(--t-md);font-weight:500;flex:1;color:var(--text)}
.offer-check{width:22px;height:22px;border-radius:var(--r-xs);border:1.5px solid var(--border-strong);display:grid;place-items:center;flex-shrink:0;transition:all .15s;background:var(--surface)}
.offer-check.checked{background:var(--text);border-color:var(--text)}
.offer-check.checked::after{content:'✓';font-size:var(--t-sm);font-weight:700;color:var(--auf-text)}
.brands-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.brand-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 12px;display:flex;align-items:center;gap:10px}
.brand-row-body{flex:1;min-width:0}
.brand-row-name{font-size:var(--t-sm);font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-row-url{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.brand-del{width:26px;height:26px;border-radius:var(--r-sm);border:1px solid var(--border);background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex-shrink:0;font-size:var(--t-md)}
.brand-del:hover{color:var(--red);border-color:rgba(192,57,43,.3);background:var(--red-bg)}
.edit-page{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:60;transform:translateX(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;visibility:hidden}
.edit-page.open{transform:translateX(0);visibility:visible}
.edit-page-topbar{position:sticky;top:0;background:var(--glas-voll);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 16px;height:var(--nav-h);display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:1}
.edit-page-back{width:36px;height:36px;border-radius:var(--r-full);background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0;font-family:inherit;font-size:var(--t-xl);line-height:1;padding:0}
.edit-page-back:hover{background:var(--border)}
.edit-page-title{font-size:var(--t-lg);font-weight:700;letter-spacing:-.03em;flex:1}
.edit-page-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 0 calc(40px + var(--safe-bottom))}
.edit-page-intro{padding:0 20px 12px;font-size:var(--t-sm);color:var(--muted);line-height:1.5}

/* ═══ VIEW: ANALYSE (aus /analytics/) ═══ */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px}
.kpi-card.dark{background:var(--text);border-color:var(--text);grid-column:1/-1;padding:16px 20px}
.kpi-card.dark .kpi-label{color:var(--auf-text-70)}
.kpi-card.dark .kpi-value{color:var(--auf-text)}
.kpi-card.dark .kpi-delta{color:var(--auf-text-70)}
.kpi-label{font-size:var(--t-xs);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.kpi-value{font-size:var(--t-num);font-weight:700;color:var(--text);letter-spacing:-.04em;line-height:1}
.kpi-delta{font-size:var(--t-sm);font-weight:500;margin-top:4px}
.kpi-delta.up{color:var(--green)}.kpi-delta.down{color:var(--red)}.kpi-delta.flat{color:var(--muted)}
.timing-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timing-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center}
.timing-icon{display:flex;justify-content:center;color:var(--muted);margin-bottom:var(--s-2)}
.timing-label{font-size:var(--t-xs);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.timing-value{font-size:var(--t-lg);font-weight:700;color:var(--text);letter-spacing:-.02em}
.spinner-dark{width:13px;height:13px;border:2px solid rgba(0,0,0,.12);border-top-color:var(--muted);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
/* Plattform-Auswahl vor dem Kauf (Option C: ein Kauf = ein Kanal) */
.plat-cards{display:grid;grid-template-columns:1fr;gap:10px;padding:var(--s-4) var(--page-x) 0}
@media(min-width:600px){.plat-cards{grid-template-columns:1fr 1fr}}
.plat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column}
.plat-card.locked{background:var(--surface2)}
.plat-card-head{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.plat-card-name{font-size:var(--t-md);font-weight:700;color:var(--text);letter-spacing:-.01em}
.plat-card-handle{font-size:var(--t-sm);color:var(--muted);margin-bottom:12px;word-break:break-all}
.plat-card-handle.missing{color:var(--subtle)}
.plat-card-spacer{flex:1}
.plat-consent{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px}
.plat-consent input{width:17px;height:17px;flex-shrink:0;accent-color:var(--text);cursor:pointer;margin-top:1px}
.plat-consent label{font-size:var(--t-xs);color:var(--muted);line-height:1.45;cursor:pointer}
.btn-plat{width:100%;padding:12px;border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-sm);font-weight:600;cursor:pointer;border:1px solid var(--text);background:var(--text);color:var(--auf-text);display:flex;align-items:center;justify-content:center;gap:7px}
.btn-plat:disabled{opacity:.4;cursor:not-allowed}
.btn-plat.ghost{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.plat-note{font-size:var(--t-xs);color:var(--muted);line-height:1.5;margin-top:8px;text-align:center}
.plat-link{color:var(--text);font-weight:600;text-decoration:underline;cursor:pointer}
.plat-cards.eingeklappt{grid-template-columns:1fr}
/* Der Zuklappen-Knopf steht ueber beiden Kaufkarten, nicht neben einer. */
.plat-cards > .btn-menue{grid-column:1/-1}
.btn-menue{width:100%;font:inherit;font-weight:600;font-size:var(--t-md);padding:13px 16px;border-radius:var(--r-md);
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-menue:active{background:var(--surface2)}
.btn-menue-pfeil{opacity:.5}
.plat-done{display:flex;align-items:center;justify-content:center;gap:6px;font-size:var(--t-sm);color:var(--green);font-weight:600;margin-bottom:10px}
/* ══ Analyse-Route: dunkler Grund ═══════════════════════════════════════════
   Die Analyse ist das bezahlte Produkt und bekommt eine eigene Umgebung. Statt
   das Ergebnis als dunkle Insel in eine helle Seite zu setzen, kippt die ganze
   Route auf die Palette von Theme B. Gesetzt werden nur die Tokens -- alle
   Bauteile der App lesen ohnehin aus ihnen und ziehen mit. Ausnahmen sind die
   wenigen Stellen, die "background:var(--text)" mit hart weisser Schrift
   kombinieren: dort muss die Schrift auf den Grund umschlagen, sonst steht
   Weiss auf Hellgrau. */
/* Hier stand bis zum Redesign body.analyse-dunkel: ein zweiter Token-Satz,
   der die ganze Seite umfaerbte, solange die Analyse offen war. Er ist
   entfallen, weil die App durchgehend hell ist. Der Satz ist nicht verloren —
   er steht im Tag stand-vor-redesign und ist die fertige Vorlage, falls ein
   App-weiter Dunkelmodus kommt. Dann gehoert er an :root als
   html[data-farbmodus="dunkel"], nicht wieder an eine einzelne Route. */

/* ══ Analyse-Ergebnis: "Cockpit" ══════════════════════════════════════════
   Das Ergebnis ist das bezahlte Produkt und soll sich wie ein Instrument
   lesen. Bis zum Redesign hiess das: durchgehend dunkel, abgesetzt gegen eine
   helle App. Seit die ganze App das Studio-Design traegt, kommt die Wirkung
   aus Dichte, Monospace-Zahlen und der Signaturfarbe -- nicht mehr aus dem
   Farbumschlag. Die eigene Palette bleibt trotzdem: sie haelt die vier
   Bedeutungsfarben (gut/schlecht/Signatur/Achtung) an einer Stelle, und ein
   Dunkelmodus waere hier wieder genau dieser eine Block.
   --c-cool haengt an --v1 und wandert deshalb mit dem Design des Creators. */
.ckpt{
  --c-bg:#ffffff; --c-panel:#ffffff; --c-panel2:#f2f0f8; --c-line:rgba(27,24,38,.09); --c-line2:#d7d3e3;
  --c-fg:#17151f; --c-fg2:#4e4a5e; --c-fg3:#817c92;
  --c-ok:#15784b; --c-ok-bg:#eaf4ef; --c-ok-line:rgba(21,120,75,.22);
  --c-bad:#c23a31; --c-bad-bg:#fbeeed; --c-bad-line:rgba(194,58,49,.22);
  --c-cool:var(--v1); --c-cool-bg:var(--akzent-bg); --c-cool-line:var(--akzent-border);
  --c-amber:#a8630b; --c-amber-bg:#fdf3e6; --c-amber-line:rgba(168,99,11,.22);
  color:var(--c-fg);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  line-height:1.6; margin:12px 0 0;
  padding:4px var(--page-x) calc(24px + var(--safe-bottom));
  display:flex; flex-direction:column; gap:16px;
}
.ckpt h1,.ckpt h2,.ckpt h3{font-family:"Outfit","Inter",sans-serif;text-wrap:balance;margin:0}
.ckpt .c-num,.ckpt .c-big{margin:0}
.ckpt .c-mono{font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:12px;color:var(--c-fg3)}
.ckpt p{margin:0}

/* Kopf: die Kernaussage ist die Ueberschrift, nicht der Kanalname. */
.c-head{background:linear-gradient(180deg,var(--c-panel2),var(--c-panel));
  border:1px solid var(--c-line);border-radius:18px;padding:20px}
.c-eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--c-fg3);font-weight:600}
.c-head h1{font-size:clamp(22px,5.4vw,30px);font-weight:800;letter-spacing:-.025em;line-height:1.16;margin:8px 0 6px}
.c-head .c-sub{color:var(--c-fg2);font-size:14.5px}

.c-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.c-grid{grid-template-columns:repeat(4,1fr)}}
.c-tile{border-radius:15px;padding:14px 15px 13px;border:1px solid var(--c-line);background:var(--c-panel);box-shadow:var(--sh-card)}
.c-tile.ok{background:var(--c-ok-bg);border-color:var(--c-ok-line)}
.c-tile.bad{background:var(--c-bad-bg);border-color:var(--c-bad-line)}
.c-tile.cool{background:var(--c-cool-bg);border-color:var(--c-cool-line)}
.c-tile .c-k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-fg3);font-weight:600}
.c-tile .c-num{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.02;margin-top:5px;font-variant-numeric:tabular-nums}
.c-tile .c-s{font-size:11.5px;color:var(--c-fg3);margin-top:3px;line-height:1.4}
.c-tile.ok .c-num,.c-tile.ok .c-s{color:var(--c-ok)}
.c-tile.bad .c-num,.c-tile.bad .c-s{color:var(--c-bad)}
.c-tile.cool .c-num,.c-tile.cool .c-s{color:var(--c-cool)}

.c-panel{background:var(--c-panel);border:1px solid var(--c-line);border-radius:16px;padding:18px;box-shadow:var(--sh-card)}
.c-panel > h2{font-size:18px;font-weight:700;letter-spacing:-.015em;margin-bottom:3px}
.c-panel > .c-lede{color:var(--c-fg3);font-size:12.5px;margin:0 0 14px}
.c-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--c-fg3);margin-bottom:12px}
.c-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.c-chart{overflow-x:auto}
.c-chart svg{min-width:var(--c-chart-min,520px);display:block}

.c-split{display:grid;gap:10px}
@media(min-width:600px){.c-split{grid-template-columns:1fr 1fr}}
.c-box{border-radius:15px;padding:17px 18px;border:1px solid var(--c-line);background:var(--c-panel);box-shadow:var(--sh-card)}
.c-box.ok{background:var(--c-ok-bg);border-color:var(--c-ok-line)}
.c-box.bad{background:var(--c-bad-bg);border-color:var(--c-bad-line)}
.c-box.cool{background:var(--c-cool-bg);border-color:var(--c-cool-line)}
.c-box.amber{background:var(--c-amber-bg);border-color:var(--c-amber-line)}
/* Aufklappbare Auswertungstexte. Der Anreisser verschwindet beim Oeffnen --
   sonst stuende derselbe Satzanfang zweimal untereinander. */
.c-falt{margin-top:12px}
.c-falt-knopf{display:flex;align-items:baseline;gap:8px;width:100%;margin-top:10px;padding:0;
  background:none;border:0;font-family:inherit;text-align:left;cursor:pointer}
.c-falt-an{flex:1;min-width:0;font-size:14px;color:var(--c-fg3);line-height:1.5}
.c-falt-mehr{flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--c-cool);white-space:nowrap}
.c-falt-knopf.auf{margin-top:14px}
.c-chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;padding:4px 10px;border-radius:99px;margin-bottom:10px;
  background:rgba(27,24,38,.06);color:var(--c-fg2)}
.c-box.ok .c-chip{color:var(--c-ok)} .c-box.bad .c-chip{color:var(--c-bad)}
.c-box.cool .c-chip{color:var(--c-cool)} .c-box.amber .c-chip{color:var(--c-amber)}
.c-box h3{font-size:16.5px;font-weight:700;letter-spacing:-.012em;margin-bottom:8px}
.c-box p{font-size:14px;color:var(--c-fg2);margin:0 0 10px}
.c-box p:last-child{margin-bottom:0}
.c-box .c-big{font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1;
  font-variant-numeric:tabular-nums;margin:2px 0 6px}
.c-box.ok .c-big{color:var(--c-ok)} .c-box.bad .c-big{color:var(--c-bad)}
.c-box.cool .c-big{color:var(--c-cool)} .c-box.amber .c-big{color:var(--c-amber)}

.c-tbl{width:100%;border-collapse:collapse;font-size:13px}
.c-tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--c-fg3);
  font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--c-line)}
.c-tbl td{padding:9px 10px 9px 0;border-bottom:1px solid var(--c-line);color:var(--c-fg2)}
.c-tbl tr:last-child td{border-bottom:none}
.c-tbl td.n,.c-tbl th.n{text-align:right;padding-right:0}
.c-tbl td.n{font-variant-numeric:tabular-nums}
.c-tbl .up{color:var(--c-ok);font-weight:600} .c-tbl .down{color:var(--c-bad);font-weight:600}
.c-tbl a{color:var(--c-fg);text-decoration:none;border-bottom:1px solid var(--c-line2)}
.c-tbl-wrap{overflow-x:auto}

.c-steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;counter-reset:s}
.c-steps li{counter-increment:s;background:var(--c-panel2);border:1px solid var(--c-line);border-radius:12px;
  padding:14px 16px 14px 50px;position:relative;font-size:14px;color:var(--c-fg2)}
.c-steps li::before{content:counter(s);position:absolute;left:15px;top:13px;width:24px;height:24px;
  border-radius:8px;background:var(--c-cool);color:var(--c-bg);display:grid;place-items:center;
  font-family:"Outfit",sans-serif;font-size:12.5px;font-weight:800}

/* Waagerechte Vergleichsbalken (Format, Videolaenge) */
.c-cmp{display:flex;flex-direction:column;gap:9px}
.c-cmp-row{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto;gap:10px;align-items:center;font-size:12.5px}
.c-cmp-label{color:var(--c-fg2)}
.c-cmp-track{height:8px;border-radius:99px;background:var(--c-panel2);overflow:hidden}
.c-cmp-fill{height:100%;border-radius:99px;background:var(--c-cool)}
.c-cmp-val{font-size:12px;color:var(--c-fg);font-variant-numeric:tabular-nums;font-weight:600}

.c-rang-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.c-rang-tab{font:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;cursor:pointer;
  border:1px solid var(--c-line);background:var(--c-panel2);color:var(--c-fg2)}
.c-rang-tab.aktiv{background:var(--c-fg);color:var(--c-bg);border-color:var(--c-fg)}
/* Rangliste mit Vorschau: Bild, Datum, Wert. Ohne Bild bleibt die Ziffer. */
.c-rang-post{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.c-rang-bild{width:40px;height:40px;border-radius:9px;flex-shrink:0;object-fit:cover;display:block;
  background:var(--c-panel2);box-shadow:inset 0 0 0 1px var(--c-line)}
.c-rang-bild.leer{display:grid;place-items:center;font-family:"Outfit",sans-serif;font-size:13px;
  font-weight:800;color:var(--c-fg3)}
.c-rang-wann{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-rang-nr{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;margin-right:8px;
  background:var(--c-panel2);color:var(--c-fg3);font-family:"Outfit",sans-serif;font-size:11px;font-weight:800;vertical-align:-3px}
/* Zwei Regeln mit hoeherer Spezifitaet als `.c-tbl td` bzw. `.c-tbl a` --
   beide sind Element+Klasse (0-1-1) und schlugen die reinen Klassenselektoren
   (0-1-0) darunter:

   1. padding-left: `.c-tbl td` setzt padding-right auf 0. Ohne Gegenregel
      klebte „568.262 Aufrufe" direkt an der Zahl davor und las sich als eine
      einzige, absurd grosse Zahl.
   2. border-bottom: `.c-tbl a` unterstreicht jeden Link in der Tabelle. Die
      Beitragszeile ist seit den Vorschaubildern selbst ein Link -- dadurch lief
      unter jeder Zeile ein zweiter, kurzer Strich neben dem Zeilentrenner. */
.c-rang-zusatz{display:block;margin-top:2px;font-size:11.5px;font-weight:400;color:var(--c-fg3);white-space:nowrap}
.c-tbl a.c-rang-post{border-bottom:0}
.c-datum{color:inherit;text-decoration:none;border-bottom:1px dotted var(--c-line2)}
.c-datum:hover{border-bottom-style:solid;color:var(--c-fg)}
/* Teilen: der einzige Block im Cockpit, der nach aussen zeigt. Deshalb als
   eigene Flaeche mit heller Taste statt als unauffaelliger Knopf am Rand. */
.c-teilen{background:linear-gradient(180deg,var(--c-panel2),var(--c-panel));
  border:1px solid var(--c-line2);border-radius:16px;padding:22px}
.c-teilen h2{font-size:18px;font-weight:700;letter-spacing:-.015em;margin-bottom:4px}
.c-teilen .c-lede{margin-bottom:16px}
.c-teilen-knoepfe{display:flex;flex-wrap:wrap;gap:9px}
.c-btn{flex:1 1 190px;font:inherit;font-weight:700;font-size:14px;padding:14px 18px;border-radius:12px;
  cursor:pointer;border:1px solid var(--c-fg);background:var(--c-fg);color:var(--c-bg);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:"Outfit","Inter",sans-serif}
.c-btn:active{opacity:.85}
.c-btn.leise{background:transparent;color:var(--c-fg);border-color:var(--c-line2);font-weight:600}
.c-btn:disabled{opacity:.5;cursor:not-allowed}
.c-link-feld{margin-top:14px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.c-link-feld input{flex:1 1 220px;min-width:0;font-family:inherit;letter-spacing:.01em;font-size:12.5px;
  padding:11px 13px;border-radius:10px;border:1px solid var(--c-line);background:var(--c-panel2);color:var(--c-fg)}
.c-link-meta{font-size:12px;color:var(--c-fg3);margin-top:10px;line-height:1.6}
.c-link-meta a{color:var(--c-fg2)}
.c-foot{border-top:1px solid var(--c-line);padding-top:14px;font-size:12px;color:var(--c-fg3);line-height:1.55}
.c-foot a{color:var(--c-fg2)}

/* Ergebnis-Kopf: der Moment nach dem Warten gehoert dem Ergebnis, nicht dem Verkauf */
.result-head{padding:var(--s-4) var(--page-x) 0}
.result-head-inner{background:var(--text);border-radius:var(--r-md);padding:16px 18px}
.result-head-kicker{font-size:var(--t-2xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--auf-text-50)}
.result-head-title{font-size:var(--t-lg);font-weight:700;color:var(--auf-text);letter-spacing:-.02em;margin-top:3px}
.result-head-sub{font-size:var(--t-xs);color:var(--auf-text-70);margin-top:4px}
/* Balken: macht die Streuung sichtbar, die eine Ø-Zahl verschluckt */
.bars-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px}
.bars-row{display:flex;align-items:flex-end;gap:4px;height:88px;margin-bottom:8px}
.bar{flex:1;background:var(--border-strong);border-radius:3px 3px 0 0;min-height:3px;transition:background .15s}
.bar.best{background:var(--text)}
.bars-legend{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--muted)}
/* Vergleichstabelle fuer Formate und Video-Laengen */
.cmp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.cmp-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border)}
.cmp-row:last-child{border-bottom:none}
.cmp-label{flex:0 0 40%;font-size:var(--t-sm);color:var(--text);font-weight:600}
.cmp-track{flex:1;height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.cmp-fill{height:100%;background:var(--text);border-radius:99px}
.cmp-val{flex:0 0 auto;font-size:var(--t-sm);color:var(--muted);min-width:62px;text-align:right}
.cmp-note{font-size:var(--t-xs);color:var(--subtle);padding:9px 16px 0;line-height:1.5}
.pay-confirm{margin:var(--s-3) var(--page-x) 0;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);display:flex;align-items:center;gap:10px;font-size:var(--t-sm);color:var(--muted)}
.status-flow{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin:var(--s-3) var(--page-x) 0;overflow:hidden}
.status-flow-head{padding:14px 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.flow-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:var(--t-lg)}
.flow-icon.running{background:var(--surface2)}
.flow-icon.done{background:var(--green-bg)}
.flow-icon.error{background:var(--red-bg)}
.flow-title{font-size:var(--t-md);font-weight:600;color:var(--text)}
.flow-sub{font-size:var(--t-xs);color:var(--muted);margin-top:2px}
.flow-steps{padding:12px 16px 14px;display:flex;flex-direction:column}
.flow-step{display:flex;align-items:center;gap:10px;padding:6px 0;position:relative}
.flow-step:not(:last-child)::after{content:'';position:absolute;left:10px;top:26px;width:2px;height:calc(100% - 8px);background:var(--border)}
.step-dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:var(--t-2xs);font-weight:700;z-index:1}
.step-dot.done{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-border)}
.step-dot.active{background:var(--text);color:var(--auf-text)}
.step-dot.wait{background:var(--surface2);border:1.5px solid var(--border-strong)}
.step-label{font-size:var(--t-sm);font-weight:500}
.step-label.done{color:var(--subtle)}
.step-label.active{color:var(--text);font-weight:600}
.step-label.wait{color:var(--subtle)}
.platform-row{display:flex;gap:6px;padding:var(--s-4) var(--page-x) 0}
.plat-btn{flex:1;padding:10px;border-radius:var(--r-sm);font-size:var(--t-sm);font-weight:500;text-align:center;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);font-family:inherit;transition:all .15s}
.plat-btn.active{background:var(--text);color:var(--auf-text);border-color:var(--text)}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px}
.summary-text{font-size:var(--t-md);color:var(--text);line-height:1.7;white-space:pre-line}
.insight-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.insight-row{padding:14px 16px;border-bottom:1px solid var(--border)}
.insight-row:last-child{border-bottom:none}
.insight-tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:700;padding:2px 8px;border-radius:var(--r-full);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.tag-good{background:var(--green-bg);color:var(--green)}
.tag-improve{background:var(--orange-bg);color:var(--orange)}
.tag-tip{background:var(--surface2);color:var(--muted)}
.tag-dev{background:var(--blue-bg);color:var(--blue)}
.insight-text{font-size:var(--t-md);color:var(--text);line-height:1.65;white-space:pre-line}
.tips-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.tip-row{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.tip-row:last-child{border-bottom:none}
