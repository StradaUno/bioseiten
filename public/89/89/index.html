async function onObPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Bild zu groß. Max. 5 MB.');return}
  const statusEl=document.getElementById('upload-status')
  if(statusEl)statusEl.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{
    const img=document.querySelector('#ob-content img[style*="56px"]')
    if(img)img.src=ev.target.result
  }
  reader.readAsDataURL(file)
  if(!obv?.user)return
  const st=document.getElementById('upload-status')
  if(st)st.textContent='Wird hochgeladen…'
  const erg=await profilbildHochladen(file, obv.user.id, obv.data.photoUrl)
  if(!obv)return
  if(erg.fehler){showToast(erg.fehler,4000);if(st)st.textContent='Upload fehlgeschlagen';return}
  obv.data.photoUrl=erg.publicUrl
  if(st)st.textContent='✓ Eigenes Foto hochgeladen'
  // Update badge
  const badge=document.querySelector('#ob-content div[style*="bottom:-2px"]')
  if(badge){badge.style.background='var(--green)';badge.textContent='✓'}
  e.target.value=''
}

window.nextStep=async function(){
  if(!obv)return
  const collect=OB_STEPS[obv.step-1].collect
  if(!collect())return
  if(obv.step<obv.total){obv.step++;renderStep();return}
  await saveAndFinish()
}
window.prevStep=function(){if(obv&&obv.step>1){obv.step--;renderStep()}}

async function saveAndFinish(){
  const btn=document.getElementById('btn-next')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const d=obv.data
  const{error}=await sb.from('users').update({
    instagram_handle:d.ig||null,
    tiktok_handle:d.tt||null,
    niche_category:d.niche,
    profile_image_url:d.photoUrl||null,
    onboarding_completed:true,
    updated_at:new Date().toISOString()
  }).eq('id',obv.user.id)
  if(!obv||obv.ctx.stale)return
  btn.disabled=false;btn.textContent='Abschließen ✓'
  if(error){showToast('Fehler beim Speichern: '+error.message,4000);return}
  /* Damit der Router-Guard nicht erneut ins Onboarding schickt */
  if(state.profile)state.profile.onboarding_completed=true

  /* Die erste Analyse laeuft beim Start, ohne Kauf.
     Ohne sie ist jede andere Ansicht leer: kein Verlauf, kein Score, keine
     Aufgabe, die sich auf eine Zahl berufen kann. erstanalyse_freischalten()
     legt nur die Freischaltung an - den Rest macht die bestehende Kette
     unveraendert weiter, der bezahlte Pfad wird nicht angefasst.
     Schlaegt es fehl, ist das kein Grund, das Onboarding zu verderben: die
     Analyse laesst sich jederzeit von Hand starten. */
  try {
    const {data:frei}=await sb.rpc('erstanalyse_freischalten')
    const plattformen=frei?.freigeschaltet||[]
    if(plattformen.length){
      /* Start-Analyse ohne Warten: die Function meldet sich ueber ihren
         eigenen Webhook zurueck, und der Nutzer soll hier nicht stehen. */
      const {data:{session}}=await sb.auth.getSession()
      for(const pf of plattformen){
        fetch(SUPABASE_URL+'/functions/v1/start-analysis',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
          body:JSON.stringify({platform:pf})
        }).catch(()=>{})
      }
      obv.erstanalyse=plattformen.length
    }
  } catch(e) { /* siehe Kommentar oben */ }

  document.getElementById('ob-wrap').classList.add('hidden')
  document.getElementById('success-wrap').classList.remove('hidden')
  const hinweis=document.getElementById('ob-erstanalyse')
  if(hinweis&&obv.erstanalyse){
    hinweis.classList.remove('hidden')
    hinweis.textContent=obv.erstanalyse===1
      ? 'Deine erste Analyse laeuft bereits. In wenigen Minuten stehen deine Zahlen in der App.'
      : 'Deine ersten Analysen laufen bereits. In wenigen Minuten stehen deine Zahlen in der App.'
  }
  confetti()
}

function confetti(){
  const el=document.getElementById('confetti-area')
  const emojis=['🎉','✨','🌟','💫','🎊','🎈']
  let i=0;const iv=setInterval(()=>{
    if(!obv||!document.getElementById('confetti-area')){clearInterval(iv);return}
    el.textContent=emojis[i%emojis.length];i++;if(i>12)clearInterval(iv)
  },200)
  if(obv)obv.confettiTimer=iv
}


/* ═══════════════════════════════════════════════════════════════
   VIEW: DASHBOARD — übernommen aus public/dashboard/index.html
   Zustandsabhängig: eine Kachel mit Zahlen bekommt nur, wer das
   Feature eingerichtet hat. Was fehlt, erscheint als Einrichten-Karte
   mit klarem Ziel. News nur als Teaser mit den zwei neuesten Schlagzeilen.
   ═══════════════════════════════════════════════════════════════ */
async function renderDashboard(area, ctx) {
  const uid = state.session.user.id

  /* Das Skeleton bildet das spätere Raster nach — Begrüßung, Kacheln,
     Liste —, damit beim Umschalten auf die echten Daten nichts springt. */
  area.innerHTML = `
    <div id="skeleton-area">
      <div class="section" style="padding-top:var(--s-4)"><div class="skeleton" style="height:72px;border-radius:var(--r-md)"></div></div>
      <div class="section"><div class="dash-grid">
        <div class="skeleton" style="height:104px;border-radius:var(--r-md)"></div>
        <div class="skeleton" style="height:104px;border-radius:var(--r-md)"></div>
        <div class="skeleton" style="height:104px;border-radius:var(--r-md)"></div>
        <div class="skeleton" style="height:104px;border-radius:var(--r-md)"></div>
      </div></div>
      <div class="section"><div class="skeleton" style="height:132px;border-radius:var(--r-md)"></div></div>
    </div>
    <div id="dashboard-content" class="hidden"></div>`

  /* users trägt die Aufruf-Zähler selbst (gepflegt aus biolink_aufrufe /
     mediakit_aufrufe) — dieselbe Quelle, aus der auch die BioLink- und
     die Media-Kit-View lesen. */
  const [profileRes,analyticsRes,digestRes,dailyTextRes,statsRes] = await Promise.all([
    sb.from('users').select('full_name,display_name,profile_image_url,total_followers,bio_active,mediakit_active,bio_views_last_7_days,mediakit_views_last_7_days,instagram_handle,tiktok_handle').eq('id',uid).single(),
    sb.from('creator_analytics').select('platform,followers,followers_prev,followers_change,avg_likes,avg_views,avg_saves,engagement_rate,engagement_rate_prev,fetched_at').eq('user_id',uid).eq('platform','instagram').order('fetched_at',{ascending:false}).limit(10),
    /* Aus derselben View wie die News-Seite: nach relevance_score sortiert.
       Vorher stand hier cards.slice(0,2) auf dem rohen jsonb — der Teaser
       zeigte damit die beiden Karten, die das Modell zufaellig zuerst
       geschrieben hatte, nicht die beiden wichtigsten. */
    sb.from('digest_cards_today').select('slug,headline,source,platform,date').order('relevance_score',{ascending:false}).limit(3),
    sb.rpc('get_daily_text',{p_user_id:uid}),
    sb.from('analyse_stats').select('platform,followers,followers_change,handle_changed,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(20),
  ])

  if (ctx.stale) return

  const p         = profileRes.data
  const an        = (analyticsRes.data||[])[0] || null
  /* Alterssperre: waehrend des Ausfalls vom 21.05. bis 06.09. zeigte das
     Dashboard 109 Tage lang die Karten vom 20. Mai — ohne Datum, ohne
     Hinweis. Aelter als drei Wochen wird der Abschnitt jetzt weggelassen. */
  const newsRoh   = digestRes.data || []
  const newsAlterTage = newsRoh.length
    ? Math.round((Date.now() - new Date(newsRoh[0].date + 'T12:00:00')) / 86400000)
    : null
  const cards     = (newsAlterTage !== null && newsAlterTage <= 21) ? newsRoh : []
  const dailyText = dailyTextRes.data || null
  const statsRows = statsRes.data || []

  const name = p?.display_name||p?.full_name||'Creator'

  // Follower: neue analyse_stats bevorzugen, Fallback auf users.total_followers
  const igStats = statsRows.find(r=>r.platform==='instagram')
  const ttStats = statsRows.find(r=>r.platform==='tiktok')
  const totalFollowers = igStats||ttStats
    ? (igStats?.followers||0)+(ttStats?.followers||0)
    : p?.total_followers
  const follDelta = igStats?.followers_change??an?.followers_change

  /* Eingerichtet heißt: die Seite ist live bzw. es liegt eine Messung vor.
     Genau daran hängt, ob eine Kachel Zahlen oder eine Einrichten-Karte zeigt. */
  const hasAnalyse  = statsRows.length>0
  const bioActive   = p?.bio_active===true
  const mkActive    = p?.mediakit_active===true

  /* Der Tagessatz aus get_daily_text steht jetzt unter dem Namen statt in einer
     eigenen Begruessungskarte. Ohne Satz das Datum — eine Begruessung direkt
     unter dem eigenen Namen waere doppelt. */
  const greetText = dailyText || new Date().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long'})

  /* B5: Bezugspunkt ist die vorherige Analyse derselben Plattform, nicht "diese Woche". */
  const igPrev = statsRows.filter(r=>r.platform==='instagram')[1] || null
  const seitWann = igPrev?.created_at
    ? 'seit ' + new Date(igPrev.created_at).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})
    : 'seit letzter Analyse'

  /* Verlauf statt Einzelwert: analyse_stats liegt je Kanal mehrfach vor, das
     ist bereits eine Kurve. Gezeichnet wird der Kanal mit den meisten
     Messungen -- zwei Plattformen in eine Linie zu addieren wuerde einen
     Sprung zeigen, wo nur eine zweite Messung dazugekommen ist. */
  const reihe = pf => statsRows.filter(r=>r.platform===pf && r.followers!=null)
                               .slice().reverse().map(r=>+r.followers)
  const igReihe = reihe('instagram'), ttReihe = reihe('tiktok')
  const sparkPf  = ttReihe.length > igReihe.length ? 'TikTok' : 'Instagram'
  const sparkPkt = ttReihe.length > igReihe.length ? ttReihe  : igReihe

  const kanaele = []
  if(p?.instagram_handle) kanaele.push('@'+String(p.instagram_handle).replace(/^@/,''))
  else if(p?.tiktok_handle) kanaele.push('@'+String(p.tiktok_handle).replace(/^@/,''))
  const seitenLive = (bioActive?1:0) + (mkActive?1:0)

  /* Kleine Kennzahlen: nur was tatsaechlich live ist. */
  const tiles=[]
  if(bioActive) tiles.push({href:'#/biolink',label:'BioLink',value:fmt(p?.bio_views_last_7_days),sub:'Aufrufe · 7 Tage'})
  if(mkActive)  tiles.push({href:'#/mediakit',label:'Media Kit',value:fmt(p?.mediakit_views_last_7_days),sub:'Aufrufe · 7 Tage'})

  /* Warteschlange: was Punkte bringt, oben. Aus "Einrichten" wurde eine
     Liste mit Marke rechts -- der Preis steht dort, wo geklickt wird. */
  const setup=[]
  if(!bioActive)  setup.push({icon:'link',href:'#/biolink',title:'BioLink-Seite erstellen',sub:'Deine Visitenkarte für Brands'})
  if(!hasAnalyse) setup.push({icon:'barChart',href:'#/analytics',title:'Analyse starten',sub:'Was deine Top-Posts verbindet',marke:'9,99 €',markeKlasse:'preis'})
  if(!mkActive)   setup.push({icon:'fileText',href:'#/mediakit',title:'Media Kit erstellen',sub:'Reichweite und Zahlen für Marken'})
  if(hasAnalyse)  setup.push({icon:'star',href:'#/brandready',title:'Brand-Ready-Check ansehen',sub:'Wie eine Marke deinen Kanal heute sieht'})

  document.getElementById('skeleton-area').classList.add('hidden')
  const content=document.getElementById('dashboard-content')
  content.classList.remove('hidden')
  content.innerHTML = `
    <div class="dash-kopf">
      <div class="dash-kopf-txt">
        <div class="dash-kopf-name">${escHtml(name)}</div>
        ${kanaele.length?`<div class="dash-kopf-sub">${escHtml(kanaele[0])}</div>`:''}
      </div>
      ${seitenLive?`<span class="dash-live"><i></i>${seitenLive} ${seitenLive===1?'SEITE':'SEITEN'} LIVE</span>`:''}
    </div>

    ${greetText?`<div class="dash-satz">${escHtml(greetText)}</div>`:''}

    ${hasAnalyse?`<div class="section" style="padding-top:0">
      <a class="dash-haupt" href="#/analytics">
        <div class="dash-haupt-top">

/* Verlaufslinie fuer die Hauptkarte.
   Unter drei Messungen wird nichts gezeichnet: zwei Punkte sind immer eine
   Gerade und behaupten einen Trend, den es nicht gibt. Die Flaeche ist
   bewusst nur eine Andeutung -- die Zahl ist die Aussage, die Linie der
   Zusatz. Skaliert wird auf min/max der Reihe, nicht auf Null, sonst
   verschwindet jede Bewegung bei fuenfstelligen Followerzahlen. */
function dashSparkline(werte){
  if(!Array.isArray(werte) || werte.length < 3) return ''
  const W=320, H=68, P=5
  const min=Math.min(...werte), max=Math.max(...werte)
  const spanne = (max-min) || 1
  const x = i => P + i*(W-2*P)/(werte.length-1)
  const y = v => P + (1-(v-min)/spanne)*(H-2*P)
  const punkte = werte.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`)
  const linie  = 'M'+punkte.join(' L')
  const flaeche= linie+` L${x(werte.length-1).toFixed(1)},${H} L${x(0).toFixed(1)},${H} Z`
  const letztX = x(werte.length-1).toFixed(1), letztY = y(werte[werte.length-1]).toFixed(1)
  return `<svg class="dash-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="dash-spark-linie" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="var(--v1)"/><stop offset=".55" stop-color="var(--v2)"/><stop offset="1" stop-color="var(--v3)"/>
      </linearGradient>
      <linearGradient id="dash-spark-flaeche" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--v2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--v2)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${flaeche}" fill="url(#dash-spark-flaeche)"/>
    <path d="${linie}" fill="none" stroke="url(#dash-spark-linie)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${letztX}" cy="${letztY}" r="3.4" fill="var(--v3)"/>
  </svg>`
}

// URL-Normalisierung: akzeptiert Nike.de, www.nike.de, https://Nike.de/ → gibt https://nike.de zurück
function normalizeBrandUrl(raw){
  if(!raw)return null
  let s=raw.trim()
  if(!s)return null
  s=s.replace(/^https?:\/\//i,'')
  s=s.replace(/\/+$/,'')
  s=s.replace(/^www\./i,'')
  const slashIdx=s.indexOf('/')
  if(slashIdx>=0){
    s=s.substring(0,slashIdx).toLowerCase()+s.substring(slashIdx)
  }else{
    s=s.toLowerCase()
  }
  if(!/^[a-z0-9-]+\.[a-z0-9.-]+/i.test(s))return null
  return 'https://'+s
}

function slugify(name){
  return String(name||'').toLowerCase().trim()
    .replace(/[äÄ]/g,'ae').replace(/[öÖ]/g,'oe').replace(/[üÜ]/g,'ue').replace(/[ß]/g,'ss')
    .replace(/[^a-z0-9\s_-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')
}

/* ─── Fortschritts-Overlay ───────────────────────────────────────
   Erstellen, Design-Wechsel und Loeschen laufen ueber eine Edge
   Function, die die erzeugte Seite ins Repo committet. Wenn sie
   antwortet, ist die Seite noch nicht im Netz — Cloudflare Pages baut
   danach noch rund fuenfzehn Sekunden. Deshalb zwei Phasen:

   1. Schrittliste auf einem Timer, solange die Function laeuft. Der
      vorletzte Schritt bleibt aktiv, bis die Antwort da ist.
   2. Danach ZWEI Schluss-Schritte mit Fortschrittsbalken, je 15 Sekunden.
      Erst dann ist alles gruen und das Overlay geht.

   Warum zwei und nicht einer mit 30 Sekunden: mit fuenfzehn Sekunden war
   das Overlay weg, bevor Cloudflare fertig gebaut hatte -- wer danach
   gleich auf seine Seite ging, bekam "Diese Seite gibt es nicht" zu sehen.
   Ein einzelner Balken, der doppelt so lange laeuft, sieht dagegen aus wie
   ein Haenger. Zwei Zeilen zeigen, dass noch etwas passiert.
   ───────────────────────────────────────────────────────────────── */
const LOADING_FLOWS={
  biolinkCreate:{
    title:'BioLink wird erstellt',
    sub:'Das dauert einen Moment — bitte lass die Seite offen.',
    steps:['Angaben werden geprüft','Layout wird gebaut','Design wird angewendet','Inhalte werden eingefügt'],

  },

    steps:['Design wird gespeichert','Seite wird neu gebaut'],

  biolinkDelete:{

    tail:'Media Kit geht online',

    tail2:'Media Kit wird weltweit verteilt',
    tail2Sub:'Letzter Schritt — gleich ist dein Media Kit überall erreichbar.'
  },
  mediakitDelete:{
    title:'Media Kit wird gelöscht',
    sub:'Deine Angaben bleiben gespeichert.',
    steps:['Seite wird offline genommen','Verweise werden entfernt'],
    tail:'Änderung wird verteilt',
    tailSub:'Fast geschafft — gleich ist das Media Kit nicht mehr erreichbar.'
  }
}
const LOADING_STEP_MS=6000     // Taktung der Schritte, solange die Function laeuft
const LOADING_HOLD_MS=15000    // Bauzeit von Cloudflare Pages nach der Antwort

let _loadingTimer=null
let _loadingHold=null
let _loadingFlow=null

/* activeIdx zeigt auf den laufenden Schritt; alles davor ist erledigt.
   Der Schluss-Schritt steht am Ende der Liste und bekommt waehrend der
   Wartezeit den Fortschrittsbalken. */
function paintLoadingSteps(activeIdx,withBar){
  const el=document.getElementById('loading-steps')
  if(!el||!_loadingFlow)return
  const all=[..._loadingFlow.steps,_loadingFlow.tail].concat(_loadingFlow.tail2?[_loadingFlow.tail2]:[])
  el.innerHTML=all.map((label,i)=>{
    const state=i<activeIdx?'done':i===activeIdx?'active':'wait'
    const bar=(withBar&&i===activeIdx)
      ? `<div class="loading-bar"><span style="animation-duration:${LOADING_HOLD_MS}ms"></span></div>`
      : ''
    return `<div class="flow-step">
      <div class="step-dot ${state}">${state==='done'?icon('check',11):state==='active'?'<span class="spinner" style="width:8px;height:8px;border-width:1.5px"></span>':''}</div>
      <div class="step-body"><div class="step-label ${state}">${escHtml(label)}</div>${bar}</div>
    </div>`
  }).join('')
}

function showLoadingOverlay(flowKey='biolinkCreate'){
  const flow=LOADING_FLOWS[flowKey]||LOADING_FLOWS.biolinkCreate
  _loadingFlow=flow
  document.getElementById('loading-title').textContent=flow.title
  document.getElementById('loading-sub').textContent=flow.sub
  paintLoadingSteps(0)
  document.getElementById('loading-overlay').classList.remove('hidden')
  document.body.style.overflow='hidden'

  let i=0
  const lastTimed=flow.steps.length-1
  const t=setInterval(()=>{
    i++
    // Nicht in den Schluss-Schritt laufen — der kommt erst nach der Antwort
    if(i>=lastTimed){ paintLoadingSteps(lastTimed); clearInterval(t); return }
    paintLoadingSteps(i)
  },LOADING_STEP_MS)
  _loadingTimer=t
  return t
}

/* Die Function ist durch: Schluss-Schritt aktivieren und die Bauzeit
   abwarten, bevor "fertig" behauptet wird. */
function finishLoadingOverlay(timer){
  if(timer)clearInterval(timer)
  _loadingTimer=null
  if(!_loadingFlow)return Promise.resolve()
  const tailIdx=_loadingFlow.steps.length
  const sub=document.getElementById('loading-sub')
  paintLoadingSteps(tailIdx,true)
  if(sub)sub.textContent=_loadingFlow.tailSub
  return new Promise(res=>{
    const fertig=()=>{
      _loadingHold=null
      paintLoadingSteps(tailIdx+(_loadingFlow.tail2?2:1))
      setTimeout(()=>{ hideLoadingOverlay(); res() },600)
    }
    _loadingHold=setTimeout(()=>{
      if(!_loadingFlow.tail2)return fertig()
      // Zweite Wartezeit: derselbe Balken, neue Zeile.
      paintLoadingSteps(tailIdx+1,true)
      if(sub)sub.textContent=_loadingFlow.tail2Sub
      _loadingHold=setTimeout(fertig,LOADING_HOLD_MS)
    },LOADING_HOLD_MS)
  })
}

function hideLoadingOverlay(timer){
  if(timer)clearInterval(timer)
  if(_loadingHold){clearTimeout(_loadingHold);_loadingHold=null}
  _loadingTimer=null
  document.getElementById('loading-overlay')?.classList.add('hidden')
  document.body.style.overflow=''
}
function stopLoadingOverlay(){ if(_loadingTimer){clearInterval(_loadingTimer);_loadingTimer=null} hideLoadingOverlay() }

async function loadBiolink(){
  const uid = blv.uid
  const[profileRes,biolinkRes,linksRes,viewsDailyRes,herkunftRes,stundenRes,klickRes,rateRes]=await Promise.all([
    sb.from('users').select('display_name,full_name,profile_image_url,bio,bio_active,instagram_handle,tiktok_handle,youtube_handle,threads_handle,impressum_text,contact_email,subscription_type,bio_views_total,bio_views_today,bio_views_last_7_days').eq('id',uid).single(),
    sb.from('biolink_viuno').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('biolink_custom_links').select('*').eq('user_id',uid).order('position',{ascending:true}),
    sb.rpc('get_biolink_views_last_7_days_daily',{p_user_id:uid}),
    /* Herkunft und Stunde liegen seit April in biolink_aufrufe, wurden
       aber nie angezeigt. Klicks kommen aus biolink_klicks. Alle drei
       Funktionen lesen ueber auth.uid(), nicht ueber einen Parameter. */
    sb.rpc('biolink_herkunft',{p_tage:30}),
    sb.rpc('biolink_stunden',{p_tage:30}),
    sb.rpc('biolink_klick_zahlen',{p_tage:30}),
    /* Eigene Funktion, weil die Rate beide Seiten des Bruchs ab demselben
       Moment zaehlen muss: Klicks gibt es erst seit der Neugenerierung,
       Aufrufe seit jeher. Sonst steht dort 30 Tage lang zu wenig. */
    sb.rpc('biolink_klickrate',{p_tage:30})
  ])
  if(!blv||blv.ctx.stale)return
  blv.profile=profileRes.data
  blv.biolink=biolinkRes.data
  blv.customLinks=linksRes.data||[]
  blv.viewsTotal=blv.profile?.bio_views_total||0
  blv.viewsToday=blv.profile?.bio_views_today||0
  blv.views7Days=blv.profile?.bio_views_last_7_days||0
  blv.viewsDaily=viewsDailyRes.data||[]
  blv.herkunft=herkunftRes.data||[]
  blv.stunden=stundenRes.data||[]
  blv.klicks=klickRes.data||[]
  blv.klickrate=rateRes.data?.[0]||null
  blv.theme=blv.biolink?.theme||'color'
  blv.lang=blv.biolink?.default_language||'de'
  paintBiolink()
}

function paintBiolink(){
  const p=blv.profile
  const isActive=p?.bio_active===true
  const slug=slugify(p?.display_name||'')
  const bioUrl=slug?`viuno.de/${slug}`:null
  const bioFullUrl=slug?`https://viuno.de/${slug}`:null

  // Checkliste
  const checks=[
    {label:'Profilbild hochgeladen',ok:!!(p?.profile_image_url)},
    {label:'Impressum hinterlegt',ok:!!(p?.impressum_text?.trim())},
    {label:'Mindestens 1 Social-Kanal',ok:!!(p?.instagram_handle||p?.tiktok_handle||p?.youtube_handle||p?.threads_handle)},
  ]
  const allOk=checks.every(c=>c.ok)

  const viewsToday=blv.viewsToday
  const views7=blv.views7Days
  const viewsTotal=blv.viewsTotal

  // 7-Tage Bar-Chart-HTML
  const maxVal=Math.max(...blv.viewsDaily.map(d=>d.view_count||0),1)
  const dayLbl=['So','Mo','Di','Mi','Do','Fr','Sa']
  const chartBars=blv.viewsDaily.map(d=>{
    const v=d.view_count||0
    const h=Math.max((v/maxVal)*100,v>0?8:2)
    const dayShort=dayLbl[new Date(d.view_date+'T00:00:00').getDay()]
    return `<div class="chart-col" title="${v} Aufrufe">
      <div class="chart-bar-wrap"><div class="chart-bar ${v>0?'has':''}" style="height:${h}%"></div></div>
      <div class="chart-day">${dayShort}</div>
      <div class="chart-val">${v}</div>
    </div>`
  }).join('')
  const chartHtml=viewsTotal>0?`<div class="chart-wrap"><div class="chart-row">${chartBars}</div></div>`
    :`<div class="chart-empty">Noch keine Aufrufe in den letzten 7 Tagen.</div>`

  /* ── Auswertungen, 30 Tage ──────────────────────────────────────────
     Herkunft und Stunde lagen seit April ungenutzt in der Tabelle.
     Klicks kommen aus biolink_klicks und beginnen erst mit der Seite,
     die den Zaehler enthaelt — deshalb der Hinweis im leeren Zustand. */
  const ARTLABEL={instagram:'Instagram',tiktok:'TikTok',youtube:'YouTube',threads:'Threads',kontakt:'Kontakt',custom:'Link'}
  const aufrufe30=blv.herkunft.reduce((a,h)=>a+Number(h.anzahl||0),0)
  const klicks30=blv.klicks.reduce((a,k)=>a+Number(k.anzahl||0),0)
  /* Kann ueber 100% liegen: ein Besucher klickt manchmal mehrere Links. */
  const rate=blv.klickrate
  const rateAufrufe=Number(rate?.aufrufe||0)
  const klickrate=rateAufrufe>0?Math.round(Number(rate.klicks||0)/rateAufrufe*100):0
  const rateSeit=rate?.seit?new Date(rate.seit).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):null

  /* Balkenlaenge relativ zum groessten Wert, Zahl rechts absolut.
     Der Prozentanteil steckt in der Balkenlaenge — ihn zusaetzlich
     auszuschreiben war eine dritte Zahl je Zeile ohne neue Aussage. */
  const zeilenHtml=(zeilen)=>{
    const max=Math.max(...zeilen.map(z=>z.wert),1)
    return zeilen.map(z=>`<div class="bl-zeile">
        <span class="bl-name" title="${escHtml(z.text)}">${escHtml(z.text)}</span>
        <div class="bl-spur"><div style="width:${Math.round(z.wert/max*100)}%"></div></div>
        <span class="bl-wert">${fmtNum(z.wert)}</span>
      </div>`).join('')
  }

  const herkunftHtml=aufrufe30>0
    ? zeilenHtml(blv.herkunft.slice(0,6).map(h=>({text:h.quelle,wert:Number(h.anzahl)})))
    : `<div class="bl-leer">Noch keine Aufrufe in den letzten 30 Tagen.</div>`

  const maxStd=Math.max(...blv.stunden.map(x=>Number(x.anzahl||0)),1)
  const uhrHtml=blv.stunden.length?`<div class="bl-uhr">${blv.stunden.map(x=>{
      const v=Number(x.anzahl||0)
      return `<div class="bl-uhr-col" title="${x.stunde} Uhr · ${v} Aufrufe">
        <div class="bl-uhr-bar ${v>0?'has':''}" style="height:${Math.max(v/maxStd*100,v>0?6:2)}%"></div>
      </div>`}).join('')}</div>
    <div class="bl-uhr-lbl"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>`:''

  const klickHtml=klicks30>0
    ? zeilenHtml(blv.klicks.slice(0,8).map(k=>({text:k.label||ARTLABEL[k.art]||k.art,wert:Number(k.anzahl)})))
    : `<div class="bl-leer">Noch keine Klicks. Gezählt wird, seit die Seite zuletzt erzeugt wurde.</div>`

  renderBioEditMenu()

  const page=document.getElementById('page-content')

  const statusHtml=isActive
    ?`<div class="status-banner active"><div class="status-dot active"></div>
        <div><div class="status-text">Seite ist live<span>Deine Seite ist öffentlich erreichbar</span></div></div></div>
       ${bioUrl?`<div class="link-bar">
         <a class="link-url" href="${bioFullUrl}" target="_blank" rel="noopener">${bioUrl} ${icon('arrowUpRight',13)}</a>
         <button class="link-action-btn" onclick="copyLink('${bioFullUrl}')">Kopieren</button>
       </div>`:''}
       <div class="section">
         <div class="bl-karte">
           <div class="bl-teil">
             <div class="bl-kopf"><span class="bl-titel">Aufrufe</span><span class="bl-meta">letzte 7 Tage</span></div>
             <div class="bl-drei">
               <div><b>${fmtNum(viewsToday)}</b><span>Heute</span></div>
               <div><b>${fmtNum(views7)}</b><span>7 Tage</span></div>
               <div><b>${fmtNum(viewsTotal)}</b><span>Gesamt</span></div>
             </div>
             ${viewsTotal>0?`<div class="chart-row" style="margin-top:12px">${chartBars}</div>`
               :`<div class="bl-leer" style="margin-top:10px">Noch keine Aufrufe in den letzten 7 Tagen.</div>`}
           </div>
           <div class="bl-teil">
             <div class="bl-kopf"><span class="bl-titel">Darauf klicken deine Besucher</span>
               <span class="bl-meta">30 Tage · ${klickrate}% Klickrate</span></div>
             ${klickHtml}
             ${klicks30>0?`<div class="bl-meta" style="margin-top:8px">Klickrate = Klicks je Aufruf${rateSeit?`, ab ${rateSeit}`:''}.</div>`:''}
           </div>
           <div class="bl-teil">
             <div class="bl-kopf"><span class="bl-titel">Von hier kommen sie</span>
               <span class="bl-meta">30 Tage · ${fmtNum(aufrufe30)}</span></div>
             ${herkunftHtml}
             ${aufrufe30>0?`<div class="bl-meta" style="margin-top:8px">„Direkt“ = ohne erkennbare Quelle.</div>`:''}
           </div>
           <div class="bl-teil">
             <div class="bl-kopf"><span class="bl-titel">Wann sie vorbeikommen</span>
               <span class="bl-meta">Ortszeit der Besucher</span></div>
             ${uhrHtml}
           </div>
         </div>
       </div>`
    :slug?`<div class="status-banner inactive"><div class="status-dot inactive"></div>
        <div><div class="status-text">Seite ist inaktiv<span>Seite wurde deaktiviert — du kannst sie jederzeit wieder aktivieren</span></div></div></div>`
    :''

  const themeCardsHtml=!isActive?buildThemeCards():''

  const checklistHtml=!allOk?`<div class="section">
    <div class="check-card">
      <div class="check-card-title">Checkliste</div>
      <div class="check-card-sub">Das Impressum ist gesetzlich vorgeschrieben.</div>
      ${checks.map(c=>`<div class="check-item">
        <div class="check-dot ${c.ok?'ok':'miss'}">${c.ok?icon('check',12):''}</div>
        <span class="check-label ${c.ok?'ok':'miss'}">${c.label}</span>
      </div>`).join('')}
    </div>
  </div>`:''

  const termsHtml=!isActive?`<div class="action-stack">
    <button class="action-btn action-btn-secondary" onclick="openBioEditMenu()">${icon('pencil',16)} Bearbeiten</button>
  </div>
  <div class="section">
    <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
      <input type="checkbox" id="terms-check" style="width:18px;height:18px;flex-shrink:0;accent-color:var(--text);margin-top:2px;cursor:pointer"/>
      <span style="font-size:13px;color:var(--muted);line-height:1.5">Ich akzeptiere die <a href="/legal#biopage_terms" target="_blank" style="color:var(--text);font-weight:600;text-decoration:underline">Nutzungsbedingungen</a> von viuno.</span>
    </label>
  </div>
  <div class="action-stack">
    <button class="action-btn action-btn-primary" id="btn-generate" onclick="generatePage()" disabled>
      BioLink erstellen
    </button>
  </div>`
  :`<div class="action-stack">
    <button class="action-btn action-btn-primary" onclick="openBioEditMenu()">${icon('pencil',16)} Bearbeiten</button>
  </div>`

  const deleteHtml=isActive
    ?`<div class="loesch-zeile">
        <button class="loesch-link" onclick="document.getElementById('delete-modal').classList.remove('hidden')">BioLink-Seite löschen</button>
      </div>`
    :''

  page.innerHTML=`
    ${statusHtml}
    ${themeCardsHtml}
    ${checklistHtml}
    ${termsHtml}
    ${deleteHtml}`

  // Wire terms checkbox
  if(!isActive){
    setTimeout(()=>{
      const tc=document.getElementById('terms-check')
      const bg=document.getElementById('btn-generate')
      if(!tc||!bg)return
      const update=()=>{bg.disabled=!tc.checked||!allOk}
      if(!allOk){bg.title='Bitte alle Punkte der Checkliste erfüllen'}
      blv?.ctx.on(tc,'change',update)
      update()
    },0)
  }

  initBioSheets()
}

/* Name, Bio und Profilbild stehen seit dem Template-Umbau fest im HTML der
   oeffentlichen Seite (fuer Link-Vorschauen in WhatsApp, LinkedIn & Co.).
   Aendert sich eines davon, muss die Seite neu erzeugt werden — im
   Hintergrund, ohne das Vollbild-Overlay von generatePage(). bio_active wird
   frisch gelesen: die Function wuerde eine Seite sonst neu anlegen und
   veroeffentlichen, die der User nie erstellt hat. */
/* Neubau der erzeugten BioLink-Seite.
   Noetig ist er nur fuer die eingebackenen Kopf-Tags (title, description,
   canonical, og:*) — also bei bio, profile_image_url, display_name und Theme.
   Name, Bio, Kanaele und Kontaktadresse liest die Seite zur Laufzeit aus
   biopage_v2; dafuer braucht es keinen Commit.
   Gibt das Ergebnis zurueck, damit das Profil einen sichtbaren Zustand zeigen
   kann statt eines leicht zu uebersehenden Toasts. `leise` unterdrueckt den
   Toast fuer Aufrufer, die selbst berichten. */
async function regenerateBioPageQuietly(uid, opt={}){
  try{
    const{data}=await sb.from('users').select('bio_active').eq('id',uid).single()
    if(data?.bio_active!==true)return {uebersprungen:true}
    const{data:{session}}=await sb.auth.getSession()
    if(!session)return {uebersprungen:true}
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json().catch(()=>({}))
    if(!res.ok||body.success!==true)throw new Error(body.error||`HTTP ${res.status}`)
    /* generate-biolink vergleicht die Bytes und committet nur bei echter
       Aenderung — 'unchanged' heisst: nichts zu melden. */
    return {ok:true, unveraendert: body.commit==='unchanged'}
  }catch(err){
    if(!opt.leise) showToast('Öffentliche Seite nicht aktualisiert: '+err.message,5000)
    return {ok:false, fehler:err.message}
  }
}

window.generatePage=async function(flow='biolinkCreate'){
  const btn=document.getElementById('btn-generate')
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Wird generiert…'}
  const loadingTimer=showLoadingOverlay(flow)
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||`HTTP ${res.status}`)
    await finishLoadingOverlay(loadingTimer)
    showToast('BioLink veröffentlicht ✓')
    if(blv&&!blv.ctx.stale)await loadBiolink()
  }catch(err){
    hideLoadingOverlay(loadingTimer)
    showToast('Fehler: '+err.message,5000)
    const b=document.getElementById('btn-generate')
    if(b){b.disabled=false;b.textContent=blv?.profile?.bio_active?'Seite neu generieren':'BioLink-Seite erstellen'}

async function onBioPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Max. 5 MB');return}
  const status=document.getElementById('photo-status')
  if(status)status.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{const bw=document.getElementById('profile-photo-wrap');if(bw)bw.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
  reader.readAsDataURL(file)
  const uid=blv?blv.uid:state.session.user.id
  const erg=await profilbildHochladen(file, uid, blv?.profile?.profile_image_url)
  if(erg.fehler){showToast(erg.fehler,4000);const sf=document.getElementById('photo-status');if(sf)sf.textContent='Fehler';return}
  const publicUrl=erg.publicUrl
  if(blv?.profile)blv.profile.profile_image_url=publicUrl
  const st=document.getElementById('photo-status')
  if(st)st.textContent='✓ Foto hochgeladen'
  showToast('Profilbild gespeichert ✓')
  e.target.value=''
  regenerateBioPageQuietly(uid)
}

window.selectTheme=function(t){if(!blv)return;blv.theme=t;updateThemeUI()}
function updateThemeUI(){
  ['color','dark','clean'].forEach(t=>{
    const opt=document.querySelector(`[data-theme="${t}"]`)
    const check=document.getElementById(`check-${t}`)
    if(opt)opt.classList.toggle('selected',blv?.theme===t)
    if(check)check.textContent=blv?.theme===t?'✓':''
  })
}
window.selectLang=function(l){
  if(!blv)return
  blv.lang=l
  document.querySelectorAll('.lang-opt').forEach(b=>b.classList.toggle('selected',b.dataset.lang===l))
}
window.saveThemeLang=async function(){
  if(!blv)return
  const btn=event.target;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  await sb.from('biolink_viuno').upsert({user_id:blv.uid,theme:blv.theme,default_language:blv.lang,updated_at:new Date().toISOString()},{onConflict:'user_id'})
  if(!blv)return
  /* Wie in pickThemeCard: die Signatur der App folgt dem Design der Seite. */
  if(blv.theme==='dark'||blv.theme==='clean')document.documentElement.setAttribute('data-thema',blv.theme)
  else document.documentElement.removeAttribute('data-thema')
  if(blv.biolink){blv.biolink.theme=blv.theme;blv.biolink.default_language=blv.lang}else{blv.biolink={user_id:blv.uid,theme:blv.theme,default_language:blv.lang}}
  btn.disabled=false;btn.textContent='Speichern'
  // Theme-Änderung erfordert Neu-Generierung (einzige Änderung die nicht live ist)
  if(blv.profile?.bio_active){
    // Hier alles schliessen: das Vollbild-Overlay der Generierung liegt sonst ueber dem Menue
    closeAllSheets()
    await generatePage('biolinkTheme')
  } else {
    backToEditMenu('theme-sheet')   // rendert das Menue mit dem neuen Label neu
    showToast('Design gespeichert ✓')
  }
  if(blv)document.querySelectorAll('.lang-opt').forEach(b=>b.classList.toggle('selected',b.dataset.lang===blv.lang))
}

function renderLinksSheet(){

  if(!list)return

window.confirmAddLink=async function(){
  if(!blv)return
  const title=document.getElementById('link-title').value.trim()
  const urlRaw=document.getElementById('link-url').value.trim()
  const isPaid=document.getElementById('link-paid').checked
  const hint=document.getElementById('link-hint')
  if(!title||!urlRaw){hint.textContent='Titel und URL sind Pflichtfelder.';return}
  const normalUrl=normalizeBrandUrl(urlRaw)
  if(!normalUrl){hint.textContent='Ungültige URL. Beispiel: nike.de';return}
  hint.textContent=''
  const position=blv.customLinks.length
  const{data,error}=await sb.from('biolink_custom_links').insert({
    user_id:blv.uid,title,url:normalUrl,is_paid:isPaid,position
  }).select().single()
  if(!blv)return
  if(error){hint.textContent='Fehler: '+error.message;return}
  blv.customLinks.push(data)
  closeSheet('add-link-sheet')
  renderLinksSheet()
  showToast('Link hinzugefügt ✓')
}

  if(!blv)return
  await sb.from('biolink_custom_links').delete().eq('id',id).eq('user_id',blv.uid)
  if(!blv)return
  blv.customLinks=blv.customLinks.filter(l=>l.id!==id)
  renderLinksSheet()
  showToast('Link gelöscht')
}

async function loadMediakit(){
  const uid = mkv.uid
  const[profileRes,mkRes,brandsRes,offersRes,analyseRes,viewsDailyRes,preiseRes,beitraegeRes]=await Promise.all([
    sb.from('users').select('display_name,full_name,profile_image_url,bio,instagram_handle,tiktok_handle,youtube_handle,threads_handle,impressum_text,mediakit_active,subscription_type,niche_category,city,contact_email,mediakit_views_total,mediakit_views_today,mediakit_views_last_7_days').eq('id',uid).single(),
    sb.from('mediakit_viuno').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('mediakit_brands').select('*').eq('user_id',uid).order('position',{ascending:true}),
    sb.from('mediakit_content_offers').select('offer_type').eq('user_id',uid),
    sb.from('analyse_stats').select('platform,engagement_rate,followers,avg_likes,avg_views,avg_comments,avg_shares,created_at').eq('user_id',uid).order('created_at',{ascending:true}),
    sb.rpc('get_mediakit_views_last_7_days_daily',{p_user_id:uid}),
    sb.from('mediakit_preise').select('*').eq('user_id',uid),
    sb.from('mediakit_beitraege').select('*').eq('user_id',uid).order('position',{ascending:true})
  ])
  if(!mkv||mkv.ctx.stale)return
  mkv.profile=profileRes.data||{}
  mkv.mkData=mkRes.data||{}
  mkv.brands=brandsRes.data||[]
  mkv.offers=new Set((offersRes.data||[]).map(r=>r.offer_type))
  mkv.preise={}
  for(const r of(preiseRes.data||[])) mkv.preise[r.offer_type]=r
  mkv.beitraege=beitraegeRes.data||[]
  mkv.analyseStats={}
  for(const row of(analyseRes.data||[])) mkv.analyseStats[row.platform]=row
  mkv.viewsTotal=mkv.profile.mediakit_views_total||0
  mkv.viewsToday=mkv.profile.mediakit_views_today||0
  mkv.views7Days=mkv.profile.mediakit_views_last_7_days||0
  mkv.viewsDaily=viewsDailyRes.data||[]
  mkv.isActive=mkv.profile.mediakit_active===true
  /* Im Hintergrund: Vorschaubilder der staerksten Beitraege sichern, solange
     die Plattform-Links noch leben. Blockiert das Zeichnen nicht. */
  mkBilderSichern()
  mkv.slug=mkv.profile.display_name?slugify(mkv.profile.display_name):null
  mkv.defaultLang=mkv.mkData?.default_language||'de'
  paintMediakit()
}

// ── Analyse-Drift-Check: neue Analyse vorhanden & weicht stark von Media Kit ab? ──
function getAnalysisDrift(){
  if(!mkv.isActive)return null
  const mk=mkv.mkData||{}
  const mkUpdated=mk.updated_at?new Date(mk.updated_at).getTime():0
  const flags=[]
  const ig=mkv.analyseStats.instagram
  if(ig&&ig.created_at&&new Date(ig.created_at).getTime()>mkUpdated&&ig.followers!=null&&mk.followers_instagram!=null&&mk.followers_instagram>0){
    if(Math.abs(ig.followers-mk.followers_instagram)/mk.followers_instagram>0.2)flags.push('Instagram')
  }
  const tt=mkv.analyseStats.tiktok
  if(tt&&tt.created_at&&new Date(tt.created_at).getTime()>mkUpdated&&tt.followers!=null&&mk.followers_tiktok!=null&&mk.followers_tiktok>0){
    if(Math.abs(tt.followers-mk.followers_tiktok)/mk.followers_tiktok>0.2)flags.push('TikTok')
  }
  return flags.length?flags.join(' & '):null
}

function paintMediakit(){
  const p=mkv.profile,mk=mkv.mkData||{}
  const isActive=mkv.isActive&&!!mkv.slug
  const kitUrl=mkv.slug?`viuno.de/kit/${mkv.slug}`:null
  const kitFullUrl=mkv.slug?`https://viuno.de/kit/${mkv.slug}`:null

  const viewsToday=mkv.viewsToday
  const views7=mkv.views7Days
  const viewsTotal=mkv.viewsTotal

  // 7-Tage-Chart-HTML
  const maxVal=Math.max(...mkv.viewsDaily.map(d=>d.view_count||0),1)
  const dayLbl=['So','Mo','Di','Mi','Do','Fr','Sa']
  const chartBars=mkv.viewsDaily.map(d=>{
    const v=d.view_count||0
    const h=Math.max((v/maxVal)*100,v>0?8:2)
    const dayShort=dayLbl[new Date(d.view_date+'T00:00:00').getDay()]
    return `<div class="chart-col" title="${v} Aufrufe">
      <div class="chart-bar-wrap"><div class="chart-bar ${v>0?'has':''}" style="height:${h}%"></div></div>
      <div class="chart-day">${dayShort}</div>
      <div class="chart-val">${v}</div>
    </div>`
  }).join('')
  const chartHtml=viewsTotal>0?`<div class="chart-wrap"><div class="chart-row">${chartBars}</div></div>`
    :`<div class="chart-empty">Noch keine Aufrufe in den letzten 7 Tagen.</div>`

  const checks=getChecks()
  const allChecksOk=checks.every(c=>c.ok)

  const statusHtml=isActive
    ?`<div class="status-banner active"><div class="status-dot active"></div>
        <div class="status-text">Media Kit ist live<span>Deine Seite ist öffentlich erreichbar</span></div></div>
       <div class="link-bar">
         <a class="link-url" href="${kitFullUrl}" target="_blank" rel="noopener">${kitUrl} ${icon('arrowUpRight',13)}</a>
         <button class="link-action-btn" onclick="copyLink('${kitFullUrl}')">Kopieren</button>
       </div>
       <div class="section">
         <div class="bl-karte">
           <div class="bl-teil">
             <div class="bl-kopf"><span class="bl-titel">Aufrufe</span><span class="bl-meta">letzte 7 Tage</span></div>
             <div class="bl-drei">
               <div><b>${fmtNum(viewsToday)}</b><span>Heute</span></div>
               <div><b>${fmtNum(views7)}</b><span>7 Tage</span></div>
               <div><b>${fmtNum(viewsTotal)}</b><span>Gesamt</span></div>
             </div>
             ${viewsTotal>0?`<div class="chart-row" style="margin-top:12px">${chartBars}</div>`
               :`<div class="bl-leer" style="margin-top:10px">Noch keine Aufrufe in den letzten 7 Tagen.</div>`}
           </div>
         </div>
       </div>`
    :`<div class="status-banner inactive"><div class="status-dot inactive"></div>
        <div class="status-text">Noch nicht aktiv<span>Trage deine Daten ein und erstelle dein Media Kit</span></div></div>`

  const drift=getAnalysisDrift()

window.openEditSubSheet=function(id){

    const p=mkv.profile||{}

    if(p.profile_image_url)bw.innerHTML=`<img src="${escHtml(p.profile_image_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    else bw.textContent=(p.display_name||'?')[0].toUpperCase()

    document.querySelectorAll('#mk-niche-grid .niche-btn').forEach(b=>b.classList.toggle('active',b.dataset.niche===mkv.niche))
    document.getElementById('s-city').value=p.city||''
    const pi=document.getElementById('s-pitch')
    if(pi)pi.value=(mkv.mkData||{}).pitch||''
  } else if(id==='contact-sheet'){
    document.getElementById('s-contact-email').value=mkv.profile?.contact_email||''
  } else if(id==='stats-sheet'){
    openStatsSheet();return
  } else if(id==='platforms-sheet'){
    openPlatformsSheet();return
  } else if(id==='konditionen-sheet'){
    const mk=mkv.mkData||{}
    document.getElementById('s-vorlauf').value=mk.vorlauf_tage??''
    document.getElementById('s-rechte').value=mk.nutzungsrechte||''
    document.getElementById('s-exkl').value=mk.exklusivitaet||''

  } else if(id==='audience-sheet'){
    openAudienceSheet();return
  } else if(id==='offers-sheet'){
    renderOffers()
    mkRenderPreise()
    const uEl=document.getElementById('s-ustg')
    if(uEl)uEl.value=(mkv.mkData||{}).preis_hinweis||''
  } else if(id==='brands-sheet'){
    renderBrandsList()
  } else if(id==='impressum-sheet'){
    document.getElementById('s-impressum').value=mkv.profile?.impressum_text||''
  } else if(id==='language-sheet'){
    // Aktuell gespeicherte Sprache als Auswahl markieren
    document.querySelectorAll('#language-sheet .lang-opt').forEach(b=>
      b.classList.toggle('selected',b.dataset.lang===mkv.defaultLang))
  }
  openSheet(id)
}

window.generateMK=async function(){
  const btn=document.getElementById('btn-create')
  const isUpdate=mkv?.isActive
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Wird generiert…'}
  const loadingTimer=showLoadingOverlay('mediakitCreate')
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-mediakit`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||`HTTP ${res.status}`)
    await finishLoadingOverlay(loadingTimer)
    showToast('Media Kit live ✓')
    if(mkv&&!mkv.ctx.stale)await loadMediakit()
  }catch(err){
    hideLoadingOverlay(loadingTimer)
    showToast('Fehler: '+err.message,5000)
    const b=document.getElementById('btn-create')
    if(b){b.disabled=false;b.textContent=isUpdate?'Media Kit aktualisieren':'Media Kit erstellen'}
  }
}

window.mkConfirmDelete=async function(){
  closeModal('delete-modal')
  const loadingTimer=showLoadingOverlay('mediakitDelete')
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-mediakit?action=delete`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||'Fehler')
    await finishLoadingOverlay(loadingTimer)
    showToast('Media Kit gelöscht')
    if(mkv&&!mkv.ctx.stale)await loadMediakit()
  }catch(err){hideLoadingOverlay(loadingTimer);showToast('Fehler: '+err.message,4000)}
}

// ── Photo Upload ──
async function onMkPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Max. 5 MB');return}
  const status=document.getElementById('photo-status')
  if(status)status.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{const bw=document.getElementById('profile-photo-wrap');if(bw)bw.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
  reader.readAsDataURL(file)
  const uid=mkv?mkv.uid:state.session.user.id
  const erg=await profilbildHochladen(file, uid, mkv?.profile?.profile_image_url)
  if(erg.fehler){showToast(erg.fehler,4000);const sf=document.getElementById('photo-status');if(sf)sf.textContent='Fehler';return}
  const publicUrl=erg.publicUrl
  if(mkv?.profile)mkv.profile.profile_image_url=publicUrl
  const st=document.getElementById('photo-status')
  if(st)st.textContent='✓ Foto hochgeladen'
  showToast('Profilbild gespeichert ✓')
  e.target.value=''
  regenerateBioPageQuietly(uid)
}

window.mkSaveProfile=async function(){

  const btn=event.target;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  /* Die Bio wird hier nicht mehr bearbeitet: auf dem Kit liest eine Marke den
     "Satz an Marken", die Bio richtet sich an Follower. Zwei Felder mit
     demselben Zweck an zwei Orten zu pflegen war die Quelle dafuer, dass auf
     dem Kit etwas anderes stand als auf der BioLink-Seite. Die Bio bleibt im
     Profil, users.bio wird von hier aus nicht mehr angefasst. */
  const patch={

    city:document.getElementById('s-city').value.trim()||null,
    updated_at:new Date().toISOString()

/* #10: Vier Kaesten mit Altersspannen und ohne Bezug sagten nicht, was
   einzutragen ist. Jetzt steht die Frage als Ueberschrift da, jedes Feld
   traegt sein Prozentzeichen, und die laufende Summe sagt, ob die Angaben
   zusammenpassen -- ohne zu blockieren: eine Marke kann auch mit 90 %
   etwas anfangen, aber nicht mit 300 %. */
window.mkAnteileSumme=function(){
  const zahl = id => { const v=parseInt(document.getElementById(id)?.value); return isNaN(v)?0:v }
  const zeige = (zielId, summe, leer) => {
    const el=document.getElementById(zielId); if(!el)return
    if(leer){ el.textContent=''; el.className='sheet-hint'; return }
    const passt = summe>=95 && summe<=105
    el.textContent = `Zusammen ${summe} %` + (passt?'':' — sollte etwa 100 % ergeben')
    el.className = 'sheet-hint' + (passt?'':' err')
  }
  const g=['s-female','s-male']
  const a=['s-alter1','s-alter2','s-alter3','s-alter4']
  zeige('mk-geschlecht-summe', g.reduce((x,id)=>x+zahl(id),0), g.every(id=>!document.getElementById(id)?.value))
  zeige('mk-alter-summe',      a.reduce((x,id)=>x+zahl(id),0), a.every(id=>!document.getElementById(id)?.value))
}

/* doAutofill() und switchStatsTab() sind am 16.09.2026 entfallen.
   Der Knopf "Aus Analyse uebernehmen" und die beiden Kanal-Reiter im
   Kennzahlen-Sheet gibt es nicht mehr: die Zahlen traegt seither der
   Trigger mediakit_sync_bei_puls selbst ein. Damit verschwindet auch die
   Aufgabe "Bring dein Media Kit auf Stand", die jede Woche wiederkam. */

/* Die gemessenen Werte stehen hier als ANZEIGE, nicht als Eingabe.
   Vorher gab es einen Knopf "Aus Analyse uebernehmen" und in der Folge jede
   Woche die Aufgabe "Bring dein Media Kit auf Stand". Eine Aufgabe, die eine
   Maschine erledigen kann, ist keine Aufgabe fuer einen Menschen: seit dem
   16.09. fuehrt der Trigger mediakit_sync_bei_puls die Zahlen selbst nach.

   Alters- und Laenderverteilung bleiben Handeingabe und stehen weiter im
   Zielgruppen-Sheet — die kann viuno nicht messen, und eine getippte Zahl,
   die wie eine Messung aussieht, schadet gegenueber einer Marke mehr als
   eine fehlende. */
const MK_AUTO_FELDER = [
  { k:'followers_instagram',    l:'Follower Instagram',   f:v=>fmt(v) },
  { k:'avg_views_instagram',    l:'Ø Aufrufe Instagram', f:v=>fmt(v) },
  { k:'avg_likes_instagram',    l:'Ø Likes Instagram',   f:v=>fmt(v) },
  { k:'er_instagram',           l:'Engagement Instagram', f:v=>fmt(v,2)+' %' },
  { k:'posts_woche_instagram',  l:'Beiträge/Woche IG',   f:v=>fmt(v,1) },
  { k:'followers_tiktok',       l:'Follower TikTok',      f:v=>fmt(v) },
  { k:'avg_views_tiktok',       l:'Ø Aufrufe TikTok',    f:v=>fmt(v) },
  { k:'er_tiktok',              l:'Engagement TikTok',    f:v=>fmt(v,2)+' %' },
  { k:'posts_woche_tiktok',     l:'Beiträge/Woche TikTok',f:v=>fmt(v,1) },
]

function mkAutoWerteZeichnen(){
  const el=document.getElementById('mk-auto-werte')
  if(!el||!mkv)return
  const mk=mkv.mkData||{}
  const hand=new Set(mk.hand_felder||[])
  const zeilen=MK_AUTO_FELDER.filter(f=>mk[f.k]!=null)
  if(!zeilen.length){
    el.innerHTML='<div class="bl-leer">Noch nichts gemessen. Nach deiner ersten Analyse stehen die Zahlen hier — und bleiben von selbst aktuell.</div>'
    return
  }
  const stand=mk.zuletzt_auto_am||mk.gemessen_am_instagram||mk.gemessen_am_tiktok
  el.innerHTML=zeilen.map(f=>`<div class="vl-zeile">
      <span class="vl-mitte">${escHtml(f.l)}</span>
      <span class="vl-rechts">${escHtml(f.f(mk[f.k]))}<span class="herk ${hand.has(f.k)?'hand':'auto'}">${hand.has(f.k)?'Hand':'auto'}</span></span>
    </div>`).join('')
    + (stand?`<div class="bl-leer" style="padding-top:10px">Zuletzt nachgeführt am ${escHtml(fmtDateDMY(stand))}.</div>`:'')
}

window.saveStats=async function(){
  if(!mkv)return
  const btn=event.target;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const igH=document.getElementById('s-ig-handle').value.trim().replace(/^@/,'')
  const ttH=document.getElementById('s-tt-handle').value.trim().replace(/^@/,'')
  const userPatch={
    instagram_handle:igH?'@'+igH:null,
    tiktok_handle:ttH?'@'+ttH:null,
    updated_at:new Date().toISOString()
  }
  /* Es wird nur noch geschrieben, welche Kanaele gemessen werden sollen.
     Die Kennzahlen selbst traegt der Trigger mediakit_sync_bei_puls ein.
     mediakit_viuno bekommt trotzdem eine Zeile, falls es noch keine gibt:
     der Trigger aktualisiert nur, er legt nichts an. */
  const[r1,r2]=await Promise.all([
    sb.from('users').update(userPatch).eq('id',mkv.uid),
    sb.from('mediakit_viuno').upsert({user_id:mkv.uid,updated_at:new Date().toISOString()},{onConflict:'user_id'})
  ])
  if(!mkv)return

    const{data:{session}}=await sb.auth.getSession()
    if(!session)return
    const res=await fetch(SUPABASE_URL+'/functions/v1/mediakit-bilder',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},

      if(mkv)mkv.beitraege=data||[]

/* aus /analytics/: Datum ohne Uhrzeit */
function fmtDateDMY(d){if(!d)return'–';return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
/* Schloss und Pfeil-Kreis gibt es nicht in ICONS -- sie stammen aus den alten
   Inline-Buttons und werden hier unveraendert weiterverwendet. */
const SVG_LOCK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
const SVG_REFRESH='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>'

/* B5: Der Vergleich laeuft gegen die letzte Analyse, nicht gegen eine Woche.
   Datumsformat kommt aus dem vorhandenen fmtDateShort (oben, aus /dashboard/).
   Zwischen zwei Laeufen lagen real 1, 23 und 109 Tage. */
function deltaSeitLabel(prevRow){
  const d=prevRow?.created_at
  return d?`seit letzter Analyse (${fmtDateShort(d)})`:'seit letzter Analyse'
}

/* View-lokaler Zustand, entspricht dem `S` der alten Seite */
let anv = null

async function renderAnalytics(area, ctx){
  const uid = state.session.user.id

  area.innerHTML = `
  <div class="view-analytics">
    <!-- KANAL WAEHLEN — ein Kauf deckt genau einen Kanal ab -->
    <div class="plat-cards" id="plat-cards"></div>

    <div class="modal-backdrop centered hidden" id="handle-modal" onclick="closeHandleModal()">

          </div>

          <input type="checkbox" id="modal-own-check"/>
          <label for="modal-own-check">Ich bestätige, dass dies meine eigenen Kanäle sind oder ich zur Auswertung berechtigt bin.</label>
        </div>

          <button class="modal-btn modal-btn-cancel" onclick="closeHandleModal()">Abbrechen</button>
          <button class="modal-btn modal-btn-confirm" id="modal-save-btn" onclick="saveHandles()">Speichern</button>
        </div>
      </div>
    </div>
  </div>`

  anv = {
    uid, ctx,
    profile:null,
    ki:{instagram:null,tiktok:null},
    stats:{instagram:null,tiktok:null},
    prevStats:{instagram:null,tiktok:null},
    platform:'instagram',
    runId:null, pollTimer:null,
    /* Option C: Guthaben und laufende Analyse haengen je an EINER Plattform. */
    purchases:{instagram:false,tiktok:false},
    lastDone:{instagram:null,tiktok:null},
    posts:{instagram:[],tiktok:[]},
    bilder:{},
    kaufOffen:false,
    activeRun:null,
    busy:null,
    /* Bis lastDone geladen ist, weiss niemand, ob oben die zwei Kaufkarten
       oder der eingeklappte Knopf hingehoeren. Vorher zeichnete
       refreshPurchaseState() die Karten sofort, loadKi() klappte sie eine
       Rundreise spaeter wieder zu -- sichtbar als Aufblitzen. */
    bereit:false
  }
  /* Das 5-Sekunden-Polling darf die Route nicht ueberleben. */
  ctx.onCleanup(() => {
    if(anv?.pollTimer)clearInterval(anv.pollTimer)
    anv = null
    document.body.style.overflow = ''
  })

  const{data:p}=await sb.from('users').select('display_name,full_name,profile_image_url,subscription_type,instagram_handle,tiktok_handle').eq('id',uid).single()

  anv.profile=p

  const checkout=params.get('checkout')
  const bezahltePlattform=(params.get('platform')||'').toLowerCase()
  if(checkout){
    // Query-Teil entfernen, Hash mitnehmen -- sonst verliert die SPA ihre Route
    history.replaceState({},'',location.pathname+location.hash)
  }
  if(checkout==='success'&&(bezahltePlattform==='instagram'||bezahltePlattform==='tiktok')){

  }
  if(ctx.stale)return

  await checkActiveRun()
  if(ctx.stale)return
  await loadKi()
  if(ctx.stale||!anv)return
  anv.bereit=true
  renderPlatformCards()
}

/* Ein Kauf deckt genau einen Kanal ab. Die Karte zeigt deshalb je Kanal den
   eigenen Zustand: kein Handle / kein Guthaben / Guthaben da / Analyse laeuft. */
function renderPlatformCards(){
  const el=document.getElementById('plat-cards')
  if(!el||!anv)return
  if(!anv.bereit){ el.innerHTML=''; el.classList.remove('eingeklappt'); return }
  const p=anv.profile||{}
  const laufend=anv.activeRun?.platform||null

  /* Nach einem fertigen Lauf steht oben nur noch ein Knopf. Zwei Kaufkarten
     direkt ueber dem frisch bezahlten Ergebnis lasen sich wie die Aufforderung,
     sofort nochmal zu zahlen. Die Karten kommen erst auf Klick zurueck --
     ausser es laeuft gerade etwas oder es liegt eine ungenutzte Freischaltung. */
  const fertig=!!(anv.lastDone.instagram||anv.lastDone.tiktok)
  const offeneFreischaltung=!!(anv.purchases.instagram||anv.purchases.tiktok)
  if(fertig&&!laufend&&!offeneFreischaltung&&!anv.kaufOffen){
    el.classList.add('eingeklappt')
    el.innerHTML=`<button class="btn-menue" onclick="kaufKlappe()" aria-expanded="false">
      ${SVG_REFRESH} Neue Analyse
      <svg class="btn-menue-pfeil" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>`
    return
  }
  el.classList.remove('eingeklappt')

  /* #18: Wer "Neue Analyse" aufklappt, muss auch wieder zuklappen koennen --
     sonst steht die Kaufaufforderung bis zum naechsten Routenwechsel. */
  const zuklappbar = fertig && !laufend && !offeneFreischaltung && anv.kaufOffen
  el.innerHTML = (zuklappbar ? `<button class="btn-menue offen" onclick="kaufKlappe()" aria-expanded="true">
      ${SVG_REFRESH} Neue Analyse
      <svg class="btn-menue-pfeil auf" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>` : '') + ['instagram','tiktok'].map(pl=>{
    const label=pl==='instagram'?'Instagram':'TikTok'
    const raw=pl==='instagram'?p.instagram_handle:p.tiktok_handle
    const handle=raw?('@'+String(raw).replace(/^@/,'')):null
    const letzte=anv.lastDone[pl]
    const busy=anv.busy===pl

    let body
    if(!handle){
      body=`<button class="btn-plat ghost" disabled>Kein Kanal verknüpft</button>
        <div class="plat-note">Hinterlege deinen ${label}-Handle, dann kannst du freischalten.
          <a class="plat-link" href="#/profile">Zum Profil</a></div>`
    } else if(laufend===pl){
      body=`<button class="btn-plat" disabled><span class="spinner"></span> Analyse läuft…</button>
        <div class="plat-note">Dauert etwa 1–2 Minuten. Du bekommst auch eine E-Mail, sobald sie fertig ist.</div>`
    } else if(laufend){
      body=`<button class="btn-plat ghost" disabled>Bitte warten</button>
        <div class="plat-note">Es läuft gerade eine ${laufend==='instagram'?'Instagram':'TikTok'}-Analyse.</div>`
    } else if(anv.purchases[pl]){
      body=`<button class="btn-plat" onclick="startPlatform('${pl}')" ${busy?'disabled':''}>
          ${busy?'<span class="spinner"></span> Wird gestartet…':SVG_REFRESH+' Analyse starten'}
        </button>
        <div class="plat-note">Freigeschaltet ✓ — dauert etwa 1–2 Minuten.</div>`
    } else {
      body=`<div class="plat-consent">
          <input type="checkbox" id="consent-${pl}"/>
          <label for="consent-${pl}">Ich stimme zu, dass die Analyse sofort nach Zahlung beginnt, und verliere damit mein 14-tägiges Widerrufsrecht.</label>
        </div>
        <button class="btn-plat" onclick="buyPlatform('${pl}')" ${busy?'disabled':''}>
          ${busy?'<span class="spinner"></span> Einen Moment…':SVG_LOCK+' Zahlungspflichtig freischalten – 9,99 €'}
        </button>
        <div class="plat-note">Einmalig pro Analyse, kein Abo.${letzte?` Deine letzte ${label}-Analyse: ${fmtDateShort(letzte)}`:''}<br>
          Mit dem Kauf gelten unsere <a class="plat-link" href="/legal#agb" target="_blank" rel="noopener">AGB</a>
          und die <a class="plat-link" href="/legal#widerruf" target="_blank" rel="noopener">Widerrufsbelehrung</a>.</div>`
    }

    return `<div class="plat-card${handle?'':' locked'}">
      <div class="plat-card-head">
        ${icon(pl==='instagram'?'instagram':'clapperboard',18)}
        <span class="plat-card-name">${label}</span>
      </div>
      <div class="plat-card-handle${handle?'':' missing'}">${handle?escHtml(handle):'nicht verknüpft'}</div>
      <div class="plat-card-spacer"></div>
      ${body}
    </div>`
  }).join('')
}

async function waitForPurchaseAfterPayment(platform){
  const banner=document.getElementById('pay-confirm')
  banner?.classList.remove('hidden')
  for(let i=0;i<8;i++){
    const{data}=await sb.from('analysis_purchases').select('id')
      .eq('user_id',anv.uid).eq('platform',platform).is('consumed_at',null).limit(1).maybeSingle()
    if(!anv||anv.ctx.stale)return
    if(data){
      anv.purchases[platform]=true
      banner?.classList.add('hidden')
      renderPlatformCards()
      showToast('Freigeschaltet ✓ — du kannst die Analyse jetzt starten.',4000)
      return
    }
    await new Promise(r=>setTimeout(r,2000))
    if(!anv||anv.ctx.stale)return
  }
  /* Der Webhook kann ein paar Sekunden brauchen. Die Zahlung ist trotzdem durch --
     das muss der Text sagen, sonst wirkt es wie ein Fehlkauf. */
  if(banner)banner.innerHTML='<span>Deine Zahlung ist eingegangen, die Freischaltung dauert noch einen Moment. Lade die Seite gleich noch einmal neu.</span>'
  await refreshPurchaseState()
}

/* Erzeugt den oeffentlichen Link oder gibt den vorhandenen zurueck. Pro Analyse
   genau einer -- zweimal Teilen ergibt nicht zwei Links. */
window.teilenLinkErzeugen=async function(runId){
  const knopf=document.getElementById('teilen-knopf')
  const ziel=document.getElementById('teilen-ergebnis')
  if(!knopf||!ziel)return
  knopf.disabled=true
  const vorher=knopf.innerHTML
  knopf.innerHTML='<span class="spinner"></span> Einen Moment…'
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(SUPABASE_URL+'/functions/v1/analyse-freigeben',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
      body:JSON.stringify({analysis_run_id:runId,aktion:'erzeugen'})
    })
    const d=await res.json()
    if(!d.success)throw new Error(d.error||'Fehlgeschlagen')
    ziel.innerHTML=teilenLinkHtml(runId,d)
    const url=location.origin+'/analyse/?a='+d.token
    knopf.innerHTML=vorher
    knopf.disabled=false
    if(navigator.share)navigator.share({title:'Meine viuno-Analyse',url}).catch(()=>{})
  }catch(e){
    knopf.innerHTML=vorher
    knopf.disabled=false
    showToast('Link konnte nicht erzeugt werden')
  }
}

/* Ein Kasten, zwei Aufrufer: frisch erzeugt und beim Laden nachgetragen.
   Vorher stand das Markup nur im Erzeugen-Zweig -- deshalb war nach einem
   Neuladen nichts mehr da. */
function teilenLinkHtml(runId,d){
  const url=location.origin+'/analyse/?a='+d.token
  const bis=new Date(d.expires_at).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})
  return `<div class="c-link-feld">
      <input type="text" readonly value="${escHtml(url)}" onclick="this.select()" aria-label="Öffentlicher Link"/>
      <button class="c-btn" style="flex:0 0 auto" onclick="teilenLinkKopieren('${escHtml(url)}')">Kopieren</button>
    </div>
    <div class="c-link-meta">
      Gültig bis ${escHtml(bis)}${d.aufrufe>0?` · ${fmt(d.aufrufe)} mal geöffnet`:''} ·
      <a href="${escHtml(url)}" target="_blank" rel="noopener">Ansehen</a> ·
      <a href="#" onclick="teilenLinkZuruecknehmen('${runId}');return false">Link zurückziehen</a>
    </div>`
}

/* ── Vor dem Start: Handle zeigen und bestaetigen lassen ──────────────
   Eine Analyse laeuft auf genau einem Handle, und der steht im Profil --
   irgendwann hinterlegt, vielleicht mit Tippfehler. Ging der Lauf damit los,
   war das Ergebnis "Wir konnten keine Beitraege abrufen", und der Weg zur
   Korrektur fuehrte ueber das Profil und wieder zurueck. Jetzt steht der
   Handle vor dem Start da und laesst sich an Ort und Stelle richtigstellen.

   Geaendert wird nur, wenn sich der Wert wirklich unterscheidet -- der
   Trigger sync_analytics_username schreibt sonst die bestehende
   creator_analytics-Zeile um, und alte Zahlen stuenden unter neuem Namen. */
const PLATTFORM_NAME={instagram:'Instagram',tiktok:'TikTok'}

window.startPlatform=function(platform){
  if(!anv||anv.busy)return
  handleAbfragen(platform)
}

function handleAbfragen(platform){
  const name=PLATTFORM_NAME[platform]||platform
  const feld=platform==='tiktok'?'tiktok_handle':'instagram_handle'
  const jetzt=(anv?.profile?.[feld]||'').replace(/^@/,'')
  let m=document.getElementById('ha-modal')
  if(!m){
    m=document.createElement('div'); m.id='ha-modal'; m.className='vs-modal'
    m.innerHTML=`<div class="vs-modal-card" role="dialog" aria-modal="true" aria-labelledby="ha-t" style="text-align:left">
      <div class="vs-modal-t" id="ha-t"></div>
      <div class="vs-modal-s" id="ha-s"></div>
      <label for="ha-input" style="font-size:var(--t-xs);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Handle</label>
      <input id="ha-input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false"
        style="width:100%;height:44px;padding:0 12px;border:1px solid var(--border-strong);border-radius:11px;background:var(--bg);color:var(--text);font:inherit;font-size:var(--t-input)"/>
      <div id="ha-hinweis" style="font-size:var(--t-xs);color:var(--subtle);line-height:1.45;min-height:16px"></div>
      <div class="vs-wand-btns" style="justify-content:stretch">
        <button type="button" class="vs-btn" style="flex:1" onclick="handleAbfrageZu()">Abbrechen</button>
        <button type="button" class="vs-btn vs-btn-p" style="flex:1" id="ha-los">Analyse starten</button>
      </div>
      <button type="button" class="vs-modal-x" onclick="handleAbfrageZu()" aria-label="Schließen">×</button>
    </div>`
    m.addEventListener('click',e=>{ if(e.target===m) handleAbfrageZu() })
    document.body.appendChild(m)
  }
  document.getElementById('ha-t').textContent=name+'-Analyse starten'
  document.getElementById('ha-s').textContent='Analysiert wird genau dieses Konto. Stimmt der Name nicht, kannst du ihn hier ändern.'
  const inp=document.getElementById('ha-input')
  inp.value=jetzt
  inp.placeholder='dein.'+platform.slice(0,2)+'.name'
  const hinweis=document.getElementById('ha-hinweis')
  const pruefen=()=>{
    const neu=inp.value.trim().replace(/^@/,'')
    hinweis.textContent = !neu ? 'Ohne Handle kann nichts abgerufen werden.'
      : neu.toLowerCase()!==jetzt.toLowerCase()
        ? 'Wird im Profil gespeichert. Frühere Zahlen dieses Kanals laufen danach unter dem neuen Namen.'
        : 'Das Profil muss öffentlich sein, sonst findet der Abruf nichts.'
    document.getElementById('ha-los').disabled=!neu
  }
  inp.oninput=pruefen; pruefen()
  document.getElementById('ha-los').onclick=()=>{
    const neu=inp.value.trim().replace(/^@/,'')
    if(!neu)return
    handleAbfrageZu()
    startPlatformWirklich(platform, neu, neu.toLowerCase()!==jetzt.toLowerCase() ? feld : null)
  }
  m.classList.add('offen')
  setTimeout(()=>inp.focus(),60)
}
window.handleAbfrageZu=function(){ document.getElementById('ha-modal')?.classList.remove('offen') }

async function startPlatformWirklich(platform, handle, feldZumSpeichern){
  if(!anv||anv.busy)return
  anv.busy=platform; renderPlatformCards()
  try{
    if(feldZumSpeichern){
      const { error:sp } = await sb.from('users').update({ [feldZumSpeichern]: handle }).eq('id', anv.uid)
      if(sp) throw new Error('Handle konnte nicht gespeichert werden')
      if(anv.profile) anv.profile[feldZumSpeichern]=handle
    }
    const{data:{session}}=await sb.auth.getSession()
    if(!session){showToast('Sitzung abgelaufen');location.reload();return}
    const res=await fetch(`${SUPABASE_URL}/functions/v1/start-analysis`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'},
      body:JSON.stringify({platform})
    })
    const body=await res.json().catch(()=>({}))
    if(!anv||anv.ctx.stale)return
    anv.busy=null
    if(res.status===402||body.error==='payment_required'){
      anv.purchases[platform]=false
      renderPlatformCards()
      showToast(body.message||'Für diese Analyse ist eine Freischaltung nötig.',4500)
      return
    }
    if(!res.ok||!body.success){
      renderPlatformCards()
      showToast(body.message||'Die Analyse konnte nicht gestartet werden.',5000)
      return
    }
    anv.platform=platform
    anv.runId=body.analysis_run_id
    const fakeRun={
      id:body.analysis_run_id,status:'scraping',platform,
      instagram_done_at:null,instagram_skipped:platform!=='instagram',
      tiktok_done_at:null,tiktok_skipped:platform!=='tiktok',
      error:null,started_at:new Date().toISOString()
    }
    showFlow(fakeRun);poll(body.analysis_run_id)
  }catch(err){
    if(!anv)return
    anv.busy=null; renderPlatformCards()
    showToast('Verbindung fehlgeschlagen. Bitte versuche es gleich noch einmal.',4000)
  }
}

// ── Load KI results ──
async function loadKi(){
  /* Mehr als die neueste Zeile laden: fuer die Delta-Beschriftung wird der
     Zeitpunkt der VORHERIGEN Analyse gebraucht ("seit letzter Analyse (13.09.)"
     statt des frueheren pauschalen "diese Woche"). */
  const[kiRes,statsRes]=await Promise.all([
    sb.from('analyse_ki').select('*').eq('user_id',anv.uid).order('created_at',{ascending:false}).limit(4),
    sb.from('analyse_stats').select('*').eq('user_id',anv.uid).order('created_at',{ascending:false}).limit(20)
  ])
  if(!anv||anv.ctx.stale)return
  if(kiRes.data?.length){
    anv.ki.instagram=kiRes.data.find(r=>r.platform==='instagram')||null
    anv.ki.tiktok=kiRes.data.find(r=>r.platform==='tiktok')||null
  }
  if(statsRes.data?.length){
    for(const pl of ['instagram','tiktok']){
      const rows=statsRes.data.filter(r=>r.platform===pl)
      anv.stats[pl]=rows[0]||null
      anv.prevStats[pl]=rows[1]||null
      anv.lastDone[pl]=rows[0]?.created_at||null
    }
    /* Punkt 8: die Einzel-Beitraege des neuesten Laufs -- eine Ø-Zahl verschluckt,
       dass die Spanne hier von 312 bis 21.735 Likes reicht. */
    const runIds=['instagram','tiktok'].map(pl=>anv.stats[pl]?.analysis_run_id).filter(Boolean)
    if(runIds.length){
      const{data:pd}=await sb.from('apify_daten')
        .select('platform,analysis_run_id,likes,views,posted_at,post_url')
        .in('analysis_run_id',runIds)
      if(!anv||anv.ctx.stale)return
      for(const pl of ['instagram','tiktok']){
        const rid=anv.stats[pl]?.analysis_run_id
        anv.posts[pl]=rid?(pd||[]).filter(r=>r.analysis_run_id===rid&&r.platform===pl)
          .sort((x,y)=>new Date(x.posted_at||0)-new Date(y.posted_at||0)):[]
      }

      /* #16: Vorschaubilder gibt es laengst -- mediakit-bilder legt sie fuer
         das Media Kit im Bucket ab. In der Rangliste stand ein Beitrag bisher
         nur als Datum und Uhrzeit da; mit Bild erkennt man ihn wieder, ohne
         ihn zu oeffnen. Zugeordnet ueber post_url, den beide Tabellen fuehren. */
      const{data:bilder}=await sb.from('mediakit_beitraege')
        .select('post_url,bild_pfad').eq('user_id',anv.uid).not('bild_pfad','is',null)
      if(!anv||anv.ctx.stale)return
      anv.bilder={}
      for(const b of (bilder||[])) if(b.post_url) anv.bilder[b.post_url]=b.bild_pfad
    }
  }
  renderPlatformCards()
  renderAnalyticsContent()
}
