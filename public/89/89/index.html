// ── Status Flow ──
function showFlow(run){
  document.getElementById('status-flow').classList.remove('hidden')
  /* Der laufende Kanal wird in den Karten als "Analyse läuft…" gezeigt,
     der andere als "Bitte warten" -- ein globaler Button existiert nicht mehr. */
  anv.activeRun=run
  anv.busy=null
  renderPlatformCards()
  renderFlow(run)
}

function renderFlow(run){
  /* Ein Lauf deckt genau eine Plattform ab. Frueher richteten sich die Schritte
     nach den hinterlegten Handles -- jetzt nach dem, was dieser Lauf wirklich tut. */
  const hasIg=run.platform?run.platform==='instagram':!run.instagram_skipped
  const hasTt=run.platform?run.platform==='tiktok':!run.tiktok_skipped
  const igDone=run.instagram_done_at||run.instagram_skipped
  const ttDone=run.tiktok_done_at||run.tiktok_skipped
  const s=run.status

  const steps=[]
  steps.push({label:'Analyse gestartet',state:'done'})
  if(hasIg)steps.push({label:'Instagram-Beiträge werden abgerufen',state:igDone?'done':(s==='scraping'&&!igDone?'active':'wait')})
  if(hasTt)steps.push({label:'TikTok-Videos werden abgerufen',state:ttDone?'done':(s==='scraping'&&igDone&&!ttDone?'active':hasTt&&!ttDone?'wait':'done')})
  steps.push({label:'Auswertung läuft',state:s==='analyzing'?'active':(s==='done'?'done':'wait')})
  steps.push({label:'Ergebnisse bereit',state:s==='done'?'done':'wait'})

  document.getElementById('flow-steps').innerHTML=steps.map(st=>`
    <div class="flow-step">
      <div class="step-dot ${st.state}">${st.state==='done'?icon('check',11):st.state==='active'?'<span class="spinner" style="width:8px;height:8px;border-width:1.5px"></span>':''}</div>
      <div class="step-label ${st.state}">${st.label}</div>
    </div>`).join('')

  const isDone=s==='done', isFailed=s==='failed'
  const iconEl=document.getElementById('flow-icon')
  const title=document.getElementById('flow-title')
  const sub=document.getElementById('flow-sub')
  /* B8: Ein Teilfehler laesst den Run auf 'done' stehen, der Kauf ist trotzdem
     verbraucht. Der Hinweis darf deshalb nicht nur im failed-Zweig erscheinen. */
  if(isDone&&run.error){iconEl.innerHTML=icon('x',16);iconEl.className='flow-icon error';title.textContent='Analyse teilweise abgeschlossen';sub.textContent=run.error}
  else if(isDone){iconEl.innerHTML=icon('check',16);iconEl.className='flow-icon done';title.textContent='Analyse abgeschlossen';sub.textContent='Deine Ergebnisse wurden aktualisiert'}
  else if(isFailed){iconEl.innerHTML=icon('x',16);iconEl.className='flow-icon error';title.textContent='Analyse fehlgeschlagen';sub.textContent=run.error||'Bitte versuche es erneut'}
  else{iconEl.innerHTML='<span class="spinner-dark"></span>';iconEl.className='flow-icon running';title.textContent='Analyse läuft';sub.textContent=s==='analyzing'?'Auswertung läuft…':'Daten werden abgerufen…'}
}

// ── Polling ──
function poll(runId){
  if(anv.pollTimer)clearInterval(anv.pollTimer)
  anv.pollTimer=setInterval(async()=>{
    const{data:run}=await sb.from('analysis_runs').select('*').eq('id',runId).single()
    if(!anv||anv.ctx.stale)return
    if(!run)return
    renderFlow(run)
    if(run.status==='done'||run.status==='failed'){
      clearInterval(anv.pollTimer);anv.pollTimer=null
      anv.activeRun=null
      if(run.status==='done'){
        anv.kaufOffen=false
        const{data:p}=await sb.from('users').select('instagram_handle,tiktok_handle,subscription_type').eq('id',anv.uid).single()
        if(!anv||anv.ctx.stale)return
        if(p)anv.profile={...anv.profile,...p}
        await refreshPurchaseState()
        if(!anv||anv.ctx.stale)return
        await loadKi()
        if(!anv||anv.ctx.stale)return
        showToast(run.error?'Analyse teilweise fertig':'Analyse fertig ✓',run.error?5000:undefined)
        /* Bei einem Teilfehler bleibt der Kasten stehen -- der Hinweis darf nicht wegblenden. */
        if(!run.error)setTimeout(()=>{document.getElementById('status-flow')?.classList.add('hidden')},4000)
      } else {
        await refreshPurchaseState()
        if(!anv||anv.ctx.stale)return
        showToast(run.error||'Analyse fehlgeschlagen — deine Freischaltung bleibt erhalten',6000)
      }
    }
  },5000)
}

// ── Handle Modal ──
window.openHandleModal=function(){
  const p=anv?.profile
  document.getElementById('modal-ig').value=p?.instagram_handle?p.instagram_handle.replace(/^@/,''):''
  document.getElementById('modal-tt').value=p?.tiktok_handle?p.tiktok_handle.replace(/^@/,''):''
  document.getElementById('modal-ig-hint').textContent=''
  document.getElementById('modal-tt-hint').textContent=''
  document.getElementById('modal-own-hint').textContent=''
  document.getElementById('modal-own-check').checked=false
  document.getElementById('handle-modal').classList.remove('hidden')
  document.body.style.overflow='hidden'
}
window.closeHandleModal=function(){
  document.getElementById('handle-modal')?.classList.add('hidden')
  document.body.style.overflow=''
}
window.saveHandles=async function(){
  if(!anv)return
  const ig=document.getElementById('modal-ig').value.trim().replace(/^@/,'')
  const tt=document.getElementById('modal-tt').value.trim().replace(/^@/,'')
  const igH=document.getElementById('modal-ig-hint')
  const ttH=document.getElementById('modal-tt-hint')
  igH.textContent='';ttH.textContent=''
  if(!ig&&!tt){igH.textContent='Mindestens ein Handle eingeben.';igH.className='modal-hint err';return}
  const re=/^[a-zA-Z0-9._]{1,50}$/
  if(ig&&!re.test(ig)){igH.textContent='Ungültiges Format (Buchstaben, Zahlen, . und _)';igH.className='modal-hint err';return}
  if(tt&&!re.test(tt)){ttH.textContent='Ungültiges Format (Buchstaben, Zahlen, . und _)';ttH.className='modal-hint err';return}
  /* AGB 4.4: Die Analyse darf nur auf eigene Kanaele angewendet werden. */
  const ownH=document.getElementById('modal-own-hint')
  ownH.textContent=''
  if(!document.getElementById('modal-own-check').checked){
    ownH.textContent='Bitte bestätige, dass es deine eigenen Kanäle sind.';ownH.className='modal-hint err';return
  }
  const btn=document.getElementById('modal-save-btn')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const patch={}
  if(ig)patch.instagram_handle='@'+ig
  if(tt)patch.tiktok_handle='@'+tt
  await sb.from('users').update(patch).eq('id',anv.uid)
  if(!anv)return
  anv.profile={...anv.profile,...patch}
  closeHandleModal()
  btn.disabled=false;btn.textContent='Speichern'
  renderPlatformCards()
  renderAnalyticsContent()
  showToast('Kanal gespeichert ✓')
}

// ── Render Content ──
function renderAnalyticsContent(){
  const p=anv.profile
  const pl=anv.platform
  const ki=anv.ki[pl]
  const hasHandle=pl==='instagram'?!!(p?.instagram_handle):!!(p?.tiktok_handle)
  const el=document.getElementById('analytics-content')
  const label=pl==='instagram'?'Instagram':'TikTok'

  if(!hasHandle){
    el.innerHTML=`<div class="section" style="margin-top:12px"><div class="empty-state">
      <div class="empty-icon">${icon('atSign',30)}</div>
      <div class="empty-title">Kein ${label}-Handle</div>
      <div class="empty-sub">Verknüpfe deinen Kanal um die Analyse nutzen zu können.</div>
      <button class="btn-empty" onclick="openHandleModal()">Kanal verknüpfen</button>
    </div></div>`
    return
  }
  if(!ki){
    el.innerHTML=`<div class="section" style="margin-top:12px"><div class="empty-state">
      <div class="empty-icon">${icon('barChart',30)}</div>
      <div class="empty-title">Noch keine ${label}-Analyse</div>
      <div class="empty-sub">Wir lesen deine letzten 36 Beiträge aus und sagen dir, was sie verbindet:
        welche Captions ziehen, welches Format trägt, wann du am besten postest — und vier konkrete
        nächste Schritte. Schalte ${label} oben frei, um zu starten.</div>
    </div></div>`
    return
  }

  const st=anv.stats[pl]
  const posts=anv.posts[pl]||[]
  const date=fmtDateDMY(ki.created_at)
  const handle=st?.username?'@'+String(st.username).replace(/^@/,''):label

  /* Deutsche Schreibweise, eine Stelle. Gerechnet wird hier nichts mehr --
     alle Werte kommen fertig aus analyse_stats. */
  const deN=(n,k=0)=>(n==null||isNaN(+n))?'–':(+n).toLocaleString('de-DE',{minimumFractionDigits:k,maximumFractionDigits:k})
  /* Fest auf Berliner Zeit, nicht auf die Zeitzone des Geräts. Der Prompt rechnet
     serverseitig ebenfalls in Berliner Zeit -- nur wenn beide dieselbe Uhrzeit
     nennen, findet die Verlinkung den Beitrag, den der Text meint. */
  const TZ={timeZone:'Europe/Berlin'}
  const tag=(d)=>d?new Date(d).toLocaleDateString('de-DE',{...TZ,day:'2-digit',month:'2-digit'}):'–'
  const uhr=(d)=>d?new Date(d).toLocaleTimeString('de-DE',{...TZ,hour:'2-digit',minute:'2-digit'}):''

  /* Punkt 5: Im Text steht "der Beitrag vom 09.09." -- bei drei Beiträgen an
     einem Tag weiß niemand, welcher gemeint ist. Deshalb wird jede Datumsangabe
     anklickbar gemacht. Mit Uhrzeit ist sie eindeutig; ohne Uhrzeit nur dann,
     wenn an dem Tag genau ein Beitrag erschienen ist. Sonst bleibt es Text --
     lieber kein Link als einer auf den falschen Beitrag. */
  const proTag={}
  ;(Array.isArray(st?.post_resonanz)?st.post_resonanz:[]).forEach(x=>{
    if(!x.datum||!x.url)return
    const k=tag(x.datum)
    ;(proTag[k]=proTag[k]||[]).push({url:x.url,zeit:uhr(x.datum)})
  })
  const verlinke=t=>escHtml(String(t||'')).replace(
    /(\d{2}\.\d{2}\.)(\s+um\s+(\d{1,2})[:.](\d{2})(\s*Uhr)?)?/g,
    (treffer,datum,_rest,hh,mm)=>{
      const liste=proTag[datum]
      if(!liste)return treffer
      let ziel=null
      if(hh!=null){const z=String(hh).padStart(2,'0')+':'+mm; ziel=liste.find(x=>x.zeit===z)}
      else if(liste.length===1)ziel=liste[0]
      if(!ziel)return treffer
      return '<a class="c-datum" href="'+escHtml(ziel.url)+'" target="_blank" rel="noopener">'+treffer+'</a>'
    })
  const absatz=t=>String(t||'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(x=>`<p>${verlinke(x)}</p>`).join('')

  let h='<div class="ckpt">'

  /* Der Kopf traegt die Kernaussage als Ueberschrift. Wer bezahlt hat, soll als
     Erstes den Befund lesen und nicht noch einmal seinen eigenen Kanalnamen. */
  const zeitraum=(()=>{
    const mitDatum=posts.filter(x=>x.posted_at).map(x=>new Date(x.posted_at)).sort((a,b)=>a-b)
    if(mitDatum.length<2)return ''
    return ` vom ${tag(mitDatum[0])} bis ${tag(mitDatum[mitDatum.length-1])}`
  })()
  h+=`<div class="c-head">
    <div class="c-eyebrow">${label} · ${escHtml(handle)} · ${date}</div>
    <h1>${escHtml(ki.kernaussage||'Deine Auswertung')}</h1>
    <div class="c-sub">${posts.length?`${deN(posts.length)} Beiträge${zeitraum}.`:''} Alle Zahlen stammen aus diesem Lauf.</div>
  </div>`

  if(st){
    /* Kacheln: gefaerbt wird nur, wo die Farbe etwas behauptet. Ein Durchschnitt
       ist weder gut noch schlecht -- die staerksten und schwaechsten Beitraege
       dagegen sind genau das, und die Followerbewegung hat eine Richtung. */
    const kachel=(k,num,s,cls='')=>`<div class="c-tile ${cls}"><div class="c-k">${k}</div><div class="c-num">${num}</div><div class="c-s">${s}</div></div>`
    const seit=deltaSeitLabel(anv.prevStats[pl])
    const fd=st.followers_change
    const fCls=st.handle_changed?'':(fd>0?'ok':(fd<0?'bad':''))
    const fSub=st.handle_changed?'Handle geändert – kein Vergleich'
      :(fd!=null?`${fd>=0?'+':'−'}${deN(Math.abs(fd))} ${seit}`:'Erste Messung')

    const kacheln=[]
    if(st.avg_views!=null)kacheln.push(kachel('Ø Aufrufe',fmt(st.avg_views),'pro Beitrag','cool'))
    if(st.resonanz_schnitt!=null)kacheln.push(kachel('Resonanz',deN(st.resonanz_schnitt,1),`von 1.000 Zuschauern liken ${deN(st.resonanz_schnitt,0)}`,'cool'))
    if(st.resonanz_top!=null)kacheln.push(kachel('Stärkste',deN(st.resonanz_top,1),`von 1.000 Zuschauern liken ${deN(st.resonanz_top,0)}`,'ok'))
    if(st.resonanz_flop!=null)kacheln.push(kachel('Schwächste',deN(st.resonanz_flop,1),`von 1.000 Zuschauern liken ${deN(st.resonanz_flop,0)}`,'bad'))
    kacheln.push(kachel('Follower',deN(st.followers),fSub,fCls))
    kacheln.push(kachel('Ø Likes',fmt(st.avg_likes),'pro Beitrag'))
    kacheln.push(kachel('Ø Kommentare',fmt(st.avg_comments),'pro Beitrag'))
    if(st.kommentarrate_schnitt!=null)kacheln.push(kachel('Kommentare',deN(st.kommentarrate_schnitt,1),`von 1.000 Zuschauern kommentieren ${deN(st.kommentarrate_schnitt,0)}`))
    if(st.engagement_rate!=null)kacheln.push(kachel('Je Follower',deN(st.engagement_rate,2)+' %','Likes plus Kommentare'))
    if(st.posts_per_week!=null)kacheln.push(kachel('Beiträge',deN(st.posts_per_week,1),'pro Woche'))
    h+=`<div class="c-grid">${kacheln.join('')}</div>`

    /* Punkt 8 aus dem Entwurf: zwei Balken je Beitrag. Oben die Reichweite,
       unten wie viele davon reagiert haben. Der Durchschnitt verschweigt, dass
       ein einziger Beitrag ihn traegt -- hier steht es nebeneinander. */
    const pr=(Array.isArray(st.post_resonanz)?st.post_resonanz:[]).filter(x=>x.views>0&&x.resonanz!=null)
    if(pr.length>=4){
      const d=[...pr].sort((a,b)=>new Date(a.datum||0)-new Date(b.datum||0))
      const maxV=Math.max(...d.map(x=>x.views),1)
      const maxR=Math.max(...d.map(x=>x.resonanz),1)
      const stark=st.resonanz_top??maxR, schwach=st.resonanz_flop??0
      const W=760,PADL=8,PADR=8,TOP=14,MID=140,BOT=216
      const slot=(W-PADL-PADR)/d.length, bw=slot*0.6, off=(slot-bw)/2
      /* Ein Datum braucht rund 36 px. Passen nicht alle nebeneinander, wird nur
         jedes n-te beschriftet; die Zahl ueber dem Balken faellt ganz weg,
         sobald sie sich mit dem Nachbarn ueberlappen wuerde. */
      const jedes=Math.max(1,Math.ceil(36/slot))
      const zeigeWert=slot>=26
      let svg=''
      d.forEach((x,i)=>{
        const bx=PADL+i*slot+off
        const hv=Math.max(3,(x.views/maxV)*(MID-TOP))
        svg+=`<rect x="${bx.toFixed(1)}" y="${(MID-hv).toFixed(1)}" width="${bw.toFixed(1)}" height="${hv.toFixed(1)}" rx="3" fill="var(--c-cool)" opacity="${x.views>=maxV*0.6?1:.5}"></rect>`
        const hr=Math.max(3,(x.resonanz/maxR)*(BOT-MID-28))
        const farbe=x.resonanz>=stark?'var(--c-ok)':(x.resonanz<=schwach?'var(--c-bad)':'var(--c-line2)')
        svg+=`<rect x="${bx.toFixed(1)}" y="${MID+16}" width="${bw.toFixed(1)}" height="${hr.toFixed(1)}" rx="3" fill="${farbe}"></rect>`
        if(i%jedes===0||i===d.length-1)
          svg+=`<text x="${(bx+bw/2).toFixed(1)}" y="${BOT+20}" text-anchor="middle" font-size="10.5" fill="var(--c-fg3)" font-family="Inter, sans-serif">${escHtml(tag(x.datum))}</text>`
        if(zeigeWert)
          svg+=`<text x="${(bx+bw/2).toFixed(1)}" y="${MID+11}" text-anchor="middle" font-size="10" fill="var(--c-fg3)" font-family="Inter, sans-serif">${deN(x.resonanz,1)}</text>`
      })
      svg+=`<line x1="${PADL}" y1="${MID+2}" x2="${W-PADR}" y2="${MID+2}" stroke="var(--c-line)" stroke-width="1"></line>`
      /* Beide Haelften haben einen eigenen Maßstab. Ohne diese zwei Beschriftungen
         liest man einen kurzen Balken oben ueber einem langen Balken unten als
         Fehler -- tatsaechlich heißt es: wenig Reichweite, starke Reaktion. */
      svg+=`<text x="${PADL}" y="${TOP-2}" font-size="10.5" fill="var(--c-fg3)" font-family="Inter, sans-serif">${fmt(maxV)} Aufrufe \u2500 h\u00f6chster Wert oben</text>`
      svg+=`<text x="${PADL}" y="${BOT+8}" font-size="10.5" fill="var(--c-fg3)" font-family="Inter, sans-serif">von 1.000 Zuschauern liken bis zu ${deN(maxR,0)} \u2500 h\u00f6chster Wert unten</text>`
      h+=`<div class="c-panel">
        <h2>Jeder Beitrag einzeln</h2>
        <p class="c-lede">Oben die Aufrufe, unten wie viele davon reagiert haben. Chronologisch von links.
          Beide Hälften haben einen eigenen Maßstab — ein kurzer Balken oben über einem langen unten
          heißt: wenig Reichweite, aber starke Reaktion.</p>
        <div class="c-legend">
          <span><i style="background:var(--c-cool)"></i>Aufrufe</span>
          <span><i style="background:var(--c-ok)"></i>starke Resonanz</span>
          <span><i style="background:var(--c-bad)"></i>schwache Resonanz</span>
        </div>
        <div class="c-chart" style="--c-chart-min:${Math.max(520,d.length*22)}px"><svg viewBox="0 0 ${W} 248" width="100%" role="img" aria-label="Aufrufe und Resonanz je Beitrag">${svg}</svg></div>
      </div>`
    }
  }

  /* Gegenueberstellung: was getragen hat und wo Wirkung liegen bleibt.
     Die grosse Zahl links ist die Resonanz der staerksten Beitraege, rechts die
     des Beitrags mit viel Reichweite und wenig Reaktion. */
  if(ki.was_gut_lief||ki.verbesserungspotenzial){
    h+=`<div class="c-split">`
    if(ki.was_gut_lief){
      h+=`<div class="c-box ok"><span class="c-chip">Das trägt</span>
        ${st?.resonanz_top!=null?`<div class="c-big">${deN(st.resonanz_top,1)}</div>`:''}
        <h3>Was funktioniert hat</h3>${absatz(ki.was_gut_lief)}</div>`
    }
    if(ki.verbesserungspotenzial){
      const a=st?.ausreisser
      h+=`<div class="c-box bad"><span class="c-chip">Hier liegt Wirkung</span>
        ${a?.resonanz!=null?`<div class="c-big">${deN(a.resonanz,1)}</div>`:''}
        <h3>${a?`${deN(a.views)} Aufrufe, kaum Reaktion`:'Wo Wirkung verloren geht'}</h3>
        ${absatz(ki.verbesserungspotenzial)}</div>`
    }
    h+=`</div>`
  }

  if(ki.reichweite_resonanz){
    h+=`<div class="c-box cool"><span class="c-chip">Reichweite gegen Resonanz</span>
      <h3>Ausgespielt heißt nicht angekommen</h3>${absatz(ki.reichweite_resonanz)}</div>`
  }

  /* Toene: die Tabelle ist der eigentliche Befund. Derselbe Ton liefert voellig
     verschiedene Ergebnisse -- damit ist der verbreitete "nimm den richtigen
     Sound"-Rat fuer diesen Kanal widerlegt, und zwar mit seinen eigenen Zahlen. */
  const snd=Array.isArray(st?.sound_stats)?st.sound_stats:[]
  if(snd.length||ki.sound_befund){
    h+=`<div class="c-box cool"><span class="c-chip">${snd.length?'Widerlegt':'Töne'}</span>
      <h3>${snd.length?'Am Ton allein liegt es nicht':'Was die Tonspur verrät'}</h3>`
    if(snd.length){
      const spalten=Math.max(...snd.map(x=>x.werte.length))
      const kopf=Array.from({length:spalten},(_,i)=>
        `<th class="n">${i===0?'Stärkster':(i===spalten-1?'Schwächster':'dazwischen')}</th>`).join('')
      h+=`<div class="c-tbl-wrap"><table class="c-tbl"><thead><tr><th>Ton</th>${kopf}<th class="n">Faktor</th></tr></thead><tbody>`
      snd.forEach(x=>{
        const zellen=Array.from({length:spalten},(_,i)=>{
          const w=x.werte[i]
          if(w==null)return '<td class="n">–</td>'
          const cls=i===0&&x.werte.length>1&&x.faktor>=1.5?'up':(i===x.werte.length-1&&x.werte.length>1&&x.faktor>=1.5?'down':'')
          return `<td class="n ${cls}">${deN(w,1)}</td>`
        }).join('')
        h+=`<tr><td>${escHtml(x.sound)}</td>${zellen}<td class="n">${deN(x.faktor,1)}×</td></tr>`
      })
      h+=`</tbody></table></div>`
      h+=`<p style="margin-top:12px">Alle Werte sagen, wie viele von 1.000 Zuschauern liken — vom stärksten zum schwächsten Einsatz sortiert.</p>`
    }
    if(ki.sound_befund)h+=absatz(ki.sound_befund)
    if(st?.eigener_ton&&st.eigener_ton.gesamt>0&&st.eigener_ton.mit===0){
      h+=`<p>Alle ${deN(st.eigener_ton.gesamt)} ausgewerteten Beiträge laufen auf fremdem Ton. Zu eigener Tonspur hast du bisher keinen einzigen Messwert.</p>`
    }
    h+=`</div>`
  }

  if(ki.top_posts_gemeinsamkeiten||ki.caption_struktur){
    h+=`<div class="c-split">`
    if(ki.top_posts_gemeinsamkeiten)h+=`<div class="c-box"><span class="c-chip">Das Muster</span>
      <h3>Was die starken Beiträge verbindet</h3>${absatz(ki.top_posts_gemeinsamkeiten)}</div>`
    if(ki.caption_struktur)h+=`<div class="c-box"><span class="c-chip">Der Aufbau</span>
      <h3>Wie deine Texte gebaut sind</h3>${absatz(ki.caption_struktur)}</div>`
    h+=`</div>`
  }

  if(ki.weglassen){
    h+=`<div class="c-box amber"><span class="c-chip">Weglassen</span>
      <h3>Was weniger werden sollte</h3>${absatz(ki.weglassen)}</div>`
  }

  if(ki.top_posts?.length){
    h+=`<div class="c-panel"><h2>Die stärksten Beiträge</h2>
      <p class="c-lede">Nach Likes sortiert, mit der Begründung aus den Daten.</p>
      <div class="c-tbl-wrap"><table class="c-tbl"><thead><tr><th>Datum</th><th>Warum</th><th class="n">Likes</th></tr></thead><tbody>`
    ki.top_posts.forEach(post=>{
      const datum=post.datum||'–'
      const text=verlinke(post.warum_top||'')
      const zelle=post.url?`<a href="${escHtml(post.url)}" target="_blank" rel="noopener">${text}</a>`:text
      h+=`<tr><td class="c-mono" style="white-space:nowrap">${verlinke(datum)}</td><td>${zelle}</td><td class="n">${deN(post.likes)}</td></tr>`
    })
    h+=`</tbody></table></div></div>`
  }

  if(st?.best_posting_day||st?.best_posting_hour!=null){
    const n=st.best_time_sample
    const unsicher=n!=null&&n<20
    h+=`<div class="c-box ${unsicher?'amber':'cool'}"><span class="c-chip">${unsicher?'Mit Vorbehalt':'Aus deinen Daten'}</span>
      <h3>${escHtml(st.best_posting_day||'')}${st.best_posting_day&&st.best_posting_hour!=null?', ':''}${st.best_posting_hour!=null?st.best_posting_hour+' Uhr':''}</h3>
      <p>Zu dieser Zeit sind deine stärkeren Beiträge erschienen${n!=null?`, gerechnet über ${deN(n)} Beiträge`:''}.${unsicher?' Für eine Regel ist das zu wenig — behandle es als Tendenz.':''}</p></div>`
  }

  /* Vergleiche nur innerhalb derselben Metrik: Aufrufe gegen Aufrufe, Likes
     gegen Likes. Bei Instagram liefert der Scraper keine Videolaenge -- dann
     faellt der Laengenvergleich hier still weg, statt leer dazustehen. */
  const cmpBalken=(zeilen)=>`<div class="c-cmp">${(()=>{
    const max=Math.max(...zeilen.map(z=>z.wert),1)
    return zeilen.map(z=>`<div class="c-cmp-row">
      <div class="c-cmp-label">${escHtml(z.label)}</div>

  /* Verglichen wird nur innerhalb derselben Metrik. Formate, für die die Plattform
     keine Aufrufe ausweist (Karussells, Bilder), fallen aus dem Vergleich heraus --
     sie gegen Videos auf Likes zu stellen bevorzugt strukturell das Video. */
  const fs=Array.isArray(st?.format_stats)?st.format_stats:[]
  const fsMitAufrufen=fs.filter(f=>f.avg_views!=null)

  }

  const ds=Array.isArray(st?.duration_stats)?st.duration_stats:[]
  if(ds.length>1){
    const best=ds.reduce((b,x)=>x.avg_views>b.avg_views?x:b,ds[0])
    const schwach=ds.reduce((b,x)=>x.avg_views<b.avg_views?x:b,ds[0])

    h+=`<div class="c-panel"><h2>Videolänge und Reichweite</h2>

      ${cmpBalken(ds.map(d=>({label:`${d.bucket} (${deN(d.n)}×)`,wert:d.avg_views})))}</div>`

  /* Punkt 4: Ranglisten zum Nachschlagen. Vier Sortierungen derselben Beiträge --
     die Resonanz-Liste dreht dabei die Reihenfolge um, die man auf der Plattform
     selbst sieht, und genau das ist ihr Wert. Jede Zeile öffnet den Beitrag. */
  const alleBeitraege=Array.isArray(st?.post_resonanz)?st.post_resonanz:[]
  if(alleBeitraege.length>=3){
    const listen=[
      {id:'likes', titel:'Likes', hinweis:'So sortiert es auch die Plattform selbst.',
       wert:x=>x.likes, zeige:x=>deN(x.likes), zusatz:x=>x.views?`${deN(x.views)} Aufrufe`:''},
      {id:'aufrufe', titel:'Aufrufe', hinweis:'Wie weit ein Beitrag hinausgetragen wurde.',
       wert:x=>x.views, zeige:x=>deN(x.views), zusatz:x=>x.resonanz!=null?`Resonanz ${deN(x.resonanz,1)}`:''},
      {id:'resonanz', titel:'Resonanz', hinweis:'Wie viele von 1.000 Zuschauern liken. Unabhängig davon, wie weit der Beitrag lief.',
       wert:x=>x.resonanz, zeige:x=>deN(x.resonanz,1), zusatz:x=>`${deN(x.likes)} Likes`},
      {id:'kommentare', titel:'Kommentare', hinweis:'Wo wirklich geantwortet wurde.',
       wert:x=>x.comments, zeige:x=>deN(x.comments), zusatz:x=>x.kommentarrate!=null?`${deN(x.kommentarrate,0)} von 1.000`:''}

        <div class="c-rang-tabs">${listen.map((l,i)=>
          `<button class="c-rang-tab${i===0?' aktiv':''}" data-rang="${l.id}" onclick="ckptRang('${l.id}')">Top 5 nach ${l.titel}</button>`).join('')}</div>`

  /* Teilen erzeugt einen oeffentlichen Ausschnitt: Ueberschrift, vier Kacheln,

        </button>

  h+=`<div class="c-teilen">

  if (runId) teilenLinkVorladen(runId)
}

/* Liest die bestehende Freigabe zu diesem Lauf und fuellt den Teilen-Kasten.
   Leise: gibt es keine, bleibt der Kasten leer und der Knopf erzeugt eine. */
async function teilenLinkVorladen(runId){
  try{
    const { data } = await sb.from('analyse_freigaben')
      .select('token, expires_at, aufrufe, revoked_at')
      .eq('analysis_run_id', runId)
      .is('revoked_at', null)
      .order('created_at', { ascending:false })
      .limit(1).maybeSingle()
    if(!data || new Date(data.expires_at) <= new Date()) return
    const ziel = document.getElementById('teilen-ergebnis')
    if(!ziel) return
    ziel.innerHTML = teilenLinkHtml(runId, data)
    const knopf = document.getElementById('teilen-knopf')
    if(knopf) knopf.innerHTML = SVG_TEILEN + ' Link anzeigen'
  }catch(_){ /* kein Grund, die Analyse deshalb anzuhalten */ }
}

/* ── Die Auswertung war eine Mauer ────────────────────────────────────
   Antoniettas Lauf: zwoelf Textbloecke, 7.667 Zeichen, rund 1.100 Woerter --
   und alle zwoelf sahen gleich wichtig aus. Weggelassen wird nichts, das ist
   das bezahlte Produkt; sichtbar bleibt aber nur, WORUM es in einem Block
   geht: Etikett, die grosse Zahl, die Ueberschrift und ein Anreisser. Der
   Text steht einen Tipp entfernt darunter.

   Gefaltet wird nachtraeglich am fertigen DOM statt an dreizehn Stellen im
   Zusammenbau -- die Bloecke entstehen an dreizehn verschiedenen Orten, und
   jeder einzeln umgebaut waere dreizehn Gelegenheiten, einen zu vergessen.
   ─────────────────────────────────────────────────────────────────── */
function ckptFalten(wurzel){
  wurzel.querySelectorAll('.c-box, .c-panel').forEach(box=>{
    if(box.dataset.offen==='1')return
    const titel=box.querySelector('h2, h3')
    if(!titel)return

    const rest=[]
    for(let n=titel.nextElementSibling; n; n=n.nextElementSibling) rest.push(n)
    if(!rest.length)return

    /* Kurze Bloecke bleiben offen -- ein "Mehr" fuer zwei Zeilen ist
       laestiger als die zwei Zeilen. */
    const ganzerText=rest.map(x=>x.textContent||'').join(' ').replace(/\s+/g,' ').trim()
    if(ganzerText.length<200)return

    /* Anreisser nur aus einem Absatz. Bei Bloecken, die mit einer Tabelle
       anfangen, waeren aneinandergereihte Zellen kein Satz. */
    const ersterAbsatz=rest.find(x=>x.tagName==='P')
    const anreisser=ersterAbsatz
      ? (ersterAbsatz.textContent||'').replace(/\s+/g,' ').trim().slice(0,72).trim()+'…'
      : ''

    const inhalt=document.createElement('div')
    inhalt.className='c-falt'
    inhalt.hidden=true
    rest.forEach(x=>inhalt.appendChild(x))

    const knopf=document.createElement('button')
    knopf.type='button'
    knopf.className='c-falt-knopf'
    knopf.setAttribute('aria-expanded','false')
    knopf.innerHTML=(anreisser?`<span class="c-falt-an">${escHtml(anreisser)}</span>`:'')
      +`<span class="c-falt-mehr">Mehr lesen</span>`
    knopf.addEventListener('click',()=>{
      const auf=inhalt.hidden
      inhalt.hidden=!auf
      knopf.setAttribute('aria-expanded',auf?'true':'false')
      knopf.classList.toggle('auf',auf)
      const an=knopf.querySelector('.c-falt-an')
      if(an)an.hidden=auf
      knopf.querySelector('.c-falt-mehr').textContent=auf?'Weniger':'Mehr lesen'
    })

    box.appendChild(knopf)
    box.appendChild(inhalt)
  })
}

window.shareAnalytics=function(){
  if(!anv)return
  const ki=anv.ki[anv.platform]
  const st=anv.stats[anv.platform]
  const pl=anv.platform==='instagram'?'Instagram':'TikTok'
  const handle=anv.platform==='instagram'?anv.profile?.instagram_handle:anv.profile?.tiktok_handle
  const handleStr=handle?handle.startsWith('@')?handle:'@'+handle:''

  const lines=[]
  lines.push(`📊 Meine ${pl}-Analyse`)
  if(handleStr)lines.push(handleStr)
  lines.push('')

  if(st){
    const seitShare=deltaSeitLabel(anv.prevStats[anv.platform])
    const follStr=st.followers!=null?`👥 ${fmt(st.followers)} Follower`+( st.followers_change!=null&&st.followers_change!==0?` (${st.followers_change>=0?'+':''}${fmt(st.followers_change)} ${seitShare})`:'' ):null
    if(follStr)lines.push(follStr)
    if(st.engagement_rate!=null)lines.push(`💫 ${(+st.engagement_rate).toFixed(2)}% Engagement Rate`)
    if(st.avg_likes!=null)lines.push(`❤️  ⌀ ${fmt(st.avg_likes)} Likes pro Post`)
    if(st.avg_views!=null)lines.push(`👁  ⌀ ${fmt(st.avg_views)} Views pro Post`)
    if(st.best_posting_day&&st.best_posting_hour!=null)lines.push(`⏰ Beste Zeit: ${st.best_posting_day} ${st.best_posting_hour}:00 Uhr`)
  } else if(ki?.analyse_ueberblick){
    lines.push((ki.analyse_ueberblick||'').slice(0,120)+'…')
  }

  lines.push('')
  lines.push('Analysiert mit viuno.')
  lines.push('👉 viuno.de')

  const text=lines.filter(l=>l!=null).join('\n')

  if(navigator.share)navigator.share({title:`Meine ${pl}-Analyse`,text}).catch(()=>{})
  else navigator.clipboard.writeText(text).then(()=>showToast('Kopiert ✓')).catch(()=>showToast('Teilen nicht verfügbar'))
}


/* ═══════════════════════════════════════════════════════════════
   VIEW: CREATOR NEWS
   Liest aus denselben beiden Views wie die oeffentliche Seite /news:
   digest_cards_today (juengste Ausgabe) und digest_cards_past (Archiv).
   Damit stimmen Reihenfolge, Slugs und Inhalt zwischen App, Mail und
   oeffentlicher Seite ueberein — vorher las die App das rohe jsonb und
   zeigte die Karten in der Reihenfolge, in der das Modell sie ausgab.
   ═══════════════════════════════════════════════════════════════ */
const MONTHS_FULL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember']
/* Wie weit das Archiv zurueckreicht. */
const NEWS_ARCHIV_KARTEN=40

/* Relative Altersangabe. Sie beantwortet die Frage, die jemand beim
   Oeffnen hat — anders als die fruehere Zeile "Diese Woche · 14.–20.
   September", die auch dann stehenblieb, wenn gar nichts erschienen war. */
function newsAlter(dateStr){
  if(!dateStr)return''
  const d=new Date(dateStr+'T12:00:00')
  if(isNaN(d))return dateStr
  const heute=new Date();heute.setHours(12,0,0,0)
  const tage=Math.round((heute-d)/86400000)
  if(tage<=0)return'heute'
  if(tage===1)return'gestern'
  if(tage<28)return`vor ${tage} Tagen`
  return`${d.getDate()}. ${MONTHS_FULL[d.getMonth()]} ${d.getFullYear()}`
}
function newsDatumLang(dateStr){
  const d=new Date(dateStr+'T12:00:00')
  if(isNaN(d))return dateStr||''
  return`${d.getDate()}. ${MONTHS_FULL[d.getMonth()]} ${d.getFullYear()}`
}
/* Beschriftung einer Ausgabe. Montags-Ausgaben decken die Woche ab und
   heissen "Woche 7.–13. September". Die Altbestaende aus dem frueheren
   Tagesrhythmus liegen auf beliebigen Wochentagen — sie als Woche zu
   beschriften waere schlicht falsch, sie bekommen ihr Datum. */
function newsAusgabeTitel(dateStr){
  const a=new Date(dateStr+'T12:00:00')
  if(isNaN(a))return dateStr||''
  if(a.getDay()!==1)return newsDatumLang(dateStr)
  const b=new Date(a);b.setDate(b.getDate()+6)
  const links=a.getMonth()===b.getMonth()?`${a.getDate()}.`:`${a.getDate()}. ${MONTHS_FULL[a.getMonth()]}`
  return`Woche ${links}–${b.getDate()}. ${MONTHS_FULL[b.getMonth()]}`
}
/* Das Modell schreibt **Fettungen** in Markdown. Erst escapen, dann die
   Sternchen aufloesen — in der Reihenfolge kann aus dem Text kein Markup
   mehr entstehen. Die oeffentliche Seite macht das seit jeher, die App
   zeigte die Sternchen bisher im Klartext an. */
function mitFettung(s){return escHtml(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')}

/* Rechtsthemen sind das relevanteste und zugleich heikelste Material.
   Eine Zusammenfassung im Imperativ ("Pruefe JETZT …") an Gewerbetreibende
   braucht die Klarstellung, was sie nicht ist. */
const NEWS_RECHT=/recht|gesetz|kennzeichn|dsgvo|\bdsa\b|ai act|urteil|gericht|bußgeld|bussgeld|abmahn|regulier|richtlinie|verordnung/i
function newsRechtshinweis(c){
  if(!NEWS_RECHT.test(`${c.headline||''} ${c.summary||''}`))return''
  return`<p class="news-disclaimer">Zusammenfassung, keine Rechtsberatung. Im Zweifel anwaltlich prüfen lassen.</p>`
}

/* Reichweitenmessung. Ohne sie laesst sich nicht beantworten, ob die News
   ueberhaupt geoeffnet werden — und damit nicht, ob das Feature sein Ziel
   erfuellt. Absichtlich fire-and-forget: ein Fehler hier darf die Ansicht
   nicht stoeren. */
function newsZaehlen(page,source,slug){
  try{
    sb.from('page_views').insert({user_id:dgv?.uid??null,page,source,card_slug:slug??null}).then(()=>{},()=>{})
  }catch(_){}
}

/* Newsletter laeuft seit dem Umbau ausschliesslich ueber die Edge Function.
   Der Browser darf nicht mehr direkt in newsletter_subscribers schreiben -
   sonst liesse sich per REST einfach status='active' setzen und die
   Bestaetigung ueberspringen. */
async function newsletterSetzen(anmelden, quelle){
  const { data:{ session } } = await sb.auth.getSession()
  const res = await fetch('https://bzejndghppuipnedasuv.supabase.co/functions/v1/newsletter-subscribe', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', ...(session ? { Authorization:'Bearer '+session.access_token } : {}) },
    body: JSON.stringify(anmelden ? { source: quelle } : { abmelden: true }),
  })
  const daten = await res.json().catch(()=>({}))
  if(!res.ok) throw new Error(daten.error || 'Fehler')
  return daten.status
}

/* Punkt in der Seitenleiste, solange die juengste Ausgabe neuer ist als der
   letzte Besuch der News-Seite. Grundlage ist page_views — dieselbe Tabelle,
   die auch die Reichweite zaehlt. */
async function newsPunktPruefen(){
  const punkt = document.getElementById('news-punkt')
  const uid = state.session?.user?.id
  if(!punkt || !uid) return

  const [neueste, besuch] = await Promise.all([
    sb.from('digest_cards_today').select('date').limit(1),
    sb.from('page_views').select('created_at').eq('user_id',uid).eq('page','news')
      .order('created_at',{ascending:false}).limit(1),
  ])

  const ausgabe = neueste?.data?.[0]?.date
  if(!ausgabe){ punkt.classList.add('hidden'); return }

  const zuletzt = besuch?.data?.[0]?.created_at
  /* Die Ausgabe traegt nur ein Datum, keine Uhrzeit — deshalb gegen das
     Ende ihres Tages vergleichen. */
  const ungelesen = !zuletzt || new Date(ausgabe + 'T23:59:59') > new Date(zuletzt)
  punkt.classList.toggle('hidden', !ungelesen)
}

/* View-lokaler Zustand */
let dgv = null

async function renderDigest(area, ctx){
  const uid = state.session.user.id

  area.innerHTML = `
  <div class="view-digest">
    <div class="page-header">
      <div class="page-title">Creator News</div>
      <div class="page-sub" id="digest-sub">Lädt …</div>
    </div>
    <div class="nf-leiste hidden" id="news-filter"></div>
    <div id="skeleton-area" style="padding:16px 20px 0;display:flex;flex-direction:column;gap:10px"><div class="skeleton" style="height:150px;border-radius:16px"></div><div class="skeleton" style="height:96px;border-radius:16px"></div></div>
    <div class="cards-list hidden" id="cards-list"></div>
    <div class="empty-state hidden" id="empty-state" style="margin:12px 20px 0"><div class="empty-icon">${icon('inbox',30)}</div><div class="empty-title">Noch keine News</div><div class="empty-sub">Sobald es etwas Neues gibt, steht es hier.</div></div>
  </div>`

  dgv = { uid, ctx, aktuell:[], frueher:[], offene:new Set(), subscribed:false, nprofil:[], filter:'fuerdich' }
  ctx.onCleanup(() => { dgv = null })

  const [profil, aktuell, frueher, analysen, nprofilQ] = await Promise.all([
    sb.from('users').select('newsletter_subscribed,bio_active,mediakit_active').eq('id',uid).single(),
    sb.from('digest_cards_today').select('*').order('relevance_score',{ascending:false}),
    sb.from('digest_cards_past').select('*').order('date',{ascending:false}).order('relevance_score',{ascending:false}).limit(NEWS_ARCHIV_KARTEN),
    sb.from('analysis_runs').select('id',{count:'exact',head:true}).eq('user_id',uid).eq('status','done'),
    /* Welche Bedingungen treffen auf dieses Konto zu? Eine Abfrage, keine
       Rechnerei im Client — dieselbe Liste, die generate-daily-digest als
       festes Vokabular kennt. */
    sb.rpc('viuno_news_profil'),
  ])
  if(ctx.stale)return

  dgv.subscribed = profil?.data?.newsletter_subscribed || false
  dgv.profil     = profil?.data || {}
  dgv.hatAnalyse = (analysen?.count ?? 0) > 0
  dgv.aktuell    = aktuell?.data || []
  dgv.frueher    = frueher?.data || []
  dgv.nprofil    = nprofilQ?.data || []
  /* Passt keine einzige Meldung persoenlich, waere ein leerer
     "Fuer dich"-Filter der schlechteste Einstieg. Dann steht "Alle" vorn. */
  if (!dgv.aktuell.some(c => newsBedeutungFuer(c))) dgv.filter = 'alle'
  newsZaehlen('news','app')
  document.getElementById('news-punkt')?.classList.add('hidden')
  paintDigest()
}

function paintDigest(){
  const sub  = document.getElementById('digest-sub')
  const el   = document.getElementById('cards-list')
  const leer = document.getElementById('empty-state')
  document.getElementById('skeleton-area')?.classList.add('hidden')

  if(!dgv.aktuell.length){
    sub.textContent = 'Zurzeit keine Ausgabe'
    leer.classList.remove('hidden')
    return
  }

  const n = dgv.aktuell.length
  sub.textContent = `${n} ${n===1?'Meldung':'Meldungen'} · aktualisiert ${newsAlter(dgv.aktuell[0].date)}`

  newsFilterZeichnen()
  const sichtbar = dgv.aktuell.filter(newsPasst)

  /* Die Newsletter-Zeile steht nach der dritten Karte, bei kuerzeren
     Ausgaben am Ende — nie vor der ersten Meldung. */
  const nlNach = Math.min(3, sichtbar.length)
  let html = ''
  if(!sichtbar.length){
    html += `<div class="hin" style="margin:0 var(--page-x)"><span class="hin-i">i</span><div>
      In dieser Ausgabe passt keine Meldung zu dieser Auswahl.</div></div>`
  }
  sichtbar.forEach((c,i) => {
    html += newsKarteHtml(c, i===0)
    if(i+1===nlNach) html += nlLineHtml()
  })

  html += hinweisHtml()
  html += frueherHtml()

  leer.classList.add('hidden')
  el.classList.remove('hidden')
  el.innerHTML = html
  bindeNews(el)
}

/* Ein einziger Produkt-Hinweis, ganz unten, und nur wenn wirklich etwas
   fehlt — dieselben Regeln wie die Einrichtungskarten auf dem Dashboard.
   Wer BioLink, Analyse und Media Kit hat, sieht hier nichts. Die News
   sollen News bleiben. */
function hinweisHtml(){
  const p = dgv.profil || {}
  const offen = []
  if(!p.bio_active)      offen.push({icon:'link',     href:'#/biolink',  t:'BioLink-Seite erstellen', u:'Deine Visitenkarte für Marken'})
  if(!dgv.hatAnalyse)    offen.push({icon:'barChart', href:'#/analytics',t:'Analyse starten',         u:'Was deine Top-Beiträge verbindet — 9,99 € je Kanal'})
  if(!p.mediakit_active) offen.push({icon:'fileText', href:'#/mediakit', t:'Media Kit erstellen',     u:'Reichweite und Zahlen für Marken'})
  if(!offen.length) return ''

  const it = offen[0]
  return `<a class="news-hinweis" href="${it.href}">
    <span class="news-hinweis-icon">${icon(it.icon,16)}</span>
    <span class="news-hinweis-text">
      <span class="news-hinweis-t">${escHtml(it.t)}</span>
      <span class="news-hinweis-u">${escHtml(it.u)}</span>
    </span>
    ${icon('chevronRight',16,'news-hinweis-pfeil')}
  </a>`
}

/* Archiv: eine Zeile je frueherer Ausgabe, aufklappbar. */
function frueherHtml(){
  if(!dgv.frueher.length)return''
  const proDatum = new Map()
  for(const c of dgv.frueher){
    if(!proDatum.has(c.date))proDatum.set(c.date,[])
    proDatum.get(c.date).push(c)
  }
  let html = `<div class="news-frueher"><div class="news-frueher-titel">Frühere Ausgaben</div>`
  for(const [datum,karten] of proDatum){
    const offen = dgv.offene.has(datum)
    html += `<button class="news-ausgabe${offen?' offen':''}" data-ausgabe="${escHtml(datum)}">
      <span class="news-ausgabe-text">
        <span class="news-ausgabe-titel">${escHtml(newsAusgabeTitel(datum))}</span>
        <span class="news-ausgabe-sub">${karten.length} ${karten.length===1?'Meldung':'Meldungen'}</span>
      </span>
      <span class="news-ausgabe-pfeil">${icon('chevronRight',16)}</span>
    </button>
    <div class="news-ausgabe-karten${offen?'':' hidden'}" data-karten="${escHtml(datum)}">${offen?karten.map(c=>newsKarteHtml(c,false)).join(''):''}</div>`
  }
  return html + `</div>`
}

/* Dringlichkeit aus relevance_score. Das Feld `level` des Modells waere
   naheliegender, ist aber unzuverlaessig: es stand schon auf "hoch" bei
   einer Shop-Meldung mit Score 7 und auf "info" bei Score 5. */
function newsStufe(c){
  const s = c.relevance_score || 0
  if(s >= 8) return { klasse:'st-jetzt', text:'Diese Woche erledigen' }
  if(s >= 6) return { klasse:'st-bald',  text:'Bald ansehen' }
  return        { klasse:'st-info',  text:'Zur Kenntnis' }
}

/* ── „Was bedeutet das für mich?" ───────────────────────────────────
   Die Bedeutungen liegen fertig in der Karte (jsonb `bedeutung`), je
   Eintrag an eine Bedingung gebunden. Hier wird nur verglichen — kein
   Modell-Aufruf je Leserin, sonst waeren es bei 1.000 Konten und 8
   Karten 8.000 Aufrufe je Ausgabe statt einem.

   Gilt eine Meldung fuer alle gleich, ist `bedeutung` leer und der Knopf
   erscheint gar nicht. Eine erfundene Bedeutung waere schlimmer als keine. */
function newsBedeutungFuer(c){
  const roh = Array.isArray(c.bedeutung) ? c.bedeutung : []
  if(!roh.length || !dgv?.nprofil?.length) return null
  const treffer = roh.filter(b => b && dgv.nprofil.includes(b.wenn))
  return treffer.length ? treffer : null
}

const NEWS_RUBRIK_LABEL = { plattform:'Plattform', studie:'Studien', recht:'Recht & Steuern',
  werkzeug:'Werkzeuge', trend:'Trends' }

function newsPasst(c){
  if(dgv.filter === 'alle')     return true
  if(dgv.filter === 'fuerdich') return !!newsBedeutungFuer(c)
  return (c.rubrik || 'plattform') === dgv.filter
}

function newsFilterZeichnen(){
  const el = document.getElementById('news-filter')
  if(!el) return
  const fuerDich = dgv.aktuell.filter(c => newsBedeutungFuer(c)).length
  const rubriken = [...new Set(dgv.aktuell.map(c => c.rubrik || 'plattform'))]
  const knoepfe = [
    ...(fuerDich ? [{ key:'fuerdich', label:`Für dich · ${fuerDich}` }] : []),
    { key:'alle', label:`Alle · ${dgv.aktuell.length}` },
    ...rubriken.map(r => ({ key:r, label:NEWS_RUBRIK_LABEL[r] || r })),
  ]
  if(knoepfe.length < 3){ el.classList.add('hidden'); return }
  el.classList.remove('hidden')
  el.innerHTML = knoepfe.map(k =>
    `<button class="nf-btn${k.key===dgv.filter?' aktiv':''}" data-f="${escHtml(k.key)}">${escHtml(k.label)}</button>`
  ).join('')
  el.querySelectorAll('.nf-btn').forEach(b => {
    dgv.ctx.on(b, 'click', () => { dgv.filter = b.dataset.f; paintDigest() })
  })
}

window.newsFuerDich = function(btn, slug){
  const box = document.getElementById('fd-' + slug)
  if(!box) return
  const zu = box.hidden
  box.hidden = !zu
  btn.textContent = zu ? 'Ausblenden' : 'Was bedeutet das für mich?'
}

function newsKarteHtml(c, gross){
  const stufe       = newsStufe(c)
  const aufklappbar = !!(c.full_content || c.impact)
  const quelle      = [c.platform_label, c.source, newsAlter(c.published_date || c.date)].filter(Boolean).join(' · ')
  const bild        = (c.image_url || '').trim()

  return `<article class="news-card ${stufe.klasse}${gross?' gross':''}" data-slug="${escHtml(c.slug||'')}">
    ${bild?`<img class="news-bild" src="${escHtml(bild)}" alt="" loading="lazy" onerror="this.remove()">`:''}
    <div class="news-inner">
      <span class="news-stufe">${escHtml(stufe.text)}</span>
      <h3 class="news-headline">${escHtml(c.headline||'')}</h3>
      <p class="news-summary">${escHtml(c.summary||'')}</p>
      ${aufklappbar?`<div class="news-body">
        ${c.impact?`<div class="card-impact"><div class="card-impact-label">${icon('zap',12)} Was du tun kannst</div><div class="card-impact-text">${escHtml(c.impact)}</div></div>`:''}
        ${c.full_content?`<div class="news-full">${mitFettung(c.full_content)}</div>`:''}
        ${newsRechtshinweis(c)}
        ${newsFuerDichHtml(c)}
        <div class="news-actions">
          <button class="news-btn news-share" type="button">${icon('share',14)} Teilen</button>
        </div>
      </div>`:''}
      <div class="news-foot">
        <span class="news-quelle news-quelle-zu">${escHtml(quelle)}</span>
        ${c.source_url?`<a class="news-quelle news-quelle-auf" href="${escHtml(c.source_url)}" target="_blank" rel="noopener" hidden>${escHtml(quelle)} ${icon('arrowUpRight',11)}</a>`:''}

      </div>
    </div>
  </article>`
}

function newsFuerDichHtml(c){
  const treffer = newsBedeutungFuer(c)
  if(!treffer) return ''
  const slug = c.slug || ''
  return `<button class="fd-btn news-btn" type="button" onclick="newsFuerDich(this,'${escHtml(slug)}')">Was bedeutet das für mich?</button>
    <div class="fd-box" id="fd-${escHtml(slug)}" hidden>

    </div>`
}

/* Klartext fuer die Bedingungen. Steht hier und nicht im Modell: die

  hat_kooperationen:'du hast Kooperationen eingetragen', keine_kooperationen:'du hast noch keine Kooperation eingetragen',
  hat_affiliate:'du arbeitest mit Links, Codes oder Affiliate',

/* Eine Karte je Slug finden — die aktuelle Ausgabe und das Archiv. */
function newsKarte(slug){
  return dgv.aktuell.find(c=>c.slug===slug) || dgv.frueher.find(c=>c.slug===slug) || null
}

function bindeNews(el){
  el.querySelectorAll('.news-card').forEach(karte => {
    dgv.ctx.on(karte, 'click', e => {
      if(e.target.closest('.news-quelle-auf') || e.target.closest('.news-btn')) return
      if(!karte.querySelector('.news-body')) return
      const offen = karte.classList.toggle('offen')
      /* Die Quelle wird erst beim Aufklappen zum Link. Zugeklappt ist sie
         reine Angabe — ein Weg nach draussen gehoert ans Ende des Textes,
         nicht an den Anfang. */
      const zu  = karte.querySelector('.news-quelle-zu')
      const auf = karte.querySelector('.news-quelle-auf')
      if(auf){ auf.hidden = !offen; if(zu) zu.hidden = offen }
      if(offen) newsZaehlen('news_card', 'app', karte.dataset.slug)
    })
  })
  el.querySelectorAll('.news-share').forEach(btn => {
    dgv.ctx.on(btn, 'click', e => { e.stopPropagation(); newsTeilen(btn.closest('.news-card')?.dataset.slug) })
  })
  el.querySelectorAll('.news-ausgabe').forEach(btn => {
    dgv.ctx.on(btn, 'click', () => {
      const datum = btn.dataset.ausgabe
      const box = el.querySelector(`[data-karten="${CSS.escape(datum)}"]`)
      if(!box) return
      if(dgv.offene.has(datum)){
        dgv.offene.delete(datum)
        btn.classList.remove('offen')
        box.classList.add('hidden')
        box.innerHTML = ''
      } else {
        dgv.offene.add(datum)
        btn.classList.add('offen')
        box.innerHTML = dgv.frueher.filter(c=>c.date===datum).map(c=>newsKarteHtml(c,false)).join('')
        box.classList.remove('hidden')
        bindeNews(box)
      }
    })
  })
}

/* Teilen als Textnachricht: Schlagzeile, ein Satz, Link auf die oeffentliche
   Seite der Meldung. Kein "Mehr Creator-News auf viuno.de" mehr — Werbung im
   geteilten Text senkt die Weiterleitung, und der frueher mitgegebene Link
   auf die Startseite fuehrte den Empfaenger nirgendwohin. */
async function newsTeilen(slug){
  const c = newsKarte(slug)
  if(!c)return
  const url  = `https://viuno.de/news/${encodeURIComponent(c.slug)}?s=share`
  const text = `${c.headline||''}\n\n${(c.summary||'').trim()}`
  if(navigator.share){
    try{ await navigator.share({ title:c.headline||'Creator News', text, url }); return }catch(_){ }
  }
  try{ await navigator.clipboard.writeText(`${text}\n\n${url}`); showToast('In Zwischenablage kopiert ✓') }
  catch(_){ showToast('Teilen nicht verfügbar') }
}

/* Einzeiler zum Newsletter. Geht wie jeder andere Weg ueber die Edge
   Function; users.newsletter_subscribed wird von einem Trigger nachgefuehrt
   und nur noch gelesen. Vorher schrieb jede Seite eine andere Teilmenge -
   deshalb stand eine Abonnentin gleichzeitig als an- und abgemeldet da. */
/* Wer abonniert hat, braucht das Angebot nicht weiter zwischen den Meldungen
   stehen zu haben. Abbestellen geht im Profil unter Benachrichtigungen und
   ueber den Link in jeder Mail -- zwei Wege reichen. */
function nlLineHtml(){
  if(dgv?.subscribed) return ''
  return `<label class="nl-line">
    <input type="checkbox" class="nl-line-check" onchange="toggleNewsMail(this)"/>
    <span class="nl-line-text">Creator News jede Woche per Mail bekommen</span>
  </label>`
}

window.toggleNewsMail=async function(el){
  if(!dgv)return
  const checked=el.checked
  el.disabled=true
  try{
    await newsletterSetzen(checked,'news_app')
  }catch(_){
    if(!dgv)return
    el.disabled=false; el.checked=!checked
    showToast('Konnte nicht gespeichert werden'); return
  }
  if(!dgv)return
  el.disabled=false

  dgv.subscribed=checked
  const label=el.parentElement?.querySelector('.nl-line-text')
  if(label)label.textContent=checked?'Kommt jede Woche per Mail':'Creator News jede Woche per Mail bekommen'
  showToast(checked?'Abonniert ✓':'Abo beendet')
}

window.pfSheetAuf=function(id){
  if(!pv)return
  const p=pv.profile
  if(id==='pf-profil-sheet'){
    const av=document.getElementById('pf-sheet-av')
    av.innerHTML = p.profile_image_url
      ? `<img src="${escHtml(p.profile_image_url)}" style="width:100%;height:100%;object-fit:cover">`
      : (p.display_name||'?')[0].toUpperCase()
    document.getElementById('pf-username-anzeige').textContent = p.display_name||'–'
    document.getElementById('pf-bio').value = p.bio||''
    document.getElementById('pf-foto-status').className='sheet-hint'
    document.getElementById('pf-foto-status').textContent='JPG, PNG oder WebP · wird auf 800 px verkleinert'
    pv.niche = p.niche_category||'general'
    document.querySelectorAll('#pf-profil-sheet .niche-btn').forEach(b=>b.classList.toggle('active',b.dataset.niche===pv.niche))
    pfBioZaehler()
  } else if(id==='pf-kanaele-sheet'){
    const setz=(k,v)=>{document.getElementById('pf-'+k).value=(v||'').replace(/^@/,'');document.getElementById('pf-'+k+'-hint').textContent='';document.getElementById('pf-'+k+'-hint').className='sheet-hint'}
    setz('ig',p.instagram_handle); setz('tt',p.tiktok_handle); setz('th',p.threads_handle)
  } else if(id==='pf-kontakt-sheet'){
    document.getElementById('pf-kontakt').value=p.contact_email||''
    const h=document.getElementById('pf-kontakt-hint')
    h.className='sheet-hint'; h.textContent='Empfohlen: eine eigene Adresse, nicht deine private.'
  } else if(id==='pf-konto-sheet'){
    document.getElementById('pf-login-mail').textContent=pv.user.email||'–'
  } else if(id==='pf-news-sheet'){
    pfNewsMalen()
  }
  openSheet(id)
}

/* ── Speichern: Profil ── */
window.pfSpeichereProfil=async function(){
  if(!pv)return
  const btn=document.getElementById('pf-profil-btn')
  const bio=document.getElementById('pf-bio').value.trim()||null
  const patch={bio, niche_category:pv.niche, updated_at:new Date().toISOString()}
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const uid=pv.uid
  const bioGeaendert=(pv.profile.bio||null)!==bio
  const{error}=await sb.from('users').update(patch).eq('id',uid)
  if(!pv)return
  btn.disabled=false;btn.textContent='Speichern'
  if(error){showToast('Fehler: '+error.message,4000);return}
  Object.assign(pv.profile,patch)
  pfSheetZu('pf-profil-sheet')
  paintProfile()
  showToast('Profil gespeichert ✓')
  /* Nur die Bio steckt in den og:-Tags der erzeugten Seite. Nische und
     Kanaele laedt die Seite zur Laufzeit aus biopage_v2 — dafuer braucht es
     keinen Neubau. */
  if(bioGeaendert) pfSeiteAktualisieren(uid)
}

/* ── Speichern: Kanaele ── */
window.pfSpeichereKanaele=async function(){
  if(!pv)return
  const lies=(k)=>document.getElementById('pf-'+k).value.trim().replace(/^@/,'')
  const felder=[['ig','instagram_handle'],['tt','tiktok_handle'],['th','threads_handle']]
  let fehler=false
  for(const [k] of felder){
    const h=document.getElementById('pf-'+k+'-hint'); h.textContent=''; h.className='sheet-hint'
    const v=lies(k)
    if(v && !HANDLE_RE.test(v)){
      h.textContent='Nur Buchstaben, Zahlen, Punkt und Unterstrich.'; h.className='sheet-hint err'; fehler=true
    }
  }
  if(fehler)return

  /* Wer einen bereits ausgewerteten Kanal umbenennt, verliert die Zuordnung
     seines Analyse-Verlaufs: der Trigger sync_analytics_username schreibt den
     neuen Namen in die bestehende creator_analytics-Zeile, die alten Zahlen
     bleiben stehen. Frueher passierte das wortlos. */
  const alt=pv.profile
  const gewarnt=[]
  if(pv.analysen>0){
    if(alt.instagram_handle && lies('ig') && '@'+lies('ig')!==alt.instagram_handle) gewarnt.push('Instagram')
    if(alt.tiktok_handle    && lies('tt') && '@'+lies('tt')!==alt.tiktok_handle)    gewarnt.push('TikTok')
  }
  if(gewarnt.length){
    showModal(
      gewarnt.join(' und ')+'-Handle ändern?',
      null,
      'Ja, ändern',
      ()=>{closeModal();pfKanaeleSchreiben()},
      `Zu ${gewarnt.length>1?'diesen Kanälen':'diesem Kanal'} gibt es bereits eine Analyse. Die alten Zahlen bleiben erhalten, tragen danach aber den neuen Namen — sie lassen sich dem früheren Kanal nicht mehr zuordnen.`
    )
    return
  }

window.checkUsernameAvailability=async function(){
  const input=document.getElementById('sheet-new-username')
  const status=document.getElementById('username-status')
  const btn=document.getElementById('btn-save-username')
  const val=input.value.trim()
  clearTimeout(_usernameTimer)
  btn.disabled=true
  if(!val){status.textContent='';return}
  if(val.toLowerCase()===pv?.profile?.display_name?.toLowerCase()){status.style.color='var(--muted)';status.textContent='Das ist bereits dein Username.';return}
  if(!/^[a-zA-Z0-9_]{3,30}$/.test(val)){status.style.color='var(--red)';status.textContent='3–30 Zeichen, nur Buchstaben, Zahlen und _.';return}
  status.style.color='var(--muted)';status.textContent='Wird geprüft…'
  _usernameTimer=setTimeout(async()=>{
    // RPC umgeht RLS und prüft sicher gegen users + username_blacklist
    const{data:result,error}=await sb.rpc('check_username_available',{p_username:val})
    if(!document.getElementById('username-status'))return
    if(error){status.style.color='var(--red)';status.textContent='Fehler bei Prüfung';btn.disabled=true;return}
    if(result==='reserved'){status.style.color='var(--red)';status.textContent='Dieser Username ist reserviert.';btn.disabled=true}
    else if(result==='taken'){status.style.color='var(--red)';status.textContent='Leider vergeben.';btn.disabled=true}
    else if(result==='invalid_format'){status.style.color='var(--red)';status.textContent='3–30 Zeichen, nur Buchstaben, Zahlen und _.';btn.disabled=true}
    else if(result==='available'){status.style.color='var(--green)';status.textContent='✓ Verfügbar!';btn.disabled=false}
    else {status.style.color='var(--red)';status.textContent='Unbekannte Antwort';btn.disabled=true}
  },500)
}

/* ── Foto ──
   Vorher gingen bis zu 5 MB unveraendert auf BioLink und Media Kit, und jede
   Aenderung liess die alte Datei fuer immer im Storage liegen. */
function bildVerkleinern(file, maxKante=800){
  return new Promise((fertig)=>{
    const reader=new FileReader()
    reader.onload=(ev)=>{
      const img=new Image()
      img.onload=()=>{
        const k=Math.min(1, maxKante/Math.max(img.width,img.height))
        if(k>=1 && file.size<400*1024){ fertig({blob:file, vorschau:ev.target.result, endung:(file.name.split('.').pop()||'jpg')}); return }
        const c=document.createElement('canvas')
        c.width=Math.round(img.width*k); c.height=Math.round(img.height*k)
        c.getContext('2d').drawImage(img,0,0,c.width,c.height)
        c.toBlob(b=>fertig(b?{blob:b, vorschau:c.toDataURL('image/jpeg',.85), endung:'jpg'}
                             :{blob:file, vorschau:ev.target.result, endung:(file.name.split('.').pop()||'jpg')}),
                 'image/jpeg', .85)
      }
      img.onerror=()=>fertig(null)
      img.src=ev.target.result
    }
    reader.onerror=()=>fertig(null)
    reader.readAsDataURL(file)
  })
}

/* ── Ein Weg fuer alle vier Upload-Stellen ────────────────────────────
   Bis 14.09.2026 luden Onboarding, BioLink und Media Kit die Kameradatei
   ROH hoch; nur das Profil rechnete herunter. So kam ein Bild mit
   2316x3088 px und 1,2 MB in den Speicher, das an jeder Stelle mit 22 bis
   68 px angezeigt wird -- und weil nichts die alte Datei entfernte, lagen
   neun Fassungen im Ordner desselben Accounts.

   cacheControl ist der zweite Teil: ohne die Angabe kam das Bild mit
   "no-cache" heraus und wurde bei jedem Aufruf neu geladen. Der Dateiname
   traegt einen Zeitstempel, eine neue Fassung bekommt also eine neue URL --
   ein Jahr Cache ist damit gefahrlos.
   ──────────────────────────────────────────────────────────────────── */
async function profilbildHochladen(file, uid, altUrl){
  const klein = await bildVerkleinern(file)
  if(!klein) return {fehler:'Bild konnte nicht gelesen werden.'}

  const altPfad = pfPfadAusUrl(altUrl, uid)
  const pfad    = `${uid}/${Date.now()}.${klein.endung}`

  const {error} = await sb.storage.from('profile-images')
    .upload(pfad, klein.blob, {upsert:true, contentType:klein.blob.type||'image/jpeg', cacheControl:'31536000'})
  if(error) return {fehler:'Upload fehlgeschlagen: '+error.message}

  const {data:{publicUrl}} = sb.storage.from('profile-images').getPublicUrl(pfad)
  const {error:dbErr} = await sb.from('users')
    .update({profile_image_url:publicUrl, updated_at:new Date().toISOString()}).eq('id', uid)
  if(dbErr) return {fehler:'Konnte nicht gespeichert werden: '+dbErr.message}

  /* Alte Datei wegraeumen -- sonst waechst der Bucket mit jedem Upload.
     Der Fehler wird bewusst nicht dem Nutzer gezeigt (sein Bild ist ja da),
     aber auch nicht mehr verschluckt: bis 15.09.2026 fehlte dem Bucket die
     DELETE-Regel, der Aufruf schlug jedes Mal fehl und niemand sah es --
     zehn Fassungen desselben Bilds spaeter. */
  if(altPfad && altPfad!==pfad){
    const {error:wegErr} = await sb.storage.from('profile-images').remove([altPfad])
    if(wegErr) console.warn('Altes Profilbild nicht entfernt:', wegErr.message)
  }

  if(state.profile){ state.profile.profile_image_url = publicUrl; paintUser() }
  return {publicUrl, vorschau:klein.vorschau}
}

  const file=e.target.files?.[0];if(!file)return
  e.target.value=''
  if(file.size>10*1024*1024){showToast('Bild zu groß. Max. 10 MB.');return}
  const status=document.getElementById('pf-foto-status')
  const setzeStatus=(t,cls)=>{if(status){status.textContent=t;status.className='sheet-hint'+(cls?' '+cls:'')}}
  setzeStatus('Wird verkleinert …')

  const uid=pv?pv.uid:state.session.user.id
  setzeStatus('Wird hochgeladen …')
  const erg=await profilbildHochladen(file, uid, pv?.profile?.profile_image_url)
  if(erg.fehler){setzeStatus(erg.fehler,'err');showToast(erg.fehler,4000);return}

  if(pv)pv.profile.profile_image_url=erg.publicUrl
  setzeStatus('✓ Foto gespeichert','ok')
  showToast('Profilbild gespeichert ✓')
  if(pv){paintProfile();pfSeiteAktualisieren(uid)}
}

/* Nur Pfade im eigenen Ordner — das Standardbild aus handle_new_user liegt im
   Bucket-Wurzelverzeichnis und darf nicht geloescht werden. */
function pfPfadAusUrl(url, uid){
  if(!url)return null
  const m=String(url).match(/\/profile-images\/(.+)$/)
  if(!m)return null
  const pfad=decodeURIComponent(m[1].split('?')[0])
  return pfad.startsWith(uid+'/') ? pfad : null
}

/* ═════════════════════════════════════════════════════════════════
   VIEW: BRAND READY
   ═════════════════════════════════════════════════════════════════
   Was eine Marke sieht, wenn sie diesen Kanal prueft -- als Punktestand,
   den der Creator nachrechnen kann.

   Das Regelwerk steht NICHT hier, sondern in ./brand-ready-regeln.js.
   Grund: der Punktestand ist teilbar, die geteilte Seite traegt "powered
   by viuno", und deshalb rechnet die Freigabe serverseitig nach statt die
   Zahl aus dem Browser zu uebernehmen. Ein Regelwerk, zwei Verbraucher.

   Aufbau (Entwurf C): der Score ist ein kleiner Ring, kein Banner. Darunter
   zwei bis drei Saetze, die ihn einordnen. Dann EINE Liste -- offene Fragen
   und Luecken gemischt, sortiert nach dem, was sie bringen, und als Gewinn
   beschriftet ("+9") statt als Verlust. Erfuelltes und Unbewertbares ruhen
   eingeklappt am Ende: zwei Zeilen statt vierzehn.

   Gerechnet wird bei jedem Seitenaufruf neu, im Browser. Keine
   Ergebnistabelle fuer die Live-Ansicht -- was nicht gespeichert wird, kann
   nicht veralten. Gespeichert wird nur, was jemand aktiv teilt.
   ───────────────────────────────────────────── */

let brv = null

const BR_SYM    = { erfuellt: '✓', teilweise: '◐', offen: '!', nicht_bewertbar: '–', hinweis: 'i' }
const BR_QUELLE = { viuno: 'über viuno', eigene_angabe: 'eigene Angabe', gemessen: 'gemessen', keine: '' }
const BR_PLAT   = { instagram: 'Instagram', tiktok: 'TikTok' }
const SVG_TEILEN_BR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>'

/* ─── Laden. Alles per RLS als der eingeloggte Nutzer. ─── */
async function renderBrandReady(area, ctx) {
  const uid = state.session.user.id

  area.innerHTML = `
  <div class="view-brandready">
    <div class="br-head">
      <div class="br-head-txt">
        <div class="page-title">Profilcheck</div>
        <div class="page-sub">Was eine Marke sieht — automatisch geprüft.</div>
      </div>
      <button class="br-teilen-btn hidden" id="br-teilen-oben" onclick="brTeilen()">${SVG_TEILEN_BR} Teilen</button>
    </div>
    <div id="br-skeleton" style="padding:16px 20px 0;display:flex;flex-direction:column;gap:10px">
      <div class="skeleton" style="height:92px;border-radius:16px"></div>
      <div class="skeleton" style="height:200px;border-radius:16px"></div>
    </div>
    <div id="br-inhalt"></div>
  </div>`

  brv = { uid, ctx, kanal: null, ansicht: 'gesamt', daten: null, angaben: {}, offen: {}, freigabe: null, score: null, pc: null, hist: [] }
  ctx.onCleanup(() => { brv = null })

  const [statsQ, profilQ, blQ, mkQ, brandsQ, offersQ, preiseQ, angabenQ, nischeQ, scoreQ, pcQ, histQ] = await Promise.all([
    sb.from('analyse_stats').select('*').eq('user_id', uid).order('created_at', { ascending: false }),
    sb.from('users').select('bio,contact_email,impressum_text,niche_category,niche_custom,bio_active,mediakit_active,display_name').eq('id', uid).single(),
    sb.from('biolink_settings').select('is_active,impressum_text').eq('user_id', uid).maybeSingle(),
    sb.from('mediakit_viuno').select('*').eq('user_id', uid).maybeSingle(),
    sb.from('mediakit_brands').select('id', { count: 'exact', head: true }).eq('user_id', uid),
    sb.from('mediakit_content_offers').select('offer_type').eq('user_id', uid),
    sb.from('mediakit_preise').select('offer_type,preis_von').eq('user_id', uid),
    sb.from('brand_ready_angaben').select('kriterium,wert,zahl').eq('user_id', uid),
    sb.from('niche_mappings').select('keyword,niche_category'),
    /* Ausbau 16.09.2026: Score und automatischer Profilcheck kommen aus
       der Datenbank, damit App, Wochenbericht und Teilen-Karte dieselbe
       Zahl zeigen. Sie stehen ueber dem bisherigen Brand-Ready-Teil,
       statt daneben als zweite Ansicht — zwei Checks, die dasselbe
       messen, waeren genau die Doppelung, die schon einmal Aerger
       gemacht hat. */
    sb.rpc('viuno_score'),
    sb.rpc('viuno_profilcheck'),
    sb.from('brand_readiness').select('stichtag,punkte,max_punkte')
      .eq('user_id', uid).order('stichtag', { ascending: false }).limit(2)
  ])
  if (ctx.stale) return

  brv.score = scoreQ.data || null
  brv.pc    = pcQ.data || null
  brv.hist  = histQ.data || []

  const alle = statsQ.data || []
  /* Juengste Zeile je Plattform. Bewusst ueber analyse_stats und nicht ueber
     analysis_runs.platform: das Feld ist bei allen Laeufen vor der
     Option-C-Umstellung NULL und deckt dort beide Plattformen ab. */
  const neueste = []
  for (const r of alle) if (!neueste.some(x => x.platform === r.platform)) neueste.push(r)

  let posts = []
  const runIds = [...new Set(neueste.map(r => r.analysis_run_id).filter(Boolean))]
  if (runIds.length) {
    const pq = await sb.from('apify_daten').select('analysis_run_id,platform,caption').in('analysis_run_id', runIds)
    if (ctx.stale) return
    posts = pq.data || []
  }

  const angaben = {}
  for (const a of (angabenQ.data || [])) angaben[a.kriterium] = { wert: a.wert, zahl: a.zahl }

  brv.daten = {
    stats: neueste, alleStats: alle,
    profil: profilQ.data || {}, bl: blQ.data || {}, mk: mkQ.data || {},
    brands: brandsQ.count || 0,
    offers: (offersQ.data || []).length,
    preise: (preiseQ.data || []).filter(x => x.preis_von != null).length,
    posts,
    nischen: (nischeQ.data || []).filter(x => x.keyword)
  }
  brv.angaben = angaben
  brv.kanal = neueste.length ? neueste[0].platform : null
  brv.ansicht = 'gesamt'

  document.getElementById('br-skeleton').classList.add('hidden')
  if (brv.kanal) {
    document.getElementById('br-teilen-oben')?.classList.remove('hidden')
    /* Bereits erzeugte Freigabe fuer diesen Kanal vorladen, damit der Knopf
       nicht einen zweiten Link erzeugt, wo schon einer geteilt wurde. */
    const { data: f } = await sb.from('brand_ready_freigaben')
      .select('token,expires_at,revoked_at,aufrufe,platform')
      .eq('user_id', uid).is('revoked_at', null)
    if (ctx.stale) return
    brv.freigaben = {}
    for (const x of (f || [])) if (new Date(x.expires_at) > new Date()) brv.freigaben[x.platform] = x
  }
  brZeichnen()
}

function brErgebnisFuer(pf) {
  const d = brv.daten
  const s = d.stats.find(x => x.platform === pf)
  if (!s) return null
  const prev = d.alleStats.filter(x => x.platform === pf)[1] || null
  return brBerechnen({
    platform: pf, stats: s, statsPrev: prev,
    posts: d.posts.filter(x => x.analysis_run_id === s.analysis_run_id && x.platform === pf),
    profil: d.profil, bl: d.bl, mk: d.mk,
    brands: d.brands, offers: d.offers, preise: d.preise,
    nischen: d.nischen, angaben: brv.angaben
  })
}

/* Standardansicht ist das Konto: die Kontokriterien zaehlen einmal, die
   gemessenen kommen vom staerkeren Kanal. Die Kanal-Pillen bleiben als
   Detailansicht -- wer wissen will, woran es auf TikTok haengt, schaltet um. */
function brErgebnis() {
  if (brv.ansicht === 'gesamt') {
    return brZusammenfuehren(brv.daten.stats.map(x => brErgebnisFuer(x.platform)))
  }
  return brErgebnisFuer(brv.ansicht)
}

/* Score und automatischer Check. Stehen ueber dem Brand-Ready-Teil und
   kommen ohne eine einzige Handeingabe aus — der Teil darunter ergaenzt
   sie um das, was viuno nicht messen kann. */
function brOben() {
  let h = ''
  const s = brv.score
  if (s?.gesamt != null) {
    const u  = 2 * Math.PI * 34
    const an = u * (s.gesamt / 100)
    const vor = brv.hist[1]
    const delta = vor && brv.hist[0] && vor.max_punkte > 0 && brv.hist[0].max_punkte > 0
      ? Math.round(brv.hist[0].punkte / brv.hist[0].max_punkte * 100) - Math.round(vor.punkte / vor.max_punkte * 100)
      : null

    h += `<div class="section"><div class="bl-karte"><div class="bl-teil">
      <div class="sc-kopf">
        <div class="sc-ring">
          <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
            <defs><linearGradient id="sc-lauf" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--vi1)"/><stop offset="55%" stop-color="var(--vi2)"/>
              <stop offset="100%" stop-color="var(--vi3)"/></linearGradient></defs>
            <circle cx="42" cy="42" r="34" fill="none" stroke="var(--surface2)" stroke-width="8"/>
            <circle cx="42" cy="42" r="34" fill="none" stroke="url(#sc-lauf)" stroke-width="8"
              stroke-linecap="round" stroke-dasharray="${an.toFixed(1)} ${u.toFixed(1)}"
              transform="rotate(-90 42 42)"/>
          </svg>
          <div class="sc-zahl">${s.gesamt}</div>
        </div>
        <div class="sc-txt">
          <h3>Creator Score</h3>
          <p>${s.gesamt} von 100${delta != null && Math.abs(delta) >= 3 ? ` · ${delta > 0 ? '+' : ''}${delta} zur Vorwoche` : ''}.
             Vier Säulen, gleich gewichtet.</p>
        </div>
      </div>
      ${(s.saeulen || []).map(x => `<div class="sc-saeule">
        <div class="sc-saeule-kopf"><span>${escHtml(x.titel)}</span>
          <span class="sc-saeule-wert">${x.zustand === 'ok' ? x.punkte + ' / ' + x.max : 'nicht bewertbar'}</span></div>
        <div class="sc-spur${x.zustand === 'ok' ? '' : ' grau'}">
          <div style="width:${x.max > 0 ? Math.max(2, Math.round(x.punkte / x.max * 100)) : 0}%"></div></div>
        <div class="sc-quelle">${escHtml(x.quelle || '')}</div>
      </div>`).join('')}
      <div class="bl-leer" style="padding-top:12px">
        <b>Community und Einnahmen fehlen im Score.</b> Dafür gibt es keine Quelle, und ein Score
        aus sechs Teilen, von denen zwei geraten sind, wäre schlechter als dieser hier.
        Bewegungen unter 3 Punkten zeigen wir nicht an.
      </div>
    </div></div>
    <button class="btn-share" style="margin-top:var(--s-3)" onclick="tkTeilen('score')">
      ${SVG_TEILEN_BR} Score als Bild teilen</button>
    </div>`
  }

  const pc = brv.pc
  if (pc?.teile?.length) {
    h += `<div class="section">
      <div class="section-header"><div class="section-title">Automatisch geprüft</div>
        <span class="bl-meta">${pc.punkte} von ${pc.max} Punkten</span></div>
      <div class="bl-karte"><div class="bl-teil">
        ${pc.teile.map(t => `<div class="pc-zeile">
          <span class="pc-sym ${escHtml(t.zustand)}">${BR_SYM[t.zustand] || '·'}</span>
          <span class="pc-txt"><b>${escHtml(t.titel)}</b><span>${escHtml(t.sub || '')}</span></span>
          <span class="pc-punkte">${t.zustand === 'nicht_bewertbar' ? 'n. b.' : t.punkte + '/' + t.max}</span>
        </div>`).join('')}
      </div></div>
      <div class="hin"><span class="hin-i">i</span><div>
        <b>„Nicht bewertbar" heißt nicht „schlecht".</b> Solche Punkte senken die erreichbare
        Punktzahl und zählen weder dafür noch dagegen. Die Profil-Kategorie zum Beispiel wird
        nicht für jedes Konto geliefert und auf TikTok für gar keines — daraus „privates Konto"
        zu machen wäre eine Behauptung über dein Profil statt einer Messung.</div></div>
    </div>`
  }
  return h
}

function brZeichnen() {
  const el = document.getElementById('br-inhalt')
  if (!el) return
  const oben = brOben()
  if (!brv.kanal) { el.innerHTML = oben + brSperreHtml(); return }

  const r     = brErgebnis()
  const kan   = brv.daten.stats.map(x => x.platform)
  /* Geteilt wird der Stand des staerkeren Kanals -- derselbe, an dem die
     Gesamtansicht misst. Sonst zeigte die App eine Zahl und der geteilte
     Link eine andere. */
  if (brv.ansicht === 'gesamt' && r && r.gemessenAnKey) brv.kanal = r.gemessenAnKey
  const saetze = brSaetze(r)

  /* Alles, was Punkte bringen kann: offene Fragen und Luecken in EINER
     Liste, sortiert nach Gewinn. Hinweise (max 0) tauchen hier nicht auf. */
  const luecken = r.kriterien.filter(x => x.punkte != null && x.punkte < x.max)
    .map(x => ({ art: 'luecke', gewinn: x.max - x.punkte, k: x }))
  const fragen = r.fragen.map(f => ({ art: 'frage', gewinn: f.max, f }))
  const tun = [...fragen, ...luecken].sort((a, b) => b.gewinn - a.gewinn)

  const fertig  = r.kriterien.filter(x => x.punkte != null && x.punkte >= x.max)
  const ruhend  = r.kriterien.filter(x => x.punkte == null)

  const u = 2 * Math.PI * 32
  const an = r.max > 0 ? r.punkte / r.max * u : 0

  el.innerHTML = oben + `
    <div class="section-header" style="padding:var(--s-6) var(--page-x) 0">
      <div class="section-title">Wie eine Marke deinen Kanal sieht</div>
    </div>
    <div class="br-kopf">
      <div class="br-ring">
        <svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true">
          <defs>
            <linearGradient id="br-ring-verlauf" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--v1)"/><stop offset=".5" stop-color="var(--v2)"/><stop offset="1" stop-color="var(--v3)"/>
            </linearGradient>
          </defs>
          <circle cx="38" cy="38" r="32" fill="none" stroke="var(--surface2)" stroke-width="8"/>
          <circle cx="38" cy="38" r="32" fill="none" stroke="url(#br-ring-verlauf)" stroke-width="8"
            stroke-linecap="round" stroke-dasharray="${an.toFixed(1)} ${u.toFixed(1)}"/>
        </svg><b>${r.punkte}</b></div>
      <div class="br-kopf-txt">
        <div class="br-kopf-titel">${r.punkte} von ${r.max} bewertbaren Punkten</div>
        <div class="br-kopf-sub">${brv.ansicht === 'gesamt' ? 'Dein Konto' : (BR_PLAT[brv.ansicht] || brv.ansicht)} · Analyse vom ${brDatum(r.stichtag)}${r.offen ? ' · ' + r.offen + ' ohne Wertung' : ''}</div>
      </div>
    </div>

    <div class="br-saetze">${saetze.map((x, i) => `<div class="br-satz${i === 0 ? ' haupt' : ''}">${brSatzHtml(x)}</div>`).join('')}</div>

    ${kan.length > 1 ? `<div class="br-tabs">
      <button class="br-tab${brv.ansicht === 'gesamt' ? ' aktiv' : ''}" onclick="brAnsicht('gesamt')">Gesamt</button>
      ${kan.map(pf =>
        `<button class="br-tab${pf === brv.ansicht ? ' aktiv' : ''}" onclick="brAnsicht('${pf}')">${BR_PLAT[pf] || pf}</button>`).join('')}
    </div>` : ''}

    ${tun.length ? `<div class="section">
      <div class="section-label">Was du jetzt gewinnen kannst</div>
      <div class="br-tat">${tun.map(brTatZeile).join('')}</div>
    </div>` : ''}

    <div class="section">
      ${brFaltHtml('br-f-ok', 'erfuellt', `${fertig.length} ${fertig.length === 1 ? 'Kriterium' : 'Kriterien'} erfüllt`, fertig)}
      ${ruhend.length ? brFaltHtml('br-f-nb', 'nicht_bewertbar', `${ruhend.length} ohne Wertung`, ruhend) : ''}
    </div>

    ${brTeilenHtml()}

    <div class="br-fuss">
      Punkte aus deinen Analyse-Daten vom ${brDatum(r.stichtag)}. Angaben, die du selbst gemacht hast,
      sind gekennzeichnet und nicht geprüft. Kriterien, zu denen keine Daten vorliegen, fallen aus der
      Wertung — sie kosten dich keine Punkte. Benchmarks: HypeAuditor-Engagement-Daten nach Kanalgröße.
    </div>`
}

/* "Am staerksten: Engagement — 23,91 % ..." -> das Etikett vor dem
   Gedankenstrich wird fett. Drei gleich aussehende Kaesten liest niemand;
   mit Etikett sieht man in einer Sekunde, was worin steht. */
function brSatzHtml(satz) {
  const m = String(satz).match(/^([^—]{3,40}:)\s*(.*)$/s)
  return m ? `<b>${escHtml(m[1])}</b> ${escHtml(m[2])}` : escHtml(satz)
}

let brIdZaehler = 0
function brInfo(text) {
  const id = 'br-i-' + (++brIdZaehler)
  return {
    knopf: `<button class="br-i" onclick="brInfoKlapp('${id}',this)" aria-label="Warum das zählt">i</button>`,
    text: `<div class="br-i-txt" id="${id}">${escHtml(text)}</div>`
  }
}

function brTatZeile(t) {
  if (t.art === 'frage') {
    const f = t.f
    const a = brv.angaben[f.id] || {}
    const I = brInfo('Diese Angabe kann viuno nicht messen. Sie zählt genauso viel wie ein Eintrag in viuno, wird als eigene Angabe gekennzeichnet und nicht geprüft.')
    const eingabe = f.typ === 'zahl'
      ? `<input class="br-zahl" type="number" min="0" step="1" inputmode="numeric" placeholder="–"
           value="${a.zahl == null ? '' : a.zahl}" onchange="brZahlSpeichern('${f.id}', this)">`
      : `<div class="br-wahl">
           <button type="button" class="${a.wert === true ? 'ja-an' : ''}" onclick="brAntwort('${f.id}', true)">Ja</button>
           <button type="button" class="${a.wert === false ? 'nein-an' : ''}" onclick="brAntwort('${f.id}', false)">Nein</button>
         </div>`
    return `<div class="br-tat-zeile">
      <div class="br-gewinn">+${t.gewinn}</div>
      <div class="br-tat-k">
        <div class="br-tat-name"><span>${escHtml(f.text)}</span>${I.knopf}</div>
        <div class="br-tat-tun">${eingabe}${f.hint ? `<span class="br-tat-hint">${escHtml(f.hint)}</span>` : ''}</div>
        ${I.text}
      </div></div>`
  }
  const k = t.k
  const I = brInfo(k.warum)
  return `<div class="br-tat-zeile">
    <div class="br-gewinn">+${t.gewinn}</div>
    <div class="br-tat-k">
      <div class="br-tat-name"><span>${escHtml(k.name)}</span>${I.knopf}</div>
      <div class="br-tat-satz">${escHtml(k.satz)}</div>
      ${!k.tun ? '' : k.tun.art === 'route'
        ? `<div class="br-tat-tun"><a class="br-knopf" href="${k.tun.route}">${escHtml(k.tun.label)} →</a></div>`
        : `<div class="br-i-txt auf" style="margin-top:9px">${escHtml(k.tun.label)}</div>`}
      ${I.text}
    </div></div>`
}

function brFaltHtml(id, sym, titel, liste) {
  return `<div class="br-falt">
    <button class="br-falt-kopf" onclick="brFalten('${id}',this)" aria-expanded="false">
      <div class="br-sym ${sym}">${BR_SYM[sym]}</div><span>${escHtml(titel)}</span><em>ansehen</em>
    </button>
    <div class="br-falt-liste" id="${id}">
      ${liste.map(x => `<div class="br-zeile">
        <div class="br-sym ${x.status}">${BR_SYM[x.status]}</div>
        <div class="br-zeile-k">
          <div class="br-zeile-kopf"><div class="br-zeile-name">${escHtml(x.name)}</div>
            <div class="br-zeile-p${x.punkte == null ? ' grau' : ''}">${x.hinweis ? 'Hinweis' : (x.punkte == null ? '– / ' + x.max : x.punkte + ' / ' + x.max)}</div></div>
          <div class="br-zeile-satz">${escHtml(x.satz)}</div>
          ${BR_QUELLE[x.quelle] ? `<span class="br-badge ${x.quelle}">${BR_QUELLE[x.quelle]}</span>` : ''}
          ${x.knopf ? `<div><a class="br-knopf leise" style="margin-top:8px" href="${x.knopf.route}">${escHtml(x.knopf.label)} ›</a></div>` : ''}
        </div></div>`).join('')}
    </div></div>`
}

/* Teilen. Geteilt wird ausschliesslich: Titel, Punktestand und die zwei
   bis drei Saetze. Keine Kriterienliste, keine Eigenangaben, keine
   Rohzahlen aus der Analyse -- die sind das bezahlte Produkt. */
function brTeilenHtml() {
  const f = brv.freigaben ? brv.freigaben[brv.kanal] : null
  return `<div class="br-teilen">
    <h2>Brand Ready teilen</h2>
    <p>Erzeugt eine öffentliche Seite mit deinem Punktestand und den drei Sätzen darüber —
      sonst nichts. Die Kriterien und deine Angaben bleiben privat. Der Link läuft nach 90 Tagen
      ab und lässt sich jederzeit zurückziehen.</p>
    <div class="br-tat-tun" style="margin-top:12px">
      <button class="br-knopf" id="br-teilen-knopf" onclick="brTeilen()">${SVG_TEILEN_BR} ${f ? 'Link anzeigen' : 'Link erzeugen'}</button>
    </div>
    <div id="br-teilen-ergebnis">${f ? brLinkHtml(f) : ''}</div>
  </div>`
}

window.brInfoKlapp = function (id, btn) {

}
