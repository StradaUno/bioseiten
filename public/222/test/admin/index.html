<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>viuno · Admin</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/222/test/fonts/fonts.css">
<style>
/* ────────────────────────────────────────────────────────────────────────
   Das Admin laeuft auf demselben Token-Block wie die App. Wer dort etwas
   aendert, aendert es hier mit -- das ist der Sinn: zwei Oberflaechen, eine
   Sprache. Die Signatur steht fest auf dem Standard-Verlauf, das Admin
   gehoert keinem Creator.
   ──────────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f6f5fa; --surface:#ffffff; --surface2:#f2f0f8;
  --border:rgba(27,24,38,.09); --border-strong:rgba(27,24,38,.16);
  --text:#17151f; --muted:#4e4a5e; --subtle:#817c92;
  --green:#15784b; --green-bg:#eaf4ef; --green-border:rgba(21,120,75,.2);
  --red:#c23a31;   --red-bg:#fbeeed;   --red-border:rgba(194,58,49,.22);
  --orange:#a8630b;--orange-bg:#fdf3e6;--orange-border:rgba(168,99,11,.22);
  --blue:#4338ca;  --blue-bg:#eef0fd;

  --v1:#6b3fe8; --v2:#b02a7d; --v3:#c87a08;
  --akzent-text:#5b32c9; --akzent-bg:rgba(107,63,232,.10); --akzent-border:rgba(107,63,232,.24);
  --verlauf:linear-gradient(120deg,var(--v1),var(--v2) 55%,var(--v3));

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px;
  --page-x:20px;

  --t-2xs:10px; --t-xs:11px; --t-sm:13px; --t-md:14px; --t-lg:15px; --t-xl:17px; --t-2xl:22px;
  --t-input:16px; --t-num-sm:21px; --t-num:32px;
  --lh-tight:1.35; --lh-body:1.55;
  --fw-md:500; --fw-sb:600; --fw-b:700;

  --r-xs:9px; --r-sm:11px; --r-md:18px; --r-lg:22px; --r-full:99px;
  --sh-card:0 2px 10px rgba(27,24,38,.05);
  --sh-over:0 -6px 28px rgba(27,24,38,.12);
  --field-h:44px; --nav-h:56px; --tab-h:74px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100dvh;color:var(--text);font-size:var(--t-md)}
input,textarea,select,button{font-family:inherit}
input,textarea,select{font-size:var(--t-input)}
a{color:inherit}
.zeile a{text-decoration:none}
.zeile a:hover{text-decoration:underline}
/* Ohne diese Zeile schlaegt jedes display: das hidden-Attribut -- die
   Zaehlerpunkte an den Tabs stuenden dann dauerhaft auf 0. */
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--v1);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Zahlen: gleiche Ziffernbreite, damit der Unterschied an der Ziffer auffaellt
   und nicht an der Laenge. Jede neue Zahlenklasse gehoert in diese Liste. */
.zahl,.kpi-wert,.sb-wert,.gt-wert,.row-wert,.bar-wert,.tile-wert,.g-wert,.fs-wert,.kv-wert{
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ── Login ─────────────────────────────────────────────────────────── */
#login{min-height:100dvh;display:none;align-items:center;justify-content:center;padding:var(--s-6);flex-direction:column}
#login.an{display:flex}
.login-karte{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:var(--s-8) var(--s-6)}
.marke{display:flex;align-items:center;gap:var(--s-2);margin-bottom:var(--s-6)}
.marke-zeichen{width:32px;height:32px;border-radius:var(--r-xs);background:var(--verlauf);color:#fff;
  display:grid;place-items:center;font-size:var(--t-md);font-weight:var(--fw-b)}
.marke-text{font-size:var(--t-xl);font-weight:var(--fw-b);letter-spacing:-.03em}
.marke-badge{margin-left:auto;background:var(--akzent-bg);color:var(--akzent-text);font-size:var(--t-2xs);
  font-weight:var(--fw-b);padding:3px 8px;border-radius:var(--r-full);text-transform:uppercase;letter-spacing:.06em}
.login-titel{font-size:var(--t-2xl);font-weight:var(--fw-b);letter-spacing:-.03em;margin-bottom:var(--s-1)}
.login-sub{font-size:var(--t-sm);color:var(--muted);margin-bottom:var(--s-5)}
.feld{margin-bottom:var(--s-3)}
.feld label{display:block;font-size:var(--t-xs);font-weight:var(--fw-sb);color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--s-1)}
.feld input{width:100%;height:var(--field-h);padding:0 var(--s-3);border:1px solid var(--border-strong);
  border-radius:var(--r-sm);color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
.feld input:focus{border-color:var(--v1)}
.knopf{width:100%;height:var(--field-h);background:var(--text);color:#fff;border:none;border-radius:var(--r-sm);
  font-size:var(--t-md);font-weight:var(--fw-sb);cursor:pointer;margin-top:var(--s-2)}
.knopf:disabled{opacity:.5;cursor:not-allowed}
.login-fehler{font-size:var(--t-sm);color:var(--red);margin-top:var(--s-3);text-align:center;min-height:18px}

/* ── Rahmen ────────────────────────────────────────────────────────── */
#app{display:none;min-height:100dvh;flex-direction:column}
#app.an{display:flex}
.kopf{position:sticky;top:0;z-index:50;background:rgba(246,245,250,.93);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:0 var(--page-x);height:var(--nav-h);
  display:flex;align-items:center;gap:var(--s-3);flex-shrink:0}
.kopf-zeichen{width:26px;height:26px;border-radius:7px;background:var(--verlauf);color:#fff;
  display:grid;place-items:center;font-size:var(--t-sm);font-weight:var(--fw-b);flex-shrink:0}
.kopf-titel{font-size:var(--t-lg);font-weight:var(--fw-b);letter-spacing:-.03em}
.kopf-rechts{margin-left:auto;display:flex;align-items:center;gap:var(--s-2)}
.icon-knopf{width:34px;height:34px;border-radius:var(--r-xs);background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:var(--t-md)}
.icon-knopf:hover{background:var(--surface2);color:var(--text)}
.dreht{animation:dreh 1s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
.zeitwahl{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-full);padding:2px}
.zeitwahl button{border:none;background:none;font-size:var(--t-xs);font-weight:var(--fw-sb);color:var(--muted);
  padding:4px 9px;border-radius:var(--r-full);cursor:pointer}
.zeitwahl button.an{background:var(--text);color:#fff}

/* Subnav — der Router zeichnet sie, nicht die Ansichten. Wie in der App. */
#subnav{padding:var(--s-3) var(--page-x) 0;display:none;gap:var(--s-2)}
#subnav.an{display:flex}
.pille{border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:var(--t-sm);
  font-weight:var(--fw-sb);padding:7px 14px;border-radius:var(--r-full);cursor:pointer;white-space:nowrap}
.pille.an{background:var(--text);color:#fff;border-color:var(--text)}

main{flex:1;padding:0 var(--page-x) calc(var(--tab-h) + var(--safe-bottom) + var(--s-6));
  display:flex;flex-direction:column;gap:var(--s-4)}
.seiten-titel{font-size:var(--t-2xl);font-weight:var(--fw-b);letter-spacing:-.04em;padding-top:var(--s-5)}
.seiten-sub{font-size:var(--t-sm);color:var(--muted);margin-top:2px}

/* Untere Leiste — fuenf Ziele, wie in der App. */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--tab-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);background:rgba(255,255,255,.94);backdrop-filter:blur(18px);
  border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;color:var(--subtle);font-size:var(--t-2xs);font-weight:var(--fw-sb);position:relative;
  letter-spacing:.02em}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.an{color:var(--v1)}
.tab-punkt{position:absolute;top:13px;right:calc(50% - 17px);min-width:16px;height:16px;padding:0 4px;
  border-radius:var(--r-full);background:var(--red);color:#fff;font-size:9px;font-weight:var(--fw-b);
  display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* ── Karten ────────────────────────────────────────────────────────── */
.karte{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--sh-card);overflow:hidden}
.karte-kopf{padding:var(--s-4) var(--s-4) var(--s-3)}
.karte-titel{font-size:var(--t-lg);font-weight:var(--fw-sb);letter-spacing:-.01em;display:flex;align-items:center;gap:var(--s-2)}
.karte-sub{font-size:var(--t-xs);color:var(--subtle);margin-top:2px;line-height:var(--lh-tight)}
.karte-koerper{padding:0 var(--s-4) var(--s-4)}
.karte-koerper.voll{padding:0}

.leer{padding:var(--s-8) var(--s-4);text-align:center;color:var(--subtle);font-size:var(--t-sm)}
.leer b{display:block;color:var(--muted);font-weight:var(--fw-sb);margin-bottom:3px;font-size:var(--t-md)}

/* ── Meldungen: nur da, wenn es etwas zu melden gibt ──────────────── */
.meldungen{display:flex;flex-direction:column;gap:var(--s-2)}
.meldung{display:flex;align-items:flex-start;gap:var(--s-3);width:100%;text-align:left;
  padding:var(--s-3) var(--s-4);border-radius:var(--r-md);border:1px solid;cursor:pointer;
  background:var(--surface);font-size:var(--t-md);line-height:var(--lh-tight)}
.meldung .m-i{width:22px;height:22px;border-radius:var(--r-full);display:grid;place-items:center;
  font-size:var(--t-xs);font-weight:var(--fw-b);flex-shrink:0;margin-top:1px;color:#fff}
.meldung .m-t{flex:1;min-width:0}
.meldung .m-t b{display:block;font-weight:var(--fw-sb)}
.meldung .m-t span{display:block;color:var(--muted);font-size:var(--t-sm);margin-top:2px}
.meldung .m-p{color:var(--subtle);flex-shrink:0;align-self:center;font-size:var(--t-lg)}
.meldung.rot{background:var(--red-bg);border-color:var(--red-border)} .meldung.rot .m-i{background:var(--red)}
.meldung.orange{background:var(--orange-bg);border-color:var(--orange-border)} .meldung.orange .m-i{background:var(--orange)}
.meldung.info{background:var(--surface);border-color:var(--border)} .meldung.info .m-i{background:var(--subtle)}
.meldung.gut{background:var(--green-bg);border-color:var(--green-border)} .meldung.gut .m-i{background:var(--green)}

/* ── Kennzahlen ───────────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:var(--s-3)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);
  padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-1);text-align:left;cursor:pointer;width:100%}
.kpi-label{font-size:var(--t-2xs);font-weight:var(--fw-sb);color:var(--subtle);text-transform:uppercase;letter-spacing:.06em}
.kpi-wert{font-size:var(--t-num);font-weight:var(--fw-b);line-height:1;margin-top:var(--s-1)}
.kpi-sub{font-size:var(--t-xs);color:var(--subtle);line-height:var(--lh-tight)}
.kpi.verlauf .kpi-wert{background:var(--verlauf);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi.gut .kpi-wert{color:var(--green)} .kpi.rot .kpi-wert{color:var(--red)}

/* ── Schnellblick heute / woche ───────────────────────────────────── */
.sb-paar{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
@media(max-width:560px){.sb-paar{grid-template-columns:1fr}}
.sb-zeile{display:flex;align-items:center;gap:var(--s-3);padding:9px 0;border-bottom:1px solid var(--border)}
.sb-zeile:last-child{border-bottom:none}
.sb-name{flex:1;font-size:var(--t-sm);color:var(--muted)}
.sb-wert{font-size:var(--t-lg);font-weight:var(--fw-b)}
.sb-wert.gut{color:var(--green)} .sb-wert.rot{color:var(--red)}

/* ── Listenzeilen ─────────────────────────────────────────────────── */
.liste{display:flex;flex-direction:column}
.zeile{display:flex;align-items:center;gap:var(--s-3);padding:11px var(--s-4);border-bottom:1px solid var(--border);
  min-width:0;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font:inherit;color:inherit}
.zeile:last-child{border-bottom:none}
button.zeile{cursor:pointer}
button.zeile:hover{background:var(--surface2)}
.avatar{width:34px;height:34px;border-radius:var(--r-xs);flex-shrink:0;display:grid;place-items:center;
  font-size:var(--t-sm);font-weight:var(--fw-b);background:var(--surface2);color:var(--muted)}
.zeile-mitte{flex:1;min-width:0}
.zeile-titel{font-size:var(--t-md);font-weight:var(--fw-sb);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.zeile-sub{font-size:var(--t-xs);color:var(--subtle);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile-rechts{text-align:right;flex-shrink:0}
.row-wert{font-size:var(--t-md);font-weight:var(--fw-b)}
.row-sub{font-size:var(--t-xs);color:var(--subtle);margin-top:1px}

.tag{font-size:var(--t-2xs);font-weight:var(--fw-b);letter-spacing:.04em;text-transform:uppercase;
  padding:2px 7px;border-radius:var(--r-full);background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.gut{background:var(--green-bg);color:var(--green)}
.tag.rot{background:var(--red-bg);color:var(--red)}
.tag.orange{background:var(--orange-bg);color:var(--orange)}
.tag.akzent{background:var(--akzent-bg);color:var(--akzent-text)}

/* ── Balken ───────────────────────────────────────────────────────── */
.balken{display:flex;flex-direction:column;gap:var(--s-2);padding-top:var(--s-1)}
.bar{display:grid;grid-template-columns:minmax(74px,1fr) 2fr minmax(60px,auto);gap:var(--s-3);align-items:center}
.bar-name{font-size:var(--t-sm);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-spur{height:7px;border-radius:var(--r-full);background:var(--surface2);overflow:hidden}
.bar-fuell{height:100%;border-radius:var(--r-full);background:var(--verlauf)}
.bar-wert{font-size:var(--t-sm);font-weight:var(--fw-b);text-align:right}

/* ── Guthaben ─────────────────────────────────────────────────────── */
.guthaben{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
@media(max-width:620px){.guthaben{grid-template-columns:1fr}}
.g-karte{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);
  padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3)}
.g-karte.knapp{border-color:var(--orange-border)}
.g-karte.leer{border-color:var(--red-border)}
.g-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-2)}
.g-name{font-size:var(--t-lg);font-weight:var(--fw-sb)}
.g-rate{font-size:var(--t-xs);color:var(--subtle);font-variant-numeric:tabular-nums}
.g-spur{height:10px;border-radius:var(--r-full);background:var(--surface2);overflow:hidden}
.g-fuell{height:100%;border-radius:var(--r-full);background:var(--green);transition:width .3s ease}
.g-fuell.knapp{background:var(--orange)} .g-fuell.leer{background:var(--red)}
.g-zahlen{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2)}
.g-label{font-size:var(--t-2xs);font-weight:var(--fw-sb);color:var(--subtle);text-transform:uppercase;letter-spacing:.05em}
.g-wert{font-size:var(--t-num-sm);font-weight:var(--fw-b);margin-top:2px;line-height:1.1}
.g-hinweis{font-size:var(--t-sm);font-weight:var(--fw-sb);padding:9px var(--s-3);border-radius:var(--r-sm);line-height:var(--lh-tight)}
.g-hinweis.gut{background:var(--green-bg);color:var(--green)}
.g-hinweis.knapp{background:var(--orange-bg);color:var(--orange)}
.g-hinweis.leer{background:var(--red);color:#fff}
.g-hinweis.info{background:var(--surface2);color:var(--muted);font-weight:var(--fw-md)}
.g-eingabe{display:flex;gap:var(--s-2);align-items:center}
.g-eingabe input{flex:1;min-width:0;height:38px;padding:0 var(--s-3);border:1px solid var(--border-strong);
  border-radius:var(--r-sm);background:var(--bg);color:var(--text);outline:none;font-weight:var(--fw-sb);
  font-variant-numeric:tabular-nums}
.g-eingabe input:focus{border-color:var(--v1)}
.g-eingabe button{height:38px;padding:0 var(--s-4);border:none;border-radius:var(--r-sm);background:var(--text);
  color:#fff;font-size:var(--t-sm);font-weight:var(--fw-sb);cursor:pointer;flex-shrink:0}

/* ── Trichter ─────────────────────────────────────────────────────── */
.trichter{display:flex;flex-direction:column;gap:var(--s-2);padding-top:var(--s-1)}
.fs{display:grid;grid-template-columns:minmax(86px,110px) 1fr;gap:var(--s-3);align-items:center}
.fs-name{font-size:var(--t-sm);color:var(--muted)}
.fs-bar{height:30px;border-radius:var(--r-sm);background:var(--verlauf);display:flex;align-items:center;
  padding-inline:10px;color:#fff;font-size:var(--t-sm);font-weight:var(--fw-b);min-width:46px}
.fs-bar.unbekannt{background:repeating-linear-gradient(135deg,var(--surface2) 0 7px,var(--bg) 7px 14px);
  color:var(--subtle);border:1px solid var(--border)}

/* ── Akte ─────────────────────────────────────────────────────────── */
.akte-kopf{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4);border-bottom:1px solid var(--border)}
.akte-zu{margin-left:auto;width:32px;height:32px;border-radius:var(--r-xs);border:1px solid var(--border);
  background:var(--surface);cursor:pointer;color:var(--muted);font-size:var(--t-lg);flex-shrink:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:var(--s-3);padding:var(--s-4)}
.kv > .breit{grid-column:span 2}
@media(max-width:420px){.kv > .breit{grid-column:span 1}}
.kv-label{font-size:var(--t-2xs);font-weight:var(--fw-sb);color:var(--subtle);text-transform:uppercase;letter-spacing:.05em}
.kv-wert{font-size:var(--t-lg);font-weight:var(--fw-b);margin-top:2px}
.kv-wert.klein{font-size:var(--t-sm);font-weight:var(--fw-md);word-break:break-word}
.abschnitt{font-size:var(--t-2xs);font-weight:var(--fw-b);color:var(--subtle);text-transform:uppercase;
  letter-spacing:.08em;padding:var(--s-3) var(--s-4) var(--s-2);border-top:1px solid var(--border)}
.aktionen{display:flex;flex-wrap:wrap;gap:var(--s-2);padding:0 var(--s-4) var(--s-4)}
.akt{font-size:var(--t-sm);font-weight:var(--fw-sb);padding:9px 13px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);cursor:pointer}
.akt:hover{border-color:var(--v1);color:var(--akzent-text)}
.akt.rot{color:var(--red);border-color:var(--red-border)}
.akt:disabled{opacity:.45;cursor:not-allowed}

/* ── Suche ────────────────────────────────────────────────────────── */
.suche{display:flex;gap:var(--s-2);align-items:center}
.suche input{flex:1;height:var(--field-h);padding:0 var(--s-4);border:1px solid var(--border);border-radius:var(--r-full);
  background:var(--surface);color:var(--text);outline:none;box-shadow:var(--sh-card)}
.suche input:focus{border-color:var(--v1)}
.filter{display:flex;gap:6px;flex-wrap:wrap}

/* ── Sonstiges ────────────────────────────────────────────────────── */
.fuss{text-align:center;font-size:var(--t-xs);color:var(--subtle);padding:var(--s-2) 0 0;line-height:var(--lh-body)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--safe-bottom) + 14px);
  z-index:90;background:var(--text);color:#fff;font-size:var(--t-sm);font-weight:var(--fw-md);
  padding:11px var(--s-4);border-radius:var(--r-full);box-shadow:var(--sh-over);max-width:min(440px,90vw)}
#toast[hidden]{display:none}
#modal{position:fixed;inset:0;z-index:100;background:rgba(23,21,31,.45);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.modal-karte{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--sh-over);
  width:100%;max-width:460px;padding:var(--s-6) var(--s-5) calc(var(--s-6) + var(--safe-bottom))}
@media(min-width:560px){#modal{align-items:center}.modal-karte{border-radius:var(--r-lg)}}
.modal-titel{font-size:var(--t-xl);font-weight:var(--fw-b);letter-spacing:-.02em;margin-bottom:var(--s-2)}
.modal-text{font-size:var(--t-md);color:var(--muted);line-height:var(--lh-body);margin-bottom:var(--s-5)}
.modal-knoepfe{display:flex;gap:var(--s-2)}
.modal-knoepfe button{flex:1;height:var(--field-h);border-radius:var(--r-sm);font-size:var(--t-md);
  font-weight:var(--fw-sb);cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--muted)}
.modal-knoepfe button.haupt{background:var(--text);color:#fff;border-color:var(--text)}
.modal-knoepfe button.gefahr{background:var(--red);color:#fff;border-color:var(--red)}
.lade{height:3px;background:var(--verlauf);position:fixed;top:0;left:0;right:0;z-index:80;transform-origin:left;
  animation:laden 1.1s ease-in-out infinite}
.lade[hidden]{display:none}
@keyframes laden{0%{transform:scaleX(0)}50%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:0}}
</style>
</head>
<body>

<div class="lade" id="lade" hidden></div>

<!-- ── Login ──────────────────────────────────────────────────────── -->
<div id="login">
  <div class="login-karte">
    <div class="marke">
      <div class="marke-zeichen">v</div>
      <div class="marke-text">viuno</div>
      <div class="marke-badge">Admin</div>
    </div>
    <div class="login-titel">Anmelden</div>
    <div class="login-sub">Nur fuer Konten mit Admin-Recht.</div>
    <div class="feld"><label for="in-mail">E-Mail</label><input id="in-mail" type="email" autocomplete="username"></div>
    <div class="feld"><label for="in-pw">Passwort</label><input id="in-pw" type="password" autocomplete="current-password"></div>
    <button class="knopf" id="btn-login">Einloggen</button>
    <div class="login-fehler" id="login-fehler"></div>
  </div>
</div>

<!-- ── App ────────────────────────────────────────────────────────── -->
<div id="app">
  <div class="kopf">
    <div class="kopf-zeichen">v</div>
    <div class="kopf-titel" id="kopf-titel">Start</div>
    <div class="kopf-rechts">
      <div class="zeitwahl" id="zeitwahl">
        <button data-tage="7">7T</button>
        <button data-tage="30" class="an">30T</button>
        <button data-tage="365">1J</button>
      </div>
      <button class="icon-knopf" id="btn-neu" title="Neu laden" aria-label="Neu laden">&#8635;</button>
      <button class="icon-knopf" id="btn-raus" title="Abmelden" aria-label="Abmelden">&#9099;</button>
    </div>
  </div>

  <div id="subnav"></div>
  <main id="inhalt"></main>

  <nav class="tabs" id="tabs"></nav>
</div>

<div id="toast" hidden></div>
<div id="modal" hidden>
  <div class="modal-karte">
    <div class="modal-titel" id="modal-titel"></div>
    <div class="modal-text" id="modal-text"></div>
    <div class="modal-knoepfe">
      <button id="modal-nein">Abbrechen</button>
      <button id="modal-ja" class="haupt">OK</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from '/222/test/vendor/supabase-js.mjs'

const URL_SB = 'https://bzejndghppuipnedasuv.supabase.co'
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6ZWpuZGdocHB1aXBuZWRhc3V2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTMxOTcsImV4cCI6MjA4OTIyOTE5N30.TShH1cIABQCtKgLkhCS9ymUJ36ZUYnlvCnGTok6EKTo'
const sb = createClient(URL_SB, ANON, { auth: { persistSession: true, autoRefreshToken: true } })

/* ── Zustand ───────────────────────────────────────────────────────── */
const z = {
  d: null,            // Antwort von admin_uebersicht()
  bereich: 'start',
  tage: 30,
  akte: null,         // offene User-Akte
  suche: '',
  filter: 'alle',
  ich: null,
}

/* ── Werkzeug ──────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const n0 = n => (n == null || isNaN(+n)) ? '–' : (+n).toLocaleString('de-DE')
const eurC = c => ((+c || 0) / 100).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'
const eur  = v => (+v || 0).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'
const eurK = v => { const x = +v || 0; return x > 0 && x < 0.01 ? '<0,01 €' : eur(x) }
const initial = s => String(s || '?').trim().charAt(0).toUpperCase() || '?'
const tagD = (a, b) => (new Date(b) - new Date(a)) / 864e5
const datum = d => d ? new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: 'short', year: 'numeric' }) : '–'
const kurzD = d => d ? new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: 'short' }) : '–'
const uhr = d => d ? new Date(d).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '–'
function vor(d) {
  if (!d) return 'nie'
  const m = Math.floor((Date.now() - new Date(d)) / 6e4)
  if (m < 1) return 'gerade eben'
  if (m < 60) return 'vor ' + m + ' Min'
  const h = Math.floor(m / 60); if (h < 24) return 'vor ' + h + ' Std'
  const t = Math.floor(h / 24); if (t < 7) return 'vor ' + t + (t === 1 ? ' Tag' : ' Tagen')
  return kurzD(d)
}
function toast(text, ms = 3000) {
  const t = $('#toast'); t.textContent = text; t.hidden = false
  clearTimeout(t._t); t._t = setTimeout(() => { t.hidden = true }, ms)
}
function frage(titel, text, ja = 'OK', gefahr = false) {
  return new Promise(res => {
    $('#modal-titel').textContent = titel
    $('#modal-text').textContent = text
    const b = $('#modal-ja'); b.textContent = ja
    b.classList.toggle('gefahr', gefahr); b.classList.toggle('haupt', !gefahr)
    $('#modal').hidden = false
    const zu = () => { $('#modal').hidden = true; b.onclick = null; $('#modal-nein').onclick = null }
    b.onclick = () => { zu(); res(true) }
    $('#modal-nein').onclick = () => { zu(); res(false) }
  })
}

/* ── Navigation: fuenf Ziele, zwei davon mit Unterpillen. Genau wie in
      der App -- die Ansichten zeichnen die Pillenreihe nicht selbst. ── */
const ZIELE = [
  { k: 'start',    l: 'Start',    i: 'M3 11l9-8 9 8M5 10v10h14V10' },
  { k: 'geld',     l: 'Geld',     i: 'M3 7h18v12H3zM3 11h18M7 15h3' },
  { k: 'menschen', l: 'Menschen', i: 'M16 19v-2a4 4 0 0 0-8 0v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8' },
  { k: 'traffic',  l: 'Traffic',  i: 'M3 18l5-6 4 4 5-8 4 5' },
  { k: 'system',   l: 'System',   i: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7' },
]
const UNTER = {
  geld:     [{ k: 'umsatz', l: 'Umsatz' }, { k: 'kosten', l: 'Kosten' }],
  menschen: [{ k: 'user',   l: 'User'   }, { k: 'newsletter', l: 'Newsletter' }],
}
let unterAktiv = { geld: 'umsatz', menschen: 'user' }

/* ── Anmeldung ─────────────────────────────────────────────────────── */
async function start() {
  const { data: { session } } = await sb.auth.getSession()
  if (session) { const ok = await pruefeAdmin(session.user.id); if (ok) return rein() }
  $('#login').classList.add('an')
}
async function pruefeAdmin(uid) {
  const { data } = await sb.from('users').select('id, display_name, email, is_admin').eq('id', uid).maybeSingle()
  if (!data?.is_admin) return false
  z.ich = data; return true
}
async function anmelden() {
  const mail = $('#in-mail').value.trim(), pw = $('#in-pw').value
  const f = $('#login-fehler'), b = $('#btn-login')
  f.textContent = ''; b.disabled = true; b.textContent = 'Moment …'
  const { data, error } = await sb.auth.signInWithPassword({ email: mail, password: pw })
  b.disabled = false; b.textContent = 'Einloggen'
  if (error) { f.textContent = 'E-Mail oder Passwort stimmt nicht.'; return }
  if (!await pruefeAdmin(data.session.user.id)) {
    await sb.auth.signOut(); f.textContent = 'Dieses Konto hat kein Admin-Recht.'; return
  }
  rein()
}
function rein() {
  $('#login').classList.remove('an'); $('#login').style.display = 'none'
  $('#app').classList.add('an')
  zeichneTabs()
  laden()
}
$('#btn-login').addEventListener('click', anmelden)
$('#in-pw').addEventListener('keydown', e => { if (e.key === 'Enter') anmelden() })
$('#btn-raus').addEventListener('click', async () => { await sb.auth.signOut(); location.reload() })
$('#btn-neu').addEventListener('click', () => laden(true))

/* ── Daten holen ───────────────────────────────────────────────────── */
async function laden(spin = false) {
  $('#lade').hidden = false
  if (spin) $('#btn-neu').classList.add('dreht')
  try {
    const { data, error } = await sb.rpc('admin_uebersicht', { p_tage: z.tage })
    if (error) throw error
    z.d = data
    zeichne()
  } catch (err) {
    console.error(err)
    if (String(err.message || '').includes('kein_admin')) {
      toast('Kein Admin-Recht mehr. Bitte neu anmelden.', 5000)
      setTimeout(() => location.reload(), 2000)
    } else {
      toast('Konnte nicht laden: ' + (err.message || err), 6000)
    }
  } finally {
    $('#lade').hidden = true
    $('#btn-neu').classList.remove('dreht')
  }
}

/* Schreibende Aktion ueber die Edge Function (Service Role). */
async function aktion(name, koerper = {}) {
  const { data: { session } } = await sb.auth.getSession()
  if (!session) { toast('Sitzung abgelaufen'); setTimeout(() => location.reload(), 1200); throw new Error('keine_session') }
  const res = await fetch(URL_SB + '/functions/v1/admin-dashboard?action=' + encodeURIComponent(name), {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
    body: JSON.stringify(koerper),
  })
  const body = await res.json().catch(() => ({}))
  if (!res.ok || body.error) throw new Error(body.error || ('HTTP ' + res.status))
  return body
}

/* ── Meldungen: die Liste ist leer, wenn nichts anliegt ───────────── */
function meldungen() {
  const d = z.d, m = []
  if (d.modus.stripe === 'test') m.push({ art: 'orange', i: '!', t: 'Stripe laeuft im Testmodus',
    s: 'Es gibt keine Live-Preiszeile. Alles, was unter Umsatz steht, ist Testgeld.', ziel: 'geld' })

  for (const g of d.kosten.guthaben) {
    const name = g.anbieter === 'anthropic' ? 'Anthropic' : 'Apify'
    if (!g.vorhanden) {
      m.push({ art: 'info', i: '?', t: name + '-Guthaben nicht hinterlegt',
        s: 'Ohne Guthaben ist der Verbrauch eine nackte Zahl. Betrag unter Geld → Kosten eintragen.',
        ziel: 'geld', unter: 'kosten' })
      continue
    }
    const r = rest(g)
    if (r.tage != null && r.tage <= 7) m.push({ art: 'rot', i: '!', t: name + '-Guthaben reicht ' + r.tage + ' Tage',
      s: 'Noch ' + eur(r.rest) + ' bei ' + eurK(r.proTag) + ' pro Tag. Leer am ' + datum(r.leerAm) + '.',
      ziel: 'geld', unter: 'kosten' })
    else if (r.tage != null && r.tage <= 21) m.push({ art: 'orange', i: '!', t: name + '-Guthaben wird knapp',
      s: 'Noch ' + eur(r.rest) + ', reicht etwa ' + r.tage + ' Tage.', ziel: 'geld', unter: 'kosten' })
  }

  if (!d.kosten.apify_erfasst) m.push({ art: 'info', i: '?', t: 'Apify-Kosten werden noch nicht erfasst',
    s: 'Der naechste Analyse-Lauf traegt sie ein. Bis dahin ist die Marge je Verkauf unbekannt.', ziel: 'geld', unter: 'kosten' })

  if (d.system.fehler_offen > 0) m.push({ art: 'rot', i: '!', t: d.system.fehler_offen + ' offene Fehler',
    s: (d.system.fehler[0] ? 'Zuletzt ' + d.system.fehler[0].function + ', ' + vor(d.system.fehler[0].letzte) : ''), ziel: 'system' })

  const cronKaputt = (d.system.cron || []).filter(c => c.status && c.status !== 'succeeded')
  if (cronKaputt.length) m.push({ art: 'rot', i: '!', t: cronKaputt.length + ' Cron-Job' + (cronKaputt.length > 1 ? 's' : '') + ' fehlgeschlagen',
    s: cronKaputt.map(c => c.name).join(', '), ziel: 'system' })

  if (d.system.analysen.laufend > 0) m.push({ art: 'info', i: '~', t: d.system.analysen.laufend + ' Analyse laeuft gerade',
    s: 'Der Waechter raeumt alle 5 Minuten haengende Laeufe ab.', ziel: 'system' })
  if (d.system.analysen.fehler > 0) m.push({ art: 'orange', i: '!', t: d.system.analysen.fehler + ' fehlgeschlagene Analysen',
    s: 'Dafuer wurde bezahlt — die Freischaltung sollte zurueck.', ziel: 'system' })

  if (d.geld.kaeufe_offen > 0) m.push({ art: 'gut', i: '€', t: d.geld.kaeufe_offen + ' bezahlte Analyse' + (d.geld.kaeufe_offen > 1 ? 'n' : '') + ' noch nicht eingeloest',
    s: 'Freischaltung liegt bereit, der Lauf wurde noch nicht gestartet.', ziel: 'geld' })

  if (d.traffic.funnel.landing === 0) m.push({ art: 'info', i: '?', t: 'Die Startseite zaehlt noch nicht',
    s: 'Sobald viuno.de ausgeliefert ist, fuellt sich der Trichter unter Traffic.', ziel: 'traffic' })

  return m
}

/* Guthaben ausrechnen: Rest, Verbrauch pro Tag, Reichweite. */
function rest(g) {
  if (!g.vorhanden) return { rest: 0, proTag: 0, tage: null }
  const r = Math.max(0, (+g.betrag_eur || 0) - (+g.verbraucht_eur || 0))
  const seit = Math.max(tagD(g.stand_am, Date.now()), 0.5)
  const proTag = (+g.verbraucht_eur || 0) / seit
  const tage = proTag > 0 ? Math.floor(r / proTag) : null
  return { rest: r, proTag, tage, anteil: g.betrag_eur > 0 ? Math.max(0, Math.min(100, r / g.betrag_eur * 100)) : 0,
           leerAm: tage != null ? new Date(Date.now() + tage * 864e5) : null, messbar: g.messbar }
}

/* ── Bausteine ─────────────────────────────────────────────────────── */
const karte = (titel, sub, koerper, voll) => `<section class="karte">
  ${titel ? `<div class="karte-kopf"><h2 class="karte-titel">${titel}</h2>${sub ? `<div class="karte-sub">${sub}</div>` : ''}</div>` : ''}
  <div class="karte-koerper ${voll ? 'voll' : ''}">${koerper}</div></section>`

const leer = (t, s) => `<div class="leer"><b>${esc(t)}</b>${esc(s || '')}</div>`

function balken(reihen, fmt) {
  if (!reihen.length) return leer('Noch nichts', 'Fuer diesen Zeitraum liegen keine Daten vor.')
  const max = Math.max(...reihen.map(r => +r.anzahl || +r.wert || 0)) || 1
  return `<div class="balken">${reihen.map(r => {
    const w = +r.anzahl || +r.wert || 0
    return `<div class="bar"><div class="bar-name" title="${esc(r.name)}">${esc(r.name)}</div>
      <div class="bar-spur"><div class="bar-fuell" style="width:${Math.max(3, w / max * 100)}%"></div></div>
      <div class="bar-wert">${fmt ? fmt(r) : n0(w)}</div></div>`
  }).join('')}</div>`
}

function kpi(label, wert, sub, klasse, ziel, unter) {
  return `<button class="kpi ${klasse || ''}" ${ziel ? `data-geh="${ziel}" data-unter="${unter || ''}"` : ''}>
    <span class="kpi-label">${esc(label)}</span><span class="kpi-wert">${wert}</span>
    <span class="kpi-sub">${sub || ''}</span></button>`
}

/* ── Start ─────────────────────────────────────────────────────────── */
function vStart() {
  const d = z.d, m = meldungen()
  const sb7 = d.schnellblick.woche, sbH = d.schnellblick.heute
  const std = new Date().getHours()
  const gruss = std < 5 ? 'Gute Nacht' : std < 12 ? 'Guten Morgen' : std < 18 ? 'Guten Tag' : 'Guten Abend'

  const marge = d.kosten.marge.find(x => x.erfasst > 0)
  const dbTeil = marge
    ? kpi('Deckungsbeitrag', eur(9.99 - (+marge.apify_eur || 0)), 'je Analyse, nach Fremdkosten', 'gut', 'geld', 'kosten')
    : kpi('Deckungsbeitrag', '–', 'Apify-Kosten fehlen noch', '', 'geld', 'kosten')

  const zeilen = (o, klasse) => {
    const items = [
      ['Umsatz', eurC(o.umsatz), o.umsatz > 0],
      ['Kaeufe', n0(o.kaeufe), o.kaeufe > 0],
      ['Neue User', n0(o.user), o.user > 0],
      ['Newsletter', n0(o.newsletter), o.newsletter > 0],
      ['Analysen', n0(o.analysen), o.analysen > 0],
      ['BioLink-Aufrufe', n0(o.biolink), o.biolink > 0],
      ['Media-Kit-Aufrufe', n0(o.mediakit), o.mediakit > 0],
      ['Startseite', n0(o.landing), o.landing > 0],
      ['Neue Fehler', n0(o.fehler), o.fehler > 0, 'rot'],
    ].filter(x => x[2] || x[0] === 'Umsatz')
    if (items.length <= 1 && !o.umsatz) return leer('Nichts passiert', 'Keine Bewegung in diesem Zeitraum.')
    return `<div class="liste">${items.map(x =>
      `<div class="sb-zeile"><span class="sb-name">${x[0]}</span><span class="sb-wert ${x[3] || ''}">${x[1]}</span></div>`).join('')}</div>`
  }

  return `
    <div class="seiten-titel">${gruss}${z.ich?.display_name ? ', ' + esc(z.ich.display_name) : ''}.
      <div class="seiten-sub">${new Date().toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' })}</div>
    </div>

    ${m.length ? `<div class="meldungen">${m.map(x => `
      <button class="meldung ${x.art}" data-geh="${x.ziel}" data-unter="${x.unter || ''}">
        <span class="m-i">${x.i}</span>
        <span class="m-t"><b>${esc(x.t)}</b>${x.s ? `<span>${esc(x.s)}</span>` : ''}</span>
        <span class="m-p">&rsaquo;</span></button>`).join('')}</div>`
      : `<div class="meldung gut" style="cursor:default"><span class="m-i">&check;</span>
         <span class="m-t"><b>Nichts liegt an.</b><span>Keine Fehler, kein knappes Guthaben, keine haengenden Laeufe.</span></span></div>`}

    <div class="kpis">
      ${kpi('Umsatz Monat', eurC(d.geld.umsatz_monat), d.geld.kaeufe_gesamt + ' Kaeufe gesamt' + (d.modus.stripe === 'test' ? ' · Testmodus' : ''), 'verlauf', 'geld')}
      ${kpi('Kosten Monat', eur(d.kosten.ai_monat), d.kosten.ai_calls + ' AI-Aufrufe im Zeitraum', '', 'geld', 'kosten')}
      ${dbTeil}
      ${kpi('User', n0(d.menschen.gesamt), d.menschen.neu_woche + ' neu diese Woche', '', 'menschen')}
    </div>

    <div class="sb-paar">
      ${karte('Heute', new Date().toLocaleDateString('de-DE', { day: '2-digit', month: 'long' }), zeilen(sbH))}
      ${karte('Diese Woche', 'letzte 7 Tage', zeilen(sb7))}
    </div>

    ${karte('Wo die Leute herkommen', 'BioLink-Aufrufe im Zeitraum',
      balken((d.traffic.herkunft_biolink || []).slice(0, 6)))}

    <div class="fuss">Stand ${uhr(d.zeit)} · Fremdkosten umgerechnet mit 1 $ = ${String(d.kurs_usd_eur).replace('.', ',')} €</div>`
}

/* ── Geld → Umsatz ─────────────────────────────────────────────────── */
function vUmsatz() {
  const g = z.d.geld
  const monate = (g.je_monat || []).map(m => ({ name: m.monat, anzahl: m.cent, stk: m.anzahl }))
  return `
    <div class="seiten-titel">Umsatz<div class="seiten-sub">${z.d.modus.stripe === 'test'
      ? 'Stripe steht auf Testmodus — diese Betraege sind kein echtes Geld.'
      : 'Stripe steht auf Live.'}</div></div>

    <div class="kpis">
      ${kpi('Gesamt', eurC(g.umsatz_gesamt), g.kaeufe_gesamt + ' Kaeufe', 'verlauf')}
      ${kpi('Diesen Monat', eurC(g.umsatz_monat), '')}
      ${kpi('Zahlende', n0(g.zahlende), 'von ' + n0(z.d.menschen.gesamt) + ' Usern')}
      ${kpi('Nicht eingeloest', n0(g.kaeufe_offen), 'bezahlt, Analyse nicht gestartet', g.kaeufe_offen ? 'rot' : '')}

    ${karte('Jeder Kauf', g.kaeufe.length + ' Eintraege', g.kaeufe.length ? `<div class="liste">${
      g.kaeufe.map(k => `<div class="zeile">
        <div class="avatar">${initial(k.user)}</div>
        <div class="zeile-mitte">

            <span class="tag ${k.verbraucht ? 'gut' : 'orange'}">${k.verbraucht ? 'eingeloest' : 'offen'}</span>
            ${String(k.session || '').startsWith('admin_') ? '<span class="tag akzent">Freischaltung</span>' : ''}</div>
          <div class="zeile-sub">${esc(k.email || '')} · ${esc(k.platform || '')} · ${uhr(k.am)}</div>
        </div>
        <div class="zeile-rechts"><div class="row-wert">${eurC(k.cent)}</div></div>
      </div>`).join('')}</div>` : leer('Noch keine Kaeufe', 'Sobald jemand eine Analyse freischaltet, steht sie hier.'), true)}

    ${karte('Stripe-Ereignisse', 'kam der Webhook durch?', (g.stripe_events || []).length ? `<div class="liste">${
      g.stripe_events.map(e => `<div class="zeile">
        <div class="zeile-mitte"><div class="zeile-titel">${esc(e.typ)}</div>

        <div class="zeile-rechts"><div class="row-wert">${n0(e.anzahl)}</div><div class="row-sub">verarbeitet</div></div>

}

/* ── Geld → Kosten ─────────────────────────────────────────────────── */
function vKosten() {
  const k = z.d.kosten
  const gk = k.guthaben.map(g => {
    const name = g.anbieter === 'anthropic' ? 'Anthropic' : 'Apify'
    const r = rest(g)
    if (!g.messbar) return `<div class="g-karte">
      <div class="g-kopf"><div class="g-name">${name}</div></div>
      <div class="g-hinweis info">Es ist noch kein Verbrauch erfasst. Der naechste Analyse-Lauf traegt die Apify-Kosten ein — danach rechnet das Guthaben mit.</div>
      ${eingabeGuthaben(g.anbieter, g.betrag_eur)}</div>`
    if (!g.vorhanden) return `<div class="g-karte">
      <div class="g-kopf"><div class="g-name">${name}</div><div class="g-rate">${eurK(verbrauchProTag(g.anbieter))} / Tag</div></div>
      <div class="g-hinweis info">Kein Guthaben hinterlegt. Trag den Betrag ein, der beim Anbieter steht — ab dann rechnet die Tabelle mit.</div>
      ${eingabeGuthaben(g.anbieter, '')}</div>`
    const stufe = r.tage == null ? '' : r.tage <= 7 ? 'leer' : r.tage <= 21 ? 'knapp' : ''
    return `<div class="g-karte ${stufe}">
      <div class="g-kopf"><div class="g-name">${name}</div><div class="g-rate">${eurK(r.proTag)} / Tag</div></div>
      <div class="g-spur"><div class="g-fuell ${stufe}" style="width:${r.anteil}%"></div></div>
      <div class="g-zahlen">
        <div><div class="g-label">Rest</div><div class="g-wert">${eur(r.rest)}</div></div>
        <div><div class="g-label">reicht</div><div class="g-wert">${r.tage == null ? '–' : r.tage + ' T'}</div></div>
        <div><div class="g-label">je Monat</div><div class="g-wert">${eurK(r.proTag * 30)}</div></div>
      </div>
      <div class="g-hinweis ${stufe || 'gut'}">${
        r.tage == null ? 'Seit dem Stichtag kein Verbrauch.'
        : stufe === 'leer' ? 'Auffuellen. Leer am ' + datum(r.leerAm) + '.'
        : stufe === 'knapp' ? 'Bald auffuellen — leer am ' + datum(r.leerAm) + '.'
        : 'Alles in Ordnung bis ' + datum(r.leerAm) + '.'}</div>
      <div class="karte-sub">Eingetragen ${datum(g.stand_am)} mit ${eur(g.betrag_eur)}, seitdem ${eur(g.verbraucht_eur)} verbraucht.</div>
      ${eingabeGuthaben(g.anbieter, '')}</div>`
  }).join('')

  const margeReihen = (k.marge || []).map(m => ({
    name: m.platform === 'tiktok' ? 'TikTok' : 'Instagram',
    wert: m.erfasst > 0 ? 9.99 - (+m.apify_eur || 0) : 0, m,
  }))

  return `
    <div class="seiten-titel">Kosten<div class="seiten-sub">Alles in Euro. Anthropic und Apify rechnen in Dollar; umgerechnet mit 1 $ = ${String(z.d.kurs_usd_eur).replace('.', ',')} €.</div></div>

    <div class="kpis">
      ${kpi('Zeitraum', eur(k.ai_zeitraum), k.ai_calls + ' AI-Aufrufe', 'verlauf')}
      ${kpi('Heute', eurK(k.ai_heute), '')}
      ${kpi('Seit Anfang', eur(k.ai_gesamt), 'alle AI-Kosten')}
      ${kpi('Apify erfasst', k.apify_erfasst + ' / ' + k.apify_laeufe, 'Laeufe mit Kostenangabe', k.apify_erfasst ? '' : 'rot')}
    </div>

    ${karte('Guthaben', 'Betrag eintragen — der Verbrauch wird ab dem Stichtag dagegen gerechnet', `<div class="guthaben">${gk}</div>`)}

    ${karte('Marge je Analyse', 'Verkaufspreis 9,99 € abzueglich der Fremdkosten',
      k.apify_erfasst ? balken(margeReihen, r => r.m.erfasst ? eur(r.wert) : 'noch offen')
      : leer('Noch nicht berechenbar', 'Die Apify-Kosten werden ab dem naechsten Analyse-Lauf mitgeschrieben.'))}

    ${karte('AI-Kosten nach Feature', 'im gewaehlten Zeitraum',
      balken((k.nach_feature || []).map(f => ({ name: f.name, wert: f.eur, calls: f.calls })),
        f => eurK(f.wert) + ' · ' + f.calls))}

    ${karte('Nach Modell', '', balken((k.nach_modell || []).map(m => ({ name: m.name.replace(/^claude-/, '').replace(/-\d{8}$/, ''), wert: m.eur, calls: m.calls })),
      m => eurK(m.wert) + ' · ' + m.calls))}

    ${karte('Letzte Aufrufe', '', (k.letzte || []).length ? `<div class="liste">${
      k.letzte.map(a => `<div class="zeile">
        <div class="zeile-mitte"><div class="zeile-titel">${esc(a.feature || 'unbekannt')}</div>
          <div class="zeile-sub">${esc(String(a.modell || '').replace(/^claude-/, ''))} · ${n0(a.tokens)} Tokens · ${esc(a.user || 'System')}</div></div>
        <div class="zeile-rechts"><div class="row-wert">${eurK(a.eur)}</div><div class="row-sub">${vor(a.am)}</div></div>
      </div>`).join('')}</div>` : leer('Keine Aufrufe', ''), true)}`
}
function verbrauchProTag(anbieter) {
  const k = z.d.kosten
  return anbieter === 'anthropic' ? k.ai_zeitraum / Math.max(z.d.tage, 1) : k.apify_zeitraum / Math.max(z.d.tage, 1)
}
function eingabeGuthaben(anbieter, wert) {
  return `<div class="g-eingabe">
    <input type="number" min="0" step="0.01" inputmode="decimal" id="gh-${anbieter}"
      placeholder="Neues Guthaben in €" value="${wert || ''}" aria-label="Guthaben ${anbieter} in Euro">
    <button data-guthaben="${anbieter}">Eintragen</button></div>`
}

/* ── Menschen → User ───────────────────────────────────────────────── */
function vUser() {
  if (z.akte) return akteHtml()
  const alle = z.d.menschen.users || []
  const q = z.suche.trim().toLowerCase()
  const passt = u => {
    if (q && !((u.name || '') + ' ' + (u.email || '') + ' ' + (u.instagram || '') + ' ' + (u.tiktok || '')).toLowerCase().includes(q)) return false
    if (z.filter === 'zahlend') return u.kaeufe > 0
    if (z.filter === 'live') return u.bio_an || u.mk_an
    if (z.filter === 'still') return !u.bio_an && !u.mk_an && !u.kaeufe
    if (z.filter === 'admin') return u.admin
    return true
  }
  const liste = alle.filter(passt)
  const f = (k, l, n) => `<button class="tag ${z.filter === k ? 'akzent' : ''}" data-filter="${k}" style="cursor:pointer;border:none;font-family:inherit">${l} ${n}</button>`

  return `
    <div class="seiten-titel">Menschen<div class="seiten-sub">${z.d.menschen.gesamt} Konten${z.d.menschen.geloescht ? ', ' + z.d.menschen.geloescht + ' geloescht' : ''} · ${z.d.menschen.neu_woche} neu diese Woche</div></div>

    <div class="suche"><input id="suche" type="search" placeholder="Name, E-Mail oder Handle …" value="${esc(z.suche)}" aria-label="User suchen"></div>
    <div class="filter">
      ${f('alle', 'Alle', alle.length)}
      ${f('zahlend', 'Zahlend', alle.filter(u => u.kaeufe > 0).length)}
      ${f('live', 'Seite live', alle.filter(u => u.bio_an || u.mk_an).length)}
      ${f('still', 'Nichts aktiv', alle.filter(u => !u.bio_an && !u.mk_an && !u.kaeufe).length)}
      ${f('admin', 'Admin', alle.filter(u => u.admin).length)}
    </div>

    ${karte('', '', liste.length ? `<div class="liste">${liste.map(u => `
      <button class="zeile" data-akte="${u.id}">
        <div class="avatar">${initial(u.name || u.email)}</div>
        <div class="zeile-mitte">
          <div class="zeile-titel">${esc(u.name || '—')}
            ${u.admin ? '<span class="tag akzent">Admin</span>' : ''}
            ${u.kaeufe ? '<span class="tag gut">zahlt</span>' : ''}
            ${u.geloescht ? '<span class="tag rot">geloescht</span>' : ''}
            ${u.fehler ? `<span class="tag rot">${u.fehler} Fehler</span>` : ''}</div>
          <div class="zeile-sub">${esc(u.email || '')} · seit ${kurzD(u.seit)} · ${u.zuletzt ? 'aktiv ' + vor(u.zuletzt) : 'nie gesehen'}</div>
        </div>
        <div class="zeile-rechts">
          <div class="row-wert">${n0(u.aufrufe)}</div>
          <div class="row-sub">${u.bio_an ? '<span style="color:var(--green)">●</span>' : '○'} Bio · ${u.mk_an ? '<span style="color:var(--green)">●</span>' : '○'} MK</div>
        </div></button>`).join('')}</div>`
      : leer('Niemand gefunden', 'Andere Suche oder anderer Filter.'), true)}`
}

        <div><div class="kv-label">BioLink-Aufrufe</div><div class="kv-wert">${n0(u.aufrufe)}</div></div>

      </div>

      <div class="abschnitt">Konto</div>
      <div class="kv" style="padding-top:0">
        <div class="breit"><div class="kv-label">E-Mail</div><div class="kv-wert klein">${esc(u.email || '—')}</div></div>
        ${u.kontakt ? `<div class="breit"><div class="kv-label">Kontakt-Adresse</div><div class="kv-wert klein">${esc(u.kontakt)}</div></div>` : ''}
        <div><div class="kv-label">Registriert</div><div class="kv-wert klein">${datum(u.seit)}</div></div>

      </div>
    </section>`
}

/* ── Traffic ───────────────────────────────────────────────────────── */
function vTraffic() {
  const t = z.d.traffic, f = t.funnel
  const stufen = [
    ['Startseite', f.landing, f.landing === 0],
    ['Registriert', f.registriert, false],
    ['Onboarding', f.onboarding, false],
    ['Seite live', f.seite_an, false],
    ['Gekauft', f.gekauft, false],
  ]
  const maxF = Math.max(...stufen.map(s => s[1])) || 1
  const stunden = (t.stunden || []).map(s => ({ name: String(s.stunde).padStart(2, '0') + ' Uhr', anzahl: s.anzahl }))
    .filter(s => s.anzahl > 0)

  return `
    <div class="seiten-titel">Traffic<div class="seiten-sub">Gezaehlt wird ohne Cookie, ohne Speicher im Browser, ohne IP — nur was passiert ist, nie wer.</div></div>

    <div class="kpis">
      ${kpi('BioLink-Aufrufe', n0(t.biolink_gesamt), n0(t.biolink_zeitraum) + ' im Zeitraum', 'verlauf', 'traffic')}
      ${kpi('Klicks', n0(t.klicks_gesamt), 'auf Links der BioLink-Seiten')}
      ${kpi('Media Kit', n0(t.mediakit_gesamt), 'Aufrufe gesamt')}
      ${kpi('Startseite', n0(t.landing_zeitraum), 'viuno.de im Zeitraum', t.landing_zeitraum ? '' : '')}
    </div>

    ${karte('Wie die Leute auf viuno.de kommen', 'die eigenen Seiten stehen einzeln — welcher BioLink, welche geteilte Analyse',
      (t.herkunft_viuno || []).length ? balken(t.herkunft_viuno)
      : leer('Die Startseite zaehlt noch nicht', 'Sobald viuno.de mit dem Zaehler ausgeliefert ist, fuellt sich das hier.'))}

    ${karte('Herkunft der BioLink-Besucher', 'im Zeitraum', balken(t.herkunft_biolink || []))}

    ${karte('Vom Besuch zum Kauf', 'alle Zeit',
      `<div class="trichter">${stufen.map(s => `
        <div class="fs"><div class="fs-name">${s[0]}</div>
          <div class="fs-bar ${s[2] ? 'unbekannt' : ''}" style="width:${s[2] ? 30 : Math.max(14, s[1] / maxF * 100)}%">${s[2] ? 'zaehlt noch nicht' : n0(s[1])}</div>
        </div>`).join('')}</div>`)}

    ${karte('Aufrufe je Monat', 'BioLink-Seiten seit Beginn', balken((t.monate || []).map(m => ({ name: m.monat, anzahl: m.anzahl }))))}

    ${karte('Wann gelesen wird', 'Stunde des Tages, im Zeitraum', balken(stunden))}

    ${karte('Sprache', '', balken(t.sprachen || []))}

    ${karte('Gezaehlte Seiten', 'page_views im Zeitraum', balken(t.seiten || []))}`
}

          <div class="zeile-rechts">
            <button class="akt" data-tu="fehler" data-fn="${esc(f.function)}">Erledigt</button>
          </div></div>`).join('')}</div>`
      : leer('Keine offenen Fehler', 'Sauber.'), true)}

    ${karte('Zeitplaene', (s.cron || []).length + ' Jobs', (s.cron || []).length ? `<div class="liste">${
      s.cron.map(c => {
        const gut = !c.status || c.status === 'succeeded'
        return `<div class="zeile"><div class="zeile-mitte">
          <div class="zeile-titel">${esc(c.name)}
            <span class="tag ${!c.aktiv ? '' : gut ? 'gut' : 'rot'}">${!c.aktiv ? 'aus' : gut ? 'ok' : esc(c.status)}</span></div>
          <div class="zeile-sub">${esc(c.plan)} · ${c.letzter ? 'zuletzt ' + vor(c.letzter) : 'kein Lauf in der Historie'}</div>
        </div></div>`
      }).join('')}</div>` : leer('Keine Jobs', ''), true)}

    ${karte('Analyse-Laeufe', 'die letzten 20', (s.analysen.letzte || []).length ? `<div class="liste">${
      s.analysen.letzte.map(a => `<div class="zeile">
        <div class="zeile-mitte">
          <div class="zeile-titel">${esc(a.user || '?')}
            <span class="tag ${a.status === 'done' ? 'gut' : a.status === 'failed' ? 'rot' : 'orange'}">${esc(a.status)}</span>
            ${a.platform ? `<span class="tag">${esc(a.platform)}</span>` : ''}</div>
          <div class="zeile-sub">${a.fehler ? esc(String(a.fehler).slice(0, 80)) : 'gestartet ' + uhr(a.start)}</div>
        </div>
        <div class="zeile-rechts">${a.apify_eur != null
          ? `<div class="row-wert">${eurK(a.apify_eur)}</div><div class="row-sub">Apify</div>`
          : `<div class="row-sub">${kurzD(a.start)}</div>`}</div>
      </div>`).join('')}</div>` : leer('Keine Laeufe', ''), true)}

    ${karte('Redaktion', 'liegt getrennt', `<div class="liste">
      <a class="zeile" href="/222/test/admin/news/"><div class="zeile-mitte">
        <div class="zeile-titel">Creator News</div><div class="zeile-sub">Meldungen nachtraeglich aendern oder entfernen</div></div>
        <div class="zeile-rechts"><div class="row-sub">&#8599;</div></div></a>
      <a class="zeile" href="/222/test/karussell/" target="_blank" rel="noopener"><div class="zeile-mitte">
        <div class="zeile-titel">Karussell-Ideen</div><div class="zeile-sub">Swipe-File</div></div>
        <div class="zeile-rechts"><div class="row-sub">&#8599;</div></div></a>
    </div>`, true)}

    ${karte('Tagesmail', 'eine Nachricht mit dem Stand von gestern', `
      <div class="karte-sub" style="margin-bottom:var(--s-3)">Geht jeden Morgen um 7 Uhr an ${esc(z.ich?.email || 'dich')}.
        Sie enthaelt Umsatz, neue Konten, neue Newsletter-Anmeldungen, Analysen, Fehler und den Guthabenstand —
        und wird nicht verschickt, wenn nichts davon passiert ist.</div>
      <button class="akt" data-tu="tagesmail">Jetzt einmal schicken</button>`)}`
}

/* ── Zeichnen ──────────────────────────────────────────────────────── */
function zeichneTabs() {
  $('#tabs').innerHTML = ZIELE.map(t => `
    <button class="tab" data-ziel="${t.k}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${t.i}"/></svg>
      <span>${t.l}</span><span class="tab-punkt" data-punkt="${t.k}" hidden></span>
    </button>`).join('')
}

function zeichne() {
  const d = z.d
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('an', b.dataset.ziel === z.bereich))

  // Punkte an den Tabs: nur, wenn wirklich etwas anliegt.
  const punkte = {
    system: d.system.fehler_offen + (d.system.cron || []).filter(c => c.status && c.status !== 'succeeded').length,
    geld: d.geld.kaeufe_offen,
    menschen: d.menschen.neu_woche,
  }
  document.querySelectorAll('[data-punkt]').forEach(el => {
    const n = punkte[el.dataset.punkt] || 0
    el.hidden = n === 0; el.textContent = n > 99 ? '99+' : n
  })

  // Unterpillen zeichnet der Router, nicht die Ansicht.
  const unter = UNTER[z.bereich]
  const nav = $('#subnav')
  nav.classList.toggle('an', !!unter)
  nav.innerHTML = unter ? unter.map(p =>
    `<button class="pille ${unterAktiv[z.bereich] === p.k ? 'an' : ''}" data-unterziel="${p.k}">${p.l}</button>`).join('') : ''

  const titel = { start: 'Start', geld: 'Geld', menschen: 'Menschen', traffic: 'Traffic', system: 'System' }
  $('#kopf-titel').textContent = titel[z.bereich] || 'Admin'

  let html = ''
  if (z.bereich === 'start') html = vStart()
  else if (z.bereich === 'geld') html = unterAktiv.geld === 'kosten' ? vKosten() : vUmsatz()
  else if (z.bereich === 'menschen') html = unterAktiv.menschen === 'newsletter' ? vNewsletter() : vUser()
  else if (z.bereich === 'traffic') html = vTraffic()
  else if (z.bereich === 'system') html = vSystem()
  $('#inhalt').innerHTML = html
  window.scrollTo({ top: 0, behavior: 'instant' })
}

function geh(bereich, unter) {
  z.bereich = bereich
  if (unter && UNTER[bereich]) unterAktiv[bereich] = unter
  z.akte = null
  zeichne()
}

/* ── Ereignisse ────────────────────────────────────────────────────── */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-ziel]'); if (b) geh(b.dataset.ziel)
})
$('#subnav').addEventListener('click', e => {
  const b = e.target.closest('[data-unterziel]'); if (!b) return
  unterAktiv[z.bereich] = b.dataset.unterziel; z.akte = null; zeichne()
})
$('#zeitwahl').addEventListener('click', e => {
  const b = e.target.closest('[data-tage]'); if (!b) return
  z.tage = +b.dataset.tage
  document.querySelectorAll('#zeitwahl button').forEach(x => x.classList.toggle('an', x === b))
  laden()
})

$('#inhalt').addEventListener('click', async e => {
  const nav = e.target.closest('[data-geh]')
  if (nav) return geh(nav.dataset.geh, nav.dataset.unter || null)

  const akte = e.target.closest('[data-akte]')
  if (akte) { z.akte = akte.dataset.akte; zeichne(); return }
  if (e.target.id === 'akte-zu') { z.akte = null; zeichne(); return }

  const filter = e.target.closest('[data-filter]')
  if (filter) { z.filter = filter.dataset.filter; zeichne(); return }

  const gh = e.target.closest('[data-guthaben]')
  if (gh) return guthabenSpeichern(gh.dataset.guthaben)

  const tu = e.target.closest('[data-tu]')
  if (tu) return ausfuehren(tu)
})

$('#inhalt').addEventListener('input', e => {
  if (e.target.id !== 'suche') return
  z.suche = e.target.value
  clearTimeout(window._st)
  window._st = setTimeout(() => {
    const pos = e.target.selectionStart
    zeichne()
    const neu = $('#suche'); if (neu) { neu.focus(); neu.setSelectionRange(pos, pos) }
  }, 220)
})

async function guthabenSpeichern(anbieter) {
  const feld = $('#gh-' + anbieter)
  const eurWert = parseFloat(String(feld?.value || '').replace(',', '.'))
  if (!(eurWert >= 0)) { toast('Bitte einen Betrag in Euro eintragen.'); return }
  // Gespeichert wird in Dollar, weil die Anbieter in Dollar abrechnen;
  // eingegeben und angezeigt wird ueberall Euro.
  const usd = eurWert / (+z.d.kurs_usd_eur || 0.92)
  try {
    const { error } = await sb.from('kosten_guthaben').insert({
      anbieter, betrag_usd: Math.round(usd * 100) / 100, erfasst_von: z.ich?.id || null,
    })
    if (error) throw error
    toast('Guthaben eingetragen.')
    laden()
  } catch (err) { toast('Ging nicht: ' + (err.message || err), 5000) }
}

async function ausfuehren(el) {
  const art = el.dataset.tu, id = el.dataset.id
  try {
    if (art === 'fehler') {
      if (!await frage('Alle erledigt?', 'Alle offenen Fehler von ' + el.dataset.fn + ' werden als erledigt markiert.', 'Ja')) return
      await aktion('fehler_erledigt', { function_name: el.dataset.fn })
      toast('Erledigt.'); return laden()
    }
    if (art === 'seite_neu') {
      const was = el.dataset.art === 'mediakit' ? 'Das Media Kit' : 'Der BioLink'
      if (!await frage('Neu erzeugen?', was + ' wird neu gebaut und sofort veroeffentlicht.', 'Ja, erzeugen')) return
      el.disabled = true
      const r = await aktion('seite_neu', { id, art: el.dataset.art })
      toast(r.ok ? 'Seite neu erzeugt.' : 'Antwort: ' + JSON.stringify(r.antwort).slice(0, 120), 5000)
      el.disabled = false; return laden()
    }
    if (art === 'frei') {
      const p = el.dataset.platform
      if (!await frage('Freischalten?', 'Eine ' + p + '-Analyse wird ohne Zahlung freigeschaltet. Sie zaehlt nicht in den Umsatz.', 'Ja')) return
      await aktion('analyse_freischalten', { id, platform: p })
      toast('Freigeschaltet.'); return laden()
    }
    if (art === 'auskunft') {
      if (!await frage('Datenauskunft senden?', 'Der vollstaendige Export geht per Mail an die Login-Adresse.', 'Ja, senden')) return
      await aktion('datenauskunft', { id }); toast('Auskunft ist raus.'); return
    }
    if (art === 'admin') {
      const an = el.dataset.wert === '1'
      if (!await frage(an ? 'Admin-Recht geben?' : 'Admin-Recht entziehen?',
        an ? 'Dieses Konto kann danach alles sehen und aendern, was du hier siehst.' : 'Das Konto verliert den Zugang zum Admin.',
        'Ja', !an)) return
      await aktion('admin_setzen', { id, wert: an })
      toast('Gesetzt.'); return laden()
    }
    if (art === 'tagesmail') {
      el.disabled = true
      const r = await aktion('tagesmail')
      toast(r.ok ? 'Mail ist unterwegs.' : 'Antwort: ' + JSON.stringify(r.antwort).slice(0, 140), 5000)
      el.disabled = false; return
    }
  } catch (err) {
    el.disabled = false
    toast('Ging nicht: ' + (err.message || err), 6000)
  }
}

/* ── Los ───────────────────────────────────────────────────────────── */
start()
</script>
</body>
</html>
