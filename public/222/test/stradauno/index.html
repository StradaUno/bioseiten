/* Zaehlt einen Klick, ohne das Weiterspringen aufzuhalten — gleiche
   Bauweise wie im generierten Template: sendBeacon gibt die Seite sofort
   frei, der Body geht als text/plain raus und loest keinen Preflight aus.
   Kein Cookie, keine Kennung. */
function klickZaehlen(el,art,label){
  el.addEventListener('click',()=>{
    try{
      const daten=JSON.stringify({user_id:creatorData.user_id,art,label,link_id:null,hour_of_day:new Date().getHours()})
      const ziel=SUPABASE_URL+'/functions/v1/track-biolink-click'
      if(navigator.sendBeacon){navigator.sendBeacon(ziel,new Blob([daten],{type:'text/plain;charset=UTF-8'}))}
      else{fetch(ziel,{method:'POST',headers:{'Content-Type':'text/plain'},body:daten,keepalive:true}).catch(()=>{})}
    }catch(_){}
  })
}
function knopf(href,label,name,art){
  const a=document.createElement('a')
  a.className='btn btn-secondary'; a.href=href; a.target='_blank'; a.rel='noopener'
  a.innerHTML=btnInner(icon(name), label, null)
  klickZaehlen(a, art||'custom', label)
  return a
}
