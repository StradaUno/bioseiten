/* Die Aufgabenkarte: Titel, Begruendung IMMER sichtbar, Beleg als Zahl

/* Aus growth_aufgaben.beleg (jsonb) werden Zahl-mit-Bezug-Chips. Jede
   Regel liefert andere Schluessel; hier steht die Zuordnung an einer Stelle. */
function belegChips(a){
  const b = a.beleg || {};
  const c = [];
  if (b.ppw != null)  c.push(['', fmt(b.ppw,1)+'×', 'pro Woche sonst']);
  if (b.tage != null) c.push([b.tage>=7?'fehlt':'vorsicht', b.tage+' Tage', 'seit dem letzten Beitrag']);
  if (b.prozent != null) c.push(['gut', b.prozent+' %', 'kooperationsbereit']);
  if (b.resonanz != null) c.push(['gut', fmt(b.resonanz,1), 'Reaktionen je 1.000 · '+dTag(b.datum)]);
  if (b.schnitt != null) c.push(['', fmt(b.schnitt,1), 'dein Schnitt']);
  if (b.punkte != null && b.max != null) c.push([b.punkte===0?'fehlt':'vorsicht', b.punkte+' / '+b.max, 'Punkte im Profilcheck']);
  return c.map(([k,w,bz]) => `<div class="beleg ${k}"><span class="beleg-wert">${h(w)}</span><span class="beleg-bezug">${h(bz)}</span></div>`).join('');
}

/* Kurve: Linie mit Signatur, Flaeche, Punkte; Analysepunkte gefuellt. */
function kurve(werte, quellen){
  const W = 600, H = 120, pad = 8;
  const min = Math.min(...werte), max = Math.max(...werte);
  const y = v => max === min ? H/2 : pad + (H - 2*pad) * (1 - (v - min) / (max - min));
  const x = i => werte.length === 1 ? W/2 : i * W / (werte.length - 1);
  const pts = werte.map((v,i) => [x(i), y(v)]);
  const d = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line class="gridline" x1="0" y1="${pad}" x2="${W}" y2="${pad}"/><line class="gridline" x1="0" y1="${H/2}" x2="${W}" y2="${H/2}"/><line class="gridline" x1="0" y1="${H-pad}" x2="${W}" y2="${H-pad}"/>
    <path class="area" d="${d} L${W} ${H} L0 ${H}Z"/><path class="line" d="${d}"/>
    ${pts.map((p,i)=>`<circle class="point ${quellen[i]==='analyse'?'analyse':''}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5"/>`).join('')}
  </svg>`;
}

function kpi(label, wert, [klasse, text]){

}
function delta(n, bezug){ return n >= 0 ? ['up', '↑ '+fmt(n)+' '+bezug] : ['down', '↓ '+fmt(-n)+' '+bezug]; }

/* Beitragskachel. thumb null → Verlauf mit Caption (der Fallback, der
   auch greift, wenn die Instagram-CDN-URL abgelaufen ist). */

  const k = p.resonanz >= BEISPIEL.stats.resonanz_schnitt ? 'gut' : p.resonanz < BEISPIEL.stats.resonanz_flop*2 ? 'fehlt' : '';

        <div class="fallback">${h(p.caption.slice(0,90))}</div>
        <span class="tag">${dTag(p.datum)}</span>
      </div>
      <div class="post-body">
        <div class="post-zahl ${k}">${fmt(p.resonanz,1)}</div>
        <div class="post-meta">${fmt(p.likes)} Likes · ${fmt(p.views)} Aufrufe</div>
      </div>
    </a>`;
}
function postZeile(p){
  return `<a class="post-row" href="${h(p.url)}" target="_blank" rel="noopener">
    <div class="thumb">${p.thumb?`<img src="${h(p.thumb)}" alt="">`:''}</div>
    <div class="grow"><strong>${dVoll(p.datum)}</strong><div class="small muted ellipsis">${h(p.ton)} · ${h(p.caption)}</div></div>

  </a>`;
}
function spanne(flop, schnitt, top){
  const pos = ((schnitt - flop) / (top - flop) * 100).toFixed(1);
  return `<div class="spanne"><div class="marker" style="left:${pos}%"></div></div>
    <div class="spanne-legende"><span><span class="spanne-wert fehlt">${fmt(flop,1)}</span>schwächster</span><span class="mitte"><span class="spanne-wert">${fmt(schnitt,1)}</span>dein Schnitt</span><span class="rechts"><span class="spanne-wert gut">${fmt(top,1)}</span>stärkster</span></div>`;
}
/* Balkenliste mit Fallzahl. Werte unter min bekommen keinen Bestwert. */
function balken(zeilen, min = 3){
  const max = Math.max(...zeilen.map(z => z.wert));
  const bewertbar = zeilen.filter(z => z.n >= min);
  const best = bewertbar.length > 1 ? bewertbar.reduce((a,b) => a.wert > b.wert ? a : b) : null;
  return `<div class="barlist mt3">${zeilen.map(z => `
    <div class="barrow ${z===best?'best':''}">
      <span class="name">${h(z.name)} <span class="fallzahl ${z.n<min?'klein':''}">n=${z.n}</span></span>
      <div class="progress ${z.n<min?'neutral':''}"><i style="width:${Math.round(z.wert/max*100)}%"></i></div>
      <strong>${fmt(z.wert)}</strong>
    </div>`).join('')}</div>`;
}
function verteilungFormat(s){
  const f = s.format_stats;
  const inhalt = f.length < 2
    ? `<div class="empty tight"><div class="empty-icon">▣</div><p>Nur ein Format in ${f[0].n} Beiträgen: <strong>${h(f[0].typ)}</strong>. Es gibt nichts zu vergleichen.</p></div>`
    : balken(f.map(x => ({ name:x.typ, n:x.n, wert:x.avg_likes })));
  return `<div class="card"><div class="row between"><h3>Format</h3><span class="fallzahl">Ø Likes</span></div><p>Welche Art Beitrag bei dir trägt</p>${inhalt}</div>`;
}
function verteilungDauer(s){
  const d = s.duration_stats;
  const klein = d.filter(x => x.n < 3);
  return `<div class="card"><div class="row between"><h3>Länge</h3><span class="fallzahl">Ø Aufrufe</span></div><p>Nach Videolänge</p>
    ${balken(d.map(x => ({ name:x.bucket, n:x.n, wert:x.avg_views })))}
    ${klein.length ? `<p class="small mt3">${klein.map(x=>'„'+h(x.bucket)+'"').join(', ')}: ${klein.map(x=>x.n).join(', ')} Beiträge sind zu wenig für einen Vergleich — der Balken steht da, die Aussage nicht.</p>` : ''}</div>`;
}
function verteilungSound(s){
  const rows = s.sound_stats.slice(0,5);
  return `<div class="card"><div class="row between"><h3>Sounds</h3><span class="fallzahl">Resonanz je Nutzung</span></div><p>Derselbe Ton, verschiedene Ergebnisse</p>
    <div class="stack tight mt3">${rows.map(x => `
      <div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)">
        <div class="grow"><strong class="ellipsis" style="display:block">${h(x.sound)}</strong><span class="small muted zahl">${x.werte.map(w=>fmt(w,1)).join(' · ')}</span></div>
        <div style="text-align:right"><span class="fallzahl ${x.n<3?'klein':''}">n=${x.n}</span><div class="small zahl" style="font-weight:800;color:${x.faktor>=3?'var(--vorsicht)':'var(--ink)'}">Faktor ${fmt(x.faktor,1)}</div></div>
      </div>`).join('')}</div>
    <p class="small mt3">Ein Faktor über 3 heißt: der Ton entscheidet nicht, der Text tut es.</p></div>`;
}
/* Beste Zeit: 36 Beitraege auf 7 × 24 Felder reichen nie fuer eine
   Empfehlung. Also steht hier die Tendenz mit ihrer Stichprobe — und der
   Satz, dass es keine Empfehlung ist. */
function besteZeit(s){
  const genug = s.zeitraum.n > 168;
  return `<div class="card">
    <div class="row between"><h3>Beste Zeit</h3><span class="fallzahl klein">${s.best_time_sample} von ${s.zeitraum.n}</span></div>
    <p>Wochentag und Stunde der stärksten Beiträge</p>
    <div class="row mt3" style="gap:14px">
      <div class="beleg"><span class="beleg-wert">${h(s.best_posting_day)}</span><span class="beleg-bezug">${s.best_posting_hour} Uhr</span></div>
      <p class="small ink">${genug ? 'Auf dieser Basis ist das eine Empfehlung.' : `Eine Tendenz aus ${s.best_time_sample} Beiträgen. Für eine Empfehlung bräuchte es mehr als 168 Beiträge — 7 Tage × 24 Stunden. Lieber schweigen als raten.`}</p>
    </div>
    <div class="stunden mt3">${Array.from({length:24},(_,i)=>{ const v = [2,1,0,0,0,3,9,14,7,4,3,2,2,3,2,1,1,2,3,4,3,2,1,1][i]; return `<i class="${v===0?'leer':''}${i===s.best_posting_hour?' best':''}" style="height:${v?Math.max(8,v/14*100):3}%" title="${i} Uhr"></i>`; }).join('')}</div>
    <div class="stunden-achse"><span>0 Uhr</span><span>6</span><span>12</span><span>18 · 23</span></div>
  </div>`;
}

/* ---------- Ansicht: KOOPERATIONEN ----------------------------------- */
let kv = null;
function renderKoop(area){
  kv = { deals: BEISPIEL.deals.map(d => ({...d})), filter:'alle' };
  area.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Business</div><h1>Kooperationen</h1><p class="mt1" id="koop-sub"></p></div>
      <div class="actions"><button class="btn primary" onclick="App.koopNeu()">+ Neue Kooperation</button></div>
    </div>
    <div class="section" id="koop-oben"></div>
    <div class="section" id="koop-liste"></div>
    <div class="section" id="koop-marken"></div>`;
  koopListe(); koopMarken();
}
function dealWert(d){
  switch (d.art) {
    case 'bezahlt': case 'ugc': return euro(d.deal_value);
    case 'barter': return 'Ware ' + euro(d.warenwert);
    case 'link': case 'affiliate': case 'code': return fmt(d.provision_prozent) + ' % Provision';
    default: return 'ohne Vergütung';
  }
}
function koopListe(){
  const alle = kv.deals;
  const laufend = alle.filter(d => ['confirmed','in_progress','negotiation','inquiry'].includes(d.status));
  const fertig = alle.filter(d => d.status === 'completed');
  const faellig = alle.filter(d => d.deadline && tageBis(d.deadline) <= 3 && tageBis(d.deadline) >= 0 && d.status !== 'completed');
  const imKit = alle.filter(d => d.im_mediakit);
  $('koop-sub').textContent = `${alle.length} Einträge · ${imKit.length} im Media Kit sichtbar`;
  $('koop-oben').innerHTML = `
    <div class="kpis three">
      <div class="card kpi tight"><div class="label">Laufend</div><div class="value">${laufend.length}</div><div class="delta muted">Anfrage bis bestätigt</div></div>
      <div class="card kpi tight"><div class="label">Erledigt</div><div class="value">${fertig.length}</div><div class="delta muted">dieses Jahr</div></div>
      <div class="card kpi tight"><div class="label">Abgabe fällig</div><div class="value ${faellig.length?'vorsicht':''}">${faellig.length}</div><div class="delta muted">in den nächsten 3 Tagen</div></div>
    </div>
    ${faellig.map(d => `<button class="alert mt3" onclick="App.koopOeffnen('${d.id}')"><div class="bubble">!</div><div class="grow"><strong>Abgabe für „${h(d.title)}" in ${tageBis(d.deadline)} Tagen</strong><p>${h(d.brand_name)} · ${dVoll(d.deadline)} — steht am Montag auch als Aufgabe im Bericht.</p></div><span class="chev">›</span></button>`).join('')}
    <div class="seg scroll mt3">
      ${[['alle','Alle'],['laufend','Laufend'],['fertig','Abgeschlossen'],['kit','Im Media Kit']].map(([k,l]) => `<button class="${kv.filter===k?'active':''}" onclick="App.koopFilter('${k}')">${l}</button>`).join('')}
    </div>`;
  const zeilen = { alle, laufend, fertig, kit:imKit }[kv.filter];
  $('koop-liste').innerHTML = zeilen.length ? `<div class="card">${zeilen.map(dealZeile).join('')}</div>` : `
    <div class="card empty"><div class="empty-icon">◌</div><h3>Nichts in dieser Ansicht</h3><p>${kv.filter==='kit' ? 'Kein Eintrag ist als Referenz im Media Kit sichtbar.' : 'Noch keine Kooperation in dieser Gruppe.'}</p><button class="btn primary" onclick="App.koopNeu()">Kooperation eintragen</button></div>`;
}
function dealZeile(d){
  const st = STATUS[d.status];
  const dl = d.deadline && d.status !== 'completed' ? tageBis(d.deadline) : null;
  return `<div class="deal" onclick="App.koopOeffnen('${d.id}')">
    <div class="avatar">${h(d.brand_name.slice(0,1))}</div>
    <div class="deal-main"><strong>${h(d.brand_name)} · ${h(d.title)}</strong>
      <span><span class="badge">${ARTEN[d.art]}</span>${d.im_mediakit?'<span class="badge green">● Media Kit</span>':''}${dl!=null?`<span class="${dl<=3?'vorsicht':'muted'}" style="font-weight:750">Abgabe ${dl===0?'heute':'in '+dl+' Tagen'}</span>`:''}</span>
    </div>
    <div class="deal-right"><span class="deal-wert ${d.art==='gratis'?'muted':''}">${dealWert(d)}</span><span class="badge ${st[1]}">${st[0]}</span></div>
  </div>`;
}
function koopMarken(){
  $('koop-marken').innerHTML = `
    <div class="section-title"><div><h2>Marken, die du ohnehin zeigst</h2><p>@-Erwähnungen in deinen letzten ${BEISPIEL.stats.zeitraum.n} Beiträgen</p></div></div>
    <div class="card">
      ${BEISPIEL.mentions.map(m => `<div class="user"><div class="avatar">${h(m.handle.slice(1,2).toUpperCase())}</div><div class="user-main"><strong>${h(m.handle)}</strong><span>${m.n}× erwähnt</span></div><button class="btn sm" onclick="App.koopNeu('${h(m.handle.slice(1))}')">Als Kooperation anlegen</button></div>`).join('')}
      <p class="small mt3">Die Aufgabe „Schreib zwei Marken an, die du ohnehin zeigst" führt hierher. Eine Marke, die du schon zeigst, ist der leichteste Erstkontakt.</p>
    </div>`;
}
/* Das Blatt: alle Felder der Art, Media-Kit-Schalter, Bearbeiten/Loeschen. */
function koopBlatt(d){
  const st = STATUS[d.status];
  const zeilen = FELDER[d.art].map(f => `<dt>${FELD_LABEL[f]}</dt><dd>${feldWert(d,f)}</dd>`).join('');
  App.modal(`
    <div class="modal-head"><div><div class="eyebrow">${ARTEN[d.art]}</div><h2>${h(d.brand_name)}</h2></div><button class="btn icon" onclick="App.modalClose()">×</button></div>
    <div class="row wrap"><span class="badge ${st[1]}">${st[0]}</span><strong class="deal-wert">${dealWert(d)}</strong></div>
    <p class="ink mt2"><strong>${h(d.title)}</strong></p>
    <div class="hr"></div>
    <dl class="dl">${zeilen}${d.veroeffentlicht_am?`<dt>Veröffentlicht</dt><dd>${dVoll(d.veroeffentlicht_am)}</dd>`:''}</dl>
    ${d.internal_notes?`<div class="notice mt3">${h(d.internal_notes)}</div>`:''}
    <div class="hr"></div>
    <div class="switch-row"><div><strong>Im Media Kit als Referenz zeigen</strong><span>Name und Logo werden öffentlich. Der vereinbarte Wert nie.</span></div><button class="toggle ${d.im_mediakit?'on':''}" onclick="App.koopMediakit('${d.id}',this)"><i></i></button></div>
    <div class="modal-foot"><button class="btn danger left" onclick="App.koopLoeschen('${d.id}')">Löschen</button><button class="btn" onclick="App.koopBearbeiten('${d.id}')">Bearbeiten</button><button class="btn dark" onclick="App.modalClose()">Schließen</button></div>`);
}
function feldWert(d, f){
  const v = d[f];
  if (v == null || v === '') return '<span class="muted">—</span>';
  switch (f) {
    case 'deal_value': case 'warenwert': return euro(v);
    case 'provision_prozent': return fmt(v) + ' %';
    case 'deadline': case 'laufzeit_bis': return dVoll(v) + (f==='deadline' && d.status!=='completed' ? ` <span class="badge ${tageBis(v)<=3?'amber':''}">${tageBis(v)===0?'heute':'in '+tageBis(v)+' Tagen'}</span>` : '');
    case 'content_type': return FORMATE[v] || h(v);
    case 'platform': return PLATTFORMEN[v] || h(v);
    case 'link': return `<a href="${h(v)}" target="_blank" rel="noopener" style="color:var(--purple)">${h(v.replace(/^https?:\/\//,''))} ↗</a>`;
    case 'code': return `<code>${h(v)}</code>`;
    default: return h(v);
  }
}
/* Das Formular. Die Art schaltet die Felder — dieselbe Zuordnung wie im
   Blatt, damit Eingabe und Anzeige nie auseinanderlaufen. */
function koopFormular(d){
  const neu = !d.id;
  App.modal(`
    <form onsubmit="App.koopSpeichern(event)" id="koop-form">
      <input type="hidden" name="id" value="${h(d.id||'')}">
      <div class="modal-head"><h2>${neu?'Neue Kooperation':'Kooperation bearbeiten'}</h2><button type="button" class="btn icon" onclick="App.modalClose()">×</button></div>
      <div class="form-grid">
        <div class="field"><label>Marke</label><input name="brand_name" list="marken" required placeholder="z. B. Oysho" value="${h(d.brand_name||'')}"><datalist id="marken">${[...new Set(kv.deals.map(x=>x.brand_name))].map(m=>`<option value="${h(m)}">`).join('')}</datalist></div>
        <div class="field"><label>Art</label><select name="art" onchange="App.koopArt(this.value)">${Object.entries(ARTEN).map(([k,l])=>`<option value="${k}" ${d.art===k?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="field span"><label>Titel</label><input name="title" required placeholder="Was genau ist vereinbart?" value="${h(d.title||'')}"></div>
        <div class="span" id="koop-artfelder"></div>
        <div class="field"><label>Status</label><select name="status">${Object.entries(STATUS).map(([k,[l]])=>`<option value="${k}" ${(d.status||'inquiry')===k?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="field"><label>Veröffentlicht am</label><input type="date" name="veroeffentlicht_am" value="${h(d.veroeffentlicht_am||'')}"></div>
        <div class="field span"><label>Notiz <span class="muted" style="font-weight:600">(nur für dich)</span></label><textarea name="internal_notes" placeholder="Briefing, Ansprechpartner, Absprachen">${h(d.internal_notes||'')}</textarea></div>
      </div>
      <div class="hr"></div>
      <div class="switch-row"><div><strong>Im Media Kit als Referenz zeigen</strong><span>Name und Logo werden öffentlich. Der vereinbarte Wert nie.</span></div><button type="button" class="toggle ${d.im_mediakit?'on':''}" data-name="im_mediakit" onclick="this.classList.toggle('on')"><i></i></button></div>
      <div class="modal-foot"><button type="button" class="btn ghost" onclick="App.modalClose()">Abbrechen</button><button type="submit" class="btn primary">${neu?'Anlegen':'Speichern'}</button></div>
    </form>`);
  App.koopArt(d.art || 'bezahlt', d);
}
function artFelder(art, d = {}){
  const feld = (f) => {
    const v = d[f] ?? '';
    switch (f) {
      case 'deal_value': case 'warenwert': return `<div class="field"><label>${FELD_LABEL[f]}</label><div class="input-wrap"><input name="${f}" type="number" inputmode="decimal" min="0" step="1" placeholder="0" value="${h(v)}"><span class="unit">€</span></div></div>`;
      case 'provision_prozent': return `<div class="field"><label>${FELD_LABEL[f]}</label><div class="input-wrap"><input name="${f}" type="number" inputmode="decimal" min="0" max="100" step="0.5" placeholder="0" value="${h(v)}"><span class="unit">%</span></div></div>`;
      case 'anzahl_assets': return `<div class="field"><label>${FELD_LABEL[f]}</label><input name="${f}" type="number" inputmode="numeric" min="1" step="1" placeholder="3" value="${h(v)}"></div>`;
      case 'content_type': return `<div class="field"><label>${FELD_LABEL[f]}</label><select name="${f}">${Object.entries(FORMATE).map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}</select></div>`;
      case 'platform': return `<div class="field"><label>${FELD_LABEL[f]}</label><select name="${f}">${Object.entries(PLATTFORMEN).map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}</select></div>`;
      case 'deadline': case 'laufzeit_bis': return `<div class="field"><label>${FELD_LABEL[f]}</label><input name="${f}" type="date" value="${h(v)}">${f==='deadline'?'<span class="hint">Drei Tage vorher wird daraus eine Aufgabe im Montagsbericht.</span>':''}</div>`;
      case 'link': return `<div class="field span"><label>${FELD_LABEL[f]}</label><input name="${f}" type="url" inputmode="url" placeholder="https://…" value="${h(v)}"></div>`;
      case 'nutzungsrechte': return `<div class="field span"><label>${FELD_LABEL[f]}</label><input name="${f}" placeholder="z. B. 6 Monate auf den Kanälen der Marke" value="${h(v)}"></div>`;
      default: return `<div class="field"><label>${FELD_LABEL[f]}</label><input name="${f}" value="${h(v)}"></div>`;
    }
  };
  return `<div class="form-grid">${FELDER[art].map(feld).join('')}</div>${art==='ugc'?'<div class="notice mt2 small">UGC läuft nicht auf deinem Kanal — es erscheint nicht in deiner Auswertung, nur hier.</div>':''}`;
}

/* ---------- Platzhalter fuer Stufe 4 --------------------------------- */
function renderSpaeter(area, route){
  area.innerHTML = `
    <div class="page-head"><div><div class="eyebrow">Stufe 4</div><h1>${h(ROUTEN_LABEL[route]||route)}</h1></div></div>
    <div class="card empty"><div class="empty-icon">◌</div><h3>Diese Ansicht kommt nach der Abnahme</h3><p>Erst werden Heute, Analyse und Kooperationen abgenommen. Dann entsteht der Rest aus denselben Bausteinen.</p><a class="btn primary" href="#/heute">Zurück zu Heute</a></div>`;
}

/* ---------- Der App-Namensraum: alle Klick-Handler ------------------- */
const App = {
  route(hash){ if (location.hash === hash) router(); else location.hash = hash; },
  toast(msg, fehler){ const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (fehler?' error':''); clearTimeout(App._tt); App._tt = setTimeout(() => t.className = 'toast', 2400); },
  modal(html){ $('modal-inner').innerHTML = html; $('modal').classList.add('open'); document.body.style.overflow = 'hidden'; },
  modalClose(){ $('modal').classList.remove('open'); document.body.style.overflow = ''; },
  teilen(was){ App.toast('Teilen-Karte („' + was + '") kommt in Stufe 4 — Canvas 1080 × 1350, JPEG'); },

  /* Heute */
  belegeUmschalten(){ hv.belege = !hv.belege; heuteBericht(); },
  modellUmschalten(){ hv.modellAusgefallen = !hv.modellAusgefallen; heuteBericht(); },
  aufgabe(id, status){
    /* Stufe 3: aufgabe_setzen(id, status) — hier nur der Zustand */
    const a = hv.aufgaben.find(x => x.id === id); if (!a) return;
    a.status = status; if (status === 'erledigt') a.erledigt_am = HEUTE.toISOString();
    heuteAufgaben();
    App.toast(status === 'erledigt' ? 'Abgehakt' : status === 'verworfen' ? 'Verworfen — kommt drei Wochen nicht wieder' : 'Wieder offen');
  },

  /* Analyse */
  plattform(btn, p){
    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active')); btn.classList.add('active');
    anv.plattform = p;
    if (p === 'tiktok') App.toast('TikTok: für dieses Konto noch keine Analyse — Beispiel zeigt Instagram');
  },
  allePosts(){ const el = $('an-alle'); el.hidden = !el.hidden; anv.allePosts = !el.hidden; },

  /* Kooperationen */
  koopFilter(f){ kv.filter = f; koopListe(); },
  koopOeffnen(id){ const d = kv.deals.find(x => x.id === id); if (d) koopBlatt(d); },
  koopNeu(marke){ koopFormular({ art:'bezahlt', status:'inquiry', brand_name: marke || '' }); },
  koopBearbeiten(id){ const d = kv.deals.find(x => x.id === id); if (d) koopFormular(d); },
  koopArt(art, d){ const el = $('koop-artfelder'); if (el) el.innerHTML = artFelder(art, d || {}); },
  koopSpeichern(ev){
    ev.preventDefault();
    const f = new FormData(ev.target); const d = {};
    for (const [k,v] of f.entries()) d[k] = v === '' ? null : v;
    for (const k of ['deal_value','warenwert','provision_prozent','anzahl_assets']) if (d[k] != null) d[k] = Number(d[k]);
    d.im_mediakit = ev.target.querySelector('[data-name=im_mediakit]').classList.contains('on');
    /* nur die Felder der gewaehlten Art bleiben — die anderen werden geleert */
    for (const k of Object.keys(FELD_LABEL)) if (!FELDER[d.art].includes(k)) d[k] = null;
    if (d.id) { const i = kv.deals.findIndex(x => x.id === d.id); kv.deals[i] = { ...kv.deals[i], ...d }; }
    else { d.id = 'd' + Date.now(); kv.deals.unshift(d); }
    App.modalClose(); koopListe();
    App.toast(d.im_mediakit ? 'Gespeichert · Referenz erscheint im Media Kit' : 'Gespeichert');
  },
  koopMediakit(id, btn){
    const d = kv.deals.find(x => x.id === id); if (!d) return;
    d.im_mediakit = !d.im_mediakit; btn.classList.toggle('on', d.im_mediakit); koopListe();
    App.toast(d.im_mediakit ? h(d.brand_name) + ' steht jetzt im Media Kit' : h(d.brand_name) + ' aus dem Media Kit genommen');
  },
  koopLoeschen(id){
    const d = kv.deals.find(x => x.id === id); if (!d) return;
    App.modal(`<div class="modal-head"><h2>„${h(d.title)}" löschen?</h2></div><p>Der Eintrag verschwindet aus der Liste${d.im_mediakit?' und aus dem Media Kit':''}. Das lässt sich nicht rückgängig machen.</p>
      <div class="modal-foot"><button class="btn" onclick="App.koopOeffnen('${d.id}')">Abbrechen</button><button class="btn danger" onclick="App.koopLoeschenJetzt('${d.id}')">Löschen</button></div>`);
  },
  koopLoeschenJetzt(id){ kv.deals = kv.deals.filter(x => x.id !== id); App.modalClose(); koopListe(); App.toast('Gelöscht'); }
};
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') App.modalClose(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') App.modalClose(); });
router();
</script>
