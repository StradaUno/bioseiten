<html lang="de">

<style>
/* Tokens und Grundgeruest identisch zur Startseite */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f4f2;
  --surface:#fff;
  --surface2:#f0efed;
  --border:rgba(0,0,0,.08);
  --border-strong:rgba(0,0,0,.13);
  --text:#111110;
  --muted:#7a7975;
  --subtle:#b0afa9;
}
html,body{background:var(--bg);font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text);font-size:16px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.container{max-width:1000px;margin:0 auto;padding:0 24px}

/* NAV — wie auf der Startseite */
nav.top{position:sticky;top:0;z-index:50;background:rgba(245,244,242,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1000px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.04em}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--text);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.nav-cta{padding:8px 18px;background:var(--text);color:#fff;border-radius:99px;font-size:14px;font-weight:500;transition:transform .15s,opacity .15s}
.nav-cta:hover{opacity:.85;transform:translateY(-1px)}

/* HERO */
.hero{padding:64px 0 8px;text-align:center}
.hero h1{font-size:clamp(32px,5.5vw,52px);font-weight:700;letter-spacing:-.04em;line-height:1.1;margin-bottom:16px}
.hero-sub{font-size:clamp(15px,2vw,17px);color:var(--muted);max-width:520px;margin:0 auto;line-height:1.6}

/* Abschnitte */
.section{padding:34px 0 0}
.section-head{display:flex;align-items:baseline;gap:12px;max-width:760px;margin:0 auto 16px;flex-wrap:wrap}
.section-title{font-size:15px;font-weight:600;letter-spacing:-.02em}
.section-date{font-size:13px;color:var(--muted)}

/* Karten. Kein Bild: die Stockfotos in der Datenbank waren rund 1 MB gross
   und sagten nichts ueber die Meldung. */
.cards{display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--border-strong);box-shadow:0 12px 28px rgba(17,17,16,.08);transform:translateY(-2px)}
/* Die Dringlichkeit traegt allein die farbige Zeile ueber der Schlagzeile.
   Ein Streifen an der linken Kante stand hier mal - er hat die Karte
   zerschnitten, ohne mehr zu sagen. Die Farbe kommt aus relevance_score. */
.card.st-jetzt{--stufe:#b03a22}
.card.st-bald{--stufe:#8a6114}
.card.st-info{--stufe:#3c5fa8}
.card-bild{width:100%;height:190px;object-fit:cover;display:block;background:var(--surface2)}
.card.gross .card-bild{height:260px}
.card-inner{padding:18px 20px 20px}
.card-stufe{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--stufe);margin-bottom:9px}
.card-stufe::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
/* Aufmacher: die staerkste Meldung fuehrt und sieht auch so aus. */
.card.gross .card-inner{padding:24px}
.card.gross .card-headline{font-size:24px;line-height:1.2}
.card.gross .card-summary{font-size:15px}
.card-headline{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin-bottom:6px}
.card-summary{font-size:13.5px;color:var(--muted);line-height:1.55}
.card-body-full{display:none;margin-top:14px}
.card.open .card-body-full{display:block}
.card-impact{background:var(--surface2);border-radius:12px;padding:12px 14px}
.card-impact-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
.card-impact-text{font-size:13.5px;line-height:1.55}
.card-full-text{font-size:13.5px;line-height:1.7;color:var(--muted);white-space:pre-line;margin-top:14px}
.card-full-text strong{color:var(--text);font-weight:600}
.card-disclaimer{font-size:12px;color:var(--subtle);line-height:1.5;margin-top:12px;font-style:italic}
.card-actions{margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;padding:8px 16px;border-radius:99px;background:var(--surface);font-family:inherit;cursor:pointer}
.card-btn{border:1px solid var(--border);color:var(--muted);transition:color .15s,border-color .15s}
.card-btn:hover{color:var(--text);border-color:var(--border-strong)}
/* Fusszeile: Plattform, Quelle und Datum in einer Zeile, unter dem Text. */
.card-foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.card-quelle{flex:1;min-width:0;font-size:12px;color:var(--subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.card-quelle{transition:color .15s}
a.card-quelle:hover{color:var(--text)}
.card-quelle[hidden]{display:none}
.card-chevron{flex-shrink:0;color:var(--subtle);transition:transform .2s}
.card.open .card-chevron{transform:rotate(180deg)}

/* Werbeplaetze. Variante A: gleiche Breite und Rundung wie eine Meldung,
   aber gestrichelt und beschriftet - erkennbar, ohne den Lesefluss zu
   brechen. Nach der ersten Meldung einer, danach nach jeder zweiten. */
.promo{background:var(--surface);border:1px dashed var(--border-strong);border-radius:20px;padding:18px 20px}
.promo-label{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--subtle);margin-bottom:8px}
.promo-t{font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin:0 0 5px}
.promo-u{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0}
.promo-knopf{display:inline-block;margin-top:13px;padding:9px 20px;border-radius:99px;background:var(--text);color:#fff;
  font-family:inherit;font-size:13.5px;font-weight:600;border:0;cursor:pointer;text-decoration:none}
.promo-knopf:hover{opacity:.87}

/* Anmeldung: erst der Knopf, dann das Feld. Ohne Konto haben wir die
   Adresse sonst nicht - und ein leeres Eingabefeld im Lesefluss fragt
   etwas, wonach noch niemand gefragt hat. */
.nl-form{display:none;gap:8px;margin-top:13px;flex-wrap:wrap}
.promo.offen .nl-form{display:flex}
.promo.offen .nl-start,.promo.offen .promo-u{display:none}
.nl-form input{flex:1;min-width:170px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:10px;
  font-family:inherit;font-size:14px;background:var(--surface);color:var(--text)}
.nl-form input:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.nl-form .los{padding:10px 18px;border-radius:10px;background:var(--text);color:#fff;border:0;
  font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.nl-form .los:disabled{opacity:.55;cursor:default}
.nl-hinweis{flex-basis:100%;font-size:11.5px;color:var(--subtle);line-height:1.5;margin:0}
.nl-meldung{display:none;font-size:13.5px;line-height:1.55;margin:9px 0 0}
.promo.fertig .nl-meldung{display:block}
.promo.fertig .nl-form,.promo.fertig .nl-start,.promo.fertig .promo-u{display:none}

/* Archiv */
.more-wrap{max-width:760px;margin:20px auto 0;text-align:center}
.more-btn{padding:11px 26px;background:var(--surface);border:1px solid var(--border-strong);border-radius:99px;font-family:inherit;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:background .15s}
.more-btn:hover{background:var(--surface2)}
.more-btn:disabled{opacity:.5;cursor:default}

/* Hinweis auf die Wochenmail */
.mailbox{max-width:760px;margin:44px auto 0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.mailbox-text{flex:1;min-width:220px}
.mailbox-title{font-size:16px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.mailbox-sub{font-size:13.5px;color:var(--muted);line-height:1.5}
.mailbox-cta{padding:10px 22px;background:var(--text);color:#fff;border-radius:99px;font-size:14px;font-weight:500;transition:opacity .15s}
.mailbox-cta:hover{opacity:.85}

.status{max-width:760px;margin:0 auto;text-align:center;color:var(--muted);font-size:14px;padding:28px 0}
.zurueck{max-width:760px;margin:0 auto 14px;font-size:13.5px;color:var(--muted)}
.zurueck:hover{color:var(--text)}

/* FUSS — wie auf der Startseite */
footer{margin-top:64px;border-top:1px solid var(--border);padding:28px 0 40px}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.footer-brand{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.footer-links{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.footer-links a:hover{color:var(--text)}

@media(max-width:600px){
  .hero{padding:44px 0 4px}
  .card-inner{padding:16px 16px 18px}
  .card.gross .card-inner{padding:20px 18px}
  .card-bild{height:150px}
  .card.gross .card-bild{height:190px}
  .mailbox{padding:18px}
}
</style>
</head>
<body>

<nav class="top">
  <div class="nav-inner">
    <a href="/" class="logo">
      <span class="logo-mark">v</span>

    </a>

</nav>

<div class="container">
  <section class="hero">
    <h1 id="titel">Creator News</h1>
    <p class="hero-sub" id="untertitel">Was sich bei Instagram, TikTok und Meta wirklich ändert — zusammengefasst, mit einer Einordnung, was es für dich heißt. Ohne Anmeldung.</p>
  </section>

  <!-- Einzelne Meldung, wenn die Seite unter /news/<slug> aufgerufen wurde -->
  <section class="section" id="einzel-section" hidden>

  </section>

  <section class="section" id="aktuell-section">

      <span class="section-date" id="aktuell-datum"></span>
    </div>
    <div class="cards" id="aktuell-karten"></div>

  <section class="section" id="archiv-section" hidden>
    <div class="section-head"><span class="section-title">Frühere Ausgaben</span></div>

    <div class="more-wrap"><button class="more-btn" id="mehr">Mehr laden</button></div>

  <div class="status" id="status">Lädt …</div>

</div>

<footer>
  <div class="container">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="logo-mark">v</span>
        <span>viuno · gemacht in Deutschland</span>
      </div>
      <div class="footer-links">
        <a href="/legal#impressum">Impressum</a>
        <a href="/legal#datenschutz">Datenschutz</a>
        <a href="/legal#agb">AGB</a>
        <a href="/app/">Login</a>
      </div>
    </div>
  </div>
</footer>

<script>
/* Die Karten kommen aus zwei Views, die oeffentlich lesbar sind — kein Login,
   kein supabase-js, nur REST-Abfragen mit dem publishable Key.
   Die Views liefern bereits nach relevance_score sortiert und enthalten den
   slug, der auch in den Maillinks und im Teilen-Text steht. */
const REST = 'https://bzejndghppuipnedasuv.supabase.co/rest/v1'
const KEY  = 'sb_publishable_vVbpikuwqnh5jBTdvxcm7g_R4pZsMXI'
const PRO_SEITE = 18
let offset = 0
let promoVersatz = 1

/* /news/<slug> wird von der Pages Function functions/news/[slug].js auf diese
   Seite geleitet, die den Slug aus dem Pfad liest. Dieselbe Mechanik wie bei
   den geteilten Analysen unter /analyse/<token>. */
const SLUG = (location.pathname.match(/^\/news\/([^/]+)\/?$/) || [])[1] || null
const HERKUNFT = new URLSearchParams(location.search).get('s') || 'public'

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
/* Der Volltext aus der Datenbank enthaelt **Fettungen** in Markdown.
   Erst escapen, dann die Sternchen aufloesen — in der Reihenfolge kann
   aus dem Text kein Markup mehr entstehen. */
const escMitFett = s => esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')

const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember']
const datum = d => {
  const t = new Date(d + 'T12:00:00')
  return isNaN(t) ? d : `${t.getDate()}. ${MONATE[t.getMonth()]} ${t.getFullYear()}`
}
const alter = d => {
  const t = new Date(d + 'T12:00:00')
  if (isNaN(t)) return d || ''
  const heute = new Date(); heute.setHours(12,0,0,0)
  const tage = Math.round((heute - t) / 86400000)
  if (tage <= 0) return 'heute'
  if (tage === 1) return 'gestern'
  if (tage < 28) return `vor ${tage} Tagen`
  return datum(d)
}
/* Montags-Ausgaben decken eine Woche ab. Die Altbestaende aus dem frueheren
   Tagesrhythmus liegen auf beliebigen Wochentagen und bekommen ihr Datum. */
const ausgabeTitel = d => {
  const a = new Date(d + 'T12:00:00')
  if (isNaN(a)) return d || ''
  if (a.getDay() !== 1) return `Ausgabe vom ${datum(d)}`
  const b = new Date(a); b.setDate(b.getDate() + 6)
  const links = a.getMonth() === b.getMonth() ? `${a.getDate()}.` : `${a.getDate()}. ${MONATE[a.getMonth()]}`
  return `Woche ${links}–${b.getDate()}. ${MONATE[b.getMonth()]}`
}

/* Rechtsthemen sind das wichtigste und zugleich heikelste Material hier. */
const RECHT = /recht|gesetz|kennzeichn|dsgvo|\bdsa\b|ai act|urteil|gericht|bußgeld|bussgeld|abmahn|regulier|richtlinie|verordnung/i
const hinweis = c => RECHT.test(`${c.headline || ''} ${c.summary || ''}`)
  ? `<p class="card-disclaimer">Zusammenfassung, keine Rechtsberatung. Im Zweifel anwaltlich prüfen lassen.</p>`
  : ''

const CHEVRON = `<svg class="card-chevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`

async function hole(view, params) {
  const res = await fetch(`${REST}/${view}?${params}`, { headers: { apikey: KEY } })
  if (!res.ok) throw new Error('HTTP ' + res.status)
  return res.json()
}

/* Reichweitenmessung, absichtlich fire-and-forget und ohne IP oder Cookie. */
function zaehlen(page, slug) {
  try {
    fetch(`${REST}/page_views`, {
      method: 'POST',
      headers: { apikey: KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ page, source: HERKUNFT, card_slug: slug || null }),
      keepalive: true,
    }).catch(() => {})
  } catch (_) {}
}

/* Dringlichkeit aus relevance_score. Das Feld `level` des Modells ist
   unzuverlaessig: es stand schon auf "hoch" bei einer Shop-Meldung mit
   Score 7 und auf "info" bei Score 5. */
function stufe(c) {
  const s = c.relevance_score || 0
  if (s >= 8) return { klasse: 'st-jetzt', text: 'Diese Woche erledigen' }
  if (s >= 6) return { klasse: 'st-bald',  text: 'Bald ansehen' }
  return        { klasse: 'st-info',  text: 'Zur Kenntnis' }
}

/* ohneKopf: in der Einzelansicht traegt schon die Seitenueberschrift die
   Schlagzeile und die Zusammenfassung — die Karte wuerde sie sonst direkt
   darunter ein zweites Mal wiederholen. */
function karte(c, { gross = false, offen = false, mitDatum = false, ohneKopf = false } = {}) {
  const voll = (c.full_content || '').trim()
  const aufklappbar = voll || c.impact
  const st = stufe(c)
  const bild = (c.image_url || '').trim()
  const quelle = [c.platform_label, c.source, mitDatum ? datum(c.date) : alter(c.published_date || c.date)]
    .filter(Boolean).join(' · ')

  return `<article class="card ${st.klasse}${gross ? ' gross' : ''}${offen ? ' open' : ''}${aufklappbar && !ohneKopf ? '' : ' fix'}" data-slug="${esc(c.slug || '')}">
    ${bild ? `<img class="card-bild" src="${esc(bild)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
    <div class="card-inner">
      <span class="card-stufe">${esc(st.text)}</span>
      ${ohneKopf ? '' : `<div class="card-headline">${esc(c.headline || '')}</div>
      <div class="card-summary">${esc(c.summary || '')}</div>`}
      ${aufklappbar ? `<div class="card-body-full">
        ${c.impact ? `<div class="card-impact">
          <div class="card-impact-label">Was du tun kannst</div>
          <div class="card-impact-text">${esc(c.impact)}</div></div>` : ''}
        ${voll ? `<div class="card-full-text">${escMitFett(voll)}</div>` : ''}
        ${hinweis(c)}
        <div class="card-actions">
          <button class="card-btn card-share" type="button">Teilen</button>
        </div>
      </div>` : ''}
      <div class="card-foot">
        <span class="card-quelle card-quelle-zu"${offen ? ' hidden' : ''}>${esc(quelle)}</span>
        ${c.source_url ? `<a class="card-quelle card-quelle-auf" href="${esc(c.source_url)}" target="_blank" rel="noopener"${offen ? '' : ' hidden'}>${esc(quelle)} ↗</a>` : ''}
        ${aufklappbar && !ohneKopf ? CHEVRON : ''}
      </div>
    </div>
  </article>`
}

/* Die Werbeplaetze in fester Reihenfolge. Nach der ersten Meldung steht
   der BioLink - das inklusive Angebot mit der niedrigsten Huerde. Danach
   wechseln sich Mail, Konto und Analyse ab: erst inklusive, dann bezahlt. */
const PROMOS = [
  { art:'biolink', label:'viuno · inklusive', t:'Eine Seite für alle deine Links',
    u:'Kanäle, Zahlen und ein Kontakt-Knopf für Marken — in fünf Minuten fertig, ohne Aufpreis.',
    knopf:'BioLink ansehen', ziel:'/biolink' },
  { art:'mail' },
  { art:'konto', label:'viuno', t:'Alles an einem Ort',
    u:'BioLink, Media Kit und diese News — ein Konto, kein Abo.',
    knopf:'Konto anlegen', ziel:'/app/' },
  { art:'analyse', label:'viuno · 9,99 €', t:'Wie performen deine Posts wirklich?',
    u:'Die Analyse zeigt, was deine besten Beiträge verbindet — einmalig 9,99 € je Kanal.',
    knopf:'Analyse ansehen', ziel:'/analytics' },
  { art:'mediakit', label:'viuno · inklusive', t:'Ein Media Kit, das Marken überzeugt',
    u:'Reichweite, Zielgruppe und Formate auf einer Seite — teilbar per Link.',
    knopf:'Media Kit ansehen', ziel:'/mediakit' },
]

function promoHtml(p) {
  if (p.art === 'mail') {
    return `<div class="promo" data-nl>
      <div class="promo-label">viuno · jede Woche</div>
      <p class="promo-t">Die Meldungen montags ins Postfach</p>
      <p class="promo-u">Kein Konto nötig. Eine Mail pro Woche, sonst nichts.</p>
      <button class="promo-knopf nl-start" type="button">Per Mail bekommen</button>
      <form class="nl-form" novalidate>
        <input type="email" placeholder="deine@mail.de" aria-label="E-Mail-Adresse" required>
        <button class="los" type="submit">Eintragen</button>
        <p class="nl-hinweis">Du bekommst eine Bestätigungsmail — ohne den Klick darin wird nichts versendet. Abmelden geht in jeder Mail.</p>
      </form>
      <p class="nl-meldung"></p>
    </div>`
  }
  return `<div class="promo">
    <div class="promo-label">${esc(p.label)}</div>
    <p class="promo-t">${esc(p.t)}</p>
    <p class="promo-u">${esc(p.u)}</p>
    <a class="promo-knopf" href="${esc(p.ziel)}">${esc(p.knopf)}</a>
  </div>`
}

/* Rhythmus: nach der ersten Meldung, danach nach jeder zweiten. */
function mitPromos(karten, ab = 0) {
  const stuecke = []
  karten.forEach((html, i) => {
    stuecke.push(html)
    const nummer = i + 1
    if (nummer === 1 || (nummer > 1 && (nummer - 1) % 2 === 0)) {
      const wievielter = nummer === 1 ? 0 : (nummer - 1) / 2
      stuecke.push(promoHtml(PROMOS[(ab + wievielter) % PROMOS.length]))
    }
  })
  return stuecke.join('')
}

/* Aufklappen: Klick auf die Karte, ausser auf Quelle-Link und Knoepfe. */
document.addEventListener('click', e => {
  if (e.target.closest('.card-quelle-auf')) return
  if (e.target.closest('.card-share')) {
    e.preventDefault()
    const k = e.target.closest('.card')
    if (k) teilen(k.dataset.slug)
    return
  }
  const k = e.target.closest('.card')
  if (k && !k.classList.contains('fix')) {
    const offen = k.classList.toggle('open')
    /* Die Quelle wird erst beim Aufklappen zum Link. Zugeklappt ist sie
       reine Angabe — ein Weg nach draussen gehoert ans Ende des Textes. */
    const zu  = k.querySelector('.card-quelle-zu')
    const auf = k.querySelector('.card-quelle-auf')
    if (auf) { auf.hidden = !offen; if (zu) zu.hidden = offen }
    if (offen) zaehlen('news_card', k.dataset.slug)
  }
})

/* Teilen als Textnachricht: Schlagzeile, ein Satz, Link auf genau diese
   Meldung. Der Empfaenger landet damit auf dem Text und nicht auf der
   Startseite. */
const alleKarten = new Map()
async function teilen(slug) {
  const c = alleKarten.get(slug)
  if (!c) return
  const url = `https://viuno.de/news/${encodeURIComponent(slug)}?s=share`
  const text = `${c.headline || ''}\n\n${(c.summary || '').trim()}`
  if (navigator.share) {
    try { await navigator.share({ title: c.headline || 'Creator News', text, url }); return } catch (_) {}
  }
  try { await navigator.clipboard.writeText(`${text}\n\n${url}`) } catch (_) {}
}

function merken(liste) { for (const c of liste) if (c.slug) alleKarten.set(c.slug, c) }

/* Anmeldung. Der Knopf blendet das Feld ein, das Absenden geht an die
   Edge Function - die legt die Zeile auf "pending" und schickt die
   Bestaetigungsmail. Erst deren Link schaltet auf aktiv. */
const MELDUNGEN = {
  bestaetigung_unterwegs: 'Fast geschafft — schau in dein Postfach und bestätige den Link.',
  schon_aktiv: 'Diese Adresse ist schon angemeldet. Du musst nichts weiter tun.',
  aktiv: 'Angemeldet ✓ Ab Montag kommt die Mail.',
}

document.addEventListener('click', e => {
  const start = e.target.closest('.nl-start')
  if (!start) return
  const box = start.closest('[data-nl]')
  box.classList.add('offen')
  box.querySelector('input')?.focus()
})

document.addEventListener('submit', async e => {
  const form = e.target.closest('.nl-form')
  if (!form) return
  e.preventDefault()

  const box = form.closest('[data-nl]')
  const feld = form.querySelector('input')
  const knopf = form.querySelector('.los')
  const email = feld.value.trim()
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { feld.focus(); return }

  knopf.disabled = true
  knopf.textContent = '…'
  try {
    const res = await fetch('https://bzejndghppuipnedasuv.supabase.co/functions/v1/newsletter-subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: KEY },
      body: JSON.stringify({ email, source: SLUG ? 'news_einzel' : 'news_oeffentlich' }),
    })
    const daten = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(daten.error || 'Fehler')
    box.querySelector('.nl-meldung').textContent = MELDUNGEN[daten.status] || MELDUNGEN.bestaetigung_unterwegs
    box.classList.add('fertig')
  } catch (_) {
    knopf.disabled = false
    knopf.textContent = 'Eintragen'
    box.querySelector('.nl-meldung').textContent = 'Hat gerade nicht geklappt — bitte später noch einmal.'
    box.classList.add('fertig')
  }
})

async function start() {
  const status = document.getElementById('status')
  zaehlen(SLUG ? 'news_card' : 'news', SLUG)

  try {
    /* Bei /news/<slug> zuerst genau diese Meldung holen — sie kann aus der
       aktuellen Ausgabe oder aus dem Archiv stammen. */
    if (SLUG) {
      const treffer = (await Promise.all([
        hole('digest_cards_today', `select=*&slug=eq.${encodeURIComponent(SLUG)}`),
        hole('digest_cards_past',  `select=*&slug=eq.${encodeURIComponent(SLUG)}`),
      ])).flat()

      if (treffer.length) {
        const c = treffer[0]
        merken([c])
        document.getElementById('titel').textContent = c.headline || 'Creator News'
        document.getElementById('untertitel').textContent = c.summary || ''
        document.getElementById('einzel-karte').innerHTML =
          `<div class="zurueck"><a href="/news">← Alle Creator News</a></div>` +
          karte(c, { gross: true, offen: true, mitDatum: true, ohneKopf: true })
        document.getElementById('einzel-section').hidden = false
        document.getElementById('aktuell-titel').textContent = 'Weitere News'
      }
    }

    const heute = await hole('digest_cards_today', 'select=*&order=relevance_score.desc')
    const rest = SLUG ? heute.filter(c => c.slug !== SLUG) : heute
    merken(heute)

    if (rest.length) {
      document.getElementById('aktuell-datum').textContent =
        `${ausgabeTitel(rest[0].date)} · aktualisiert ${alter(rest[0].date)}`
      document.getElementById('aktuell-karten').innerHTML =
        mitPromos(rest.map((c, i) => karte(c, { gross: !SLUG && i === 0 })))
      status.textContent = ''
    } else if (!SLUG) {
      status.textContent = 'Zurzeit keine Ausgabe verfügbar.'
    } else {
      document.getElementById('aktuell-section').hidden = true
      status.textContent = ''
    }

    await mehr()
  } catch (err) {
    status.textContent = 'Die News konnten gerade nicht geladen werden.'
  }
}

async function mehr() {
  const btn = document.getElementById('mehr')
  btn.disabled = true
  try {
    const alt = await hole('digest_cards_past',
      `select=*&order=date.desc,relevance_score.desc&limit=${PRO_SEITE}&offset=${offset}`)
    if (alt.length) {
      merken(alt)
      document.getElementById('archiv-section').hidden = false
      /* Im Archiv laeuft die Reihenfolge weiter, damit nicht auf jeder
         Nachladeseite wieder derselbe Werbeplatz steht. */
      document.getElementById('archiv-karten').insertAdjacentHTML('beforeend',
        mitPromos(alt.filter(c => c.slug !== SLUG).map(c => karte(c, { mitDatum: true })), promoVersatz))
      promoVersatz += 1
      offset += alt.length
    }
    if (alt.length < PRO_SEITE) {
      btn.textContent = 'Das war alles'
    } else {
      btn.disabled = false
    }
  } catch (err) {
    btn.textContent = 'Konnte nicht laden'
  }
}

document.getElementById('mehr').addEventListener('click', mehr)
start()
</script>
