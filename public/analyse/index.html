<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Eine viuno-Analyse</title>
<meta name="description" content="Ausschnitt einer Creator-Analyse von viuno — Reichweite, Resonanz und was dazwischen liegt."/>
<!-- Die Seite ist statisch, der Inhalt kommt erst im Browser dazu. Die Vorschau
     beim Weiterleiten kann deshalb nur allgemein sein und nennt bewusst keine
     fremden Zahlen. -->
<meta property="og:title" content="Eine viuno-Analyse"/>
<meta property="og:description" content="Reichweite, Resonanz und was dazwischen liegt — ein Ausschnitt aus einer Creator-Analyse."/>
<meta property="og:type" content="website"/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Geteilter Analyse-Ausschnitt.
   Aufbau und Sprache aus Entwurf B: eine einzelne Karte, dritte Person, damit es
   sich beim Weiterleiten richtig herum liest. Farben, Schriften und Bausteine aus
   dem Produkt selbst, damit der Empfaenger sieht, wie seine eigene aussehen wuerde. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* Hell, mit denselben Werten wie das Cockpit in der App: die geteilte
     Seite ist ein Ausschnitt derselben Auswertung und soll nicht aussehen
     wie ein anderes Produkt. --cool ist die Signaturfarbe. */
  --bg:#f6f5fa; --panel:#ffffff; --panel2:#f2f0f8; --line:rgba(27,24,38,.09); --line2:#d7d3e3;
  --fg:#17151f; --fg2:#4e4a5e; --fg3:#817c92;
  --ok:#15784b; --ok-bg:#eaf4ef; --ok-line:rgba(21,120,75,.22);
  --bad:#c23a31; --bad-bg:#fbeeed; --bad-line:rgba(194,58,49,.22);
  --cool:#6b3fe8; --cool-bg:rgba(107,63,232,.10); --cool-line:rgba(107,63,232,.24);
  --sh-card:0 2px 10px rgba(27,24,38,.05);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
html,body{background:var(--bg);min-height:100%}
body{color:var(--fg);font-family:Inter,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}

.buehne{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  gap:16px;padding:24px 16px calc(40px + var(--safe-b))}

.absender{display:flex;align-items:center;gap:9px;color:var(--fg3);font-size:13px;font-weight:500}
.absender i{width:24px;height:24px;border-radius:7px;background:var(--fg);color:#fff;
  display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;font-family:Outfit,sans-serif}

.karte{width:100%;max-width:580px;background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--sh-card);border-radius:20px;overflow:hidden}

.kopf{padding:26px 24px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel2),var(--panel))}
.von{font-size:13px;color:var(--fg3);margin-bottom:12px}
.von b{color:var(--fg2);font-weight:600}
.kopf h1{font-size:clamp(23px,5.6vw,32px);font-weight:800;letter-spacing:-.025em;line-height:1.16;margin-bottom:10px}
.meta{font-size:12px;color:var(--fg3);letter-spacing:.04em}

.zahlen{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.z{background:var(--panel);padding:17px 20px}
.z .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.z .num{font-size:26px;font-weight:800;letter-spacing:-.035em;margin-top:5px;font-variant-numeric:tabular-nums}
.z .s{font-size:11.5px;color:var(--fg3);margin-top:3px;line-height:1.4}
.z.ok .num,.z.ok .s{color:var(--ok)}
.z.bad .num,.z.bad .s{color:var(--bad)}
.z.cool .num,.z.cool .s{color:var(--cool)}

.abschnitt{padding:22px 24px;border-top:1px solid var(--line)}
.abschnitt h2{font-size:17px;font-weight:700;letter-spacing:-.015em;margin-bottom:3px}
.abschnitt .lede{font-size:12.5px;color:var(--fg3);margin-bottom:14px}
.legend{display:flex;flex-wrap:wrap;gap:13px;font-size:11.5px;color:var(--fg3);margin-bottom:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{overflow-x:auto}
.chart svg{min-width:var(--min,520px);display:block}

/* Die Leseprobe bricht ab -- das ist der Moment, der den Rest verkauft. */
.probe{position:relative}
.probe .t{font-size:14.5px;color:var(--fg2);max-height:132px;overflow:hidden}
.probe::after{content:"";position:absolute;left:0;right:0;bottom:0;height:88px;
  background:linear-gradient(180deg,rgba(255,255,255,0),var(--panel) 86%);pointer-events:none}

.riegel{padding:24px;border-top:1px solid var(--line);background:var(--panel2);text-align:center}
.riegel .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg3);font-weight:700;margin-bottom:9px}
.riegel h3{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:9px;line-height:1.22}
.riegel p{font-size:14px;color:var(--fg2);max-width:40ch;margin:0 auto 16px}
.fehlt{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:18px}
.fehlt span{font-size:11.5px;color:var(--fg3);border:1px solid var(--line);border-radius:99px;padding:5px 10px}
.cta{display:block;background:var(--fg);color:var(--bg);font-weight:700;font-size:15.5px;
  padding:15px 20px;border-radius:12px;text-decoration:none;font-family:Outfit,sans-serif}
.cta:active{opacity:.85}
.klein{display:block;margin-top:10px;font-size:12px;color:var(--fg3)}

.fuss{width:100%;max-width:580px;text-align:center;font-size:12px;color:var(--fg3);line-height:1.8}
.fuss a{color:var(--fg2)}
.fuss .powered{font-size:12px;color:var(--fg3);margin-bottom:6px}
.fuss .powered a{font-weight:600;color:var(--fg)}
.fuss .powered a:hover{text-decoration:underline}

.laden,.weg{width:100%;max-width:580px;text-align:center;padding:60px 24px;color:var(--fg3);font-size:14px}
.weg h2{font-size:21px;font-weight:700;color:var(--fg);margin-bottom:10px}
.weg p{max-width:38ch;margin:0 auto 20px}
.spinner{width:20px;height:20px;border:2px solid var(--line2);border-top-color:var(--fg2);
  border-radius:50%;animation:dreh .7s linear infinite;margin:0 auto 14px}
@keyframes dreh{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="buehne">
  <div class="absender"><i>v</i> geteilt über viuno</div>

  <div class="laden" id="laden"><div class="spinner"></div>Ausschnitt wird geladen…</div>

  <div class="weg" id="weg" hidden>
    <h2>Dieser Link ist nicht mehr gültig</h2>
    <p>Geteilte Analysen laufen nach 90 Tagen ab, und sie können jederzeit zurückgezogen werden.</p>
    <a class="cta" style="display:inline-block" href="/app/#/analytics">Eigene Analyse ansehen</a>
  </div>

  <div class="karte" id="karte" hidden></div>

  <div class="fuss" id="fuss" hidden>
    <div class="powered">powered by <a href="/?quelle=analyse">viuno</a></div>
    <a href="/legal#impressum">Impressum</a> ·
    <a href="/legal#datenschutz">Datenschutz</a> ·
    <a href="/legal#agb">AGB</a>
  </div>
</div>

<script>
const FUNKTION='https://bzejndghppuipnedasuv.supabase.co/functions/v1/analyse-oeffentlich'
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
const de=(n,k=0)=>n==null||isNaN(+n)?'–':(+n).toLocaleString('de-DE',{minimumFractionDigits:k,maximumFractionDigits:k})
const kurz=n=>n==null?'–':n>=1e6?(n/1e6).toFixed(1).replace('.',',')+'M':n>=1e3?Math.round(n/1e3)+'k':String(n)

/* Der Token kommt aus der Abfrage: /analyse/?a=<token>.
   Der schoenere Pfad /analyse/<token> braeuchte eine 200-Umschreibung in
   _redirects. Die greift auf dieser Domain nicht -- unbekannte Pfade werden von
   etwas vor Cloudflare Pages auf die Startseite gelegt, die 301-Regeln derselben
   Datei funktionieren dagegen. Der Pfad wird trotzdem gelesen: sobald die
   Umschreibung eingerichtet ist, funktionieren beide Formen ohne Codeaenderung. */
function tokenAusUrl(){
  const ausAbfrage=new URLSearchParams(location.search).get('a')
  if(ausAbfrage)return ausAbfrage.trim()
  const segmente=location.pathname.split('/').filter(Boolean)
  const letztes=segmente[segmente.length-1]||''
  return letztes==='analyse'||letztes==='index.html'?'':letztes.trim()
}
const token=tokenAusUrl()

function zeigeWeg(){
  document.getElementById('laden').hidden=true
  document.getElementById('weg').hidden=false
  document.getElementById('fuss').hidden=false
}

function balkenSvg(D){
  if(D.length<4)return ''
  const W=760,PADL=6,PADR=6,TOP=16,MID=118,BOT=188
  const maxV=Math.max(...D.map(x=>x.v),1), maxR=Math.max(...D.map(x=>x.r),1)
  const slot=(W-PADL-PADR)/D.length, bw=slot*0.6, off=(slot-bw)/2
  const jedes=Math.max(1,Math.ceil(38/slot))
  // Die Farbschwellen liegen bei den staerksten und schwaechsten Beitraegen dieses
  // Kanals, nicht bei festen Werten -- sonst waere bei kleinen Kanaelen alles rot.
  const sortiert=[...D].map(x=>x.r).sort((a,b)=>b-a)
  const stark=sortiert[Math.max(0,Math.floor(sortiert.length*0.25)-1)]
  const schwach=sortiert[Math.min(sortiert.length-1,Math.ceil(sortiert.length*0.75))]
  let s=''
  D.forEach((p,i)=>{
    const x=(PADL+i*slot+off).toFixed(1)
    const hv=Math.max(3,(p.v/maxV)*(MID-TOP))
    s+=`<rect x="${x}" y="${(MID-hv).toFixed(1)}" width="${bw.toFixed(1)}" height="${hv.toFixed(1)}" rx="3" fill="var(--cool)" opacity="${p.v>=maxV*0.55?1:0.5}"></rect>`
    const hr=Math.max(3,(p.r/maxR)*(BOT-MID-24))
    const f=p.r>=stark?'var(--ok)':(p.r<=schwach?'var(--bad)':'var(--line2)')
    s+=`<rect x="${x}" y="${MID+14}" width="${bw.toFixed(1)}" height="${hr.toFixed(1)}" rx="3" fill="${f}"></rect>`
    if(i%jedes===0||i===D.length-1)
      s+=`<text x="${(+x+bw/2).toFixed(1)}" y="${BOT+20}" text-anchor="middle" font-size="10" fill="var(--fg3)" font-family="Inter, sans-serif">${esc(p.d)}</text>`
  })
  s+=`<line x1="${PADL}" y1="${MID+2}" x2="${W-PADR}" y2="${MID+2}" stroke="var(--line)" stroke-width="1"></line>`
  s+=`<text x="${PADL}" y="${TOP-3}" font-size="10" fill="var(--fg3)" font-family="Inter, sans-serif">${kurz(maxV)} Aufrufe — höchster Wert oben</text>`
  s+=`<text x="${PADL}" y="${BOT+7}" font-size="10" fill="var(--fg3)" font-family="Inter, sans-serif">${de(maxR,1)} Likes je 1.000 Aufrufe — höchster Wert unten</text>`
  return `<div class="chart" style="--min:${Math.max(520,D.length*22)}px"><svg viewBox="0 0 ${W} 216" width="100%" role="img" aria-label="Aufrufe und Resonanz je Beitrag">${s}</svg></div>`
}

function zeige(d){
  const k=d.kennzahlen||{}
  const handle=d.username?'@'+String(d.username).replace(/^@/,''):d.plattform
  const zeit=d.zeitraum?`${d.zeitraum.von}–${d.zeitraum.bis}`:''
  const kacheln=[]
  if(k.avg_views!=null)kacheln.push(['cool','Ø Aufrufe',kurz(k.avg_views),'pro Beitrag'])
  if(k.followers!=null)kacheln.push(['','Follower',de(k.followers),'zum Zeitpunkt der Analyse'])
  if(k.resonanz_top!=null)kacheln.push(['ok','Stärkste Beiträge',de(k.resonanz_top,1),'Likes je 1.000 Aufrufe'])
  if(k.resonanz_flop!=null)kacheln.push(['bad','Schwächste',de(k.resonanz_flop,1),'Likes je 1.000 Aufrufe'])

  let h=`<div class="kopf">
    <div class="von"><b>${esc(handle)}</b> hat einen Ausschnitt der eigenen Analyse geteilt</div>
    <h1>${esc(d.kernaussage||'Eine Auswertung von '+d.plattform)}</h1>
    <div class="meta mono">${esc(d.plattform)} · ${de(d.beitraege)} Beiträge${zeit?' · '+esc(zeit):''}</div>
  </div>`

  if(kacheln.length)h+=`<div class="zahlen">${kacheln.map(([c,k2,n,s])=>
    `<div class="z ${c}"><div class="k">${esc(k2)}</div><div class="num">${esc(n)}</div><div class="s">${esc(s)}</div></div>`).join('')}</div>`

  if(Array.isArray(d.balken)&&d.balken.length>=4){
    h+=`<div class="abschnitt"><h2>Jeder Beitrag einzeln</h2>
      <div class="lede">Oben wie weit ein Beitrag lief, unten wie viele davon reagiert haben. Beide Hälften haben einen eigenen Maßstab.</div>
      <div class="legend">
        <span><i style="background:var(--cool)"></i>Aufrufe</span>
        <span><i style="background:var(--ok)"></i>starke Resonanz</span>
        <span><i style="background:var(--bad)"></i>schwache Resonanz</span>
      </div>${balkenSvg(d.balken)}</div>`
  }

  if(d.leseprobe){
    h+=`<div class="abschnitt"><h2>Aus der Auswertung</h2>
      <div class="probe"><div class="t">${esc(d.leseprobe)}</div></div></div>`
  }

  h+=`<div class="riegel">
    <div class="k">Neun Abschnitte — hier steht einer</div>
    <h3>Was steht in deinen Zahlen?</h3>
    <p>Dieselbe Auswertung für deinen eigenen Kanal, aus deinen letzten 36 Beiträgen.</p>
    <div class="fehlt">
      <span>Was getragen hat</span><span>Wo Wirkung liegen bleibt</span><span>Reichweite gegen Resonanz</span>
      <span>Das Muster</span><span>Wie deine Texte gebaut sind</span><span>Zum Ton</span>
      <span>Was weniger werden sollte</span><span>Sechs nächste Schritte</span><span>Vier Ranglisten</span>
    </div>
    <a class="cta" href="/app/#/analytics">Analyse für deinen Kanal</a>
    <span class="klein">9,99 € einmalig · kein Abo · fertig in zwei Minuten</span>
  </div>`

  document.getElementById('karte').innerHTML=h
  document.getElementById('laden').hidden=true
  document.getElementById('karte').hidden=false
  document.getElementById('fuss').hidden=false
  document.title=`${handle} · Analyse-Ausschnitt`
}

if(!token){ zeigeWeg() }
else{
  fetch(`${FUNKTION}?token=${encodeURIComponent(token)}`)
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{ if(d&&!d.fehler)zeige(d); else zeigeWeg() })
    .catch(()=>zeigeWeg())
}
</script>
</body>
</html>
