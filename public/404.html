<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>viuno · Seite nicht gefunden</title>
<!-- Ohne diese Datei liefert Cloudflare Pages fuer jede unbekannte Adresse die
     Startseite mit HTTP 200 aus (SPA-Fallback). Tippfehler-URLs und tote Links
     sahen fuer Suchmaschinen damit wie gueltige Seiten aus. Diese Datei sorgt
     fuer einen echten 404 -- und sagt dem Menschen, wo es weitergeht.

     Zweiter Fall, seit 15.09.: eine BioLink- oder Media-Kit-Seite ist gerade
     erst erzeugt worden und Cloudflare baut noch. Wer dann auf seine frische
     Seite klickt, landet hier -- und "Diese Seite gibt es nicht" ist in dem
     Moment schlicht falsch und erschreckt. Sieht die Adresse nach einem
     Creator-Slug aus, wartet die Seite deshalb und laedt selbst nach, statt
     eine Fehlmeldung zu zeigen. Erst wenn das mehrfach nichts bringt, steht
     hier der eigentliche 404-Text. -->
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f5fa;
       font-family:-apple-system,BlinkMacSystemFont,'Inter',Arial,sans-serif;color:#4e4a5e;padding:0 16px}
  .box{text-align:center;max-width:420px}
  h1{font-size:22px;font-weight:700;letter-spacing:-.02em;color:#17151f;margin:0 0 8px}
  p{margin:0 0 18px;line-height:1.55}
  a{color:#17151f;font-weight:600}
  .links a{display:inline-block;margin:0 8px}
  [hidden]{display:none!important}
  .kreis{width:34px;height:34px;margin:0 auto 18px;border-radius:50%;
         border:2px solid rgba(27,24,38,.12);border-top-color:#6b3fe8;animation:dreh .9s linear infinite}
  @keyframes dreh{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.kreis{animation:none;border-top-color:rgba(27,24,38,.12)}}
  .leise{font-size:13px;color:#817c92}
</style>
</head>
<body>
  <div class="box">
    <div id="baut" hidden>
      <div class="kreis"></div>
      <h1>Diese Seite wird gerade gebaut.</h1>
      <p>Neue Seiten brauchen einen Moment, bis sie überall erreichbar sind.
         Wir versuchen es gleich noch einmal.</p>
      <p class="leise" id="countdown"></p>
    </div>

    <div id="weg" hidden>
      <h1>Diese Seite gibt es nicht.</h1>
      <p>Vielleicht ist der Link alt oder ein Buchstabe fehlt.</p>
      <p class="links"><a href="/">Startseite</a> · <a href="/app/">Zur App</a> · <a href="/news">Creator News</a> · <a href="/faq/">Hilfe</a></p>
    </div>
  </div>

<script>
(function(){
  var VERSUCHE = 4, ABSTAND = 8000   // 4 x 8s -- deckt die Bauzeit von Cloudflare ab

  /* Sieht die Adresse nach einer Creator-Seite aus? Genau ein Pfadsegment,
     nur Kleinbuchstaben, Ziffern und Bindestriche, kein Punkt -- also kein
     verirrter Dateiname. /kit/<slug> zaehlt mit. */
  function koennteSeiteSein(){
    var teile = location.pathname.split('/').filter(Boolean)
    if (teile.length === 2 && teile[0] === 'kit') teile = [teile[1]]
    if (teile.length !== 1) return false
    return /^[a-z0-9][a-z0-9-]{1,49}$/.test(teile[0])
  }

  function zeige(id){ document.getElementById(id).hidden = false }

  if (!koennteSeiteSein()) { zeige('weg'); return }

  /* Der Zaehler haengt an der Adresse, nicht am Browser: eine zweite,
     wirklich tote Adresse soll nicht am Kontingent der ersten haengen. */
  var schluessel = 'viuno-404-' + location.pathname, n = 0
  try { n = parseInt(sessionStorage.getItem(schluessel) || '0', 10) || 0 } catch (_) {}

  if (n >= VERSUCHE) {
    try { sessionStorage.removeItem(schluessel) } catch (_) {}
    zeige('weg'); return
  }

  try { sessionStorage.setItem(schluessel, String(n + 1)) } catch (_) {}
  zeige('baut')

  var rest = Math.round(ABSTAND / 1000)
  var feld = document.getElementById('countdown')
  feld.textContent = 'Nächster Versuch in ' + rest + ' Sekunden …'
  var tick = setInterval(function(){
    rest--
    feld.textContent = rest > 0
      ? 'Nächster Versuch in ' + rest + ' Sekunden …'
      : 'Wird geladen …'
    if (rest <= 0) clearInterval(tick)
  }, 1000)

  setTimeout(function(){ location.reload() }, ABSTAND)
})();
</script>
</body>
</html>
