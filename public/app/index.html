<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>viuno · App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f5f4f2;
  --surface: #ffffff;
  --surface2: #f0efed;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.13);
  --text: #111110;
  --muted: #7a7975;
  --subtle: #b0afa9;
  --green: #1a7f4b;
  --green-bg: #edf7f1;
  --red: #c0392b;
  --orange: #b85c00;
  --radius: 16px;
  --radius-sm: 10px;
  --nav-h: 56px;
  --sidebar-w: 272px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  background: var(--bg);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  color: var(--text);
  font-size: 14px;
}

/* ─── BOOT ─── */
#boot { min-height: 100dvh; display: grid; place-items: center; }
.boot-spinner { width: 22px; height: 22px; border: 2px solid var(--border-strong); border-top-color: var(--text); border-radius: 50%; animation: spin .6s linear infinite; }

/* ─── SHELL ─── */
#shell { display: none; min-height: 100dvh; }
#shell.visible { display: block; }

/* ─── MENU (one definition — sidebar on desktop, drawer on mobile) ─── */
.sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 80; pointer-events: none; transition: background .25s; }
.sidebar-overlay.open { background: rgba(0,0,0,.35); pointer-events: auto; }

.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
  background: var(--surface); z-index: 90;
  transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.32,.72,0,1);
  display: flex; flex-direction: column;
  box-shadow: 4px 0 24px rgba(0,0,0,.08);
}
.sidebar.open { transform: translateX(0); }
.sidebar-header { padding: 20px 20px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.sidebar-logo { display: flex; align-items: center; gap: 8px; }
.sidebar-logo-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--text); color: white; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.sidebar-logo-text { font-size: 16px; font-weight: 700; letter-spacing: -.03em; }
.sidebar-close { width: 32px; height: 32px; border-radius: 99px; background: var(--surface2); border: none; cursor: pointer; display: grid; place-items: center; font-size: 18px; color: var(--muted); line-height: 1; }
.sidebar-nav { flex: 1; padding: 10px; overflow-y: auto; }
.sidebar-section { font-size: 10px; font-weight: 700; color: var(--subtle); text-transform: uppercase; letter-spacing: .08em; padding: 12px 10px 4px; }
.sidebar-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 500; transition: all .15s; margin-bottom: 2px; }
.sidebar-item:hover { background: var(--surface2); color: var(--text); }
.sidebar-item.active { background: var(--text); color: white; }
.sidebar-item svg { flex-shrink: 0; }
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
.sidebar-user { font-size: 12px; color: var(--muted); margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-sidebar-logout { width: 100%; padding: 10px; border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--border-strong); font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; }
.btn-sidebar-logout:hover { background: var(--border); }

/* ─── TOPBAR ─── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(245,244,242,.92); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 20px; height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.hamburger { width: 36px; height: 36px; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border-radius: 8px; transition: background .15s; padding: 0; }
.hamburger:hover { background: var(--surface2); }
.hamburger span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; }
.topbar-title { font-size: 15px; font-weight: 700; letter-spacing: -.03em; }
.topbar-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--text); color: white; display: grid; place-items: center; font-size: 12px; font-weight: 600; cursor: pointer; border: 2px solid var(--border); overflow: hidden; flex-shrink: 0; }
.topbar-avatar img { width: 100%; height: 100%; object-fit: cover; }

/* ─── MAIN ─── */
.main { display: flex; flex-direction: column; min-height: 100dvh; }
.page { flex: 1; padding-bottom: 24px; }
#content-area { min-height: 40dvh; }

/* ─── FOOTER ─── */
.app-footer { border-top: 1px solid var(--border); padding: 18px 20px calc(20px + var(--safe-bottom)); }
.footer-links { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.footer-links a { font-size: 12px; color: var(--muted); text-decoration: none; }
.footer-links a:hover { color: var(--text); text-decoration: underline; }
.footer-copy { font-size: 11px; color: var(--subtle); margin-top: 10px; }

/* ─── AUTH MODE (login / register: no menu, no topbar) ─── */
#shell.auth-mode .sidebar,
#shell.auth-mode .sidebar-overlay,
#shell.auth-mode .topbar { display: none !important; }
#shell.auth-mode .main { padding-left: 0 !important; }
#shell.auth-mode .page { display: flex; align-items: center; justify-content: center; padding: 24px; }
#shell.auth-mode #content-area { width: 100%; }

/* ─── DESKTOP: sidebar permanently visible ─── */
@media (min-width: 900px) {
  .hamburger { display: none; }
  .sidebar-close { display: none; }
  .sidebar { transform: translateX(0); box-shadow: none; border-right: 1px solid var(--border); }
  .sidebar-overlay { display: none; }
  .main { padding-left: var(--sidebar-w); }
  .topbar { padding-left: 24px; }
}

/* ─── LOGIN / REGISTER CARD ─── */
.login-card { width: 100%; max-width: 360px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px 28px; }
.login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.login-logo-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--text); color: white; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.login-logo-text { font-size: 17px; font-weight: 700; letter-spacing: -.03em; }
.login-title { font-size: 20px; font-weight: 700; letter-spacing: -.03em; margin-bottom: 4px; }
.login-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.field input { width: 100%; padding: 11px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; color: var(--text); background: var(--bg); outline: none; transition: border-color .15s; }
.field input:focus { border-color: var(--text); }
.btn-login { width: 100%; padding: 12px; margin-top: 8px; background: var(--text); color: white; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }
.login-error { font-size: 12px; color: var(--red); margin-top: 10px; text-align: center; min-height: 18px; }
.login-note { font-size: 12px; color: var(--green); margin-top: 10px; text-align: center; line-height: 1.5; }
.login-switch { font-size: 12px; color: var(--muted); margin-top: 18px; text-align: center; }
.login-switch a { color: var(--text); font-weight: 600; text-decoration: none; }
.login-switch a:hover { text-decoration: underline; }

/* ─── PAGE HEADER / PLACEHOLDER ─── */
.page-header { padding: 22px 20px 0; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -.04em; }
.page-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.section { padding: 16px 20px 0; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-title { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -.02em; }
.placeholder-card {
  background: var(--surface); border: 1px dashed var(--border-strong);
  border-radius: var(--radius); padding: 40px 24px; text-align: center;
}
.placeholder-icon { font-size: 30px; margin-bottom: 10px; }
.placeholder-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.placeholder-sub { font-size: 13px; color: var(--muted); line-height: 1.55; }
.placeholder-route { display: inline-block; margin-top: 12px; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--subtle); background: var(--surface2); border-radius: 99px; padding: 4px 10px; }

/* ─── MODAL (overlay + slide-up sheet) ─── */
.modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0); pointer-events: none; transition: background .25s; }
.modal-overlay.open { background: rgba(0,0,0,0.35); pointer-events: auto; }
.modal-panel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 101;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  max-height: 92dvh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,.72,0,1);
  padding-bottom: calc(24px + var(--safe-bottom));
}
.modal-panel.open { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 12px auto 0; }
.modal-header { padding: 14px 20px 0; display: flex; align-items: flex-start; gap: 14px; }
.modal-title { font-size: 18px; font-weight: 700; letter-spacing: -.02em; color: var(--text); }
.modal-close { margin-left: auto; width: 32px; height: 32px; border-radius: 99px; background: var(--surface2); border: none; cursor: pointer; flex-shrink: 0; display: grid; place-items: center; font-size: 16px; color: var(--muted); }
.modal-body { padding: 16px 20px 0; font-size: 13px; color: var(--text); line-height: 1.6; }
@media (min-width: 900px) {
  .modal-panel { left: 50%; right: auto; bottom: auto; top: 50%; width: 440px; max-width: calc(100vw - 48px); border-radius: 20px; transform: translate(-50%, -46%) scale(.98); opacity: 0; transition: opacity .2s, transform .2s; }
  .modal-panel.open { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .modal-handle { display: none; }
  .modal-header { padding-top: 20px; }
}

/* ═══ VIEW: DASHBOARD (aus /dashboard/) ═══ */
.greeting-section{padding:22px 20px 0}
.greeting-hi{font-size:22px;font-weight:700;letter-spacing:-.04em}
.greeting-date{font-size:13px;color:var(--muted);margin-top:3px}

.kpi-scroll{display:flex;gap:10px;padding:16px 20px 0;overflow-x:auto;scrollbar-width:none}
.kpi-scroll::-webkit-scrollbar{display:none}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:120px;flex-shrink:0}
.kpi-card.dark{background:var(--text);border-color:var(--text)}
.kpi-card.dark .kpi-label{color:rgba(255,255,255,.45)}
.kpi-card.dark .kpi-value{color:white}
.kpi-label{font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi-value{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.04em;margin-top:4px;line-height:1}
.kpi-delta{font-size:11px;font-weight:500;margin-top:5px}
.kpi-delta.up{color:var(--green)}
.kpi-delta.down{color:var(--red)}
.kpi-delta.neu{color:var(--muted)}

.mini-chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;text-decoration:none;display:block;transition:border-color .15s}
.mini-chart-card:hover{border-color:var(--border-strong)}
.mini-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.a-label{font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.a-value{font-size:26px;font-weight:700;color:var(--text);letter-spacing:-.04em;margin-top:3px;line-height:1}
.a-delta{font-size:11px;font-weight:500;margin-top:4px}
.a-delta.up{color:var(--green)}
.a-delta.down{color:var(--red)}
.mini-svg{width:100%;height:52px;display:block;overflow:visible}
.mini-footer{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap}
.a-stat{font-size:11px;color:var(--muted)}
.a-stat strong{color:var(--text);font-weight:600}

.digest-preview{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;text-decoration:none;display:block;transition:border-color .15s}
.digest-preview:hover{border-color:var(--border-strong)}
.digest-img{width:100%;height:110px;object-fit:cover;background:var(--surface2);display:block}
.digest-img-fallback{width:100%;height:110px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:32px}
.digest-inner{padding:12px 16px}
.digest-pill{display:inline-flex;align-items:center;background:var(--surface2);border-radius:99px;font-size:10px;font-weight:600;color:var(--muted);padding:3px 10px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.digest-headline{font-size:14px;font-weight:600;color:var(--text);line-height:1.4}
.digest-more{font-size:12px;color:var(--muted);margin-top:6px}

.list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;text-decoration:none;display:block;transition:border-color .15s}
.list-card:hover{border-color:var(--border-strong)}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}
.req-initial{width:36px;height:36px;border-radius:10px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;font-size:13px;font-weight:700}
.req-name{font-size:13px;font-weight:600;color:var(--text)}
.req-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.req-dot{width:7px;height:7px;border-radius:50%;background:var(--text);margin-left:auto;flex-shrink:0}

.deal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.deal-dot.open{background:var(--orange)}
.deal-dot.negotiating{background:#7c5cfc}
.deal-dot.closed_won{background:var(--green)}
.deal-dot.closed{background:var(--green)}
.deal-dot.draft{background:var(--subtle)}
.deal-info{flex:1;min-width:0}
.deal-title-text{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deal-brand{font-size:11px;color:var(--muted);margin-top:1px}
.deal-value{font-size:13px;font-weight:700;color:var(--text);flex-shrink:0}

.goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:8px}
.goal-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.goal-label{font-size:13px;font-weight:600;color:var(--text)}
.goal-pct{font-size:13px;font-weight:700;color:var(--text)}
.goal-sub{font-size:11px;color:var(--muted);margin-bottom:10px}
.goal-bar-track{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.goal-bar-fill{height:100%;border-radius:99px;background:var(--text)}

.trend-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)}
.trend-row:last-child{border-bottom:none}
.trend-rank{font-size:12px;font-weight:700;color:var(--subtle);width:18px;text-align:right;flex-shrink:0}
.trend-thumb-fb{width:34px;height:34px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.trend-name{font-size:13px;font-weight:600;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend-views{font-size:11px;color:var(--subtle);flex-shrink:0}

.quick-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick-link{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;text-decoration:none;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.quick-link:hover{border-color:var(--border-strong)}
.quick-link-icon{font-size:20px}
.quick-link-label{font-size:13px;font-weight:600;color:var(--text)}
.quick-link-sub{font-size:11px;color:var(--muted)}

/* ─── TOAST ─── */
.toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; pointer-events: none; }
.toast { background: var(--text); color: white; font-size: 13px; font-weight: 500; padding: 10px 18px; border-radius: 99px; animation: toastIn .25s ease-out; white-space: nowrap; }
@keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* ─── UTILS ─── */
.skeleton { background: linear-gradient(90deg, var(--surface2) 25%, #e8e6e2 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to{transform:rotate(360deg)} }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- BOOT (bis die Session geprüft ist) -->
<div id="boot"><div class="boot-spinner"></div></div>

<!-- SHELL -->
<div id="shell">

  <!-- MENÜ — genau einmal definiert, Router setzt .active -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><div class="sidebar-logo-mark">v</div><div class="sidebar-logo-text">viuno</div></div>
      <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <div class="sidebar-section">Übersicht</div>
      <a class="sidebar-item" data-route="dashboard" href="#/dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Dashboard
      </a>
      <a class="sidebar-item" data-route="digest" href="#/digest">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Daily Digest
      </a>

      <div class="sidebar-section">Creator</div>
      <a class="sidebar-item" data-route="analytics" href="#/analytics">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Analytics
      </a>
      <a class="sidebar-item" data-route="trends" href="#/trends">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        Trends
      </a>
      <a class="sidebar-item" data-route="biolink" href="#/biolink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        BioLink
      </a>
      <a class="sidebar-item" data-route="mediakit" href="#/mediakit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Media Kit
      </a>

      <div class="sidebar-section">Business</div>
      <a class="sidebar-item" data-route="requests" href="#/requests">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Anfragen

  return n.toFixed(0)
}

}

/* ─────────────────────────────────────────────
   View-Lifecycle
   Jede View bekommt ein ctx: ctx.stale sagt, ob inzwischen
   weitergeklickt wurde (späte Query-Antworten dürfen dann nicht
   mehr ins DOM schreiben), ctx.onCleanup registriert Listener,
   Intervalle und Subscriptions, die beim Verlassen abgeräumt werden.
   ───────────────────────────────────────────── */
let viewToken = 0
let viewCleanups = []

function runCleanups() {
  const fns = viewCleanups
  viewCleanups = []
  for (const fn of fns) { try { fn() } catch (e) { console.warn('cleanup failed', e) } }
}

function makeCtx() {
  const token = ++viewToken
  return {
    get stale() { return token !== viewToken },
    onCleanup(fn) { if (token === viewToken) viewCleanups.push(fn) },
    /* Listener, der sich beim Verlassen der View selbst abmeldet */
    on(target, type, handler, opts) {
      target.addEventListener(type, handler, opts)
      this.onCleanup(() => target.removeEventListener(type, handler, opts))
    },
    /* Intervall, das beim Verlassen der View gestoppt wird */
    interval(fn, ms) {
      const id = setInterval(fn, ms)
      this.onCleanup(() => clearInterval(id))
      return id
    }
  }
}

function currentRoute() {
  const raw = (location.hash || '').replace(/^#\/?/, '').split('?')[0].split('/')[0].trim().toLowerCase()
  return ROUTES[raw] ? raw : null
}

/* ─────────────────────────────────────────────
   ROUTER + Session-Guard
   Regeln (aus /dashboard/ übernommen):
     - keine Session            → #/login
     - Session + onboarding_completed === false → #/onboarding
     - Session + Default        → #/dashboard
   ───────────────────────────────────────────── */
async function router() {
  let name = currentRoute()

  // Ohne Session: nur öffentliche Routen
  if (!state.session) {
    if (!name || !ROUTES[name].public) { navigate('#/login'); return }
  } else {
    // Mit Session: Login/Register überspringen
    if (!name || ROUTES[name].public) { navigate('#/' + DEFAULT_ROUTE); return }
    // Profil unvollständig → Onboarding erzwingen
    if (needsOnboarding() && name !== 'onboarding') { navigate('#/onboarding'); return }
  }

  state.route = name
  const route = ROUTES[name]
  const chromeless = route.public || route.chromeless

  document.getElementById('shell').classList.toggle('auth-mode', !!chromeless)
  document.getElementById('topbar-title').textContent = route.title
  document.title = 'viuno · ' + route.title
  setActiveMenuItem(name)
  closeSidebar()
  closeModal()

  runCleanups()
  const ctx = makeCtx()

  const area = document.getElementById('content-area')
  area.innerHTML = ''
  window.scrollTo(0, 0)
  await route.render(area, ctx)
}

function setActiveMenuItem(name) {

async function doRegister() {
  const email = document.getElementById('inp-email').value.trim()
  const pw    = document.getElementById('inp-pw').value
  const pw2   = document.getElementById('inp-pw2').value

  errEl.textContent = ''; noteEl.classList.add('hidden')

  if (pw !== pw2)        { errEl.textContent = 'Passwörter stimmen nicht überein.'; return }

  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'
  const { data, error } = await sb.auth.signUp({ email, password: pw })

    ${goals.length?`<div class="section">

          <span class="trend-rank">${h.rank}</span>

      <div class="section-title" style="margin-bottom:10px">Schnellzugriff</div>
      <div class="quick-links">
        <a class="quick-link" href="#/analytics"><div class="quick-link-icon">📊</div><div class="quick-link-label">Analytics</div><div class="quick-link-sub">Instagram & TikTok</div></a>
        <a class="quick-link" href="#/digest"><div class="quick-link-icon">📰</div><div class="quick-link-label">Daily Digest</div><div class="quick-link-sub">Creator News</div></a>

      </div>

/* Linien-Chart SVG aus echten historischen Daten — aus /dashboard/ */
function buildLineSvg(rows){
  const sorted=[...rows].reverse() // älteste zuerst
  if(sorted.length<2){
    // wenig Daten → einfache flache Linie
    return `<svg class="mini-svg" viewBox="0 0 300 52" preserveAspectRatio="none">
      <line x1="0" y1="40" x2="300" y2="40" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="4 3"/>
    </svg>`
  }
  const values=sorted.map(r=>+(r.followers)||0)
  const min=Math.min(...values), max=Math.max(...values), range=max-min||1
  const W=300,H=52,PAD=5
  const pts=values.map((v,i)=>{
    const x=i/(values.length-1)*W
    const y=PAD+(1-(v-min)/range)*(H-PAD*2)
    return [x,y]
  })
  const pathD=pts.map((p,i)=>i===0?`M${p[0].toFixed(1)},${p[1].toFixed(1)}`:`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')
  const areaD=`${pathD} L${W},${H} L0,${H} Z`
  const last=pts[pts.length-1]
  return `<svg class="mini-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="lg-dash" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--text)" stop-opacity=".1"/>
        <stop offset="100%" stop-color="var(--text)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaD}" fill="url(#lg-dash)"/>
    <path d="${pathD}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="var(--text)" stroke="var(--surface)" stroke-width="2"/>
  </svg>`
}

;(async function init() {
  document.getElementById('footer-year').textContent = new Date().getFullYear()
  await loadSession()

  // Default-Route setzen, wenn kein (gültiger) Hash da ist
  if (!currentRoute()) {
    location.replace(location.pathname + (state.session ? '#/' + DEFAULT_ROUTE : '#/login'))
  }

  document.getElementById('boot').classList.add('hidden')
  document.getElementById('shell').classList.add('visible')
  state.booted = true
  await router()
})()

/* Session-Wechsel in einem anderen Tab spiegeln */
sb.auth.onAuthStateChange(async (event) => {
  if (!state.booted) return
  if (event === 'SIGNED_OUT') { state.session = null; state.profile = null; paintUser(); router() }
})
