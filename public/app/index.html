.news-btn:hover{color:var(--text);border-color:var(--border-strong)}

/* Fusszeile: Plattform, Quelle, Alter. Zugeklappt reiner Text, aufgeklappt
   der Link zur Meldung — so wird erst beim Lesen angeboten, wegzugehen. */
.news-foot{display:flex;align-items:center;gap:var(--s-2);margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.news-quelle{flex:1;min-width:0;font-size:var(--t-xs);color:var(--subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.news-quelle{display:flex;align-items:center;gap:4px;text-decoration:none;transition:color .15s}
a.news-quelle:hover{color:var(--text)}
/* display:flex wuerde das hidden-Attribut sonst ueberstimmen. */
.news-quelle[hidden]{display:none}
.news-chevron{flex-shrink:0;color:var(--subtle);transition:transform .2s}
.news-card.offen .news-chevron{transform:rotate(180deg)}

/* Einzeiler zum Newsletter - direkt zwischen den Karten anklickbar. */
.nl-line{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);margin-bottom:10px;border:1px dashed var(--border-strong);border-radius:var(--r-md);cursor:pointer;transition:border-color .15s}
.nl-line:hover{border-color:var(--muted)}
.nl-line-check{width:18px;height:18px;flex-shrink:0;accent-color:var(--text);cursor:pointer}
.nl-line-text{font-size:var(--t-sm);color:var(--muted)}
.nl-line:has(.nl-line-check:checked) .nl-line-text{color:var(--text)}

/* Produkt-Hinweis: leiser als eine Meldung, damit klar bleibt, was hier
   die Hauptsache ist. */
.news-hinweis{display:flex;align-items:center;gap:var(--s-3);padding:12px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-md);text-decoration:none;color:inherit;transition:border-color .15s}
.news-hinweis:hover{border-color:var(--border-strong)}
.news-hinweis-icon{width:30px;height:30px;border-radius:var(--r-sm);background:var(--surface2);display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
.news-hinweis-text{flex:1;min-width:0}
.news-hinweis-t{display:block;font-size:var(--t-sm);font-weight:var(--fw-sb);color:var(--text)}
.news-hinweis-u{display:block;font-size:var(--t-xs);color:var(--muted);margin-top:1px}
.news-hinweis-pfeil{flex-shrink:0;color:var(--subtle)}

/* Frueher erschienene Ausgaben. */
.news-frueher{margin-top:var(--s-6)}
.news-frueher-titel{font-size:var(--t-2xs);font-weight:var(--fw-sb);color:var(--subtle);text-transform:uppercase;letter-spacing:.07em;margin-bottom:var(--s-3)}
.news-ausgabe{display:flex;align-items:center;gap:var(--s-3);width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 16px;margin-bottom:10px;font-family:inherit;cursor:pointer;transition:border-color .15s}
.news-ausgabe:hover{border-color:var(--border-strong)}
.news-ausgabe-text{flex:1;min-width:0}
.news-ausgabe-titel{display:block;font-size:var(--t-sm);font-weight:var(--fw-sb);color:var(--text)}
.news-ausgabe-sub{display:block;font-size:var(--t-xs);color:var(--subtle);margin-top:2px}
.news-ausgabe-pfeil{flex-shrink:0;color:var(--subtle);transition:transform .2s}
.news-ausgabe.offen .news-ausgabe-pfeil{transform:rotate(90deg)}

/* ═══ VIEW: ONBOARDING (aus /onboarding/) ═══
   .field und .handle-prefix weichen von der Shell bzw. /profile/ ab
   und sind deshalb auf .view-onboarding begrenzt. */
.view-onboarding .field{margin-bottom:14px}
.view-onboarding .field input,.view-onboarding .field textarea,.view-onboarding .field select{padding:13px 16px;font-size:var(--t-lg);background:var(--surface)}
.view-onboarding .handle-prefix{padding:13px 12px 13px 16px;border:1px solid var(--border-strong);border-right:none;border-radius:var(--r-sm) 0 0 var(--r-sm);font-size:var(--t-lg);color:var(--subtle);background:var(--surface2)}
.handle-prefix-wrap{display:flex}
.handle-prefix-wrap input{border-radius:0 var(--r-sm) var(--r-sm) 0!important}
.ob-wrap{min-height:100dvh;display:flex;flex-direction:column;padding:0 0 calc(40px + var(--safe-bottom))}
.ob-topbar{padding:var(--s-5) var(--page-x) 0;display:flex;align-items:center;justify-content:space-between}
.ob-logo{display:flex;align-items:center;gap:8px}
.ob-logo-mark{width:28px;height:28px;border-radius:var(--r-xs);background:var(--text);color:white;display:grid;place-items:center;font-size:var(--t-sm);font-weight:700}
.ob-logo-text{font-size:16px;font-weight:700;letter-spacing:-.03em}
.ob-step-label{font-size:var(--t-sm);font-weight:500;color:var(--muted)}
.progress-bar{margin:var(--s-5) var(--page-x) 0;height:4px;border-radius:2px;background:var(--surface2)}
.progress-fill{height:100%;border-radius:2px;background:var(--text);transition:width .4s cubic-bezier(.32,.72,0,1)}
.ob-content{flex:1;padding:var(--s-6) var(--page-x) 0}
.step-num{font-size:var(--t-xs);font-weight:700;color:var(--subtle);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.step-title{font-size:26px;font-weight:700;letter-spacing:-.04em;color:var(--text);margin-bottom:6px}
.step-sub{font-size:var(--t-md);color:var(--muted);line-height:1.55;margin-bottom:24px}
.ob-footer{padding:var(--s-5) var(--page-x) 0;display:flex;gap:10px}
.btn-back{flex:0 0 48px;padding:14px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);font-size:20px;cursor:pointer;display:grid;place-items:center}
.btn-next{flex:1;padding:14px;border-radius:var(--r-sm);background:var(--text);color:white;border:none;font-family:inherit;font-size:var(--t-lg);font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-next:disabled{opacity:.4;cursor:not-allowed}
.success-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:40px 24px;text-align:center}
.confetti-area{font-size:48px;margin-bottom:20px}
.success-title{font-size:var(--t-num);font-weight:700;letter-spacing:-.04em;color:var(--text);margin-bottom:10px}
.success-sub{font-size:var(--t-lg);color:var(--muted);line-height:1.6;margin-bottom:32px}
.btn-go-dashboard{padding:14px 28px;border-radius:var(--r-sm);background:var(--text);color:white;border:none;font-family:inherit;font-size:var(--t-lg);font-weight:600;cursor:pointer}
/* Der Wizard ist breiter als die Login-Karte */
#shell.auth-mode.wide #content-area{max-width:560px}
#shell.auth-mode.wide .page{padding:0}

/* ─── TOAST ─── */
.toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; pointer-events: none; }
.toast { background: var(--text); color: white; font-size:var(--t-sm); font-weight: 500; padding: 10px 18px; border-radius:var(--r-full); animation: toastIn .25s ease-out; white-space: nowrap; }
@keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* ─── UTILS ─── */
.skeleton { background: linear-gradient(90deg, var(--surface2) 25%, #e8e6e2 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius:var(--r-xs); }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to{transform:rotate(360deg)} }
.hidden { display: none !important; }
/* ── Media Kit: Chips, optionale Felder, Miniatur ── */
.sheet-optional{font-size:var(--t-2xs);font-weight:var(--fw-md);color:var(--subtle);
  text-transform:none;letter-spacing:0;margin-left:5px}
/* Vorschlaege zum Antippen. Wer "Nutzungsrechte" zum ersten Mal liest, hat
   keine Antwort parat -- drei uebliche Antworten schon. */
.mk-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mk-chip{padding:7px 12px;border-radius:var(--r-full);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--muted);font-family:inherit;font-size:var(--t-xs);
  font-weight:var(--fw-sb);cursor:pointer;min-height:32px}
.mk-chip:hover{border-color:var(--text);color:var(--text)}
/* Gezeichnete Miniatur des Kits. Kein Foto: das alte Vorschaubild lag nicht
   mehr im Speicher und versteckte sich stillschweigend. */
.mk-mini{margin:0 auto;width:196px;background:#FAFAF9;border:1px solid var(--border-strong);
  border-radius:12px;padding:12px 11px;box-shadow:0 4px 16px rgba(0,0,0,.07);overflow:hidden}
.mk-mini-kopf{text-align:center;padding-bottom:10px;border-bottom:1px solid var(--border)}
.mk-mini-avatar{width:34px;height:34px;border-radius:50%;background:var(--text);color:#fff;
  display:grid;place-items:center;margin:0 auto 6px;font-size:14px;font-weight:var(--fw-b)}
.mk-mini-name{font-size:11px;font-weight:var(--fw-b);letter-spacing:-.02em;color:var(--text)}
.mk-mini-tag{width:44px;height:7px;border-radius:99px;background:var(--surface2);margin:6px auto 0}
.mk-mini-abschnitt{padding-top:9px}
.mk-mini-lbl{width:52px;height:5px;border-radius:99px;background:var(--border-strong);margin-bottom:6px}
.mk-mini-lbl.kurz{width:38px}
.mk-mini-karte{background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px}
.mk-mini-drei{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mk-mini-drei span{height:18px;border-radius:4px;background:var(--surface2)}
.mk-mini-posts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mk-mini-posts span{aspect-ratio:4/5;border-radius:5px;background:linear-gradient(135deg,#ddd9d4,#c9c4bd)}
.mk-mini-zeile{height:6px;border-radius:99px;background:var(--surface2)}
.mk-mini-zeile+.mk-mini-zeile{margin-top:5px;width:70%}
.mk-mini-knopf{height:15px;border-radius:5px;background:var(--text);margin-top:11px}

/* ── Media Kit: Alters- und Preisfelder ── */
.mk-alter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk-alter-lbl{padding:11px 0 11px 14px;font-size:var(--t-sm);color:var(--muted);white-space:nowrap}
.mk-preis-zeile{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.mk-preis-zeile:last-child{border-bottom:0}
.mk-preis-name{flex:1;min-width:0;font-size:var(--t-sm);font-weight:var(--fw-sb)}
.mk-preis-felder{display:flex;gap:6px;flex-shrink:0}
.mk-preis-felder .sheet-input-wrap{width:92px}

/* ═══ VIEW: BRAND READY ═══════════════════════════════════════════
   Handlungsliste zuerst, Gewinn statt Verlust. Der Punktestand ist ein
   kleiner Ring, nicht die halbe Seite -- was zaehlt, ist die Liste
   darunter: was bringt wie viele Punkte. Erfuelltes und Unbewertbares
   ruhen eingeklappt am Ende.
   Begruendungen stecken hinter dem ⓘ. Vorher stand unter jeder Zeile ein
   Absatz, und sechzehn Absaetze sind keine Anleitung, sondern eine Wand. */
.br-head{display:flex;align-items:flex-start;gap:12px;padding:var(--s-5) var(--page-x) 0}
.br-head-txt{flex:1;min-width:0}
.br-teilen-btn{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;min-height:36px;padding:0 13px;border-radius:var(--r-sm);background:var(--surface);color:var(--text);border:1px solid var(--border-strong);font-family:inherit;font-size:var(--t-sm);font-weight:var(--fw-sb);cursor:pointer;margin-top:2px}
.br-teilen-btn:hover{border-color:var(--text)}
.br-kopf{display:flex;align-items:center;gap:16px;margin:var(--s-4) var(--page-x) 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);padding:18px}
.br-ring{width:76px;height:76px;flex-shrink:0;position:relative;display:grid;place-items:center}
.br-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.br-ring b{font-size:var(--t-num-sm);font-weight:var(--fw-b);font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.br-kopf-txt{flex:1;min-width:0}
.br-kopf-titel{font-size:var(--t-md);font-weight:var(--fw-sb);letter-spacing:-.015em}
.br-kopf-sub{font-size:var(--t-xs);color:var(--muted);line-height:1.5;margin-top:3px}
.br-saetze{margin:var(--s-3) var(--page-x) 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.br-satz{padding:13px 16px;font-size:var(--t-sm);line-height:var(--lh-body);color:var(--muted)}
.br-satz+.br-satz{border-top:1px solid var(--border)}
/* Der erste Satz ordnet den Stand ein und traegt die Zahl -- er steht
   deshalb in Textfarbe, die zwei Belege darunter ruhiger. */
.br-satz.haupt{color:var(--text);font-weight:var(--fw-md)}
.br-satz b{font-weight:var(--fw-sb);color:var(--text)}
.br-tabs{display:flex;gap:6px;margin:var(--s-3) var(--page-x) 0}
.br-tab{flex:1;min-height:38px;padding:9px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:var(--t-sm);font-weight:var(--fw-sb);cursor:pointer}
.br-tab.aktiv{background:var(--text);color:#fff;border-color:var(--text)}
/* ⓘ — ein Klick, ein Absatz, sonst Ruhe */
.br-i{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--border-strong);background:none;color:var(--muted);font-size:11px;font-weight:var(--fw-b);font-family:Georgia,'Times New Roman',serif;cursor:pointer;display:inline-grid;place-items:center;flex-shrink:0;line-height:1;padding:0}
.br-i:hover{border-color:var(--text);color:var(--text)}
.br-i.an{background:var(--text);border-color:var(--text);color:#fff}
.br-i-txt{display:none;font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin-top:9px;padding:10px 12px;background:var(--surface2);border-radius:var(--r-sm)}
.br-i-txt.auf{display:block}
/* Ja/Nein — gefuellt, sobald geantwortet wurde. Getoente Flaechen waren
   auf dem hellen Grund nicht als Antwort erkennbar. */
.br-wahl{display:flex;gap:5px;flex-shrink:0}
.br-wahl button{min-width:52px;min-height:36px;padding:0 12px;border-radius:var(--r-sm);border:1.5px solid var(--border-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:var(--t-sm);font-weight:var(--fw-sb);cursor:pointer;transition:all .12s}
.br-wahl button:hover{border-color:var(--text);color:var(--text)}
.br-wahl button.ja-an{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 1px 3px rgba(26,127,75,.3)}
.br-wahl button.nein-an{background:var(--text);border-color:var(--text);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.br-zahl{width:70px;min-height:36px;padding:0 10px;border-radius:var(--r-sm);border:1.5px solid var(--border-strong);background:var(--surface);font-family:inherit;font-size:var(--t-input);text-align:center;flex-shrink:0;color:var(--text)}
/* Handlungsliste */
.br-tat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-card);overflow:hidden}
.br-tat-zeile{display:flex;align-items:flex-start;gap:11px;padding:13px 16px;border-bottom:1px solid var(--border)}
.br-tat-zeile:last-child{border-bottom:0}
.br-gewinn{font-size:var(--t-xs);font-weight:var(--fw-b);color:var(--akzent-text);background:var(--akzent-bg);border:1px solid var(--akzent-border);border-radius:var(--r-xs);padding:4px 8px;white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0;margin-top:1px}
.br-tat-k{flex:1;min-width:0}
.br-tat-name{font-size:var(--t-sm);font-weight:var(--fw-sb);display:flex;align-items:center;gap:8px}
.br-tat-name span{flex:1;min-width:0}
.br-tat-satz{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin-top:3px}
.br-tat-tun{margin-top:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.br-tat-hint{font-size:var(--t-xs);color:var(--subtle)}
.br-knopf{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 13px;border-radius:var(--r-sm);background:var(--text);color:#fff;border:1px solid var(--text);font-family:inherit;font-size:var(--t-sm);font-weight:var(--fw-sb);text-decoration:none;cursor:pointer}
.br-knopf.leise{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
/* Eingeklapptes */
.br-falt{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.br-falt+.br-falt{margin-top:var(--s-2)}
.br-falt-kopf{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;background:none;border:0;width:100%;font-family:inherit;text-align:left;min-height:48px}
.br-falt-kopf>span{flex:1;font-size:var(--t-sm);font-weight:var(--fw-sb);color:var(--text)}
.br-falt-kopf>em{font-style:normal;font-size:var(--t-xs);color:var(--muted)}
.br-falt-liste{display:none;border-top:1px solid var(--border)}
.br-falt-liste.auf{display:block}
.br-sym{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;margin-top:1px;font-size:11px;font-weight:var(--fw-b);line-height:1}
.br-sym.erfuellt{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-border)}
.br-sym.teilweise{background:var(--orange-bg);color:var(--orange);border:1.5px solid rgba(184,92,0,.25)}
.br-sym.offen{background:var(--red-bg);color:var(--red);border:1.5px solid rgba(192,57,43,.2)}
.br-sym.nicht_bewertbar,.br-sym.hinweis{background:var(--surface2);color:var(--subtle);border:1.5px solid var(--border-strong)}
.br-zeile{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--border)}
.br-zeile:last-child{border-bottom:0}
.br-zeile-k{flex:1;min-width:0}
.br-zeile-kopf{display:flex;align-items:center;gap:8px}
.br-zeile-name{font-size:var(--t-sm);font-weight:var(--fw-sb);flex:1;min-width:0}
.br-zeile-p{font-size:var(--t-sm);font-weight:var(--fw-sb);font-variant-numeric:tabular-nums;white-space:nowrap}
.br-zeile-p.grau{color:var(--subtle);font-weight:var(--fw-md)}
.br-zeile-satz{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin-top:3px}
.br-badge{display:inline-block;margin-top:6px;padding:2px 7px;border-radius:var(--r-full);font-size:var(--t-2xs);font-weight:var(--fw-sb);letter-spacing:.03em}
.br-badge.viuno{background:var(--blue-bg);color:var(--blue)}
.br-badge.eigene_angabe,.br-badge.gemessen{background:var(--surface2);color:var(--muted)}
/* Teilen */
.br-teilen{margin:var(--s-5) var(--page-x) 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:15px 16px}
.br-teilen h2{font-size:var(--t-lg);font-weight:var(--fw-sb);letter-spacing:-.02em;margin:0}
.br-teilen p{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin:6px 0 0}
.br-link-feld{display:flex;gap:8px;margin-top:12px}
.br-link-feld input{flex:1;min-width:0;min-height:36px;padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface2);font-family:inherit;font-size:var(--t-sm);color:var(--text)}
.br-link-meta{font-size:var(--t-xs);color:var(--muted);margin-top:8px;line-height:var(--lh-body)}
.br-link-meta a{color:var(--text);font-weight:var(--fw-sb)}
.br-fuss{padding:var(--s-5) var(--page-x) 0;font-size:var(--t-xs);color:var(--subtle);line-height:var(--lh-body)}
.br-sperr{margin:var(--s-4) var(--page-x) 0;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.br-sperr-titel{font-size:var(--t-lg);font-weight:var(--fw-sb);letter-spacing:-.02em}
.br-sperr-sub{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin-top:6px}
</style>
</head>
<body>

<!-- BOOT (bis die Session geprüft ist) -->
<div id="boot"><div class="boot-spinner"></div></div>

<!-- SHELL -->
<div id="shell">

  <div class="main">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="topbar-title">Dashboard</span>
      </div>
      <a class="topbar-avatar" id="user-avatar" href="#/profile" aria-label="Profil">?</a>
    </div>

    <!-- UNTERNAVIGATION — vom Router gefuellt, sonst leer und unsichtbar -->
    <div id="subnav"></div>

    <!-- PAGE -->
    <div class="page">
      <div id="content-area"></div>
    </div>

    <!-- Kein Fuss mehr unter jeder Ansicht: Impressum, Datenschutz, AGB und

}

/* aus /dashboard/ und /analytic/ (dort identisch) */
function fmt(n, digits = 1) {
  if (n == null || n === '' || isNaN(Number(n))) return '–'
  n = Number(n)
  if (n >= 1_000_000) return (n/1_000_000).toFixed(digits).replace(/\.0$/,'') + 'M'
  if (n >= 1_000)     return (n/1_000).toFixed(digits).replace(/\.0$/,'') + 'k'
  return n.toFixed(0)
}

/* aus /profile/: eigene fmt-Variante — Fallback '0' statt '–' und
   unter 1000 lokalisiert statt gerundet. Bewusst getrennt gehalten,
   damit die Profil-Zahlen exakt wie vorher aussehen. */
function fmtCount(n) {
  if (n == null || isNaN(Number(n))) return '0'
  n = Number(n)
  if (n >= 1_000_000) return (n/1_000_000).toFixed(1).replace(/\.0$/,'') + 'M'
  if (n >= 1_000)     return (n/1_000).toFixed(1).replace(/\.0$/,'') + 'k'
  return n.toLocaleString('de-DE')
}

/* aus /biolink/: Fallback '–', unter 1000 unveraendert als String */
function fmtNum(n){if(n==null||isNaN(+n))return'–';n=+n;if(n>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace(/\.0$/,'')+'k';return n.toString()}

/* aus /dashboard/ */
function fmtEuro(n) {
  if (n == null || isNaN(+n)) return '–'
  return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(+n)
}
/* aus /dashboard/: fmtDate — nur Tag und Monat */
function fmtDateShort(d) {
  if (!d) return ''
  return new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
}

/* ─────────────────────────────────────────────
   View-Lifecycle
   Jede View bekommt ein ctx: ctx.stale sagt, ob inzwischen
   weitergeklickt wurde (späte Query-Antworten dürfen dann nicht
   mehr ins DOM schreiben), ctx.onCleanup registriert Listener,
   Intervalle und Subscriptions, die beim Verlassen abgeräumt werden.
   ───────────────────────────────────────────── */
let viewToken = 0
let viewCleanups = []

function runCleanups() {
  const fns = viewCleanups
  viewCleanups = []
  for (const fn of fns) { try { fn() } catch (e) { console.warn('cleanup failed', e) } }
}

function makeCtx() {
  const token = ++viewToken
  return {
    get stale() { return token !== viewToken },
    onCleanup(fn) { if (token === viewToken) viewCleanups.push(fn) },
    /* Listener, der sich beim Verlassen der View selbst abmeldet */
    on(target, type, handler, opts) {
      target.addEventListener(type, handler, opts)
      this.onCleanup(() => target.removeEventListener(type, handler, opts))
    },
    /* Intervall, das beim Verlassen der View gestoppt wird */
    interval(fn, ms) {
      const id = setInterval(fn, ms)
      this.onCleanup(() => clearInterval(id))
      return id
    }
  }
}

function currentRoute() {
  const raw = (location.hash || '').replace(/^#\/?/, '').split('?')[0].split('/')[0].trim().toLowerCase()
  return ROUTES[raw] ? raw : null
}

/* ─────────────────────────────────────────────
   ROUTER + Session-Guard
   Regeln (aus /dashboard/ übernommen):
     - keine Session            → #/login
     - Session + onboarding_completed === false → #/onboarding
     - Session + Default        → #/dashboard
   ───────────────────────────────────────────── */
async function router() {
  let name = currentRoute()

  // Ohne Session: nur öffentliche Routen
  if (!state.session) {
    if (!name || !ROUTES[name].public) { navigate('#/login'); return }
  } else {
    // Mit Session: Login/Register überspringen
    if (!name || ROUTES[name].public) { navigate('#/' + DEFAULT_ROUTE); return }
    // Profil unvollständig → Onboarding erzwingen
    if (needsOnboarding() && name !== 'onboarding') { navigate('#/onboarding'); return }
  }

  state.route = name
  const route = ROUTES[name]
  const chromeless = route.public || route.chromeless

  document.getElementById('shell').classList.toggle('auth-mode', !!chromeless)
  document.getElementById('shell').classList.toggle('wide', !!route.chromeless)
  document.getElementById('topbar-title').textContent = route.title
  document.title = 'viuno · ' + route.title
  setActiveMenuItem(name)
  closeSidebar()
  closeModal()

  runCleanups()
  const ctx = makeCtx()

  const area = document.getElementById('content-area')
  area.innerHTML = ''
  window.scrollTo(0, 0)
  await route.render(area, ctx)
}

    el.classList.toggle('active', el.dataset.tab === tab)
  })

  /* Die Unternavigation baut der Router, nicht die View: sonst muesste
     jede der vier Views dieselbe Leiste selbst erzeugen und beim naechsten
     Umbau wuerden drei davon vergessen. */
  const sub = document.getElementById('subnav')
  if (!sub) return
  const eintraege = SUBNAVS[tab]
  sub.innerHTML = !eintraege ? '' : eintraege.map(e =>
    `<a class="subnav-btn${e.route === name ? ' aktiv' : ''}" href="#/${e.route}">${escHtml(e.label)}</a>`
  ).join('')
}

/* Wie in /dashboard/: nur ein explizites false erzwingt Onboarding. */
function needsOnboarding() {
  return state.profile ? state.profile.onboarding_completed === false : false
}

/* ─────────────────────────────────────────────
   Session laden
   ───────────────────────────────────────────── */
async function loadSession() {
  const { data: { session } } = await sb.auth.getSession()
  state.session = session || null
  state.profile = null
  /* Parallel, nicht nacheinander: die Signatur ist eine einzelne Zeile und
     soll den ersten Aufbau nicht um eine zweite Rundreise verzoegern. */
  if (session) await Promise.all([loadProfile(session.user.id), ladeSignatur(session.user.id)])
  paintUser()
  if (session) merkeAktiv(session.user.id)
}

/* users.last_active_at gibt es seit April und war bei jedem Konto leer --
   nichts hat die Spalte je geschrieben. "Wer benutzt die App ueberhaupt
   noch" liess sich damit nicht beantworten, und das ist die Frage, die bei
   Wachstum als erste kommt.

   Hoechstens einmal pro Stunde, sonst schreibt jeder Seitenwechsel. Der
   Zeitstempel im localStorage ist nur die Drossel: geht er verloren, wird
   einmal zu viel geschrieben, mehr nicht. Fehler werden verschluckt -- ein
   fehlgeschlagener Zeitstempel darf den Start der App nicht aufhalten. */
function merkeAktiv(uid) {
  try {
    const schluessel = 'viuno-aktiv-' + uid
    const zuletzt = +(localStorage.getItem(schluessel) || 0)
    if (Date.now() - zuletzt < 3600000) return
    localStorage.setItem(schluessel, String(Date.now()))
  } catch (_) { /* privater Modus: dann eben jedes Mal */ }
  sb.from('users').update({ last_active_at: new Date().toISOString() }).eq('id', uid).then(() => {}, () => {})
}

async function loadProfile(uid) {
  const { data } = await sb.from('users')
    .select('display_name, full_name, profile_image_url, onboarding_completed, subscription_type')
    .eq('id', uid).single()
  state.profile = data || null
}

/* Initiale als Grund, Bild darueber. decoding="async" haelt das Zeichnen
   der Seite nicht auf, wenn die Datei gross ist. */
function avatarInhalt(url, name){
  const initial = escHtml(String(name||'?').trim().charAt(0).toUpperCase() || '?')
  return initial + (url ? `<img src="${escHtml(url)}" alt="" decoding="async">` : '')
}

function paintUser() {
  const av  = document.getElementById('user-avatar')
  const tab = document.getElementById('tab-avatar')
  if (!state.session) { if (av) av.textContent = '?'; if (tab) tab.innerHTML = ''; return }
  const p = state.profile
  const name = p?.display_name || p?.full_name || state.session.user.email || '?'
  const bild = p?.profile_image_url
  if (av) { av.innerHTML = avatarInhalt(bild, name); av.title = name }
  /* Derselbe Avatar noch einmal unten in der Leiste: er ist dort das
     Symbol fuer "Profil" und zugleich der Beleg, welches Foto oeffentlich
     steht — die Frage, die auf dieser Seite am haeufigsten gestellt wird. */
  if (tab) tab.innerHTML = avatarInhalt(bild, name)
}

/* ─────────────────────────────────────────────
   Signaturfarbe
   Die App traegt das Design, das der Creator fuer seine BioLink-Seite
   gewaehlt hat. Faellt die Abfrage aus, bleibt "color" stehen — die App
   ist dann nicht falsch gefaerbt, sondern im Standard.
   ───────────────────────────────────────────── */
async function ladeSignatur(uid) {
  try {
    const { data } = await sb.from('biolink_viuno').select('theme').eq('user_id', uid).maybeSingle()
    const t = data?.theme
    if (t === 'dark' || t === 'clean') document.documentElement.setAttribute('data-thema', t)
    else document.documentElement.removeAttribute('data-thema')
  } catch (e) { /* Standard bleibt stehen */ }
}

  let selectedNiche = null
  let usernameValid = false

  })

  function onUsernameInput(){
    const val   = $('inp-username').value.trim()
    const hint  = $('username-hint')
    const input = $('inp-username')
    usernameValid = false
    clearTimeout(_unameTimer)

    if(!val){
      hint.textContent = 'Dein öffentlicher Name auf viuno.de'
      hint.className = 'field-hint'
      input.classList.remove('invalid')
      return
    }
    if(!/^[a-zA-Z0-9_]{3,30}$/.test(val)){

      hint.className = 'field-hint error'
      input.classList.add('invalid')

    // Format ok — check availability after 500ms

    input.classList.remove('invalid')

    _unameTimer = setTimeout(async () => {

      if(error||!data){

      }

        }

  }

      $('niche-hint').textContent = 'Bitte wähle eine Nische.'
      $('niche-hint').className = 'field-hint error'
      showError('Bitte wähle deine Nische aus.'); return
    }
    if(!legal){ showError('Bitte akzeptiere AGB und Datenschutzerklärung.'); return }

    const btn = $('btn-register')
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Account wird erstellt…'

    // Final availability check before submit (race condition safety)
    const { data: check } = await sb.rpc('is_username_available', { p_username: username })
    if (ctx.stale) return
    if(!check?.available){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      showError('Dieser Username ist nicht mehr verfügbar. Bitte wähle einen anderen.'); return
    }

    // Sign up
    const { data, error } = await sb.auth.signUp({
      email,
      password: pw,
      options:{
        data:{ display_name: username, niche_category: selectedNiche },
        emailRedirectTo:'https://viuno.de/onboarding'
      }
    })
    if (ctx.stale) return

    if(error){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      if(error.message.includes('already registered')||error.message.includes('already been registered')){
        showError('Diese E-Mail-Adresse ist bereits registriert. Bitte logge dich ein.')
      } else {
        showError(error.message)
      }
      return
    }

    // Update users table (trigger creates the row, we set display_name + niche)
    if(data.user){
      await sb.from('users').update({
        display_name: username,
        niche_category: selectedNiche,
        updated_at: new Date().toISOString()
      }).eq('id', data.user.id)
    }
    if (ctx.stale) return

    // Show success
    btn.disabled = false; btn.textContent = 'Account erstellen'
    $('form-card').style.display = 'none'
    $('login-link').style.display = 'none'
    $('success-email').textContent = email
    $('success-card').classList.add('show')
  }

  ctx.on($('btn-register'), 'click', doRegister)
  ctx.on($('inp-pw2'), 'keydown', e => { if(e.key==='Enter') doRegister() })

async function onObPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Bild zu groß. Max. 5 MB.');return}
  const statusEl=document.getElementById('upload-status')
  if(statusEl)statusEl.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{
    const img=document.querySelector('#ob-content img[style*="56px"]')
    if(img)img.src=ev.target.result
  }
  reader.readAsDataURL(file)
  if(!obv?.user)return
  const st=document.getElementById('upload-status')
  if(st)st.textContent='Wird hochgeladen…'
  const erg=await profilbildHochladen(file, obv.user.id, obv.data.photoUrl)
  if(!obv)return
  if(erg.fehler){showToast(erg.fehler,4000);if(st)st.textContent='Upload fehlgeschlagen';return}
  obv.data.photoUrl=erg.publicUrl
  if(st)st.textContent='✓ Eigenes Foto hochgeladen'
  // Update badge
  const badge=document.querySelector('#ob-content div[style*="bottom:-2px"]')
  if(badge){badge.style.background='var(--green)';badge.textContent='✓'}
  e.target.value=''
}

window.nextStep=async function(){
  if(!obv)return
  const collect=OB_STEPS[obv.step-1].collect
  if(!collect())return
  if(obv.step<obv.total){obv.step++;renderStep();return}
  await saveAndFinish()
}

async function saveAndFinish(){
  const btn=document.getElementById('btn-next')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const d=obv.data
  const{error}=await sb.from('users').update({
    instagram_handle:d.ig||null,
    tiktok_handle:d.tt||null,
    niche_category:d.niche,
    profile_image_url:d.photoUrl||null,

  }).eq('id',obv.user.id)

  btn.disabled=false;btn.textContent='Abschließen ✓'

  confetti()

  const uid = state.session.user.id

  /* Das Skeleton bildet das spätere Raster nach — Begrüßung, Kacheln,
     Liste —, damit beim Umschalten auf die echten Daten nichts springt. */

    <div id="skeleton-area">
      <div class="section" style="padding-top:var(--s-4)"><div class="skeleton" style="height:72px;border-radius:var(--r-md)"></div></div>

        <div class="skeleton" style="height:104px;border-radius:var(--r-md)"></div>
        <div class="skeleton" style="height:104px;border-radius:var(--r-md)"></div>
        <div class="skeleton" style="height:104px;border-radius:var(--r-md)"></div>
      </div></div>
      <div class="section"><div class="skeleton" style="height:132px;border-radius:var(--r-md)"></div></div>

    <div id="dashboard-content" class="hidden"></div>`

  /* users trägt die Aufruf-Zähler selbst (gepflegt aus biolink_aufrufe /
     mediakit_aufrufe) — dieselbe Quelle, aus der auch die BioLink- und
     die Media-Kit-View lesen. */

    sb.from('creator_analytics').select('platform,followers,followers_prev,followers_change,avg_likes,avg_views,avg_saves,engagement_rate,engagement_rate_prev,fetched_at').eq('user_id',uid).eq('platform','instagram').order('fetched_at',{ascending:false}).limit(10),
    /* Aus derselben View wie die News-Seite: nach relevance_score sortiert.
       Vorher stand hier cards.slice(0,2) auf dem rohen jsonb — der Teaser
       zeigte damit die beiden Karten, die das Modell zufaellig zuerst
       geschrieben hatte, nicht die beiden wichtigsten. */
    sb.from('digest_cards_today').select('slug,headline,source,platform,date').order('relevance_score',{ascending:false}).limit(3),
    sb.rpc('get_daily_text',{p_user_id:uid}),

  const newsRoh   = digestRes.data || []

  const hasAnalyse  = statsRows.length>0
  const bioActive   = p?.bio_active===true
  const mkActive    = p?.mediakit_active===true

  /* Der Tagessatz aus get_daily_text steht jetzt unter dem Namen statt in einer

  if(hasAnalyse)  setup.push({icon:'star',href:'#/brandready',title:'Brand-Ready-Check ansehen',sub:'Wie eine Marke deinen Kanal heute sieht'})

  document.getElementById('skeleton-area').classList.add('hidden')
  const content=document.getElementById('dashboard-content')
  content.classList.remove('hidden')
  content.innerHTML = `
    <div class="dash-kopf">
      <div class="dash-kopf-txt">
        <div class="dash-kopf-name">${escHtml(name)}</div>

    ${greetText?`<div class="dash-satz">${escHtml(greetText)}</div>`:''}

    ${hasAnalyse?`<div class="section" style="padding-top:0">
      <a class="dash-haupt" href="#/analytics">

          ${follDelta!=null
            ? `<span class="dash-chip ${follDelta>0?'hoch':follDelta<0?'runter':'neutral'}">${follDelta>=0?'+':'−'}${Math.abs(follDelta).toLocaleString('de-DE')}</span>`
            : ''}
        </div>
        <div class="dash-card-value" style="font-size:var(--t-num);margin-top:10px">${fmt(totalFollowers)}</div>
        <div class="dash-card-sub">${follDelta!=null?escHtml(seitWann):'Erste Messung'}${sparkPkt.length>=3?' · Verlauf '+escHtml(sparkPf):''}</div>

    ${setup.length?`<div class="section">
      <div class="section-header"><div class="section-title">Zu erledigen</div></div>
      <div class="dash-liste">
        ${setup.map(it=>`<a class="dash-zeile" href="${it.href}">

/* Verlaufslinie fuer die Hauptkarte.
   Unter drei Messungen wird nichts gezeichnet: zwei Punkte sind immer eine
   Gerade und behaupten einen Trend, den es nicht gibt. Die Flaeche ist
   bewusst nur eine Andeutung -- die Zahl ist die Aussage, die Linie der
   Zusatz. Skaliert wird auf min/max der Reihe, nicht auf Null, sonst
   verschwindet jede Bewegung bei fuenfstelligen Followerzahlen. */
function dashSparkline(werte){
  if(!Array.isArray(werte) || werte.length < 3) return ''
  const W=320, H=68, P=5
  const min=Math.min(...werte), max=Math.max(...werte)
  const spanne = (max-min) || 1
  const x = i => P + i*(W-2*P)/(werte.length-1)
  const y = v => P + (1-(v-min)/spanne)*(H-2*P)
  const punkte = werte.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`)
  const linie  = 'M'+punkte.join(' L')
  const flaeche= linie+` L${x(werte.length-1).toFixed(1)},${H} L${x(0).toFixed(1)},${H} Z`
  const letztX = x(werte.length-1).toFixed(1), letztY = y(werte[werte.length-1]).toFixed(1)
  return `<svg class="dash-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="dash-spark-linie" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="var(--v1)"/><stop offset=".55" stop-color="var(--v2)"/><stop offset="1" stop-color="var(--v3)"/>
      </linearGradient>
      <linearGradient id="dash-spark-flaeche" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--v2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--v2)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${flaeche}" fill="url(#dash-spark-flaeche)"/>
    <path d="${linie}" fill="none" stroke="url(#dash-spark-linie)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${letztX}" cy="${letztY}" r="3.4" fill="var(--v3)"/>
  </svg>`
}

// URL-Normalisierung: akzeptiert Nike.de, www.nike.de, https://Nike.de/ → gibt https://nike.de zurück
function normalizeBrandUrl(raw){
  if(!raw)return null
  let s=raw.trim()
  if(!s)return null
  s=s.replace(/^https?:\/\//i,'')
  s=s.replace(/\/+$/,'')
  s=s.replace(/^www\./i,'')
  const slashIdx=s.indexOf('/')
  if(slashIdx>=0){
    s=s.substring(0,slashIdx).toLowerCase()+s.substring(slashIdx)
  }else{
    s=s.toLowerCase()
  }
  if(!/^[a-z0-9-]+\.[a-z0-9.-]+/i.test(s))return null
  return 'https://'+s
}

function slugify(name){
  return String(name||'').toLowerCase().trim()
    .replace(/[äÄ]/g,'ae').replace(/[öÖ]/g,'oe').replace(/[üÜ]/g,'ue').replace(/[ß]/g,'ss')
    .replace(/[^a-z0-9\s_-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')
}

/* activeIdx zeigt auf den laufenden Schritt; alles davor ist erledigt.
   Der Schluss-Schritt steht am Ende der Liste und bekommt waehrend der
   Wartezeit den Fortschrittsbalken. */
function paintLoadingSteps(activeIdx,withBar){
  const el=document.getElementById('loading-steps')
  if(!el||!_loadingFlow)return
  const all=[..._loadingFlow.steps,_loadingFlow.tail]
  el.innerHTML=all.map((label,i)=>{
    const state=i<activeIdx?'done':i===activeIdx?'active':'wait'
    const bar=(withBar&&i===activeIdx)
      ? `<div class="loading-bar"><span style="animation-duration:${LOADING_HOLD_MS}ms"></span></div>`
      : ''
    return `<div class="flow-step">
      <div class="step-dot ${state}">${state==='done'?icon('check',11):state==='active'?'<span class="spinner" style="width:8px;height:8px;border-width:1.5px"></span>':''}</div>
      <div class="step-body"><div class="step-label ${state}">${escHtml(label)}</div>${bar}</div>
    </div>`
  }).join('')
}

function showLoadingOverlay(flowKey='biolinkCreate'){
  const flow=LOADING_FLOWS[flowKey]||LOADING_FLOWS.biolinkCreate
  _loadingFlow=flow
  document.getElementById('loading-title').textContent=flow.title
  document.getElementById('loading-sub').textContent=flow.sub
  paintLoadingSteps(0)
  document.getElementById('loading-overlay').classList.remove('hidden')
  document.body.style.overflow='hidden'

  let i=0
  const lastTimed=flow.steps.length-1
  const t=setInterval(()=>{
    i++
    // Nicht in den Schluss-Schritt laufen — der kommt erst nach der Antwort
    if(i>=lastTimed){ paintLoadingSteps(lastTimed); clearInterval(t); return }
    paintLoadingSteps(i)
  },LOADING_STEP_MS)
  _loadingTimer=t
  return t
}

/* Die Function ist durch: Schluss-Schritt aktivieren und die Bauzeit
   abwarten, bevor "fertig" behauptet wird. */
function finishLoadingOverlay(timer){
  if(timer)clearInterval(timer)
  _loadingTimer=null
  if(!_loadingFlow)return Promise.resolve()
  const tailIdx=_loadingFlow.steps.length
  paintLoadingSteps(tailIdx,true)
  const sub=document.getElementById('loading-sub')
  if(sub)sub.textContent=_loadingFlow.tailSub
  return new Promise(res=>{
    _loadingHold=setTimeout(()=>{
      _loadingHold=null
      paintLoadingSteps(tailIdx+1)
      setTimeout(()=>{ hideLoadingOverlay(); res() },600)
    },LOADING_HOLD_MS)
  })
}

function hideLoadingOverlay(timer){
  if(timer)clearInterval(timer)
  if(_loadingHold){clearTimeout(_loadingHold);_loadingHold=null}
  _loadingTimer=null
  document.getElementById('loading-overlay')?.classList.add('hidden')
  document.body.style.overflow=''
}
function stopLoadingOverlay(){ if(_loadingTimer){clearInterval(_loadingTimer);_loadingTimer=null} hideLoadingOverlay() }

async function loadBiolink(){
  const uid = blv.uid
  const[profileRes,biolinkRes,linksRes,viewsDailyRes,herkunftRes,stundenRes,klickRes,rateRes]=await Promise.all([
    sb.from('users').select('display_name,full_name,profile_image_url,bio,bio_active,instagram_handle,tiktok_handle,youtube_handle,threads_handle,impressum_text,contact_email,subscription_type,bio_views_total,bio_views_today,bio_views_last_7_days').eq('id',uid).single(),
    sb.from('biolink_viuno').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('biolink_custom_links').select('*').eq('user_id',uid).order('position',{ascending:true}),
    sb.rpc('get_biolink_views_last_7_days_daily',{p_user_id:uid}),
    /* Herkunft und Stunde liegen seit April in biolink_aufrufe, wurden
       aber nie angezeigt. Klicks kommen aus biolink_klicks. Alle drei
       Funktionen lesen ueber auth.uid(), nicht ueber einen Parameter. */
    sb.rpc('biolink_herkunft',{p_tage:30}),
    sb.rpc('biolink_stunden',{p_tage:30}),
    sb.rpc('biolink_klick_zahlen',{p_tage:30}),
    /* Eigene Funktion, weil die Rate beide Seiten des Bruchs ab demselben
       Moment zaehlen muss: Klicks gibt es erst seit der Neugenerierung,
       Aufrufe seit jeher. Sonst steht dort 30 Tage lang zu wenig. */
    sb.rpc('biolink_klickrate',{p_tage:30})
  ])
  if(!blv||blv.ctx.stale)return
  blv.profile=profileRes.data
  blv.biolink=biolinkRes.data
  blv.customLinks=linksRes.data||[]
  blv.viewsTotal=blv.profile?.bio_views_total||0
  blv.viewsToday=blv.profile?.bio_views_today||0
  blv.views7Days=blv.profile?.bio_views_last_7_days||0
  blv.viewsDaily=viewsDailyRes.data||[]
  blv.herkunft=herkunftRes.data||[]
  blv.stunden=stundenRes.data||[]
  blv.klicks=klickRes.data||[]
  blv.klickrate=rateRes.data?.[0]||null
  blv.theme=blv.biolink?.theme||'color'
  blv.lang=blv.biolink?.default_language||'de'
  paintBiolink()
}

function paintBiolink(){
  const p=blv.profile
  const isActive=p?.bio_active===true
  const slug=slugify(p?.display_name||'')
  const bioUrl=slug?`viuno.de/${slug}`:null
  const bioFullUrl=slug?`https://viuno.de/${slug}`:null

  // Checkliste
  const checks=[
    {label:'Profilbild hochgeladen',ok:!!(p?.profile_image_url)},
    {label:'Impressum hinterlegt',ok:!!(p?.impressum_text?.trim())},
    {label:'Mindestens 1 Social-Kanal',ok:!!(p?.instagram_handle||p?.tiktok_handle||p?.youtube_handle||p?.threads_handle)},
  ]
  const allOk=checks.every(c=>c.ok)

  const viewsToday=blv.viewsToday
  const views7=blv.views7Days
  const viewsTotal=blv.viewsTotal

  // 7-Tage Bar-Chart-HTML
  const maxVal=Math.max(...blv.viewsDaily.map(d=>d.view_count||0),1)
  const dayLbl=['So','Mo','Di','Mi','Do','Fr','Sa']
  const chartBars=blv.viewsDaily.map(d=>{
    const v=d.view_count||0
    const h=Math.max((v/maxVal)*100,v>0?8:2)
    const dayShort=dayLbl[new Date(d.view_date+'T00:00:00').getDay()]
    return `<div class="chart-col" title="${v} Aufrufe">
      <div class="chart-bar-wrap"><div class="chart-bar ${v>0?'has':''}" style="height:${h}%"></div></div>
      <div class="chart-day">${dayShort}</div>
      <div class="chart-val">${v}</div>
    </div>`
  }).join('')
  const chartHtml=viewsTotal>0?`<div class="chart-wrap"><div class="chart-row">${chartBars}</div></div>`
    :`<div class="chart-empty">Noch keine Aufrufe in den letzten 7 Tagen.</div>`

  /* ── Auswertungen, 30 Tage ──────────────────────────────────────────
     Herkunft und Stunde lagen seit April ungenutzt in der Tabelle.
     Klicks kommen aus biolink_klicks und beginnen erst mit der Seite,
     die den Zaehler enthaelt — deshalb der Hinweis im leeren Zustand. */
  const ARTLABEL={instagram:'Instagram',tiktok:'TikTok',youtube:'YouTube',threads:'Threads',kontakt:'Kontakt',custom:'Link'}
  const aufrufe30=blv.herkunft.reduce((a,h)=>a+Number(h.anzahl||0),0)
  const klicks30=blv.klicks.reduce((a,k)=>a+Number(k.anzahl||0),0)
  /* Kann ueber 100% liegen: ein Besucher klickt manchmal mehrere Links. */
  const rate=blv.klickrate
  const rateAufrufe=Number(rate?.aufrufe||0)
  const klickrate=rateAufrufe>0?Math.round(Number(rate.klicks||0)/rateAufrufe*100):0
  const rateSeit=rate?.seit?new Date(rate.seit).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):null

  /* Balkenlaenge relativ zum groessten Wert, Zahl rechts absolut.
     Der Prozentanteil steckt in der Balkenlaenge — ihn zusaetzlich
     auszuschreiben war eine dritte Zahl je Zeile ohne neue Aussage. */
  const zeilenHtml=(zeilen)=>{
    const max=Math.max(...zeilen.map(z=>z.wert),1)
    return zeilen.map(z=>`<div class="bl-zeile">
        <span class="bl-name" title="${escHtml(z.text)}">${escHtml(z.text)}</span>
        <div class="bl-spur"><div style="width:${Math.round(z.wert/max*100)}%"></div></div>
        <span class="bl-wert">${fmtNum(z.wert)}</span>
      </div>`).join('')
  }

  const herkunftHtml=aufrufe30>0
    ? zeilenHtml(blv.herkunft.slice(0,6).map(h=>({text:h.quelle,wert:Number(h.anzahl)})))
    : `<div class="bl-leer">Noch keine Aufrufe in den letzten 30 Tagen.</div>`

  const maxStd=Math.max(...blv.stunden.map(x=>Number(x.anzahl||0)),1)
  const uhrHtml=blv.stunden.length?`<div class="bl-uhr">${blv.stunden.map(x=>{
      const v=Number(x.anzahl||0)
      return `<div class="bl-uhr-col" title="${x.stunde} Uhr · ${v} Aufrufe">
        <div class="bl-uhr-bar ${v>0?'has':''}" style="height:${Math.max(v/maxStd*100,v>0?6:2)}%"></div>
      </div>`}).join('')}</div>

/* Name, Bio und Profilbild stehen seit dem Template-Umbau fest im HTML der
   oeffentlichen Seite (fuer Link-Vorschauen in WhatsApp, LinkedIn & Co.).
   Aendert sich eines davon, muss die Seite neu erzeugt werden — im
   Hintergrund, ohne das Vollbild-Overlay von generatePage(). bio_active wird
   frisch gelesen: die Function wuerde eine Seite sonst neu anlegen und
   veroeffentlichen, die der User nie erstellt hat. */
/* Neubau der erzeugten BioLink-Seite.
   Noetig ist er nur fuer die eingebackenen Kopf-Tags (title, description,
   canonical, og:*) — also bei bio, profile_image_url, display_name und Theme.
   Name, Bio, Kanaele und Kontaktadresse liest die Seite zur Laufzeit aus
   biopage_v2; dafuer braucht es keinen Commit.
   Gibt das Ergebnis zurueck, damit das Profil einen sichtbaren Zustand zeigen
   kann statt eines leicht zu uebersehenden Toasts. `leise` unterdrueckt den
   Toast fuer Aufrufer, die selbst berichten. */
async function regenerateBioPageQuietly(uid, opt={}){
  try{
    const{data}=await sb.from('users').select('bio_active').eq('id',uid).single()
    if(data?.bio_active!==true)return {uebersprungen:true}
    const{data:{session}}=await sb.auth.getSession()
    if(!session)return {uebersprungen:true}
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json().catch(()=>({}))
    if(!res.ok||body.success!==true)throw new Error(body.error||`HTTP ${res.status}`)
    /* generate-biolink vergleicht die Bytes und committet nur bei echter
       Aenderung — 'unchanged' heisst: nichts zu melden. */
    return {ok:true, unveraendert: body.commit==='unchanged'}
  }catch(err){
    if(!opt.leise) showToast('Öffentliche Seite nicht aktualisiert: '+err.message,5000)
    return {ok:false, fehler:err.message}
  }
}

window.generatePage=async function(flow='biolinkCreate'){
  const btn=document.getElementById('btn-generate')
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Wird generiert…'}
  const loadingTimer=showLoadingOverlay(flow)
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||`HTTP ${res.status}`)
    await finishLoadingOverlay(loadingTimer)
    showToast('BioLink veröffentlicht ✓')
    if(blv&&!blv.ctx.stale)await loadBiolink()
  }catch(err){
    hideLoadingOverlay(loadingTimer)
    showToast('Fehler: '+err.message,5000)
    const b=document.getElementById('btn-generate')
    if(b){b.disabled=false;b.textContent=blv?.profile?.bio_active?'Seite neu generieren':'BioLink-Seite erstellen'}
  }
}

window.confirmDelete=async function(){
  closeModal('delete-modal')
  const loadingTimer=showLoadingOverlay('biolinkDelete')
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink?action=delete`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })

    if(blv&&!blv.ctx.stale)await loadBiolink()
  }catch(err){hideLoadingOverlay(loadingTimer);showToast('Fehler: '+err.message,4000)}
}

async function onBioPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Max. 5 MB');return}
  const status=document.getElementById('photo-status')
  if(status)status.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{const bw=document.getElementById('profile-photo-wrap');if(bw)bw.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
  reader.readAsDataURL(file)
  const uid=blv?blv.uid:state.session.user.id
  const erg=await profilbildHochladen(file, uid, blv?.profile?.profile_image_url)
  if(erg.fehler){showToast(erg.fehler,4000);const sf=document.getElementById('photo-status');if(sf)sf.textContent='Fehler';return}
  const publicUrl=erg.publicUrl
  if(blv?.profile)blv.profile.profile_image_url=publicUrl
  const st=document.getElementById('photo-status')
  if(st)st.textContent='✓ Foto hochgeladen'
  showToast('Profilbild gespeichert ✓')
  e.target.value=''
  regenerateBioPageQuietly(uid)
}

   eine gleichnamige Funktion. Sie stand spaeter in der Datei und hat diese hier
   ueberschrieben -- der Speichern-Knopf im Kanaele-Sheet rief dann die
   Analyse-Fassung auf, fand deren Felder nicht, sah blv statt anv und kehrte

window.saveBioHandles=async function(){

  const urlRaw=document.getElementById('link-url').value.trim()
  const isPaid=document.getElementById('link-paid').checked
  const hint=document.getElementById('link-hint')

  const normalUrl=normalizeBrandUrl(urlRaw)
  if(!normalUrl){hint.textContent='Ungültige URL. Beispiel: nike.de';return}

  const position=blv.customLinks.length
  const{data,error}=await sb.from('biolink_custom_links').insert({

  closeSheet('add-link-sheet')

}

window.deleteLink=async function(id){
  if(!blv)return
  await sb.from('biolink_custom_links').delete().eq('id',id).eq('user_id',blv.uid)
  if(!blv)return
  blv.customLinks=blv.customLinks.filter(l=>l.id!==id)
  renderLinksSheet()
  showToast('Link gelöscht')
}

  backToEditMenu('links-sheet')
  showToast('Links gespeichert ✓')
  paintBiolink()
}

async function loadMediakit(){
  const uid = mkv.uid
  const[profileRes,mkRes,brandsRes,offersRes,analyseRes,viewsDailyRes,preiseRes,beitraegeRes]=await Promise.all([
    sb.from('users').select('display_name,full_name,profile_image_url,bio,instagram_handle,tiktok_handle,youtube_handle,threads_handle,impressum_text,mediakit_active,subscription_type,niche_category,city,contact_email,mediakit_views_total,mediakit_views_today,mediakit_views_last_7_days').eq('id',uid).single(),
    sb.from('mediakit_viuno').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('mediakit_brands').select('*').eq('user_id',uid).order('position',{ascending:true}),
    sb.from('mediakit_content_offers').select('offer_type').eq('user_id',uid),
    sb.from('analyse_stats').select('platform,engagement_rate,followers,avg_likes,avg_views,avg_comments,avg_shares,created_at').eq('user_id',uid).order('created_at',{ascending:true}),
    sb.rpc('get_mediakit_views_last_7_days_daily',{p_user_id:uid}),
    sb.from('mediakit_preise').select('*').eq('user_id',uid),
    sb.from('mediakit_beitraege').select('*').eq('user_id',uid).order('position',{ascending:true})
  ])
  if(!mkv||mkv.ctx.stale)return
  mkv.profile=profileRes.data||{}
  mkv.mkData=mkRes.data||{}
  mkv.brands=brandsRes.data||[]
  mkv.offers=new Set((offersRes.data||[]).map(r=>r.offer_type))
  mkv.preise={}
  for(const r of(preiseRes.data||[])) mkv.preise[r.offer_type]=r
  mkv.beitraege=beitraegeRes.data||[]
  mkv.analyseStats={}
  for(const row of(analyseRes.data||[])) mkv.analyseStats[row.platform]=row
  mkv.viewsTotal=mkv.profile.mediakit_views_total||0
  mkv.viewsToday=mkv.profile.mediakit_views_today||0
  mkv.views7Days=mkv.profile.mediakit_views_last_7_days||0
  mkv.viewsDaily=viewsDailyRes.data||[]
  mkv.isActive=mkv.profile.mediakit_active===true
  /* Im Hintergrund: Vorschaubilder der staerksten Beitraege sichern, solange
     die Plattform-Links noch leben. Blockiert das Zeichnen nicht. */
  mkBilderSichern()
  mkv.slug=mkv.profile.display_name?slugify(mkv.profile.display_name):null
  mkv.defaultLang=mkv.mkData?.default_language||'de'
  paintMediakit()
}

// ── Analyse-Drift-Check: neue Analyse vorhanden & weicht stark von Media Kit ab? ──
function getAnalysisDrift(){
  if(!mkv.isActive)return null
  const mk=mkv.mkData||{}
  const mkUpdated=mk.updated_at?new Date(mk.updated_at).getTime():0
  const flags=[]
  const ig=mkv.analyseStats.instagram
  if(ig&&ig.created_at&&new Date(ig.created_at).getTime()>mkUpdated&&ig.followers!=null&&mk.followers_instagram!=null&&mk.followers_instagram>0){
    if(Math.abs(ig.followers-mk.followers_instagram)/mk.followers_instagram>0.2)flags.push('Instagram')
  }
  const tt=mkv.analyseStats.tiktok
  if(tt&&tt.created_at&&new Date(tt.created_at).getTime()>mkUpdated&&tt.followers!=null&&mk.followers_tiktok!=null&&mk.followers_tiktok>0){
    if(Math.abs(tt.followers-mk.followers_tiktok)/mk.followers_tiktok>0.2)flags.push('TikTok')
  }
  return flags.length?flags.join(' & '):null
}

function paintMediakit(){
  const p=mkv.profile,mk=mkv.mkData||{}
  const isActive=mkv.isActive&&!!mkv.slug
  const kitUrl=mkv.slug?`viuno.de/kit/${mkv.slug}`:null
  const kitFullUrl=mkv.slug?`https://viuno.de/kit/${mkv.slug}`:null

  const viewsToday=mkv.viewsToday
  const views7=mkv.views7Days
  const viewsTotal=mkv.viewsTotal

  // 7-Tage-Chart-HTML
  const maxVal=Math.max(...mkv.viewsDaily.map(d=>d.view_count||0),1)
  const dayLbl=['So','Mo','Di','Mi','Do','Fr','Sa']
  const chartBars=mkv.viewsDaily.map(d=>{
    const v=d.view_count||0
    const h=Math.max((v/maxVal)*100,v>0?8:2)
    const dayShort=dayLbl[new Date(d.view_date+'T00:00:00').getDay()]
    return `<div class="chart-col" title="${v} Aufrufe">
      <div class="chart-bar-wrap"><div class="chart-bar ${v>0?'has':''}" style="height:${h}%"></div></div>
      <div class="chart-day">${dayShort}</div>
      <div class="chart-val">${v}</div>
    </div>`
  }).join('')
  const chartHtml=viewsTotal>0?`<div class="chart-wrap"><div class="chart-row">${chartBars}</div></div>`
    :`<div class="chart-empty">Noch keine Aufrufe in den letzten 7 Tagen.</div>`

  const checks=getChecks()
  const allChecksOk=checks.every(c=>c.ok)

  const statusHtml=isActive
    ?`<div class="status-banner active"><div class="status-dot active"></div>
        <div class="status-text">Media Kit ist live<span>Deine Seite ist öffentlich erreichbar</span></div></div>
       <div class="link-bar">
         <a class="link-url" href="${kitFullUrl}" target="_blank" rel="noopener">${kitUrl} ${icon('arrowUpRight',13)}</a>
         <button class="link-action-btn" onclick="copyLink('${kitFullUrl}')">Kopieren</button>

         <div class="bl-karte">
           <div class="bl-teil">

             <div class="bl-drei">
               <div><b>${fmtNum(viewsToday)}</b><span>Heute</span></div>
               <div><b>${fmtNum(views7)}</b><span>7 Tage</span></div>
               <div><b>${fmtNum(viewsTotal)}</b><span>Gesamt</span></div>
             </div>
             ${viewsTotal>0?`<div class="chart-row" style="margin-top:12px">${chartBars}</div>`
               :`<div class="bl-leer" style="margin-top:10px">Noch keine Aufrufe in den letzten 7 Tagen.</div>`}
           </div>
         </div>
       </div>`
    :`<div class="status-banner inactive"><div class="status-dot inactive"></div>
        <div class="status-text">Noch nicht aktiv<span>Trage deine Daten ein und erstelle dein Media Kit</span></div></div>`

  const drift=getAnalysisDrift()
  const driftHtml=drift?`<div class="link-bar" style="border-color:rgba(184,92,0,.3);background:#fdf3e7;cursor:pointer" onclick="openStatsSheet()">
     <span style="flex:1;font-size:13px;font-weight:600;color:#b85c00">${icon('zap',14)} Neue Analyse verfügbar (${escHtml(drift)}) — Zahlen aktualisieren?</span>
   </div>`:''

  /* Miniatur statt Foto. Das frueher hier verlinkte Bild existiert im Speicher
     nicht mehr (400) und versteckte sich per onerror stillschweigend -- der
     Leerzustand hatte damit gar keine Vorschau. Gezeichnet statt fotografiert
     heisst ausserdem: sie kann nicht veralten, wenn sich das Kit aendert. */
  const previewHtml=!isActive?`<div class="preview-wrap">
    <div class="preview-title">So sieht dein Media Kit aus</div>
    <div class="preview-sub">Eine Seite mit deinen Zahlen, Leistungen und Konditionen — der Link, den du Marken schickst.</div>
    <div class="mk-mini">
      <div class="mk-mini-kopf">
        <div class="mk-mini-avatar">${escHtml((mkv.profile?.display_name||'?')[0].toUpperCase())}</div>

      <div class="mk-mini-abschnitt">
        <div class="mk-mini-lbl"></div>
        <div class="mk-mini-karte"><div class="mk-mini-drei"><span></span><span></span><span></span></div></div>
      </div>
      <div class="mk-mini-abschnitt">
        <div class="mk-mini-lbl kurz"></div>

      </div>
      <div class="mk-mini-abschnitt">
        <div class="mk-mini-lbl kurz"></div>
        <div class="mk-mini-karte"><div class="mk-mini-zeile"></div><div class="mk-mini-zeile"></div></div>
      </div>
      <div class="mk-mini-knopf"></div>
    </div>
  </div>`:''

  const checklistHtml=!isActive?`<div class="section">
    <div class="check-card">

      </div>`).join('')}

  </div>`:''

  const editAndCreateHtml=!isActive?`<div class="action-stack">

  </div>`
  :`<div class="action-stack">
    <button class="action-btn action-btn-primary" onclick="openEditMenu()">${icon('pencil',16)} Bearbeiten</button>
  </div>`

  /* Wie im BioLink: eine unscheinbare Zeile, kein roter Block. Loeschen ist
     nichts, das man oft tut -- es muss auffindbar sein, nicht auffaellig. */
  const deleteHtml=isActive
    ?`<div class="loesch-zeile">
        <button class="loesch-link" onclick="document.getElementById('delete-modal').classList.remove('hidden')">Media Kit löschen</button>
      </div>`
    :''

  document.getElementById('page-content').innerHTML=`
    ${statusHtml}
    ${driftHtml}

  if(!isActive){
    setTimeout(()=>{
      const tc=document.getElementById('terms-check')

window.generateMK=async function(){
  const btn=document.getElementById('btn-create')
  const isUpdate=mkv?.isActive
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Wird generiert…'}
  const loadingTimer=showLoadingOverlay('mediakitCreate')
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-mediakit`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||`HTTP ${res.status}`)
    await finishLoadingOverlay(loadingTimer)
    showToast('Media Kit live ✓')
    if(mkv&&!mkv.ctx.stale)await loadMediakit()
  }catch(err){
    hideLoadingOverlay(loadingTimer)
    showToast('Fehler: '+err.message,5000)
    const b=document.getElementById('btn-create')
    if(b){b.disabled=false;b.textContent=isUpdate?'Media Kit aktualisieren':'Media Kit erstellen'}
  }
}

async function onMkPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Max. 5 MB');return}
  const status=document.getElementById('photo-status')
  if(status)status.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{const bw=document.getElementById('profile-photo-wrap');if(bw)bw.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
  reader.readAsDataURL(file)
  const uid=mkv?mkv.uid:state.session.user.id
  const erg=await profilbildHochladen(file, uid, mkv?.profile?.profile_image_url)
  if(erg.fehler){showToast(erg.fehler,4000);const sf=document.getElementById('photo-status');if(sf)sf.textContent='Fehler';return}
  const publicUrl=erg.publicUrl
  if(mkv?.profile)mkv.profile.profile_image_url=publicUrl
  const st=document.getElementById('photo-status')
  if(st)st.textContent='✓ Foto hochgeladen'
  showToast('Profilbild gespeichert ✓')
  e.target.value=''
  regenerateBioPageQuietly(uid)
}

/* #10: Vier Kaesten mit Altersspannen und ohne Bezug sagten nicht, was
   einzutragen ist. Jetzt steht die Frage als Ueberschrift da, jedes Feld
   traegt sein Prozentzeichen, und die laufende Summe sagt, ob die Angaben
   zusammenpassen -- ohne zu blockieren: eine Marke kann auch mit 90 %
   etwas anfangen, aber nicht mit 300 %. */
window.mkAnteileSumme=function(){
  const zahl = id => { const v=parseInt(document.getElementById(id)?.value); return isNaN(v)?0:v }
  const zeige = (zielId, summe, leer) => {
    const el=document.getElementById(zielId); if(!el)return
    if(leer){ el.textContent=''; el.className='sheet-hint'; return }
    const passt = summe>=95 && summe<=105
    el.textContent = `Zusammen ${summe} %` + (passt?'':' — sollte etwa 100 % ergeben')
    el.className = 'sheet-hint' + (passt?'':' err')
  }
  const g=['s-female','s-male']
  const a=['s-alter1','s-alter2','s-alter3','s-alter4']
  zeige('mk-geschlecht-summe', g.reduce((x,id)=>x+zahl(id),0), g.every(id=>!document.getElementById(id)?.value))
  zeige('mk-alter-summe',      a.reduce((x,id)=>x+zahl(id),0), a.every(id=>!document.getElementById(id)?.value))
}

window.doAutofill=function(){
  const ig=mkv.analyseStats.instagram,tt=mkv.analyseStats.tiktok
  if(ig){
    if(ig.engagement_rate!=null)document.getElementById('s-ig-er').value=(+parseFloat(ig.engagement_rate).toFixed(2))
    if(ig.avg_likes!=null)document.getElementById('s-ig-likes').value=Math.round(ig.avg_likes)
    if(ig.followers!=null)document.getElementById('s-ig-followers').value=ig.followers
    mkv.autofill=mkv.autofill||{}
    mkv.autofill.instagram={stichtag:ig.created_at||null,
      avg_comments:ig.avg_comments!=null?Math.round(ig.avg_comments):null,
      avg_views:ig.avg_views!=null?Math.round(ig.avg_views):null}
  }
  if(tt){
    if(tt.engagement_rate!=null)document.getElementById('s-tt-er').value=(+parseFloat(tt.engagement_rate).toFixed(2))
    if(tt.avg_views!=null)document.getElementById('s-tt-views').value=Math.round(tt.avg_views)
    if(tt.followers!=null)document.getElementById('s-tt-followers').value=tt.followers
    mkv.autofill=mkv.autofill||{}
    mkv.autofill.tiktok={stichtag:tt.created_at||null,
      avg_comments:tt.avg_comments!=null?Math.round(tt.avg_comments):null,
      avg_shares:tt.avg_shares!=null?Math.round(tt.avg_shares):null}
  }
  showToast('Gemessene Werte übernommen ✓')
}
window.saveStats=async function(){
  if(!mkv)return
  const btn=event.target;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const igH=document.getElementById('s-ig-handle').value.trim().replace(/^@/,'')
  const ttH=document.getElementById('s-tt-handle').value.trim().replace(/^@/,'')
  const userPatch={
    instagram_handle:igH?'@'+igH:null,
    tiktok_handle:ttH?'@'+ttH:null,
    updated_at:new Date().toISOString()
  }
  const mkPatch={
    user_id:mkv.uid,
    er_instagram:parseFloat(document.getElementById('s-ig-er').value)||null,
    avg_likes_instagram:parseInt(document.getElementById('s-ig-likes').value)||null,
    /* #15: Kommentare, Reichweite und Shares kamen bisher ausschliesslich aus
       einer Analyse. Wer fuer einen Kanal keine hat -- etwa weil nur Instagram
       analysiert wurde --, dem fehlten im fertigen Kit genau diese Zeilen,
       waehrend sie beim anderen Kanal standen. Jetzt von Hand nachtragbar. */
    avg_comments_instagram:parseInt(document.getElementById('s-ig-comments').value)||null,
    avg_views_instagram:parseInt(document.getElementById('s-ig-views').value)||null,
    followers_instagram:parseInt(document.getElementById('s-ig-followers').value)||null,
    er_tiktok:parseFloat(document.getElementById('s-tt-er').value)||null,
    avg_views_tiktok:parseInt(document.getElementById('s-tt-views').value)||null,
    avg_comments_tiktok:parseInt(document.getElementById('s-tt-comments').value)||null,
    avg_shares_tiktok:parseInt(document.getElementById('s-tt-shares').value)||null,
    followers_tiktok:parseInt(document.getElementById('s-tt-followers').value)||null,
    updated_at:new Date().toISOString()
  }
  /* Nur was per Autofill kam, bekommt einen Stichtag. Ohne Autofill bleibt er
     leer, und das Kit zeigt den Block als Eigenangabe -- genau so soll es sein.
     Das ist der Unterschied zu jedem Canva-Kit, in dem jede Zahl behauptet ist. */
  const af=mkv.autofill||{}
  if(af.instagram){
    mkPatch.gemessen_am_instagram=af.instagram.stichtag
    mkPatch.avg_comments_instagram=af.instagram.avg_comments
    mkPatch.avg_views_instagram=af.instagram.avg_views
  }
  if(af.tiktok){
    mkPatch.gemessen_am_tiktok=af.tiktok.stichtag
    mkPatch.avg_comments_tiktok=af.tiktok.avg_comments
    mkPatch.avg_shares_tiktok=af.tiktok.avg_shares
  }
  const[r1,r2]=await Promise.all([
    sb.from('users').update(userPatch).eq('id',mkv.uid),
    sb.from('mediakit_viuno').upsert(mkPatch,{onConflict:'user_id'})
  ])
  if(!mkv)return
  btn.disabled=false;btn.textContent='Speichern'
  if(r1.error||r2.error){showToast('Fehler beim Speichern',4000);return}
  Object.assign(mkv.profile,userPatch)
  mkv.mkData=Object.assign(mkv.mkData||{},mkPatch)
  showToast('Kennzahlen gespeichert ✓')
  paintMediakit()
  backToEditMenu('stats-sheet')
}

const MK_ANGEBOT_LABEL={ugc_video:'UGC Video',instagram_reel:'Instagram Reel',
  tiktok_post:'TikTok Video',story_package:'Story-Paket'}

/* Preise erscheinen nur fuer Angebote, die auch angehakt sind -- ein Preis
   fuer etwas, das man gar nicht anbietet, waere nur Verwirrung. */
function mkRenderPreise(){
  const el=document.getElementById('mk-preis-liste')
  if(!el||!mkv)return
  const gewaehlt=[...mkv.offers]
  if(!gewaehlt.length){
    el.innerHTML='<div class="empty-links">Wähle oben erst ein Angebot aus.</div>'
    return
  }
  el.innerHTML=gewaehlt.map(t=>{
    const pr=mkv.preise[t]||{}
    return `<div class="mk-preis-zeile">
      <div class="mk-preis-name">${escHtml(MK_ANGEBOT_LABEL[t]||t)}</div>
      <div class="mk-preis-felder">

window.mkSavePreis=async function(typ){
  if(!mkv)return
  const von=parseFloat(document.getElementById('pr-von-'+typ)?.value)
  const bis=parseFloat(document.getElementById('pr-bis-'+typ)?.value)
  const zeile={user_id:mkv.uid,offer_type:typ,
    preis_von:isNaN(von)?null:Math.max(0,von),
    preis_bis:isNaN(bis)?null:Math.max(0,bis),
    updated_at:new Date().toISOString()}
  /* Spanne verkehrt herum ist ein Tippfehler, kein Angebot -- lieber
     zurueckweisen als eine "ab 500 bis 200"-Zeile aufs Kit lassen. */
  if(zeile.preis_von!=null&&zeile.preis_bis!=null&&zeile.preis_bis<zeile.preis_von){
    showToast('„bis“ muss größer sein als „ab“',3000);return
  }
  const{error}=await sb.from('mediakit_preise').upsert(zeile,{onConflict:'user_id,offer_type'})
  if(!mkv)return
  if(error){showToast('Fehler: '+error.message,4000);return}
  mkv.preise[typ]=zeile
}

/* Sichert die Vorschaubilder der staerksten Beitraege, solange die
   Plattform-Links noch leben -- Instagram setzt sie rund vier Tage nach der
   Analyse ab. Laeuft im Hintergrund; schlaegt es fehl, fehlen nur die Bilder,
   nicht das Kit. */
async function mkBilderSichern(){
  if(!mkv)return
  try{
    const{data:{session}}=await sb.auth.getSession()
    if(!session)return
    const res=await fetch(SUPABASE_URL+'/functions/v1/mediakit-bilder',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
      body:'{}'
    })
    const d=await res.json()
    if(!mkv||!d.success)return
    if(d.gesichert>0){
      const{data}=await sb.from('mediakit_beitraege').select('*').eq('user_id',mkv.uid).order('position',{ascending:true})
      if(mkv)mkv.beitraege=data||[]
    }
  }catch(_){/* Bilder sind Beiwerk, kein Grund die View zu kippen */}
}

/* ═══════════════════════════════════════════════════════════════
   VIEW: ANALYSE — übernommen aus public/analytics/index.html
   Freischaltung ueber Stripe, Widerrufs-Zustimmung, Analyse-Lauf mit
   Status-Flow und 5-Sekunden-Polling, Plattform-Tabs, KI-Auswertung
   und Teilen-Snapshot unveraendert.
   ═══════════════════════════════════════════════════════════════ */

/* aus /analytics/: Datum ohne Uhrzeit */
function fmtDateDMY(d){if(!d)return'–';return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
/* Schloss und Pfeil-Kreis gibt es nicht in ICONS -- sie stammen aus den alten
   Inline-Buttons und werden hier unveraendert weiterverwendet. */
const SVG_LOCK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
const SVG_REFRESH='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>'

/* B5: Der Vergleich laeuft gegen die letzte Analyse, nicht gegen eine Woche.
   Datumsformat kommt aus dem vorhandenen fmtDateShort (oben, aus /dashboard/).
   Zwischen zwei Laeufen lagen real 1, 23 und 109 Tage. */
function deltaSeitLabel(prevRow){
  const d=prevRow?.created_at
  return d?`seit letzter Analyse (${fmtDateShort(d)})`:'seit letzter Analyse'
}

/* View-lokaler Zustand, entspricht dem `S` der alten Seite */
let anv = null

async function renderAnalytics(area, ctx){
  const uid = state.session.user.id

  area.innerHTML = `
  <div class="view-analytics">
    <!-- KANAL WAEHLEN — ein Kauf deckt genau einen Kanal ab -->
    <div class="plat-cards" id="plat-cards"></div>

    <!-- Banner nach Rueckkehr von Stripe, waehrend auf Webhook gewartet wird -->
    <div class="pay-confirm hidden" id="pay-confirm">

    <!-- STATUS FLOW (aufklappbar während Analyse läuft) -->
    <div class="status-flow hidden" id="status-flow">

        <div class="flow-icon running" id="flow-icon"><span class="spinner-dark"></span></div>
        <div>

      <button class="plat-btn" id="btn-tt" onclick="switchPlatform('tiktok')">TikTok</button>
    </div>

    <!-- ANALYSE INHALT -->
    <div id="analytics-content"></div>

    <!-- HANDLE MODAL — beide Kanäle editierbar -->
    <div class="modal-backdrop centered hidden" id="handle-modal" onclick="closeHandleModal()">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-title">Kanäle verknüpfen</div>
        <div class="modal-sub">Hinterlege deine Kanäle. Freischalten kannst du danach pro Kanal.</div>
        <div class="modal-field">
          <label class="modal-label">Instagram</label>
          <div class="modal-input-wrap">
            <span class="modal-prefix">@</span>
            <input type="text" class="modal-input" id="modal-ig" placeholder="dein_handle" autocomplete="off"/>
          </div>
          <div class="modal-hint" id="modal-ig-hint"></div>
        </div>
        <div class="modal-divider"></div>
        <div class="modal-field">
          <label class="modal-label">TikTok</label>
          <div class="modal-input-wrap">
            <span class="modal-prefix">@</span>
            <input type="text" class="modal-input" id="modal-tt" placeholder="dein_handle" autocomplete="off"/>
          </div>
          <div class="modal-hint" id="modal-tt-hint"></div>
        </div>
        <div class="plat-consent" style="margin:14px 0 2px">
          <input type="checkbox" id="modal-own-check"/>
          <label for="modal-own-check">Ich bestätige, dass dies meine eigenen Kanäle sind oder ich zur Auswertung berechtigt bin.</label>
        </div>
        <div class="modal-hint" id="modal-own-hint"></div>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-cancel" onclick="closeHandleModal()">Abbrechen</button>
          <button class="modal-btn modal-btn-confirm" id="modal-save-btn" onclick="saveHandles()">Speichern</button>
        </div>
      </div>
    </div>
  </div>`

  anv = {
    uid, ctx,
    profile:null,
    ki:{instagram:null,tiktok:null},
    stats:{instagram:null,tiktok:null},
    prevStats:{instagram:null,tiktok:null},
    platform:'instagram',
    runId:null, pollTimer:null,
    /* Option C: Guthaben und laufende Analyse haengen je an EINER Plattform. */
    purchases:{instagram:false,tiktok:false},
    lastDone:{instagram:null,tiktok:null},
    posts:{instagram:[],tiktok:[]},
    bilder:{},
    kaufOffen:false,
    activeRun:null,
    busy:null,
    /* Bis lastDone geladen ist, weiss niemand, ob oben die zwei Kaufkarten
       oder der eingeklappte Knopf hingehoeren. Vorher zeichnete
       refreshPurchaseState() die Karten sofort, loadKi() klappte sie eine
       Rundreise spaeter wieder zu -- sichtbar als Aufblitzen. */
    bereit:false
  }
  /* Das 5-Sekunden-Polling darf die Route nicht ueberleben. */
  ctx.onCleanup(() => {
    if(anv?.pollTimer)clearInterval(anv.pollTimer)
    anv = null
    document.body.style.overflow = ''
  })

  const{data:p}=await sb.from('users').select('display_name,full_name,profile_image_url,subscription_type,instagram_handle,tiktok_handle').eq('id',uid).single()
  if(ctx.stale)return
  anv.profile=p

  // ── Rueckkehr von Stripe? ──

  const bezahltePlattform=(params.get('platform')||'').toLowerCase()
  if(checkout){
    // Query-Teil entfernen, Hash mitnehmen -- sonst verliert die SPA ihre Route
    history.replaceState({},'',location.pathname+location.hash)
  }
  if(checkout==='success'&&(bezahltePlattform==='instagram'||bezahltePlattform==='tiktok')){
