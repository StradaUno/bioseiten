          Wir haben eine Bestätigungsmail an<br>
          <span class="success-email" id="success-email"></span><br><br>
          gesendet. Klicke auf den Link in der Mail um deinen Account zu aktivieren und direkt loszulegen.
        </div>
      </div>
    </div>`

  let selectedNiche = null
  let usernameValid = false
  let _unameTimer = null
  /* Debounce-Timer stoppen, wenn die View verlassen wird */
  ctx.onCleanup(() => clearTimeout(_unameTimer))

  const $ = id => document.getElementById(id)

  function selectNiche(n){
    selectedNiche = n
    document.querySelectorAll('.niche-btn').forEach(b => b.classList.toggle('active', b.dataset.niche === n))
    $('niche-hint').style.display = 'none'
  }
  document.querySelectorAll('#niche-grid .niche-btn').forEach(b => {
    ctx.on(b, 'click', () => selectNiche(b.dataset.niche))
  })

  function onUsernameInput(){
    const val   = $('inp-username').value.trim()
    const hint  = $('username-hint')
    const input = $('inp-username')
    usernameValid = false
    clearTimeout(_unameTimer)

    if(!val){
      hint.textContent = 'Dein öffentlicher Name auf viuno.de'
      hint.className = 'field-hint'
      input.classList.remove('invalid')
      return
    }
    if(!/^[a-zA-Z0-9_]{3,30}$/.test(val)){
      hint.textContent = '3–30 Zeichen, nur Buchstaben, Zahlen und _'
      hint.className = 'field-hint error'
      input.classList.add('invalid')
      return
    }
    // Format ok — check availability after 500ms
    hint.textContent = 'Wird geprüft…'
    hint.className = 'field-hint'
    hint.style.color = 'var(--muted)'
    input.classList.remove('invalid')

    _unameTimer = setTimeout(async () => {
      const { data, error } = await sb.rpc('is_username_available', { p_username: val })
      if (ctx.stale) return
      if(error||!data){
        hint.textContent = 'Fehler beim Prüfen — bitte nochmal versuchen.'
        hint.className = 'field-hint error'
        return
      }
      if(data.available){
        hint.textContent = '✓ Verfügbar!'
        hint.className = 'field-hint'
        hint.style.color = 'var(--green)'
        input.classList.remove('invalid')
        usernameValid = true
      } else {
        const msgs = {
          taken:'Dieser Username ist leider vergeben.',
          reserved:'Dieser Username ist reserviert.',
          invalid_format:'Ungültiges Format.'
        }
        hint.textContent = msgs[data.reason]||'Nicht verfügbar.'
        hint.className = 'field-hint error'
        input.classList.add('invalid')
        usernameValid = false
      }
    }, 500)
  }
  ctx.on($('inp-username'), 'input', onUsernameInput)

  function checkPwStrength(){
    const pw = $('inp-pw').value
    const hint = $('pw-hint')
    if(!pw){ hint.textContent=''; return }
    if(pw.length<8){ hint.textContent='Zu kurz — mindestens 8 Zeichen.'; hint.className='field-hint error'; return }
    hint.textContent = '✓ Passwort sieht gut aus'
    hint.className = 'field-hint'; hint.style.color = 'var(--green)'
  }
  ctx.on($('inp-pw'), 'input', checkPwStrength)

  function showError(msg){
    const el = $('error-msg')
    el.textContent = msg; el.classList.add('show')
    el.scrollIntoView({ behavior:'smooth', block:'nearest' })
  }
  function hideError(){ $('error-msg').classList.remove('show') }

  async function doRegister(){
    hideError()
    const username = $('inp-username').value.trim()
    const email    = $('inp-email').value.trim()
    const pw       = $('inp-pw').value
    const pw2      = $('inp-pw2').value
    const legal    = $('chk-legal').checked

    if(!username){ showError('Bitte gib einen Username ein.'); return }
    if(!usernameValid){ showError('Bitte wähle einen verfügbaren Username.'); return }
    if(!email){ showError('Bitte gib deine E-Mail-Adresse ein.'); return }
    if(pw.length<8){ showError('Das Passwort muss mindestens 8 Zeichen lang sein.'); return }
    if(pw!==pw2){ showError('Die Passwörter stimmen nicht überein.'); return }
    if(!selectedNiche){
      $('niche-hint').style.display = 'block'
      $('niche-hint').textContent = 'Bitte wähle eine Nische.'
      $('niche-hint').className = 'field-hint error'
      showError('Bitte wähle deine Nische aus.'); return
    }
    if(!legal){ showError('Bitte akzeptiere AGB und Datenschutzerklärung.'); return }

    const btn = $('btn-register')
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Account wird erstellt…'

    // Final availability check before submit (race condition safety)
    const { data: check } = await sb.rpc('is_username_available', { p_username: username })
    if (ctx.stale) return
    if(!check?.available){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      showError('Dieser Username ist nicht mehr verfügbar. Bitte wähle einen anderen.'); return
    }

    // Sign up
    const { data, error } = await sb.auth.signUp({
      email,
      password: pw,
      options:{
        data:{ display_name: username, niche_category: selectedNiche },
        emailRedirectTo:'https://viuno.de/onboarding'
      }
    })
    if (ctx.stale) return

    if(error){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      if(error.message.includes('already registered')||error.message.includes('already been registered')){
        showError('Diese E-Mail-Adresse ist bereits registriert. Bitte logge dich ein.')
      } else {
        showError(error.message)
      }
      return
    }

    // Update users table (trigger creates the row, we set display_name + niche)
    if(data.user){
      await sb.from('users').update({
        display_name: username,
        niche_category: selectedNiche,
        updated_at: new Date().toISOString()
      }).eq('id', data.user.id)
    }
    if (ctx.stale) return

    // Show success
    btn.disabled = false; btn.textContent = 'Account erstellen'
    $('form-card').style.display = 'none'
    $('login-link').style.display = 'none'
    $('success-email').textContent = email
    $('success-card').classList.add('show')
  }

  ctx.on($('btn-register'), 'click', doRegister)
  ctx.on($('inp-pw2'), 'keydown', e => { if(e.key==='Enter') doRegister() })
}

// ─── steps ───
const OB_STEPS=[

function renderStep(){

async function onObPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Bild zu groß. Max. 5 MB.');return}
  const statusEl=document.getElementById('upload-status')
  if(statusEl)statusEl.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{
    const img=document.querySelector('#ob-content img[style*="56px"]')
    if(img)img.src=ev.target.result
  }
  reader.readAsDataURL(file)
  if(!obv?.user)return
  const path=`${obv.user.id}/${Date.now()}.${file.name.split('.').pop()}`
  const{error}=await sb.storage.from('profile-images').upload(path,file,{upsert:true})
  if(!obv)return
  const st=document.getElementById('upload-status')
  if(error){showToast('Upload fehlgeschlagen: '+error.message,4000);if(st)st.textContent='Upload fehlgeschlagen';return}
  const{data:{publicUrl}}=sb.storage.from('profile-images').getPublicUrl(path)
  obv.data.photoUrl=publicUrl
  if(st)st.textContent='✓ Eigenes Foto hochgeladen'
  // Update badge
  const badge=document.querySelector('#ob-content div[style*="bottom:-2px"]')
  if(badge){badge.style.background='var(--green)';badge.textContent='✓'}
  e.target.value=''
}

window.nextStep=async function(){
  if(!obv)return
  const collect=OB_STEPS[obv.step-1].collect
  if(!collect())return
  if(obv.step<obv.total){obv.step++;renderStep();return}
  await saveAndFinish()
}
window.prevStep=function(){if(obv&&obv.step>1){obv.step--;renderStep()}}

async function saveAndFinish(){
  const btn=document.getElementById('btn-next')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const d=obv.data
  const{error}=await sb.from('users').update({
    instagram_handle:d.ig||null,
    tiktok_handle:d.tt||null,
    niche_category:d.niche,
    profile_image_url:d.photoUrl||null,
    onboarding_completed:true,
    updated_at:new Date().toISOString()
  }).eq('id',obv.user.id)
  if(!obv||obv.ctx.stale)return
  btn.disabled=false;btn.textContent='Abschließen ✓'
  if(error){showToast('Fehler beim Speichern: '+error.message,4000);return}
  /* Damit der Router-Guard nicht erneut ins Onboarding schickt */
  if(state.profile)state.profile.onboarding_completed=true
  document.getElementById('ob-wrap').classList.add('hidden')
  document.getElementById('success-wrap').classList.remove('hidden')
  confetti()
}

function confetti(){
  const el=document.getElementById('confetti-area')
  const emojis=['🎉','✨','🌟','💫','🎊','🎈']
  let i=0;const iv=setInterval(()=>{
    if(!obv||!document.getElementById('confetti-area')){clearInterval(iv);return}
    el.textContent=emojis[i%emojis.length];i++;if(i>12)clearInterval(iv)
  },200)
  if(obv)obv.confettiTimer=iv
}

    sb.from('user_goals').select('goal_type,target_value,current_value,deadline,platform,is_active,achieved').eq('user_id',uid).eq('is_active',true).eq('achieved',false).limit(3),

  const d           = digestRes.data
  const cards       = d?.cards || []
  const reqs        = requestsRes.data || []
  const bs          = bioStatsRes.data
  const goals       = goalsRes.data || []
  const mk          = mkRes.data
  const dailyText   = dailyTextRes.data || null
  const statsRows   = statsRes.data || []
  const isSubscribed= p?.newsletter_subscribed || false

function dashCardHtml(c){

async function dashShareCard(headline,summary){
  const text=`📰 ${headline}\n\n${summary?summary.slice(0,120)+'…':''}\n\nMehr Creator-News auf viuno.de`
  if(navigator.share){try{await navigator.share({title:headline,text,url:'https://viuno.de'});return}catch(_){}}
  try{await navigator.clipboard.writeText(text);showToast('In Zwischenablage kopiert ✓')}catch(_){showToast('Teilen nicht verfügbar')}
}

// ── Newsletter ──
/* Die alte Seite las den Button aus dem impliziten window.event —
   hier wird er uebergeben, Verhalten sonst identisch. */
async function subscribeNewsletter(pos, uid, btn){
  const inputId=pos==='top'?'nl-email-top':'nl-email-bottom'
  const successId=pos==='top'?'nl-success-top':'nl-success-bottom'
  const email=document.getElementById(inputId)?.value?.trim()
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showToast('Bitte gültige E-Mail eingeben.');return}
  btn.disabled=true;btn.textContent='…'
  // Upsert into newsletter_subscribers
  const{error}=await sb.from('newsletter_subscribers').upsert({
    email,user_id:uid||null,source:pos==='top'?'dashboard_top':'dashboard_bottom',status:'active',subscribed_at:new Date().toISOString()
  },{onConflict:'email'})
  // Update users table flag
  if(uid)await sb.from('users').update({newsletter_subscribed:true}).eq('id',uid)
  btn.disabled=false;btn.textContent='Anmelden'
  if(error){showToast('Fehler beim Anmelden.');return}
  const successEl=document.getElementById(successId)
  if(successEl){successEl.style.display='block'}
  // Hide both boxes after 2s
  setTimeout(()=>{
    document.getElementById('nl-box-bottom')?.remove()
  },2000)
  showToast('Newsletter abonniert ✓')
}

// URL-Normalisierung: akzeptiert Nike.de, www.nike.de, https://Nike.de/ → gibt https://nike.de zurück
function normalizeBrandUrl(raw){
  if(!raw)return null
  let s=raw.trim()
  if(!s)return null
  s=s.replace(/^https?:\/\//i,'')
  s=s.replace(/\/+$/,'')
  s=s.replace(/^www\./i,'')
  const slashIdx=s.indexOf('/')
  if(slashIdx>=0){
    s=s.substring(0,slashIdx).toLowerCase()+s.substring(slashIdx)
  }else{
    s=s.toLowerCase()
  }
  if(!/^[a-z0-9-]+\.[a-z0-9.-]+/i.test(s))return null
  return 'https://'+s
}

function slugify(name){
  return String(name||'').toLowerCase().trim()
    .replace(/[äÄ]/g,'ae').replace(/[öÖ]/g,'oe').replace(/[üÜ]/g,'ue').replace(/[ß]/g,'ss')
    .replace(/[^a-z0-9\s_-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')
}

window.copyLink=function(url){
  navigator.clipboard.writeText(url).then(()=>showToast('Link kopiert ✓')).catch(()=>{showToast('Nicht kopierbar')})
}

const LOADING_STEPS=[
  'Vorbereitung',
  'Layout wird generiert',
  'Design wird angewendet',
  'Inhalte werden eingefügt',
  'Wird auf den Server geladen',
  'Fast fertig'
]
let _loadingTimer=null
function showLoadingOverlay(){
  document.getElementById('loading-overlay').classList.remove('hidden')
  document.body.style.overflow='hidden'
  let i=0
  const dotsHtml='<span class="loading-dots"><span></span><span></span><span></span></span>'
  const setStep=(idx)=>{
    const el=document.getElementById('loading-status')
    if(!el)return
    el.style.animation='none'
    el.offsetHeight  // Force reflow
    el.style.animation=''
    el.innerHTML=LOADING_STEPS[idx]+dotsHtml
  }
  setStep(0)
  const t=setInterval(()=>{
    i++
    if(i>=LOADING_STEPS.length){clearInterval(t);return}
    setStep(i)
  },4200)
  _loadingTimer=t
  return t
}
function hideLoadingOverlay(timer){
  if(timer)clearInterval(timer)
  _loadingTimer=null
  document.getElementById('loading-overlay')?.classList.add('hidden')
  document.body.style.overflow=''
}
function stopLoadingOverlay(){ if(_loadingTimer){clearInterval(_loadingTimer);_loadingTimer=null} }

          <button class="modal-btn modal-btn-danger" onclick="confirmDelete()">Löschen</button>
        </div>
      </div>
    </div>

    <!-- LOADING OVERLAY — vollbild beim Erstellen -->
    <div class="loading-overlay hidden" id="loading-overlay">
      <div class="loading-spinner-big"></div>
      <div class="loading-title">BioLink wird erstellt</div>
      <div class="loading-status" id="loading-status">Vorbereitung<span class="loading-dots"><span></span><span></span><span></span></span></div>
    </div>
  </div>`

  blv = { uid, ctx, profile:null, biolink:null, customLinks:[], viewsTotal:0, viewsToday:0, views7Days:0, viewsDaily:[], theme:'color', lang:'de', editingLinkId:null }

  /* Die alte Seite haengt eine Theme-Init an openSheet — hier genauso,
     beim Verlassen der Route wird der Original-Helfer wiederhergestellt. */
  const origOpenSheet = window.openSheet
  window.openSheet = function(id){
    origOpenSheet(id)
    if(id==='theme-sheet'){
      document.querySelectorAll('.lang-opt').forEach(b=>b.classList.toggle('selected',b.dataset.lang===blv.lang))
      updateThemeUI()
    }
  }
  ctx.onCleanup(() => {
    window.openSheet = origOpenSheet
    stopLoadingOverlay()
    blv = null
    document.body.style.overflow = ''
  })

  ctx.on(document.getElementById('photo-input'), 'change', onBioPhotoPicked)

  await loadBiolink()
}

async function loadBiolink(){
  const uid = blv.uid
  const[profileRes,biolinkRes,linksRes,viewsDailyRes]=await Promise.all([
    sb.from('users').select('display_name,full_name,profile_image_url,bio,bio_active,instagram_handle,tiktok_handle,youtube_handle,threads_handle,impressum_text,subscription_type,bio_views_total,bio_views_today,bio_views_last_7_days').eq('id',uid).single(),
    sb.from('biolink_viuno').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('biolink_custom_links').select('*').eq('user_id',uid).order('position',{ascending:true}),
    sb.rpc('get_biolink_views_last_7_days_daily',{p_user_id:uid})
  ])
  if(!blv||blv.ctx.stale)return
  blv.profile=profileRes.data
  blv.biolink=biolinkRes.data
  blv.customLinks=linksRes.data||[]
  blv.viewsTotal=blv.profile?.bio_views_total||0
  blv.viewsToday=blv.profile?.bio_views_today||0
  blv.views7Days=blv.profile?.bio_views_last_7_days||0
  blv.viewsDaily=viewsDailyRes.data||[]
  blv.theme=blv.biolink?.theme||'color'
  blv.lang=blv.biolink?.default_language||'de'
  paintBiolink()
}

function paintBiolink(){
  const p=blv.profile
  const isActive=p?.bio_active===true
  const slug=slugify(p?.display_name||'')
  const bioUrl=slug?`viuno.de/${slug}`:null
  const bioFullUrl=slug?`https://viuno.de/${slug}`:null

  // Checkliste
  const checks=[
    {label:'Profilbild hochgeladen',ok:!!(p?.profile_image_url)},
    {label:'Bio ausgefüllt',ok:!!(p?.bio?.trim())},
    {label:'Impressum hinterlegt',ok:!!(p?.impressum_text?.trim())},
    {label:'Mindestens 1 Social-Kanal',ok:!!(p?.instagram_handle||p?.tiktok_handle||p?.youtube_handle||p?.threads_handle)},
  ]
  const allOk=checks.every(c=>c.ok)

  const viewsToday=blv.viewsToday
  const views7=blv.views7Days
  const viewsTotal=blv.viewsTotal

  // 7-Tage Bar-Chart-HTML
  const maxVal=Math.max(...blv.viewsDaily.map(d=>d.view_count||0),1)
  const dayLbl=['So','Mo','Di','Mi','Do','Fr','Sa']
  const chartBars=blv.viewsDaily.map(d=>{
    const v=d.view_count||0
    const h=Math.max((v/maxVal)*100,v>0?8:2)
    const dayShort=dayLbl[new Date(d.view_date+'T00:00:00').getDay()]
    return `<div class="chart-col" title="${v} Aufrufe">
      <div class="chart-bar-wrap"><div class="chart-bar ${v>0?'has':''}" style="height:${h}%"></div></div>
      <div class="chart-day">${dayShort}</div>
      <div class="chart-val">${v}</div>
    </div>`
  }).join('')
  const chartHtml=viewsTotal>0?`<div class="chart-wrap"><div class="chart-row">${chartBars}</div></div>`
    :`<div class="chart-empty">Noch keine Aufrufe in den letzten 7 Tagen.</div>`

  const themeLabels={color:'Color',dark:'Dark',clean:'Clean'}
  const langLabels={de:'Deutsch',en:'English',it:'Italiano'}
  document.getElementById('current-theme-lang').textContent=`${themeLabels[blv.theme]||'Color'} · ${langLabels[blv.lang]||'Deutsch'}`

  const page=document.getElementById('page-content')

  const statusHtml=isActive
    ?`<div class="status-banner active"><div class="status-dot active"></div>
        <div><div class="status-text">Seite ist live<span>Deine Seite ist öffentlich erreichbar</span></div></div></div>
       ${bioUrl?`<div class="link-bar">
         <a class="link-url" href="${bioFullUrl}" target="_blank" rel="noopener">${bioUrl} ↗</a>
         <button class="link-action-btn" onclick="copyLink('${bioFullUrl}')">Kopieren</button>
       </div>`:''}
       <div class="section">
         <div class="section-label">Aufrufe</div>
         <div class="stats-grid">
           <div class="stat-box"><div class="stat-box-value">${fmtNum(viewsToday)}</div><div class="stat-box-label">Heute</div></div>
           <div class="stat-box"><div class="stat-box-value">${fmtNum(views7)}</div><div class="stat-box-label">7 Tage</div></div>
           <div class="stat-box"><div class="stat-box-value">${fmtNum(viewsTotal)}</div><div class="stat-box-label">Gesamt</div></div>
         </div>
         ${chartHtml}
       </div>`
    :slug?`<div class="status-banner inactive"><div class="status-dot inactive"></div>
        <div><div class="status-text">Seite ist inaktiv<span>Seite wurde deaktiviert — du kannst sie jederzeit wieder aktivieren</span></div></div></div>`
    :''

  const themeCardsHtml=!isActive?buildThemeCards():''

  const checklistHtml=!allOk?`<div class="section">
    <div class="check-card">
      <div class="check-card-title">Checkliste</div>
      <div class="check-card-sub">Das Impressum ist gesetzlich vorgeschrieben.</div>
      ${checks.map(c=>`<div class="check-item">
        <div class="check-dot ${c.ok?'ok':'miss'}">${c.ok?'✓':'·'}</div>
        <span class="check-label ${c.ok?'ok':'miss'}">${c.label}</span>
      </div>`).join('')}
    </div>
  </div>`:''

  const termsHtml=!isActive?`<div class="action-stack">
    <button class="action-btn action-btn-secondary" onclick="openSheet('edit-actions-sheet')">✎ Bearbeiten</button>
  </div>
  <div class="section">
    <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
      <input type="checkbox" id="terms-check" style="width:18px;height:18px;flex-shrink:0;accent-color:var(--text);margin-top:2px;cursor:pointer"/>
      <span style="font-size:13px;color:var(--muted);line-height:1.5">Ich akzeptiere die <a href="/legal#biopage_terms" target="_blank" style="color:var(--text);font-weight:600;text-decoration:underline">Nutzungsbedingungen</a> von viuno.</span>
    </label>
  </div>
  <div class="action-stack">
    <button class="action-btn action-btn-primary" id="btn-generate" onclick="generatePage()" disabled>
      BioLink erstellen
    </button>
  </div>`
  :`<div class="action-stack">
    <button class="action-btn action-btn-primary" onclick="openSheet('edit-actions-sheet')">✎ Bearbeiten</button>
  </div>`

  const deleteHtml=isActive
    ?`<div class="action-stack" style="padding-top:20px;padding-bottom:calc(8px + var(--safe-bottom))">
        <button class="action-btn action-btn-danger" onclick="document.getElementById('delete-modal').classList.remove('hidden')">🗑 BioLink-Seite löschen</button>
      </div>`
    :''

  page.innerHTML=`
    ${statusHtml}
    ${themeCardsHtml}
    ${checklistHtml}
    ${termsHtml}
    ${deleteHtml}`

  // Wire terms checkbox
  if(!isActive){
    setTimeout(()=>{
      const tc=document.getElementById('terms-check')
      const bg=document.getElementById('btn-generate')
      if(!tc||!bg)return
      const update=()=>{bg.disabled=!tc.checked||!allOk}
      if(!allOk){bg.title='Bitte alle Punkte der Checkliste erfüllen'}
      blv?.ctx.on(tc,'change',update)
      update()
    },0)
  }

  initBioSheets()
}

function buildThemeCards(){
  const cards=THEMES.map(t=>`
    <button class="theme-card ${blv.theme===t.key?'selected':''}" data-theme-card="${t.key}" onclick="pickThemeCard('${t.key}')">
      <img class="theme-card-img" src="${THEME_IMG_BASE}${t.img}" alt="${t.name} Theme" loading="lazy"/>
      <span class="theme-card-name">${t.name}</span>
    </button>`).join('')
  return `<div class="theme-cards-wrap">
    <div class="theme-cards-title">Erstelle deine BioLink-Seite</div>
    <div class="theme-cards-sub">Wähle ein Design — du kannst es jederzeit ändern</div>

window.pickThemeCard=async function(theme){
  if(!blv)return
  blv.theme=theme
  document.querySelectorAll('[data-theme-card]').forEach(el=>{
    el.classList.toggle('selected',el.getAttribute('data-theme-card')===theme)
  })
  const themeLabels={color:'Color',dark:'Dark',clean:'Clean'}
  const langLabels={de:'Deutsch',en:'English',it:'Italiano'}
  const lblEl=document.getElementById('current-theme-lang')
  if(lblEl)lblEl.textContent=`${themeLabels[theme]||'Color'} · ${langLabels[blv.lang]||'Deutsch'}`

  if(blv.biolink){blv.biolink.theme=theme}else{blv.biolink={user_id:blv.uid,theme,default_language:blv.lang}}

window.generatePage=async function(){
  const btn=document.getElementById('btn-generate')
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Wird generiert…'}
  const loadingTimer=showLoadingOverlay()
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||`HTTP ${res.status}`)
    hideLoadingOverlay(loadingTimer)
    showToast('BioLink veröffentlicht ✓')
    if(blv&&!blv.ctx.stale)await loadBiolink()
  }catch(err){
    hideLoadingOverlay(loadingTimer)
    showToast('Fehler: '+err.message,5000)
    const b=document.getElementById('btn-generate')
    if(b){b.disabled=false;b.textContent=blv?.profile?.bio_active?'↻ Seite neu generieren':'✨ BioLink-Seite erstellen'}
  }
}

window.confirmDelete=async function(){
  closeModal('delete-modal')
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink?action=delete`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||'Fehler')
    showToast('Seite gelöscht')
    if(blv&&!blv.ctx.stale)await loadBiolink()
  }catch(err){showToast('Fehler: '+err.message,4000)}
}

function initBioSheets(){
  const p=blv.profile
  const bw=document.getElementById('profile-photo-wrap')
  if(bw){
    if(p?.profile_image_url)bw.innerHTML=`<img src="${escHtml(p.profile_image_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;else bw.textContent=(p?.display_name||'?')[0].toUpperCase()
  }
  const bioEl=document.getElementById('s-bio')
  if(bioEl)bioEl.value=p?.bio||''
  const strip=(h)=>h?h.replace(/^@/,''):''
  const igEl=document.getElementById('s-ig');if(igEl)igEl.value=strip(p?.instagram_handle)
  const ttEl=document.getElementById('s-tt');if(ttEl)ttEl.value=strip(p?.tiktok_handle)
  const ytEl=document.getElementById('s-yt');if(ytEl)ytEl.value=strip(p?.youtube_handle)
  const thEl=document.getElementById('s-threads');if(thEl)thEl.value=strip(p?.threads_handle)
  const impEl=document.getElementById('s-impressum');if(impEl)impEl.value=p?.impressum_text||''
  updateThemeUI()
  renderLinksSheet()
}

async function onBioPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Max. 5 MB');return}
  const status=document.getElementById('photo-status')
  if(status)status.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{const bw=document.getElementById('profile-photo-wrap');if(bw)bw.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
  reader.readAsDataURL(file)
  const uid=blv?blv.uid:state.session.user.id
  const path=`${uid}/${Date.now()}.${file.name.split('.').pop()}`
  const{error}=await sb.storage.from('profile-images').upload(path,file,{upsert:true})
  if(error){showToast('Upload fehlgeschlagen');if(status)status.textContent='Fehler';return}
  const{data:{publicUrl}}=sb.storage.from('profile-images').getPublicUrl(path)
  await sb.from('users').update({profile_image_url:publicUrl}).eq('id',uid)
  if(blv?.profile)blv.profile.profile_image_url=publicUrl
  const st=document.getElementById('photo-status')
  if(st)st.textContent='✓ Foto hochgeladen'
  showToast('Profilbild gespeichert ✓')
  if(state.profile){state.profile.profile_image_url=publicUrl;paintUser()}
  e.target.value=''
}

window.confirmAddLink=async function(){
  if(!blv)return
  const title=document.getElementById('link-title').value.trim()
  const urlRaw=document.getElementById('link-url').value.trim()
  const isPaid=document.getElementById('link-paid').checked
  const hint=document.getElementById('link-hint')
  if(!title||!urlRaw){hint.textContent='Titel und URL sind Pflichtfelder.';return}
  const normalUrl=normalizeBrandUrl(urlRaw)
  if(!normalUrl){hint.textContent='Ungültige URL. Beispiel: nike.de';return}
  hint.textContent=''
  const position=blv.customLinks.length
  const{data,error}=await sb.from('biolink_custom_links').insert({
    user_id:blv.uid,title,url:normalUrl,is_paid:isPaid,position
  }).select().single()
  if(!blv)return
  if(error){hint.textContent='Fehler: '+error.message;return}
  blv.customLinks.push(data)
  closeSheet('add-link-sheet')
  renderLinksSheet()
  showToast('Link hinzugefügt ✓')
}

  blv.customLinks=blv.customLinks.filter(l=>l.id!==id)

  showToast('Link gelöscht')
}

async function loadMediakit(){
  const uid = mkv.uid
  const[profileRes,mkRes,brandsRes,offersRes,analyseRes,viewsDailyRes]=await Promise.all([
    sb.from('users').select('display_name,full_name,profile_image_url,bio,instagram_handle,tiktok_handle,youtube_handle,threads_handle,impressum_text,mediakit_active,subscription_type,niche_category,city,contact_email,mediakit_views_total,mediakit_views_today,mediakit_views_last_7_days').eq('id',uid).single(),
    sb.from('mediakit_viuno').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('mediakit_brands').select('*').eq('user_id',uid).order('position',{ascending:true}),
    sb.from('mediakit_content_offers').select('offer_type').eq('user_id',uid),
    sb.from('analyse_stats').select('platform,engagement_rate,followers,avg_likes,avg_views,created_at').eq('user_id',uid).order('created_at',{ascending:true}),
    sb.rpc('get_mediakit_views_last_7_days_daily',{p_user_id:uid})
  ])
  if(!mkv||mkv.ctx.stale)return
  mkv.profile=profileRes.data||{}
  mkv.mkData=mkRes.data||{}
  mkv.brands=brandsRes.data||[]
  mkv.offers=new Set((offersRes.data||[]).map(r=>r.offer_type))
  mkv.analyseStats={}
  for(const row of(analyseRes.data||[])) mkv.analyseStats[row.platform]=row
  mkv.viewsTotal=mkv.profile.mediakit_views_total||0
  mkv.viewsToday=mkv.profile.mediakit_views_today||0
  mkv.views7Days=mkv.profile.mediakit_views_last_7_days||0
  mkv.viewsDaily=viewsDailyRes.data||[]
  mkv.isActive=mkv.profile.mediakit_active===true
  mkv.slug=mkv.profile.display_name?slugify(mkv.profile.display_name):null
  mkv.defaultLang=mkv.mkData?.default_language||'de'
  paintMediakit()
}

// ── Analyse-Drift-Check: neue Analyse vorhanden & weicht stark von Media Kit ab? ──
function getAnalysisDrift(){
  if(!mkv.isActive)return null
  const mk=mkv.mkData||{}
  const mkUpdated=mk.updated_at?new Date(mk.updated_at).getTime():0
  const flags=[]
  const ig=mkv.analyseStats.instagram
  if(ig&&ig.created_at&&new Date(ig.created_at).getTime()>mkUpdated&&ig.followers!=null&&mk.followers_instagram!=null&&mk.followers_instagram>0){
    if(Math.abs(ig.followers-mk.followers_instagram)/mk.followers_instagram>0.2)flags.push('Instagram')
  }
  const tt=mkv.analyseStats.tiktok
  if(tt&&tt.created_at&&new Date(tt.created_at).getTime()>mkUpdated&&tt.followers!=null&&mk.followers_tiktok!=null&&mk.followers_tiktok>0){
    if(Math.abs(tt.followers-mk.followers_tiktok)/mk.followers_tiktok>0.2)flags.push('TikTok')
  }
  return flags.length?flags.join(' & '):null
}

function paintMediakit(){
  const p=mkv.profile,mk=mkv.mkData||{}
  const isActive=mkv.isActive&&!!mkv.slug
  const kitUrl=mkv.slug?`viuno.de/kit/${mkv.slug}`:null
  const kitFullUrl=mkv.slug?`https://viuno.de/kit/${mkv.slug}`:null

  const viewsToday=mkv.viewsToday
  const views7=mkv.views7Days
  const viewsTotal=mkv.viewsTotal

  // 7-Tage-Chart-HTML
  const maxVal=Math.max(...mkv.viewsDaily.map(d=>d.view_count||0),1)
  const dayLbl=['So','Mo','Di','Mi','Do','Fr','Sa']
  const chartBars=mkv.viewsDaily.map(d=>{
    const v=d.view_count||0
    const h=Math.max((v/maxVal)*100,v>0?8:2)
    const dayShort=dayLbl[new Date(d.view_date+'T00:00:00').getDay()]
    return `<div class="chart-col" title="${v} Aufrufe">
      <div class="chart-bar-wrap"><div class="chart-bar ${v>0?'has':''}" style="height:${h}%"></div></div>
      <div class="chart-day">${dayShort}</div>
      <div class="chart-val">${v}</div>

window.openEditSubSheet=function(id){

    const bw=document.getElementById('profile-photo-wrap')
    if(p.profile_image_url)bw.innerHTML=`<img src="${escHtml(p.profile_image_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    else bw.textContent=(p.display_name||'?')[0].toUpperCase()
    document.getElementById('s-niche').value=p.niche_category||''
    document.getElementById('s-city').value=p.city||''
    document.getElementById('s-bio').value=p.bio||''
  } else if(id==='contact-sheet'){
    document.getElementById('s-contact-email').value=mkv.profile?.contact_email||''
  } else if(id==='stats-sheet'){
    openStatsSheet();return
  } else if(id==='platforms-sheet'){
    openPlatformsSheet();return
  } else if(id==='audience-sheet'){
    openAudienceSheet();return
  } else if(id==='offers-sheet'){

  } else if(id==='brands-sheet'){
    renderBrandsList()
  } else if(id==='impressum-sheet'){
    document.getElementById('s-impressum').value=mkv.profile?.impressum_text||''

    document.querySelectorAll('#language-sheet .lang-opt').forEach(b=>
      b.classList.toggle('selected',b.dataset.lang===mkv.defaultLang))
  }
  openSheet(id)
}

// ── Generate / Delete ──
window.generateMK=async function(){
  const btn=document.getElementById('btn-create')
  const isUpdate=mkv?.isActive
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Wird generiert…'}
  const loadingTimer=showLoadingOverlay()
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-mediakit`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||`HTTP ${res.status}`)
    hideLoadingOverlay(loadingTimer)
    showToast('Media Kit live ✓')
    if(mkv&&!mkv.ctx.stale)await loadMediakit()
  }catch(err){
    hideLoadingOverlay(loadingTimer)
    showToast('Fehler: '+err.message,5000)
    const b=document.getElementById('btn-create')
    if(b){b.disabled=false;b.textContent=isUpdate?'Media Kit aktualisieren':'Media Kit erstellen'}
  }
}

window.mkConfirmDelete=async function(){
  closeModal('delete-modal')
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-mediakit?action=delete`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||'Fehler')
    showToast('Media Kit gelöscht')
    if(mkv&&!mkv.ctx.stale)await loadMediakit()
  }catch(err){showToast('Fehler: '+err.message,4000)}
}

// ── Photo Upload ──
async function onMkPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Max. 5 MB');return}
  const status=document.getElementById('photo-status')
  if(status)status.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{const bw=document.getElementById('profile-photo-wrap');if(bw)bw.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
  reader.readAsDataURL(file)
  const uid=mkv?mkv.uid:state.session.user.id
  const path=`${uid}/${Date.now()}.${file.name.split('.').pop()}`
  const{error}=await sb.storage.from('profile-images').upload(path,file,{upsert:true})
  if(error){showToast('Upload fehlgeschlagen');const st=document.getElementById('photo-status');if(st)st.textContent='Fehler';return}
  const{data:{publicUrl}}=sb.storage.from('profile-images').getPublicUrl(path)
  await sb.from('users').update({profile_image_url:publicUrl}).eq('id',uid)
  if(mkv?.profile)mkv.profile.profile_image_url=publicUrl
  const st=document.getElementById('photo-status')
  if(st)st.textContent='✓ Foto hochgeladen'
  showToast('Profilbild gespeichert ✓')
  if(state.profile){state.profile.profile_image_url=publicUrl;paintUser()}
  e.target.value=''
}

   VIEW: ANALYSE — übernommen aus public/analytics/index.html
   Freischaltung ueber Stripe, Widerrufs-Zustimmung, Analyse-Lauf mit
   Status-Flow und 5-Sekunden-Polling, Plattform-Tabs, KI-Auswertung

const STRIPE_PAYMENT_LINK='https://buy.stripe.com/6oUcN61Id8rf7ov9jc4ow0g'
const WITHDRAWAL_CONSENT_TEXT='Ich stimme zu, dass die Analyse sofort nach Zahlung beginnt, und verliere damit mein 14-tägiges Widerrufsrecht.'

/* aus /analytics/: Datum ohne Uhrzeit */
function fmtDateDMY(d){if(!d)return'–';return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}

/* View-lokaler Zustand, entspricht dem `S` der alten Seite */
let anv = null

async function renderAnalytics(area, ctx){

    platform:'instagram',
    runId:null, pollTimer:null,
    hasPurchase:false
  }
  /* Das 5-Sekunden-Polling darf die Route nicht ueberleben. */
  ctx.onCleanup(() => {

// ── Freischaltungs-Status laden ──
async function refreshPurchaseState(){
  const{data}=await sb.from('analysis_purchases').select('id').eq('user_id',anv.uid).is('consumed_at',null).limit(1).maybeSingle()
  if(!anv)return
  anv.hasPurchase=!!data
  renderBtn()
}

// ── nach Stripe-Rueckkehr kurz pollen, bis der Webhook die Freischaltung eingetragen hat ──
async function waitForPurchaseAfterPayment(){
  const banner=document.getElementById('pay-confirm')
  banner.classList.remove('hidden')
  document.getElementById('btn-start').disabled=true
  for(let i=0;i<8;i++){
    const{data}=await sb.from('analysis_purchases').select('id').eq('user_id',anv.uid).is('consumed_at',null).limit(1).maybeSingle()
    if(!anv||anv.ctx.stale)return
    if(data){
      anv.hasPurchase=true
      banner.classList.add('hidden')
      renderBtn()
      showToast('Freigeschaltet ✓')
      return
    }
    await new Promise(r=>setTimeout(r,2000))
    if(!anv||anv.ctx.stale)return
  }
  banner.innerHTML='<span>Zahlung wird noch verarbeitet. Lade die Seite gleich nochmal neu.</span>'
  document.getElementById('btn-start').disabled=false
  renderBtn()
}

// ── Button state ──
function renderBtn(){
  const p=anv?.profile
  const btn=document.getElementById('btn-start')
  const sub=document.getElementById('btn-start-sub')
  const consentWrap=document.getElementById('consent-wrap')
  if(!p||!btn)return
  if(!anv.hasPurchase){
    btn.disabled=false
    btn.classList.add('pay')
    btn.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Analyse freischalten – 9,99€`
    sub.textContent='Einmalige Freischaltung pro Analyse'
    consentWrap.classList.remove('hidden')
    document.getElementById('consent-checkbox').checked=false
    return
  }
  btn.classList.remove('pay')
  btn.disabled=false
  btn.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Neue Analyse starten`
  sub.textContent=p.instagram_handle||p.tiktok_handle?'':'Bitte zuerst einen Kanal verknüpfen'

// ── Load KI results ──
async function loadKi(){
  const[kiRes,statsRes]=await Promise.all([
    sb.from('analyse_ki').select('*').eq('user_id',anv.uid).order('created_at',{ascending:false}).limit(4),
    sb.from('analyse_stats').select('*').eq('user_id',anv.uid).order('created_at',{ascending:false}).limit(4)
  ])
  if(!anv||anv.ctx.stale)return
  if(kiRes.data?.length){
    anv.ki.instagram=kiRes.data.find(r=>r.platform==='instagram')||null
    anv.ki.tiktok=kiRes.data.find(r=>r.platform==='tiktok')||null
  }
  if(statsRes.data?.length){
    anv.stats.instagram=statsRes.data.find(r=>r.platform==='instagram')||null
    anv.stats.tiktok=statsRes.data.find(r=>r.platform==='tiktok')||null
  }
  renderAnalyticsContent()
}

// ── Check active run on load ──
async function checkActiveRun(){
  const{data:run}=await sb.from('analysis_runs').select('*').eq('user_id',anv.uid).in('status',['scraping','analyzing']).order('started_at',{ascending:false}).limit(1).maybeSingle()
  if(!anv||anv.ctx.stale)return
  if(run){showFlow(run);poll(run.id)}
}

// ── Status Flow ──
function showFlow(run){
  document.getElementById('status-flow').classList.remove('hidden')
  document.getElementById('consent-wrap').classList.add('hidden')
  const btn=document.getElementById('btn-start')
  btn.disabled=true
  btn.classList.remove('pay')
  btn.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Analyse läuft…`
  renderFlow(run)
}

function renderFlow(run){
  const p=anv?.profile
  const hasIg=!!(p?.instagram_handle)
  const hasTt=!!(p?.tiktok_handle)
  const igDone=run.instagram_done_at||run.instagram_skipped
  const ttDone=run.tiktok_done_at||run.tiktok_skipped
  const s=run.status

  const steps=[]
  steps.push({label:'Analyse gestartet',state:'done'})
  if(hasIg)steps.push({label:'Instagram-Beiträge werden abgerufen',state:igDone?'done':(s==='scraping'&&!igDone?'active':'wait')})
  if(hasTt)steps.push({label:'TikTok-Videos werden abgerufen',state:ttDone?'done':(s==='scraping'&&igDone&&!ttDone?'active':hasTt&&!ttDone?'wait':'done')})
  steps.push({label:'Auswertung läuft',state:s==='analyzing'?'active':(s==='done'?'done':'wait')})
  steps.push({label:'Ergebnisse bereit',state:s==='done'?'done':'wait'})

  document.getElementById('flow-steps').innerHTML=steps.map(st=>`
    <div class="flow-step">
      <div class="step-dot ${st.state}">${st.state==='done'?'✓':st.state==='active'?'<span class="spinner" style="width:8px;height:8px;border-width:1.5px"></span>':''}</div>
      <div class="step-label ${st.state}">${st.label}</div>
    </div>`).join('')

  const isDone=s==='done', isFailed=s==='failed'
  const icon=document.getElementById('flow-icon')
  const title=document.getElementById('flow-title')
  const sub=document.getElementById('flow-sub')
  if(isDone){icon.innerHTML='✓';icon.className='flow-icon done';title.textContent='Analyse abgeschlossen';sub.textContent='Deine Ergebnisse wurden aktualisiert'}
  else if(isFailed){icon.innerHTML='✕';icon.className='flow-icon error';title.textContent='Analyse fehlgeschlagen';sub.textContent=run.error||'Bitte versuche es erneut'}
  else{icon.innerHTML='<span class="spinner-dark"></span>';icon.className='flow-icon running';title.textContent='Analyse läuft';sub.textContent=s==='analyzing'?'Auswertung läuft…':'Daten werden abgerufen…'}
}

// ── Polling ──
function poll(runId){
  if(anv.pollTimer)clearInterval(anv.pollTimer)
  anv.pollTimer=setInterval(async()=>{
    const{data:run}=await sb.from('analysis_runs').select('*').eq('id',runId).single()
    if(!anv||anv.ctx.stale)return
    if(!run)return
    renderFlow(run)
    if(run.status==='done'||run.status==='failed'){
      clearInterval(anv.pollTimer);anv.pollTimer=null
      if(run.status==='done'){
        const{data:p}=await sb.from('users').select('instagram_handle,tiktok_handle,subscription_type').eq('id',anv.uid).single()
        if(!anv||anv.ctx.stale)return
        if(p)anv.profile={...anv.profile,...p}
        await refreshPurchaseState()
        if(!anv||anv.ctx.stale)return
        await loadKi()
        if(!anv||anv.ctx.stale)return
        showToast('Analyse fertig ✓')
        setTimeout(()=>{document.getElementById('status-flow')?.classList.add('hidden')},4000)
      } else {
        renderBtn()
        showToast('Analyse fehlgeschlagen — deine Freischaltung bleibt erhalten',4500)
      }
    }
  },5000)
}

// ── Start Analysis ──
window.startAnalysis=async function(){
  if(!anv)return
  const p=anv.profile
  if(!p?.instagram_handle&&!p?.tiktok_handle){openHandleModal();return}
  const btn=document.getElementById('btn-start')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Wird gestartet…'
  try{
    const{data:{session}}=await sb.auth.getSession()
    if(!session){showToast('Session abgelaufen');location.reload();return}
    const res=await fetch(`${SUPABASE_URL}/functions/v1/start-analysis`,{method:'POST',headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}})
    const body=await res.json()
    if(!anv||anv.ctx.stale)return
    if(res.status===402||body.error==='payment_required'){
      anv.hasPurchase=false
      renderBtn()
      showToast(body.message||'Für eine neue Analyse ist eine Freischaltung nötig.',4000)
      return
    }
    if(!res.ok||!body.success)throw new Error(body.error||'Unbekannter Fehler')
    anv.runId=body.analysis_run_id
    const fakeRun={id:body.analysis_run_id,status:'scraping',instagram_done_at:null,instagram_skipped:!p.instagram_handle,tiktok_done_at:null,tiktok_skipped:!p.tiktok_handle,error:null,started_at:new Date().toISOString()}
    showFlow(fakeRun);poll(body.analysis_run_id)
  }catch(err){
    showToast('Fehler: '+err.message,4000)
    renderBtn()
  }
}

// ── Handle Modal ──
window.openHandleModal=function(){
  const p=anv?.profile
  document.getElementById('modal-ig').value=p?.instagram_handle?p.instagram_handle.replace(/^@/,''):''
  document.getElementById('modal-tt').value=p?.tiktok_handle?p.tiktok_handle.replace(/^@/,''):''
  document.getElementById('modal-ig-hint').textContent=''
  document.getElementById('modal-tt-hint').textContent=''
  document.getElementById('handle-modal').classList.remove('hidden')
  document.body.style.overflow='hidden'
}
window.closeHandleModal=function(){
  document.getElementById('handle-modal')?.classList.add('hidden')
  document.body.style.overflow=''
}
window.saveHandlesAndStart=async function(){
  if(!anv)return
  const ig=document.getElementById('modal-ig').value.trim().replace(/^@/,'')
  const tt=document.getElementById('modal-tt').value.trim().replace(/^@/,'')
  const igH=document.getElementById('modal-ig-hint')
  const ttH=document.getElementById('modal-tt-hint')
  igH.textContent='';ttH.textContent=''
  if(!ig&&!tt){igH.textContent='Mindestens ein Handle eingeben.';igH.className='modal-hint err';return}
  const re=/^[a-zA-Z0-9._]{1,50}$/
  if(ig&&!re.test(ig)){igH.textContent='Ungültiges Format (Buchstaben, Zahlen, . und _)';igH.className='modal-hint err';return}
  if(tt&&!re.test(tt)){ttH.textContent='Ungültiges Format (Buchstaben, Zahlen, . und _)';ttH.className='modal-hint err';return}
  const btn=document.getElementById('modal-save-btn')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const patch={}
  if(ig)patch.instagram_handle='@'+ig
  if(tt)patch.tiktok_handle='@'+tt
  await sb.from('users').update(patch).eq('id',anv.uid)
  if(!anv)return
  anv.profile={...anv.profile,...patch}
  closeHandleModal()
  btn.disabled=false;btn.textContent='Speichern & starten'
  await startAnalysis()
}

// ── Render Content ──
function renderAnalyticsContent(){
  const p=anv.profile
  const pl=anv.platform
  const ki=anv.ki[pl]
  const hasHandle=pl==='instagram'?!!(p?.instagram_handle):!!(p?.tiktok_handle)
  const el=document.getElementById('analytics-content')
  const label=pl==='instagram'?'Instagram':'TikTok'

  if(!hasHandle){
    el.innerHTML=`<div class="section" style="margin-top:12px"><div class="empty-state">
      <div class="empty-icon">${pl==='instagram'?'📸':'🎵'}</div>
      <div class="empty-title">Kein ${label}-Handle</div>

window.shareAnalytics=function(){
  if(!anv)return
  const ki=anv.ki[anv.platform]
  const st=anv.stats[anv.platform]
  const pl=anv.platform==='instagram'?'Instagram':'TikTok'
  const handle=anv.platform==='instagram'?anv.profile?.instagram_handle:anv.profile?.tiktok_handle
  const handleStr=handle?handle.startsWith('@')?handle:'@'+handle:''

  const lines=[]
  lines.push(`📊 Meine ${pl}-Analyse`)
  if(handleStr)lines.push(handleStr)
  lines.push('')

  if(st){
    const follStr=st.followers!=null?`👥 ${fmt(st.followers)} Follower`+( st.followers_change!=null&&st.followers_change!==0?` (${st.followers_change>=0?'+':''}${fmt(st.followers_change)} diese Woche)`:'' ):null
    if(follStr)lines.push(follStr)
    if(st.engagement_rate!=null)lines.push(`💫 ${(+st.engagement_rate).toFixed(2)}% Engagement Rate`)
    if(st.avg_likes!=null)lines.push(`❤️  ⌀ ${fmt(st.avg_likes)} Likes pro Post`)
    if(st.avg_views!=null)lines.push(`👁  ⌀ ${fmt(st.avg_views)} Views pro Post`)
    if(st.best_posting_day&&st.best_posting_hour!=null)lines.push(`⏰ Beste Zeit: ${st.best_posting_day} ${st.best_posting_hour}:00 Uhr`)
  } else if(ki?.analyse_ueberblick){
    lines.push((ki.analyse_ueberblick||'').slice(0,120)+'…')
  }

  lines.push('')
  lines.push('Analysiert mit viuno.')
  lines.push('👉 viuno.de')

  const text=lines.filter(l=>l!=null).join('\n')

  if(navigator.share)navigator.share({title:`Meine ${pl}-Analyse`,text}).catch(()=>{})
  else navigator.clipboard.writeText(text).then(()=>showToast('Kopiert ✓')).catch(()=>showToast('Teilen nicht verfügbar'))
}

   Wochen-Logik, Datums-Pills, Plattform-Filter, ausklappbare Karten,
   Teilen und die Newsletter-Checkbox unverändert.

const MONTHS_SHORT=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez']
const MONTHS_FULL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember']
// Ab diesem Datum sind daily_digest-Eintraege echte Wochen-Ausgaben. Aeltere (taegliche) Eintraege
// aus der Zeit vor der Umstellung werden hier bewusst ausgeblendet, damit keine "Fake-Wochen" auftauchen.
// Die alten Daten bleiben in der DB unangetastet.
const WEEKLY_SWITCH_DATE='2026-09-07'

// Montag der aktuellen ISO-Woche (lokale Zeit), als YYYY-MM-DD — identische Logik wie im Backend
function getWeekStartLocal(d){
  const day=d.getDay()
  const diff=day===0?-6:1-day
  const monday=new Date(d)
  monday.setDate(d.getDate()+diff)
  monday.setHours(0,0,0,0)
  return monday
}
function toIso(d){return d.toISOString().split('T')[0]}
function weekEnd(dateStr){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+6);return d}
function isThisWeek(dateStr){return dateStr===toIso(getWeekStartLocal(new Date()))}
function isLastWeek(dateStr){const lw=getWeekStartLocal(new Date());lw.setDate(lw.getDate()-7);return dateStr===toIso(lw)}

// Pill-Label: oben kurzer Hinweis, unten der Start-Tag der Woche
function pillTopLabel(dateStr){
  if(isThisWeek(dateStr))return'Aktuell'
  if(isLastWeek(dateStr))return'Letzte'
  const d=new Date(dateStr+'T12:00:00')
  return MONTHS_SHORT[d.getMonth()]
}
function pillNum(dateStr){const d=new Date(dateStr+'T12:00:00');return String(d.getDate()).padStart(2,'0')}

// Vollständiges Label für die Überschrift, z.B. "Diese Woche (07.–13. September)" oder "24.–30. August 2026"
function fmtWeekFull(dateStr){
  const start=new Date(dateStr+'T12:00:00')
  const end=weekEnd(dateStr)
  const sameMonth=start.getMonth()===end.getMonth()
  const startStr=sameMonth?String(start.getDate()).padStart(2,'0'):`${String(start.getDate()).padStart(2,'0')}. ${MONTHS_SHORT[start.getMonth()]}`
  const endStr=`${String(end.getDate()).padStart(2,'0')}. ${MONTHS_FULL[end.getMonth()]} ${end.getFullYear()}`
  const range=`${startStr}.–${endStr}`
  if(isThisWeek(dateStr))return`Diese Woche (${range})`
  if(isLastWeek(dateStr))return`Letzte Woche (${range})`
  return`Woche vom ${range}`
}

async function loadDigests(){

function renderDatePicker(){
  document.getElementById('date-scroll').innerHTML=dgv.digests.map(d=>`<div class="date-pill ${d.date===dgv.activeDate?'active':''}" onclick="selectDate('${d.date}')"><div class="date-pill-day">${pillTopLabel(d.date)}</div><div class="date-pill-num">${pillNum(d.date)}</div><div class="date-pill-dot"></div></div>`).join('')

function buildFilters(cards){

function currentCards(){const digest=dgv.digests.find(d=>d.date===dgv.activeDate);if(!digest)return[];let cards=digest.cards||[];if(dgv.activeFilter!=='alle')cards=cards.filter(c=>c.platform===dgv.activeFilter);return cards}
function paintDigest(){

function fmtRelDate(d){if(!d)return'';const dt=new Date(d),now=new Date(),diff=now-dt,m=Math.floor(diff/60000),h=Math.floor(diff/3600000),days=Math.floor(diff/86400000);if(m<60)return`vor ${m} Min.`;if(h<24)return`vor ${h} Std.`;if(days<7)return`vor ${days} Tagen`;return dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
function fmtFull(d){if(!d)return'';return new Date(d).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function typeClass(t){return{brand:'rb-brand',collab:'rb-collab',event:'rb-event',sonstiges:'rb-sonstiges'}[t]||'rb-sonstiges'}
function typeLabel(t){return{brand:'Brand',collab:'Collab',event:'Event',sonstiges:'Sonstiges'}[t]||t}
function statusClass(s){return{new:'s-new',replied:'s-replied',negotiation:'s-negotiation',closed:'s-closed'}[s]||'s-new'}
function statusLabel(s){return{new:'Neu',replied:'Beantwortet',negotiation:'Verhandlung',closed:'Abgeschlossen'}[s]||s}

/* View-lokaler Zustand, entspricht dem `state` der alten Seite */
let rqv = null

async function renderRequests(area, ctx){
  const uid = state.session.user.id

  area.innerHTML = `
  <div class="view-requests">
    <div class="list-view">
      <div class="page-top"><div class="page-title">Anfragen</div><div class="new-badge hidden" id="new-count-badge">0 neu</div></div>
      <div class="filter-row">
        <button class="f-pill active" data-f="alle" onclick="setReqFilter('alle',this)">Alle</button>
        <button class="f-pill" data-f="new" onclick="setReqFilter('new',this)">Neu</button>
        <button class="f-pill" data-f="replied" onclick="setReqFilter('replied',this)">Beantwortet</button>
        <button class="f-pill" data-f="negotiation" onclick="setReqFilter('negotiation',this)">Verhandlung</button>
        <button class="f-pill" data-f="closed" onclick="setReqFilter('closed',this)">Abgeschlossen</button>
      </div>
      <div id="skeleton-area" style="padding:12px 20px 0;display:flex;flex-direction:column;gap:10px"><div class="skeleton" style="height:96px;border-radius:16px"></div><div class="skeleton" style="height:96px;border-radius:16px"></div><div class="skeleton" style="height:96px;border-radius:16px"></div></div>
      <div class="req-list hidden" id="req-list"></div>
      <div class="empty-state hidden" id="empty-state" style="margin:12px 20px 0">
        <div class="empty-icon">📭</div>
        <div class="empty-title">Noch keine Anfragen</div>
        <div class="empty-sub">Erstelle deine Präsenz, damit Brands dich finden können.</div>
        <div class="empty-cta">
          <a class="empty-cta-link" href="#/biolink">
            <div class="empty-cta-icon">🔗</div>
            <div><div class="empty-cta-text">BioLink-Seite erstellen</div><div class="empty-cta-sub">Deine Visitenkarte für Brands</div></div>
            <div style="margin-left:auto;font-size:14px;color:var(--subtle)">→</div>
          </a>
          <a class="empty-cta-link" href="#/mediakit">
            <div class="empty-cta-icon">📋</div>
            <div><div class="empty-cta-text">Media Kit erstellen</div><div class="empty-cta-sub">Zeig Brands deine Reichweite & Zahlen</div></div>
            <div style="margin-left:auto;font-size:14px;color:var(--subtle)">→</div>
          </a>
        </div>
      </div>
    </div>
    <div class="detail-overlay" id="detail-overlay" onclick="closeDetail()"></div>
    <div class="detail-panel" id="detail-panel"><div class="detail-handle"></div><div id="detail-content"></div></div>
  </div>`

  rqv = { uid, ctx, requests:[], filter:'alle', activities:{} }
  ctx.onCleanup(() => { rqv = null; document.body.style.overflow = '' })

  // Swipe-down zum Schliessen des Detail-Panels
  const panel=document.getElementById('detail-panel');let touchStartY=0
  ctx.on(panel,'touchstart',e=>{touchStartY=e.touches[0].clientY},{passive:true})
  ctx.on(panel,'touchend',e=>{if(e.changedTouches[0].clientY-touchStartY>80)closeDetail()},{passive:true})

  await loadRequests()
}

async function loadRequests(){
  const{data}=await sb.from('collab_requests').select('*').eq('creator_id',rqv.uid).is('deleted_at',null).neq('status','deleted').order('created_at',{ascending:false})
  if(!rqv||rqv.ctx.stale)return
  document.getElementById('skeleton-area').classList.add('hidden')
  if(!data?.length){document.getElementById('empty-state').classList.remove('hidden');return}
  rqv.requests=data;updateBadges();renderReqList()
}
function updateBadges(){const n=rqv.requests.filter(r=>r.status==='new').length;const badge=document.getElementById('new-count-badge');if(!badge)return;if(n>0){badge.textContent=`${n} neu`;badge.classList.remove('hidden')}else badge.classList.add('hidden')}
window.setReqFilter=function(f,btn){
  if(!rqv)return
  rqv.filter=f;document.querySelectorAll('.f-pill').forEach(p=>p.classList.toggle('active',p.dataset.f===f));renderReqList()
}
function filtered(){
  // "Alle" zeigt alles außer Abgeschlossen
  if(rqv.filter==='alle')return rqv.requests.filter(r=>r.status!=='closed')
  return rqv.requests.filter(r=>r.status===rqv.filter)
}
function renderReqList(){
  const el=document.getElementById('req-list'),items=filtered(),empty=document.getElementById('empty-state')
  el.classList.remove('hidden');empty.classList.add('hidden')
  if(!items.length){
    el.innerHTML=''
    // Zeige Platzhalter nur bei "alle" und "new", nicht bei gezielten Status-Filtern
    if(rqv.filter==='alle'||rqv.filter==='new'){empty.classList.remove('hidden')}
    else{el.innerHTML=`<div style="text-align:center;padding:40px 20px;font-size:13px;color:var(--muted)">Keine Einträge.</div>`}
    return
  }
  el.innerHTML=items.map(r=>`<div class="req-card ${r.status==='new'?'is-new':''}" data-id="${r.id}"><div class="req-card-top"><div class="req-initial">${escHtml(r.sender_initial||r.sender_name?.[0]||'?')}</div><div class="req-info"><div class="req-name">${escHtml(r.sender_name)}</div><div class="req-meta"><span class="req-type-badge ${typeClass(r.request_type)}">${typeLabel(r.request_type)}</span>${r.budget?`<span style="font-size:11px;font-weight:600;color:var(--text)">€ ${Number(r.budget).toLocaleString('de-DE')}</span>`:''}<span class="req-date">${fmtRelDate(r.created_at)}</span></div></div><div class="req-status"><span class="status-tag ${statusClass(r.status)}">${statusLabel(r.status)}</span>${r.status==='new'?'<div class="new-dot"></div>':''}</div></div>${r.message?`<div class="req-preview-msg">${escHtml(r.message)}</div>`:''}</div>`).join('')
  el.querySelectorAll('.req-card').forEach(card=>rqv.ctx.on(card,'click',()=>openDetail(card.dataset.id)))
}
async function openDetail(id){
  const r=rqv.requests.find(x=>x.id===id);if(!r)return
  // Status wird NICHT automatisch geändert — nur manuell via changeStatus()
  if(!rqv.activities[id]){const{data}=await sb.from('collab_request_activities').select('type,content,icon,created_at').eq('request_id',id).order('created_at',{ascending:true});if(!rqv||rqv.ctx.stale)return;rqv.activities[id]=data||[]}
  renderDetail(r,rqv.activities[id]);document.getElementById('detail-overlay').classList.add('open');document.getElementById('detail-panel').classList.add('open');document.body.style.overflow='hidden'
}
window.closeDetail=function(){document.getElementById('detail-overlay')?.classList.remove('open');document.getElementById('detail-panel')?.classList.remove('open');document.body.style.overflow=''}
function renderDetail(r,activities){
  const subject=`Re: Kooperationsanfrage von ${r.sender_name}`
  const body=`Hallo ${r.sender_name},\n\nVielen Dank für deine Anfrage. Ich freue mich über dein Interesse an einer Zusammenarbeit.\n\n\n\n------- Deine ursprüngliche Anfrage -------\n${r.message||''}`
  const mailtoHref=`mailto:${r.sender_email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`
  document.getElementById('detail-content').innerHTML=`<div class="detail-header"><div class="detail-initial">${escHtml(r.sender_initial||r.sender_name?.[0]||'?')}</div><div><div class="detail-name">${escHtml(r.sender_name)}</div><div class="detail-email">${escHtml(r.sender_email)}</div></div><button class="detail-close" onclick="closeDetail()">✕</button></div>
    <div class="detail-section"><div class="detail-pills"><span class="detail-pill"><span class="req-type-badge ${typeClass(r.request_type)}" style="margin:0">${typeLabel(r.request_type)}</span></span>${r.budget?`<span class="detail-pill">💰 € ${Number(r.budget).toLocaleString('de-DE')}</span>`:''}${r.sender_website?`<a class="detail-pill" href="${escHtml(r.sender_website)}" target="_blank" rel="noopener">🌐 Website ↗</a>`:''}<span class="detail-pill">📅 ${fmtFull(r.created_at)}</span></div></div>
    ${r.message?`<div class="detail-section"><div class="detail-label">Nachricht</div><div class="detail-message">${escHtml(r.message)}</div></div>`:''}
    <div class="detail-actions"><a class="btn-action btn-primary-action" href="${mailtoHref}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Per E-Mail antworten</a></div>
    <div class="detail-section"><div class="detail-label">Status</div></div>
    <div class="status-row">${['new','replied','negotiation','closed'].map(s=>`<button class="status-btn ${r.status===s?'current':''}" onclick="changeStatus('${r.id}','${s}')">${statusLabel(s)}</button>`).join('')}</div>
    <div class="detail-divider"></div>
    <div class="detail-section" style="padding-bottom:4px"><div class="detail-label">Notiz</div></div>
    <div class="note-area"><textarea class="note-field" id="note-field-${r.id}" rows="3" placeholder="Interne Notiz hinzufügen…">${escHtml(r.notes||'')}</textarea><button class="btn-save-note" onclick="saveNote('${r.id}')">Notiz speichern</button></div>
    <div class="detail-divider"></div>
    <div class="detail-section" style="padding-bottom:4px"><div class="detail-label">Verlauf</div></div>
    <div class="timeline">${activities.map(a=>`<div class="timeline-item"><div class="timeline-icon">${a.icon||'📌'}</div><div class="timeline-body"><div class="timeline-text">${escHtml(a.content)}</div><div class="timeline-time">${fmtFull(a.created_at)}</div></div></div>`).join()||'<div style="font-size:13px;color:var(--subtle);padding:8px 0">Kein Verlauf.</div>'}</div>
    <div class="detail-section" style="padding-bottom:4px"><button class="btn-action btn-secondary-action" style="width:100%;color:var(--red);border-color:rgba(192,57,43,.2)" onclick="deleteRequest('${r.id}')">Anfrage löschen</button></div>`
}
window.saveNote=async function(id){
  const field=document.getElementById(`note-field-${id}`);if(!field)return
  const notes=field.value.trim()
  await sb.from('collab_requests').update({notes}).eq('id',id)
  if(!rqv)return
  const r=rqv.requests.find(x=>x.id===id);if(r)r.notes=notes
  showToast('Notiz gespeichert ✓')
}
window.changeStatus=async function(id,newStatus){
  if(!rqv)return
  const r=rqv.requests.find(x=>x.id===id);if(!r||r.status===newStatus)return;const old=r.status;r.status=newStatus
  document.querySelectorAll('.status-btn').forEach(b=>b.classList.toggle('current',b.textContent.trim()===statusLabel(newStatus)))
  await sb.from('collab_requests').update({status:newStatus}).eq('id',id)
  if(!rqv)return
  await sb.from('collab_request_activities').insert({request_id:id,creator_id:rqv.uid,type:'status_changed',content:`Status geändert: ${statusLabel(old)} → ${statusLabel(newStatus)}`,icon:'🔄'})
  if(!rqv)return
  delete rqv.activities[id];updateBadges();renderReqList();showToast(`Status: ${statusLabel(newStatus)}`)
}
window.deleteRequest=async function(id){
  if(!confirm('Anfrage wirklich löschen?'))return
  await sb.from('collab_requests').update({deleted_at:new Date().toISOString(),status:'deleted'}).eq('id',id)
  if(!rqv)return
  rqv.requests=rqv.requests.filter(r=>r.id!==id);closeDetail();updateBadges();renderReqList();showToast('Gelöscht')
}

// ── Passwort Sheet ──
window.openPasswordSheet=function(){
  document.getElementById('sheet-new-pw').value=''
  document.getElementById('sheet-new-pw2').value=''
  document.getElementById('pw-sheet-hint').textContent=''
  const btn=document.getElementById('btn-save-pw')
  btn.disabled=true;btn.style.opacity='.5'
  document.getElementById('password-modal').classList.remove('hidden')
  document.body.style.overflow='hidden'
  setTimeout(()=>document.getElementById('sheet-new-pw')?.focus(),100)
}
window.closePasswordModal=function(){
  document.getElementById('password-modal')?.classList.add('hidden')
  document.body.style.overflow=''
}
window.checkPwSheet=function(){
  const pw=document.getElementById('sheet-new-pw').value
  const hint=document.getElementById('pw-sheet-hint')
  const btn=document.getElementById('btn-save-pw')
  if(!pw){hint.textContent='';btn.disabled=true;btn.style.opacity='.5';return}
  if(pw.length<8){
    hint.textContent='Mindestens 8 Zeichen erforderlich.'
    hint.style.color='var(--red)';btn.disabled=true;btn.style.opacity='.5';return
  }
  hint.textContent='✓ Passwort sieht gut aus';hint.style.color='var(--green)'
  btn.disabled=false;btn.style.opacity='1'
}
window.saveNewPassword=async function(){
  const pw=document.getElementById('sheet-new-pw').value
  const pw2=document.getElementById('sheet-new-pw2').value
  if(pw.length<8){showToast('Mindestens 8 Zeichen.');return}
  if(pw!==pw2){showToast('Passwörter stimmen nicht überein.');return}
  const btn=document.getElementById('btn-save-pw')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const{error}=await sb.auth.updateUser({password:pw})
  if(!document.getElementById('btn-save-pw'))return
  btn.disabled=false;btn.textContent='Passwort speichern'
  if(error){showToast('Fehler: '+error.message,4000);return}
  closePasswordModal()
  showToast('Passwort gespeichert ✓')
}

// ── Newsletter Toggle ──
window.toggleNewsletter=async function(subscribe){
  if(!pv)return
  if(subscribe){
    const email=pv.user.email
    if(!email){showToast('Keine E-Mail-Adresse gefunden.');return}
    await sb.from('newsletter_subscribers').upsert({
      email,user_id:pv.uid,source:'profile',status:'active',subscribed_at:new Date().toISOString()
    },{onConflict:'email'})
    await sb.from('users').update({newsletter_subscribed:true}).eq('id',pv.uid)
    if(!pv)return
    pv.isSubscribed=true
    showToast('Newsletter abonniert ✓')
  } else {
    await sb.from('newsletter_subscribers').update({status:'unsubscribed',unsubscribed_at:new Date().toISOString()}).eq('user_id',pv.uid)
    await sb.from('users').update({newsletter_subscribed:false}).eq('id',pv.uid)
    if(!pv)return
    pv.isSubscribed=false
    showToast('Newsletter abgemeldet')
  }
  // Re-render profile to update button state
  paintProfile()
}

// ── Username Sheet ──
window.openUsernameSheet=function(){
  const input=document.getElementById('sheet-new-username')
  const status=document.getElementById('username-status')
  const btn=document.getElementById('btn-save-username')
  if(input)input.value=''
  if(status)status.textContent=''
  if(btn){btn.disabled=true;btn.style.opacity='.5'}
  document.getElementById('username-modal').classList.remove('hidden')
  document.body.style.overflow='hidden'
  setTimeout(()=>input?.focus(),100)
}
window.closeUsernameSheet=function(){
  document.getElementById('username-modal')?.classList.add('hidden')
  document.body.style.overflow=''
}
window.closeUsernameModal=window.closeUsernameSheet
window.checkUsernameAvailability=async function(){
  const input=document.getElementById('sheet-new-username')
  const status=document.getElementById('username-status')
  const btn=document.getElementById('btn-save-username')
  const val=input.value.trim()
  clearTimeout(_usernameTimer)
  btn.disabled=true;btn.style.opacity='.5'
  if(!val){status.textContent='';return}
  if(val.toLowerCase()===pv?.profile?.display_name?.toLowerCase()){status.style.color='var(--muted)';status.textContent='Das ist bereits dein Username.';return}
  if(!/^[a-zA-Z0-9_]{3,30}$/.test(val)){status.style.color='var(--red)';status.textContent='3–30 Zeichen, nur Buchstaben, Zahlen und _.';return}
  status.style.color='var(--muted)';status.textContent='Wird geprüft…'
  _usernameTimer=setTimeout(async()=>{
    // RPC umgeht RLS und prüft sicher gegen users + username_blacklist
    const{data:result,error}=await sb.rpc('check_username_available',{p_username:val})
    if(!document.getElementById('username-status'))return
    if(error){
      status.style.color='var(--red)';status.textContent='Fehler bei Prüfung'
      btn.disabled=true;btn.style.opacity='.5';return
    }
    if(result==='reserved'){
      status.style.color='var(--red)';status.textContent='❌ Dieser Username ist reserviert.'
      btn.disabled=true;btn.style.opacity='.5'
    } else if(result==='taken'){
      status.style.color='var(--red)';status.textContent='❌ Leider vergeben.'
      btn.disabled=true;btn.style.opacity='.5'
    } else if(result==='invalid_format'){
      status.style.color='var(--red)';status.textContent='3–30 Zeichen, nur Buchstaben, Zahlen und _.'
      btn.disabled=true;btn.style.opacity='.5'
    } else if(result==='available'){
      status.style.color='var(--green)';status.textContent='✓ Verfügbar!'
      btn.disabled=false;btn.style.opacity='1'
    } else {
      status.style.color='var(--red)';status.textContent='Unbekannte Antwort'
      btn.disabled=true;btn.style.opacity='.5'
    }
  },500)
}
window.confirmUsernameChange=function(){
  const newName=document.getElementById('sheet-new-username').value.trim()
  if(!newName)return
  closeUsernameSheet()
  showModal(
    `Username ändern zu "${newName}"?`,
    null,
    'Ja, Username ändern',
    ()=>commitUsername(newName),
    'Dein BioLink und Media Kit werden deaktiviert. Die alten URLs (' + (pv?.profile?.display_name?'viuno.de/'+pv.profile.display_name.toLowerCase():'alte URL') + ') funktionieren danach nicht mehr. Du musst BioLink und Media Kit mit dem neuen Username neu erstellen.'
  )
}
async function commitUsername(newName){
  closeModal()
  showToast('Username wird geändert…',5000)
  const{data:{session}}=await sb.auth.getSession()
  if(!session){showToast('Session abgelaufen');location.reload();return}
  try{
    const res=await fetch(`${SUPABASE_URL}/functions/v1/change-username`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'},
      body:JSON.stringify({new_username:newName})
    })
    const body=await res.json().catch(()=>({}))
    if(!res.ok||body.success!==true){
      showToast('Fehler: '+(body.error||'Unbekannt'),5000)
      return
    }
    showToast('Username geändert ✓ — bitte BioLink & Media Kit neu erstellen',5000)
    if(state.route==='profile')router()
  }catch(err){
    showToast('Fehler: '+err.message,5000)
  }
}

// ── E-Mail ändern ──
window.openEmailModal=function(){
  showModal(
    'E-Mail-Adresse ändern',
    `<div style="margin-bottom:12px">Aktuelle E-Mail: <strong>${escHtml(pv.user.email)}</strong></div>
     <div class="field" style="margin:0"><label style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px">Neue E-Mail</label>
     <input type="email" id="modal-new-email" placeholder="neue@email.de" style="width:100%;padding:11px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;color:var(--text);background:var(--bg);outline:none"/></div>`,
    'Bestätigungsmail senden',
    commitEmailChange,
    null
  )
}
async function commitEmailChange(){
  const input=document.getElementById('modal-new-email')
  const newEmail=input?.value?.trim()
  if(!newEmail||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)){showToast('Bitte gültige E-Mail eingeben.');return}
  if(newEmail===pv?.user.email){showToast('Das ist bereits deine E-Mail.');return}
  const btn=document.getElementById('modal-confirm-btn')
  if(btn){btn.disabled=true;btn.textContent='Wird gesendet…'}
  const{error}=await sb.auth.updateUser({email:newEmail})
  closeModal()
  if(error){showToast('Fehler: '+error.message,5000);return}
  showToast('Bestätigungsmail gesendet! Bitte prüfe dein Postfach.',5000)
}

// ── Account löschen ──
window.openDeleteModal=function(){
  showModal(
    'Account löschen?',
    'Alle deine Daten, BioLink-Seite und Media Kit werden dauerhaft gelöscht.',
    'Weiter',
    showDeleteConfirm,
    null
  )
}
function showDeleteConfirm(){
  showModal(
    'Wirklich unwiderruflich löschen?',
    null,
    'Ja, Account jetzt löschen',
    commitDeleteAccount,
    'Diese Aktion kann nicht rückgängig gemacht werden. Dein Account wird sofort gelöscht.'
  )
}
async function commitDeleteAccount(){
  const btn=document.getElementById('modal-confirm-btn')
  if(btn){btn.disabled=true;btn.textContent='Wird gelöscht…'}
  try{
    const{data:{session}}=await sb.auth.getSession()
    if(!session){showToast('Session abgelaufen');navigate('#/login');return}
    const res=await fetch(`${SUPABASE_URL}/functions/v1/delete-account`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json().catch(()=>({}))
    if(!res.ok&&body.success!==true){closeModal();showToast('Fehler: '+(body.error||'Unbekannt'),5000);return}
    await sb.auth.signOut()
    location.replace('https://viuno.de')
  }catch(err){
    closeModal();showToast('Fehler: '+err.message,5000)
  }
}

window.saveProfile=async function(){
  if(!pv)return
  const btn=document.getElementById('btn-save'),successEl=document.getElementById('save-success')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Speichern…';successEl.classList.add('hidden')
  const ig=document.getElementById('edit-ig').value.trim().replace(/^@/,''),tt=document.getElementById('edit-tt').value.trim().replace(/^@/,'')
  const patch={full_name:document.getElementById('edit-fullname').value.trim()||null,bio:document.getElementById('edit-bio').value.trim()||null,instagram_handle:ig||null,tiktok_handle:tt||null,city:document.getElementById('edit-city').value.trim()||null,niche_category:pv.niche,updated_at:new Date().toISOString()}
  const{error}=await sb.from('users').update(patch).eq('id',pv.uid)
  if(!pv||!document.getElementById('btn-save'))return
  btn.disabled=false;btn.textContent='Speichern'
  if(error){showToast('Fehler: '+error.message,4000);return}
  Object.assign(pv.profile,patch);successEl.classList.remove('hidden');setTimeout(()=>document.getElementById('save-success')?.classList.add('hidden'),3000);showToast('Profil gespeichert ✓')
}

async function onPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Bild zu groß. Max. 5 MB.');return}
  const reader=new FileReader()
  reader.onload=(ev)=>{const wrap=document.querySelector('.photo-wrap');if(!wrap)return;const ex=wrap.querySelector('img,.profile-photo-fallback');if(ex)ex.remove();const img=document.createElement('img');img.className='profile-photo';img.src=ev.target.result;wrap.insertBefore(img,wrap.querySelector('.photo-edit-btn'))}
  reader.readAsDataURL(file);showToast('Wird hochgeladen…',8000)
  const uid=pv?pv.uid:state.session.user.id
  const path=`${uid}/${Date.now()}.${file.name.split('.').pop()}`
  const{error}=await sb.storage.from('profile-images').upload(path,file,{upsert:true})
  if(error){showToast('Upload fehlgeschlagen: '+error.message,4000);return}
  const{data:{publicUrl}}=sb.storage.from('profile-images').getPublicUrl(path)
  await sb.from('users').update({profile_image_url:publicUrl}).eq('id',uid)
  if(pv)pv.profile.profile_image_url=publicUrl
  /* Avatar in der Topbar mitziehen — die alte Seite lud die Seite dafuer neu */
  if(state.profile){state.profile.profile_image_url=publicUrl;paintUser()}
  showToast('Profilbild gespeichert ✓');e.target.value=''
}
