<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>viuno · App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f5f4f2;
  --surface: #ffffff;
  --surface2: #f0efed;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.13);
  --text: #111110;
  --muted: #7a7975;
  --subtle: #b0afa9;
  --green: #1a7f4b;
  --green-bg: #edf7f1;
  --red: #c0392b;
  --red-bg: #fdf0ef;
  --orange: #b85c00;
  --orange-bg: #fdf3e7;
  --radius: 16px;
  --radius-sm: 10px;
  --nav-h: 56px;
  --sidebar-w: 272px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  background: var(--bg);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  color: var(--text);
  font-size: 14px;
}

/* ─── BOOT ─── */
#boot { min-height: 100dvh; display: grid; place-items: center; }
.boot-spinner { width: 22px; height: 22px; border: 2px solid var(--border-strong); border-top-color: var(--text); border-radius: 50%; animation: spin .6s linear infinite; }

/* ─── SHELL ─── */
#shell { display: none; min-height: 100dvh; }
#shell.visible { display: block; }

/* ─── MENU (one definition — sidebar on desktop, drawer on mobile) ─── */
.sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 80; pointer-events: none; transition: background .25s; }
.sidebar-overlay.open { background: rgba(0,0,0,.35); pointer-events: auto; }

.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
  background: var(--surface); z-index: 90;
  transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.32,.72,0,1);
  display: flex; flex-direction: column;
  box-shadow: 4px 0 24px rgba(0,0,0,.08);
}
.sidebar.open { transform: translateX(0); }
.sidebar-header { padding: 20px 20px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.sidebar-logo { display: flex; align-items: center; gap: 8px; }
.sidebar-logo-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--text); color: white; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.sidebar-logo-text { font-size: 16px; font-weight: 700; letter-spacing: -.03em; }
.sidebar-close { width: 32px; height: 32px; border-radius: 99px; background: var(--surface2); border: none; cursor: pointer; display: grid; place-items: center; font-size: 18px; color: var(--muted); line-height: 1; }
.sidebar-nav { flex: 1; padding: 10px; overflow-y: auto; }
.sidebar-section { font-size: 10px; font-weight: 700; color: var(--subtle); text-transform: uppercase; letter-spacing: .08em; padding: 12px 10px 4px; }
.sidebar-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 500; transition: all .15s; margin-bottom: 2px; }
.sidebar-item:hover { background: var(--surface2); color: var(--text); }
.sidebar-item.active { background: var(--text); color: white; }
.sidebar-item svg { flex-shrink: 0; }
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
.sidebar-user { font-size: 12px; color: var(--muted); margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-sidebar-logout { width: 100%; padding: 10px; border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--border-strong); font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; }
.btn-sidebar-logout:hover { background: var(--border); }

/* ─── TOPBAR ─── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(245,244,242,.92); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 20px; height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.hamburger { width: 36px; height: 36px; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border-radius: 8px; transition: background .15s; padding: 0; }
.hamburger:hover { background: var(--surface2); }
.hamburger span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; }
.topbar-title { font-size: 15px; font-weight: 700; letter-spacing: -.03em; }
.topbar-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--text); color: white; display: grid; place-items: center; font-size: 12px; font-weight: 600; cursor: pointer; border: 2px solid var(--border); overflow: hidden; flex-shrink: 0; }
.topbar-avatar img { width: 100%; height: 100%; object-fit: cover; }

/* ─── MAIN ─── */
.main { display: flex; flex-direction: column; min-height: 100dvh; }
.page { flex: 1; padding-bottom: 24px; }
#content-area { min-height: 40dvh; }

/* ─── FOOTER ─── */
.app-footer { border-top: 1px solid var(--border); padding: 18px 20px calc(20px + var(--safe-bottom)); }
.footer-links { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.footer-links a { font-size: 12px; color: var(--muted); text-decoration: none; }
.footer-links a:hover { color: var(--text); text-decoration: underline; }
.footer-copy { font-size: 11px; color: var(--subtle); margin-top: 10px; }

/* ─── AUTH MODE (login / register: no menu, no topbar) ─── */
#shell.auth-mode .sidebar,
#shell.auth-mode .sidebar-overlay,
#shell.auth-mode .topbar { display: none !important; }
#shell.auth-mode .main { padding-left: 0 !important; }
/* margin:auto statt align-items:center — zentriert, schneidet aber
   lange Formulare (Register) oben nicht ab */
#shell.auth-mode .page { display: flex; padding: 24px; }
#shell.auth-mode #content-area { margin: auto; width: 100%; max-width: 380px; min-height: 0; }

/* ─── DESKTOP: sidebar permanently visible ─── */
@media (min-width: 900px) {
  .hamburger { display: none; }
  .sidebar-close { display: none; }
  .sidebar { transform: translateX(0); box-shadow: none; border-right: 1px solid var(--border); }
  .sidebar-overlay { display: none; }
  .main { padding-left: var(--sidebar-w); }
  .topbar { padding-left: 24px; }
}

/* ═══ VIEW: LOGIN + REGISTER (aus /login/ und /register/) ═══ */
.view-auth .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
.view-auth .logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--text); color: white; display: grid; place-items: center; font-size: 16px; font-weight: 700; }
.view-auth .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -.04em; }
.view-auth .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; }
.view-auth .card-title { font-size: 20px; font-weight: 700; letter-spacing: -.03em; margin-bottom: 4px; }
.view-auth .card-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.view-auth .field { margin-bottom: 14px; }
.view-auth .field input { padding: 12px 14px; }
.view-auth .field input.invalid { border-color: var(--red); }
.view-auth .field-hint { font-size: 11px; color: var(--subtle); margin-top: 5px; }
.view-auth .field-hint.error { color: var(--red); }
.view-auth .btn-primary { width: 100%; padding: 13px; background: var(--text); color: white; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .15s; }
.view-auth .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.view-auth .error-msg { font-size: 12px; color: var(--red); background: var(--red-bg); border: 1px solid rgba(192,57,43,.15); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 12px; display: none; }
.view-auth .error-msg.show { display: block; }
.view-auth .link-row { text-align: center; font-size: 13px; color: var(--muted); margin-top: 20px; }
.view-auth .link-row a { color: var(--text); font-weight: 600; text-decoration: none; }
.view-auth .link-row a:hover { text-decoration: underline; }
.view-auth .section-divider { height: 1px; background: var(--border); margin: 20px 0; }
.view-auth .niche-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.view-auth .niche-btn { padding: 10px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface2); font-family: inherit; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; text-align: center; transition: all .15s; }
.view-auth .niche-btn.active { background: var(--text); color: white; border-color: var(--text); }
.view-auth .legal-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 14px; }
.view-auth .legal-check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
.view-auth .legal-check input[type="checkbox"] { width: 18px; height: 18px; margin-top: 1px; flex-shrink: 0; accent-color: var(--text); cursor: pointer; }
.view-auth .legal-check span { font-size: 12px; color: var(--muted); line-height: 1.55; }
.view-auth .legal-check a { color: var(--text); font-weight: 600; text-decoration: none; }
.view-auth .legal-check a:hover { text-decoration: underline; }
.view-auth .success-state { display: none; flex-direction: column; align-items: center; text-align: center; padding: 40px 24px; }
.view-auth .success-state.show { display: flex; }
.view-auth .success-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--green-bg); color: var(--green); display: grid; place-items: center; font-size: 28px; margin-bottom: 20px; }
.view-auth .success-title { font-size: 20px; font-weight: 700; letter-spacing: -.03em; margin-bottom: 8px; }
.view-auth .success-sub { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 280px; }
.view-auth .success-email { font-weight: 600; color: var(--text); }
/* iOS-Zoom-Fix wie in /login/ und /register/ — bewusst nur hier */
.view-auth input, .view-auth textarea, .view-auth select { font-size: 16px !important; }

/* Onboarding-Zwischenseite nutzt weiter die schlichte Karte */
.login-card { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px 28px; }
.login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.login-logo-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--text); color: white; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.login-logo-text { font-size: 17px; font-weight: 700; letter-spacing: -.03em; }
.login-title { font-size: 20px; font-weight: 700; letter-spacing: -.03em; margin-bottom: 4px; }
.login-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.field input, .field textarea, .field select { width: 100%; padding: 11px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; color: var(--text); background: var(--bg); outline: none; transition: border-color .15s; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--text); }
.field textarea { resize: none; line-height: 1.5; }
.btn-login { width: 100%; padding: 12px; margin-top: 8px; background: var(--text); color: white; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }
.login-switch { font-size: 12px; color: var(--muted); margin-top: 18px; text-align: center; }
.login-switch a { color: var(--text); font-weight: 600; text-decoration: none; }
.login-switch a:hover { text-decoration: underline; }

/* ─── PAGE HEADER / PLACEHOLDER ─── */
.page-header { padding: 22px 20px 0; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -.04em; }
.page-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.section { padding: 16px 20px 0; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-title { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -.02em; }
.placeholder-card {
  background: var(--surface); border: 1px dashed var(--border-strong);
  border-radius: var(--radius); padding: 40px 24px; text-align: center;
}
.placeholder-icon { font-size: 30px; margin-bottom: 10px; }
.placeholder-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.placeholder-sub { font-size: 13px; color: var(--muted); line-height: 1.55; }
.placeholder-route { display: inline-block; margin-top: 12px; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--subtle); background: var(--surface2); border-radius: 99px; padding: 4px 10px; }

/* ─── MODAL (overlay + slide-up sheet) ─── */
.modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0); pointer-events: none; transition: background .25s; }
.modal-overlay.open { background: rgba(0,0,0,0.35); pointer-events: auto; }
.modal-panel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 101;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  max-height: 92dvh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,.72,0,1);
  padding-bottom: calc(24px + var(--safe-bottom));
}
.modal-panel.open { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 12px auto 0; }
.modal-header { padding: 14px 20px 0; display: flex; align-items: flex-start; gap: 14px; }
.modal-title { font-size: 18px; font-weight: 700; letter-spacing: -.02em; color: var(--text); }
.modal-close { margin-left: auto; width: 32px; height: 32px; border-radius: 99px; background: var(--surface2); border: none; cursor: pointer; flex-shrink: 0; display: grid; place-items: center; font-size: 16px; color: var(--muted); }
.modal-body { padding: 16px 20px 0; font-size: 13px; color: var(--text); line-height: 1.6; }
@media (min-width: 900px) {
  .modal-panel { left: 50%; right: auto; bottom: auto; top: 50%; width: 440px; max-width: calc(100vw - 48px); border-radius: 20px; transform: translate(-50%, -46%) scale(.98); opacity: 0; transition: opacity .2s, transform .2s; }
  .modal-panel.open { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .modal-handle { display: none; }
  .modal-header { padding-top: 20px; }
}

/* ═══ VIEW: DASHBOARD (aus /dashboard/) ═══ */
.greeting-section{padding:22px 20px 0}
.greeting-hi{font-size:22px;font-weight:700;letter-spacing:-.04em}
.greeting-date{font-size:13px;color:var(--muted);margin-top:3px}

.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;text-decoration:none;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .1s;cursor:pointer}
.dash-card:hover{border-color:var(--border-strong)}
.dash-card:active{transform:scale(.97)}
.dash-card-dark{background:var(--text);border-color:var(--text)}
.dash-card-dark .dash-card-label{color:rgba(255,255,255,.5)}
.dash-card-dark .dash-card-value{color:white}
.dash-card-dark .dash-card-sub{color:rgba(255,255,255,.45)}
.dash-card-dark .dash-card-icon{color:white}
.dash-card-label{font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dash-card-value{font-size:28px;font-weight:700;color:var(--text);letter-spacing:-.04em;line-height:1.1;margin-top:4px}
.dash-card-sub{font-size:11px;color:var(--subtle);margin-top:2px}
.dash-card-icon{font-size:24px;margin-bottom:6px}
.dash-card-icon-only{justify-content:center;align-items:flex-start;padding:20px 16px}

.dash-digest-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;cursor:pointer}
.dash-digest-card.expanded .dash-card-body-full{display:block}
.dash-digest-card.expanded .dash-card-chevron{transform:rotate(180deg)}
.dash-card-image{width:100%;height:120px;object-fit:cover;background:var(--surface2);display:block}
.dash-card-image-fallback{width:100%;height:120px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:28px}
.dash-card-inner{padding:12px 14px}
.dash-card-meta{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.dash-platform-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.pb-tiktok{background:#f0f9ff;color:#0891b2}.pb-instagram{background:#fdf2f8;color:#9d174d}.pb-youtube{background:#fff7ed;color:#c2410c}.pb-meta{background:#eff6ff;color:#1d4ed8}.pb-allgemein{background:var(--surface2);color:var(--muted)}
.dash-card-source{font-size:11px;color:var(--subtle);margin-left:auto}
.dash-card-chevron{font-size:12px;color:var(--subtle);transition:transform .2s;margin-left:4px}
.dash-card-headline{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.02em;line-height:1.35;margin-bottom:5px}
.dash-card-summary{font-size:13px;color:var(--muted);line-height:1.5}
.dash-card-body-full{display:none;border-top:1px solid var(--border);padding-top:12px;margin-top:10px}
.dash-card-full-text{font-size:13px;color:var(--muted);line-height:1.7;white-space:pre-line}
.dash-card-impact{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;margin-top:10px}
.dash-card-impact-label{font-size:10px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.dash-card-impact-text{font-size:12px;color:var(--text);line-height:1.5;font-weight:500}
.dash-card-actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.dash-card-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--text);text-decoration:none;padding:6px 12px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface)}
.dash-card-share{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit}

.newsletter-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px}
.newsletter-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.newsletter-sub{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.newsletter-row{display:flex;gap:8px}
.newsletter-input{flex:1;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-family:inherit;font-size:16px;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
.newsletter-input:focus{border-color:var(--text)}
.newsletter-btn{padding:10px 16px;background:var(--text);color:white;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.newsletter-btn:disabled{opacity:.5;cursor:not-allowed}
.newsletter-success{font-size:12px;color:var(--green);margin-top:8px;display:none}

/* ═══ VIEW: PROFIL (aus /profile/) ═══
   .section und .section-label sind hier auf .view-profile begrenzt,
   weil /profile/ 20px Padding nutzt, die Shell aber 16px. */
.view-profile .section { padding: 20px 20px 0; }
.view-profile .section-label { font-size: 10px; font-weight: 600; color: var(--subtle); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px; }

.profile-hero { padding: 24px 20px 0; display: flex; align-items: flex-start; gap: 16px; }
.profile-photo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid var(--border-strong); background: var(--surface2); }
.profile-photo-fallback { width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0; background: var(--text); color: white; display: grid; place-items: center; font-size: 26px; font-weight: 700; border: 2px solid var(--border-strong); }
.photo-wrap { position: relative; width: 72px; height: 72px; flex-shrink: 0; cursor: pointer; }
.photo-edit-btn { position: absolute; bottom: 0; right: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--text); color: white; display: grid; place-items: center; font-size: 11px; border: 2px solid var(--surface); pointer-events: none; }
.photo-upload-status { font-size: 11px; color: var(--muted); margin-top: 4px; min-height: 16px; }
.profile-info { flex: 1; min-width: 0; }
.profile-name { font-size: 20px; font-weight: 700; letter-spacing: -.03em; color: var(--text); }
.profile-handle { font-size: 13px; color: var(--muted); margin-top: 2px; }
.profile-plan { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px; }
.plan-free { background: var(--surface2); color: var(--muted); border: 1px solid var(--border-strong); }
.plan-pro { background: #111110; color: white; }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 16px 20px 0; }
.stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
.stat-box-value { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -.03em; }

.biolink-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.biolink-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.biolink-url { font-size: 13px; font-weight: 500; color: var(--text); }

.status-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px; }
.si-active { background: var(--green-bg); color: var(--green); }
.si-inactive { background: var(--surface2); color: var(--subtle); border: 1px solid var(--border-strong); }
.biolink-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.biolink-stat { text-align: center; }
.biolink-stat-val { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
.biolink-stat-label { font-size: 10px; color: var(--muted); margin-top: 1px; }
.biolink-sources { display: flex; gap: 6px; flex-wrap: wrap; }

.edit-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.edit-card .field { margin-bottom: 10px; }
.edit-card .field:last-child { margin-bottom: 0; }
.edit-card .field label { font-size: 11px; }
.handle-input-wrap { display: flex; align-items: center; }
.handle-prefix { padding: 11px 10px 11px 14px; border: 1px solid var(--border-strong); border-right: none; border-radius: var(--radius-sm) 0 0 var(--radius-sm); font-size: 14px; color: var(--muted); background: var(--surface2); }
.handle-input-wrap input { border-radius: 0 var(--radius-sm) var(--radius-sm) 0 !important; }
.niche-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.niche-btn { padding: 8px 4px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 500; font-family: inherit; cursor: pointer; text-align: center; transition: all .15s; }
.niche-btn.active { background: var(--text); color: white; border-color: var(--text); }

.btn-save { width: 100%; padding: 13px; margin-top: 14px; background: var(--text); color: white; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s; }

/* ─── TOAST ─── */

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

/* ─────────────────────────────────────────────
   Supabase — identisch zu /trends/, /dashboard/ …
   ───────────────────────────────────────────── */
const SUPABASE_URL  = 'https://bzejndghppuipnedasuv.supabase.co'
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6ZWpuZGdocHB1aXBuZWRhc3V2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTMxOTcsImV4cCI6MjA4OTIyOTE5N30.TShH1cIABQCtKgLkhCS9ymUJ36ZUYnlvCnGTok6EKTo'

const sb = createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { persistSession: true, autoRefreshToken: true } })

/* ─── State ─── */
const state = {
  session: null,
  profile: null,        // { display_name, full_name, profile_image_url, onboarding_completed }
  route: null,
  booted: false
}

/* ─────────────────────────────────────────────
   Geteilte Utils
   Die alten Seiten hatten je eigene Formatierer. Wo sie identisch
   waren, gibt es hier eine Funktion; wo sie sich unterscheiden,
   bleiben getrennte Funktionen mit sprechendem Namen erhalten,
   damit jede View exakt so formatiert wie vorher.
   ───────────────────────────────────────────── */

/* identisch in allen alten Seiten */
function escHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

/* aus /dashboard/ und /analytic/ (dort identisch) */
function fmt(n, digits = 1) {
  if (n == null || n === '' || isNaN(Number(n))) return '–'
  n = Number(n)
  if (n >= 1_000_000) return (n/1_000_000).toFixed(digits).replace(/\.0$/,'') + 'M'
  if (n >= 1_000)     return (n/1_000).toFixed(digits).replace(/\.0$/,'') + 'k'
  return n.toFixed(0)
}

/* aus /profile/: eigene fmt-Variante — Fallback '0' statt '–' und
   unter 1000 lokalisiert statt gerundet. Bewusst getrennt gehalten,
   damit die Profil-Zahlen exakt wie vorher aussehen. */
function fmtCount(n) {
  if (n == null || isNaN(Number(n))) return '0'
  n = Number(n)
  if (n >= 1_000_000) return (n/1_000_000).toFixed(1).replace(/\.0$/,'') + 'M'
  if (n >= 1_000)     return (n/1_000).toFixed(1).replace(/\.0$/,'') + 'k'
  return n.toLocaleString('de-DE')
}

/* aus /dashboard/ */
function fmtEuro(n) {
  if (n == null || isNaN(+n)) return '–'
  return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(+n)
}
/* aus /dashboard/: fmtDate — nur Tag und Monat */
function fmtDateShort(d) {
  if (!d) return ''
  return new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
}

/* ─── Toast (aus /trends/) ─── */

/* ─── Modal (Overlay + Sheet, Muster aus /Requests/) ─── */
window.openModal = function(title, html) {

window.closeModal = function() {
  document.getElementById('modal-overlay').classList.remove('open')
  document.getElementById('modal-panel').classList.remove('open')
  document.body.style.overflow = ''
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal() })

/* ─── Sidebar (aus /dashboard/) ─── */
window.openSidebar  = () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-overlay').classList.add('open'); document.body.style.overflow = 'hidden' }
window.closeSidebar = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('open'); document.body.style.overflow = '' }

window.logout = async function() {
  await sb.auth.signOut()
  state.session = null
  state.profile = null
  closeSidebar()
  navigate('#/login')
}

window.navigate = function(hash) {
  if (location.hash === hash) { router() } else { location.hash = hash }
}

/* ─────────────────────────────────────────────
   ROUTES
   ───────────────────────────────────────────── */
const ROUTES = {
  login:      { title: 'Login',        render: renderLogin,      public: true },
  register:   { title: 'Registrieren', render: renderRegister,   public: true },
  onboarding: { title: 'Setup',        render: renderOnboarding, chromeless: true },
  dashboard:  { title: 'Dashboard',    render: renderDashboard },
  analytics:  { title: 'Analytics',    render: renderAnalytics },
  trends:     { title: 'Trends',       render: renderTrends },
  biolink:    { title: 'BioLink',      render: renderBiolink },
  mediakit:   { title: 'Media Kit',    render: renderMediakit },
  digest:     { title: 'Daily Digest', render: renderDigest },
  requests:   { title: 'Anfragen',     render: renderRequests },
  deals:      { title: 'Deals',        render: renderDeals },
  profile:    { title: 'Profil',       render: renderProfile }
}

const DEFAULT_ROUTE = 'dashboard'

/* ─────────────────────────────────────────────
   View-Lifecycle
   Jede View bekommt ein ctx: ctx.stale sagt, ob inzwischen
   weitergeklickt wurde (späte Query-Antworten dürfen dann nicht
   mehr ins DOM schreiben), ctx.onCleanup registriert Listener,
   Intervalle und Subscriptions, die beim Verlassen abgeräumt werden.
   ───────────────────────────────────────────── */
let viewToken = 0
let viewCleanups = []

function runCleanups() {
  const fns = viewCleanups
  viewCleanups = []
  for (const fn of fns) { try { fn() } catch (e) { console.warn('cleanup failed', e) } }
}

function makeCtx() {
  const token = ++viewToken
  return {
    get stale() { return token !== viewToken },
    onCleanup(fn) { if (token === viewToken) viewCleanups.push(fn) },
    /* Listener, der sich beim Verlassen der View selbst abmeldet */
    on(target, type, handler, opts) {
      target.addEventListener(type, handler, opts)
      this.onCleanup(() => target.removeEventListener(type, handler, opts))
    },
    /* Intervall, das beim Verlassen der View gestoppt wird */
    interval(fn, ms) {
      const id = setInterval(fn, ms)
      this.onCleanup(() => clearInterval(id))
      return id
    }
  }
}

function currentRoute() {
  const raw = (location.hash || '').replace(/^#\/?/, '').split('?')[0].split('/')[0].trim().toLowerCase()
  return ROUTES[raw] ? raw : null
}

/* ─────────────────────────────────────────────
   ROUTER + Session-Guard
   Regeln (aus /dashboard/ übernommen):
     - keine Session            → #/login
     - Session + onboarding_completed === false → #/onboarding
     - Session + Default        → #/dashboard
   ───────────────────────────────────────────── */
async function router() {
  let name = currentRoute()

  // Ohne Session: nur öffentliche Routen
  if (!state.session) {
    if (!name || !ROUTES[name].public) { navigate('#/login'); return }
  } else {
    // Mit Session: Login/Register überspringen
    if (!name || ROUTES[name].public) { navigate('#/' + DEFAULT_ROUTE); return }
    // Profil unvollständig → Onboarding erzwingen
    if (needsOnboarding() && name !== 'onboarding') { navigate('#/onboarding'); return }
  }

  state.route = name
  const route = ROUTES[name]
  const chromeless = route.public || route.chromeless

  document.getElementById('shell').classList.toggle('auth-mode', !!chromeless)
  document.getElementById('topbar-title').textContent = route.title
  document.title = 'viuno · ' + route.title
  setActiveMenuItem(name)
  closeSidebar()
  closeModal()

  runCleanups()
  const ctx = makeCtx()

  const area = document.getElementById('content-area')
  area.innerHTML = ''
  window.scrollTo(0, 0)
  await route.render(area, ctx)
}

function setActiveMenuItem(name) {
  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === name)
  })
}

/* Wie in /dashboard/: nur ein explizites false erzwingt Onboarding. */
function needsOnboarding() {
  return state.profile ? state.profile.onboarding_completed === false : false
}

/* ─────────────────────────────────────────────
   Session laden
   ───────────────────────────────────────────── */
async function loadSession() {
  const { data: { session } } = await sb.auth.getSession()
  state.session = session || null
  state.profile = null
  if (session) await loadProfile(session.user.id)
  paintUser()
}

async function loadProfile(uid) {
  const { data } = await sb.from('users')
    .select('display_name, full_name, profile_image_url, onboarding_completed')
    .eq('id', uid).single()
  state.profile = data || null
}

function paintUser() {
  const av = document.getElementById('user-avatar')
  const mail = document.getElementById('sidebar-user-email')
  if (!state.session) { av.textContent = '?'; mail.textContent = ''; return }
  const p = state.profile
  const name = p?.display_name || p?.full_name || state.session.user.email || '?'
  if (p?.profile_image_url) av.innerHTML = `<img src="${escHtml(p.profile_image_url)}" alt="">`
  else av.textContent = name[0].toUpperCase()
  av.title = name
  mail.textContent = state.session.user.email || ''
}

/* ─────────────────────────────────────────────
   VIEWS
   ───────────────────────────────────────────── */

}

/* ═══════════════════════════════════════════════════════════════
   VIEW: LOGIN — übernommen aus public/login/index.html
   Fehlermeldungen, Enter-Verhalten und Validierung unverändert.
   Angepasst: location.replace('/dashboard') → Hash-Route, damit der
   Router die Onboarding-Weiche ziehen kann.
   ═══════════════════════════════════════════════════════════════ */
function renderLogin(area, ctx) {
  area.innerHTML = `
    <div class="view-auth">
      <div class="logo">
        <div class="logo-mark">v</div>
        <div class="logo-text">viuno</div>
      </div>
      <div class="card">
        <div class="card-title">Willkommen zurück.</div>
        <div class="card-sub">Melde dich mit deinem viuno-Account an.</div>
        <div class="field">
          <label>E-Mail</label>
          <input type="email" id="inp-email" placeholder="du@beispiel.de" autocomplete="email"/>
        </div>
        <div class="field">
          <label>Passwort</label>
          <input type="password" id="inp-pw" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button class="btn-primary" id="btn-login">Einloggen</button>
        <div class="error-msg" id="error-msg"></div>
        <div style="text-align:center;margin-top:14px">
          <a href="/reset-password" style="font-size:13px;color:var(--muted);text-decoration:none">Passwort vergessen?</a>
        </div>
      </div>
      <div class="link-row">
        Noch kein Account? <a href="#/register">Jetzt registrieren</a>
      </div>
    </div>`

  const emailEl = document.getElementById('inp-email')
  const pwEl    = document.getElementById('inp-pw')
  const btn     = document.getElementById('btn-login')
  const errEl   = document.getElementById('error-msg')

  function showError(msg){ errEl.textContent = msg; errEl.classList.add('show') }
  function hideError(){ errEl.classList.remove('show') }

  async function doLogin(){
    hideError()
    const email = emailEl.value.trim()
    const pw    = pwEl.value
    if(!email||!pw){ showError('Bitte E-Mail und Passwort eingeben.'); return }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw })
    if (ctx.stale) return
    btn.disabled = false; btn.textContent = 'Einloggen'
    if(error){
      if(error.message.includes('Invalid login')||error.message.includes('invalid_credentials')){
        showError('E-Mail oder Passwort falsch.')
      } else if(error.message.includes('Email not confirmed')){
        showError('Bitte bestätige zuerst deine E-Mail-Adresse.')
      } else {
        showError(error.message)
      }
      return
    }
    state.session = data.session
    await loadProfile(data.session.user.id)
    paintUser()
    navigate('#/' + DEFAULT_ROUTE)   // Router schickt ggf. weiter ins Onboarding
  }

  ctx.on(btn, 'click', doLogin)
  ctx.on(pwEl, 'keydown', e => { if(e.key==='Enter') doLogin() })
  ctx.on(emailEl, 'keydown', e => { if(e.key==='Enter') pwEl.focus() })
}

/* ═══════════════════════════════════════════════════════════════
   VIEW: REGISTER — übernommen aus public/register/index.html
   Username-Live-Check (RPC is_username_available, 500 ms Debounce),
   Passwort-Hinweis, Nischen-Grid, Legal-Checkbox, signUp-Optionen,
   users-Update und Success-Karte unverändert.
   ═══════════════════════════════════════════════════════════════ */
const NICHES_REGISTER = [
  ['lifestyle','Lifestyle'],['fashion','Fashion'],['beauty','Beauty'],['food','Food'],
  ['fitness','Fitness'],['travel','Travel'],['gaming','Gaming'],['music','Music'],
  ['comedy','Comedy'],['education','Bildung & Wissen'],['business','Business'],['tech','Tech'],
  ['art','Art'],['family','Family'],['mental_health','Mental Health'],['general','Allgemein']
]

function renderRegister(area, ctx) {
  area.innerHTML = `
    <div class="view-auth">
      <div class="logo">
        <div class="logo-mark">v</div>
        <div class="logo-text">viuno</div>
      </div>

      <!-- FORM -->
      <div class="card" id="form-card">
        <div class="card-title">Account erstellen.</div>
        <div class="card-sub">Starte kostenlos — kein Abo nötig.</div>

        <div class="field">
          <label>Username</label>
          <input type="text" id="inp-username" placeholder="z.B. maria_lifestyle" autocomplete="username"/>
          <div class="field-hint" id="username-hint">Dein öffentlicher Name auf viuno.de</div>
        </div>

        <div class="field">
          <label>E-Mail</label>
          <input type="email" id="inp-email" placeholder="du@beispiel.de" autocomplete="email"/>
        </div>

        <div class="field">
          <label>Passwort</label>
          <input type="password" id="inp-pw" placeholder="Mindestens 8 Zeichen" autocomplete="new-password"/>
          <div class="field-hint" id="pw-hint"></div>
        </div>

        <div class="field">
          <label>Passwort bestätigen</label>
          <input type="password" id="inp-pw2" placeholder="••••••••" autocomplete="new-password"/>
        </div>

        <div class="section-divider"></div>

        <div class="field">
          <label>Nische</label>
          <div class="niche-grid" id="niche-grid">
            ${NICHES_REGISTER.map(([key,label]) =>
              `<button class="niche-btn" data-niche="${key}">${label}</button>`).join('')}
          </div>
          <div class="field-hint" id="niche-hint" style="margin-top:8px">Bitte wähle deine Nische.</div>
        </div>

        <div class="section-divider"></div>

        <div class="legal-box">
          <label class="legal-check">
            <input type="checkbox" id="chk-legal"/>
            <span>Ich habe die <a href="/legal#agb" target="_blank">AGB</a> und <a href="/legal#datenschutz" target="_blank">Datenschutzerklärung</a> gelesen und akzeptiere sie.</span>
          </label>
        </div>

        <button class="btn-primary" id="btn-register">Account erstellen</button>
        <div class="error-msg" id="error-msg"></div>
      </div>

      <div class="link-row" id="login-link">
        Bereits registriert? <a href="#/login">Einloggen</a>
      </div>

      <!-- SUCCESS -->
      <div class="card success-state" id="success-card">
        <div class="success-icon">✉️</div>
        <div class="success-title">Fast geschafft!</div>
        <div class="success-sub">
          Wir haben eine Bestätigungsmail an<br>
          <span class="success-email" id="success-email"></span><br><br>
          gesendet. Klicke auf den Link in der Mail um deinen Account zu aktivieren und direkt loszulegen.
        </div>
      </div>
    </div>`

  let selectedNiche = null
  let usernameValid = false
  let _unameTimer = null
  /* Debounce-Timer stoppen, wenn die View verlassen wird */
  ctx.onCleanup(() => clearTimeout(_unameTimer))

  const $ = id => document.getElementById(id)

  function selectNiche(n){
    selectedNiche = n
    document.querySelectorAll('.niche-btn').forEach(b => b.classList.toggle('active', b.dataset.niche === n))
    $('niche-hint').style.display = 'none'
  }
  document.querySelectorAll('#niche-grid .niche-btn').forEach(b => {
    ctx.on(b, 'click', () => selectNiche(b.dataset.niche))
  })

  function onUsernameInput(){
    const val   = $('inp-username').value.trim()
    const hint  = $('username-hint')
    const input = $('inp-username')
    usernameValid = false
    clearTimeout(_unameTimer)

    if(!val){
      hint.textContent = 'Dein öffentlicher Name auf viuno.de'
      hint.className = 'field-hint'
      input.classList.remove('invalid')
      return
    }
    if(!/^[a-zA-Z0-9_]{3,30}$/.test(val)){
      hint.textContent = '3–30 Zeichen, nur Buchstaben, Zahlen und _'
      hint.className = 'field-hint error'
      input.classList.add('invalid')
      return
    }
    // Format ok — check availability after 500ms
    hint.textContent = 'Wird geprüft…'
    hint.className = 'field-hint'
    hint.style.color = 'var(--muted)'
    input.classList.remove('invalid')

    _unameTimer = setTimeout(async () => {
      const { data, error } = await sb.rpc('is_username_available', { p_username: val })
      if (ctx.stale) return
      if(error||!data){
        hint.textContent = 'Fehler beim Prüfen — bitte nochmal versuchen.'
        hint.className = 'field-hint error'
        return
      }
      if(data.available){
        hint.textContent = '✓ Verfügbar!'
        hint.className = 'field-hint'
        hint.style.color = 'var(--green)'
        input.classList.remove('invalid')
        usernameValid = true
      } else {
        const msgs = {
          taken:'Dieser Username ist leider vergeben.',
          reserved:'Dieser Username ist reserviert.',
          invalid_format:'Ungültiges Format.'
        }
        hint.textContent = msgs[data.reason]||'Nicht verfügbar.'
        hint.className = 'field-hint error'
        input.classList.add('invalid')
        usernameValid = false
      }
    }, 500)
  }
  ctx.on($('inp-username'), 'input', onUsernameInput)

  function checkPwStrength(){
    const pw = $('inp-pw').value
    const hint = $('pw-hint')
    if(!pw){ hint.textContent=''; return }
    if(pw.length<8){ hint.textContent='Zu kurz — mindestens 8 Zeichen.'; hint.className='field-hint error'; return }
    hint.textContent = '✓ Passwort sieht gut aus'
    hint.className = 'field-hint'; hint.style.color = 'var(--green)'
  }
  ctx.on($('inp-pw'), 'input', checkPwStrength)

  function showError(msg){
    const el = $('error-msg')
    el.textContent = msg; el.classList.add('show')
    el.scrollIntoView({ behavior:'smooth', block:'nearest' })
  }
  function hideError(){ $('error-msg').classList.remove('show') }

  async function doRegister(){
    hideError()
    const username = $('inp-username').value.trim()
    const email    = $('inp-email').value.trim()
    const pw       = $('inp-pw').value
    const pw2      = $('inp-pw2').value
    const legal    = $('chk-legal').checked

    if(!username){ showError('Bitte gib einen Username ein.'); return }
    if(!usernameValid){ showError('Bitte wähle einen verfügbaren Username.'); return }
    if(!email){ showError('Bitte gib deine E-Mail-Adresse ein.'); return }
    if(pw.length<8){ showError('Das Passwort muss mindestens 8 Zeichen lang sein.'); return }
    if(pw!==pw2){ showError('Die Passwörter stimmen nicht überein.'); return }
    if(!selectedNiche){
      $('niche-hint').style.display = 'block'
      $('niche-hint').textContent = 'Bitte wähle eine Nische.'
      $('niche-hint').className = 'field-hint error'
      showError('Bitte wähle deine Nische aus.'); return
    }
    if(!legal){ showError('Bitte akzeptiere AGB und Datenschutzerklärung.'); return }

    const btn = $('btn-register')
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Account wird erstellt…'

    // Final availability check before submit (race condition safety)
    const { data: check } = await sb.rpc('is_username_available', { p_username: username })
    if (ctx.stale) return
    if(!check?.available){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      showError('Dieser Username ist nicht mehr verfügbar. Bitte wähle einen anderen.'); return
    }

    // Sign up
    const { data, error } = await sb.auth.signUp({
      email,
      password: pw,
      options:{
        data:{ display_name: username, niche_category: selectedNiche },
        emailRedirectTo:'https://viuno.de/onboarding'
      }
    })
    if (ctx.stale) return

    if(error){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      if(error.message.includes('already registered')||error.message.includes('already been registered')){
        showError('Diese E-Mail-Adresse ist bereits registriert. Bitte logge dich ein.')
      } else {
        showError(error.message)
      }
      return
    }

    // Update users table (trigger creates the row, we set display_name + niche)
    if(data.user){
      await sb.from('users').update({
        display_name: username,
        niche_category: selectedNiche,
        updated_at: new Date().toISOString()
      }).eq('id', data.user.id)
    }
    if (ctx.stale) return

    // Show success
    btn.disabled = false; btn.textContent = 'Account erstellen'
    $('form-card').style.display = 'none'
    $('login-link').style.display = 'none'
    $('success-email').textContent = email
    $('success-card').classList.add('show')
  }

  ctx.on($('btn-register'), 'click', doRegister)
  ctx.on($('inp-pw2'), 'keydown', e => { if(e.key==='Enter') doRegister() })
}

    sb.from('bio_stats').select('views_today,views_last_7_days,views_total').eq('user_id',uid).single(),
    sb.from('user_goals').select('goal_type,target_value,current_value,deadline,platform,is_active,achieved').eq('user_id',uid).eq('is_active',true).eq('achieved',false).limit(3),
    sb.from('mediakit_settings').select('views_last_7_days').eq('user_id',uid).single(),
    sb.rpc('get_daily_text',{p_user_id:uid}),
    sb.from('analyse_stats').select('platform,followers,followers_change').eq('user_id',uid).order('created_at',{ascending:false}).limit(2),
  ])

  const d           = digestRes.data

  const reqs        = requestsRes.data || []
  const bs          = bioStatsRes.data
  const goals       = goalsRes.data || []

    : p?.total_followers

  // greeting: get_daily_text result or fallback
  const greetText = dailyText || (()=>{
    const h=new Date().getHours()
    return h<12?`Guten Morgen, ${name.split(' ')[0]}.`:h<18?`Guten Tag, ${name.split(' ')[0]}.`:`Guten Abend, ${name.split(' ')[0]}.`

          <div class="dash-card-sub">${newReqs===1?'Neue Anfrage':newReqs>1?'Neue Anfragen':'Keine neuen'}</div>
        </a>
      </div>
    </div>

    <!-- Row 2: BioLink + Media Kit -->
    <div class="section">
      <div class="dash-grid">
        <a class="dash-card" href="#/biolink">
          <div class="dash-card-label">BioLink</div>
          <div class="dash-card-value">${fmt(bs?.views_last_7_days)}</div>
          <div class="dash-card-sub">Aufrufe · 7 Tage</div>
        </a>
        <a class="dash-card" href="#/mediakit">
          <div class="dash-card-label">Media Kit</div>
          <div class="dash-card-value">${fmt(mk?.views_last_7_days)}</div>
          <div class="dash-card-sub">Aufrufe · 7 Tage</div>
        </a>
      </div>

    <!-- Daily Digest Karten — heute, ausklappbar, teilbar -->
    ${d&&cards.length?`<div class="section">
      <div class="section-header">
        <div class="section-title">Creator News</div>
        <a class="section-link" href="#/digest">Alle →</a>
      </div>
      <div id="dash-cards-list">${cards.map(c=>dashCardHtml(c)).join('')}</div>

    <!-- Newsletter unten — nur wenn nicht abonniert -->

      <div class="newsletter-box" id="nl-box-bottom">
        <div class="newsletter-title">📬 Hol dir die Creator News als Newsletter</div>
        <div class="newsletter-sub">Täglich die wichtigsten Updates — kostenlos in dein Postfach.</div>
        <div class="newsletter-row">
          <input type="email" class="newsletter-input" id="nl-email-bottom" placeholder="${escHtml(p?.email||'deine@email.de')}"/>

        </div>
        <div class="newsletter-success" id="nl-success-bottom">✓ Erfolgreich angemeldet!</div>
      </div>
    </div>`:`<div style="height:calc(24px + var(--safe-bottom))"></div>`}
  `

  // Wire up card interactions
  document.getElementById('dash-cards-list')?.querySelectorAll('.dash-digest-card').forEach(card=>{
    ctx.on(card,'click',()=>card.classList.toggle('expanded'))
  })
  document.getElementById('dash-cards-list')?.querySelectorAll('.dash-card-share').forEach(btn=>{
    ctx.on(btn,'click',e=>{e.stopPropagation();dashShareCard(btn.dataset.headline,btn.dataset.summary)})
  })
  const nlBtn = document.getElementById('nl-btn-bottom')
  if (nlBtn) ctx.on(nlBtn,'click',()=>subscribeNewsletter('bottom', uid, nlBtn))
}

// ── Digest card helpers ──
function dashPlatformLabel(p){return{tiktok:'TikTok',instagram:'Instagram',youtube:'YouTube',meta:'Meta',allgemein:'Allgemein'}[p]||p||'News'}
function dashPlatformClass(p){return{tiktok:'pb-tiktok',instagram:'pb-instagram',youtube:'pb-youtube',meta:'pb-meta'}[p]||'pb-allgemein'}
function dashPlatformEmoji(p){return{tiktok:'🎵',instagram:'📸',youtube:'📺',meta:'🔵'}[p]||'📰'}

function dashCardHtml(c){
  const hasFull=c.full_content?.trim()
  const hasExtra=hasFull||c.impact||c.source_url
  const shareBtn=`<button class="dash-card-share" data-headline="${escHtml(c.headline||'')}" data-summary="${escHtml(c.summary||'')}">↗ Teilen</button>`
  return`<div class="dash-digest-card">
    <div class="dash-card-inner">
      <div class="dash-card-meta">
        <span class="dash-platform-badge ${dashPlatformClass(c.platform)}">${dashPlatformLabel(c.platform)}</span>
        <span class="dash-card-source">${escHtml(c.source||'')}</span>
        ${hasExtra?'<span class="dash-card-chevron">▼</span>':''}
      </div>
      <div class="dash-card-headline">${escHtml(c.headline||'')}</div>
      <div class="dash-card-summary">${escHtml(c.summary||'')}</div>
      ${hasExtra?`<div class="dash-card-body-full">
        ${hasFull?`<div class="dash-card-full-text">${escHtml(c.full_content)}</div>`:''}
        ${c.impact?`<div class="dash-card-impact"><div class="dash-card-impact-label">⚡ Was das für dich bedeutet</div><div class="dash-card-impact-text">${escHtml(c.impact)}</div></div>`:''}
        <div class="dash-card-actions">
          ${c.source_url?`<a class="dash-card-link" href="${escHtml(c.source_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Quelle lesen ↗</a>`:''}
          ${shareBtn}
        </div>
      </div>`:''}
    </div>
  </div>`
}

async function dashShareCard(headline,summary){
  const text=`📰 ${headline}\n\n${summary?summary.slice(0,120)+'…':''}\n\nMehr Creator-News auf viuno.de`
  if(navigator.share){try{await navigator.share({title:headline,text,url:'https://viuno.de'});return}catch(_){}}
  try{await navigator.clipboard.writeText(text);showToast('In Zwischenablage kopiert ✓')}catch(_){showToast('Teilen nicht verfügbar')}
}

// ── Newsletter ──
/* Die alte Seite las den Button aus dem impliziten window.event —
   hier wird er uebergeben, Verhalten sonst identisch. */
async function subscribeNewsletter(pos, uid, btn){
  const inputId=pos==='top'?'nl-email-top':'nl-email-bottom'
  const successId=pos==='top'?'nl-success-top':'nl-success-bottom'
  const email=document.getElementById(inputId)?.value?.trim()
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showToast('Bitte gültige E-Mail eingeben.');return}
  btn.disabled=true;btn.textContent='…'
  // Upsert into newsletter_subscribers
  const{error}=await sb.from('newsletter_subscribers').upsert({
    email,user_id:uid||null,source:pos==='top'?'dashboard_top':'dashboard_bottom',status:'active',subscribed_at:new Date().toISOString()
  },{onConflict:'email'})
  // Update users table flag
  if(uid)await sb.from('users').update({newsletter_subscribed:true}).eq('id',uid)
  btn.disabled=false;btn.textContent='Anmelden'
  if(error){showToast('Fehler beim Anmelden.');return}
  const successEl=document.getElementById(successId)
  if(successEl){successEl.style.display='block'}
  // Hide both boxes after 2s
  setTimeout(()=>{
    document.getElementById('nl-box-bottom')?.remove()
  },2000)
  showToast('Newsletter abonniert ✓')
}

/* ── App-Views (Platzhalter) ── */

/* ═══════════════════════════════════════════════════════════════
   VIEW: PROFIL — übernommen aus public/profile/index.html
   Queries, Merge-Reihenfolge, Save-Patch, Foto-Upload und Markup
   unverändert. Der Datei-Input lebt jetzt in der View und wird beim
   Verlassen mitsamt Listener abgeräumt.
   ═══════════════════════════════════════════════════════════════ */
const NICHES_PROFILE = [
  { key: 'lifestyle',     label: '🌿 Lifestyle' },
  { key: 'fashion',       label: '👗 Fashion' },
  { key: 'beauty',        label: '💄 Beauty' },
  { key: 'food',          label: '🍕 Food' },
  { key: 'fitness',       label: '💪 Fitness' },
  { key: 'travel',        label: '✈️ Travel' },
  { key: 'gaming',        label: '🎮 Gaming' },
  { key: 'music',         label: '🎵 Music' },
  { key: 'comedy',        label: '😂 Comedy' },
  { key: 'education',     label: '📚 Edu' },
  { key: 'business',      label: '💼 Business' },
  { key: 'tech',          label: '💻 Tech' },
  { key: 'art',           label: '🎨 Art' },
  { key: 'family',        label: '👨‍👩‍👧 Family' },
  { key: 'mental_health', label: '🧠 Mental' },
  { key: 'general',       label: '🌐 Allgemein' },
]

/* View-lokaler Zustand, entspricht dem `state` der alten Seite */
let pv = null

async function renderProfile(area, ctx) {
  const uid = state.session.user.id

  area.innerHTML = `
    <div class="view-profile">
      <div id="skeleton-area" style="padding:20px">
        <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px">
          <div class="skeleton" style="width:72px;height:72px;border-radius:50%;flex-shrink:0"></div>
          <div style="flex:1"><div class="skeleton" style="height:22px;margin-bottom:8px"></div><div class="skeleton" style="height:16px;width:60%"></div></div>
        </div>
        <div class="skeleton" style="height:80px;margin-bottom:12px"></div>
        <div class="skeleton" style="height:120px;margin-bottom:12px"></div>
        <div class="skeleton" style="height:200px"></div>
      </div>
      <div id="profile-content" class="hidden"></div>
      <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp" class="hidden"/>
    </div>`

  const [profileRes, bioRes, bioStatsRes] = await Promise.all([
    sb.from('users').select('*').eq('id', uid).single(),
    sb.from('biolink_settings').select('*').eq('user_id', uid).single(),
    sb.from('bio_stats').select('*').eq('user_id', uid).single(),
  ])

  if (ctx.stale) return

  pv = {
    uid,
    profile:  { ...profileRes.data, ...bioRes.data },
    bioStats: bioStatsRes.data,
    niche:    profileRes.data?.niche_category || 'general'
  }
  ctx.onCleanup(() => { pv = null })

  document.getElementById('skeleton-area').classList.add('hidden')
  document.getElementById('profile-content').classList.remove('hidden')

  paintProfile()

  /* Foto-Upload — Listener hängt an dem Input dieser View und geht
     beim Routenwechsel mit ihm weg. */
  ctx.on(document.getElementById('photo-input'), 'change', onPhotoPicked)
}

function paintProfile() {
  const p  = pv.profile
  const bs = pv.bioStats
  const bioUrl = p.slug ? `biouno.de/${p.slug}` : '—'
  const bioFullUrl = p.slug ? `https://biouno.de/${p.slug}` : null

  const initial = (p.display_name || p.full_name || '?')[0].toUpperCase()
  const photoInner = p.profile_image_url
    ? `<img class="profile-photo" src="${escHtml(p.profile_image_url)}" alt="" onerror="this.outerHTML='<div class=&quot;profile-photo-fallback&quot;>${initial}</div>'">`
    : `<div class="profile-photo-fallback">${initial}</div>`
  const photoHtml = `
    <div class="photo-wrap" onclick="document.getElementById('photo-input').click()" title="Foto ändern">
      ${photoInner}
      <div class="photo-edit-btn">✎</div>
    </div>`

  document.getElementById('profile-content').innerHTML = `

    <!-- ── Hero ── -->
    <div class="profile-hero">
      ${photoHtml}
      <div class="profile-info">
        <div class="profile-name">${escHtml(p.display_name || p.full_name || '–')}</div>
        <div class="profile-handle">${p.email ? escHtml(p.email) : ''}</div>
        <div class="profile-plan ${p.subscription_type === 'pro' ? 'plan-pro' : 'plan-free'}">
          ${p.subscription_type === 'pro' ? '⭐ Pro' : 'Free Plan'}
        </div>
      </div>
    </div>

    <!-- ── Stats ── -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-value">${fmtCount(p.total_followers)}</div>
        <div class="stat-box-label">Follower</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-value">${fmtCount(bs?.views_total)}</div>
        <div class="stat-box-label">Bio-Aufrufe</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-value">${fmtCount(p.new_requests_count)}</div>
        <div class="stat-box-label">Anfragen</div>
      </div>
    </div>

    <!-- ── BioLink ── -->
    <div class="section">
      <div class="section-label">BioLink</div>
      <div class="biolink-card">
        <div class="biolink-top">
          <div class="biolink-url">
            ${bioFullUrl
              ? `<a href="${bioFullUrl}" target="_blank" rel="noopener">${bioUrl} ↗</a>`
              : `<span style="color:var(--subtle)">Noch kein Slug gesetzt</span>`}
          </div>
          <span class="status-indicator ${p.is_active ? 'si-active' : 'si-inactive'}">
            ${p.is_active ? '● Aktiv' : '○ Inaktiv'}
          </span>
        </div>
        <div class="biolink-stats">
          <div class="biolink-stat">
            <div class="biolink-stat-val">${fmtCount(bs?.views_today)}</div>
            <div class="biolink-stat-label">Heute</div>
          </div>
          <div class="biolink-stat">
            <div class="biolink-stat-val">${fmtCount(bs?.views_last_7_days)}</div>
            <div class="biolink-stat-label">7 Tage</div>
          </div>
          <div class="biolink-stat">
            <div class="biolink-stat-val">${fmtCount(bs?.views_total)}</div>
            <div class="biolink-stat-label">Gesamt</div>
          </div>
        </div>
        <div class="biolink-sources">
          ${bs?.instagram_pct > 0 ? `<span class="source-pill">📸 Instagram ${bs.instagram_pct}%</span>` : ''}
          ${bs?.tiktok_pct > 0   ? `<span class="source-pill">🎵 TikTok ${bs.tiktok_pct}%</span>` : ''}
          ${bs?.direct_pct > 0   ? `<span class="source-pill">🔗 Direkt ${bs.direct_pct}%</span>` : ''}
        </div>
      </div>
    </div>

    <!-- ── Profil bearbeiten ── -->
    <div class="section">
      <div class="section-label">Profil bearbeiten</div>
      <div class="edit-card">

        <div class="field">
          <label>Name</label>
          <input type="text" id="edit-fullname" value="${escHtml(p.full_name || '')}" placeholder="Dein Name"/>
        </div>

        <div class="field">
          <label>Bio</label>
          <textarea id="edit-bio" rows="3" placeholder="Kurze Beschreibung von dir…">${escHtml(p.bio || '')}</textarea>
        </div>

        <div class="field">
          <label>Kontakt-E-Mail</label>
          <input type="email" id="edit-contact-email" value="${escHtml(p.contact_email || '')}" placeholder="fuer@brands.de"/>
        </div>

        <div class="field">
          <label>Instagram</label>
          <div class="handle-input-wrap">
            <span class="handle-prefix">@</span>
            <input type="text" id="edit-ig" value="${escHtml((p.instagram_handle||'').replace(/^@/,''))}" placeholder="deinhandle"/>
          </div>
        </div>

        <div class="field">
          <label>TikTok</label>
          <div class="handle-input-wrap">
            <span class="handle-prefix">@</span>
            <input type="text" id="edit-tt" value="${escHtml((p.tiktok_handle||'').replace(/^@/,''))}" placeholder="deinhandle"/>
          </div>
        </div>

        <div class="field">
          <label>Stadt</label>
          <input type="text" id="edit-city" value="${escHtml(p.city || '')}" placeholder="z.B. München"/>
        </div>

        <div class="field">
          <label>Nische</label>
          <div class="niche-grid" id="niche-grid">
            ${NICHES_PROFILE.map(n => `
              <button class="niche-btn ${pv.niche === n.key ? 'active' : ''}"
                data-niche="${n.key}" onclick="selectNiche('${n.key}')">
                ${n.label}
              </button>`).join('')}
          </div>
        </div>

        <button class="btn-save" id="btn-save" onclick="saveProfile()">Speichern</button>
        <div class="save-success hidden" id="save-success">✓ Gespeichert</div>
      </div>
    </div>

    <!-- ── Account ── -->
    <div class="section" style="padding-bottom:8px">
      <div class="section-label">Account</div>
      <div class="danger-card">
        <div class="danger-row" style="margin-bottom:12px">
          <div class="danger-info">
            <div class="danger-title">E-Mail Adresse</div>
            <div class="danger-sub">${escHtml(p.email || '–')}</div>
          </div>
        </div>
        <div class="danger-row">
          <div class="danger-info">
            <div class="danger-title">Account löschen</div>
            <div class="danger-sub">Alle Daten werden unwiderruflich gelöscht.</div>
          </div>
          <button class="btn-danger" onclick="showToast('Bitte wende dich an den Support.')">Löschen</button>
        </div>
      </div>
    </div>
  `
}

window.selectNiche = function(key) {
  if (!pv) return
  pv.niche = key
  document.querySelectorAll('.niche-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.niche === key)
  })
}

window.saveProfile = async function() {
  if (!pv) return
  const btn = document.getElementById('btn-save')
  const successEl = document.getElementById('save-success')
  btn.disabled = true
  btn.innerHTML = '<span class="spinner"></span> Speichern…'
  successEl.classList.add('hidden')

  const ig = document.getElementById('edit-ig').value.trim().replace(/^@/, '')
  const tt = document.getElementById('edit-tt').value.trim().replace(/^@/, '')

  const patch = {
    full_name:        document.getElementById('edit-fullname').value.trim() || null,
    bio:              document.getElementById('edit-bio').value.trim() || null,
    contact_email:    document.getElementById('edit-contact-email').value.trim() || null,
    instagram_handle: ig || null,
    tiktok_handle:    tt || null,
    city:             document.getElementById('edit-city').value.trim() || null,
    niche_category:   pv.niche,
    updated_at:       new Date().toISOString(),
  }

  const { error } = await sb.from('users').update(patch).eq('id', pv.uid)

  /* View inzwischen verlassen → nichts mehr anfassen */
  if (!pv || !document.getElementById('btn-save')) return

  btn.disabled = false
  btn.textContent = 'Speichern'

  if (error) {
    showToast('Fehler beim Speichern: ' + error.message, 4000)
    return
  }

  // update local state
  Object.assign(pv.profile, patch)
  successEl.classList.remove('hidden')
  setTimeout(() => { const el = document.getElementById('save-success'); if (el) el.classList.add('hidden') }, 3000)
  showToast('Profil gespeichert ✓')
}

async function onPhotoPicked(e) {
  const file = e.target.files?.[0]
  if (!file) return
  if (file.size > 5 * 1024 * 1024) { showToast('Bild zu groß. Max. 5 MB.'); return }

  // Sofort Preview anzeigen
  const reader = new FileReader()
  reader.onload = (ev) => {
    const wrap = document.querySelector('.photo-wrap')
    if (!wrap) return
    const existing = wrap.querySelector('img, .profile-photo-fallback')
    if (existing) existing.remove()
    const img = document.createElement('img')
    img.className = 'profile-photo'
    img.src = ev.target.result
    wrap.insertBefore(img, wrap.querySelector('.photo-edit-btn'))
  }
  reader.readAsDataURL(file)

  // Upload zu Supabase Storage
  showToast('Wird hochgeladen…', 8000)
  const uid = pv ? pv.uid : state.session.user.id
  const path = `${uid}/${Date.now()}.${file.name.split('.').pop()}`
  const { error } = await sb.storage.from('profile-images').upload(path, file, { upsert: true })
  if (error) { showToast('Upload fehlgeschlagen: ' + error.message, 4000); return }

  const { data: { publicUrl } } = sb.storage.from('profile-images').getPublicUrl(path)
  await sb.from('users').update({ profile_image_url: publicUrl }).eq('id', uid)
  if (pv) pv.profile.profile_image_url = publicUrl
  /* Avatar in der Topbar mitziehen — in der alten Seite gab es den nicht */
  if (state.profile) { state.profile.profile_image_url = publicUrl; paintUser() }
  showToast('Profilbild gespeichert ✓')
  e.target.value = ''
}

;(async function init() {
  document.getElementById('footer-year').textContent = new Date().getFullYear()
  await loadSession()

  // Default-Route setzen, wenn kein (gültiger) Hash da ist
  if (!currentRoute()) {
    location.replace(location.pathname + (state.session ? '#/' + DEFAULT_ROUTE : '#/login'))
  }

  document.getElementById('boot').classList.add('hidden')
  document.getElementById('shell').classList.add('visible')
  state.booted = true
  await router()
})()

/* Session-Wechsel in einem anderen Tab spiegeln */
sb.auth.onAuthStateChange(async (event) => {
  if (!state.booted) return
  if (event === 'SIGNED_OUT') { state.session = null; state.profile = null; paintUser(); router() }
})
