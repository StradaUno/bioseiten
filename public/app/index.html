}
window.saveHandles=async function(){
  if(!anv)return
  const ig=document.getElementById('modal-ig').value.trim().replace(/^@/,'')
  const tt=document.getElementById('modal-tt').value.trim().replace(/^@/,'')
  const igH=document.getElementById('modal-ig-hint')
  const ttH=document.getElementById('modal-tt-hint')
  igH.textContent='';ttH.textContent=''
  if(!ig&&!tt){igH.textContent='Mindestens ein Handle eingeben.';igH.className='modal-hint err';return}
  const re=/^[a-zA-Z0-9._]{1,50}$/
  if(ig&&!re.test(ig)){igH.textContent='Ungültiges Format (Buchstaben, Zahlen, . und _)';igH.className='modal-hint err';return}
  if(tt&&!re.test(tt)){ttH.textContent='Ungültiges Format (Buchstaben, Zahlen, . und _)';ttH.className='modal-hint err';return}
  /* AGB 4.4: Die Analyse darf nur auf eigene Kanaele angewendet werden. */
  const ownH=document.getElementById('modal-own-hint')
  ownH.textContent=''
  if(!document.getElementById('modal-own-check').checked){
    ownH.textContent='Bitte bestätige, dass es deine eigenen Kanäle sind.';ownH.className='modal-hint err';return
  }
  const btn=document.getElementById('modal-save-btn')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const patch={}
  if(ig)patch.instagram_handle='@'+ig
  if(tt)patch.tiktok_handle='@'+tt
  await sb.from('users').update(patch).eq('id',anv.uid)
  if(!anv)return
  anv.profile={...anv.profile,...patch}
  closeHandleModal()
  btn.disabled=false;btn.textContent='Speichern'
  renderPlatformCards()
  renderAnalyticsContent()
  showToast('Kanal gespeichert ✓')
}

// ── Render Content ──
function renderAnalyticsContent(){
  const p=anv.profile
  const pl=anv.platform
  const ki=anv.ki[pl]
  const hasHandle=pl==='instagram'?!!(p?.instagram_handle):!!(p?.tiktok_handle)
  const el=document.getElementById('analytics-content')
  const label=pl==='instagram'?'Instagram':'TikTok'

  if(!hasHandle){
    el.innerHTML=`<div class="section" style="margin-top:12px"><div class="empty-state">
      <div class="empty-icon">${icon('atSign',30)}</div>
      <div class="empty-title">Kein ${label}-Handle</div>
      <div class="empty-sub">Verknüpfe deinen Kanal um die Analyse nutzen zu können.</div>
      <button class="btn-empty" onclick="openHandleModal()">Kanal verknüpfen</button>
    </div></div>`
    return
  }
  if(!ki){
    el.innerHTML=`<div class="section" style="margin-top:12px"><div class="empty-state">
      <div class="empty-icon">${icon('barChart',30)}</div>
      <div class="empty-title">Noch keine ${label}-Analyse</div>
      <div class="empty-sub">Wir lesen deine letzten 36 Beiträge aus und sagen dir, was sie verbindet:
        welche Captions ziehen, welches Format trägt, wann du am besten postest — und vier konkrete
        nächste Schritte. Schalte ${label} oben frei, um zu starten.</div>
    </div></div>`
    return
  }

  const st=anv.stats[pl]
  const posts=anv.posts[pl]||[]
  const date=fmtDateDMY(ki.created_at)
  const handle=st?.username?'@'+String(st.username).replace(/^@/,''):label

  /* Deutsche Schreibweise, eine Stelle. Gerechnet wird hier nichts mehr --
     alle Werte kommen fertig aus analyse_stats. */
  const deN=(n,k=0)=>(n==null||isNaN(+n))?'–':(+n).toLocaleString('de-DE',{minimumFractionDigits:k,maximumFractionDigits:k})
  const absatz=t=>String(t||'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(x=>`<p>${escHtml(x)}</p>`).join('')
  const tag=(d)=>d?new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):'–'

  let h='<div class="ckpt">'

  /* Der Kopf traegt die Kernaussage als Ueberschrift. Wer bezahlt hat, soll als
     Erstes den Befund lesen und nicht noch einmal seinen eigenen Kanalnamen. */
  const zeitraum=(()=>{
    const mitDatum=posts.filter(x=>x.posted_at).map(x=>new Date(x.posted_at)).sort((a,b)=>a-b)
    if(mitDatum.length<2)return ''
    return ` vom ${tag(mitDatum[0])} bis ${tag(mitDatum[mitDatum.length-1])}`
  })()
  h+=`<div class="c-head">
    <div class="c-eyebrow">${label} · ${escHtml(handle)} · ${date}</div>
    <h1>${escHtml(ki.kernaussage||'Deine Auswertung')}</h1>
    <div class="c-sub">${posts.length?`${deN(posts.length)} Beiträge${zeitraum}.`:''} Alle Zahlen stammen aus diesem Lauf.</div>
  </div>`

  if(st){
    /* Kacheln: gefaerbt wird nur, wo die Farbe etwas behauptet. Ein Durchschnitt
       ist weder gut noch schlecht -- die staerksten und schwaechsten Beitraege
       dagegen sind genau das, und die Followerbewegung hat eine Richtung. */
    const kachel=(k,num,s,cls='')=>`<div class="c-tile ${cls}"><div class="c-k">${k}</div><div class="c-num">${num}</div><div class="c-s">${s}</div></div>`
    const seit=deltaSeitLabel(anv.prevStats[pl])
    const fd=st.followers_change
    const fCls=st.handle_changed?'':(fd>0?'ok':(fd<0?'bad':''))
    const fSub=st.handle_changed?'Handle geändert – kein Vergleich'
      :(fd!=null?`${fd>=0?'+':'−'}${deN(Math.abs(fd))} ${seit}`:'Erste Messung')

    const kacheln=[]
    if(st.avg_views!=null)kacheln.push(kachel('Ø Aufrufe',fmt(st.avg_views),'pro Beitrag','cool'))
    if(st.resonanz_schnitt!=null)kacheln.push(kachel('Resonanz',deN(st.resonanz_schnitt,1),'Likes je 1.000 Aufrufe','cool'))
    if(st.resonanz_top!=null)kacheln.push(kachel('Stärkste',deN(st.resonanz_top,1),'Likes je 1.000 Aufrufe','ok'))
    if(st.resonanz_flop!=null)kacheln.push(kachel('Schwächste',deN(st.resonanz_flop,1),'Likes je 1.000 Aufrufe','bad'))
    kacheln.push(kachel('Follower',deN(st.followers),fSub,fCls))
    kacheln.push(kachel('Ø Likes',fmt(st.avg_likes),'pro Beitrag'))
    kacheln.push(kachel('Ø Kommentare',fmt(st.avg_comments),'pro Beitrag'))
    if(st.kommentarrate_schnitt!=null)kacheln.push(kachel('Kommentarrate',deN(st.kommentarrate_schnitt,1),'Kommentare je 1.000 Aufrufe'))
    if(st.engagement_rate!=null)kacheln.push(kachel('Je Follower',deN(st.engagement_rate,2)+' %','Likes plus Kommentare'))
    if(st.posts_per_week!=null)kacheln.push(kachel('Beiträge',deN(st.posts_per_week,1),'pro Woche'))
    h+=`<div class="c-grid">${kacheln.join('')}</div>`

    /* Punkt 8 aus dem Entwurf: zwei Balken je Beitrag. Oben die Reichweite,
       unten wie viele davon reagiert haben. Der Durchschnitt verschweigt, dass
       ein einziger Beitrag ihn traegt -- hier steht es nebeneinander. */
    const pr=(Array.isArray(st.post_resonanz)?st.post_resonanz:[]).filter(x=>x.views>0&&x.resonanz!=null)
    if(pr.length>=4){
      const d=[...pr].sort((a,b)=>new Date(a.datum||0)-new Date(b.datum||0))
      const maxV=Math.max(...d.map(x=>x.views),1)
      const maxR=Math.max(...d.map(x=>x.resonanz),1)
      const stark=st.resonanz_top??maxR, schwach=st.resonanz_flop??0
      const W=760,PADL=8,PADR=8,TOP=14,MID=140,BOT=222
      const slot=(W-PADL-PADR)/d.length, bw=slot*0.6, off=(slot-bw)/2
      /* Ein Datum braucht rund 36 px. Passen nicht alle nebeneinander, wird nur
         jedes n-te beschriftet; die Zahl ueber dem Balken faellt ganz weg,
         sobald sie sich mit dem Nachbarn ueberlappen wuerde. */
      const jedes=Math.max(1,Math.ceil(36/slot))
      const zeigeWert=slot>=26
      let svg=''
      d.forEach((x,i)=>{
        const bx=PADL+i*slot+off
        const hv=Math.max(3,(x.views/maxV)*(MID-TOP))
        svg+=`<rect x="${bx.toFixed(1)}" y="${(MID-hv).toFixed(1)}" width="${bw.toFixed(1)}" height="${hv.toFixed(1)}" rx="3" fill="var(--c-cool)" opacity="${x.views>=maxV*0.6?1:.5}"></rect>`
        const hr=Math.max(3,(x.resonanz/maxR)*(BOT-MID-28))
        const farbe=x.resonanz>=stark?'var(--c-ok)':(x.resonanz<=schwach?'var(--c-bad)':'var(--c-line2)')
        svg+=`<rect x="${bx.toFixed(1)}" y="${MID+16}" width="${bw.toFixed(1)}" height="${hr.toFixed(1)}" rx="3" fill="${farbe}"></rect>`
        if(i%jedes===0||i===d.length-1)
          svg+=`<text x="${(bx+bw/2).toFixed(1)}" y="${BOT+20}" text-anchor="middle" font-size="10.5" fill="var(--c-fg3)" font-family="JetBrains Mono, monospace">${escHtml(tag(x.datum))}</text>`
        if(zeigeWert)
          svg+=`<text x="${(bx+bw/2).toFixed(1)}" y="${MID+11}" text-anchor="middle" font-size="10" fill="var(--c-fg3)" font-family="JetBrains Mono, monospace">${deN(x.resonanz,1)}</text>`
      })
      svg+=`<line x1="${PADL}" y1="${MID+2}" x2="${W-PADR}" y2="${MID+2}" stroke="var(--c-line)" stroke-width="1"></line>`
      svg+=`<text x="${PADL}" y="${TOP-2}" font-size="10.5" fill="var(--c-fg3)" font-family="JetBrains Mono, monospace">${fmt(maxV)} Aufrufe</text>`
      h+=`<div class="c-panel">
        <h2>Jeder Beitrag einzeln</h2>
        <p class="c-lede">Oben die Aufrufe, unten wie viele davon reagiert haben. Chronologisch von links.</p>
        <div class="c-legend">
          <span><i style="background:var(--c-cool)"></i>Aufrufe</span>
          <span><i style="background:var(--c-ok)"></i>starke Resonanz</span>
          <span><i style="background:var(--c-bad)"></i>schwache Resonanz</span>
        </div>
        <div class="c-chart" style="--c-chart-min:${Math.max(520,d.length*22)}px"><svg viewBox="0 0 ${W} 252" width="100%" role="img" aria-label="Aufrufe und Resonanz je Beitrag">${svg}</svg></div>
      </div>`
    }
  }

  /* Gegenueberstellung: was getragen hat und wo Wirkung liegen bleibt.
     Die grosse Zahl links ist die Resonanz der staerksten Beitraege, rechts die
     des Beitrags mit viel Reichweite und wenig Reaktion. */
  if(ki.was_gut_lief||ki.verbesserungspotenzial){
    h+=`<div class="c-split">`
    if(ki.was_gut_lief){
      h+=`<div class="c-box ok"><span class="c-chip">Das trägt</span>
        ${st?.resonanz_top!=null?`<div class="c-big">${deN(st.resonanz_top,1)}</div>`:''}
        <h3>Was funktioniert hat</h3>${absatz(ki.was_gut_lief)}</div>`
    }
    if(ki.verbesserungspotenzial){
      const a=st?.ausreisser
      h+=`<div class="c-box bad"><span class="c-chip">Hier liegt Wirkung</span>
        ${a?.resonanz!=null?`<div class="c-big">${deN(a.resonanz,1)}</div>`:''}
        <h3>${a?`${deN(a.views)} Aufrufe, kaum Reaktion`:'Wo Wirkung verloren geht'}</h3>
        ${absatz(ki.verbesserungspotenzial)}</div>`
    }
    h+=`</div>`
  }

  if(ki.reichweite_resonanz){
    h+=`<div class="c-box cool"><span class="c-chip">Reichweite gegen Resonanz</span>
      <h3>Ausgespielt heißt nicht angekommen</h3>${absatz(ki.reichweite_resonanz)}</div>`
  }

  /* Toene: die Tabelle ist der eigentliche Befund. Derselbe Ton liefert voellig
     verschiedene Ergebnisse -- damit ist der verbreitete "nimm den richtigen
     Sound"-Rat fuer diesen Kanal widerlegt, und zwar mit seinen eigenen Zahlen. */
  const snd=Array.isArray(st?.sound_stats)?st.sound_stats:[]
  if(snd.length||ki.sound_befund){
    h+=`<div class="c-box cool"><span class="c-chip">${snd.length?'Widerlegt':'Töne'}</span>
      <h3>${snd.length?'Am Ton allein liegt es nicht':'Was die Tonspur verrät'}</h3>`
    if(snd.length){
      const spalten=Math.max(...snd.map(x=>x.werte.length))
      const kopf=Array.from({length:spalten},(_,i)=>
        `<th class="n">${i===0?'Stärkster':(i===spalten-1?'Schwächster':'dazwischen')}</th>`).join('')
      h+=`<div class="c-tbl-wrap"><table class="c-tbl"><thead><tr><th>Ton</th>${kopf}<th class="n">Faktor</th></tr></thead><tbody>`
      snd.forEach(x=>{
        const zellen=Array.from({length:spalten},(_,i)=>{
          const w=x.werte[i]
          if(w==null)return '<td class="n">–</td>'
          const cls=i===0&&x.werte.length>1&&x.faktor>=1.5?'up':(i===x.werte.length-1&&x.werte.length>1&&x.faktor>=1.5?'down':'')
          return `<td class="n ${cls}">${deN(w,1)}</td>`
        }).join('')
        h+=`<tr><td>${escHtml(x.sound)}</td>${zellen}<td class="n">${deN(x.faktor,1)}×</td></tr>`
      })
      h+=`</tbody></table></div>`
      h+=`<p style="margin-top:12px">Alle Werte sind Likes je 1.000 Aufrufe, vom stärksten zum schwächsten Einsatz sortiert.</p>`
    }
    if(ki.sound_befund)h+=absatz(ki.sound_befund)
    if(st?.eigener_ton&&st.eigener_ton.gesamt>0&&st.eigener_ton.mit===0){
      h+=`<p>Alle ${deN(st.eigener_ton.gesamt)} ausgewerteten Beiträge laufen auf fremdem Ton. Zu eigener Tonspur hast du bisher keinen einzigen Messwert.</p>`
    }
    h+=`</div>`
  }

  if(ki.top_posts_gemeinsamkeiten||ki.caption_struktur){
    h+=`<div class="c-split">`
    if(ki.top_posts_gemeinsamkeiten)h+=`<div class="c-box"><span class="c-chip">Das Muster</span>
      <h3>Was die starken Beiträge verbindet</h3>${absatz(ki.top_posts_gemeinsamkeiten)}</div>`
    if(ki.caption_struktur)h+=`<div class="c-box"><span class="c-chip">Der Aufbau</span>
      <h3>Wie deine Texte gebaut sind</h3>${absatz(ki.caption_struktur)}</div>`
    h+=`</div>`
  }

  if(ki.weglassen){
    h+=`<div class="c-box amber"><span class="c-chip">Weglassen</span>
      <h3>Was weniger werden sollte</h3>${absatz(ki.weglassen)}</div>`
  }

  if(ki.top_posts?.length){
    h+=`<div class="c-panel"><h2>Die stärksten Beiträge</h2>
      <p class="c-lede">Nach Likes sortiert, mit der Begründung aus den Daten.</p>
      <div class="c-tbl-wrap"><table class="c-tbl"><thead><tr><th>Datum</th><th>Warum</th><th class="n">Likes</th></tr></thead><tbody>`
    ki.top_posts.forEach(post=>{
      const datum=post.datum||(post.url?'':'–')
      const text=escHtml(post.warum_top||'')
      const zelle=post.url?`<a href="${escHtml(post.url)}" target="_blank" rel="noopener">${text}</a>`:text
      h+=`<tr><td class="c-mono" style="white-space:nowrap">${escHtml(datum)}</td><td>${zelle}</td><td class="n">${deN(post.likes)}</td></tr>`
    })
    h+=`</tbody></table></div></div>`
  }

  if(st?.best_posting_day||st?.best_posting_hour!=null){
    const n=st.best_time_sample
    const unsicher=n!=null&&n<20
    h+=`<div class="c-box ${unsicher?'amber':'cool'}"><span class="c-chip">${unsicher?'Mit Vorbehalt':'Aus deinen Daten'}</span>
      <h3>${escHtml(st.best_posting_day||'')}${st.best_posting_day&&st.best_posting_hour!=null?', ':''}${st.best_posting_hour!=null?st.best_posting_hour+' Uhr':''}</h3>
      <p>Zu dieser Zeit sind deine stärkeren Beiträge erschienen${n!=null?`, gerechnet über ${deN(n)} Beiträge`:''}.${unsicher?' Für eine Regel ist das zu wenig — behandle es als Tendenz.':''}</p></div>`
  }

  /* Vergleiche nur innerhalb derselben Metrik: Aufrufe gegen Aufrufe, Likes
     gegen Likes. Bei Instagram liefert der Scraper keine Videolaenge -- dann
     faellt der Laengenvergleich hier still weg, statt leer dazustehen. */
  const cmpBalken=(zeilen)=>`<div class="c-cmp">${(()=>{
    const max=Math.max(...zeilen.map(z=>z.wert),1)
    return zeilen.map(z=>`<div class="c-cmp-row">
      <div class="c-cmp-label">${escHtml(z.label)}</div>
      <div class="c-cmp-track"><div class="c-cmp-fill" style="width:${Math.max(4,Math.round(z.wert/max*100))}%"></div></div>
      <div class="c-cmp-val">${fmt(z.wert)}</div></div>`).join('')
  })()}</div>`

  const fs=Array.isArray(st?.format_stats)?st.format_stats:[]
  if(fs.length>1){
    const mitViews=fs.filter(f=>f.avg_views!=null)
    const nutzeViews=mitViews.length>1
    const quelle=nutzeViews?mitViews:fs
    h+=`<div class="c-panel"><h2>Welches Format trägt</h2>
      <p class="c-lede">Ø ${nutzeViews?'Aufrufe':'Likes'} je Beitrag dieses Formats.${nutzeViews?'':` Für diese Formate weist ${label} keine Aufrufe aus.`}</p>
      ${cmpBalken(quelle.map(f=>({label:`${f.typ} (${deN(f.n)}×)`,wert:nutzeViews?f.avg_views:f.avg_likes})))}</div>`
  }

  const ds=Array.isArray(st?.duration_stats)?st.duration_stats:[]
  if(ds.length>1){
    const best=ds.reduce((b,x)=>x.avg_views>b.avg_views?x:b,ds[0])
    const schwach=ds.reduce((b,x)=>x.avg_views<b.avg_views?x:b,ds[0])
    const faktor=schwach.avg_views>0?(best.avg_views/schwach.avg_views):null
    h+=`<div class="c-panel"><h2>Videolänge und Reichweite</h2>
      <p class="c-lede">Ø Aufrufe je Länge.${faktor&&faktor>=1.3?` Deine Videos ${escHtml(best.bucket)} holen im Schnitt das ${deN(faktor,1)}-Fache der Videos ${escHtml(schwach.bucket)}.`:''}</p>
      ${cmpBalken(ds.map(d=>({label:`${d.bucket} (${deN(d.n)}×)`,wert:d.avg_views})))}</div>`
  }

  if(ki.einordnung||ki.analyse_ueberblick){
    h+=`<div class="c-panel"><h2>Wo dein Kanal steht</h2>
      <div style="color:var(--c-fg2);font-size:14px;display:flex;flex-direction:column;gap:10px">${absatz(ki.einordnung||ki.analyse_ueberblick)}</div></div>`
  }

  if(ki.tipps_zukunft?.length){
    h+=`<div class="c-panel"><h2>Was du als Nächstes tun kannst</h2>
      <p class="c-lede">${deN(ki.tipps_zukunft.length)} Schritte, direkt aus den Zahlen oben.</p>
      <ol class="c-steps">${ki.tipps_zukunft.map(t=>`<li>${escHtml(t)}</li>`).join('')}</ol></div>`
  }

  if(ki.weitere_insights?.trim()){
    h+=`<div class="c-box"><span class="c-chip">Noch aufgefallen</span>
      <h3>Ein Befund am Rand</h3>${absatz(ki.weitere_insights)}</div>`
  }

  if(ki.vergleich_vorherige?.trim()){
    h+=`<div class="c-box cool"><span class="c-chip">Entwicklung</span>
      <h3>Verglichen mit der letzten Analyse</h3>${absatz(ki.vergleich_vorherige)}</div>`
  }

  /* P7: Die Media-Kit-Uebernahme existiert seit jeher (loadMediakit liest
     analyse_stats), wurde im Ergebnis aber nirgends erwaehnt. */
  h+=`<div class="c-foot">
    ${posts.length?`${deN(posts.length)} öffentlich sichtbare Beiträge. `:''}Gespeicherte Beiträge, Reichweite nach Followern und Demografie stehen nur in deinen ${label}-Insights.
    ${st?' · <a href="#/mediakit">Diese Zahlen ins Media Kit übernehmen</a>':''}
  </div>`

  h+=`<button class="c-share" onclick="shareAnalytics()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    Analyse-Snapshot teilen
  </button>`

  h+='</div>'
  el.innerHTML=h
}

// ── Share ──
window.shareAnalytics=function(){
  if(!anv)return
  const ki=anv.ki[anv.platform]
  const st=anv.stats[anv.platform]
  const pl=anv.platform==='instagram'?'Instagram':'TikTok'
  const handle=anv.platform==='instagram'?anv.profile?.instagram_handle:anv.profile?.tiktok_handle
  const handleStr=handle?handle.startsWith('@')?handle:'@'+handle:''

  const lines=[]
  lines.push(`📊 Meine ${pl}-Analyse`)
  if(handleStr)lines.push(handleStr)
  lines.push('')

  if(st){
    const seitShare=deltaSeitLabel(anv.prevStats[anv.platform])
    const follStr=st.followers!=null?`👥 ${fmt(st.followers)} Follower`+( st.followers_change!=null&&st.followers_change!==0?` (${st.followers_change>=0?'+':''}${fmt(st.followers_change)} ${seitShare})`:'' ):null
    if(follStr)lines.push(follStr)
    if(st.engagement_rate!=null)lines.push(`💫 ${(+st.engagement_rate).toFixed(2)}% Engagement Rate`)
    if(st.avg_likes!=null)lines.push(`❤️  ⌀ ${fmt(st.avg_likes)} Likes pro Post`)
    if(st.avg_views!=null)lines.push(`👁  ⌀ ${fmt(st.avg_views)} Views pro Post`)
    if(st.best_posting_day&&st.best_posting_hour!=null)lines.push(`⏰ Beste Zeit: ${st.best_posting_day} ${st.best_posting_hour}:00 Uhr`)
  } else if(ki?.analyse_ueberblick){
    lines.push((ki.analyse_ueberblick||'').slice(0,120)+'…')
  }

  lines.push('')
  lines.push('Analysiert mit viuno.')
  lines.push('👉 viuno.de')

  const text=lines.filter(l=>l!=null).join('\n')

  if(navigator.share)navigator.share({title:`Meine ${pl}-Analyse`,text}).catch(()=>{})
  else navigator.clipboard.writeText(text).then(()=>showToast('Kopiert ✓')).catch(()=>showToast('Teilen nicht verfügbar'))
}


/* ═══════════════════════════════════════════════════════════════
   VIEW: CREATOR NEWS — übernommen aus public/digest/index.html
   Die Karten, das Aufklappen, der Plattform-Filter und das Teilen sind
   unverändert. Neu ist die Gliederung: der Digest erscheint täglich,
   deshalb zeigt die Seite die laufende Woche als Tagesblöcke — heute
   oben, darunter die vorherigen Tage. Tage ohne Einträge bekommen keine
   Überschrift und keine Meldung, sie fehlen einfach.
   ═══════════════════════════════════════════════════════════════ */
const MONTHS_FULL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember']
const WEEKDAYS_FULL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag']
/* Wie weit zurück die Liste reicht: laufende Woche plus die davor.
   Ein rollierendes Fenster statt einer festen Cutoff-Konstante — alte
   Ausgaben fallen von selbst heraus, ohne dass jemand ein Datum pflegt. */
const DIGEST_WINDOW_DAYS=14

// Montag der aktuellen ISO-Woche (lokale Zeit) — identische Logik wie im Backend
function getWeekStartLocal(d){
  const day=d.getDay()
  const diff=day===0?-6:1-day
  const monday=new Date(d)
  monday.setDate(d.getDate()+diff)
  monday.setHours(0,0,0,0)
  return monday
}
/* Lokales Datum als YYYY-MM-DD. Bewusst nicht über toISOString(), das
   in UTC umrechnet und östlich von Greenwich einen Tag zurückspringt. */
function toIso(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}
function daysAgoIso(n){const d=new Date();d.setDate(d.getDate()-n);return toIso(d)}

// Überschrift der Seite, z.B. "Diese Woche · 7.–13. September"
function weekRangeLabel(){
  const start=getWeekStartLocal(new Date())
  const end=new Date(start); end.setDate(end.getDate()+6)
  const startStr=start.getMonth()===end.getMonth()
    ? `${start.getDate()}.`
    : `${start.getDate()}. ${MONTHS_FULL[start.getMonth()]}`
  return `Diese Woche · ${startStr}–${end.getDate()}. ${MONTHS_FULL[end.getMonth()]}`
}

// Tagesüberschrift, z.B. "Heute · Sonntag, 13. September" oder "Donnerstag, 11. September"
function dayHeading(dateStr){
  const d=new Date(dateStr+'T12:00:00')
  const wd=WEEKDAYS_FULL[d.getDay()]
  const full=`${wd}, ${d.getDate()}. ${MONTHS_FULL[d.getMonth()]}`
  if(dateStr===toIso(new Date()))return `Heute · ${full}`
  if(dateStr===daysAgoIso(1))return `Gestern · ${wd}`
  return full
}

/* View-lokaler Zustand, entspricht dem `state` der alten Seite */
let dgv = null

async function renderDigest(area, ctx){
  const uid = state.session.user.id

  area.innerHTML = `
  <div class="view-digest">
    <div class="page-header">
      <div class="page-title">Creator News</div>
      <div class="page-sub" id="digest-sub">${escHtml(weekRangeLabel())}</div>
    </div>
    <div class="filter-row" id="filter-row"><button class="f-pill active" data-filter="alle">Alle</button></div>
    <div id="skeleton-area" style="padding:12px 20px 0;display:flex;flex-direction:column;gap:10px"><div class="skeleton" style="height:180px;border-radius:16px"></div><div class="skeleton" style="height:140px;border-radius:16px"></div></div>
    <div class="cards-list hidden" id="cards-list"></div>
    <div class="empty-state hidden" id="empty-state" style="margin:12px 20px 0"><div class="empty-icon">${icon('inbox',30)}</div><div class="empty-title">Noch keine News</div><div class="empty-sub">Sobald es etwas Neues gibt, steht es hier.</div></div>
  </div>`

  dgv = { uid, ctx, digests:[], activeFilter:'alle', subscribed:false }
  ctx.onCleanup(() => { dgv = null })

  const{data:p}=await sb.from('users').select('newsletter_subscribed').eq('id',uid).single()
  if(ctx.stale)return
  dgv.subscribed=p?.newsletter_subscribed||false

  await loadDigests()
}

async function loadDigests(){
  const{data}=await sb.from('daily_digest').select('date,teaser,cards,generated_at')
    .gte('date',daysAgoIso(DIGEST_WINDOW_DAYS-1)).order('date',{ascending:false}).limit(DIGEST_WINDOW_DAYS)
  if(!dgv||dgv.ctx.stale)return
  document.getElementById('skeleton-area').classList.add('hidden')
  if(!data?.length){document.getElementById('empty-state').classList.remove('hidden');return}
  dgv.digests=data
  paintDigest()
}

function buildFilters(cards){
  const platforms=[...new Set(cards.map(c=>c.platform).filter(Boolean))]
  const el=document.getElementById('filter-row')
  el.innerHTML=`<button class="f-pill ${dgv.activeFilter==='alle'?'active':''}" data-filter="alle" onclick="setFilter('alle')">Alle</button>`+platforms.map(p=>`<button class="f-pill ${dgv.activeFilter===p?'active':''}" data-filter="${p}" onclick="setFilter('${p}')">${platformLabel(p)}</button>`).join('')
}
window.setFilter=function(f){
  if(!dgv)return
  dgv.activeFilter=f
  document.querySelectorAll('.f-pill').forEach(p=>p.classList.toggle('active',p.dataset.filter===f))
  renderDays()
}

// Alle Karten aller geladenen Tage — Grundlage für die Filter-Pills
function allCards(){return dgv.digests.flatMap(d=>d.cards||[])}
// Karten eines Tages, auf den aktiven Filter reduziert
function cardsOfDay(d){
  const cards=d.cards||[]
  return dgv.activeFilter==='alle'?cards:cards.filter(c=>c.platform===dgv.activeFilter)
}

function paintDigest(){
  document.getElementById('digest-sub').textContent=weekRangeLabel()
  buildFilters(allCards())
  renderDays()
}

function renderDays(){
  const el=document.getElementById('cards-list')
  const empty=document.getElementById('empty-state')
  const weekStart=toIso(getWeekStartLocal(new Date()))
  const thisWeek=dgv.digests.filter(d=>d.date>=weekStart)
  const earlier=dgv.digests.filter(d=>d.date<weekStart)

  /* Läuft über die tatsächlich vorhandenen Tage, nicht über einen
     erzeugten Kalender: ein Tag ohne Einträge taucht damit gar nicht auf. */
  let shown=0
  let hintPlaced=false
  const section=list=>list.map(d=>{
    const cards=cardsOfDay(d)
    if(!cards.length)return ''
    let html=`<div class="day-head">${escHtml(dayHeading(d.date))}</div>`
    for(const c of cards){
      html+=digestCardHtml(c)
      shown++
      if(shown===3&&!hintPlaced){ hintPlaced=true; html+=nlLineHtml() }
    }
    return html
  }).join('')

  let html=section(thisWeek)
  const earlierHtml=section(earlier)
  if(earlierHtml)html+=`<details class="earlier-days"><summary>Frühere Tage</summary>${earlierHtml}</details>`

  if(!shown){
    el.classList.add('hidden')
    empty.classList.remove('hidden')
    if(dgv.activeFilter!=='alle'){
      empty.classList.add('hidden')
      el.classList.remove('hidden')
      el.innerHTML=`<div class="empty-state" style="margin:0 0 10px"><div class="empty-icon">${icon('search',30)}</div><div class="empty-title">Keine Karten</div><div class="empty-sub">Für diesen Filter gibt es nichts.</div></div>`
    }
    return
  }

  empty.classList.add('hidden')
  el.classList.remove('hidden')
  el.innerHTML=html
  el.querySelectorAll('.digest-card').forEach(card=>dgv.ctx.on(card,'click',()=>card.classList.toggle('expanded')))
  el.querySelectorAll('.card-share').forEach(btn=>dgv.ctx.on(btn,'click',e=>{e.stopPropagation();shareCard(btn.dataset.headline,btn.dataset.summary)}))
}

/* Einzeiler zwischen den Karten: direkt an- und abwaehlbar.
   Schreibt dieselbe Spalte wie die Newsletter-Zeile im Profil. */
function nlLineHtml(){
  const on=!!dgv?.subscribed
  return `<label class="nl-line">
    <input type="checkbox" class="nl-line-check" ${on?'checked':''} onchange="toggleNewsMail(this)"/>
    <span class="nl-line-text">${on?'Kommt täglich per Mail':'Creator News täglich per Mail bekommen'}</span>
  </label>`
}

window.toggleNewsMail=async function(el){
  if(!dgv)return
  const checked=el.checked
  el.disabled=true
  const{error}=await sb.from('users').update({newsletter_subscribed:checked}).eq('id',dgv.uid)
  if(!dgv)return
  el.disabled=false
  if(error){ el.checked=!checked; showToast('Konnte nicht gespeichert werden'); return }
  dgv.subscribed=checked
  const label=el.parentElement?.querySelector('.nl-line-text')
  if(label)label.textContent=checked?'Kommt täglich per Mail':'Creator News täglich per Mail bekommen'
  showToast(checked?'Abonniert ✓':'Abo beendet')
}

function platformLabel(p){return{tiktok:'TikTok',instagram:'Instagram',youtube:'YouTube',meta:'Meta',allgemein:'Allgemein'}[p]||p}
function platformClass(p){return{tiktok:'pb-tiktok',instagram:'pb-instagram',youtube:'pb-youtube',meta:'pb-meta',allgemein:'pb-allgemein'}[p]||'pb-allgemein'}
function platformEmoji(p){return{tiktok:'🎵',instagram:'📸',youtube:'📺',meta:'🔵',allgemein:'🌐'}[p]||'📰'}
async function shareCard(headline,summary){
  const text=`📰 ${headline}\n\n${summary?summary.slice(0,120)+'…':''}\n\nMehr Creator-News auf viuno.de`
  if(navigator.share){try{await navigator.share({title:headline,text,url:'https://viuno.de'});return}catch(_){}}
  try{await navigator.clipboard.writeText(text);showToast('In Zwischenablage kopiert ✓')}catch(_){showToast('Teilen nicht verfügbar')}
}
function digestCardHtml(c){

      <div class="card-headline">${escHtml(c.headline||'')}</div><div class="card-summary">${escHtml(c.summary||'')}</div>
      ${(hasFull||c.impact||c.source_url)?`<div class="card-body-full">${hasFull?`<div class="card-full-text">${escHtml(c.full_content)}</div>`:''}${c.impact?`<div class="card-impact"><div class="card-impact-label">${icon('zap',12)} Was das für dich bedeutet</div><div class="card-impact-text">${escHtml(c.impact)}</div></div>`:''}
        <div class="card-actions">${c.source_url?`<a class="card-link" href="${escHtml(c.source_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Quelle lesen ${icon('arrowUpRight',13)}</a>`:''}${shareBtn}</div>

/* ═══════════════════════════════════════════════════════════════
   VIEW: ANFRAGEN — übernommen aus public/requests/index.html
   Liste, Filter, Detail-Panel mit Status-Wechsel, Notiz, Verlauf und
   Loeschen unverändert. setFilter heisst hier setReqFilter, weil
   /digest/ denselben Namen fuer seinen Plattform-Filter nutzt.
   ═══════════════════════════════════════════════════════════════ */
function fmtRelDate(d){if(!d)return'';const dt=new Date(d),now=new Date(),diff=now-dt,m=Math.floor(diff/60000),h=Math.floor(diff/3600000),days=Math.floor(diff/86400000);if(m<60)return`vor ${m} Min.`;if(h<24)return`vor ${h} Std.`;if(days<7)return`vor ${days} Tagen`;return dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
function fmtFull(d){if(!d)return'';return new Date(d).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function typeClass(t){return{brand:'rb-brand',collab:'rb-collab',event:'rb-event',sonstiges:'rb-sonstiges'}[t]||'rb-sonstiges'}
function typeLabel(t){return{brand:'Brand',collab:'Collab',event:'Event',sonstiges:'Sonstiges'}[t]||t}
function statusClass(s){return{new:'s-new',replied:'s-replied',negotiation:'s-negotiation',closed:'s-closed'}[s]||'s-new'}
function statusLabel(s){return{new:'Neu',replied:'Beantwortet',negotiation:'Verhandlung',closed:'Abgeschlossen'}[s]||s}

/* View-lokaler Zustand, entspricht dem `state` der alten Seite */
let rqv = null

async function renderRequests(area, ctx){
  const uid = state.session.user.id

  area.innerHTML = `

async function loadRequests(){
  const{data}=await sb.from('collab_requests').select('*').eq('creator_id',rqv.uid).is('deleted_at',null).neq('status','deleted').order('created_at',{ascending:false})
  if(!rqv||rqv.ctx.stale)return
  document.getElementById('skeleton-area').classList.add('hidden')
  if(!data?.length){document.getElementById('empty-state').classList.remove('hidden');return}
  rqv.requests=data;updateBadges();renderReqList()
}
function updateBadges(){const n=rqv.requests.filter(r=>r.status==='new').length;const badge=document.getElementById('new-count-badge');if(!badge)return;if(n>0){badge.textContent=`${n} neu`;badge.classList.remove('hidden')}else badge.classList.add('hidden')}
window.setReqFilter=function(f,btn){
  if(!rqv)return
  rqv.filter=f;document.querySelectorAll('.f-pill').forEach(p=>p.classList.toggle('active',p.dataset.f===f));renderReqList()
}
function filtered(){
  // "Alle" zeigt alles außer Abgeschlossen
  if(rqv.filter==='alle')return rqv.requests.filter(r=>r.status!=='closed')
  return rqv.requests.filter(r=>r.status===rqv.filter)
}
function renderReqList(){
  const el=document.getElementById('req-list'),items=filtered(),empty=document.getElementById('empty-state')
  el.classList.remove('hidden');empty.classList.add('hidden')
  if(!items.length){
    el.innerHTML=''
    // Zeige Platzhalter nur bei "alle" und "new", nicht bei gezielten Status-Filtern
    if(rqv.filter==='alle'||rqv.filter==='new'){empty.classList.remove('hidden')}
    else{el.innerHTML=`<div style="text-align:center;padding:40px 20px;font-size:13px;color:var(--muted)">Keine Einträge.</div>`}
    return
  }
  el.innerHTML=items.map(r=>`<div class="req-card ${r.status==='new'?'is-new':''}" data-id="${r.id}"><div class="req-card-top"><div class="req-initial">${escHtml(r.sender_initial||r.sender_name?.[0]||'?')}</div><div class="req-info"><div class="req-name">${escHtml(r.sender_name)}</div><div class="req-meta"><span class="req-type-badge ${typeClass(r.request_type)}">${typeLabel(r.request_type)}</span>${r.budget?`<span style="font-size:11px;font-weight:600;color:var(--text)">€ ${Number(r.budget).toLocaleString('de-DE')}</span>`:''}<span class="req-date">${fmtRelDate(r.created_at)}</span></div></div><div class="req-status"><span class="status-tag ${statusClass(r.status)}">${statusLabel(r.status)}</span>${r.status==='new'?'<div class="new-dot"></div>':''}</div></div>${r.message?`<div class="req-preview-msg">${escHtml(r.message)}</div>`:''}</div>`).join('')
  el.querySelectorAll('.req-card').forEach(card=>rqv.ctx.on(card,'click',()=>openDetail(card.dataset.id)))
}
async function openDetail(id){
  const r=rqv.requests.find(x=>x.id===id);if(!r)return
  // Status wird NICHT automatisch geändert — nur manuell via changeStatus()
  if(!rqv.activities[id]){const{data}=await sb.from('collab_request_activities').select('type,content,icon,created_at').eq('request_id',id).order('created_at',{ascending:true});if(!rqv||rqv.ctx.stale)return;rqv.activities[id]=data||[]}
  renderDetail(r,rqv.activities[id]);document.getElementById('detail-overlay').classList.add('open');document.getElementById('detail-panel').classList.add('open');document.body.style.overflow='hidden'
}
window.closeDetail=function(){document.getElementById('detail-overlay')?.classList.remove('open');document.getElementById('detail-panel')?.classList.remove('open');document.body.style.overflow=''}
function renderDetail(r,activities){
  const subject=`Re: Kooperationsanfrage von ${r.sender_name}`
  const body=`Hallo ${r.sender_name},\n\nVielen Dank für deine Anfrage. Ich freue mich über dein Interesse an einer Zusammenarbeit.\n\n\n\n------- Deine ursprüngliche Anfrage -------\n${r.message||''}`
  const mailtoHref=`mailto:${r.sender_email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`
  document.getElementById('detail-content').innerHTML=`<div class="detail-header"><div class="detail-initial">${escHtml(r.sender_initial||r.sender_name?.[0]||'?')}</div><div><div class="detail-name">${escHtml(r.sender_name)}</div><div class="detail-email">${escHtml(r.sender_email)}</div></div><button class="detail-close" onclick="closeDetail()" aria-label="Schließen">${icon('x',17)}</button></div>
    <div class="detail-section"><div class="detail-pills"><span class="detail-pill"><span class="req-type-badge ${typeClass(r.request_type)}" style="margin:0">${typeLabel(r.request_type)}</span></span>${r.budget?`<span class="detail-pill">${icon('euro',13)} € ${Number(r.budget).toLocaleString('de-DE')}</span>`:''}${r.sender_website?`<a class="detail-pill" href="${escHtml(r.sender_website)}" target="_blank" rel="noopener">${icon('globe',13)} Website ${icon('arrowUpRight',12)}</a>`:''}<span class="detail-pill">${icon('calendar',13)} ${fmtFull(r.created_at)}</span></div></div>
    ${r.message?`<div class="detail-section"><div class="detail-label">Nachricht</div><div class="detail-message">${escHtml(r.message)}</div></div>`:''}
    <div class="detail-actions"><a class="btn-action btn-primary-action" href="${mailtoHref}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Per E-Mail antworten</a></div>
    <div class="detail-section"><div class="detail-label">Status</div></div>
    <div class="status-row">${['new','replied','negotiation','closed'].map(s=>`<button class="status-btn ${r.status===s?'current':''}" onclick="changeStatus('${r.id}','${s}')">${statusLabel(s)}</button>`).join('')}</div>
    <div class="detail-divider"></div>
    <div class="detail-section" style="padding-bottom:4px"><div class="detail-label">Notiz</div></div>
    <div class="note-area"><textarea class="note-field" id="note-field-${r.id}" rows="3" placeholder="Interne Notiz hinzufügen…">${escHtml(r.notes||'')}</textarea><button class="btn-save-note" onclick="saveNote('${r.id}')">Notiz speichern</button></div>
    <div class="detail-divider"></div>
    <div class="detail-section" style="padding-bottom:4px"><div class="detail-label">Verlauf</div></div>
    <div class="timeline">${activities.map(a=>`<div class="timeline-item"><div class="timeline-icon">${icon('pin',15)}</div><div class="timeline-body"><div class="timeline-text">${escHtml(a.content)}</div><div class="timeline-time">${fmtFull(a.created_at)}</div></div></div>`).join()||'<div style="font-size:13px;color:var(--subtle);padding:8px 0">Kein Verlauf.</div>'}</div>
    <div class="detail-section" style="padding-bottom:4px"><button class="btn-action btn-secondary-action" style="width:100%;color:var(--red);border-color:rgba(192,57,43,.2)" onclick="deleteRequest('${r.id}')">Anfrage löschen</button></div>`
}
window.saveNote=async function(id){
  const field=document.getElementById(`note-field-${id}`);if(!field)return
  const notes=field.value.trim()
  await sb.from('collab_requests').update({notes}).eq('id',id)
  if(!rqv)return
  const r=rqv.requests.find(x=>x.id===id);if(r)r.notes=notes
  showToast('Notiz gespeichert ✓')
}
window.changeStatus=async function(id,newStatus){
  if(!rqv)return
  const r=rqv.requests.find(x=>x.id===id);if(!r||r.status===newStatus)return;const old=r.status;r.status=newStatus
  document.querySelectorAll('.status-btn').forEach(b=>b.classList.toggle('current',b.textContent.trim()===statusLabel(newStatus)))
  await sb.from('collab_requests').update({status:newStatus}).eq('id',id)
  if(!rqv)return
  await sb.from('collab_request_activities').insert({request_id:id,creator_id:rqv.uid,type:'status_changed',content:`Status geändert: ${statusLabel(old)} → ${statusLabel(newStatus)}`,icon:'🔄'})
  if(!rqv)return
  delete rqv.activities[id];updateBadges();renderReqList();showToast(`Status: ${statusLabel(newStatus)}`)
}
window.deleteRequest=async function(id){
  if(!confirm('Anfrage wirklich löschen?'))return
  await sb.from('collab_requests').update({deleted_at:new Date().toISOString(),status:'deleted'}).eq('id',id)
  if(!rqv)return
  rqv.requests=rqv.requests.filter(r=>r.id!==id);closeDetail();updateBadges();renderReqList();showToast('Gelöscht')
}

window.openPasswordSheet=function(){

  const btn=document.getElementById('btn-save-pw')

  document.body.style.overflow='hidden'
  setTimeout(()=>document.getElementById('sheet-new-pw')?.focus(),100)

window.closePasswordModal=function(){
  document.getElementById('password-modal')?.classList.add('hidden')

window.checkPwSheet=function(){
  const pw=document.getElementById('sheet-new-pw').value
  const hint=document.getElementById('pw-sheet-hint')
  const btn=document.getElementById('btn-save-pw')
  if(!pw){hint.textContent='';btn.disabled=true;btn.style.opacity='.5';return}
  if(pw.length<8){
    hint.textContent='Mindestens 8 Zeichen erforderlich.'
    hint.style.color='var(--red)';btn.disabled=true;btn.style.opacity='.5';return
  }
  hint.textContent='✓ Passwort sieht gut aus';hint.style.color='var(--green)'
  btn.disabled=false;btn.style.opacity='1'
}
window.saveNewPassword=async function(){
  const pw=document.getElementById('sheet-new-pw').value
  const pw2=document.getElementById('sheet-new-pw2').value
  if(pw.length<8){showToast('Mindestens 8 Zeichen.');return}
  if(pw!==pw2){showToast('Passwörter stimmen nicht überein.');return}
  const btn=document.getElementById('btn-save-pw')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const{error}=await sb.auth.updateUser({password:pw})
  if(!document.getElementById('btn-save-pw'))return
  btn.disabled=false;btn.textContent='Passwort speichern'
  if(error){showToast('Fehler: '+error.message,4000);return}
  closePasswordModal()
  showToast('Passwort gespeichert ✓')
}

// ── Newsletter Toggle ──
window.toggleNewsletter=async function(subscribe){
  if(!pv)return
  if(subscribe){
    const email=pv.user.email
    if(!email){showToast('Keine E-Mail-Adresse gefunden.');return}
    await sb.from('newsletter_subscribers').upsert({
      email,user_id:pv.uid,source:'profile',status:'active',subscribed_at:new Date().toISOString()
    },{onConflict:'email'})
    await sb.from('users').update({newsletter_subscribed:true}).eq('id',pv.uid)
    if(!pv)return
    pv.isSubscribed=true
    showToast('Newsletter abonniert ✓')
  } else {
    await sb.from('newsletter_subscribers').update({status:'unsubscribed',unsubscribed_at:new Date().toISOString()}).eq('user_id',pv.uid)
    await sb.from('users').update({newsletter_subscribed:false}).eq('id',pv.uid)
    if(!pv)return
    pv.isSubscribed=false
    showToast('Newsletter abgemeldet')
  }
  // Re-render profile to update button state
  paintProfile()
}

// ── Username Sheet ──
window.openUsernameSheet=function(){
  const input=document.getElementById('sheet-new-username')
  const status=document.getElementById('username-status')
  const btn=document.getElementById('btn-save-username')
  if(input)input.value=''
  if(status)status.textContent=''
  if(btn){btn.disabled=true;btn.style.opacity='.5'}
  document.getElementById('username-modal').classList.remove('hidden')
  document.body.style.overflow='hidden'
  setTimeout(()=>input?.focus(),100)
}
window.closeUsernameSheet=function(){
  document.getElementById('username-modal')?.classList.add('hidden')
  document.body.style.overflow=''
}
window.closeUsernameModal=window.closeUsernameSheet
window.checkUsernameAvailability=async function(){
  const input=document.getElementById('sheet-new-username')
  const status=document.getElementById('username-status')
  const btn=document.getElementById('btn-save-username')
  const val=input.value.trim()
  clearTimeout(_usernameTimer)
  btn.disabled=true;btn.style.opacity='.5'
  if(!val){status.textContent='';return}
  if(val.toLowerCase()===pv?.profile?.display_name?.toLowerCase()){status.style.color='var(--muted)';status.textContent='Das ist bereits dein Username.';return}
  if(!/^[a-zA-Z0-9_]{3,30}$/.test(val)){status.style.color='var(--red)';status.textContent='3–30 Zeichen, nur Buchstaben, Zahlen und _.';return}
  status.style.color='var(--muted)';status.textContent='Wird geprüft…'
  _usernameTimer=setTimeout(async()=>{
    // RPC umgeht RLS und prüft sicher gegen users + username_blacklist
    const{data:result,error}=await sb.rpc('check_username_available',{p_username:val})
    if(!document.getElementById('username-status'))return
    if(error){
      status.style.color='var(--red)';status.textContent='Fehler bei Prüfung'
      btn.disabled=true;btn.style.opacity='.5';return
    }
    if(result==='reserved'){
      status.style.color='var(--red)';status.textContent='Dieser Username ist reserviert.'
      btn.disabled=true;btn.style.opacity='.5'
    } else if(result==='taken'){
      status.style.color='var(--red)';status.textContent='Leider vergeben.'
      btn.disabled=true;btn.style.opacity='.5'
    } else if(result==='invalid_format'){
      status.style.color='var(--red)';status.textContent='3–30 Zeichen, nur Buchstaben, Zahlen und _.'
      btn.disabled=true;btn.style.opacity='.5'
    } else if(result==='available'){
      status.style.color='var(--green)';status.textContent='✓ Verfügbar!'
      btn.disabled=false;btn.style.opacity='1'
    } else {
      status.style.color='var(--red)';status.textContent='Unbekannte Antwort'
      btn.disabled=true;btn.style.opacity='.5'
    }
  },500)
}
window.confirmUsernameChange=function(){
  const newName=document.getElementById('sheet-new-username').value.trim()
  if(!newName)return
  closeUsernameSheet()
  showModal(
    `Username ändern zu "${newName}"?`,
    null,
    'Ja, Username ändern',
    ()=>commitUsername(newName),
    'Dein BioLink und Media Kit werden deaktiviert. Die alten URLs (' + (pv?.profile?.display_name?'viuno.de/'+pv.profile.display_name.toLowerCase():'alte URL') + ') funktionieren danach nicht mehr. Du musst BioLink und Media Kit mit dem neuen Username neu erstellen.'
  )
}
async function commitUsername(newName){
  closeModal()
  showToast('Username wird geändert…',5000)
  const{data:{session}}=await sb.auth.getSession()
  if(!session){showToast('Session abgelaufen');location.reload();return}
  try{
    const res=await fetch(`${SUPABASE_URL}/functions/v1/change-username`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'},
      body:JSON.stringify({new_username:newName})
    })
    const body=await res.json().catch(()=>({}))
    if(!res.ok||body.success!==true){
      showToast('Fehler: '+(body.error||'Unbekannt'),5000)
      return
    }
    showToast('Username geändert ✓ — bitte BioLink & Media Kit neu erstellen',5000)
    if(state.route==='profile')router()
  }catch(err){
    showToast('Fehler: '+err.message,5000)
  }
}

// ── E-Mail ändern ──
window.openEmailModal=function(){
  showModal(
    'E-Mail-Adresse ändern',
    `<div style="margin-bottom:12px">Aktuelle E-Mail: <strong>${escHtml(pv.user.email)}</strong></div>
     <div class="field" style="margin:0"><label style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px">Neue E-Mail</label>
     <input type="email" id="modal-new-email" placeholder="neue@email.de" style="width:100%;padding:11px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;color:var(--text);background:var(--bg);outline:none"/></div>`,
    'Bestätigungsmail senden',
    commitEmailChange,
    null

}
async function commitEmailChange(){
  const input=document.getElementById('modal-new-email')
  const newEmail=input?.value?.trim()
  if(!newEmail||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)){showToast('Bitte gültige E-Mail eingeben.');return}
  if(newEmail===pv?.user.email){showToast('Das ist bereits deine E-Mail.');return}
  const btn=document.getElementById('modal-confirm-btn')
  if(btn){btn.disabled=true;btn.textContent='Wird gesendet…'}

  if(error){showToast('Fehler: '+error.message,5000);return}
  showToast('Bestätigungsmail gesendet! Bitte prüfe dein Postfach.',5000)

// ── Account löschen ──
window.openDeleteModal=function(){
  showModal(
    'Account löschen?',
    'Alle deine Daten, BioLink-Seite und Media Kit werden dauerhaft gelöscht.',
    'Weiter',
    showDeleteConfirm,
    null
  )
}
function showDeleteConfirm(){
  showModal(
    'Wirklich unwiderruflich löschen?',
    null,
    'Ja, Account jetzt löschen',
    commitDeleteAccount,
    'Diese Aktion kann nicht rückgängig gemacht werden. Dein Account wird sofort gelöscht.'
  )
}
async function commitDeleteAccount(){
  const btn=document.getElementById('modal-confirm-btn')
  if(btn){btn.disabled=true;btn.textContent='Wird gelöscht…'}
  try{
    const{data:{session}}=await sb.auth.getSession()
    if(!session){showToast('Session abgelaufen');navigate('#/login');return}
    const res=await fetch(`${SUPABASE_URL}/functions/v1/delete-account`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json().catch(()=>({}))
    if(!res.ok&&body.success!==true){closeModal();showToast('Fehler: '+(body.error||'Unbekannt'),5000);return}
    await sb.auth.signOut()
    location.replace('https://viuno.de')
  }catch(err){
    closeModal();showToast('Fehler: '+err.message,5000)
  }
}

window.saveProfile=async function(){
  if(!pv)return
  const btn=document.getElementById('btn-save'),successEl=document.getElementById('save-success')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Speichern…';successEl.classList.add('hidden')
  const ig=document.getElementById('edit-ig').value.trim().replace(/^@/,''),tt=document.getElementById('edit-tt').value.trim().replace(/^@/,'')
  const patch={full_name:document.getElementById('edit-fullname').value.trim()||null,bio:document.getElementById('edit-bio').value.trim()||null,instagram_handle:ig||null,tiktok_handle:tt||null,city:document.getElementById('edit-city').value.trim()||null,niche_category:pv.niche,updated_at:new Date().toISOString()}
  const{error}=await sb.from('users').update(patch).eq('id',pv.uid)
  if(!pv||!document.getElementById('btn-save'))return
  btn.disabled=false;btn.textContent='Speichern'
  if(error){showToast('Fehler: '+error.message,4000);return}
  const bioChanged=(pv.profile?.bio||null)!==patch.bio
  const uid=pv.uid
  Object.assign(pv.profile,patch);successEl.classList.remove('hidden');setTimeout(()=>document.getElementById('save-success')?.classList.add('hidden'),3000);showToast('Profil gespeichert ✓')
  if(bioChanged)regenerateBioPageQuietly(uid)
}

async function onPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Bild zu groß. Max. 5 MB.');return}
  const reader=new FileReader()
  reader.onload=(ev)=>{const wrap=document.querySelector('.photo-wrap');if(!wrap)return;const ex=wrap.querySelector('img,.profile-photo-fallback');if(ex)ex.remove();const img=document.createElement('img');img.className='profile-photo';img.src=ev.target.result;wrap.insertBefore(img,wrap.querySelector('.photo-edit-btn'))}
  reader.readAsDataURL(file);showToast('Wird hochgeladen…',8000)
  const uid=pv?pv.uid:state.session.user.id
  const path=`${uid}/${Date.now()}.${file.name.split('.').pop()}`
  const{error}=await sb.storage.from('profile-images').upload(path,file,{upsert:true})
  if(error){showToast('Upload fehlgeschlagen: '+error.message,4000);return}
  const{data:{publicUrl}}=sb.storage.from('profile-images').getPublicUrl(path)
  await sb.from('users').update({profile_image_url:publicUrl}).eq('id',uid)
  if(pv)pv.profile.profile_image_url=publicUrl
  /* Avatar in der Topbar mitziehen — die alte Seite lud die Seite dafuer neu */
  if(state.profile){state.profile.profile_image_url=publicUrl;paintUser()}
  showToast('Profilbild gespeichert ✓');e.target.value=''
  regenerateBioPageQuietly(uid)
}

sb.auth.onAuthStateChange(async (event) => {
  if (!state.booted) return
  if (event === 'SIGNED_OUT') { state.session = null; state.profile = null; paintUser(); router() }
})
