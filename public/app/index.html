/* identisch in allen alten Seiten */
function escHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

/* aus /dashboard/ und /analytic/ (dort identisch) */
function fmt(n, digits = 1) {
  if (n == null || n === '' || isNaN(Number(n))) return '–'
  n = Number(n)
  if (n >= 1_000_000) return (n/1_000_000).toFixed(digits).replace(/\.0$/,'') + 'M'
  if (n >= 1_000)     return (n/1_000).toFixed(digits).replace(/\.0$/,'') + 'k'
  return n.toFixed(0)
}

/* aus /profile/: eigene fmt-Variante — Fallback '0' statt '–' und
   unter 1000 lokalisiert statt gerundet. Bewusst getrennt gehalten,
   damit die Profil-Zahlen exakt wie vorher aussehen. */
function fmtCount(n) {
  if (n == null || isNaN(Number(n))) return '0'
  n = Number(n)
  if (n >= 1_000_000) return (n/1_000_000).toFixed(1).replace(/\.0$/,'') + 'M'
  if (n >= 1_000)     return (n/1_000).toFixed(1).replace(/\.0$/,'') + 'k'
  return n.toLocaleString('de-DE')
}

/* aus /biolink/: Fallback '–', unter 1000 unveraendert als String */
function fmtNum(n){if(n==null||isNaN(+n))return'–';n=+n;if(n>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace(/\.0$/,'')+'k';return n.toString()}

/* aus /dashboard/ */
function fmtEuro(n) {
  if (n == null || isNaN(+n)) return '–'
  return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(+n)
}
/* aus /dashboard/: fmtDate — nur Tag und Monat */
function fmtDateShort(d) {
  if (!d) return ''
  return new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
}

/* ─────────────────────────────────────────────
   ROUTES
   ───────────────────────────────────────────── */
const ROUTES = {
  login:      { title: 'Login',        render: renderLogin,      public: true },
  register:   { title: 'Registrieren', render: renderRegister,   public: true },
  onboarding: { title: 'Setup',        render: renderOnboarding, chromeless: true },
  dashboard:  { title: 'Dashboard',    render: renderDashboard },
  analytics:  { title: 'Analyse',      render: renderAnalytics },
  biolink:    { title: 'BioLink',      render: renderBiolink },
  mediakit:   { title: 'Media Kit',    render: renderMediakit },
  digest:     { title: 'Creator News', render: renderDigest },
  requests:   { title: 'Anfragen',     render: renderRequests },
  profile:    { title: 'Profil',       render: renderProfile }
}

const DEFAULT_ROUTE = 'dashboard'

/* ─────────────────────────────────────────────
   View-Lifecycle
   Jede View bekommt ein ctx: ctx.stale sagt, ob inzwischen
   weitergeklickt wurde (späte Query-Antworten dürfen dann nicht
   mehr ins DOM schreiben), ctx.onCleanup registriert Listener,
   Intervalle und Subscriptions, die beim Verlassen abgeräumt werden.
   ───────────────────────────────────────────── */
let viewToken = 0
let viewCleanups = []

function runCleanups() {
  const fns = viewCleanups
  viewCleanups = []
  for (const fn of fns) { try { fn() } catch (e) { console.warn('cleanup failed', e) } }
}

function makeCtx() {
  const token = ++viewToken
  return {
    get stale() { return token !== viewToken },
    onCleanup(fn) { if (token === viewToken) viewCleanups.push(fn) },
    /* Listener, der sich beim Verlassen der View selbst abmeldet */
    on(target, type, handler, opts) {
      target.addEventListener(type, handler, opts)
      this.onCleanup(() => target.removeEventListener(type, handler, opts))
    },
    /* Intervall, das beim Verlassen der View gestoppt wird */
    interval(fn, ms) {
      const id = setInterval(fn, ms)
      this.onCleanup(() => clearInterval(id))
      return id
    }
  }
}

function currentRoute() {
  const raw = (location.hash || '').replace(/^#\/?/, '').split('?')[0].split('/')[0].trim().toLowerCase()
  return ROUTES[raw] ? raw : null
}

/* ─────────────────────────────────────────────
   ROUTER + Session-Guard
   Regeln (aus /dashboard/ übernommen):
     - keine Session            → #/login
     - Session + onboarding_completed === false → #/onboarding
     - Session + Default        → #/dashboard
   ───────────────────────────────────────────── */
async function router() {
  let name = currentRoute()

  // Ohne Session: nur öffentliche Routen
  if (!state.session) {
    if (!name || !ROUTES[name].public) { navigate('#/login'); return }
  } else {
    // Mit Session: Login/Register überspringen
    if (!name || ROUTES[name].public) { navigate('#/' + DEFAULT_ROUTE); return }
    // Profil unvollständig → Onboarding erzwingen
    if (needsOnboarding() && name !== 'onboarding') { navigate('#/onboarding'); return }
  }

  state.route = name
  const route = ROUTES[name]
  const chromeless = route.public || route.chromeless

  document.getElementById('shell').classList.toggle('auth-mode', !!chromeless)
  document.getElementById('shell').classList.toggle('wide', !!route.chromeless)
  document.getElementById('topbar-title').textContent = route.title
  document.title = 'viuno · ' + route.title
  setActiveMenuItem(name)
  closeSidebar()
  closeModal()

  runCleanups()
  const ctx = makeCtx()

  const area = document.getElementById('content-area')
  area.innerHTML = ''
  window.scrollTo(0, 0)
  await route.render(area, ctx)
}

function setActiveMenuItem(name) {
  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === name)
  })
}

/* Wie in /dashboard/: nur ein explizites false erzwingt Onboarding. */
function needsOnboarding() {
  return state.profile ? state.profile.onboarding_completed === false : false
}

/* ─────────────────────────────────────────────
   Session laden
   ───────────────────────────────────────────── */
async function loadSession() {
  const { data: { session } } = await sb.auth.getSession()
  state.session = session || null
  state.profile = null
  if (session) await loadProfile(session.user.id)
  paintUser()
}

async function loadProfile(uid) {
  const { data } = await sb.from('users')
    .select('display_name, full_name, profile_image_url, onboarding_completed, subscription_type')
    .eq('id', uid).single()
  state.profile = data || null
}

function paintUser() {
  const av = document.getElementById('user-avatar')
  const mail = document.getElementById('sidebar-user-email')
  if (!state.session) { av.textContent = '?'; mail.textContent = ''; return }
  const p = state.profile
  const name = p?.display_name || p?.full_name || state.session.user.email || '?'
  if (p?.profile_image_url) av.innerHTML = `<img src="${escHtml(p.profile_image_url)}" alt="">`
  else av.textContent = name[0].toUpperCase()
  av.title = name
  mail.textContent = state.session.user.email || ''
  /* Pro-Banner wie in den Einzelseiten */
  document.getElementById('sidebar-pro-banner')?.classList.toggle('show', p?.subscription_type === 'pro')
}

   VIEWS
   ───────────────────────────────────────────── */

/* ═══════════════════════════════════════════════════════════════
   VIEW: LOGIN — übernommen aus public/login/index.html
   Fehlermeldungen, Enter-Verhalten und Validierung unverändert.
   Angepasst: location.replace('/dashboard') → Hash-Route, damit der
   Router die Onboarding-Weiche ziehen kann.
   ═══════════════════════════════════════════════════════════════ */
function renderLogin(area, ctx) {
  area.innerHTML = `
    <div class="view-auth">
      <div class="logo">
        <div class="logo-mark">v</div>
        <div class="logo-text">viuno</div>
      </div>
      <div class="card">
        <div class="card-title">Willkommen zurück.</div>
        <div class="card-sub">Melde dich mit deinem viuno-Account an.</div>
        <div class="field">
          <label>E-Mail</label>
          <input type="email" id="inp-email" placeholder="du@beispiel.de" autocomplete="email"/>
        </div>
        <div class="field">
          <label>Passwort</label>
          <input type="password" id="inp-pw" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button class="btn-primary" id="btn-login">Einloggen</button>
        <div class="error-msg" id="error-msg"></div>
        <div style="text-align:center;margin-top:14px">
          <a href="/reset-password" style="font-size:13px;color:var(--muted);text-decoration:none">Passwort vergessen?</a>
        </div>
      </div>
      <div class="link-row">
        Noch kein Account? <a href="#/register">Jetzt registrieren</a>
      </div>
    </div>`

  const emailEl = document.getElementById('inp-email')
  const pwEl    = document.getElementById('inp-pw')
  const btn     = document.getElementById('btn-login')
  const errEl   = document.getElementById('error-msg')

  function showError(msg){ errEl.textContent = msg; errEl.classList.add('show') }
  function hideError(){ errEl.classList.remove('show') }

  async function doLogin(){
    hideError()
    const email = emailEl.value.trim()
    const pw    = pwEl.value
    if(!email||!pw){ showError('Bitte E-Mail und Passwort eingeben.'); return }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw })
    if (ctx.stale) return
    btn.disabled = false; btn.textContent = 'Einloggen'
    if(error){
      if(error.message.includes('Invalid login')||error.message.includes('invalid_credentials')){
        showError('E-Mail oder Passwort falsch.')
      } else if(error.message.includes('Email not confirmed')){
        showError('Bitte bestätige zuerst deine E-Mail-Adresse.')
      } else {
        showError(error.message)
      }
      return
    }
    state.session = data.session
    await loadProfile(data.session.user.id)
    paintUser()
    navigate('#/' + DEFAULT_ROUTE)   // Router schickt ggf. weiter ins Onboarding
  }

  ctx.on(btn, 'click', doLogin)
  ctx.on(pwEl, 'keydown', e => { if(e.key==='Enter') doLogin() })
  ctx.on(emailEl, 'keydown', e => { if(e.key==='Enter') pwEl.focus() })
}

/* ═══════════════════════════════════════════════════════════════
   VIEW: REGISTER — übernommen aus public/register/index.html
   Username-Live-Check (RPC is_username_available, 500 ms Debounce),
   Passwort-Hinweis, Nischen-Grid, Legal-Checkbox, signUp-Optionen,
   users-Update und Success-Karte unverändert.
   ═══════════════════════════════════════════════════════════════ */
const NICHES_REGISTER = [
  ['lifestyle','Lifestyle'],['fashion','Fashion'],['beauty','Beauty'],['food','Food'],
  ['fitness','Fitness'],['travel','Travel'],['gaming','Gaming'],['music','Music'],
  ['comedy','Comedy'],['education','Bildung & Wissen'],['business','Business'],['tech','Tech'],
  ['art','Art'],['family','Family'],['mental_health','Mental Health'],['general','Allgemein']
]

function renderRegister(area, ctx) {
  area.innerHTML = `
    <div class="view-auth">
      <div class="logo">
        <div class="logo-mark">v</div>
        <div class="logo-text">viuno</div>
      </div>

      <!-- FORM -->
      <div class="card" id="form-card">
        <div class="card-title">Account erstellen.</div>
        <div class="card-sub">Starte kostenlos — kein Abo nötig.</div>

        <div class="field">
          <label>Username</label>
          <input type="text" id="inp-username" placeholder="z.B. maria_lifestyle" autocomplete="username"/>
          <div class="field-hint" id="username-hint">Dein öffentlicher Name auf viuno.de</div>
        </div>

        <div class="field">
          <label>E-Mail</label>
          <input type="email" id="inp-email" placeholder="du@beispiel.de" autocomplete="email"/>
        </div>

        <div class="field">
          <label>Passwort</label>
          <input type="password" id="inp-pw" placeholder="Mindestens 8 Zeichen" autocomplete="new-password"/>
          <div class="field-hint" id="pw-hint"></div>
        </div>

        <div class="field">
          <label>Passwort bestätigen</label>
          <input type="password" id="inp-pw2" placeholder="••••••••" autocomplete="new-password"/>
        </div>

        <div class="section-divider"></div>

        <div class="field">
          <label>Nische</label>
          <div class="niche-grid" id="niche-grid">
            ${NICHES_REGISTER.map(([key,label]) =>
              `<button class="niche-btn" data-niche="${key}">${label}</button>`).join('')}
          </div>
          <div class="field-hint" id="niche-hint" style="margin-top:8px">Bitte wähle deine Nische.</div>
        </div>

        <div class="section-divider"></div>

        <div class="legal-box">
          <label class="legal-check">
            <input type="checkbox" id="chk-legal"/>
            <span>Ich habe die <a href="/legal#agb" target="_blank">AGB</a> und <a href="/legal#datenschutz" target="_blank">Datenschutzerklärung</a> gelesen und akzeptiere sie.</span>
          </label>
        </div>

        <button class="btn-primary" id="btn-register">Account erstellen</button>
        <div class="error-msg" id="error-msg"></div>
      </div>

      <div class="link-row" id="login-link">
        Bereits registriert? <a href="#/login">Einloggen</a>
      </div>

      <!-- SUCCESS -->
      <div class="card success-state" id="success-card">
        <div class="success-icon">✉️</div>
        <div class="success-title">Fast geschafft!</div>
        <div class="success-sub">
          Wir haben eine Bestätigungsmail an<br>
          <span class="success-email" id="success-email"></span><br><br>
          gesendet. Klicke auf den Link in der Mail um deinen Account zu aktivieren und direkt loszulegen.
        </div>
      </div>
    </div>`

  let selectedNiche = null
  let usernameValid = false
  let _unameTimer = null
  /* Debounce-Timer stoppen, wenn die View verlassen wird */
  ctx.onCleanup(() => clearTimeout(_unameTimer))

  const $ = id => document.getElementById(id)

  function selectNiche(n){
    selectedNiche = n
    document.querySelectorAll('.niche-btn').forEach(b => b.classList.toggle('active', b.dataset.niche === n))
    $('niche-hint').style.display = 'none'
  }
  document.querySelectorAll('#niche-grid .niche-btn').forEach(b => {
    ctx.on(b, 'click', () => selectNiche(b.dataset.niche))
  })

  function onUsernameInput(){
    const val   = $('inp-username').value.trim()
    const hint  = $('username-hint')
    const input = $('inp-username')
    usernameValid = false
    clearTimeout(_unameTimer)

    if(!val){
      hint.textContent = 'Dein öffentlicher Name auf viuno.de'
      hint.className = 'field-hint'
      input.classList.remove('invalid')
      return
    }
    if(!/^[a-zA-Z0-9_]{3,30}$/.test(val)){
      hint.textContent = '3–30 Zeichen, nur Buchstaben, Zahlen und _'
      hint.className = 'field-hint error'
      input.classList.add('invalid')
      return
    }
    // Format ok — check availability after 500ms
    hint.textContent = 'Wird geprüft…'
    hint.className = 'field-hint'
    hint.style.color = 'var(--muted)'
    input.classList.remove('invalid')

    _unameTimer = setTimeout(async () => {
      const { data, error } = await sb.rpc('is_username_available', { p_username: val })
      if (ctx.stale) return
      if(error||!data){
        hint.textContent = 'Fehler beim Prüfen — bitte nochmal versuchen.'
        hint.className = 'field-hint error'
        return
      }
      if(data.available){
        hint.textContent = '✓ Verfügbar!'
        hint.className = 'field-hint'
        hint.style.color = 'var(--green)'
        input.classList.remove('invalid')
        usernameValid = true
      } else {
        const msgs = {
          taken:'Dieser Username ist leider vergeben.',
          reserved:'Dieser Username ist reserviert.',
          invalid_format:'Ungültiges Format.'
        }
        hint.textContent = msgs[data.reason]||'Nicht verfügbar.'
        hint.className = 'field-hint error'
        input.classList.add('invalid')
        usernameValid = false
      }
    }, 500)
  }
  ctx.on($('inp-username'), 'input', onUsernameInput)

  function checkPwStrength(){
    const pw = $('inp-pw').value
    const hint = $('pw-hint')
    if(!pw){ hint.textContent=''; return }
    if(pw.length<8){ hint.textContent='Zu kurz — mindestens 8 Zeichen.'; hint.className='field-hint error'; return }
    hint.textContent = '✓ Passwort sieht gut aus'
    hint.className = 'field-hint'; hint.style.color = 'var(--green)'
  }
  ctx.on($('inp-pw'), 'input', checkPwStrength)

  function showError(msg){
    const el = $('error-msg')
    el.textContent = msg; el.classList.add('show')
    el.scrollIntoView({ behavior:'smooth', block:'nearest' })
  }
  function hideError(){ $('error-msg').classList.remove('show') }

  async function doRegister(){
    hideError()
    const username = $('inp-username').value.trim()
    const email    = $('inp-email').value.trim()
    const pw       = $('inp-pw').value
    const pw2      = $('inp-pw2').value
    const legal    = $('chk-legal').checked

    if(!username){ showError('Bitte gib einen Username ein.'); return }
    if(!usernameValid){ showError('Bitte wähle einen verfügbaren Username.'); return }
    if(!email){ showError('Bitte gib deine E-Mail-Adresse ein.'); return }
    if(pw.length<8){ showError('Das Passwort muss mindestens 8 Zeichen lang sein.'); return }
    if(pw!==pw2){ showError('Die Passwörter stimmen nicht überein.'); return }
    if(!selectedNiche){
      $('niche-hint').style.display = 'block'
      $('niche-hint').textContent = 'Bitte wähle eine Nische.'
      $('niche-hint').className = 'field-hint error'
      showError('Bitte wähle deine Nische aus.'); return
    }
    if(!legal){ showError('Bitte akzeptiere AGB und Datenschutzerklärung.'); return }

    const btn = $('btn-register')
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Account wird erstellt…'

    // Final availability check before submit (race condition safety)
    const { data: check } = await sb.rpc('is_username_available', { p_username: username })
    if (ctx.stale) return
    if(!check?.available){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      showError('Dieser Username ist nicht mehr verfügbar. Bitte wähle einen anderen.'); return
    }

    // Sign up
    const { data, error } = await sb.auth.signUp({
      email,
      password: pw,
      options:{
        data:{ display_name: username, niche_category: selectedNiche },
        emailRedirectTo:'https://viuno.de/onboarding'
      }
    })
    if (ctx.stale) return

    if(error){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      if(error.message.includes('already registered')||error.message.includes('already been registered')){
        showError('Diese E-Mail-Adresse ist bereits registriert. Bitte logge dich ein.')
      } else {
        showError(error.message)
      }
      return
    }

    // Update users table (trigger creates the row, we set display_name + niche)
    if(data.user){
      await sb.from('users').update({
        display_name: username,
        niche_category: selectedNiche,
        updated_at: new Date().toISOString()
      }).eq('id', data.user.id)
    }
    if (ctx.stale) return

    // Show success
    btn.disabled = false; btn.textContent = 'Account erstellen'
    $('form-card').style.display = 'none'
    $('login-link').style.display = 'none'
    $('success-email').textContent = email
    $('success-card').classList.add('show')
  }

  ctx.on($('btn-register'), 'click', doRegister)
  ctx.on($('inp-pw2'), 'keydown', e => { if(e.key==='Enter') doRegister() })
}

/* View-lokaler Zustand, entspricht dem `state` der alten Seite */
let obv = null

// ─── steps ───
const OB_STEPS=[
  {title:'Deine Kanäle.',sub:'Verbinde deine Social-Media-Kanäle. Du kannst das auch später erledigen.',render:renderObStep1,collect:collectObStep1},
  {title:'Fast fertig.',sub:'Überprüfe deine Angaben und klick auf Abschließen.',render:renderObStep3,collect:()=>true},
]

function renderStep(){
  const s=OB_STEPS[obv.step-1]
  document.getElementById('step-label').textContent=`Schritt ${obv.step} von ${obv.total}`
  document.getElementById('progress-fill').style.width=`${(obv.step/obv.total)*100}%`
  document.getElementById('btn-back').classList.toggle('hidden',obv.step===1)
  document.getElementById('btn-next').textContent=obv.step===obv.total?'Abschließen ✓':'Weiter →'
  document.getElementById('btn-next').disabled=false
  const content=document.getElementById('ob-content')
  // Clear first, then set header, then let render() append
  content.innerHTML=`<div class="step-num">Schritt ${obv.step} / ${obv.total}</div><div class="step-title">${s.title}</div><div class="step-sub">${s.sub}</div>`
  s.render(content)
}

function renderObStep1(el){
  el.innerHTML+=`<div class="field"><label>Instagram-Handle (optional)</label><div class="handle-prefix-wrap"><span class="handle-prefix">@</span><input type="text" id="s-ig" value="${escHtml(obv.data.ig)}" placeholder="dein_handle"/></div></div>

function collectObStep1(){
  obv.data.ig=document.getElementById('s-ig')?.value.trim().replace(/^@/,'')||''
  obv.data.tt=document.getElementById('s-tt')?.value.trim().replace(/^@/,'')||''
  return true
}

function renderObStep3(el){
  const d=obv.data
  const nicheFound=NICHES_ONBOARDING.find(n=>n.key===d.niche)
  const nicheLabel=nicheFound?(nicheFound.emoji+' '+nicheFound.label):(d.niche||'–')
  const defaultPhoto=OB_DEFAULT_PHOTO
  const photoSrc=d.photoUrl||defaultPhoto
  const isCustomPhoto=!!(d.photoUrl&&d.photoUrl!==defaultPhoto)

      </div>
      <div>

        <div style="font-size:11px;color:var(--muted);margin-top:2px" id="upload-status">${isCustomPhoto?'✓ Eigenes Foto':'Tippen um Foto hochzuladen'}</div>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;color:var(--muted)">Username</span>

          <span style="font-size:13px;font-weight:500">${escHtml(nicheLabel)}</span>
        </div>
      </div>
    </div>`
}

async function onObPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Bild zu groß. Max. 5 MB.');return}
  const statusEl=document.getElementById('upload-status')
  if(statusEl)statusEl.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{
    const img=document.querySelector('#ob-content img[style*="56px"]')
    if(img)img.src=ev.target.result
  }
  reader.readAsDataURL(file)
  if(!obv?.user)return
  const path=`${obv.user.id}/${Date.now()}.${file.name.split('.').pop()}`
  const{error}=await sb.storage.from('profile-images').upload(path,file,{upsert:true})
  if(!obv)return
  const st=document.getElementById('upload-status')
  if(error){showToast('Upload fehlgeschlagen: '+error.message,4000);if(st)st.textContent='Upload fehlgeschlagen';return}
  const{data:{publicUrl}}=sb.storage.from('profile-images').getPublicUrl(path)
  obv.data.photoUrl=publicUrl
  if(st)st.textContent='✓ Eigenes Foto hochgeladen'
  // Update badge
  const badge=document.querySelector('#ob-content div[style*="bottom:-2px"]')
  if(badge){badge.style.background='var(--green)';badge.textContent='✓'}
  e.target.value=''
}

window.nextStep=async function(){
  if(!obv)return
  const collect=OB_STEPS[obv.step-1].collect
  if(!collect())return
  if(obv.step<obv.total){obv.step++;renderStep();return}
  await saveAndFinish()
}
window.prevStep=function(){if(obv&&obv.step>1){obv.step--;renderStep()}}

async function saveAndFinish(){
  const btn=document.getElementById('btn-next')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const d=obv.data
  const{error}=await sb.from('users').update({
    instagram_handle:d.ig||null,
    tiktok_handle:d.tt||null,
    niche_category:d.niche,
    profile_image_url:d.photoUrl||null,
    onboarding_completed:true,
    updated_at:new Date().toISOString()
  }).eq('id',obv.user.id)
  if(!obv||obv.ctx.stale)return
  btn.disabled=false;btn.textContent='Abschließen ✓'
  if(error){showToast('Fehler beim Speichern: '+error.message,4000);return}
  /* Damit der Router-Guard nicht erneut ins Onboarding schickt */
  if(state.profile)state.profile.onboarding_completed=true
  document.getElementById('ob-wrap').classList.add('hidden')
  document.getElementById('success-wrap').classList.remove('hidden')
  confetti()
}

function confetti(){
  const el=document.getElementById('confetti-area')
  const emojis=['🎉','✨','🌟','💫','🎊','🎈']
  let i=0;const iv=setInterval(()=>{
    if(!obv||!document.getElementById('confetti-area')){clearInterval(iv);return}
    el.textContent=emojis[i%emojis.length];i++;if(i>12)clearInterval(iv)
  },200)
  if(obv)obv.confettiTimer=iv
}

// URL-Normalisierung: akzeptiert Nike.de, www.nike.de, https://Nike.de/ → gibt https://nike.de zurück
function normalizeBrandUrl(raw){
  if(!raw)return null
  let s=raw.trim()
  if(!s)return null
  s=s.replace(/^https?:\/\//i,'')
  s=s.replace(/\/+$/,'')
  s=s.replace(/^www\./i,'')
  const slashIdx=s.indexOf('/')
  if(slashIdx>=0){
    s=s.substring(0,slashIdx).toLowerCase()+s.substring(slashIdx)
  }else{
    s=s.toLowerCase()
  }
  if(!/^[a-z0-9-]+\.[a-z0-9.-]+/i.test(s))return null
  return 'https://'+s
}

function slugify(name){
  return String(name||'').toLowerCase().trim()
    .replace(/[äÄ]/g,'ae').replace(/[öÖ]/g,'oe').replace(/[üÜ]/g,'ue').replace(/[ß]/g,'ss')
    .replace(/[^a-z0-9\s_-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')
}

/* ─── Fortschritts-Overlay ───────────────────────────────────────
   Erstellen, Design-Wechsel und Loeschen laufen ueber eine Edge
   Function, die die erzeugte Seite ins Repo committet. Wenn sie
   antwortet, ist die Seite noch nicht im Netz — Cloudflare Pages baut
   danach noch rund fuenfzehn Sekunden. Deshalb zwei Phasen:

   1. Schrittliste auf einem Timer, solange die Function laeuft. Der
      vorletzte Schritt bleibt aktiv, bis die Antwort da ist.
   2. Danach der Schluss-Schritt mit Fortschrittsbalken, der die
      Bauzeit abwartet. Erst dann ist alles gruen und das Overlay geht.
   ───────────────────────────────────────────────────────────────── */
const LOADING_FLOWS={
  biolinkCreate:{
    title:'BioLink wird erstellt',
    sub:'Das dauert einen Moment — bitte lass die Seite offen.',
    steps:['Angaben werden geprüft','Layout wird gebaut','Design wird angewendet','Inhalte werden eingefügt'],
    tail:'Seite geht online',
    tailSub:'Fast geschafft — deine Seite wird gerade ausgeliefert.'
  },
  biolinkTheme:{
    title:'Neues Design wird übernommen',
    sub:'Deine Seite wird mit dem neuen Design neu erzeugt.',
    steps:['Design wird gespeichert','Seite wird neu gebaut'],
    tail:'Neue Fassung geht online',
    tailSub:'Fast geschafft — die neue Fassung wird ausgeliefert.'
  },
  biolinkDelete:{
    title:'BioLink-Seite wird gelöscht',
    sub:'Deine Einstellungen und Links bleiben gespeichert.',
    steps:['Seite wird offline genommen','Verweise werden entfernt'],
    tail:'Änderung wird verteilt',
    tailSub:'Fast geschafft — gleich ist die Seite nicht mehr erreichbar.'
  },
  mediakitCreate:{
    title:'Media Kit wird erstellt',
    sub:'Das dauert einen Moment — bitte lass die Seite offen.',
    steps:['Angaben werden geprüft','Layout wird gebaut','Kennzahlen werden eingesetzt','Design wird angewendet'],
    tail:'Media Kit geht online',
    tailSub:'Fast geschafft — dein Media Kit wird gerade ausgeliefert.'
  },
  mediakitDelete:{
    title:'Media Kit wird gelöscht',
    sub:'Deine Angaben bleiben gespeichert.',
    steps:['Seite wird offline genommen','Verweise werden entfernt'],
    tail:'Änderung wird verteilt',
    tailSub:'Fast geschafft — gleich ist das Media Kit nicht mehr erreichbar.'
  }
}
const LOADING_STEP_MS=6000     // Taktung der Schritte, solange die Function laeuft
const LOADING_HOLD_MS=15000    // Bauzeit von Cloudflare Pages nach der Antwort

let _loadingTimer=null
let _loadingHold=null
let _loadingFlow=null

/* activeIdx zeigt auf den laufenden Schritt; alles davor ist erledigt.
   Der Schluss-Schritt steht am Ende der Liste und bekommt waehrend der
   Wartezeit den Fortschrittsbalken. */
function paintLoadingSteps(activeIdx,withBar){
  const el=document.getElementById('loading-steps')
  if(!el||!_loadingFlow)return
  const all=[..._loadingFlow.steps,_loadingFlow.tail]
  el.innerHTML=all.map((label,i)=>{
    const state=i<activeIdx?'done':i===activeIdx?'active':'wait'
    const bar=(withBar&&i===activeIdx)
      ? `<div class="loading-bar"><span style="animation-duration:${LOADING_HOLD_MS}ms"></span></div>`
      : ''
    return `<div class="flow-step">
      <div class="step-dot ${state}">${state==='done'?icon('check',11):state==='active'?'<span class="spinner" style="width:8px;height:8px;border-width:1.5px"></span>':''}</div>
      <div class="step-body"><div class="step-label ${state}">${escHtml(label)}</div>${bar}</div>
    </div>`
  }).join('')
}

function showLoadingOverlay(flowKey='biolinkCreate'){
  const flow=LOADING_FLOWS[flowKey]||LOADING_FLOWS.biolinkCreate
  _loadingFlow=flow
  document.getElementById('loading-title').textContent=flow.title
  document.getElementById('loading-sub').textContent=flow.sub
  paintLoadingSteps(0)
  document.getElementById('loading-overlay').classList.remove('hidden')
  document.body.style.overflow='hidden'

  let i=0
  const lastTimed=flow.steps.length-1
  const t=setInterval(()=>{
    i++
    // Nicht in den Schluss-Schritt laufen — der kommt erst nach der Antwort
    if(i>=lastTimed){ paintLoadingSteps(lastTimed); clearInterval(t); return }
    paintLoadingSteps(i)
  },LOADING_STEP_MS)
  _loadingTimer=t
  return t
}

/* Die Function ist durch: Schluss-Schritt aktivieren und die Bauzeit
   abwarten, bevor "fertig" behauptet wird. */
function finishLoadingOverlay(timer){
  if(timer)clearInterval(timer)
  _loadingTimer=null
  if(!_loadingFlow)return Promise.resolve()
  const tailIdx=_loadingFlow.steps.length
  paintLoadingSteps(tailIdx,true)
  const sub=document.getElementById('loading-sub')
  if(sub)sub.textContent=_loadingFlow.tailSub
  return new Promise(res=>{
    _loadingHold=setTimeout(()=>{
      _loadingHold=null
      paintLoadingSteps(tailIdx+1)
      setTimeout(()=>{ hideLoadingOverlay(); res() },600)
    },LOADING_HOLD_MS)
  })
}

function hideLoadingOverlay(timer){
  if(timer)clearInterval(timer)
  if(_loadingHold){clearTimeout(_loadingHold);_loadingHold=null}
  _loadingTimer=null
  document.getElementById('loading-overlay')?.classList.add('hidden')
  document.body.style.overflow=''
}
function stopLoadingOverlay(){ if(_loadingTimer){clearInterval(_loadingTimer);_loadingTimer=null} hideLoadingOverlay() }

  blv = { uid, ctx, profile:null, biolink:null, customLinks:[], viewsTotal:0, viewsToday:0, views7Days:0, viewsDaily:[], theme:'color', lang:'de', editingLinkId:null }

  /* Die alte Seite haengt eine Theme-Init an openSheet — hier genauso,
     beim Verlassen der Route wird der Original-Helfer wiederhergestellt. */
  const origOpenSheet = window.openSheet

      document.querySelectorAll('.lang-opt').forEach(b=>b.classList.toggle('selected',b.dataset.lang===blv.lang))

  ctx.onCleanup(() => {
    window.openSheet = origOpenSheet
    stopLoadingOverlay()
    blv = null
    document.body.style.overflow = ''
  })

  ctx.on(document.getElementById('photo-input'), 'change', onBioPhotoPicked)

  await loadBiolink()

async function loadBiolink(){
  const uid = blv.uid
  const[profileRes,biolinkRes,linksRes,viewsDailyRes]=await Promise.all([
    sb.from('users').select('display_name,full_name,profile_image_url,bio,bio_active,instagram_handle,tiktok_handle,youtube_handle,threads_handle,impressum_text,subscription_type,bio_views_total,bio_views_today,bio_views_last_7_days').eq('id',uid).single(),
    sb.from('biolink_viuno').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('biolink_custom_links').select('*').eq('user_id',uid).order('position',{ascending:true}),
    sb.rpc('get_biolink_views_last_7_days_daily',{p_user_id:uid})
  ])
  if(!blv||blv.ctx.stale)return
  blv.profile=profileRes.data
  blv.biolink=biolinkRes.data
  blv.customLinks=linksRes.data||[]
  blv.viewsTotal=blv.profile?.bio_views_total||0
  blv.viewsToday=blv.profile?.bio_views_today||0
  blv.views7Days=blv.profile?.bio_views_last_7_days||0
  blv.viewsDaily=viewsDailyRes.data||[]
  blv.theme=blv.biolink?.theme||'color'
  blv.lang=blv.biolink?.default_language||'de'
  paintBiolink()
}

function paintBiolink(){
  const p=blv.profile
  const isActive=p?.bio_active===true
  const slug=slugify(p?.display_name||'')
  const bioUrl=slug?`viuno.de/${slug}`:null
  const bioFullUrl=slug?`https://viuno.de/${slug}`:null

  // Checkliste
  const checks=[
    {label:'Profilbild hochgeladen',ok:!!(p?.profile_image_url)},
    {label:'Impressum hinterlegt',ok:!!(p?.impressum_text?.trim())},
    {label:'Mindestens 1 Social-Kanal',ok:!!(p?.instagram_handle||p?.tiktok_handle||p?.youtube_handle||p?.threads_handle)},
  ]
  const allOk=checks.every(c=>c.ok)

  const viewsToday=blv.viewsToday
  const views7=blv.views7Days
  const viewsTotal=blv.viewsTotal

  // 7-Tage Bar-Chart-HTML
  const maxVal=Math.max(...blv.viewsDaily.map(d=>d.view_count||0),1)
  const dayLbl=['So','Mo','Di','Mi','Do','Fr','Sa']
  const chartBars=blv.viewsDaily.map(d=>{
    const v=d.view_count||0
    const h=Math.max((v/maxVal)*100,v>0?8:2)
    const dayShort=dayLbl[new Date(d.view_date+'T00:00:00').getDay()]
    return `<div class="chart-col" title="${v} Aufrufe">
      <div class="chart-bar-wrap"><div class="chart-bar ${v>0?'has':''}" style="height:${h}%"></div></div>
      <div class="chart-day">${dayShort}</div>
      <div class="chart-val">${v}</div>
    </div>`
  }).join('')
  const chartHtml=viewsTotal>0?`<div class="chart-wrap"><div class="chart-row">${chartBars}</div></div>`
    :`<div class="chart-empty">Noch keine Aufrufe in den letzten 7 Tagen.</div>`

  renderBioEditMenu()

  const page=document.getElementById('page-content')

  const statusHtml=isActive
    ?`<div class="status-banner active"><div class="status-dot active"></div>
        <div><div class="status-text">Seite ist live<span>Deine Seite ist öffentlich erreichbar</span></div></div></div>
       ${bioUrl?`<div class="link-bar">
         <a class="link-url" href="${bioFullUrl}" target="_blank" rel="noopener">${bioUrl} ${icon('arrowUpRight',13)}</a>
         <button class="link-action-btn" onclick="copyLink('${bioFullUrl}')">Kopieren</button>
       </div>`:''}
       <div class="section">
         <div class="section-label">Aufrufe</div>
         <div class="stats-grid">
           <div class="stat-box"><div class="stat-box-value">${fmtNum(viewsToday)}</div><div class="stat-box-label">Heute</div></div>
           <div class="stat-box"><div class="stat-box-value">${fmtNum(views7)}</div><div class="stat-box-label">7 Tage</div></div>
           <div class="stat-box"><div class="stat-box-value">${fmtNum(viewsTotal)}</div><div class="stat-box-label">Gesamt</div></div>
         </div>
         ${chartHtml}
       </div>`
    :slug?`<div class="status-banner inactive"><div class="status-dot inactive"></div>
        <div><div class="status-text">Seite ist inaktiv<span>Seite wurde deaktiviert — du kannst sie jederzeit wieder aktivieren</span></div></div></div>`
    :''

  const themeCardsHtml=!isActive?buildThemeCards():''

  const checklistHtml=!allOk?`<div class="section">
    <div class="check-card">
      <div class="check-card-title">Checkliste</div>
      <div class="check-card-sub">Das Impressum ist gesetzlich vorgeschrieben.</div>
      ${checks.map(c=>`<div class="check-item">
        <div class="check-dot ${c.ok?'ok':'miss'}">${c.ok?icon('check',12):''}</div>
        <span class="check-label ${c.ok?'ok':'miss'}">${c.label}</span>
      </div>`).join('')}
    </div>
  </div>`:''

  const termsHtml=!isActive?`<div class="action-stack">
    <button class="action-btn action-btn-secondary" onclick="openBioEditMenu()">${icon('pencil',16)} Bearbeiten</button>
  </div>
  <div class="section">
    <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
      <input type="checkbox" id="terms-check" style="width:18px;height:18px;flex-shrink:0;accent-color:var(--text);margin-top:2px;cursor:pointer"/>
      <span style="font-size:13px;color:var(--muted);line-height:1.5">Ich akzeptiere die <a href="/legal#biopage_terms" target="_blank" style="color:var(--text);font-weight:600;text-decoration:underline">Nutzungsbedingungen</a> von viuno.</span>
    </label>
  </div>
  <div class="action-stack">
    <button class="action-btn action-btn-primary" id="btn-generate" onclick="generatePage()" disabled>
      BioLink erstellen
    </button>
  </div>`
  :`<div class="action-stack">
    <button class="action-btn action-btn-primary" onclick="openBioEditMenu()">${icon('pencil',16)} Bearbeiten</button>
  </div>`

  const deleteHtml=isActive
    ?`<div class="action-stack" style="padding-top:20px;padding-bottom:calc(8px + var(--safe-bottom))">
        <button class="action-btn action-btn-danger" onclick="document.getElementById('delete-modal').classList.remove('hidden')">${icon('trash',16)} BioLink-Seite löschen</button>
      </div>`
    :''

  page.innerHTML=`
    ${statusHtml}
    ${themeCardsHtml}
    ${checklistHtml}
    ${termsHtml}
    ${deleteHtml}`

  // Wire terms checkbox
  if(!isActive){
    setTimeout(()=>{
      const tc=document.getElementById('terms-check')
      const bg=document.getElementById('btn-generate')
      if(!tc||!bg)return
      const update=()=>{bg.disabled=!tc.checked||!allOk}
      if(!allOk){bg.title='Bitte alle Punkte der Checkliste erfüllen'}
      blv?.ctx.on(tc,'change',update)
      update()
    },0)
  }

  initBioSheets()
}

/* Name, Bio und Profilbild stehen seit dem Template-Umbau fest im HTML der
   oeffentlichen Seite (fuer Link-Vorschauen in WhatsApp, LinkedIn & Co.).
   Aendert sich eines davon, muss die Seite neu erzeugt werden — im
   Hintergrund, ohne das Vollbild-Overlay von generatePage(). bio_active wird
   frisch gelesen: die Function wuerde eine Seite sonst neu anlegen und
   veroeffentlichen, die der User nie erstellt hat. */
async function regenerateBioPageQuietly(uid){
  try{
    const{data}=await sb.from('users').select('bio_active').eq('id',uid).single()
    if(data?.bio_active!==true)return
    const{data:{session}}=await sb.auth.getSession()
    if(!session)return
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json().catch(()=>({}))
    if(!res.ok||body.success!==true)throw new Error(body.error||`HTTP ${res.status}`)
  }catch(err){
    showToast('Öffentliche Seite nicht aktualisiert: '+err.message,5000)
  }
}

window.generatePage=async function(flow='biolinkCreate'){
  const btn=document.getElementById('btn-generate')
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Wird generiert…'}
  const loadingTimer=showLoadingOverlay(flow)
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||`HTTP ${res.status}`)
    await finishLoadingOverlay(loadingTimer)
    showToast('BioLink veröffentlicht ✓')
    if(blv&&!blv.ctx.stale)await loadBiolink()
  }catch(err){
    hideLoadingOverlay(loadingTimer)
    showToast('Fehler: '+err.message,5000)
    const b=document.getElementById('btn-generate')
    if(b){b.disabled=false;b.textContent=blv?.profile?.bio_active?'Seite neu generieren':'BioLink-Seite erstellen'}
  }
}

window.confirmDelete=async function(){
  closeModal('delete-modal')
  const loadingTimer=showLoadingOverlay('biolinkDelete')
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink?action=delete`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||'Fehler')
    await finishLoadingOverlay(loadingTimer)
    showToast('Seite gelöscht')
    if(blv&&!blv.ctx.stale)await loadBiolink()
  }catch(err){hideLoadingOverlay(loadingTimer);showToast('Fehler: '+err.message,4000)}
}

function initBioSheets(){
  const p=blv.profile
  const bw=document.getElementById('profile-photo-wrap')
  if(bw){
    if(p?.profile_image_url)bw.innerHTML=`<img src="${escHtml(p.profile_image_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;else bw.textContent=(p?.display_name||'?')[0].toUpperCase()
  }
  const bioEl=document.getElementById('s-bio')
  if(bioEl)bioEl.value=p?.bio||''
  const strip=(h)=>h?h.replace(/^@/,''):''
  const igEl=document.getElementById('s-ig');if(igEl)igEl.value=strip(p?.instagram_handle)
  const ttEl=document.getElementById('s-tt');if(ttEl)ttEl.value=strip(p?.tiktok_handle)
  const ytEl=document.getElementById('s-yt');if(ytEl)ytEl.value=strip(p?.youtube_handle)
  const thEl=document.getElementById('s-threads');if(thEl)thEl.value=strip(p?.threads_handle)
  const impEl=document.getElementById('s-impressum');if(impEl)impEl.value=p?.impressum_text||''
  updateThemeUI()
  renderLinksSheet()
}

async function onBioPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Max. 5 MB');return}
  const status=document.getElementById('photo-status')
  if(status)status.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{const bw=document.getElementById('profile-photo-wrap');if(bw)bw.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
  reader.readAsDataURL(file)
  const uid=blv?blv.uid:state.session.user.id
  const path=`${uid}/${Date.now()}.${file.name.split('.').pop()}`
  const{error}=await sb.storage.from('profile-images').upload(path,file,{upsert:true})
  if(error){showToast('Upload fehlgeschlagen');if(status)status.textContent='Fehler';return}
  const{data:{publicUrl}}=sb.storage.from('profile-images').getPublicUrl(path)
  await sb.from('users').update({profile_image_url:publicUrl}).eq('id',uid)
  if(blv?.profile)blv.profile.profile_image_url=publicUrl
  const st=document.getElementById('photo-status')
  if(st)st.textContent='✓ Foto hochgeladen'
  showToast('Profilbild gespeichert ✓')
  if(state.profile){state.profile.profile_image_url=publicUrl;paintUser()}
  e.target.value=''
  regenerateBioPageQuietly(uid)
}

function renderLinksSheet(){
  const list=document.getElementById('links-list')
  if(!list)return
  if(blv.customLinks.length===0){
    list.innerHTML='<div class="empty-links">Noch keine Custom Links hinzugefügt</div>'
  }else{
    list.innerHTML=blv.customLinks.map((l,i)=>`
      <div class="link-row-item" data-id="${escHtml(l.id)}">
        <div class="link-row-body">
          <div class="link-row-title">${escHtml(l.title)}</div>
          <div class="link-row-url">${escHtml(l.url)}</div>
        </div>
        ${l.is_paid?'<span class="link-paid-badge">Werbung</span>':''}
        <button class="link-del-btn" onclick="deleteLink('${escHtml(l.id)}')" aria-label="Link löschen">${icon('x',15)}</button>
      </div>`).join('')
  }
  const addBtn=document.getElementById('btn-add-link')
  if(addBtn)addBtn.style.display=blv.customLinks.length>=10?'none':'flex'
}

window.openAddLink=function(){
  if(!blv)return
  blv.editingLinkId=null
  document.getElementById('link-title').value=''
  document.getElementById('link-url').value=''
  document.getElementById('link-paid').checked=false
  document.getElementById('link-hint').textContent=''
  document.getElementById('add-link-title').textContent='Link hinzufügen'
  openSheet('add-link-sheet')
}

window.confirmAddLink=async function(){
  if(!blv)return
  const title=document.getElementById('link-title').value.trim()
  const urlRaw=document.getElementById('link-url').value.trim()
  const isPaid=document.getElementById('link-paid').checked
  const hint=document.getElementById('link-hint')
  if(!title||!urlRaw){hint.textContent='Titel und URL sind Pflichtfelder.';return}
  const normalUrl=normalizeBrandUrl(urlRaw)
  if(!normalUrl){hint.textContent='Ungültige URL. Beispiel: nike.de';return}
  hint.textContent=''
  const position=blv.customLinks.length
  const{data,error}=await sb.from('biolink_custom_links').insert({
    user_id:blv.uid,title,url:normalUrl,is_paid:isPaid,position
  }).select().single()
  if(!blv)return
  if(error){hint.textContent='Fehler: '+error.message;return}
  blv.customLinks.push(data)
  closeSheet('add-link-sheet')
  renderLinksSheet()
  showToast('Link hinzugefügt ✓')
}

window.deleteLink=async function(id){
  if(!blv)return
  await sb.from('biolink_custom_links').delete().eq('id',id).eq('user_id',blv.uid)
  if(!blv)return
  blv.customLinks=blv.customLinks.filter(l=>l.id!==id)
  renderLinksSheet()
  showToast('Link gelöscht')
}

window.saveLinks=function(){
  backToEditMenu('links-sheet')
  showToast('Links gespeichert ✓')
  paintBiolink()
}

  const uid = mkv.uid
  const[profileRes,mkRes,brandsRes,offersRes,analyseRes,viewsDailyRes]=await Promise.all([
    sb.from('users').select('display_name,full_name,profile_image_url,bio,instagram_handle,tiktok_handle,youtube_handle,threads_handle,impressum_text,mediakit_active,subscription_type,niche_category,city,contact_email,mediakit_views_total,mediakit_views_today,mediakit_views_last_7_days').eq('id',uid).single(),
    sb.from('mediakit_viuno').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('mediakit_brands').select('*').eq('user_id',uid).order('position',{ascending:true}),
    sb.from('mediakit_content_offers').select('offer_type').eq('user_id',uid),
    sb.from('analyse_stats').select('platform,engagement_rate,followers,avg_likes,avg_views,created_at').eq('user_id',uid).order('created_at',{ascending:true}),
    sb.rpc('get_mediakit_views_last_7_days_daily',{p_user_id:uid})
  ])
  if(!mkv||mkv.ctx.stale)return
  mkv.profile=profileRes.data||{}
  mkv.mkData=mkRes.data||{}
  mkv.brands=brandsRes.data||[]
  mkv.offers=new Set((offersRes.data||[]).map(r=>r.offer_type))
  mkv.analyseStats={}
  for(const row of(analyseRes.data||[])) mkv.analyseStats[row.platform]=row
  mkv.viewsTotal=mkv.profile.mediakit_views_total||0
  mkv.viewsToday=mkv.profile.mediakit_views_today||0
  mkv.views7Days=mkv.profile.mediakit_views_last_7_days||0
  mkv.viewsDaily=viewsDailyRes.data||[]
  mkv.isActive=mkv.profile.mediakit_active===true
  mkv.slug=mkv.profile.display_name?slugify(mkv.profile.display_name):null
  mkv.defaultLang=mkv.mkData?.default_language||'de'
  paintMediakit()
}

// ── Analyse-Drift-Check: neue Analyse vorhanden & weicht stark von Media Kit ab? ──
function getAnalysisDrift(){
  if(!mkv.isActive)return null
  const mk=mkv.mkData||{}
  const mkUpdated=mk.updated_at?new Date(mk.updated_at).getTime():0
  const flags=[]
  const ig=mkv.analyseStats.instagram
  if(ig&&ig.created_at&&new Date(ig.created_at).getTime()>mkUpdated&&ig.followers!=null&&mk.followers_instagram!=null&&mk.followers_instagram>0){
    if(Math.abs(ig.followers-mk.followers_instagram)/mk.followers_instagram>0.2)flags.push('Instagram')
  }
  const tt=mkv.analyseStats.tiktok
  if(tt&&tt.created_at&&new Date(tt.created_at).getTime()>mkUpdated&&tt.followers!=null&&mk.followers_tiktok!=null&&mk.followers_tiktok>0){
    if(Math.abs(tt.followers-mk.followers_tiktok)/mk.followers_tiktok>0.2)flags.push('TikTok')
  }
  return flags.length?flags.join(' & '):null
}

function paintMediakit(){
  const p=mkv.profile,mk=mkv.mkData||{}
  const isActive=mkv.isActive&&!!mkv.slug
  const kitUrl=mkv.slug?`viuno.de/kit/${mkv.slug}`:null
  const kitFullUrl=mkv.slug?`https://viuno.de/kit/${mkv.slug}`:null

  const viewsToday=mkv.viewsToday
  const views7=mkv.views7Days
  const viewsTotal=mkv.viewsTotal

  // 7-Tage-Chart-HTML
  const maxVal=Math.max(...mkv.viewsDaily.map(d=>d.view_count||0),1)
  const dayLbl=['So','Mo','Di','Mi','Do','Fr','Sa']
  const chartBars=mkv.viewsDaily.map(d=>{
    const v=d.view_count||0
    const h=Math.max((v/maxVal)*100,v>0?8:2)
    const dayShort=dayLbl[new Date(d.view_date+'T00:00:00').getDay()]
    return `<div class="chart-col" title="${v} Aufrufe">
      <div class="chart-bar-wrap"><div class="chart-bar ${v>0?'has':''}" style="height:${h}%"></div></div>
      <div class="chart-day">${dayShort}</div>
      <div class="chart-val">${v}</div>
    </div>`
  }).join('')
  const chartHtml=viewsTotal>0?`<div class="chart-wrap"><div class="chart-row">${chartBars}</div></div>`
    :`<div class="chart-empty">Noch keine Aufrufe in den letzten 7 Tagen.</div>`

  const checks=getChecks()
  const allChecksOk=checks.every(c=>c.ok)

  const statusHtml=isActive
    ?`<div class="status-banner active"><div class="status-dot active"></div>
        <div class="status-text">Media Kit ist live<span>Deine Seite ist öffentlich erreichbar</span></div></div>
       <div class="link-bar">
         <a class="link-url" href="${kitFullUrl}" target="_blank" rel="noopener">${kitUrl} ${icon('arrowUpRight',13)}</a>
         <button class="link-action-btn" onclick="copyLink('${kitFullUrl}')">Kopieren</button>
       </div>
       <div class="section">
         <div class="section-label">Aufrufe</div>
         <div class="stats-grid">
           <div class="stat-box"><div class="stat-box-value">${fmtNum(viewsToday)}</div><div class="stat-box-label">Heute</div></div>
           <div class="stat-box"><div class="stat-box-value">${fmtNum(views7)}</div><div class="stat-box-label">7 Tage</div></div>
           <div class="stat-box"><div class="stat-box-value">${fmtNum(viewsTotal)}</div><div class="stat-box-label">Gesamt</div></div>
         </div>
         ${chartHtml}
       </div>`
    :`<div class="status-banner inactive"><div class="status-dot inactive"></div>
        <div class="status-text">Noch nicht aktiv<span>Trage deine Daten ein und erstelle dein Media Kit</span></div></div>`

  const drift=getAnalysisDrift()
  const driftHtml=drift?`<div class="link-bar" style="border-color:rgba(184,92,0,.3);background:#fdf3e7;cursor:pointer" onclick="openStatsSheet()">
     <span style="flex:1;font-size:13px;font-weight:600;color:#b85c00">${icon('zap',14)} Neue Analyse verfügbar (${escHtml(drift)}) — Zahlen aktualisieren?</span>
   </div>`:''

  const previewHtml=!isActive?`<div class="preview-wrap">
    <div class="preview-title">Erstelle dein Media Kit</div>
    <div class="preview-sub">Eine professionelle Seite mit allen wichtigen Daten für Marken-Anfragen.</div>
    <div class="preview-img-wrap"><img src="${PREVIEW_IMG}" alt="Media Kit Vorschau" onerror="this.parentElement.style.display='none'"/></div>
  </div>`:''

  const checklistHtml=!isActive?`<div class="section">
    <div class="check-card">
      <div class="check-card-title">Voraussetzungen</div>
      <div class="check-card-sub">Mindest-Angaben damit dein Media Kit veröffentlicht werden kann.</div>
      ${checks.map(c=>`<div class="check-item">
        <div class="check-dot ${c.ok?'ok':'miss'}">${c.ok?icon('check',12):''}</div>
        <span class="check-label ${c.ok?'ok':'miss'}">${c.label}</span>
      </div>`).join('')}
    </div>
  </div>`:''

  const editAndCreateHtml=!isActive?`<div class="action-stack">
    <button class="action-btn action-btn-secondary" onclick="openEditMenu()">${icon('pencil',16)} Bearbeiten</button>
  </div>
  <div class="section">
    <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
      <input type="checkbox" id="terms-check" style="width:18px;height:18px;flex-shrink:0;accent-color:var(--text);margin-top:2px;cursor:pointer"/>
      <span style="font-size:13px;color:var(--muted);line-height:1.5">Ich akzeptiere die <a href="/legal#mediakit_terms" target="_blank" style="color:var(--text);font-weight:600;text-decoration:underline">Nutzungsbedingungen</a> und bestätige dass meine Angaben korrekt sind.</span>
    </label>
  </div>
  <div class="action-stack">
    <button class="action-btn action-btn-primary" id="btn-create" disabled onclick="generateMK()">Media Kit erstellen</button>
  </div>`
  :`<div class="action-stack">
    <button class="action-btn action-btn-primary" onclick="openEditMenu()">${icon('pencil',16)} Bearbeiten</button>
  </div>`

  const deleteHtml=isActive
    ?`<div class="action-stack" style="padding-top:24px;padding-bottom:calc(8px + var(--safe-bottom))">
        <button class="action-btn action-btn-danger" onclick="document.getElementById('delete-modal').classList.remove('hidden')">${icon('trash',16)} Media Kit löschen</button>
      </div>`
    :''

  document.getElementById('page-content').innerHTML=`
    ${statusHtml}
    ${driftHtml}
    ${previewHtml}
    ${checklistHtml}

    ${deleteHtml}
  `

  // Wire terms checkbox
  if(!isActive){
    setTimeout(()=>{
      const tc=document.getElementById('terms-check')
      const bg=document.getElementById('btn-create')
      if(!tc||!bg)return
      const update=()=>{bg.disabled=!tc.checked||!allChecksOk}
      if(!allChecksOk)bg.title='Bitte alle Voraussetzungen erfüllen'
      mkv?.ctx.on(tc,'change',update)
      update()
    },0)
  }
}

window.generateMK=async function(){
  const btn=document.getElementById('btn-create')
  const isUpdate=mkv?.isActive
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Wird generiert…'}
  const loadingTimer=showLoadingOverlay('mediakitCreate')
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-mediakit`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||`HTTP ${res.status}`)
    await finishLoadingOverlay(loadingTimer)
    showToast('Media Kit live ✓')
    if(mkv&&!mkv.ctx.stale)await loadMediakit()
  }catch(err){
    hideLoadingOverlay(loadingTimer)
    showToast('Fehler: '+err.message,5000)
    const b=document.getElementById('btn-create')
    if(b){b.disabled=false;b.textContent=isUpdate?'Media Kit aktualisieren':'Media Kit erstellen'}
  }
}

window.mkConfirmDelete=async function(){
  closeModal('delete-modal')
  const loadingTimer=showLoadingOverlay('mediakitDelete')
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-mediakit?action=delete`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||'Fehler')
    await finishLoadingOverlay(loadingTimer)

    if(mkv&&!mkv.ctx.stale)await loadMediakit()
  }catch(err){hideLoadingOverlay(loadingTimer);showToast('Fehler: '+err.message,4000)}
}

// ── Photo Upload ──
async function onMkPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Max. 5 MB');return}
  const status=document.getElementById('photo-status')
  if(status)status.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{const bw=document.getElementById('profile-photo-wrap');if(bw)bw.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
  reader.readAsDataURL(file)
  const uid=mkv?mkv.uid:state.session.user.id
  const path=`${uid}/${Date.now()}.${file.name.split('.').pop()}`
  const{error}=await sb.storage.from('profile-images').upload(path,file,{upsert:true})
  if(error){showToast('Upload fehlgeschlagen');const st=document.getElementById('photo-status');if(st)st.textContent='Fehler';return}
  const{data:{publicUrl}}=sb.storage.from('profile-images').getPublicUrl(path)
  await sb.from('users').update({profile_image_url:publicUrl}).eq('id',uid)
  if(mkv?.profile)mkv.profile.profile_image_url=publicUrl
  const st=document.getElementById('photo-status')
  if(st)st.textContent='✓ Foto hochgeladen'
  showToast('Profilbild gespeichert ✓')
  if(state.profile){state.profile.profile_image_url=publicUrl;paintUser()}
  e.target.value=''
  regenerateBioPageQuietly(uid)
}

/* aus /analytics/: Datum ohne Uhrzeit */
function fmtDateDMY(d){if(!d)return'–';return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
/* Schloss und Pfeil-Kreis gibt es nicht in ICONS -- sie stammen aus den alten
   Inline-Buttons und werden hier unveraendert weiterverwendet. */
const SVG_LOCK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
const SVG_REFRESH='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>'

/* B5: Der Vergleich laeuft gegen die letzte Analyse, nicht gegen eine Woche.
   Datumsformat kommt aus dem vorhandenen fmtDateShort (oben, aus /dashboard/).
   Zwischen zwei Laeufen lagen real 1, 23 und 109 Tage. */
function deltaSeitLabel(prevRow){
  const d=prevRow?.created_at
  return d?`seit letzter Analyse (${fmtDateShort(d)})`:'seit letzter Analyse'
}

/* View-lokaler Zustand, entspricht dem `S` der alten Seite */
let anv = null

async function renderAnalytics(area, ctx){

/* Ein Kauf deckt genau einen Kanal ab. Die Karte zeigt deshalb je Kanal den
   eigenen Zustand: kein Handle / kein Guthaben / Guthaben da / Analyse laeuft. */
function renderPlatformCards(){
  const el=document.getElementById('plat-cards')
  if(!el||!anv)return
  const p=anv.profile||{}
  const laufend=anv.activeRun?.platform||null

  /* Nach einem fertigen Lauf steht oben nur noch ein Knopf. Zwei Kaufkarten
     direkt ueber dem frisch bezahlten Ergebnis lasen sich wie die Aufforderung,
     sofort nochmal zu zahlen. Die Karten kommen erst auf Klick zurueck --
     ausser es laeuft gerade etwas oder es liegt eine ungenutzte Freischaltung. */
  const fertig=!!(anv.lastDone.instagram||anv.lastDone.tiktok)
  const offeneFreischaltung=!!(anv.purchases.instagram||anv.purchases.tiktok)
  if(fertig&&!laufend&&!offeneFreischaltung&&!anv.kaufOffen){
    el.classList.add('eingeklappt')
    el.innerHTML=`<button class="btn-menue" onclick="kaufKlappe()" aria-expanded="false">
      ${SVG_REFRESH} Neue Analyse
      <svg class="btn-menue-pfeil" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>`
    return
  }
  el.classList.remove('eingeklappt')

  el.innerHTML=['instagram','tiktok'].map(pl=>{
    const label=pl==='instagram'?'Instagram':'TikTok'
    const raw=pl==='instagram'?p.instagram_handle:p.tiktok_handle
    const handle=raw?('@'+String(raw).replace(/^@/,'')):null
    const letzte=anv.lastDone[pl]
    const busy=anv.busy===pl

    let body
    if(!handle){
      body=`<button class="btn-plat ghost" disabled>Kein Kanal verknüpft</button>
        <div class="plat-note">Hinterlege deinen ${label}-Handle, dann kannst du freischalten.
          <a class="plat-link" href="#/profile">Zum Profil</a></div>`
    } else if(laufend===pl){
      body=`<button class="btn-plat" disabled><span class="spinner"></span> Analyse läuft…</button>
        <div class="plat-note">Dauert etwa 1–2 Minuten. Du bekommst auch eine E-Mail, sobald sie fertig ist.</div>`
    } else if(laufend){
      body=`<button class="btn-plat ghost" disabled>Bitte warten</button>
        <div class="plat-note">Es läuft gerade eine ${laufend==='instagram'?'Instagram':'TikTok'}-Analyse.</div>`
    } else if(anv.purchases[pl]){
      body=`<button class="btn-plat" onclick="startPlatform('${pl}')" ${busy?'disabled':''}>
          ${busy?'<span class="spinner"></span> Wird gestartet…':SVG_REFRESH+' Analyse starten'}
        </button>
        <div class="plat-note">Freigeschaltet ✓ — dauert etwa 1–2 Minuten.</div>`
    } else {
      body=`<div class="plat-consent">
          <input type="checkbox" id="consent-${pl}"/>
          <label for="consent-${pl}">Ich stimme zu, dass die Analyse sofort nach Zahlung beginnt, und verliere damit mein 14-tägiges Widerrufsrecht.</label>
        </div>
        <button class="btn-plat" onclick="buyPlatform('${pl}')" ${busy?'disabled':''}>
          ${busy?'<span class="spinner"></span> Einen Moment…':SVG_LOCK+' Zahlungspflichtig freischalten – 9,99 €'}
        </button>
        <div class="plat-note">Einmalig pro Analyse, kein Abo.${letzte?` Deine letzte ${label}-Analyse: ${fmtDateShort(letzte)}`:''}<br>
          Mit dem Kauf gelten unsere <a class="plat-link" href="/legal#agb" target="_blank" rel="noopener">AGB</a>
          und die <a class="plat-link" href="/legal#widerruf" target="_blank" rel="noopener">Widerrufsbelehrung</a>.</div>`
    }

    return `<div class="plat-card${handle?'':' locked'}">
      <div class="plat-card-head">
        ${icon(pl==='instagram'?'instagram':'clapperboard',18)}
        <span class="plat-card-name">${label}</span>
      </div>
      <div class="plat-card-handle${handle?'':' missing'}">${handle?escHtml(handle):'nicht verknüpft'}</div>
      <div class="plat-card-spacer"></div>
      ${body}
    </div>`
  }).join('')
}

// ── Freischaltungen je Plattform laden ──
async function refreshPurchaseState(){
  const{data}=await sb.from('analysis_purchases').select('platform')
    .eq('user_id',anv.uid).is('consumed_at',null)
  if(!anv)return
  anv.purchases={instagram:false,tiktok:false}
  for(const r of (data||[])) if(r.platform) anv.purchases[r.platform]=true
  renderPlatformCards()
}

// ── nach Stripe-Rueckkehr pollen, bis der Webhook die Freischaltung eingetragen hat ──
async function waitForPurchaseAfterPayment(platform){
  const banner=document.getElementById('pay-confirm')
  banner?.classList.remove('hidden')
  for(let i=0;i<8;i++){
    const{data}=await sb.from('analysis_purchases').select('id')
      .eq('user_id',anv.uid).eq('platform',platform).is('consumed_at',null).limit(1).maybeSingle()
    if(!anv||anv.ctx.stale)return
    if(data){
      anv.purchases[platform]=true
      banner?.classList.add('hidden')
      renderPlatformCards()
      showToast('Freigeschaltet ✓ — du kannst die Analyse jetzt starten.',4000)
      return
    }
    await new Promise(r=>setTimeout(r,2000))
    if(!anv||anv.ctx.stale)return
  }
  /* Der Webhook kann ein paar Sekunden brauchen. Die Zahlung ist trotzdem durch --
     das muss der Text sagen, sonst wirkt es wie ein Fehlkauf. */
  if(banner)banner.innerHTML='<span>Deine Zahlung ist eingegangen, die Freischaltung dauert noch einen Moment. Lade die Seite gleich noch einmal neu.</span>'
  await refreshPurchaseState()
}

// ── Kauf-Bereich nach einer fertigen Analyse aufklappen (Punkt 5) ──
window.kaufKlappe=function(){
  if(!anv)return
  anv.kaufOffen=!anv.kaufOffen
  renderPlatformCards()
}

// ── Freischalten: Checkout-Session serverseitig erzeugen ──
window.buyPlatform=async function(platform){
  if(!anv||anv.busy)return
  const box=document.getElementById('consent-'+platform)
  if(!box?.checked){
    showToast('Bitte stimme zuerst der sofortigen Ausführung zu.',3500)
    return
  }
  anv.busy=platform; renderPlatformCards()
  try{
    const{data:{session}}=await sb.auth.getSession()
    if(!session){showToast('Sitzung abgelaufen');location.reload();return}
    const res=await fetch(`${SUPABASE_URL}/functions/v1/create-checkout-session`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'},
      body:JSON.stringify({platform,consent:true})
    })
    const body=await res.json().catch(()=>({}))
    if(!anv||anv.ctx.stale)return
    if(!res.ok||!body.url){
      /* Die Edge Function liefert bereits Klartext (fehlender Handle, fehlende
         Zustimmung, Serverfehler) -- den zeigen wir unveraendert. */
      showToast(body.message||'Der Bezahlvorgang konnte nicht gestartet werden.',5000)
      anv.busy=null; renderPlatformCards()
      return
    }
    location.href=body.url
  }catch(err){
    if(!anv)return
    showToast('Verbindung fehlgeschlagen. Bitte versuche es gleich noch einmal.',4000)
    anv.busy=null; renderPlatformCards()
  }
}

// ── Analyse fuer genau eine Plattform starten ──
window.startPlatform=async function(platform){
  if(!anv||anv.busy)return
  anv.busy=platform; renderPlatformCards()
  try{
    const{data:{session}}=await sb.auth.getSession()
    if(!session){showToast('Sitzung abgelaufen');location.reload();return}
    const res=await fetch(`${SUPABASE_URL}/functions/v1/start-analysis`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'},
      body:JSON.stringify({platform})
    })
    const body=await res.json().catch(()=>({}))
    if(!anv||anv.ctx.stale)return
    anv.busy=null
    if(res.status===402||body.error==='payment_required'){
      anv.purchases[platform]=false
      renderPlatformCards()
      showToast(body.message||'Für diese Analyse ist eine Freischaltung nötig.',4500)
      return
    }
    if(!res.ok||!body.success){
      renderPlatformCards()
      showToast(body.message||'Die Analyse konnte nicht gestartet werden.',5000)
      return
    }
    anv.platform=platform
    anv.runId=body.analysis_run_id
    const fakeRun={
      id:body.analysis_run_id,status:'scraping',platform,
      instagram_done_at:null,instagram_skipped:platform!=='instagram',
      tiktok_done_at:null,tiktok_skipped:platform!=='tiktok',
      error:null,started_at:new Date().toISOString()
    }
    showFlow(fakeRun);poll(body.analysis_run_id)
  }catch(err){
    if(!anv)return
    anv.busy=null; renderPlatformCards()
    showToast('Verbindung fehlgeschlagen. Bitte versuche es gleich noch einmal.',4000)
  }
}

// ── Load KI results ──
async function loadKi(){
  /* Mehr als die neueste Zeile laden: fuer die Delta-Beschriftung wird der
     Zeitpunkt der VORHERIGEN Analyse gebraucht ("seit letzter Analyse (13.09.)"
     statt des frueheren pauschalen "diese Woche"). */
  const[kiRes,statsRes]=await Promise.all([
    sb.from('analyse_ki').select('*').eq('user_id',anv.uid).order('created_at',{ascending:false}).limit(4),
    sb.from('analyse_stats').select('*').eq('user_id',anv.uid).order('created_at',{ascending:false}).limit(20)
  ])
  if(!anv||anv.ctx.stale)return
  if(kiRes.data?.length){
    anv.ki.instagram=kiRes.data.find(r=>r.platform==='instagram')||null
    anv.ki.tiktok=kiRes.data.find(r=>r.platform==='tiktok')||null
  }
  if(statsRes.data?.length){
    for(const pl of ['instagram','tiktok']){
      const rows=statsRes.data.filter(r=>r.platform===pl)
      anv.stats[pl]=rows[0]||null
      anv.prevStats[pl]=rows[1]||null
      anv.lastDone[pl]=rows[0]?.created_at||null
    }
    /* Punkt 8: die Einzel-Beitraege des neuesten Laufs -- eine Ø-Zahl verschluckt,
       dass die Spanne hier von 312 bis 21.735 Likes reicht. */
    const runIds=['instagram','tiktok'].map(pl=>anv.stats[pl]?.analysis_run_id).filter(Boolean)
    if(runIds.length){
      const{data:pd}=await sb.from('apify_daten')
        .select('platform,analysis_run_id,likes,views,posted_at,post_url')
        .in('analysis_run_id',runIds)
      if(!anv||anv.ctx.stale)return
      for(const pl of ['instagram','tiktok']){
        const rid=anv.stats[pl]?.analysis_run_id
        anv.posts[pl]=rid?(pd||[]).filter(r=>r.analysis_run_id===rid&&r.platform===pl)
          .sort((x,y)=>new Date(x.posted_at||0)-new Date(y.posted_at||0)):[]
      }
    }
  }
  renderPlatformCards()
  renderAnalyticsContent()
}

// ── Status Flow ──
function showFlow(run){
  document.getElementById('status-flow').classList.remove('hidden')
  /* Der laufende Kanal wird in den Karten als "Analyse läuft…" gezeigt,
     der andere als "Bitte warten" -- ein globaler Button existiert nicht mehr. */
  anv.activeRun=run
  anv.busy=null
  renderPlatformCards()
  renderFlow(run)
}

function renderFlow(run){
  /* Ein Lauf deckt genau eine Plattform ab. Frueher richteten sich die Schritte
     nach den hinterlegten Handles -- jetzt nach dem, was dieser Lauf wirklich tut. */
  const hasIg=run.platform?run.platform==='instagram':!run.instagram_skipped
  const hasTt=run.platform?run.platform==='tiktok':!run.tiktok_skipped
  const igDone=run.instagram_done_at||run.instagram_skipped
  const ttDone=run.tiktok_done_at||run.tiktok_skipped
  const s=run.status

  const steps=[]
  steps.push({label:'Analyse gestartet',state:'done'})
  if(hasIg)steps.push({label:'Instagram-Beiträge werden abgerufen',state:igDone?'done':(s==='scraping'&&!igDone?'active':'wait')})
  if(hasTt)steps.push({label:'TikTok-Videos werden abgerufen',state:ttDone?'done':(s==='scraping'&&igDone&&!ttDone?'active':hasTt&&!ttDone?'wait':'done')})
  steps.push({label:'Auswertung läuft',state:s==='analyzing'?'active':(s==='done'?'done':'wait')})
  steps.push({label:'Ergebnisse bereit',state:s==='done'?'done':'wait'})

  document.getElementById('flow-steps').innerHTML=steps.map(st=>`
    <div class="flow-step">
      <div class="step-dot ${st.state}">${st.state==='done'?icon('check',11):st.state==='active'?'<span class="spinner" style="width:8px;height:8px;border-width:1.5px"></span>':''}</div>
      <div class="step-label ${st.state}">${st.label}</div>
    </div>`).join('')

  const isDone=s==='done', isFailed=s==='failed'
  const iconEl=document.getElementById('flow-icon')
  const title=document.getElementById('flow-title')
  const sub=document.getElementById('flow-sub')
  /* B8: Ein Teilfehler laesst den Run auf 'done' stehen, der Kauf ist trotzdem
     verbraucht. Der Hinweis darf deshalb nicht nur im failed-Zweig erscheinen. */
  if(isDone&&run.error){iconEl.innerHTML=icon('x',16);iconEl.className='flow-icon error';title.textContent='Analyse teilweise abgeschlossen';sub.textContent=run.error}
  else if(isDone){iconEl.innerHTML=icon('check',16);iconEl.className='flow-icon done';title.textContent='Analyse abgeschlossen';sub.textContent='Deine Ergebnisse wurden aktualisiert'}
  else if(isFailed){iconEl.innerHTML=icon('x',16);iconEl.className='flow-icon error';title.textContent='Analyse fehlgeschlagen';sub.textContent=run.error||'Bitte versuche es erneut'}
  else{iconEl.innerHTML='<span class="spinner-dark"></span>';iconEl.className='flow-icon running';title.textContent='Analyse läuft';sub.textContent=s==='analyzing'?'Auswertung läuft…':'Daten werden abgerufen…'}
}

// ── Polling ──
function poll(runId){
  if(anv.pollTimer)clearInterval(anv.pollTimer)
  anv.pollTimer=setInterval(async()=>{
    const{data:run}=await sb.from('analysis_runs').select('*').eq('id',runId).single()
    if(!anv||anv.ctx.stale)return
    if(!run)return
    renderFlow(run)
    if(run.status==='done'||run.status==='failed'){
      clearInterval(anv.pollTimer);anv.pollTimer=null
      anv.activeRun=null
      if(run.status==='done'){
        anv.kaufOffen=false
        const{data:p}=await sb.from('users').select('instagram_handle,tiktok_handle,subscription_type').eq('id',anv.uid).single()
        if(!anv||anv.ctx.stale)return
        if(p)anv.profile={...anv.profile,...p}
        await refreshPurchaseState()
        if(!anv||anv.ctx.stale)return
        await loadKi()
        if(!anv||anv.ctx.stale)return
        showToast(run.error?'Analyse teilweise fertig':'Analyse fertig ✓',run.error?5000:undefined)
        /* Bei einem Teilfehler bleibt der Kasten stehen -- der Hinweis darf nicht wegblenden. */
        if(!run.error)setTimeout(()=>{document.getElementById('status-flow')?.classList.add('hidden')},4000)
      } else {
        await refreshPurchaseState()
        if(!anv||anv.ctx.stale)return
        showToast(run.error||'Analyse fehlgeschlagen — deine Freischaltung bleibt erhalten',6000)
      }
    }
  },5000)
}

  document.getElementById('handle-modal')?.classList.add('hidden')
