let viewToken = 0
let viewCleanups = []

function runCleanups() {
  const fns = viewCleanups
  viewCleanups = []
  for (const fn of fns) { try { fn() } catch (e) { console.warn('cleanup failed', e) } }
}

function makeCtx() {
  const token = ++viewToken
  return {
    get stale() { return token !== viewToken },
    onCleanup(fn) { if (token === viewToken) viewCleanups.push(fn) },
    /* Listener, der sich beim Verlassen der View selbst abmeldet */
    on(target, type, handler, opts) {
      target.addEventListener(type, handler, opts)
      this.onCleanup(() => target.removeEventListener(type, handler, opts))
    },
    /* Intervall, das beim Verlassen der View gestoppt wird */
    interval(fn, ms) {
      const id = setInterval(fn, ms)
      this.onCleanup(() => clearInterval(id))
      return id
    }
  }
}

function currentRoute() {
  const raw = (location.hash || '').replace(/^#\/?/, '').split('?')[0].split('/')[0].trim().toLowerCase()
  return ROUTES[raw] ? raw : null
}

/* ─────────────────────────────────────────────
   ROUTER + Session-Guard
   Regeln (aus /dashboard/ übernommen):
     - keine Session            → #/login
     - Session + onboarding_completed === false → #/onboarding
     - Session + Default        → #/dashboard
   ───────────────────────────────────────────── */
async function router() {
  let name = currentRoute()

  // Ohne Session: öffentliche Routen normal, die Produkt-Routen als Vorschau
  // mit Beispieldaten (Launch-Check 15.09.2026). Profil und Onboarding haben
  // ohne Konto nichts zu zeigen und fuehren weiter zum Login.
  let vorschau = false
  if (!state.session) {
    if (!name || !ROUTES[name].public) {
      if (name && VORSCHAU_ROUTEN.includes(name)) vorschau = true
      else { navigate('#/login'); return }
    }
  } else {
    // Mit Session: Login/Register überspringen
    if (!name || ROUTES[name].public) { navigate('#/' + DEFAULT_ROUTE); return }
    // Profil unvollständig → Onboarding erzwingen
    if (needsOnboarding() && name !== 'onboarding') { navigate('#/onboarding'); return }
  }

  state.route = name
  const route = ROUTES[name]
  const chromeless = route.public || (route.chromeless && !vorschau)

  document.getElementById('shell').classList.toggle('auth-mode', !!chromeless)
  document.getElementById('shell').classList.toggle('wide', !!route.chromeless)
  document.getElementById('topbar-title').textContent = route.title
  document.title = 'viuno · ' + route.title
  setActiveMenuItem(name)
  closeSidebar()
  closeModal()
  document.getElementById('vs-modal')?.classList.remove('offen')

  runCleanups()
  const ctx = makeCtx()

  const area = document.getElementById('content-area')
  area.innerHTML = ''
  window.scrollTo(0, 0)
  if (vorschau) await renderVorschau(area, ctx, name)
  else await route.render(area, ctx)
}

/* ─────────────────────────────────────────────
   Sieben Routen, fuenf Ziele
   BioLink und Media Kit sind dieselbe Sache — die oeffentliche Seite —
   und teilen sich Profil, Kontakt-E-Mail, Nische und den Generator.
   Analyse und Brand Ready haengen beide an analyse_stats; Brand Ready
   zeigt ohne Analyse ohnehin nur die Sperrtafel. Deshalb je ein Tab
   mit Unternavigation statt zwei Eintraege oder ein "Mehr"-Menue.
   ───────────────────────────────────────────── */
const TABS = {
  dashboard:  'start',
  biolink:    'seiten',   mediakit:   'seiten',
  analytics:  'analyse',  brandready: 'analyse',
  digest:     'news',
  profile:    'profil'
}
const SUBNAVS = {
  seiten:  [{ route: 'biolink',   label: 'BioLink'    }, { route: 'mediakit',   label: 'Media Kit'   }],
  analyse: [{ route: 'analytics', label: 'Analyse'    }, { route: 'brandready', label: 'Brand Ready' }]
}

function setActiveMenuItem(name) {
  const tab = TABS[name] || null
  document.querySelectorAll('.tabbar .v-tab').forEach(el => {
    el.classList.toggle('aktiv', el.dataset.tab === tab)
  })

  /* Die Unternavigation baut der Router, nicht die View: sonst muesste
     jede der vier Views dieselbe Leiste selbst erzeugen und beim naechsten
     Umbau wuerden drei davon vergessen. */
  const sub = document.getElementById('subnav')
  if (!sub) return
  const eintraege = SUBNAVS[tab]
  sub.className = eintraege ? 'v-pillen' : ''
  sub.innerHTML = !eintraege ? '' : eintraege.map(e =>
    `<a class="v-pille${e.route === name ? ' aktiv' : ''}" href="#/${e.route}">${escHtml(e.label)}</a>`
  ).join('')
}

/* Wie in /dashboard/: nur ein explizites false erzwingt Onboarding. */
function needsOnboarding() {
  return state.profile ? state.profile.onboarding_completed === false : false
}

/* ─────────────────────────────────────────────
   Session laden
   ───────────────────────────────────────────── */
async function loadSession() {
  const { data: { session } } = await sb.auth.getSession()
  state.session = session || null
  state.profile = null
  /* Parallel, nicht nacheinander: die Signatur ist eine einzelne Zeile und
     soll den ersten Aufbau nicht um eine zweite Rundreise verzoegern. */
  if (session) await Promise.all([loadProfile(session.user.id), ladeSignatur(session.user.id)])
  paintUser()
  if (session) merkeAktiv(session.user.id)
}

/* users.last_active_at gibt es seit April und war bei jedem Konto leer --
   nichts hat die Spalte je geschrieben. "Wer benutzt die App ueberhaupt
   noch" liess sich damit nicht beantworten, und das ist die Frage, die bei
   Wachstum als erste kommt.

   Hoechstens einmal pro Stunde, sonst schreibt jeder Seitenwechsel. Der
   Zeitstempel im localStorage ist nur die Drossel: geht er verloren, wird
   einmal zu viel geschrieben, mehr nicht. Fehler werden verschluckt -- ein
   fehlgeschlagener Zeitstempel darf den Start der App nicht aufhalten. */
function merkeAktiv(uid) {
  try {
    const schluessel = 'viuno-aktiv-' + uid
    const zuletzt = +(localStorage.getItem(schluessel) || 0)
    if (Date.now() - zuletzt < 3600000) return
    localStorage.setItem(schluessel, String(Date.now()))
  } catch (_) { /* privater Modus: dann eben jedes Mal */ }
  sb.from('users').update({ last_active_at: new Date().toISOString() }).eq('id', uid).then(() => {}, () => {})
}

async function loadProfile(uid) {
  const { data } = await sb.from('users')
    .select('display_name, full_name, profile_image_url, onboarding_completed, subscription_type')
    .eq('id', uid).single()
  state.profile = data || null
}

/* Initiale als Grund, Bild darueber. decoding="async" haelt das Zeichnen
   der Seite nicht auf, wenn die Datei gross ist. */
function avatarInhalt(url, name){
  const initial = escHtml(String(name||'?').trim().charAt(0).toUpperCase() || '?')
  return initial + (url ? `<img src="${escHtml(url)}" alt="" decoding="async">` : '')
}

function paintUser() {
  const av  = document.getElementById('user-avatar')
  const tab = document.getElementById('tab-avatar')
  if (!state.session) { if (av) av.textContent = '?'; if (tab) tab.innerHTML = ''; return }
  const p = state.profile
  const name = p?.display_name || p?.full_name || state.session.user.email || '?'
  const bild = p?.profile_image_url
  if (av) { av.innerHTML = avatarInhalt(bild, name); av.title = name }
  /* Derselbe Avatar noch einmal unten in der Leiste: er ist dort das
     Symbol fuer "Profil" und zugleich der Beleg, welches Foto oeffentlich
     steht — die Frage, die auf dieser Seite am haeufigsten gestellt wird. */
  if (tab) tab.innerHTML = avatarInhalt(bild, name)
}

/* ─────────────────────────────────────────────
   Signaturfarbe
   Die App traegt das Design, das der Creator fuer seine BioLink-Seite
   gewaehlt hat. Faellt die Abfrage aus, bleibt "color" stehen — die App
   ist dann nicht falsch gefaerbt, sondern im Standard.
   ───────────────────────────────────────────── */
async function ladeSignatur(uid) {
  try {
    const { data } = await sb.from('biolink_viuno').select('theme').eq('user_id', uid).maybeSingle()
    const t = data?.theme
    if (t === 'dark' || t === 'clean') document.documentElement.setAttribute('data-thema', t)
    else document.documentElement.removeAttribute('data-thema')
  } catch (e) { /* Standard bleibt stehen */ }
}

async function renderVorschau(area, ctx, name){

    ${demo}
    ${vsWand(name)}
  </div>`
  if (name !== 'digest') return
  /* Die News sind oeffentlich (digest_cards_today ist fuer anon lesbar) --
     hier stehen also echte Karten, keine Beispiele. */
  const { data } = await sb.from('digest_cards_today')
    .select('slug, headline, summary, platform_label, relevance_score').order('relevance_score', { ascending: false }).limit(5)
  if (ctx.stale) return
  const box = document.getElementById('vs-news'); if (!box) return
  if (!data || !data.length) { box.innerHTML = '<div class="vs-s">Diese Woche gibt es noch keine Ausgabe. <a href="/news">Zum Archiv</a></div>'; return }
  box.innerHTML = data.map(k => `<a class="vs-news" href="/news/${encodeURIComponent(k.slug)}">
      <span><span class="v-badge v-badge--ohne">${escHtml(k.platform_label || 'Allgemein')}</span></span>
      <span class="vs-news-h">${escHtml(k.headline)}</span>
      <span class="vs-s">${escHtml(k.summary || '')}</span>
    </a>`).join('') + '<a class="v-btn v-btn--rand v-btn--breit" href="/news">Alle News lesen</a>'
}

/* ═══════════════════════════════════════════════════════════════
   VIEW: LOGIN — übernommen aus public/login/index.html
   Fehlermeldungen, Enter-Verhalten und Validierung unverändert.
   Angepasst: location.replace('/dashboard') → Hash-Route, damit der
   Router die Onboarding-Weiche ziehen kann.
   ═══════════════════════════════════════════════════════════════ */
function renderLogin(area, ctx) {
  area.innerHTML = `
    <div class="view-auth">
      <div class="logo">
        <div class="logo-mark">v</div>
        <div class="logo-text">viuno</div>
      </div>
      <div class="v-karte card">
        <div class="card-title">Willkommen zurück.</div>
        <div class="card-sub">Melde dich mit deinem viuno-Account an.</div>
        <div class="v-feld">
          <label>E-Mail</label>
          <input class="v-input" type="email" id="inp-email" placeholder="du@beispiel.de" autocomplete="email"/>
        </div>
        <div class="v-feld">
          <label>Passwort</label>
          <input class="v-input" type="password" id="inp-pw" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button class="v-btn v-btn--dunkel v-btn--breit" id="btn-login">Einloggen</button>
        <div class="v-hinweis v-hinweis--fehler auth-fehler" id="error-msg"></div>
        <div style="text-align:center;margin-top:14px">
          <a href="/reset-password" class="v-hint" style="text-decoration:none">Passwort vergessen?</a>
        </div>
      </div>
      <div class="link-row">
        Noch kein Account? <a href="#/register">Jetzt registrieren</a>
        <br><a href="#/dashboard" style="display:inline-block;margin-top:10px;color:var(--subtle)">Erst mal umsehen →</a>
      </div>
    </div>`

  const emailEl = document.getElementById('inp-email')
  const pwEl    = document.getElementById('inp-pw')
  const btn     = document.getElementById('btn-login')
  const errEl   = document.getElementById('error-msg')

  function showError(msg){ errEl.textContent = msg; errEl.classList.add('show') }
  function hideError(){ errEl.classList.remove('show') }

  async function doLogin(){
    hideError()
    const email = emailEl.value.trim()
    const pw    = pwEl.value
    if(!email||!pw){ showError('Bitte E-Mail und Passwort eingeben.'); return }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw })
    if (ctx.stale) return
    btn.disabled = false; btn.textContent = 'Einloggen'
    if(error){
      if(error.message.includes('Invalid login')||error.message.includes('invalid_credentials')){
        showError('E-Mail oder Passwort falsch.')
      } else if(error.message.includes('Email not confirmed')){
        showError('Bitte bestätige zuerst deine E-Mail-Adresse.')
      } else {
        showError(error.message)
      }
      return
    }
    state.session = data.session
    await loadProfile(data.session.user.id)
    paintUser()
    navigate('#/' + DEFAULT_ROUTE)   // Router schickt ggf. weiter ins Onboarding
  }

  ctx.on(btn, 'click', doLogin)
  ctx.on(pwEl, 'keydown', e => { if(e.key==='Enter') doLogin() })
  ctx.on(emailEl, 'keydown', e => { if(e.key==='Enter') pwEl.focus() })
}

/* ═══════════════════════════════════════════════════════════════
   VIEW: REGISTER — übernommen aus public/register/index.html
   Username-Live-Check (RPC is_username_available, 500 ms Debounce),
   Passwort-Hinweis, Nischen-Grid, Legal-Checkbox, signUp-Optionen,
   users-Update und Success-Karte unverändert.
   ═══════════════════════════════════════════════════════════════ */
const NICHES_REGISTER = [
  ['lifestyle','Lifestyle'],['fashion','Fashion'],['beauty','Beauty'],['food','Food'],
  ['fitness','Fitness'],['travel','Travel'],['gaming','Gaming'],['music','Music'],
  ['comedy','Comedy'],['education','Bildung & Wissen'],['business','Business'],['tech','Tech'],
  ['art','Art'],['family','Family'],['mental_health','Mental Health'],['general','Allgemein']
]

function renderRegister(area, ctx) {
  area.innerHTML = `
    <div class="view-auth">
      <div class="logo">
        <div class="logo-mark">v</div>
        <div class="logo-text">viuno</div>
      </div>

          <div class="field-hint" id="username-hint">Dein öffentlicher Name auf viuno.de</div>
        </div>

        <div class="v-feld">
          <label>E-Mail</label>
          <input class="v-input" type="email" id="inp-email" placeholder="du@beispiel.de" autocomplete="email"/>
        </div>

        <div class="v-feld">
          <label>Passwort</label>
          <input class="v-input" type="password" id="inp-pw" placeholder="Mindestens 8 Zeichen" autocomplete="new-password"/>
          <div class="field-hint" id="pw-hint"></div>
        </div>

        <div class="v-feld">
          <label>Passwort bestätigen</label>
          <input class="v-input" type="password" id="inp-pw2" placeholder="••••••••" autocomplete="new-password"/>
        </div>

        <div class="section-divider"></div>

        <div class="v-feld">
          <label>Nische</label>
          <div class="niche-grid" id="niche-grid">
            ${NICHES_REGISTER.map(([key,label]) =>
              `<button class="niche-btn" data-niche="${key}">${label}</button>`).join('')}
          </div>
          <div class="field-hint" id="niche-hint" style="margin-top:4px">Bitte wähle deine Nische.</div>
        </div>

        <div class="section-divider"></div>

        <div class="v-karte v-karte--flach" style="padding:12px 14px;margin-bottom:14px">
          <label class="v-checkbox legal-check" style="align-items:flex-start">
            <input type="checkbox" id="chk-legal" style="margin-top:1px"/>
            <span style="font-size:var(--t-sm);color:var(--muted);line-height:1.55">Ich habe die <a href="/legal#agb" target="_blank" style="color:var(--text);font-weight:600;text-decoration:none">AGB</a> und <a href="/legal#datenschutz" target="_blank" style="color:var(--text);font-weight:600;text-decoration:none">Datenschutzerklärung</a> gelesen und akzeptiere sie.</span>
          </label>
        </div>

        <button class="v-btn v-btn--dunkel v-btn--breit" id="btn-register">Account erstellen</button>
        <div class="v-hinweis v-hinweis--fehler auth-fehler" id="error-msg"></div>
      </div>

      <div class="link-row" id="login-link">
        Bereits registriert? <a href="#/login">Einloggen</a>
      </div>

      <!-- SUCCESS -->
      <div class="v-karte card success-state" id="success-card">
        <div class="v-leer" style="padding:8px 0">
          <div class="sym akzent"><svg class="v-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></div>
          <h3>Fast geschafft!</h3>
          <p>Wir haben eine Bestätigungsmail an<br><b style="color:var(--text)" id="success-email"></b><br><br>gesendet. Klicke auf den Link in der Mail um deinen Account zu aktivieren und direkt loszulegen.</p>
        </div>
      </div>
    </div>`

  let selectedNiche = null
  let usernameValid = false
  let _unameTimer = null
  /* Debounce-Timer stoppen, wenn die View verlassen wird */
  ctx.onCleanup(() => clearTimeout(_unameTimer))

  const $ = id => document.getElementById(id)

  function selectNiche(n){
    selectedNiche = n
    document.querySelectorAll('.niche-btn').forEach(b => b.classList.toggle('active', b.dataset.niche === n))
    $('niche-hint').style.display = 'none'
  }
  document.querySelectorAll('#niche-grid .niche-btn').forEach(b => {
    ctx.on(b, 'click', () => selectNiche(b.dataset.niche))
  })

  function onUsernameInput(){
    const val   = $('inp-username').value.trim()
    const hint  = $('username-hint')
    const input = $('inp-username')
    usernameValid = false
    clearTimeout(_unameTimer)

    if(!val){
      hint.textContent = 'Dein öffentlicher Name auf viuno.de'
      hint.className = 'field-hint'
      input.classList.remove('invalid')
      return
    }
    if(!/^[a-zA-Z0-9_]{3,30}$/.test(val)){
      hint.textContent = '3–30 Zeichen, nur Buchstaben, Zahlen und _'
      hint.className = 'field-hint error'
      input.classList.add('invalid')
      return
    }
    // Format ok — check availability after 500ms
    hint.textContent = 'Wird geprüft…'
    hint.className = 'field-hint'
    hint.style.color = 'var(--muted)'
    input.classList.remove('invalid')

    _unameTimer = setTimeout(async () => {
      const { data, error } = await sb.rpc('is_username_available', { p_username: val })
      if (ctx.stale) return
      if(error||!data){
        hint.textContent = 'Fehler beim Prüfen — bitte nochmal versuchen.'
        hint.className = 'field-hint error'
        return
      }
      if(data.available){
        hint.textContent = '✓ Verfügbar!'
        hint.className = 'field-hint'
        hint.style.color = 'var(--green)'
        input.classList.remove('invalid')
        usernameValid = true
      } else {
        const msgs = {
          taken:'Dieser Username ist leider vergeben.',
          reserved:'Dieser Username ist reserviert.',
          invalid_format:'Ungültiges Format.'
        }
        hint.textContent = msgs[data.reason]||'Nicht verfügbar.'
        hint.className = 'field-hint error'
        input.classList.add('invalid')
        usernameValid = false
      }
    }, 500)
  }
  ctx.on($('inp-username'), 'input', onUsernameInput)

  function checkPwStrength(){
    const pw = $('inp-pw').value
    const hint = $('pw-hint')
    if(!pw){ hint.textContent=''; return }
    if(pw.length<8){ hint.textContent='Zu kurz — mindestens 8 Zeichen.'; hint.className='field-hint error'; return }
    hint.textContent = '✓ Passwort sieht gut aus'
    hint.className = 'field-hint'; hint.style.color = 'var(--green)'
  }
  ctx.on($('inp-pw'), 'input', checkPwStrength)

  function showError(msg){
    const el = $('error-msg')
    el.textContent = msg; el.classList.add('show')
    el.scrollIntoView({ behavior:'smooth', block:'nearest' })
  }
  function hideError(){ $('error-msg').classList.remove('show') }

  async function doRegister(){
    hideError()
    const username = $('inp-username').value.trim()
    const email    = $('inp-email').value.trim()
    const pw       = $('inp-pw').value
    const pw2      = $('inp-pw2').value
    const legal    = $('chk-legal').checked

    if(!username){ showError('Bitte gib einen Username ein.'); return }
    if(!usernameValid){ showError('Bitte wähle einen verfügbaren Username.'); return }
    if(!email){ showError('Bitte gib deine E-Mail-Adresse ein.'); return }
    if(pw.length<8){ showError('Das Passwort muss mindestens 8 Zeichen lang sein.'); return }
    if(pw!==pw2){ showError('Die Passwörter stimmen nicht überein.'); return }
    if(!selectedNiche){
      $('niche-hint').style.display = 'block'
      $('niche-hint').textContent = 'Bitte wähle eine Nische.'
      $('niche-hint').className = 'field-hint error'
      showError('Bitte wähle deine Nische aus.'); return
    }
    if(!legal){ showError('Bitte akzeptiere AGB und Datenschutzerklärung.'); return }

    const btn = $('btn-register')
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Account wird erstellt…'

    // Final availability check before submit (race condition safety)
    const { data: check } = await sb.rpc('is_username_available', { p_username: username })
    if (ctx.stale) return
    if(!check?.available){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      showError('Dieser Username ist nicht mehr verfügbar. Bitte wähle einen anderen.'); return
    }

    // Sign up
    const { data, error } = await sb.auth.signUp({
      email,
      password: pw,
      options:{
        data:{ display_name: username, niche_category: selectedNiche },
        emailRedirectTo:'https://viuno.de/onboarding'
      }
    })
    if (ctx.stale) return

    if(error){
      btn.disabled = false; btn.textContent = 'Account erstellen'
      if(error.message.includes('already registered')||error.message.includes('already been registered')){
        showError('Diese E-Mail-Adresse ist bereits registriert. Bitte logge dich ein.')
      } else {
        showError(error.message)
      }
      return
    }

    // Update users table (trigger creates the row, we set display_name + niche)
    if(data.user){
      await sb.from('users').update({
        display_name: username,
        niche_category: selectedNiche,
        updated_at: new Date().toISOString()
      }).eq('id', data.user.id)
    }
    if (ctx.stale) return

    // Show success
    btn.disabled = false; btn.textContent = 'Account erstellen'
    $('form-card').style.display = 'none'
    $('login-link').style.display = 'none'
    $('success-email').textContent = email
    $('success-card').classList.add('show')
  }

  ctx.on($('btn-register'), 'click', doRegister)
  ctx.on($('inp-pw2'), 'keydown', e => { if(e.key==='Enter') doRegister() })
}

/* View-lokaler Zustand, entspricht dem `state` der alten Seite */
let obv = null

async function renderOnboarding(area, ctx){

  area.innerHTML = `

// ─── steps ───
const OB_STEPS=[
  {title:'Deine Kanäle.',sub:'Verbinde deine Social-Media-Kanäle. Du kannst das auch später erledigen.',render:renderObStep1,collect:collectObStep1},
  {title:'Fast fertig.',sub:'Überprüfe deine Angaben und klick auf Abschließen.',render:renderObStep3,collect:()=>true},
]

function renderStep(){
  const s=OB_STEPS[obv.step-1]
  document.getElementById('step-label').textContent=`Schritt ${obv.step} von ${obv.total}`
  document.getElementById('progress-fill').style.width=`${(obv.step/obv.total)*100}%`
  document.getElementById('btn-back').classList.toggle('hidden',obv.step===1)
  document.getElementById('btn-next').textContent=obv.step===obv.total?'Abschließen ✓':'Weiter →'
  document.getElementById('btn-next').disabled=false
  const content=document.getElementById('ob-content')
  // Clear first, then set header, then let render() append
  content.innerHTML=`<div class="step-num">Schritt ${obv.step} / ${obv.total}</div><div class="step-title">${s.title}</div><div class="step-sub">${s.sub}</div>`
  s.render(content)
}

function renderObStep1(el){
  el.innerHTML+=`<div class="v-feld"><label>Instagram-Handle (optional)</label><div class="sheet-input-wrap"><span class="sheet-prefix">@</span><input type="text" class="sheet-prefix-input" id="s-ig" value="${escHtml(obv.data.ig)}" placeholder="dein_handle" autocapitalize="none"/></div></div>
    <div class="v-feld"><label>TikTok-Handle (optional)</label><div class="sheet-input-wrap"><span class="sheet-prefix">@</span><input type="text" class="sheet-prefix-input" id="s-tt" value="${escHtml(obv.data.tt)}" placeholder="dein_handle" autocapitalize="none"/></div></div>`
}
function collectObStep1(){
  obv.data.ig=document.getElementById('s-ig')?.value.trim().replace(/^@/,'')||''
  obv.data.tt=document.getElementById('s-tt')?.value.trim().replace(/^@/,'')||''
  return true
}

function renderObStep3(el){
  const d=obv.data
  const nicheFound=NICHES_ONBOARDING.find(n=>n.key===d.niche)
  const nicheLabel=nicheFound?(nicheFound.emoji+' '+nicheFound.label):(d.niche||'–')
  const defaultPhoto=OB_DEFAULT_PHOTO
  const photoSrc=d.photoUrl||defaultPhoto
  const isCustomPhoto=!!(d.photoUrl&&d.photoUrl!==defaultPhoto)
  el.innerHTML+=`
    <!-- Profilbild -->
    <div class="v-karte" style="display:flex;align-items:center;gap:16px;cursor:pointer" onclick="document.getElementById('photo-input').click()">

        <div style="position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;border:2px solid var(--surface);background:${isCustomPhoto?'var(--green)':'var(--subtle)'};color:#fff">${isCustomPhoto?'✓':'✕'}</div>
      </div>
      <div>
        <div style="font-size:var(--t-sm);font-weight:var(--fw-sb)">Profilbild</div>
        <div class="v-hint" id="upload-status">${isCustomPhoto?'✓ Eigenes Foto':'Tippen um Foto hochzuladen'}</div>
      </div>
    </div>
    <!-- Review -->
    <div class="v-karte" style="padding:4px 16px">
      <div class="v-kpi-zeile"><span>Username</span><b class="v-num" style="font-size:var(--t-sm)">@${escHtml(d.username||'–')}</b></div>
      <div class="v-kpi-zeile"><span>E-Mail</span><b style="font-size:var(--t-sm);font-weight:var(--fw-md);max-width:60%;text-overflow:ellipsis;overflow:hidden;white-space:nowrap">${escHtml(d.email||'–')}</b></div>
      <div class="v-kpi-zeile"><span>Nische</span><b style="font-size:var(--t-sm);font-weight:var(--fw-md)">${escHtml(nicheLabel)}</b></div>
    </div>`
}

async function onObPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Bild zu groß. Max. 5 MB.');return}
  const statusEl=document.getElementById('upload-status')
  if(statusEl)statusEl.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{
    const img=document.querySelector('#ob-content img[style*="56px"]')
    if(img)img.src=ev.target.result
  }
  reader.readAsDataURL(file)
  if(!obv?.user)return
  const st=document.getElementById('upload-status')
  if(st)st.textContent='Wird hochgeladen…'
  const erg=await profilbildHochladen(file, obv.user.id, obv.data.photoUrl)
  if(!obv)return
  if(erg.fehler){showToast(erg.fehler,4000);if(st)st.textContent='Upload fehlgeschlagen';return}
  obv.data.photoUrl=erg.publicUrl
  if(st)st.textContent='✓ Eigenes Foto hochgeladen'
  // Update badge
  const badge=document.querySelector('#ob-content div[style*="bottom:-2px"]')
  if(badge){badge.style.background='var(--green)';badge.textContent='✓'}
  e.target.value=''
}

window.nextStep=async function(){
  if(!obv)return
  const collect=OB_STEPS[obv.step-1].collect
  if(!collect())return
  if(obv.step<obv.total){obv.step++;renderStep();return}
  await saveAndFinish()
}
window.prevStep=function(){if(obv&&obv.step>1){obv.step--;renderStep()}}

async function saveAndFinish(){
  const btn=document.getElementById('btn-next')
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const d=obv.data
  const{error}=await sb.from('users').update({
    instagram_handle:d.ig||null,
    tiktok_handle:d.tt||null,
    niche_category:d.niche,
    profile_image_url:d.photoUrl||null,
    onboarding_completed:true,
    updated_at:new Date().toISOString()
  }).eq('id',obv.user.id)
  if(!obv||obv.ctx.stale)return
  btn.disabled=false;btn.textContent='Abschließen ✓'
  if(error){showToast('Fehler beim Speichern: '+error.message,4000);return}
  /* Damit der Router-Guard nicht erneut ins Onboarding schickt */
  if(state.profile)state.profile.onboarding_completed=true
  document.getElementById('ob-wrap').classList.add('hidden')
  document.getElementById('success-wrap').classList.remove('hidden')
  confetti()
}

function confetti(){
  const el=document.getElementById('confetti-area')
  const emojis=['🎉','✨','🌟','💫','🎊','🎈']
  let i=0;const iv=setInterval(()=>{
    if(!obv||!document.getElementById('confetti-area')){clearInterval(iv);return}
    el.textContent=emojis[i%emojis.length];i++;if(i>12)clearInterval(iv)
  },200)
  if(obv)obv.confettiTimer=iv
}

        <div class="v-skel v-skel--kachel" style="height:104px"></div>
        <div class="v-skel v-skel--kachel" style="height:104px"></div>
        <div class="v-skel v-skel--kachel" style="height:104px"></div>

    </div>
    <div id="dashboard-content" class="hidden"></div>`

  /* users trägt die Aufruf-Zähler selbst (gepflegt aus biolink_aufrufe /
     mediakit_aufrufe) — dieselbe Quelle, aus der auch die BioLink- und

  /* Verlauf statt Einzelwert: analyse_stats liegt je Kanal mehrfach vor, das

     Messungen -- zwei Plattformen in eine Linie zu addieren wuerde einen

  const reihe = pf => statsRows.filter(r=>r.platform===pf && r.followers!=null)

    ${setup.length?`<div class="section">

/* Verlaufslinie fuer die Hauptkarte.
   Unter drei Messungen wird nichts gezeichnet: zwei Punkte sind immer eine
   Gerade und behaupten einen Trend, den es nicht gibt. Die Flaeche ist
   bewusst nur eine Andeutung -- die Zahl ist die Aussage, die Linie der
   Zusatz. Skaliert wird auf min/max der Reihe, nicht auf Null, sonst
   verschwindet jede Bewegung bei fuenfstelligen Followerzahlen. */
function dashSparkline(werte){
  if(!Array.isArray(werte) || werte.length < 3) return ''
  const W=320, H=68, P=5
  const min=Math.min(...werte), max=Math.max(...werte)
  const spanne = (max-min) || 1
  const x = i => P + i*(W-2*P)/(werte.length-1)
  const y = v => P + (1-(v-min)/spanne)*(H-2*P)
  const punkte = werte.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`)
  const linie  = 'M'+punkte.join(' L')
  const flaeche= linie+` L${x(werte.length-1).toFixed(1)},${H} L${x(0).toFixed(1)},${H} Z`
  const letztX = x(werte.length-1).toFixed(1), letztY = y(werte[werte.length-1]).toFixed(1)
  return `<svg class="dash-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="dash-spark-linie" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="var(--v1)"/><stop offset=".55" stop-color="var(--v2)"/><stop offset="1" stop-color="var(--v3)"/>
      </linearGradient>
      <linearGradient id="dash-spark-flaeche" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--v2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--v2)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${flaeche}" fill="url(#dash-spark-flaeche)"/>
    <path d="${linie}" fill="none" stroke="url(#dash-spark-linie)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${letztX}" cy="${letztY}" r="3.4" fill="var(--v3)"/>
  </svg>`
}

// URL-Normalisierung: akzeptiert Nike.de, www.nike.de, https://Nike.de/ → gibt https://nike.de zurück
function normalizeBrandUrl(raw){
  if(!raw)return null
  let s=raw.trim()
  if(!s)return null
  s=s.replace(/^https?:\/\//i,'')
  s=s.replace(/\/+$/,'')
  s=s.replace(/^www\./i,'')
  const slashIdx=s.indexOf('/')
  if(slashIdx>=0){
    s=s.substring(0,slashIdx).toLowerCase()+s.substring(slashIdx)
  }else{
    s=s.toLowerCase()
  }
  if(!/^[a-z0-9-]+\.[a-z0-9.-]+/i.test(s))return null
  return 'https://'+s
}

function slugify(name){
  return String(name||'').toLowerCase().trim()
    .replace(/[äÄ]/g,'ae').replace(/[öÖ]/g,'oe').replace(/[üÜ]/g,'ue').replace(/[ß]/g,'ss')
    .replace(/[^a-z0-9\s_-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')
}

/* ─── Fortschritts-Overlay ───────────────────────────────────────
   Erstellen, Design-Wechsel und Loeschen laufen ueber eine Edge
   Function, die die erzeugte Seite ins Repo committet. Wenn sie
   antwortet, ist die Seite noch nicht im Netz — Cloudflare Pages baut
   danach noch rund fuenfzehn Sekunden. Deshalb zwei Phasen:

   1. Schrittliste auf einem Timer, solange die Function laeuft. Der
      vorletzte Schritt bleibt aktiv, bis die Antwort da ist.
   2. Danach ZWEI Schluss-Schritte mit Fortschrittsbalken, je 15 Sekunden.
      Erst dann ist alles gruen und das Overlay geht.

   Warum zwei und nicht einer mit 30 Sekunden: mit fuenfzehn Sekunden war
   das Overlay weg, bevor Cloudflare fertig gebaut hatte -- wer danach
   gleich auf seine Seite ging, bekam "Diese Seite gibt es nicht" zu sehen.
   Ein einzelner Balken, der doppelt so lange laeuft, sieht dagegen aus wie
   ein Haenger. Zwei Zeilen zeigen, dass noch etwas passiert.
   ───────────────────────────────────────────────────────────────── */
const LOADING_FLOWS={
  biolinkCreate:{
    title:'BioLink wird erstellt',
    sub:'Das dauert einen Moment — bitte lass die Seite offen.',
    steps:['Angaben werden geprüft','Layout wird gebaut','Design wird angewendet','Inhalte werden eingefügt'],

  mediakitDelete:{
    title:'Media Kit wird gelöscht',
    sub:'Deine Angaben bleiben gespeichert.',
    steps:['Seite wird offline genommen','Verweise werden entfernt'],
    tail:'Änderung wird verteilt',
    tailSub:'Fast geschafft — gleich ist das Media Kit nicht mehr erreichbar.'
  }
}
const LOADING_STEP_MS=6000     // Taktung der Schritte, solange die Function laeuft
const LOADING_HOLD_MS=15000    // Bauzeit von Cloudflare Pages nach der Antwort

let _loadingTimer=null
let _loadingHold=null
let _loadingFlow=null

/* activeIdx zeigt auf den laufenden Schritt; alles davor ist erledigt.
   Der Schluss-Schritt steht am Ende der Liste und bekommt waehrend der
   Wartezeit den Fortschrittsbalken. */
function paintLoadingSteps(activeIdx,withBar){
  const el=document.getElementById('loading-steps')
  if(!el||!_loadingFlow)return
  const all=[..._loadingFlow.steps,_loadingFlow.tail].concat(_loadingFlow.tail2?[_loadingFlow.tail2]:[])
  el.innerHTML=all.map((label,i)=>{
    const state=i<activeIdx?'done':i===activeIdx?'active':'wait'
    const bar=(withBar&&i===activeIdx)
      ? `<div class="v-balken v-balken--duenn"><i class="lade-fuellung" style="animation-duration:${LOADING_HOLD_MS}ms"></i></div>`
      : ''
    const cls={done:'fertig',active:'laeuft',wait:'offen'}[state]
    return `<li class="${cls}"><strong>${escHtml(label)}</strong>${bar}</li>`
  }).join('')
}

function showLoadingOverlay(flowKey='biolinkCreate'){
  const flow=LOADING_FLOWS[flowKey]||LOADING_FLOWS.biolinkCreate
  _loadingFlow=flow
  document.getElementById('loading-title').textContent=flow.title
  document.getElementById('loading-sub').textContent=flow.sub
  paintLoadingSteps(0)
  document.getElementById('loading-overlay').classList.remove('hidden')
  document.body.style.overflow='hidden'

  let i=0
  const lastTimed=flow.steps.length-1
  const t=setInterval(()=>{
    i++
    // Nicht in den Schluss-Schritt laufen — der kommt erst nach der Antwort
    if(i>=lastTimed){ paintLoadingSteps(lastTimed); clearInterval(t); return }
    paintLoadingSteps(i)
  },LOADING_STEP_MS)
  _loadingTimer=t
  return t
}

/* Die Function ist durch: Schluss-Schritt aktivieren und die Bauzeit
   abwarten, bevor "fertig" behauptet wird. */
function finishLoadingOverlay(timer){
  if(timer)clearInterval(timer)
  _loadingTimer=null
  if(!_loadingFlow)return Promise.resolve()
  const tailIdx=_loadingFlow.steps.length
  const sub=document.getElementById('loading-sub')
  paintLoadingSteps(tailIdx,true)
  if(sub)sub.textContent=_loadingFlow.tailSub
  return new Promise(res=>{
    const fertig=()=>{
      _loadingHold=null
      paintLoadingSteps(tailIdx+(_loadingFlow.tail2?2:1))
      setTimeout(()=>{ hideLoadingOverlay(); res() },600)
    }
    _loadingHold=setTimeout(()=>{
      if(!_loadingFlow.tail2)return fertig()
      // Zweite Wartezeit: derselbe Balken, neue Zeile.
      paintLoadingSteps(tailIdx+1,true)
      if(sub)sub.textContent=_loadingFlow.tail2Sub
      _loadingHold=setTimeout(fertig,LOADING_HOLD_MS)
    },LOADING_HOLD_MS)
  })
}

function hideLoadingOverlay(timer){
  if(timer)clearInterval(timer)
  if(_loadingHold){clearTimeout(_loadingHold);_loadingHold=null}
  _loadingTimer=null
  document.getElementById('loading-overlay')?.classList.add('hidden')
  document.body.style.overflow=''
}
function stopLoadingOverlay(){ if(_loadingTimer){clearInterval(_loadingTimer);_loadingTimer=null} hideLoadingOverlay() }

      updateThemeUI()
    }
  }
  ctx.onCleanup(() => {
    window.openSheet = origOpenSheet
    stopLoadingOverlay()
    blv = null
    document.body.style.overflow = ''
  })

  ctx.on(document.getElementById('photo-input'), 'change', onBioPhotoPicked)

async function loadBiolink(){
  const uid = blv.uid
  const[profileRes,biolinkRes,linksRes,viewsDailyRes,herkunftRes,stundenRes,klickRes,rateRes]=await Promise.all([
    sb.from('users').select('display_name,full_name,profile_image_url,bio,bio_active,instagram_handle,tiktok_handle,youtube_handle,threads_handle,impressum_text,contact_email,subscription_type,bio_views_total,bio_views_today,bio_views_last_7_days').eq('id',uid).single(),
    sb.from('biolink_viuno').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('biolink_custom_links').select('*').eq('user_id',uid).order('position',{ascending:true}),
    sb.rpc('get_biolink_views_last_7_days_daily',{p_user_id:uid}),
    /* Herkunft und Stunde liegen seit April in biolink_aufrufe, wurden
       aber nie angezeigt. Klicks kommen aus biolink_klicks. Alle drei
       Funktionen lesen ueber auth.uid(), nicht ueber einen Parameter. */
    sb.rpc('biolink_herkunft',{p_tage:30}),
    sb.rpc('biolink_stunden',{p_tage:30}),
    sb.rpc('biolink_klick_zahlen',{p_tage:30}),
    /* Eigene Funktion, weil die Rate beide Seiten des Bruchs ab demselben
       Moment zaehlen muss: Klicks gibt es erst seit der Neugenerierung,
       Aufrufe seit jeher. Sonst steht dort 30 Tage lang zu wenig. */
    sb.rpc('biolink_klickrate',{p_tage:30})
  ])
  if(!blv||blv.ctx.stale)return
  blv.profile=profileRes.data
  blv.biolink=biolinkRes.data
  blv.customLinks=linksRes.data||[]
  blv.viewsTotal=blv.profile?.bio_views_total||0
  blv.viewsToday=blv.profile?.bio_views_today||0
  blv.views7Days=blv.profile?.bio_views_last_7_days||0
  blv.viewsDaily=viewsDailyRes.data||[]
  blv.herkunft=herkunftRes.data||[]
  blv.stunden=stundenRes.data||[]
  blv.klicks=klickRes.data||[]
  blv.klickrate=rateRes.data?.[0]||null
  blv.theme=blv.biolink?.theme||'color'
  blv.lang=blv.biolink?.default_language||'de'
  paintBiolink()
}

function paintBiolink(){
  const p=blv.profile
  const isActive=p?.bio_active===true
  const slug=slugify(p?.display_name||'')
  const bioUrl=slug?`viuno.de/${slug}`:null
  const bioFullUrl=slug?`https://viuno.de/${slug}`:null

  // Checkliste
  const checks=[
    {label:'Profilbild hochgeladen',ok:!!(p?.profile_image_url)},
    {label:'Impressum hinterlegt',ok:!!(p?.impressum_text?.trim())},
    {label:'Mindestens 1 Social-Kanal',ok:!!(p?.instagram_handle||p?.tiktok_handle||p?.youtube_handle||p?.threads_handle)},
  ]
  const allOk=checks.every(c=>c.ok)

  const viewsToday=blv.viewsToday
  const views7=blv.views7Days
  const viewsTotal=blv.viewsTotal

  // 7 Tage als Saeulen; der beste Tag ist gruen, der heutige voll gedeckt.
  const maxVal=Math.max(...blv.viewsDaily.map(d=>d.view_count||0),1)
  const dayLbl=['So','Mo','Di','Mi','Do','Fr','Sa']
  const chartBars=blv.viewsDaily.map((d,i)=>{
    const v=d.view_count||0
    const h=Math.max((v/maxVal)*100,v>0?8:3)
    const dayShort=dayLbl[new Date(d.view_date+'T00:00:00').getDay()]
    return `<div class="v-saeule${v>0&&v===maxVal?' best':''}${i===blv.viewsDaily.length-1?' heute':''}" title="${v} Aufrufe">
      <b class="v-num">${v}</b><i style="height:${h}%"></i><small>${dayShort}</small>
    </div>`
  }).join('')

  /* ── Auswertungen, 30 Tage ──────────────────────────────────────────
     Herkunft und Stunde lagen seit April ungenutzt in der Tabelle.
     Klicks kommen aus biolink_klicks und beginnen erst mit der Seite,
     die den Zaehler enthaelt — deshalb der Hinweis im leeren Zustand. */
  const ARTLABEL={instagram:'Instagram',tiktok:'TikTok',youtube:'YouTube',threads:'Threads',kontakt:'Kontakt',custom:'Link'}
  const aufrufe30=blv.herkunft.reduce((a,h)=>a+Number(h.anzahl||0),0)
  const klicks30=blv.klicks.reduce((a,k)=>a+Number(k.anzahl||0),0)
  /* Kann ueber 100% liegen: ein Besucher klickt manchmal mehrere Links. */
  const rate=blv.klickrate
  const rateAufrufe=Number(rate?.aufrufe||0)
  const klickrate=rateAufrufe>0?Math.round(Number(rate.klicks||0)/rateAufrufe*100):0
  const rateSeit=rate?.seit?new Date(rate.seit).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):null

  /* Balkenliste: Laenge relativ zum groessten Wert, Zahl rechts absolut,
     der groesste Wert gruen. */
  const zeilenHtml=(zeilen)=>{
    const max=Math.max(...zeilen.map(z=>z.wert),1)
    return `<div class="v-balkenliste">`+zeilen.map(z=>`<div class="v-balkenzeile${z.wert===max?' best':''}">
        <span title="${escHtml(z.text)}">${escHtml(z.text)}</span>
        <div class="v-balken"><i style="width:${Math.round(z.wert/max*100)}%"></i></div>
        <b class="v-num">${fmtNum(z.wert)}</b>
      </div>`).join('')+`</div>`
  }

  const herkunftHtml=aufrufe30>0
    ? zeilenHtml(blv.herkunft.slice(0,6).map(h=>({text:h.quelle,wert:Number(h.anzahl)})))
    : `<div class="bl-leer">Noch keine Aufrufe in den letzten 30 Tagen.</div>`

  /* 24 Stunden als Heatmap, zwei Reihen zu zwoelf. Die staerkste Stunde
     bekommt den gruenen Rand. */
  const maxStd=Math.max(...blv.stunden.map(x=>Number(x.anzahl||0)),1)
  const uhrHtml=blv.stunden.length?`<div class="v-heat">${blv.stunden.map(x=>{
      const v=Number(x.anzahl||0)
      return `<i style="--h:${(v/maxStd).toFixed(2)}"${v>0&&v===maxStd?' class="best"':''} title="${x.stunde} Uhr · ${v} Aufrufe"></i>`}).join('')}</div>
    <div class="v-heat-achse"><span>0 Uhr</span><span>12 Uhr</span><span>23 Uhr</span></div>`:''

  const klickHtml=klicks30>0
    ? zeilenHtml(blv.klicks.slice(0,8).map(k=>({text:k.label||ARTLABEL[k.art]||k.art,wert:Number(k.anzahl)})))
    : `<div class="bl-leer">Noch keine Klicks. Gezählt wird, seit die Seite zuletzt erzeugt wurde.</div>`

  renderBioEditMenu()

  const page=document.getElementById('page-content')

  const statusHtml=isActive
    ?`<div class="section" style="padding-top:var(--s-3)">
        <div class="v-status v-status--aktiv"><i></i><div class="text"><strong>Seite ist live</strong><span>Deine Seite ist öffentlich erreichbar</span></div></div>
        ${bioUrl?`<div class="v-banner" style="margin-top:8px">
          <a class="text" href="${bioFullUrl}" target="_blank" rel="noopener" style="text-decoration:none;font-weight:var(--fw-sb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${bioUrl} ${icon('arrowUpRight',13)}</a>
          <button class="v-btn v-btn--rand v-btn--klein" onclick="copyLink('${bioFullUrl}')">Kopieren</button>
        </div>`:''}
       </div>
       <div class="section">
         <div class="v-karte" style="padding:0">
           <div class="bl-teil">
             <div class="bl-kopf"><span class="bl-titel">Aufrufe</span><span class="bl-meta">letzte 7 Tage</span></div>
             <div class="bl-drei">
               <div><b class="v-num">${fmtNum(viewsToday)}</b><span>Heute</span></div>
               <div><b class="v-num">${fmtNum(views7)}</b><span>7 Tage</span></div>
               <div><b class="v-num">${fmtNum(viewsTotal)}</b><span>Gesamt</span></div>
             </div>
             ${viewsTotal>0?`<div class="v-saeulen" style="margin-top:14px;height:104px">${chartBars}</div>`
               :`<div class="bl-leer" style="margin-top:10px">Noch keine Aufrufe in den letzten 7 Tagen.</div>`}
           </div>
           <div class="bl-teil">
             <div class="bl-kopf"><span class="bl-titel">Darauf klicken deine Besucher</span>
               <span class="bl-meta v-num">30 Tage · ${klickrate} % Klickrate</span></div>
             ${klickHtml}
             ${klicks30>0?`<div class="bl-meta" style="margin-top:8px">Klickrate = Klicks je Aufruf${rateSeit?`, ab ${rateSeit}`:''}.</div>`:''}
           </div>
           <div class="bl-teil">
             <div class="bl-kopf"><span class="bl-titel">Von hier kommen sie</span>
               <span class="bl-meta v-num">30 Tage · ${fmtNum(aufrufe30)}</span></div>
             ${herkunftHtml}
             ${aufrufe30>0?`<div class="bl-meta" style="margin-top:8px">„Direkt“ = ohne erkennbare Quelle.</div>`:''}
           </div>
           <div class="bl-teil">
             <div class="bl-kopf"><span class="bl-titel">Wann sie vorbeikommen</span>
               <span class="bl-meta">Ortszeit der Besucher</span></div>
             ${uhrHtml}
           </div>
         </div>
       </div>`
    :slug?`<div class="section" style="padding-top:var(--s-3)"><div class="v-status v-status--aus"><i></i>
        <div class="text"><strong>Seite ist inaktiv</strong><span>Seite wurde deaktiviert — du kannst sie jederzeit wieder aktivieren</span></div></div></div>`
    :''

  const themeCardsHtml=!isActive?buildThemeCards():''

  const checklistHtml=!allOk?`<div class="section">
    <div class="v-karte">
      <div class="v-check-kopf"><strong>Checkliste</strong><span class="v-num">${checks.filter(c=>c.ok).length} / ${checks.length}</span></div>
      <ul class="v-check">${checks.map(c=>`<li class="${c.ok?'fertig':'offen'}"><i>${c.ok?icon('check',12):''}</i><span>${c.label}</span></li>`).join('')}</ul>
      <div class="v-hint" style="margin-top:12px">Das Impressum ist gesetzlich vorgeschrieben.</div>
    </div>
  </div>`:''

  const termsHtml=!isActive?`<div class="action-stack">
    <button class="v-btn v-btn--rand v-btn--breit" onclick="openBioEditMenu()">${icon('pencil',16)} Bearbeiten</button>
  </div>
  <div class="section">
    <div class="v-karte v-karte--flach" style="padding:12px 14px">
      <label class="v-checkbox" style="align-items:flex-start">
        <input type="checkbox" id="terms-check" style="margin-top:1px"/>
        <span style="font-size:var(--t-sm);color:var(--muted);line-height:1.5">Ich akzeptiere die <a href="/legal#biopage_terms" target="_blank" style="color:var(--text);font-weight:600;text-decoration:underline">Nutzungsbedingungen</a> von viuno.</span>
      </label>
    </div>
  </div>
  <div class="action-stack">
    <button class="v-btn v-btn--premium v-btn--breit" id="btn-generate" onclick="generatePage()" disabled>BioLink erstellen</button>
  </div>`
  :`<div class="action-stack">
    <button class="v-btn v-btn--dunkel v-btn--breit" onclick="openBioEditMenu()">${icon('pencil',16)} Bearbeiten</button>
  </div>`

  const deleteHtml=isActive
    ?`<div class="loesch-zeile">
        <button class="v-btn v-btn--leise" onclick="document.getElementById('delete-modal').classList.remove('hidden')">BioLink-Seite löschen</button>
      </div>`
    :''

  page.innerHTML=`
    ${statusHtml}
    ${themeCardsHtml}
    ${checklistHtml}

/* Name, Bio und Profilbild stehen seit dem Template-Umbau fest im HTML der
   oeffentlichen Seite (fuer Link-Vorschauen in WhatsApp, LinkedIn & Co.).
   Aendert sich eines davon, muss die Seite neu erzeugt werden — im
   Hintergrund, ohne das Vollbild-Overlay von generatePage(). bio_active wird
   frisch gelesen: die Function wuerde eine Seite sonst neu anlegen und
   veroeffentlichen, die der User nie erstellt hat. */
/* Neubau der erzeugten BioLink-Seite.
   Noetig ist er nur fuer die eingebackenen Kopf-Tags (title, description,
   canonical, og:*) — also bei bio, profile_image_url, display_name und Theme.
   Name, Bio, Kanaele und Kontaktadresse liest die Seite zur Laufzeit aus
   biopage_v2; dafuer braucht es keinen Commit.
   Gibt das Ergebnis zurueck, damit das Profil einen sichtbaren Zustand zeigen
   kann statt eines leicht zu uebersehenden Toasts. `leise` unterdrueckt den
   Toast fuer Aufrufer, die selbst berichten. */
async function regenerateBioPageQuietly(uid, opt={}){
  try{
    const{data}=await sb.from('users').select('bio_active').eq('id',uid).single()
    if(data?.bio_active!==true)return {uebersprungen:true}
    const{data:{session}}=await sb.auth.getSession()
    if(!session)return {uebersprungen:true}
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json().catch(()=>({}))
    if(!res.ok||body.success!==true)throw new Error(body.error||`HTTP ${res.status}`)
    /* generate-biolink vergleicht die Bytes und committet nur bei echter
       Aenderung — 'unchanged' heisst: nichts zu melden. */
    return {ok:true, unveraendert: body.commit==='unchanged'}
  }catch(err){
    if(!opt.leise) showToast('Öffentliche Seite nicht aktualisiert: '+err.message,5000)
    return {ok:false, fehler:err.message}
  }
}

window.generatePage=async function(flow='biolinkCreate'){
  const btn=document.getElementById('btn-generate')
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Wird generiert…'}
  const loadingTimer=showLoadingOverlay(flow)
  try{
    const{data:{session}}=await sb.auth.getSession()
    const res=await fetch(`${SUPABASE_URL}/functions/v1/generate-biolink`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'}
    })
    const body=await res.json()
    if(!res.ok||!body.success)throw new Error(body.error||`HTTP ${res.status}`)
    await finishLoadingOverlay(loadingTimer)
    showToast('BioLink veröffentlicht ✓')
    if(blv&&!blv.ctx.stale)await loadBiolink()
  }catch(err){
    hideLoadingOverlay(loadingTimer)
    showToast('Fehler: '+err.message,5000)
    const b=document.getElementById('btn-generate')
    if(b){b.disabled=false;b.textContent=blv?.profile?.bio_active?'Seite neu generieren':'BioLink-Seite erstellen'}
  }
}

async function onBioPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Max. 5 MB');return}
  const status=document.getElementById('photo-status')
  if(status)status.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{const bw=document.getElementById('profile-photo-wrap');if(bw)bw.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
  reader.readAsDataURL(file)
  const uid=blv?blv.uid:state.session.user.id
  const erg=await profilbildHochladen(file, uid, blv?.profile?.profile_image_url)
  if(erg.fehler){showToast(erg.fehler,4000);const sf=document.getElementById('photo-status');if(sf)sf.textContent='Fehler';return}
  const publicUrl=erg.publicUrl
  if(blv?.profile)blv.profile.profile_image_url=publicUrl
  const st=document.getElementById('photo-status')
  if(st)st.textContent='✓ Foto hochgeladen'
  showToast('Profilbild gespeichert ✓')
  e.target.value=''
  regenerateBioPageQuietly(uid)
}

async function loadMediakit(){
  const uid = mkv.uid
  const[profileRes,mkRes,brandsRes,offersRes,analyseRes,viewsDailyRes,preiseRes,beitraegeRes]=await Promise.all([
    sb.from('users').select('display_name,full_name,profile_image_url,bio,instagram_handle,tiktok_handle,youtube_handle,threads_handle,impressum_text,mediakit_active,subscription_type,niche_category,city,contact_email,mediakit_views_total,mediakit_views_today,mediakit_views_last_7_days').eq('id',uid).single(),
    sb.from('mediakit_viuno').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('mediakit_brands').select('*').eq('user_id',uid).order('position',{ascending:true}),
    sb.from('mediakit_content_offers').select('offer_type').eq('user_id',uid),
    sb.from('analyse_stats').select('platform,engagement_rate,followers,avg_likes,avg_views,avg_comments,avg_shares,created_at').eq('user_id',uid).order('created_at',{ascending:true}),
    sb.rpc('get_mediakit_views_last_7_days_daily',{p_user_id:uid}),
    sb.from('mediakit_preise').select('*').eq('user_id',uid),
    sb.from('mediakit_beitraege').select('*').eq('user_id',uid).order('position',{ascending:true})
  ])
  if(!mkv||mkv.ctx.stale)return
  mkv.profile=profileRes.data||{}
  mkv.mkData=mkRes.data||{}
  mkv.brands=brandsRes.data||[]
  mkv.offers=new Set((offersRes.data||[]).map(r=>r.offer_type))
  mkv.preise={}
  for(const r of(preiseRes.data||[])) mkv.preise[r.offer_type]=r
  mkv.beitraege=beitraegeRes.data||[]
  mkv.analyseStats={}
  for(const row of(analyseRes.data||[])) mkv.analyseStats[row.platform]=row
  mkv.viewsTotal=mkv.profile.mediakit_views_total||0
  mkv.viewsToday=mkv.profile.mediakit_views_today||0
  mkv.views7Days=mkv.profile.mediakit_views_last_7_days||0
  mkv.viewsDaily=viewsDailyRes.data||[]
  mkv.isActive=mkv.profile.mediakit_active===true
  /* Im Hintergrund: Vorschaubilder der staerksten Beitraege sichern, solange
     die Plattform-Links noch leben. Blockiert das Zeichnen nicht. */
  mkBilderSichern()
  mkv.slug=mkv.profile.display_name?slugify(mkv.profile.display_name):null
  mkv.defaultLang=mkv.mkData?.default_language||'de'
  paintMediakit()
}

// ── Analyse-Drift-Check: neue Analyse vorhanden & weicht stark von Media Kit ab? ──
function getAnalysisDrift(){
  if(!mkv.isActive)return null
  const mk=mkv.mkData||{}
  const mkUpdated=mk.updated_at?new Date(mk.updated_at).getTime():0
  const flags=[]
  const ig=mkv.analyseStats.instagram
  if(ig&&ig.created_at&&new Date(ig.created_at).getTime()>mkUpdated&&ig.followers!=null&&mk.followers_instagram!=null&&mk.followers_instagram>0){
    if(Math.abs(ig.followers-mk.followers_instagram)/mk.followers_instagram>0.2)flags.push('Instagram')
  }
  const tt=mkv.analyseStats.tiktok
  if(tt&&tt.created_at&&new Date(tt.created_at).getTime()>mkUpdated&&tt.followers!=null&&mk.followers_tiktok!=null&&mk.followers_tiktok>0){
    if(Math.abs(tt.followers-mk.followers_tiktok)/mk.followers_tiktok>0.2)flags.push('TikTok')
  }
  return flags.length?flags.join(' & '):null
}

  document.getElementById('page-content').innerHTML=`

  } else if(id==='contact-sheet'){
    document.getElementById('s-contact-email').value=mkv.profile?.contact_email||''
  } else if(id==='stats-sheet'){
    openStatsSheet();return
  } else if(id==='platforms-sheet'){
    openPlatformsSheet();return
  } else if(id==='konditionen-sheet'){
    const mk=mkv.mkData||{}
    document.getElementById('s-vorlauf').value=mk.vorlauf_tage??''
    document.getElementById('s-rechte').value=mk.nutzungsrechte||''
    document.getElementById('s-exkl').value=mk.exklusivitaet||''
    document.getElementById('s-freigabe').value=mk.freigabe_schleifen??''
  } else if(id==='audience-sheet'){
    openAudienceSheet();return
  } else if(id==='offers-sheet'){
    renderOffers()
    mkRenderPreise()
    const uEl=document.getElementById('s-ustg')
    if(uEl)uEl.value=(mkv.mkData||{}).preis_hinweis||''
  } else if(id==='brands-sheet'){
    renderBrandsList()
  } else if(id==='impressum-sheet'){
    document.getElementById('s-impressum').value=mkv.profile?.impressum_text||''
  } else if(id==='language-sheet'){
    // Aktuell gespeicherte Sprache als Auswahl markieren
    document.querySelectorAll('#language-sheet .lang-opt').forEach(b=>
      b.classList.toggle('aktiv',b.dataset.lang===mkv.defaultLang))
  }
  openSheet(id)
}

async function onMkPhotoPicked(e){
  const file=e.target.files?.[0];if(!file)return
  if(file.size>5*1024*1024){showToast('Max. 5 MB');return}
  const status=document.getElementById('photo-status')
  if(status)status.textContent='Wird hochgeladen…'
  const reader=new FileReader()
  reader.onload=ev=>{const bw=document.getElementById('profile-photo-wrap');if(bw)bw.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
  reader.readAsDataURL(file)
  const uid=mkv?mkv.uid:state.session.user.id
  const erg=await profilbildHochladen(file, uid, mkv?.profile?.profile_image_url)
  if(erg.fehler){showToast(erg.fehler,4000);const sf=document.getElementById('photo-status');if(sf)sf.textContent='Fehler';return}
  const publicUrl=erg.publicUrl
  if(mkv?.profile)mkv.profile.profile_image_url=publicUrl
  const st=document.getElementById('photo-status')
  if(st)st.textContent='✓ Foto hochgeladen'
  showToast('Profilbild gespeichert ✓')
  e.target.value=''
  regenerateBioPageQuietly(uid)
}

/* #10: Vier Kaesten mit Altersspannen und ohne Bezug sagten nicht, was
   einzutragen ist. Jetzt steht die Frage als Ueberschrift da, jedes Feld
   traegt sein Prozentzeichen, und die laufende Summe sagt, ob die Angaben
   zusammenpassen -- ohne zu blockieren: eine Marke kann auch mit 90 %
   etwas anfangen, aber nicht mit 300 %. */
window.mkAnteileSumme=function(){
  const zahl = id => { const v=parseInt(document.getElementById(id)?.value); return isNaN(v)?0:v }
  const zeige = (zielId, summe, leer) => {
    const el=document.getElementById(zielId); if(!el)return
    if(leer){ el.textContent=''; el.className='sheet-hint'; return }
    const passt = summe>=95 && summe<=105
    el.textContent = `Zusammen ${summe} %` + (passt?'':' — sollte etwa 100 % ergeben')
    el.className = 'sheet-hint' + (passt?'':' err')
  }
  const g=['s-female','s-male']
  const a=['s-alter1','s-alter2','s-alter3','s-alter4']
  zeige('mk-geschlecht-summe', g.reduce((x,id)=>x+zahl(id),0), g.every(id=>!document.getElementById(id)?.value))
  zeige('mk-alter-summe',      a.reduce((x,id)=>x+zahl(id),0), a.every(id=>!document.getElementById(id)?.value))
}

window.doAutofill=function(){
  const ig=mkv.analyseStats.instagram,tt=mkv.analyseStats.tiktok
  if(ig){
    if(ig.engagement_rate!=null)document.getElementById('s-ig-er').value=(+parseFloat(ig.engagement_rate).toFixed(2))
    if(ig.avg_likes!=null)document.getElementById('s-ig-likes').value=Math.round(ig.avg_likes)
    if(ig.followers!=null)document.getElementById('s-ig-followers').value=ig.followers
    mkv.autofill=mkv.autofill||{}
    mkv.autofill.instagram={stichtag:ig.created_at||null,
      avg_comments:ig.avg_comments!=null?Math.round(ig.avg_comments):null,
      avg_views:ig.avg_views!=null?Math.round(ig.avg_views):null}
  }
  if(tt){
    if(tt.engagement_rate!=null)document.getElementById('s-tt-er').value=(+parseFloat(tt.engagement_rate).toFixed(2))
    if(tt.avg_views!=null)document.getElementById('s-tt-views').value=Math.round(tt.avg_views)
    if(tt.followers!=null)document.getElementById('s-tt-followers').value=tt.followers
    mkv.autofill=mkv.autofill||{}
    mkv.autofill.tiktok={stichtag:tt.created_at||null,
      avg_comments:tt.avg_comments!=null?Math.round(tt.avg_comments):null,
      avg_shares:tt.avg_shares!=null?Math.round(tt.avg_shares):null}
  }
  showToast('Gemessene Werte übernommen ✓')
}
window.saveStats=async function(){
  if(!mkv)return
  const btn=event.target;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const igH=document.getElementById('s-ig-handle').value.trim().replace(/^@/,'')
  const ttH=document.getElementById('s-tt-handle').value.trim().replace(/^@/,'')
  const userPatch={
    instagram_handle:igH?'@'+igH:null,
    tiktok_handle:ttH?'@'+ttH:null,
    updated_at:new Date().toISOString()
  }
  const mkPatch={
    user_id:mkv.uid,
    er_instagram:parseFloat(document.getElementById('s-ig-er').value)||null,
    avg_likes_instagram:parseInt(document.getElementById('s-ig-likes').value)||null,
    /* #15: Kommentare, Reichweite und Shares kamen bisher ausschliesslich aus
       einer Analyse. Wer fuer einen Kanal keine hat -- etwa weil nur Instagram
       analysiert wurde --, dem fehlten im fertigen Kit genau diese Zeilen,
       waehrend sie beim anderen Kanal standen. Jetzt von Hand nachtragbar. */
    avg_comments_instagram:parseInt(document.getElementById('s-ig-comments').value)||null,
    avg_views_instagram:parseInt(document.getElementById('s-ig-views').value)||null,
    followers_instagram:parseInt(document.getElementById('s-ig-followers').value)||null,
    er_tiktok:parseFloat(document.getElementById('s-tt-er').value)||null,
    avg_views_tiktok:parseInt(document.getElementById('s-tt-views').value)||null,
    avg_comments_tiktok:parseInt(document.getElementById('s-tt-comments').value)||null,
    avg_shares_tiktok:parseInt(document.getElementById('s-tt-shares').value)||null,
    followers_tiktok:parseInt(document.getElementById('s-tt-followers').value)||null,
    updated_at:new Date().toISOString()
  }
  /* Nur was per Autofill kam, bekommt einen Stichtag. Ohne Autofill bleibt er
     leer, und das Kit zeigt den Block als Eigenangabe -- genau so soll es sein.
     Das ist der Unterschied zu jedem Canva-Kit, in dem jede Zahl behauptet ist. */
  const af=mkv.autofill||{}
  if(af.instagram){
    mkPatch.gemessen_am_instagram=af.instagram.stichtag
    mkPatch.avg_comments_instagram=af.instagram.avg_comments
    mkPatch.avg_views_instagram=af.instagram.avg_views
  }
  if(af.tiktok){
    mkPatch.gemessen_am_tiktok=af.tiktok.stichtag
    mkPatch.avg_comments_tiktok=af.tiktok.avg_comments
    mkPatch.avg_shares_tiktok=af.tiktok.avg_shares
  }
  const[r1,r2]=await Promise.all([
    sb.from('users').update(userPatch).eq('id',mkv.uid),
    sb.from('mediakit_viuno').upsert(mkPatch,{onConflict:'user_id'})
  ])
  if(!mkv)return
  btn.disabled=false;btn.textContent='Speichern'
  if(r1.error||r2.error){showToast('Fehler beim Speichern',4000);return}
  Object.assign(mkv.profile,userPatch)
  mkv.mkData=Object.assign(mkv.mkData||{},mkPatch)
  showToast('Kennzahlen gespeichert ✓')
  paintMediakit()
  backToEditMenu('stats-sheet')
}

  tiktok_post:'TikTok Video',story_package:'Story-Paket'}

   fuer etwas, das man gar nicht anbietet, waere nur Verwirrung. */
function mkRenderPreise(){
  const el=document.getElementById('mk-preis-liste')
  if(!el||!mkv)return
  const gewaehlt=[...mkv.offers]
  if(!gewaehlt.length){
    el.innerHTML='<div class="empty-links">Wähle oben erst ein Angebot aus.</div>'

  }
  el.innerHTML=gewaehlt.map(t=>{
    const pr=mkv.preise[t]||{}
    return `<div class="mk-preis-zeile">
      <div class="mk-preis-name">${escHtml(MK_ANGEBOT_LABEL[t]||t)}</div>
      <div class="mk-preis-felder">
        <div class="sheet-input-wrap"><input type="number" class="sheet-prefix-input" id="pr-von-${t}" min="0" step="10" inputmode="numeric" placeholder="ab" value="${pr.preis_von??''}" onchange="mkSavePreis('${t}')"/><span class="sheet-suffix">€</span></div>
        <div class="sheet-input-wrap"><input type="number" class="sheet-prefix-input" id="pr-bis-${t}" min="0" step="10" inputmode="numeric" placeholder="bis" value="${pr.preis_bis??''}" onchange="mkSavePreis('${t}')"/><span class="sheet-suffix">€</span></div>

  }).join('')

   Analyse ab. Laeuft im Hintergrund; schlaegt es fehl, fehlen nur die Bilder,
   nicht das Kit. */
async function mkBilderSichern(){
  if(!mkv)return
  try{
    const{data:{session}}=await sb.auth.getSession()
    if(!session)return
    const res=await fetch(SUPABASE_URL+'/functions/v1/mediakit-bilder',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
      body:'{}'
    })
    const d=await res.json()
    if(!mkv||!d.success)return
    if(d.gesichert>0){
      const{data}=await sb.from('mediakit_beitraege').select('*').eq('user_id',mkv.uid).order('position',{ascending:true})
      if(mkv)mkv.beitraege=data||[]
    }
  }catch(_){/* Bilder sind Beiwerk, kein Grund die View zu kippen */}
}

// ── Brands ──
function renderBrandsList(){
  const list=document.getElementById('brands-list')
  if(!list)return
  if(mkv.brands.length===0){
    list.innerHTML='<div class="empty-links">Noch keine Marken eingetragen</div>'
  }else{
    list.innerHTML=mkv.brands.map(b=>`
      <div class="v-zeile v-zeile--karte">
        <div class="text"><strong>${escHtml(b.name)}</strong>${b.url?`<span>${escHtml(b.url)}</span>`:''}</div>
        <button class="v-ibtn v-ibtn--rund v-ibtn--klein" onclick="deleteBrand('${escHtml(b.id)}')" aria-label="Marke löschen">${icon('x',15)}</button>
      </div>`).join('')
  }
  const addBtn=document.getElementById('btn-add-brand')
  if(addBtn)addBtn.style.display=mkv.brands.length>=10?'none':'flex'
}
window.openAddBrand=function(){
  document.getElementById('brand-name').value=''
  document.getElementById('brand-url').value=''
  document.getElementById('brand-hint').textContent=''
  openSheet('add-brand-sheet')
  setTimeout(()=>document.getElementById('brand-name')?.focus(),50)
}
window.confirmAddBrand=async function(){
  if(!mkv)return
  const name=document.getElementById('brand-name').value.trim()
  const urlRaw=document.getElementById('brand-url').value.trim()
  const hint=document.getElementById('brand-hint')
  if(!name){hint.textContent='Name ist Pflichtfeld';return}
  if(mkv.brands.length>=10){hint.textContent='Maximal 10 Marken';return}
  hint.textContent=''
  let url=null
  if(urlRaw){
    url=normalizeBrandUrl(urlRaw)
    if(!url){hint.textContent='Ungültige URL. Beispiel: nike.de';return}
  }
  const{data,error}=await sb.from('mediakit_brands').insert({
    user_id:mkv.uid,name,url,position:mkv.brands.length
  }).select().single()
  if(!mkv)return
  if(error){hint.textContent='Fehler: '+error.message;return}
  mkv.brands.push(data)
  closeSheet('add-brand-sheet')
  renderBrandsList()
  showToast('Brand hinzugefügt ✓')
}
window.deleteBrand=async function(id){
  if(!mkv)return
  await sb.from('mediakit_brands').delete().eq('id',id).eq('user_id',mkv.uid)
  if(!mkv)return
  mkv.brands=mkv.brands.filter(b=>b.id!==id)
  renderBrandsList()
  showToast('Brand entfernt')
}

// ── Save Impressum ──
window.mkSaveImpressum=async function(){
  if(!mkv)return
  const text=document.getElementById('s-impressum').value.trim()||null
  const btn=event.target;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const{error}=await sb.from('users').update({impressum_text:text,updated_at:new Date().toISOString()}).eq('id',mkv.uid)
  if(!mkv)return
  btn.disabled=false;btn.textContent='Speichern'
  if(error){showToast('Fehler: '+error.message,4000);return}
  mkv.profile.impressum_text=text
  showToast('Impressum gespeichert ✓')
  paintMediakit()
  backToEditMenu('impressum-sheet')
}

// ── Sprach-Auswahl ──
window.mkSelectLang=function(l){
  if(!mkv)return
  mkv.defaultLang=l
  document.querySelectorAll('#language-sheet .lang-opt').forEach(b=>
    b.classList.toggle('aktiv',b.dataset.lang===l))
}
window.saveLanguage=async function(){
  if(!mkv)return
  const btn=event.target;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'
  const patch={
    user_id:mkv.uid,
    default_language:mkv.defaultLang,
    updated_at:new Date().toISOString()
  }
  const{error}=await sb.from('mediakit_viuno').upsert(patch,{onConflict:'user_id'})
  if(!mkv)return
  btn.disabled=false;btn.textContent='Speichern'
  if(error){showToast('Fehler: '+error.message,4000);return}
  mkv.mkData=Object.assign(mkv.mkData||{},patch)
  showToast('Sprache gespeichert ✓')
  paintMediakit()
  backToEditMenu('language-sheet')
}

/* aus /analytics/: Datum ohne Uhrzeit */
function fmtDateDMY(d){if(!d)return'–';return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
/* Schloss und Pfeil-Kreis gibt es nicht in ICONS -- sie stammen aus den alten
   Inline-Buttons und werden hier unveraendert weiterverwendet. */
const SVG_LOCK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
const SVG_REFRESH='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>'

/* B5: Der Vergleich laeuft gegen die letzte Analyse, nicht gegen eine Woche.
   Datumsformat kommt aus dem vorhandenen fmtDateShort (oben, aus /dashboard/).
   Zwischen zwei Laeufen lagen real 1, 23 und 109 Tage. */
function deltaSeitLabel(prevRow){
  const d=prevRow?.created_at
  return d?`seit letzter Analyse (${fmtDateShort(d)})`:'seit letzter Analyse'
}

/* View-lokaler Zustand, entspricht dem `S` der alten Seite */
let anv = null

async function renderAnalytics(area, ctx){

  area.innerHTML = `
