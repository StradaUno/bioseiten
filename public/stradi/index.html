<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><title>viuno</title><meta name="description" content="" /><meta name="theme-color" content="#0D1B2A" /><meta property="og:type" content="website" /><meta property="og:title" content="viuno" /><meta property="og:description" content="" /><meta property="og:image" content="" /><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3Ev%3C/text%3E%3C/svg%3E" /><style>:root{--bg:#0D1B2A;--surface:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.10);--border-strong:rgba(255,255,255,0.18);--text:#E8F0FE;--text-muted:rgba(232,240,254,0.70);--text-subtle:rgba(232,240,254,0.45);--text-faint:rgba(232,240,254,0.25);--primary:rgba(91,138,245,0.30);--primary-hover:rgba(91,138,245,0.45);--primary-text:#E8F0FE;--radius-btn:12px;--radius-img:14px}*{box-sizing:border-box;margin:0;padding:0}html,body{background:#0D1B2A;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:64px 20px 0}main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;flex:1}.page-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0D1B2A;z-index:9999;transition:opacity .25s ease}.page-loader.hide{opacity:0;pointer-events:none}.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:rgba(91,138,245,0.6);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.header{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}.avatar{width:96px;height:96px;border-radius:50%;background:rgba(91,138,245,0.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(91,138,245,0.30);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:500;color:var(--text);margin-bottom:16px;overflow:hidden;box-shadow:0 0 0 3px rgba(91,138,245,0.08),0 0 0 4.5px rgba(91,138,245,0.20)}.avatar img{width:100%;height:100%;object-fit:cover;display:block}h1{font-size:18px;font-weight:600;color:var(--text);margin-bottom:4px;letter-spacing:-0.01em;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}.verified{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#7BA7F7;background:rgba(91,138,245,0.15);border:1px solid rgba(91,138,245,0.30);border-radius:20px;padding:2px 8px;letter-spacing:.02em}.tags{display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap;justify-content:center}.tags:empty{display:none}.tag{font-size:11px;color:var(--text-subtle);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px}.bio{font-size:14px;color:var(--text-muted);line-height:1.55;margin-bottom:28px;max-width:320px;white-space:pre-line}.bio:empty{display:none}.links{width:100%;display:flex;flex-direction:column;gap:10px}.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 20px;border-radius:var(--radius-btn);font-size:15px;font-weight:500;text-decoration:none;transition:transform .12s ease,background .15s ease,border-color .15s ease;-webkit-tap-highlight-color:transparent;width:100%;font-family:inherit;cursor:pointer;flex-direction:column;gap:2px}.btn:active{transform:scale(.98)}.btn-row{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}.btn-ad-label{font-size:10px;font-weight:500;color:var(--text-faint);letter-spacing:.04em;text-transform:uppercase}.btn-primary .btn-ad-label{color:rgba(255,255,255,0.45)}.btn-primary{background:#3D6FD4;color:#FFFFFF;border:1px solid #3D6FD4;font-weight:600}.btn-primary:hover{background:#4A7FE4;border-color:#4A7FE4}.btn-secondary{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.btn-secondary:hover{background:rgba(255,255,255,0.12);border-color:var(--border-strong)}.btn svg{flex-shrink:0}.btn.hidden{display:none}.divider{width:100%;text-align:center;color:var(--text-faint);font-size:16px;letter-spacing:6px;padding:36px 0 32px;user-select:none}footer{width:100%;padding:0 20px 24px;font-size:11px;color:var(--text-faint);letter-spacing:.02em;text-align:center}footer a{color:var(--text-subtle);text-decoration:none;transition:color .15s ease}footer a:hover{color:var(--text-muted)}.imprint-link{background:none;border:none;color:var(--text-subtle);font-family:inherit;font-size:11px;letter-spacing:.02em;cursor:pointer;padding:4px 8px;transition:color .15s ease}.imprint-link:hover{color:var(--text-muted)}.imp-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:999;opacity:0;pointer-events:none;transition:opacity .25s ease}.imp-backdrop.open{opacity:1;pointer-events:auto}.imp-sheet{position:fixed;left:0;right:0;bottom:0;max-height:85dvh;background:#0D1B2A;border-top:1px solid rgba(255,255,255,0.10);border-radius:20px 20px 0 0;z-index:1000;transform:translateY(100%);transition:transform .3s cubic-bezier(0.2,0.8,0.2,1),visibility 0s linear .3s;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,0.7);visibility:hidden}.imp-sheet.open{transform:translateY(0);visibility:visible;transition:transform .3s cubic-bezier(0.2,0.8,0.2,1),visibility 0s linear 0s}.imp-handle{width:36px;height:4px;background:var(--border-strong);border-radius:999px;margin:10px auto 6px;flex-shrink:0}.imp-header{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0}.imp-title{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.01em}.imp-close{background:transparent;border:1px solid var(--border);color:var(--text-muted);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;line-height:1;padding:0;font-family:inherit;transition:background .15s ease,border-color .15s ease}.imp-close:hover{background:var(--bg);border-color:var(--border-strong)}.imp-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px 32px;font-size:13px;line-height:1.65;color:var(--text-muted);white-space:pre-line}.imp-empty{color:var(--text-faint);font-style:italic;text-align:center;padding:40px 20px}body.imp-open{overflow:hidden}@media (min-width:540px){.imp-sheet{left:50%;transform:translate(-50%,100%);max-width:480px;border-radius:20px;bottom:5dvh}.imp-sheet.open{transform:translate(-50%,0)}}.lang-switch{display:inline-flex;align-items:center;gap:2px;margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px}.lang-btn{background:transparent;border:none;color:var(--text-subtle);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px;cursor:pointer;font-family:inherit;transition:all .15s ease}.lang-btn:hover{color:var(--text)}.lang-btn.active{background:rgba(91,138,245,0.30);color:var(--primary-text);font-weight:600}@media (max-width:380px){body{padding:28px 16px 40px}h1{font-size:17px}.btn{padding:14px 18px;font-size:14px}}@media (min-width:540px){body{justify-content:center;padding:48px 20px}main{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.10);border-radius:28px;padding:56px 32px 24px;box-shadow:0 8px 40px rgba(0,0,0,0.50)}.avatar{box-shadow:0 0 0 4px rgba(91,138,245,0.06),0 0 0 5.5px rgba(91,138,245,0.18)}footer{max-width:420px;padding-top:20px}}@media (min-width:900px){body{padding:64px 40px}}</style></head><body><div class="page-loader" id="page-loader"><div class="spinner"></div></div><main id="main" style="visibility:hidden;"><section class="header"><div class="avatar" id="avatar"><img id="avatar-img" src="" alt="" style="display:none;" /></div><h1><span id="display-name"></span><span class="verified" id="verified" style="display:none;"><svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="verified">Verified</span></span></h1><div class="tags" id="tags"></div><p class="bio" id="bio"></p></section><nav class="links" id="links" aria-label="Links"></nav><div class="divider" aria-hidden="true">&mdash;</div></main><footer id="footer" style="visibility:hidden;"><span data-i18n="powered_by">powered by</span> <a href="https://viuno.de" target="_blank" rel="noopener">viuno</a><div style="margin-top:4px;"><button type="button" class="imprint-link" id="btn-imprint" data-i18n="imprint">Impressum</button></div><div class="lang-switch" role="group" aria-label="Sprache"><button class="lang-btn" data-lang="de" type="button">DE</button><button class="lang-btn" data-lang="en" type="button">EN</button><button class="lang-btn" data-lang="it" type="button">IT</button></div></footer><div class="imp-backdrop" id="imp-backdrop"></div><div class="imp-sheet" id="imp-sheet" role="dialog" aria-modal="true"><div class="imp-handle"></div><div class="imp-header"><span class="imp-title" data-i18n="imprint">Impressum</span><button type="button" class="imp-close" id="imp-close">&times;</button></div><div class="imp-content" id="imp-content"></div></div><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const SUPABASE_URL = 'https://bzejndghppuipnedasuv.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6ZWpuZGdocHB1aXBuZWRhc3V2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTMxOTcsImV4cCI6MjA4OTIyOTE5N30.TShH1cIABQCtKgLkhCS9ymUJ36ZUYnlvCnGTok6EKTo'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } })
const STRINGS = {
  de: { mail_subject:'Kooperationsanfrage', inquiry_btn:'Anfragen', verified:'Verified', powered_by:'powered by', imprint:'Impressum', imprint_empty:'Es wurde noch kein Impressum hinterlegt.', ad_label:'Werbung' },
  en: { mail_subject:'Collaboration enquiry', inquiry_btn:'Request', verified:'Verified', powered_by:'powered by', imprint:'Imprint', imprint_empty:'No imprint provided yet.', ad_label:'Ad' },
  it: { mail_subject:'Proposta di collaborazione', inquiry_btn:'Scrivimi', verified:'Verified', powered_by:'powered by', imprint:'Impressum', imprint_empty:'Nessun impressum disponibile.', ad_label:'Pubblicita' }
}
let currentLang='de', creatorData=null, customLinks=[]
function t(key,...args){const v=STRINGS[currentLang]?.[key]; if(typeof v==='function') return v(...args); return v ?? key}
function applyLanguage(lang){
  if(!STRINGS[lang]) lang='de'
  currentLang=lang
  document.documentElement.lang=lang
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=t(el.dataset.i18n); if(typeof v==='string') el.textContent=v})
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{const v=t(el.dataset.i18nPlaceholder); if(typeof v==='string') el.placeholder=v})
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang))
  renderLinks()
}
function getSlugFromPath(){const p=window.location.pathname.replace(/^[/]+|[/]+$/g,''); return p?p.split('/')[0]:null}
async function loadBioPage(){
  const slug=getSlugFromPath()
  if(!slug){window.location.replace('https://viuno.de'); return}
  const {data,error}=await supabase.from('biopage_v2').select('*').ilike('display_name',slug).maybeSingle()
  if(error||!data){window.location.replace('https://viuno.de'); return}
  creatorData=data
  const {data:links}=await supabase.from('biolink_links_public').select('*').eq('user_id',data.user_id).order('position',{ascending:true})
  customLinks=links??[]
  renderHeader(data); renderLinks()
  try{const referrer=document.referrer||'direct'; const hour=new Date().getHours()
    fetch(SUPABASE_URL+'/functions/v1/track-biolink-view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:data.user_id,referrer_source:referrer,hour_of_day:hour,language:currentLang})}).catch(()=>{})}
  catch(_){}
  const lang=['de','en','it'].includes(data.default_language)?data.default_language:'de'
  applyLanguage(lang)
  document.getElementById('main').style.visibility='visible'
  document.getElementById('footer').style.visibility='visible'
  const ld=document.getElementById('page-loader'); ld.classList.add('hide'); setTimeout(()=>ld.remove(),250)
}
function renderHeader(u){
  document.title=u.display_name+' - viuno'
  const desc=u.bio||(u.display_name+' - viuno')
  document.querySelector('meta[name="description"]')?.setAttribute('content',desc)
  document.querySelector('meta[property="og:title"]')?.setAttribute('content',u.display_name+' - viuno')
  document.querySelector('meta[property="og:description"]')?.setAttribute('content',desc)
  if(u.profile_image_url) document.querySelector('meta[property="og:image"]')?.setAttribute('content',u.profile_image_url)
  const av=document.getElementById('avatar'), avi=document.getElementById('avatar-img')
  if(u.profile_image_url){avi.src=u.profile_image_url; avi.alt=u.display_name||''; avi.style.display='block'; avi.onerror=()=>{avi.style.display='none'; av.textContent=(u.display_name||'?')[0].toUpperCase()}}
  else{av.textContent=(u.display_name||'?')[0].toUpperCase()}
  document.getElementById('display-name').textContent=u.display_name||''
  if(u.is_verified) document.getElementById('verified').style.display='inline-flex'
  const tg=document.getElementById('tags'); tg.innerHTML=''
  if(u.niche_category){const s=document.createElement('span'); s.className='tag'; s.textContent=u.niche_category.charAt(0).toUpperCase()+u.niche_category.slice(1); tg.appendChild(s)}
  if(u.city){const s=document.createElement('span'); s.className='tag'; s.textContent=u.city; tg.appendChild(s)}
  if(u.bio) document.getElementById('bio').textContent=u.bio
}
function renderLinks(){
  const c=document.getElementById('links'); c.innerHTML=''
  const u=creatorData; if(!u) return
  const ig='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>'
  const tt='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>'
  const yt='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.5a3 3 0 0 0-2.1-2.1C19.5 4 12 4 12 4s-7.5 0-9.4.4A3 3 0 0 0 .5 6.5C0 8.4 0 12 0 12s0 3.6.5 5.5a3 3 0 0 0 2.1 2.1C4.5 20 12 20 12 20s7.5 0 9.4-.4a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.5.5-5.5s0-3.6-.5-5.5zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg>'
  const th='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg>'
  const lk='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>'
  if(u.instagram_handle) c.appendChild(makeBtn({href:'https://instagram.com/'+encodeURIComponent(u.instagram_handle.replace(/^@/,'')), label:'Instagram', icon:ig}))
  if(u.tiktok_handle) c.appendChild(makeBtn({href:'https://tiktok.com/@'+encodeURIComponent(u.tiktok_handle.replace(/^@/,'')), label:'TikTok', icon:tt}))
  if(u.youtube_handle) c.appendChild(makeBtn({href:'https://youtube.com/@'+encodeURIComponent(u.youtube_handle.replace(/^@/,'')), label:'YouTube', icon:yt}))
  if(u.threads_handle) c.appendChild(makeBtn({href:'https://threads.net/@'+encodeURIComponent(u.threads_handle.replace(/^@/,'')), label:'Threads', icon:th}))
  for(const link of customLinks) c.appendChild(makeBtn({href:normalizeUrl(link.url), label:link.title, icon:lk, adLabel:link.is_paid?t('ad_label'):null}))
  /* Kontakt-Button: direkter mailto:-Link auf die im BioLink hinterlegte
     Adresse. Ist keine hinterlegt, erscheint der Button gar nicht. */
  const kontaktMail=(creatorData?.contact_email||'').trim()
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(kontaktMail)){
    const inq=document.createElement('a')
    inq.className='btn btn-primary'; inq.id='btn-inquiry'
    inq.href='mailto:'+kontaktMail+'?subject='+encodeURIComponent(t('mail_subject'))
    inq.innerHTML='<div class="btn-row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><span>'+t('inquiry_btn')+'</span></div>'
    c.appendChild(inq)
  }
}
function makeBtn(o){const a=document.createElement('a'); a.className='btn btn-secondary'; a.href=o.href; a.target='_blank'; a.rel='noopener'; let h='<div class="btn-row">'+o.icon+'<span>'+escapeHtml(o.label)+'</span></div>'; if(o.adLabel) h+='<span class="btn-ad-label">'+escapeHtml(o.adLabel)+'</span>'; a.innerHTML=h; return a}
function escapeHtml(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function normalizeUrl(u){return u?(u.startsWith('http')?u:'https://'+u):'#'}
const impSheet=document.getElementById('imp-sheet'), impBackdrop=document.getElementById('imp-backdrop'), impContent=document.getElementById('imp-content')
function openImprint(){const text=(creatorData?.impressum_text||'').trim(); if(text){impContent.textContent=text; impContent.classList.remove('imp-empty')}else{impContent.textContent=t('imprint_empty'); impContent.classList.add('imp-empty')} impSheet.classList.add('open'); impBackdrop.classList.add('open'); document.body.classList.add('imp-open')}
function closeImprint(){impSheet.classList.remove('open'); impBackdrop.classList.remove('open'); document.body.classList.remove('imp-open')}
document.getElementById('btn-imprint').addEventListener('click', openImprint)
document.getElementById('imp-close').addEventListener('click', closeImprint)
impBackdrop.addEventListener('click', closeImprint)
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'&&impSheet.classList.contains('open')) closeImprint()
})
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>applyLanguage(b.dataset.lang)))
loadBioPage()
</script></body></html>
